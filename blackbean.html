<h1>黑豆任務・雜糧・下營黑豆</h1>
<p>跟著<b>下營區農會</b>的阿伯認識下營三寶之一的<b>黑豆</b>：用燈光分出<b>青仁</b>和<b>黃仁</b>、讓田淹水趕走害蟲、田乾了才灌水、葉子掉光才開<b>收穫機</b>、曬乾裝進兩層袋子，再把<b>甕</b>搬到太陽下曬<b>黑豆蔭油</b>。</p>
<p>地點：下營（臺南市下營區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>下營有三寶：蠶桑、黑豆、白鵝。下營區農會把一間空了 30 年的穀倉，改成產業文化展示館，介紹這三寶。下營的黑豆，大多拿來做黑豆蔭油，就是用黑豆釀的醬油。跟著農會的阿伯，從認識黑豆、種黑豆、收黑豆，一直做到曬蔭油。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・展示館：青仁和黃仁</h3><p>黑豆，就是種皮黑色的大豆。把黑皮剝開，裡面的仁（叫子葉）有兩種顏色：青仁是綠的，黃仁是黃的。青仁黑豆適合做黑豆茶、黑豆粉；黃仁黑豆適合做蔭油、豆豉、味噌。</p><p>為什麼？下營種的是哪一種？ 下營種的是台南 5 號，是台南區農業改良場培育的黃仁黑豆，豆子大、蛋白質多，很適合做蔭油。</p></li>
<li><h3>第 2 關・田：先讓田淹水</h3><p>秋天 8 月中到 10 月中，是種黑豆的時候。阿伯說：整地以前，要先讓田淹水兩天。土裡躲著一些會吃豆子的害蟲，田淹了水，牠們就待不下去了。</p><p>為什麼？淹水以後，怎麼種黑豆？ 水放掉、整好地，就做成一條一條的畦（長長的、高起來的土堆），每一畦種兩行黑豆。</p></li>
<li><h3>第 3 關・灌溉：乾了才灌水</h3><p>黑豆種下去，大約 3 個月就能收。秋天雨不多，田太乾的時候，阿伯就打開水門灌溉。可是黑豆也怕水太多，所以不是天天灌，而是看到田乾了才灌。乾旱的時候，大約在種下以後第 20、40、55、70 天各灌一次。</p><p>為什麼？為什麼不能天天灌水？ 黑豆是大豆的一種，大豆怕水太多。土一直太濕，黑豆長得慢，收成也會受影響。所以要看到田乾了才灌。</p></li>
<li><h3>第 4 關・收成：葉子掉光才收</h3><p>黑豆熟了，葉子會變黃、掉光，豆莢變成褐色，裡面的豆子又乾又硬。這時候才能收。收黑豆用豆類聯合收穫機：開過去一次，就把豆株割下來、把豆子從莢裡打出來、再把碎葉和莢殼篩掉。</p><p>為什麼？為什麼要等葉子掉光？ 葉子掉光、豆莢乾了，豆子才熟透、變硬。太早收，豆子還軟軟濕濕的，也比較難從莢裡打出來。</p></li>
<li><h3>第 5 關・曬豆：曬乾再裝兩層袋</h3><p>剛收的黑豆，裡面還有一些水。要攤開在太陽下曬 2 到 3 天，讓含水量降到 9 到 12（每 100 份重量裡，水只占 9 到 12 份）。曬好了，裝進兩層袋子：裡面一層是PE 塑膠袋，外面一層是塑膠編織袋，再放在涼涼、乾乾的房間裡。</p><p>為什麼？為什麼要曬乾再裝？ 豆子裡的水太多，裝在袋子裡放久了，容易壞掉。曬乾一點，放在涼涼乾乾的地方，才放得久。</p></li>
<li><h3>第 6 關・曬甕：甕裡的黑豆蔭油</h3><p>做蔭油，要先把黑豆泡水、蒸熟，拌上麴，讓它發酵；再加鹽，放進甕裡。下營的黑豆蔭油用傳統的方法：甕放在太陽下日曬，曬好幾個月才壓出蔭油。農會的蔭油叫「A贏」。</p><p>為什麼？「A贏」是什麼意思？ 用台語念念看：「下營」和「會贏」聽起來很像！所以下營區農會的黑豆蔭油，就叫「A贏」。</p></li>
</ol>

function pod(x,y,s,rot,c){c=c||'#8AAE4A';return '<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+(rot||0)+') scale('+f1(s||1)+')"><path d="M-14 0Q-14 -6 -7 -6Q0 -7 7 -6Q14 -6 14 0Q14 5 7 5Q0 6 -7 5Q-14 5 -14 0Z" fill="'+c+'" stroke="#5A4A2E" stroke-width="1"/><path d="M-7 -6V5M0 -7V6M7 -6V5" stroke="#5A4A2E" stroke-width=".7" opacity=".5"/><path d="M-14 -3l-2 -2M-10 -6l-1 -2M14 -2l2 -2M10 -6l1 -2M-12 5l-2 2M12 5l2 2" stroke="#C8B890" stroke-width=".8"/></g>'}

function plant(x,y,g,st,droop){var H=12+48*Math.min(1,g),h='<g transform="translate('+f1(x)+' '+f1(y)+')">';
  h+='<path d="M0 0V'+f1(-H)+'" stroke="'+(st==='bare'?'#8A6A3E':'#6E8A3A')+'" stroke-width="2.6"/>';
  var lc=st==='yellow'?'#D8C050':'#5E9A48',n=Math.max(1,Math.round(g*4)),d=droop?1:0;
  if(st!=='bare')for(var k=0;k<n;k++){var yy=-H*(k+1)/(n+1),sd=k%2?1:-1;h+='<ellipse cx="'+f1(sd*10)+'" cy="'+f1(yy+(d?6:0))+'" rx="10" ry="5.4" fill="'+lc+'" transform="rotate('+(sd*(d?60:20))+' '+f1(sd*10)+' '+f1(yy+(d?6:0))+')"/>'}

  else if(g>.35)h+='<circle cx="4" cy="'+f1(-H*.5)+'" r="2.2" fill="#B88AD0"/><circle cx="-4" cy="'+f1(-H*.7)+'" r="2.2" fill="#B88AD0"/>';
  return h+'</g>'}

    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function machine(x){return '<g transform="translate('+f1(x)+' 150)"><rect x="-6" y="-40" width="50" height="28" rx="4" fill="#DB2E27"/><rect x="2" y="-60" width="24" height="20" fill="#BFE0EE" stroke="#A8241E" stroke-width="2"/><rect x="44" y="-30" width="18" height="16" fill="#A8241E"/><path d="M62 -26H70V-8H62" fill="#8A8A8A"/><circle cx="6" cy="-8" r="9" fill="#3A3434"/><circle cx="34" cy="-8" r="9" fill="#3A3434"/>'+
      '<path d="M-6 -30L-20 -40" stroke="#5A3A24" stroke-width="3"/><circle cx="-6" cy="-52" r="6" fill="#8A6A3E" opacity="'+(hold?'.8':'0')+'"/></g>'}
    function draw(){var h='';
      if(ph===0){F.forEach(function(f){h+='<rect x="'+(f.x-44)+'" y="58" width="88" height="92" rx="6" fill="#E4D8B8" stroke="'+BANK+'" stroke-width="3"/>';for(var k=0;k<3;k++)h+=plant(f.x-26+k*26,148,f.g,f.st)});
        h+='<text x="160" y="40" font-size="15" font-weight="700" fill="#6C2024" text-anchor="middle">哪一塊田可以收？</text>'}
      else{var cut=mx+70;for(var k=0;k<9;k++){var px=90+k*26;if(px>cut)h+=plant(px,150,1,'bare')}
        h+='<rect x="-400" y="150" width="'+f1(cut+400)+'" height="4" fill="#C8A878"/>'+machine(mx);
        var p=(mx-10)/220,lab=[['割下來',.15],['打出豆子',.45],['篩乾淨',.75]];
        h+=lab.map(function(L,k){var on=p>=L[1];return '<rect x="'+(24+k*96)+'" y="10" width="84" height="24" rx="12" fill="'+(on?'#3F6B2E':'#FFF8EC')+'" stroke="#BD9558" stroke-width="1.2"/><text x="'+(66+k*96)+'" y="27" font-size="14" font-weight="700" fill="'+(on?'#fff':'#8A7A70')+'" text-anchor="middle">'+(on?'✓ ':'')+L[0]+'</text>'}).join('')}
      g.innerHTML=h;bar.style.width=(done?100:ph===0?0:20+(mx-10)/220*70)+'%'}
    draw();
    anim(function(dt){if(done)return false;if(ph===1&&hold){mx=Math.min(230,mx+dt*45);if(mx>=230){done=true;hold=false;draw();lvDone(area,i,l,msg,'開到田的另一頭了！');return false}draw()}});
    function pick(k){var f=F[k];if(f.st==='green'){say(msg,'葉子還<b>綠綠的</b>，豆子還沒熟。',1);return}
      if(f.st==='yellow'){say(msg,'葉子黃了，可是<b>還沒掉光</b>，再等一下。',1);return}
      ph=1;hold=false;draw();say(msg,'這塊田<b>葉子掉光</b>、豆莢變褐色了！<b>按住</b>畫面，讓收穫機開過去。')}
    drag(svg,function(t,p){if(done)return;
      if(ph===0){if(t!=='down')return;var k=-1;F.forEach(function(f,j){if(Math.abs(p.x-f.x)<46&&p.y>50&&p.y<160)k=j});if(k>=0)pick(k);return}
      if(t==='down'){hold=true;draw();return}
      if(t==='up'&&hold){hold=false;draw();if(!done)say(msg,'放開就停下來了。<b>按住</b>不放，一路開到底！')}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','三塊黑豆田和收穫機，按 Enter 收成');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();if(ph===0)pick(2);else{mx=229;hold=true}}});
    later(function(){if(!done&&ph===0)say(msg,'仔細看三塊田的<b>葉子</b>：哪一塊葉子都掉光了？')},7000);
  },

  /* 第 5 關：太陽曬，含水量降到 12 以下（變綠）；再先拖內層 PE 袋、後拖外層編織袋到黑豆上 */
  drybag:function(area,i,l){
    var W=17,day=0,inner=false,outer=false,done=false,hold=null,PILE={x:160,y:84},t0=0,
      BG={pe:{x:236,y:158,hx:236,hy:158,nm:'PE 塑膠袋',c:'#E8F2F8'},wv:{x:84,y:158,hx:84,hy:158,nm:'編織袋',c:'#E8E0C8'}};
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F2ECDC"><rect x="-400" y="176" width="1200" height="60" fill="#C8B48C"/>'+
      '<rect x="20" y="40" width="280" height="96" rx="6" fill="#D8CCB0"/><g id="sun"></g><g id="pl"></g><g id="bg"></g><g id="ct"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),sun=svg.querySelector('#sun'),pl=svg.querySelector('#pl'),bgE=svg.querySelector('#bg'),ct=svg.querySelector('#ct');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    var r=rnd(5),BS=[];for(var k=0;k<46;k++)BS.push({x:40+r()*240,y:50+r()*78,a:r()*180});
    function bagArt(b,big){var w=big?70:64,h=big?60:36;return '<g transform="translate('+f1(b.x)+' '+f1(b.y)+')"><path d="M'+(-w/2)+' '+(-h/2)+'H'+(w/2)+'L'+(w/2-3)+' '+(h/2)+'H'+(-w/2+3)+'Z" fill="'+b.c+'" stroke="#8A7A70" stroke-width="1.4"/>'+(b===BG.wv?'<path d="M'+(-w/2+4)+' '+(-h/2+8)+'H'+(w/2-4)+'M'+(-w/2+4)+' 0H'+(w/2-4)+'M'+(-w/2+4)+' '+(h/2-8)+'H'+(w/2-4)+'" stroke="#C8B890" stroke-width="1"/>':'')+(!big?'<text y="5" font-size="12" font-weight="700" fill="#2A2020" text-anchor="middle">'+b.nm+'</text>':'')+'</g>'}
    function draw(){var ok=W<=12;
      sun.innerHTML='<circle cx="'+f1(40+Math.min(1,t0/1.6%1)*240)+'" cy="'+f1(26-Math.sin(Math.min(1,t0/1.6%1)*Math.PI)*12)+'" r="10" fill="#FFD66B"/>';
      if(!inner)pl.innerHTML=BS.map(function(b){return bean(b.x,b.y,.55,b.a)}).join('');
      else pl.innerHTML=bagArt({x:PILE.x,y:PILE.y,c:outer?BG.wv.c:BG.pe.c},true)+(outer?'<path d="M130 60H190" stroke="#C8B890"/><text x="160" y="92" font-size="13" font-weight="700" fill="#5A4A3A" text-anchor="middle">黑豆</text>':'<text x="160" y="92" font-size="13" font-weight="700" fill="#5A4A3A" text-anchor="middle">黑豆</text>');
      bgE.innerHTML=(inner?'':bagArt(BG.pe))+(outer?'':bagArt(BG.wv));
      ct.innerHTML='<rect x="8" y="6" width="74" height="24" rx="12" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.2"/><text x="45" y="23" font-size="13" font-weight="700" fill="#2A2020" text-anchor="middle">曬第 '+day+' 天</text>'+
        '<rect x="200" y="6" width="112" height="24" rx="12" fill="'+(ok?'#3F6B2E':'#FFF8EC')+'" stroke="#BD9558" stroke-width="1.2"/><text x="256" y="23" font-size="13" font-weight="700" fill="'+(ok?'#fff':'#2A2020')+'" text-anchor="middle">含水量 '+W+'</text>';
      bar.style.width=(done?100:(Math.min(1,(17-W)/5)*40+(inner?25:0)+(outer?25:0)))+'%'}
    draw();
    anim(function(dt){if(done)return false;if(W>12){t0+=dt;var d=Math.floor(t0/1.6);if(d>day){day=d;W=[17,14,12][Math.min(2,day)];
        if(W<=12)say(msg,'曬了 '+day+' 天，含水量 <b>'+W+'</b>，變綠色了！可以裝袋了。')}}draw()});
    function put(b){if(W>12){say(msg,'還太濕了！含水量要降到 <b>12 以下</b>（變綠色）才能裝袋。',1);return false}
      if(b===BG.wv&&!inner){say(msg,'先裝<b>裡面</b>那一層 <b>PE 塑膠袋</b>，再套外面的編織袋。',1);return false}
      if(b===BG.pe){inner=true;say(msg,'裝進 PE 塑膠袋了！再套上外面的<b>編織袋</b>。');return true}
      outer=true;done=true;draw();lvDone(area,i,l,msg,'兩層都裝好了！');return true}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){var k=null;[BG.pe,BG.wv].forEach(function(b){if((b===BG.pe?!inner:!outer)&&dist(p,b)<30)k=b});if(k){hold=k}else if(p.y>140)say(msg,'按住下面的<b>袋子</b>，拖到黑豆上。',1);return}
      if(t==='move'&&hold){hold.x=p.x;hold.y=p.y;draw();return}
      if(t==='up'&&hold){var b=hold;hold=null;if(!(dist(b,PILE)<70&&put(b))){b.x=b.hx;b.y=b.hy}draw()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','曬場上的黑豆和兩個袋子，按 Enter 裝袋');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();if(W>12){W=12;day=2;draw();return}put(inner?BG.wv:BG.pe);draw()}});
  },

  /* 第 6 關：5 個甕一個一個拖到曬得到太陽的格子（屋簷影子裡的不行） */
  jars:function(area,i,l){
    var SL=[];[[80,62],[140,62],[200,62],[260,62],[80,118],[140,118],[200,118],[260,118]].forEach(function(q,k){SL.push({x:q[0],y:q[1],shade:k===0||k===1||k===4,j:null})});
    var J=[];for(var k=0;k<5;k++)J.push({x:72+k*44,y:168,hx:72+k*44,hy:168,s:null});
    var hold=null,done=false;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F2E8D4"><rect x="-400" y="180" width="1200" height="60" fill="#C8B48C"/><rect x="40" y="30" width="250" height="120" fill="#E4D6B8"/>'+
      '<rect x="-400" y="0" width="432" height="180" fill="#D8C4A0"/><path d="M-400 0H40L118 22H-400Z" fill="#8A6A4A"/><text x="16" y="100" font-size="12" font-weight="700" fill="#5A4A3A" text-anchor="middle">屋子</text><text x="68" y="15" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">屋簷</text>'+
      '<path d="M32 22H172V92H112V150H32Z" fill="#3A2A20" opacity=".22"/>'+
      '<circle cx="292" cy="16" r="12" fill="#FFD66B"/><g id="sl"></g><g id="jr"></g><g id="ct"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),slE=svg.querySelector('#sl'),jr=svg.querySelector('#jr'),ct=svg.querySelector('#ct');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function nSun(){return J.filter(function(j){return j.s&&!j.s.shade}).length}
    function draw(){slE.innerHTML=SL.map(function(q){return '<ellipse cx="'+q.x+'" cy="'+(q.y+12)+'" rx="22" ry="7" fill="none" stroke="'+(q.shade?'#8A7A70':'#BD9558')+'" stroke-width="1.6" stroke-dasharray="4 3"/>'}).join('');
      jr.innerHTML=J.map(function(j){return jar(j.x,j.y,j===hold?1.15:1,!!j.s)}).join('')+(done?'<rect x="200" y="4" width="64" height="22" rx="11" fill="#DB2E27"/><text x="232" y="20" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">A贏</text>':'');
      var n=nSun();ct.innerHTML=done?'':'<rect x="200" y="4" width="78" height="22" rx="11" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.2"/><text x="239" y="20" font-size="13" font-weight="700" fill="#2A2020" text-anchor="middle">曬到 '+n+'／5</text>';
      bar.style.width=(done?100:n/5*90)+'%'}
    draw();
    function place(j){var q=null,best=30;SL.forEach(function(s){var d=dist(j,s);if(d<best){best=d;q=s}});
      if(!q||q.j&&q.j!==j){j.s=null;j.x=j.hx;j.y=j.hy;if(q)say(msg,'這一格已經有甕了。',1);return}
      if(q.shade){j.s=null;j.x=j.hx;j.y=j.hy;say(msg,'這一格在<b>屋簷的影子</b>裡，曬不到太陽！換一格。',1);return}
      if(j.s)j.s.j=null;q.j=j;j.s=q;j.x=q.x;j.y=q.y;var n=nSun();
      if(n>=5){done=true;draw();lvDone(area,i,l,msg,'5 個甕都在太陽下了！');return}
      say(msg,'曬到太陽了！還有 '+(5-n)+' 個。')}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){var k=null,best=22;J.forEach(function(j){var d=dist(p,{x:j.x,y:j.y-6});if(d<best){best=d;k=j}});if(k){hold=k;if(k.s){k.s.j=null;k.s=null}}return}
      if(t==='move'&&hold){hold.x=clamp(p.x,20,300);hold.y=clamp(p.y,30,176);draw();return}
      if(t==='up'&&hold){var j=hold;hold=null;place(j);draw()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','曬場上的格子和五個甕，按 Enter 搬一個甕到太陽下');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var j=J.filter(function(j){return !j.s})[0],q=SL.filter(function(s){return !s.shade&&!s.j})[0];j.x=q.x;j.y=q.y;place(j);draw()}});
    later(function(){if(!done&&!nSun())say(msg,'按住下面的一個<b>甕</b>，拖到右邊<b>亮亮的</b>格子（沒有影子的地方）。')},7000);
  }
};
</script>
