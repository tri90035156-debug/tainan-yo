<h1>鮮乳任務・畜牧・柳營八翁</h1>
<p>跟著柳營<b>八翁</b>牧場的大哥哥過一天：把從紐西蘭來的乳牛趕進牧場、用<b>推草機器人</b>把草推回柵欄邊、先淋濕再吹風幫牛<b>消暑</b>、排好<b>乳牛的一年</b>、把牛糞接成<b>循環圈</b>，最後到<b>八老爺車站</b>餵小牛喝奶。</p>
<p>地點：柳營（臺南市柳營區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>臺南的柳營，有「牛乳之鄉」的美名。八翁這裡的牧場，養了大約 8 千到 1 萬頭乳牛，是臺灣重要的鮮乳產地。乳牛怕熱，天氣涼的冬天，產的奶最多。跟著牧場的大哥哥過一天：趕牛、推草、幫牛消暑，還要餵小牛喝奶。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・八翁酪農區：從紐西蘭來的乳牛</h3><p>1974 年，八翁的牧場從紐西蘭買來 240 頭乳牛，分給 40 戶農家，一戶分到 6 頭。八翁就這樣變成養乳牛的地方。後來養牛的人家越來越多，八翁曾經是臺灣最大的酪農專業區。</p><p>為什麼？柳營的乳牛是什麼牛？ 是黑白花的荷蘭牛（荷斯坦牛）。牠們脾氣溫和、產的奶多，是臺灣養的乳牛品種。</p></li>
<li><h3>第 2 關・牛舍：把草推回柵欄邊</h3><p>牛從柵欄中間伸出頭來吃草。可是牛吃著吃著，會把草推遠，推到吃不到的地方。八翁有牧場用「推草機器人」：設定好時間和路線，它就會自己跑，把草推回柵欄邊，讓牛一直吃得到。</p><p>為什麼？養牛可以放假嗎？ 不行！牧場一年 365 天都不休息。牛每天都要吃草、喝水、擠奶，牛舍也要每天整理。所以牧場才會請機器人來幫忙。</p></li>
<li><h3>第 3 關・待擠乳區：先淋濕，再吹風</h3><p>臺灣每年 5 月到 10 月又熱又潮濕。乳牛很怕熱，熱到會喘氣、吃不下，奶也變少。擠奶前，牛擠在待擠乳區排隊，最熱了。幫牛消暑有個秘訣：先灑水把牛淋濕，再開風扇吹，風把水吹乾，熱也一起帶走。</p><p>為什麼？為什麼要先淋濕再吹風？ 水被風吹乾的時候，會把牛身上的熱帶走，就像我們流汗吹風會覺得涼。只吹風不淋濕，天氣太熱時，風吹起來也是熱的。</p></li>
<li><h3>第 4 關・小牛：乳牛的一年</h3><p>乳牛不是一直都有奶。乳牛要先生小牛，才會開始產奶。生了小牛以後，大約擠奶 10 個月；接著停下來休息 60 天（大約 2 個月），準備生下一頭小牛。這樣一年一年輪下去。</p><p>為什麼？為什麼要讓乳牛休息？ 乳牛肚子裡有下一頭小牛，停止擠奶，身體才能好好休息、把營養留給小牛。休息完生下小牛，又會有很多奶。</p></li>
<li><h3>第 5 關・處理中心：牛糞也是寶</h3><p>這麼多牛，每天會拉好多牛糞。八翁蓋了畜牧糞尿資源化處理中心，讓牛糞變成有用的東西。牛糞發酵產生沼氣，可以拿來發電；剩下的做成有機肥，拿去種狼尾草；狼尾草又割回來餵牛。繞了一圈，又回到牛！</p><p>為什麼？狼尾草是什麼？ 狼尾草是一種長得很高、很快的牧草，割下來可以餵牛。柳營的牧場附近，常常看到一大片狼尾草田。</p></li>
<li><h3>第 6 關・八老爺車站：餵小牛喝奶</h3><p>以前柳營有一大片甘蔗田，糖廠的小火車「五分車」在田裡跑。八老爺就是五分車經過的車站。旁邊的「乳牛的家」原本是牧場，2002 年起變成大家可以來玩的地方：看乳牛、餵小動物，還可以吃牛奶做的點心。</p><p>為什麼？乳牛的家可以做什麼？ 可以看乳牛、餵小動物（乳牛、羊、草泥馬……），還可以吃用牧場自己的牛奶做的包子、布丁、冰棒。到牧場要記得：不要站在牛的正後方，摸過動物要洗手。</p></li>
</ol>

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
// 一直跑的動畫（換關時會自動停）
function anim(fn){var raf=0,last=0,on=true;function step(now){if(!on)return;var dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(fn(dt)===false){on=false;return}raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step);loops.push(function(){on=false;cancelAnimationFrame(raf)});return function(){on=false;cancelAnimationFrame(raf)}}
// 一定要等的時間（later() 在「減少動態效果」時會變成 0）
function wait(fn,ms){var t=setTimeout(fn,ms);loops.push(function(){clearTimeout(t)})}

    var sc=setScene(s,1100),svg=sc.querySelector('svg'),bk=svg.querySelector('#bk');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){bk.innerHTML=B.map(function(b){var w=b.len*CW;return '<g transform="translate('+f1(b.x)+' '+f1(b.y)+')"><rect width="'+w+'" height="'+TH+'" rx="4" fill="'+b.c+'" stroke="'+b.s+'" stroke-width="2"/><text x="'+(w/2)+'" y="20" font-size="'+(b.len>2?15:13)+'" font-weight="700" fill="#2A2020" text-anchor="middle">'+(b.len>2?b.t:'休息')+'</text>'+(b.len>2||b.at>=0?'':'<text x="'+(w/2)+'" y="'+(TH+13)+'" font-size="12" fill="#5A4E48" text-anchor="middle">2 個月</text>')+'</g>'}).join('');
      bar.style.width=(done?100:B.filter(function(b){return b.at>=0}).length*45)+'%'}
    draw();
    function home(b){b.at=-1;b.x=b.hx;b.y=b.hy}
    function drop(b){var cy=b.y+TH/2;if(Math.abs(cy-(TY+TH/2))>30){home(b);draw();return}
      var st=(b.x-X0)/CW,o=B.filter(function(q){return q!==b&&q.at>=0})[0];
      // 放得下的位置裡，選離手指最近的
      var opts=(b.len===10?[0,2]:[0,10]).filter(function(a){return !(o&&a<o.at+o.len&&o.at<a+b.len)}).sort(function(x,y){return Math.abs(st-x)-Math.abs(st-y)});
      if(!opts.length){home(b);draw();say(msg,'放不下了！把上面那一塊拿下來，再試一次。',1);return}
      var at=opts[0];
      b.at=at;b.x=X0+at*CW;b.y=TY;draw();
      if(B.every(function(q){return q.at>=0})){
        if(B[0].at===0){done=true;draw();lvDone(area,i,l,msg,'排對了！');return}
        say(msg,'乳牛<b>生完小牛</b>才有奶，所以生小牛以後要先<b>擠奶</b>；<b>休息</b>是在<b>生下一頭小牛之前</b>。再排一次！',1);wait(function(){B.forEach(home);draw()},reduce?200:1400)}
      else say(msg,'放好一塊了！再放另一塊。')}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){hold=null;B.forEach(function(b){if(p.x>b.x-6&&p.x<b.x+b.len*CW+6&&p.y>b.y-8&&p.y<b.y+TH+8)hold=b});if(hold){off={x:p.x-hold.x,y:p.y-hold.y};hold.at=-1}else say(msg,'按住下面的<b>擠奶</b>或<b>休息</b>那一塊，拖進時間條。',1);return}
      if(t==='move'&&hold){hold.x=p.x-off.x;hold.y=p.y-off.y;draw();return}
      if(t==='up'&&hold){var b=hold;hold=null;drop(b)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','乳牛一年的時間條，按 Enter 放好一塊');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var b=B.filter(function(b){return b.at<0})[0];if(!b)return;b.x=X0+(b.len===10?0:10)*CW;b.y=TY;drop(b)}});
    later(function(){if(B.every(function(b){return b.at<0}))say(msg,'按住「<b>擠奶 10 個月</b>」那一長塊，拖進上面的時間條。')},6000);
  },

  /* 第 5 關：把 3 張卡拖到循環圈的空位，牛 → 牛糞 → 處理中心 → 有機肥 → 狼尾草 → 牛，處理中心旁邊還有電 */
  loop:function(area,i,l){
    var CX=118,CY=98,RR=58,done=false,hold=null,off=null,t0=0;
    function at(a){a=a*Math.PI/180;return {x:CX+RR*Math.cos(a),y:CY+RR*Math.sin(a)}}
    var S=[{k:'cow',n:'牛',p:at(-90)},{k:'dung',n:'牛糞',p:at(-18)},{k:'plant',n:'處理中心',p:at(54)},{k:'fert',n:'有機肥',p:at(126),slot:1},{k:'grass',n:'狼尾草',p:at(198),slot:1},{k:'lamp',n:'電',p:{x:212,y:150},slot:1}];
    var D=[{k:'fert',x:248,y:30},{k:'lamp',x:248,y:78},{k:'grass',x:248,y:126}].map(function(d){d.hx=d.x;d.hy=d.y;d.on=false;return d});
    var HINT={fert:'有機肥是拿來<b>種東西</b>的。它要放在處理中心和狼尾草<b>中間</b>。',grass:'狼尾草長大以後，要割回來<b>餵牛</b>。它要放在<b>牛的前一站</b>。',lamp:'沼氣可以<b>發電</b>。電燈放在<b>處理中心旁邊</b>的空位。'};
    function pic(k,x,y){var g='<g transform="translate('+f1(x)+' '+f1(y)+')">';
      if(k==='cow')return g+cowS(-6,14,.5,1)+'</g>';
      if(k==='dung')return g+'<path d="M-10 8Q-12 0 -4 -2Q-4 -10 4 -8Q12 -6 10 2Q14 8 6 10H-6Z" fill="#7A5A3A"/></g>';
      if(k==='plant')return g+'<path d="M-14 10V-2Q-14 -12 -4 -12Q6 -12 6 -2V10Z" fill="#9AB0A0" stroke="#5A7464" stroke-width="1.4"/><path d="M8 10V0Q8 -8 14 -8" stroke="#5A7464" stroke-width="3" fill="none"/></g>';
      if(k==='fert')return g+'<path d="M-9 10L-11 -6H11L9 10Z" fill="#C8A878" stroke="#8A6A4A" stroke-width="1.4"/><text y="6" font-size="10" font-weight="700" fill="#5A3A20" text-anchor="middle">肥</text></g>';
      if(k==='grass')return g+napier(0,12,.7)+'</g>';
      return g+'<path d="M-7 -2A8 8 0 1 1 7 -2Q4 2 4 6H-4Q-4 2 -7 -2Z" fill="'+(done?'#FFE070':'#F0E8C8')+'" stroke="#8A7A50" stroke-width="1.4"/><rect x="-4" y="7" width="8" height="4" fill="#8A8A84"/>'+(done?'<circle r="16" fill="#FFE070" opacity=".35"/>':'')+'</g>'}
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EEF2E4"><rect x="-400" y="182" width="1200" height="60" fill="'+GRASS2+'"/><circle cx="'+CX+'" cy="'+CY+'" r="'+RR+'" fill="none" stroke="#BD9558" stroke-width="3" stroke-dasharray="6 5" id="ring"/>'+
      [-54,18,90,162,234].map(function(a){var p=at(a),r=a*Math.PI/180;return '<path d="M0 -6L8 0L0 6Z" fill="#BD9558" transform="translate('+f1(p.x)+' '+f1(p.y)+') rotate('+f1(a+90)+')"/>'}).join('')+
      '<path d="M'+f1(S[2].p.x+16)+' '+f1(S[2].p.y+2)+'L'+(S[5].p.x-18)+' '+(S[5].p.y-2)+'" stroke="#BD9558" stroke-width="3" stroke-dasharray="4 4"/><text x="'+(S[5].p.x-28)+'" y="'+(S[5].p.y-14)+'" font-size="12" fill="#8A6A3A" text-anchor="middle">沼氣</text>'+
      '<g id="st"></g><g id="dk"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),stE=svg.querySelector('#st'),dk=svg.querySelector('#dk'),ring=svg.querySelector('#ring');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){
      stE.innerHTML=S.map(function(st){var filled=!st.slot||D.some(function(d){return d.k===st.k&&d.on});return '<circle cx="'+f1(st.p.x)+'" cy="'+f1(st.p.y)+'" r="19" fill="'+(filled?'#FFF8EC':'#F4ECDC')+'" stroke="'+(filled?'#8A7A64':'#DB2E27')+'" stroke-width="2" '+(filled?'':'stroke-dasharray="4 3"')+'/>'+(filled?pic(st.k,st.p.x,st.p.y):'<text x="'+f1(st.p.x)+'" y="'+f1(st.p.y+6)+'" font-size="16" font-weight="700" fill="#DB2E27" text-anchor="middle">?</text>')+
        '<text x="'+f1(st.p.x)+'" y="'+f1(st.p.y+(st.p.y<CY-30?-24:34))+'" font-size="13" font-weight="700" fill="#2A2020" text-anchor="middle" stroke="#EEF2E4" stroke-width="3" paint-order="stroke">'+(filled?st.n:'')+'</text>'}).join('');
      dk.innerHTML=D.map(function(d){return d.on?'':'<g><rect x="'+f1(d.x-26)+'" y="'+f1(d.y-18)+'" width="52" height="40" rx="8" fill="#fff" stroke="#BD9558" stroke-width="1.6"/>'+pic(d.k,d.x,d.y-2)+'<text x="'+f1(d.x)+'" y="'+f1(d.y+18)+'" font-size="11" font-weight="700" fill="#5A4E48" text-anchor="middle">'+({fert:'有機肥',grass:'狼尾草',lamp:'電燈'})[d.k]+'</text></g>'}).join('');
      bar.style.width=(done?100:D.filter(function(d){return d.on}).length/3*90)+'%'}
    draw();
    function put(d,p){var best=30,hit=null;S.forEach(function(st){if(!st.slot)return;var q=dist(p,st.p);if(q<best){best=q;hit=st}});
      if(!hit){d.x=d.hx;d.y=d.hy;draw();say(msg,'把卡片拖到圈上<b>紅色問號</b>的空位。',1);return}
      if(hit.k!==d.k){d.x=d.hx;d.y=d.hy;draw();say(msg,HINT[d.k],1);return}
      if(D.some(function(o){return o!==d&&o.on&&o.k===hit.k}))return;
      d.on=true;draw();
      if(D.every(function(o){return o.on})){done=true;draw();anim(function(dt){t0+=dt;ring.setAttribute('stroke-dashoffset',f1(-t0*30));if(t0>3)return false});lvDone(area,i,l,msg,'接成一個圈了！電燈也亮了。');return}
      say(msg,'放對了！還有 '+D.filter(function(o){return !o.on}).length+' 張。')}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){hold=null;D.forEach(function(d){if(!d.on&&Math.abs(p.x-d.x)<30&&Math.abs(p.y-d.y)<24)hold=d});if(hold)off={x:p.x-hold.x,y:p.y-hold.y};else say(msg,'按住右邊的一張<b>卡片</b>，拖到圈上的空位。',1);return}
      if(t==='move'&&hold){hold.x=p.x-off.x;hold.y=p.y-off.y;draw();return}
      if(t==='up'&&hold){var d=hold;hold=null;put(d,{x:d.x,y:d.y})}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','牛糞的循環圈，按 Enter 放好一張卡');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var d=D.filter(function(d){return !d.on})[0],st=S.filter(function(s){return s.k===d.k})[0];put(d,st.p)}});
    later(function(){if(!D.some(function(d){return d.on}))say(msg,'從<b>牛糞</b>開始，順著箭頭想：處理中心做出來的東西，可以拿來種什麼？')},7000);
  },

  /* 第 6 關：按住奶瓶對準小牛的嘴，小牛會頂開，要推回去，餵到喝光 */
  feed:function(area,i,l){
    var CXp=214,CYp=152,SC=1.15,MO={x:CXp-40*SC,y:CYp-22*SC},B={x:80,y:100},milk=1,hold=false,off=null,bt=0,bumped=0,done=false,shake=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E6F0E0"><rect x="-400" y="152" width="1200" height="60" fill="'+SOIL+'"/><path d="M-400 96H720M-400 120H720" stroke="#B89A70" stroke-width="5"/>'+
      [0,60,120,180,240,300].map(function(x){return '<path d="M'+x+' 84V152" stroke="#9A7A50" stroke-width="5"/>'}).join('')+
      '<g id="cf"></g><g id="mo"></g><g id="bo"></g><g id="ct"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),cf=svg.querySelector('#cf'),mo=svg.querySelector('#mo'),bo=svg.querySelector('#bo'),ct=svg.querySelector('#ct');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function near(){return dist(B,MO)<15}
    function draw(){var dx=shake>0?Math.sin(shake*40)*3:0;
      cf.innerHTML='<g transform="translate('+f1(dx)+' 0)">'+cowS(CXp,CYp,SC,-1,{calf:true})+'</g>';
      mo.innerHTML=done?'':'<circle cx="'+f1(MO.x)+'" cy="'+f1(MO.y)+'" r="13" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>';
      // 奶瓶：奶嘴尖端在 B，瓶身往左上斜
      bo.innerHTML='<g transform="translate('+f1(B.x)+' '+f1(B.y)+') rotate(-20)"><path d="M0 0Q-6 -3 -10 0Q-6 3 0 0Z" fill="#E8A860"/><rect x="-16" y="-5" width="7" height="10" fill="#C8C8C0"/><rect x="-62" y="-11" width="46" height="22" rx="7" fill="#F4F8FA" stroke="#8A9AA4" stroke-width="1.6"/><rect x="'+f1(-62+46*(1-milk))+'" y="-9" width="'+f1(46*milk)+'" height="18" rx="5" fill="#FFFDF4"/><path d="M-50 -11V-6M-40 -11V-6M-30 -11V-6" stroke="#8A9AA4" stroke-width="1.2"/></g>';
      ct.innerHTML='<rect x="104" y="6" width="112" height="24" rx="12" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.2"/><text x="160" y="23" font-size="13" font-weight="700" fill="#2A2020" text-anchor="middle">奶還有 '+Math.max(0,Math.round(milk*100))+'%</text>';
      bar.style.width=(done?100:(1-milk)*90)+'%'}
    draw();
    anim(function(dt){if(done)return false;if(shake>0)shake=Math.max(0,shake-dt);
      if(hold&&near()){milk=Math.max(0,milk-dt*.2);bt+=dt;
        if(bt>1.5){bt=0;off.x-=30;off.y-=6;B.x-=30;B.y-=6;shake=.3;if(!bumped){bumped=1;say(msg,'小牛喝得好用力，用頭<b>頂</b>了一下！奶瓶被頂開了，快<b>推回去</b>。',1)}}
        if(milk<=0){done=true;draw();lvDone(area,i,l,msg,'奶喝光了！');return false}}
      draw()});
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){var c={x:B.x-20,y:B.y+8};if(dist(p,c)<34||dist(p,B)<22){hold=true;off={x:B.x-p.x,y:B.y-p.y}}else say(msg,'按住左邊的<b>奶瓶</b>，拖到小牛的嘴巴。',1);return}
      if(t==='move'&&hold){B.x=clamp(p.x+off.x,30,300);B.y=clamp(p.y+off.y,30,170);return}
      if(t==='up'){hold=false;if(milk>0&&milk<1)say(msg,'要一直<b>扶著奶瓶</b>，小牛才喝得到喔。',1)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','小牛和奶瓶，按 Enter 餵小牛喝奶');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();milk=0;B.x=MO.x;B.y=MO.y;done=true;draw();lvDone(area,i,l,msg,'奶喝光了！')}});
    later(function(){if(milk>=1)say(msg,'按住<b>奶瓶</b>，把奶嘴對準小牛嘴巴旁的<b>紅色虛線圈圈</b>。')},6000);
  }
};
</script>
