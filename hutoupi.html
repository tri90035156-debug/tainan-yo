<h1>埤塘任務・水利・新化虎頭埤</h1>
<p>跟著新化的導覽阿姨看<b>虎頭埤</b>：讓山變成老虎頭、大雨中築高<b>土堤</b>、清開<b>水圳</b>讓田喝到水、指好去風景區的<b>路標</b>、讓月亮倒影落在<b>八角亭</b>旁（虎埤泛月），最後游過虎頭埤。</p>
<p>地點：新化（臺南市新化區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>臺南新化的山邊，有一座大大的湖，叫虎頭埤。它在 1846 年就有紀錄，被叫做「臺灣第一水庫」，到今天還在幫新化的田灌溉。埤就是把水圍起來、存起來的大水池。跟著新化的導覽阿姨，從一百多年前築埤，一路玩到今天的泳渡虎頭埤。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・虎頭山：像老虎頭的山</h3><p>虎頭埤旁邊的山，形狀像老虎的頭。最高的那個山頭，叫做虎頭山；山下的埤，早期就叫「虎頭山埤」，後來變成「虎頭埤」。</p><p>為什麼？「埤」和「水庫」有什麼不一樣？ 都是把水存起來的地方。埤通常比較小，是以前的人挖池、築土堤做的；水庫通常是在河上蓋大壩。虎頭埤歷史很久，所以被叫做「臺灣第一水庫」。</p></li>
<li><h3>第 2 關・土堤：築土堤把水存起來</h3><p>虎頭埤最早的紀錄，是清朝道光年間的 1846 年。有一說，是大目降（新化的舊名）的歐陽安帶頭蓋的。做法是在山谷口築一道土堤，把山上流下來的水擋住、存起來，下雨時存水，田要水的時候再放出去。</p><p>為什麼？大目降是哪裡？ 大目降是新化以前的名字。虎頭埤的專書就叫《大目降之水》。</p></li>
<li><h3>第 3 關・新化的田：把水送到田裡</h3><p>虎頭埤存的水，打開水門，沿著水圳（引水的小溝）流到田裡。到今天，虎頭埤還在幫新化大約 500 公頃的田灌溉，差不多是 700 個足球場那麼大。</p><p>為什麼？為什麼要把水存起來？ 雨不是天天下。下雨的時候把水存在埤裡，沒下雨、田要水的時候再放出去，田就一直有水用。</p></li>
<li><h3>第 4 關・進園路線：跟著路標去虎頭埤</h3><p>日本時代，1906 年虎頭埤大整修以後，臺南廳想把它變成風景區。它還被看作那時臺灣的「十二大勝景」之一。為了讓遊客找得到，開了一條路線：從新化國小出發，經過新化國中、信義路、新化高工、冷水埤，最後到虎頭埤大門。路邊還種了一排排行道樹。</p><p>為什麼？以前的人怎麼去虎頭埤玩？ 有很多老照片：日本時代有遊湖船和涼亭；1960 到 1980 年代，很多家庭和學校都來這裡郊遊。</p></li>
<li><h3>第 5 關・八角亭：虎埤泛月</h3><p>湖邊有一座八角亭，日本時代就有了，1933 年的老照片裡就看得到。晚上，月亮的影子倒映在湖面上，叫做「虎埤泛月」。1954 年，它被選為南瀛八景的第一名！</p><p>為什麼？為什麼湖裡會有月亮？ 平靜的湖面像鏡子，會把天上的月亮反射出來。月亮在天上越高，倒影在湖裡就越下面。</p></li>
<li><h3>第 6 關・泳渡虎頭埤：游過虎頭埤</h3><p>現在的虎頭埤，有「台南小日月潭」的稱號。有環湖步道、虎月吊橋，還有給大人小孩一起玩的地景公園。2024 年 10 月，第二屆「泳渡虎頭埤」有上千人參加，最小的才 8 歲！</p><p>為什麼？平常可以在虎頭埤游泳嗎？ 不行！泳渡是有救生員、有浮具的活動，才能下水。平常去虎頭埤，只能在步道散步、看風景，不要靠近水邊。</p></li>
</ol>

    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){
      wv.innerHTML=[0,1,2,3].map(function(k){var yy=(k*44+t*20)%150+36;return '<path d="M30 '+f1(yy)+'q8 -4 16 0t16 0M250 '+f1(yy+20)+'q8 -4 16 0t16 0" stroke="#fff" stroke-width="1.6" fill="none" opacity=".6"/>'}).join('');
      var aL=arm.L,aR=arm.R;
      sw.innerHTML='<g transform="translate(160 '+f1(y)+')"><ellipse cx="0" cy="14" rx="9" ry="16" fill="#DB2E27"/><path d="M-5 28L-7 44M5 28L7 44" stroke="#E8B890" stroke-width="5" stroke-linecap="round"/>'+
        '<path d="M-8 6Q'+f1(-26)+' '+f1(-14+aL*30)+' '+f1(-16)+' '+f1(-24+aL*40)+'" stroke="#E8B890" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M8 6Q26 '+f1(-14+aR*30)+' 16 '+f1(-24+aR*40)+'" stroke="#E8B890" stroke-width="5" fill="none" stroke-linecap="round"/>'+
        '<circle r="9" fill="#F5D060" stroke="#C8A030" stroke-width="1.4"/></g>';
      ui.innerHTML=done?'':'<text x="'+(need==='L'?62:258)+'" y="120" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" stroke="#2E5A74" stroke-width="3" paint-order="stroke">'+(need==='L'?'左手':'右手')+'</text><path d="M'+(need==='L'?62:258)+' 74V104M'+(need==='L'?54:250)+' 96L'+(need==='L'?62:258)+' 106L'+(need==='L'?70:266)+' 96" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>';
      bar.style.width=(done?100:n/N*90)+'%'}
    draw();
    anim(function(dt){t+=dt;arm.L=Math.max(0,arm.L-dt*2);arm.R=Math.max(0,arm.R-dt*2);var ty=SY-(SY-EY)*n/N;y+=(ty-y)*Math.min(1,dt*4);draw();if(done&&Math.abs(y-ty)<1)return false});
    function stroke(side){if(side!==need){say(msg,'換<b>'+(need==='L'?'左手':'右手')+'</b>！要左右<b>輪流</b>划。',1);return}
      arm[side]=1;n++;need=side==='L'?'R':'L';
      if(n>=N){done=true;draw();lvDone(area,i,l,msg,'游到對岸了！');return}
      if(n===1)say(msg,'划一下了！換另一隻手。');else if(n===N-3)say(msg,'快到了，加油！')}
    drag(svg,function(tt,p){if(done)return;
      if(tt==='down'){st={x:p.x,y:p.y};return}
      if(tt==='up'&&st){var dx=p.x-st.x,dy=p.y-st.y,s0=st;st=null;
        if(dy<26||Math.abs(dx)>dy){say(msg,'從<b>上往下</b>畫一下，才是往後划水。',1);return}
        stroke(s0.x<160?'L':'R')}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','泳渡虎頭埤，按 Enter 划一下水');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();stroke(need)}});
    later(function(){if(!n)say(msg,'在人的<b>左邊</b>，手指從<b>上往下</b>畫一下：左手划水！')},5000);
  }
};
</script>
