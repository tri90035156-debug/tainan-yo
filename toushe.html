<h1>夜祭任務・民俗・大內頭社夜祭</h1>
<p>跟著頭社的阿嬤和小孫女認識西拉雅族的<b>公廨</b>：在月曆上找<b>農曆十月十四、十五</b>、猜猜公廨為什麼在村子北邊、看公廨為什麼登記成<b>太上龍頭忠義廟</b>、站在外面看<b>壺</b>和<b>甕</b>、和阿嬤約定好看夜祭的規矩，再到夜祭那晚在圈外安靜地看。</p>
<p>地點：頭社（臺南市大內區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>臺南大內的頭社，有西拉雅族的族人。村子北邊有一座公廨，是族人敬拜祖靈的地方。族人敬拜的祖靈叫太祖，也叫阿立祖。每年農曆十月十四、十五，公廨會舉行夜祭。跟著頭社的阿嬤和她的小孫女，先認識公廨，再到夜祭那晚安靜地看。每過一關，就能蓋一個章。</p><h2>關卡</h2><ol>
<li><h3>第 1 關・阿嬤家：在月曆上找夜祭的日子</h3><p>阿嬤說：「夜祭在農曆十月十四、十五。十五那天最重要。」農曆是照月亮算的日子。農曆的日子，每年落在國曆的哪一天都不一樣，會在國曆 11 月到 12 月初的不同一天。</p><p>為什麼？為什麼十五那天最重要？ 有一說，農曆十月十五是阿立祖的生日，所以這天是夜祭最重要的日子。農曆十五，也是月亮最圓的日子。</p></li>
<li><h3>第 2 關・小路：公廨在哪裡？</h3><p>阿嬤牽著小孫女，從村子往北走。阿嬤說，公廨不在村子正中間，在村子的北邊，要走一段小路才到。有一說，祖靈喜歡安靜，不喜歡人聲吵吵鬧鬧，所以公廨蓋在離房子遠一點的地方。</p><p>為什麼？為什麼公廨離村子有一段路？ 有一說，祖靈喜歡安靜，不喜歡聽到人聲吵雜，所以公廨蓋在離村子有一段路的地方。這是一直傳下來的說法。</p></li>
<li><h3>第 3 關・公廨門口：為什麼登記成廟名？</h3><p>走到公廨前面。阿嬤說，公廨登記的名字是太上龍頭忠義廟。咦，這裡不是叫頭社公廨嗎？1983 年，大家重新蓋公廨，外觀參考了臺北的國父紀念館。公廨要向政府登記，可是登記的規定裡，沒有「公廨」這一種。</p><p>為什麼？為什麼公廨要用廟名登記？ 因為政府登記的規定裡，沒有「公廨」這一種，一定要寫成某某廟。所以頭社公廨登記的名字是太上龍頭忠義廟。很多人還是叫它頭社公廨。</p></li>
<li><h3>第 4 關・公廨前：站在外面看壺和甕</h3><p>公廨裡擺著壺和甕。西拉雅族人敬拜的太祖，據說就住在這些壺和甕裡。阿嬤說：「這些很重要，用眼睛看就好，不要伸手摸。」</p><p>為什麼？為什麼公廨裡擺壺和甕？ 西拉雅族人說，他們敬拜的太祖（阿立祖），就住在公廨裡的壺和甕裡。所以壺和甕很重要，只能看，不能亂碰。</p></li>
<li><h3>第 5 關・廣場邊：誰做錯了？</h3><p>天快黑了，夜祭就要開始。阿嬤帶著你們在廣場邊停下來。「夜祭是族人敬拜祖靈的重要日子。我們是來看的客人。」廣場邊來了好多客人，有人做得很好，也有人不小心做錯了。</p><p>為什麼？為什麼看夜祭有這些規矩？ 夜祭是族人敬拜祖靈的日子。我們是來看的客人：聽族人的安排、不碰祭品、拍照先問、小聲不吵鬧、不走進圈圈，就不會打擾族人。</p></li>
<li><h3>第 6 關・夜祭那晚：在圈外安靜地看</h3><p>月亮又圓又亮。族人穿著白衣，在公廨前手牽著手跳舞，敬拜祖靈。有一說，大家會圍成一個大圈。有幾個來看的人，不小心走得太近了。</p><p>為什麼？為什麼族人手牽著手跳舞？ 族人穿著白衣、手牽著手跳舞，是在敬拜祖靈太祖。跳舞的地方是族人的，我們在外面安靜地看，就是尊重。</p></li>
</ol>

      // 牽著的手：相鄰的族人中間畫一條線
      for(var k=0;k<12;k++){var a1=ang+k/12*Math.PI*2,a2=ang+(k+1)/12*Math.PI*2;if(Math.sin((a1+a2)/2)<0)h+='<path d="M'+f1(C.x+Math.cos(a1)*RR[0])+' '+f1(C.y-14+Math.sin(a1)*RR[1])+'L'+f1(C.x+Math.cos(a2)*RR[0])+' '+f1(C.y-14+Math.sin(a2)*RR[1])+'" stroke="#E8B890" stroke-width="2"/>'}
      L.forEach(function(q){if(q.t)h+=person(q.x,q.y,.85,'#6A6A78');else if(q.w)h+=person(q.x,q.y,.5,'#fff',{white:1,hair:'#2A2020'});else h+=person(q.x,q.y,.62,q.c)+(!done&&!q.v.ok&&hold!==q.v?'<circle cx="'+f1(q.x)+'" cy="'+f1(q.y-14)+'" r="20" fill="none" stroke="#F5C842" stroke-width="2" stroke-dasharray="4 3"/>':'')});
      for(var k=0;k<12;k++){var a1=ang+k/12*Math.PI*2,a2=ang+(k+1)/12*Math.PI*2;if(Math.sin((a1+a2)/2)>=0)h+='<path d="M'+f1(C.x+Math.cos(a1)*RR[0])+' '+f1(C.y-14+Math.sin(a1)*RR[1])+'L'+f1(C.x+Math.cos(a2)*RR[0])+' '+f1(C.y-14+Math.sin(a2)*RR[1])+'" stroke="#E8B890" stroke-width="2"/>'}
      ppg.innerHTML=h;bar.style.width=(done?100:n/3*90)+'%'}
    draw();
    anim(function(dt){ang+=dt*.25;draw()});
    function put(v){var s=null,bd=30;SP.forEach(function(q){var d=dist(v,q);if(!q.v&&d<bd){bd=d;s=q}});
      if(s&&!sees(s)){v.x=v.hx;v.y=v.hy;say(msg,'站在那裡，前面<b>高高的大人</b>擋住了，<b>看不到</b>跳舞。換一個看得到的空位。',1);return}
      if(s){s.v=v;v.x=s.x;v.y=s.y;v.ok=1;n++;
        if(n>=3){done=true;draw();lvDone(area,i,l,msg,'3 個人都退到白線外面，安安靜靜地看。');return}
        say(msg,'退到白線外面了，站在這裡<b>看得到</b>跳舞。還有 '+(3-n)+' 個人。');return}
      if(inLine(v)){v.x=v.hx;v.y=v.hy;say(msg,'還在白線裡面，會擋到跳舞的族人。拖到白線外面的<b>空位</b>。',1);return}
      v.x=v.hx;v.y=v.hy;say(msg,'站到灰色虛線圈圈的<b>空位</b>，才不會擋到後面的人。',1)}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){var b=null,bd=28;VI.forEach(function(v){var d=dist(p,{x:v.x,y:v.y-14});if(!v.ok&&d<bd){bd=d;b=v}});
        if(!b&&TB.some(function(q){return dist(p,{x:q.x,y:q.y-18})<24})){say(msg,'這位<b>高高的大人</b>已經站在白線外面了。拖<b>穿彩色衣服</b>、走進白線的人。',1);return}
        if(!b){say(msg,inLine(p)?'跳舞的族人不要去拉。拖<b>穿彩色衣服</b>、走進白線的人（黃色虛線圈圈）。':'按住走進白線裡、<b>穿彩色衣服</b>的人（黃色虛線圈圈）。',1);return}
        hold=b;b.x=p.x;b.y=p.y-6;draw();return}
      if(t==='move'&&hold){hold.x=clamp(p.x,10,310);hold.y=clamp(p.y-6,40,190);draw();return}
      if(t==='up'&&hold){var v=hold;hold=null;put(v);draw()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','夜祭的廣場，按 Enter 讓走進白線的人退到外面');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var v=VI.filter(function(x){return !x.ok})[0],q=SP.filter(function(x){return !x.v&&sees(x)})[0];v.x=q.x;v.y=q.y;put(v);draw()}});
    later(function(){if(!done&&!n)say(msg,'按住穿<b>彩色</b>衣服、走進白線的人，拖到白線外的灰色圈圈。拖的時候看那條線：綠的看得到，紅的被擋住。')},7000);
  }
};
