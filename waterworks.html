<h1>水道任務・水利・山上水道</h1>
<p>跟著一滴<b>曾文溪</b>的水，走一趟百年前的自來水旅程：用顯微鏡看清水質、調好<b>沉澱池</b>的閘門、打開<b>快濾筒室</b>的氣窗、找出「<b>二抽三送</b>」、讓<b>淨水池</b>把水送上 5 樓，最後把接力棒交給水庫。</p>
<p>地點：大內・山上（臺南市山上區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>一百年前，臺南人喝的自來水，是從山上來的。這裡是臺南水道：從曾文溪取水，弄乾淨以後，再用管子送到臺南市區。它 1922 年完工，現在是國定古蹟，也是山上花園水道博物館。跟著一滴曾文溪的水，走一趟百年前的自來水旅程。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・曾文溪：找乾淨的水</h3><p>1897 年，臺灣總督府的衛生顧問巴爾頓，和他的學生濱野彌四郎，來臺南調查：哪裡的水源多、水質好？最後，臺南水道從曾文溪取水。</p><p>為什麼？誰是巴爾頓？ 巴爾頓是臺灣總督府請來的衛生工程顧問，被叫做「臺灣自來水之父」。他的學生濱野彌四郎，後來負責蓋臺南水道，博物館裡有他的碑座。</p></li>
<li><h3>第 2 關・沉澱池：讓泥沙沉下去</h3><p>從曾文溪抽上來的水，混著很多泥沙。水先流進沉澱池：在池子裡慢慢流，泥沙就會沉到池底。水流得太快，泥沙來不及沉下去，就跟著跑掉了；水流得太慢，送去市區的水又不夠用。</p><p>為什麼？沉在池底的泥沙怎麼辦？ 泥沙越積越多，池子就變淺了。所以沉澱池要定期清掉池底的泥沙，才能一直用下去。</p></li>
<li><h3>第 3 關・快濾筒室：讓熱氣跑出去</h3><p>沉澱完的水，接著流進快濾筒室，經過一排排整齊的濾筒，把更小的髒東西濾掉。快濾筒室是紅磚房子，屋頂蓋得特別高。為什麼？因為熱空氣會往上跑，屋頂高，熱氣就能從上面散出去，屋子裡比較涼。</p><p>為什麼？濾筒在做什麼？ 水從濾筒裡流過，比較小的髒東西會被濾材擋住，有時候還要加藥，水就變得更乾淨。</p></li>
<li><h3>第 4 關・送出唧筒室：二抽三送</h3><p>水道的水，大部分時候是靠高低落差自己流：從高的地方，流到低的地方，不用電。只有兩個地方，水要往上爬，才用電的唧筒（抽水機）抽：一個是從曾文溪取水的第一唧筒井，一個是把水送上山的送出唧筒室。這叫做「二抽三送」。</p><p>為什麼？為什麼要把水送上山？ 山上的淨水池比市區高很多。水先存在高高的淨水池，再往下流，就能自己流到市區，不用一直用電抽。</p></li>
<li><h3>第 5 關・淨水池：不加壓送上 5 樓</h3><p>乾淨的水被送上山，存在淨水池裡。現在去淨水池區，要爬 189 階的階梯。淨水池在高高的山上，水往下流的力氣很大：不用加壓，就能把水送到臺南市區房子的 5 樓高。</p><p>為什麼？淨水池區還有什麼？ 還有量水器室，用來量送出去的水；淨水池旁邊的步道，還住著蝙蝠。去的時候小聲一點，不要吵到牠們。</p></li>
<li><h3>第 6 關・博物館：把棒子交下去</h3><p>臺南水道送水送了 60 年。後來烏山頭水庫、曾文水庫和潭頂淨水廠陸續蓋好，1982 年，水道把送水的工作交出去，功成身退。2005 年，它變成國定古蹟；修好以後，2019 年變成山上花園水道博物館，讓大家來看百年前的自來水。</p><p>為什麼？水道博物館可以看什麼？ 可以看百年前的快濾筒室、送出唧筒室這些紅磚房子，裡面的機器還保留著。還有濱野彌四郎的碑座，和一大片花園。</p></li>
</ol>

    function open(){if(run)return;run=true;lvl=0;var goal=reach(),tt=0;draw();
      anim(function(dt){tt+=dt;lvl=Math.min(goal,tt*3);draw();if(lvl>=goal){lvl=goal;run=false;draw();
        if(goal>=5){done=true;draw();lvDone(area,i,l,msg,'水送到 <b>'+goal+' 樓</b>了！');}else say(msg,'水只送到 <b>'+goal+' 樓</b>。淨水池要<b>再高一點</b>，往上拖。',1);return false}})}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){if(Math.abs(p.x-BT.x)<38&&Math.abs(p.y-BT.y)<20){open();return}
        if(!run&&Math.abs(p.x-(TX-16))<28&&Math.abs(p.y-TY)<26){hold=true}else if(!run)say(msg,'按住淨水池旁邊的<b>紅色把手</b>上下拖；再按「開水」。',1);return}
      if(t==='move'&&hold){TY=clamp(p.y,T0,T1);lvl=0;draw();return}
      if(t==='up')hold=false});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','山上的淨水池和市區的房子，按 Enter 把淨水池拉高再開水');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done&&!run){e.preventDefault();TY=T0+4;draw();open()}});
    later(function(){if(!run&&lvl===0)say(msg,'先按「<b>開水</b>」，看水能送到幾樓。')},5000);
  },

  /* 第 6 關：接力，把水道手上的接力棒交到一起跑的水庫手上 */
  baton:function(area,i,l){
    var t=0,B={x:0,y:0},hold=false,off=null,done=false,lane=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E8F0E0"><rect x="-400" y="150" width="1200" height="60" fill="#C8704A"/><g id="ln"></g><g id="rn"></g><g id="bt"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),ln=svg.querySelector('#ln'),rn=svg.querySelector('#rn'),bt=svg.querySelector('#bt');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function runner(x,y,c,ph,lab){var a=Math.sin(t*9+ph)*22;return '<g transform="translate('+f1(x)+' '+f1(y)+')"><path d="M0 -34L'+f1(a*.5)+' -14L'+f1(a*.7)+' 0M0 -34L'+f1(-a*.5)+' -14L'+f1(-a*.6)+' 0" stroke="#5A4E48" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M-9 -34Q-8 -56 2 -58Q12 -54 10 -34Z" fill="'+c+'"/><circle cx="3" cy="-66" r="9" fill="#E8B890"/><path d="M-6 -70Q0 -78 10 -70" stroke="#3A2E28" stroke-width="4" fill="none"/></g><text x="'+f1(x)+'" y="'+f1(y-82)+'" font-size="13" font-weight="700" fill="#2A2020" text-anchor="middle" stroke="#E8F0E0" stroke-width="3" paint-order="stroke">'+lab+'</text>'}
    function handB(){return {x:212+Math.sin(t*1.3)*14,y:118+Math.sin(t*2.1)*10}}
    function draw(){var y1=150+Math.abs(Math.sin(t*9))*-3,y2=150+Math.abs(Math.sin(t*9+1))*-3,hb=handB();
      ln.innerHTML=[0,1,2,3,4,5,6].map(function(k){var x=((k*60-t*160)%420+420)%420-50;return '<path d="M'+f1(x)+' 166h30" stroke="#fff" stroke-width="3"/>'}).join('');
      rn.innerHTML=runner(100,y1,BRICK,0,'臺南水道')+runner(196+Math.sin(t*1.3)*14,y2,'#4A86B8',1,'水庫・淨水廠')+
        '<path d="M102 '+f1(y1-50)+'L'+f1(hold?B.x-2:124)+' '+f1(hold?B.y:112)+'" stroke="#E8B890" stroke-width="4" stroke-linecap="round"/><path d="M'+f1(hb.x-14)+' '+f1(hb.y-10)+'L'+f1(hb.x)+' '+f1(hb.y)+'" stroke="#E8B890" stroke-width="4" stroke-linecap="round"/>'+
        (done?'':'<circle cx="'+f1(hb.x)+'" cy="'+f1(hb.y)+'" r="13" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>');
      var bx=done?hb.x:hold?B.x:124,by=done?hb.y:hold?B.y:112;
      bt.innerHTML='<g transform="translate('+f1(bx)+' '+f1(by)+') rotate(-30)"><rect x="-14" y="-4" width="28" height="8" rx="3" fill="#FFD040" stroke="#B8901E" stroke-width="1.4"/></g>';
      bar.style.width=(done?100:0)+'%'}
    draw();
    anim(function(dt){t+=dt;draw()});
    drag(svg,function(tt,p){if(done)return;
      if(tt==='down'){var bx=124,by=112;if(Math.hypot(p.x-bx,p.y-by)<28){hold=true;off={x:bx-p.x,y:by-p.y};B.x=bx;B.y=by}else say(msg,'按住水道手上的<b>黃色接力棒</b>。',1);return}
      if(tt==='move'&&hold){B.x=p.x+off.x;B.y=p.y+off.y;var h0=handB();if(Math.hypot(B.x-h0.x,B.y-h0.y)<18){hold=false;done=true;draw();lvDone(area,i,l,msg,'交棒成功！水庫一把抓住了！')}return}
      if(tt==='up'&&hold){hold=false;var hb=handB();if(Math.hypot(B.x-hb.x,B.y-hb.y)<26){done=true;draw();lvDone(area,i,l,msg,'交棒成功！');}else say(msg,'沒交到，棒子回到水道手上了。對準<b>水庫的手</b>（紅色虛線圈）再放開。',1)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','臺南水道和水庫在跑接力，按 Enter 交棒');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();done=true;draw();lvDone(area,i,l,msg,'交棒成功！')}});
    later(function(){if(!done)say(msg,'按住<b>黃色接力棒</b>，拖到藍衣服<b>水庫</b>的手上（紅色虛線圈）再放開。')},6000);
  }
};
</script>
