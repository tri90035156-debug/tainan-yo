<h1>牛番茄任務・蔬菜・官田牛番茄</h1>
<p>跟著<b>官田</b>種番茄的阿伯：把番茄苗接在<b>茄子的根</b>上、補好<b>網室</b>的破洞、讓番茄靠著吊繩長高、摘掉<b>側芽</b>、帶<b>熊蜂</b>幫花授粉，最後把牛番茄分好大小。</p>
<p>地點：官田（臺南市官田區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>官田除了菱角，也種很多牛番茄：又大又紅的番茄。官田大約有 45 公頃在種，是臺灣數一數二的產地。牛番茄怕熱，在臺灣是冬天最多。秋天種下小苗，冬天到春天採收。跟著種番茄的阿伯，從小苗一路種到採收。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・育苗場：接在茄子的根上</h3><p>番茄的小苗，先在育苗場長大。阿伯說：「我們的苗，下面是茄子的根。」這叫嫁接：把兩棵植物接成一棵。上面是番茄，會結番茄；下面是茄子的根，比較不怕青枯病，也比較不怕淹水。</p><p>為什麼？青枯病是什麼？ 青枯病是細菌造成的病，躲在土裡，從根跑進番茄裡。番茄會葉子還綠綠的就整棵垂下來、枯掉，所以叫青枯。茄子的根比較能擋住它。</p></li>
<li><h3>第 2 關・網室：把網子補好</h3><p>秋天，苗種進網室。網室是用細細的網子圍起來的房子。臺灣又熱又濕，番茄很容易生病、長蟲。網子可以把小蟲擋在外面，像小小的白色飛蟲粉蝨，牠會吸番茄的汁。</p><p>為什麼？為什麼要種在網室裡？ 臺灣又熱又濕，番茄容易生病、長蟲。網室把小蟲擋在外面，也比較不怕大雨打，番茄長得比較穩定。</p></li>
<li><h3>第 3 關・吊繩：讓番茄靠著繩子長高</h3><p>番茄苗一天一天長高。牛番茄會一直往上長，莖軟軟的，自己站不直。網室裡，每棵番茄旁邊都有一條從上面垂下來的吊繩。阿伯把番茄的莖一段一段靠到繩子上，番茄就沿著繩子往上長。</p><p>為什麼？為什麼番茄要靠著繩子長？ 番茄靠在繩子上，葉子比較曬得到太陽，風也吹得進來，比較不容易生病；果子掛在上面，也比較好採。</p></li>
<li><h3>第 4 關・側芽：找出偷偷長的側芽</h3><p>番茄長高了，葉子和莖的中間，會偷偷冒出小小的芽，叫側芽。側芽如果不摘，會長成新的枝，把番茄的養分分走，番茄就長不大。阿伯要把側芽摘掉，但是葉子和花要留著。</p><p>為什麼？側芽長在哪裡？ 側芽長在葉子和莖中間的夾縫，像 V 字的地方。它長得很快，所以種番茄要常常去看、常常摘。</p></li>
<li><h3>第 5 關・番茄花：熊蜂抖一抖</h3><p>番茄開了黃色的小花。花要授粉，才會長出番茄。番茄的花粉藏在花中間的黃色小管子裡，要震動才會掉出來。網室裡會放熊蜂：熊蜂抱住花，身體震動，把花粉抖出來。夏天網室裡太熱，番茄的花長不好，不容易結果；冬天比較涼，所以牛番茄冬天最多。</p><p>為什麼？沒有熊蜂怎麼辦？ 農民可以用電動的振動器幫花震一震，一個星期至少三次；也有人噴番茄生長素幫忙結果。臺大的研究用機器學熊蜂震動，震三次，結的番茄就和熊蜂幫忙的差不多。</p></li>
<li><h3>第 6 關・集貨場：分大小，送出去</h3><p>冬天，番茄紅了！採下來的番茄，送到集貨場。番茄要先分大小：一樣大的放一箱，才好賣，也比較好裝。分好以後，很多官田的番茄會坐卡車往北送，送到臺北的市場。</p><p>為什麼？番茄是蔬菜，還是水果？ 番茄從花長出來、裡面有種子，是植物的果實。可是在臺灣的蔬果市場，大番茄（像牛番茄）算蔬菜；小番茄算水果。</p></li>
</ol>

function decorate(){
  var r=rnd(29),p='',q='';
  function free(x,y){return STOPS.every(function(s){return Math.abs(s.x-x)>60||Math.abs(s.y-y)>64})}
  for(var x=292;x<700;x+=36){
    for(var y=90;y<450;y+=30){if(!free(x,y))continue;var x2=x+(r()-.5)*4;
      var plant='<path d="M'+f1(x2)+' '+(y+12)+'V'+(y-14)+'" stroke="'+LEAF2+'" stroke-width="2"/>'+tleaf(x2,y,200,.42)+tleaf(x2,y-8,-20,.42);
      p+=plant+(r()<.3?tflower(x2+4,y-2,.6):'');
      q+=plant+tomato(x2-5,y+6,4.6,r()<.75?RED:'#E8903A')+(r()<.5?tomato(x2+5,y-2,4.2,r()<.6?RED:'#7DB050'):'')}}
  map.querySelector('#frPast').innerHTML=p;
  map.querySelector('#frNow').innerHTML=q;
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function anim(fn){var raf=0,last=0,on=true;function step(now){if(!on)return;var dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(fn(dt)===false){on=false;return}raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step);loops.push(function(){on=false;cancelAnimationFrame(raf)});return function(){on=false;cancelAnimationFrame(raf)}}
// 一定要等的時間（later() 在「減少動態效果」時會變成 0）
function wait(fn,ms){var t=setTimeout(fn,ms);loops.push(function(){clearTimeout(t)})}
// 點到線段的距離
function segD(p,a,b){var dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy,t=L?clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/L,0,1):0;return Math.hypot(p.x-a.x-dx*t,p.y-a.y-dy*t)}

    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){lb.innerHTML=HX.map(function(x,k){return '<text x="'+x+'" y="114" font-size="15" font-weight="700" fill="#6C2024" text-anchor="middle">'+NM[k]+'：'+cnt[k]+' 顆</text>'}).join('');
      var h='';T.forEach(function(q){if(q.ok||q===cur)return;h+=tomato(q.x,q.y,TR[q.s])});
      if(drop)h+='<g opacity="'+f1(1-drop.t)+'">'+tomato(drop.x,drop.y+drop.t*10,TR[drop.q.s]*(1-drop.t*.4))+'</g>';
      if(cur)h+=tomato(cur.x,cur.y,TR[cur.s]);
      tm.innerHTML=h;bar.style.width=(done?100:n/6*90)+'%'}
    draw();
    function put(q,k){q.ok=true;cnt[k]++;n++;drop={q:q,x:HX[k],y:HY,t:0};
      anim(function(dt){drop.t=Math.min(1,drop.t+dt*2.5);draw();if(drop.t>=1){drop=null;draw();return false}});
      if(n>=6){done=true;draw();lvDone(area,i,l,msg,'6 顆都分好了！小的 2 顆、中的 2 顆、大的 2 顆。');return}
      say(msg,n===1?'剛剛好！咚，掉進'+NM[k]+'的箱子。再分下一顆。':'剛剛好，是'+NM[k]+'的！')}
    function back(q){q.x=q.hx;q.y=q.hy}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){var best=null,bd=28;T.forEach(function(q){if(q.ok)return;var d=dist(p,q);if(d<bd){bd=d;best=q}});
        if(!best){say(msg,'按住下面的一顆<b>番茄</b>，拖到上面的洞。',1);return}cur=best;off={x:cur.x-p.x,y:cur.y-p.y};draw();return}
      if(t==='move'&&cur){cur.x=clamp(p.x+off.x,16,304);cur.y=clamp(p.y+off.y,20,170);draw();return}
      if(t==='up'&&cur){var q=cur;cur=null;var k=-1;HX.forEach(function(x,j){if(dist(q,{x:x,y:HY})<HR[j]+8)k=j});
        if(k<0){if(q.y<110)say(msg,'要放在<b>洞</b>的上面。',1);back(q);draw();return}
        if(q.s>k){say(msg,'卡住了！這顆番茄比較<b>大</b>，'+NM[k]+'的洞放不進去。',1);back(q);draw();return}
        if(q.s<k){say(msg,'太鬆了！這顆比較<b>小</b>，會在'+NM[k]+'的洞裡滾來滾去。找<b>剛剛好</b>的洞。',1);back(q);draw();return}
        put(q,k)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','分級板有小、中、大三個洞，下面有 6 顆番茄，按 Enter 分好一顆');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();for(var k=0;k<6;k++)if(!T[k].ok){put(T[k],T[k].s);break}}});
    later(function(){if(!done&&n===0)say(msg,'比比看：番茄和洞，哪一個<b>一樣大</b>？')},7000);
  }
};
</script>
