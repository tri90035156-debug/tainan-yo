<h1>毛豆任務・雜糧・新市毛豆</h1>
<p>跟著新市的豆農阿伯認識<b>毛豆</b>：從豆莢的尾巴把豆子擠出來、看天氣卡挑一天播種、看三塊田決定<b>灌水</b>還是<b>排水</b>、數一數有幾成豆莢<b>八分飽滿</b>、扳動選別機的擋板分出好毛豆，再畫出日本人吃的冷凍毛豆有將近一半是臺灣來的。</p>
<p>地點：新市（臺南市新市區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>新市被叫做毛豆的故鄉，是臺南種很多毛豆的地方。新市的毛豆一年種兩次：春天一次，秋天一次。臺灣的毛豆，主要在 11、12 月和 4 到 6 月收成。很多毛豆會冷凍起來，坐船賣到日本。跟著新市的豆農阿伯，從毛豆田一路走到新市區農會。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・毛豆田：把毛豆擠出來</h3><p>阿伯摘了幾個豆莢給你。豆莢上有一層細細的絨毛，所以叫毛豆。毛豆其實就是還嫩嫩的大豆。豆莢裡的豆子長到八分飽滿，就可以摘了。日本人叫它枝豆。如果不摘，等豆莢乾了才收，就是黃豆這種乾的大豆。</p><p>為什麼？毛豆、黃豆、黑豆是不同的豆子嗎？ 它們都是大豆這一種植物。嫩嫩的時候摘，叫毛豆。再等 25 到 35 天，葉子掉光、豆莢乾成褐色，收的就是乾的大豆。大豆的皮有黃色、綠色、黑色、茶褐色（咖啡色），下營的黑豆就是黑皮的大豆。</p></li>
<li><h3>第 2 關・播種：選一天播種</h3><p>秋天的毛豆，在夏天快結束的時候播種（大約 8 月下旬到 9 月中旬）。播種用曳引機（田裡用來拉機器的大車）拉著播種機，在田裡堆出一條一條的畦，一個洞放一顆種子。可是要挑對日子：種子怕土裡的水太多。</p><p>為什麼？為什麼秋天播種要避開下雨？ 種子要喝水才會發芽，可是土裡的水太多也不行。秋天播種的時候如果連續下雨、田淹水，種子會泡爛，芽也出不來。</p></li>
<li><h3>第 3 關・畦溝：灌水還是排水</h3><p>毛豆長在畦上，兩條畦中間低低的地方叫畦溝。要給水的時候，只灌畦溝。水灌到畦高的八分就停，剩下的水會像紙巾吸水一樣，自己慢慢往上滲，這叫毛細管作用。毛豆要水，但是不能泡在水裡。</p><p>為什麼？為什麼水不要灌滿整個畦？ 毛豆要水，但是不能泡水。水只灌在畦溝，灌到畦高的八分，剩下的水會從土裡慢慢往上滲到根旁邊。開花的時候和豆莢快熟的時候，田要乾一點；下大雨要趕快排水。</p></li>
<li><h3>第 4 關・採收：數一數，可以採了嗎</h3><p>毛豆長大了。什麼時候採呢？要看一整株有多少豆莢鼓起來。一整株差不多十個裡有九個（85% 以上）的豆莢都八分飽滿，就可以採了。太早，豆子還小；太晚，豆莢會變黃，就不好賣了。可以採了，就叫大大的聯合收穫機來。</p><p>為什麼？為什麼要等八分飽滿才採？ 太早採，豆子還小小的；太晚採，豆莢會變黃，就不好賣了。所以要等一整株大部分的豆莢都鼓鼓的。採收的時候，大大的聯合收穫機會在晚上到清晨開進田裡採。</p></li>
<li><h3>第 5 關・冷凍加工廠：分出好的毛豆</h3><p>毛豆採下來，坐上貨車，幾個小時內就要送到冷凍加工廠。很多毛豆是種之前就和工廠講好的，叫做契作。工廠裡的色彩選別機，會把黃掉的、扁扁的毛豆挑出去。好的毛豆先殺菁，再冷凍起來。</p><p>為什麼？為什麼採下來幾個小時內就要冷凍？ 毛豆採下來以後，放久了顏色、甜味和香味都會變差。所以要很快送到工廠，殺菁、冷凍，讓毛豆的顏色、甜度、風味都留在最好的時候。</p></li>
<li><h3>第 6 關・新市區農會：日本人吃的毛豆</h3><p>最後，來到新市區農會。毛豆不容易保持新鮮，所以農會把毛豆做成毛豆麵、毛豆香腸，還有茶豆做的點心。臺灣的毛豆很多賣到日本，被叫做臺灣綠金。在日本買的冷凍毛豆裡，臺灣來的有多少呢？</p><p>為什麼？為什麼臺灣的毛豆在日本賣得這麼好？ 臺灣的毛豆品質好，加工的技術也好。採下來幾個小時內就送到工廠，挑過、殺菁、冷凍，顏色和甜味都留住了，日本人很喜歡。</p></li>
</ol>

function anim(fn){var raf=0,last=0,on=true;function step(now){if(!on)return;var dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(fn(dt)===false){on=false;return}raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step);loops.push(function(){on=false;cancelAnimationFrame(raf)});return function(){on=false;cancelAnimationFrame(raf)}}

      if(gone===1&&!told){told=1;say(msg,'啵！豆子從另一頭跳出來了。手指<b>繼續往前推</b>！')}

        if(pi>=N.length-1){wait(function(){done=true;busy=false;draw();lvDone(area,i,l,msg,'3 個豆莢都擠完了！碗裡裝滿綠綠的毛豆。')},700);return}
        say(msg,'這個豆莢擠完了！阿伯又遞來一個。');
        wait(function(){pi++;gone=0;busy=false;draw()},800)}
      draw()}
    drag(svg,function(t,p){if(done||busy)return;
      if(t==='down'){
        if(Math.abs(p.y-PY)<36&&p.x>tail()-30&&p.x<bx(gone)-4){push=true;fx=p.x;draw();return}

        say(msg,'手指放在豆莢的<b>尾巴</b>（紅色虛線圈圈），再往右推。',1);return}
      if(t==='move'&&push){
        if(Math.abs(p.y-PY)>46){push=false;draw();say(msg,'手指滑出豆莢了，再從尾巴推一次。',1);return}
        fx=Math.max(fx,p.x);while(push&&gone<N[pi]&&fx>bx(gone)-4)pop();return}
      if(t==='up'&&push){push=false;draw();if(gone<N[pi]&&gone>0)say(msg,'還有豆子在裡面，再從<b>尾巴</b>往前推。')}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','一個豆莢和一個碗，按 Enter 擠出一顆豆子');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done&&!busy){e.preventDefault();pop()}});
    later(function(){if(!done&&!got&&!fly.length)say(msg,'手指按在豆莢<b>左邊的尾巴</b>，不要放開，慢慢<b>往右</b>滑到另一頭。')},7000);
  },

  /* 第 2 關：看 6 天的天氣卡，點一天播種；播下去以後連續下雨，種子會泡爛 */
  sow:function(area,i,l){
    var D=['sun','rain','storm','rain','sun','sun'],NM={sun:'晴',rain:'雨',storm:'豪雨'},G=166,busy=false,done=false,lit=-1,wl=0,seed='',sp=0,rain='',tries=0;
    function cx(k){return 40+48*k}
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E6F0F4"><rect x="-400" y="'+G+'" width="1200" height="60" fill="'+SOIL2+'"/>'+
      '<g id="wt"></g><path d="M70 '+G+'L90 132H230L250 '+G+'Z" fill="'+SOIL+'" stroke="'+SOIL2+'" stroke-width="1.4"/><g id="sd"></g><g id="rn"></g><g id="cd"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),wt=svg.querySelector('#wt'),sd=svg.querySelector('#sd'),rn=svg.querySelector('#rn'),cd=svg.querySelector('#cd');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){var c='';
      D.forEach(function(k,j){var x=cx(j),on=j===lit;
        c+='<rect x="'+(x-21)+'" y="14" width="42" height="74" rx="8" fill="'+(on?'#FFF1C8':'#FFF8EC')+'" stroke="'+(on?'#DB2E27':'#BD9558')+'" stroke-width="'+(on?3:1.4)+'"/>'+
          '<text x="'+x+'" y="32" font-size="13" font-weight="700" fill="#6C2024" text-anchor="middle">第'+(j+1)+'天</text>'+wx(x,52,k,.85)+
          '<text x="'+x+'" y="82" font-size="14" font-weight="900" fill="'+(k==='sun'?'#B8740A':'#3E6E98')+'" text-anchor="middle">'+NM[k]+'</text>'});
      cd.innerHTML=c;
      wt.innerHTML=wl>0?'<rect x="40" y="'+f1(G-wl)+'" width="240" height="'+f1(wl)+'" fill="'+WATER+'" opacity=".9"/>':'';
      var h='';
      if(seed){var sx=160,sy=146;
        if(sp>0)h+='<path d="M'+sx+' '+sy+'V'+f1(sy-6-sp*22)+'" stroke="'+GRN2+'" stroke-width="3" stroke-linecap="round"/><path d="M'+sx+' '+f1(sy-6-sp*22)+'q-12 -2 -14 -10q10 0 14 10zM'+sx+' '+f1(sy-6-sp*22)+'q12 -2 14 -10q-10 0 -14 10z" fill="'+GRN+'" opacity="'+f1(Math.min(1,sp*2))+'"/>';
        h+='<ellipse cx="'+sx+'" cy="'+sy+'" rx="7" ry="5" fill="'+(seed==='rot'?'#6A4A2A':'#E8D49A')+'" stroke="'+(seed==='rot'?'#3E2A1A':'#A8944A')+'" stroke-width="1.2"/>';
        if(seed==='rot')h+='<text x="'+sx+'" y="'+(sy-12)+'" font-size="14" font-weight="900" fill="#6A4A2A" text-anchor="middle">爛掉了</text>'}
      if(wl>G-132)h+='<rect x="40" y="'+f1(G-wl)+'" width="240" height="'+f1(wl-(G-132)+2)+'" fill="'+WATER+'" opacity=".6"/>';
      sd.innerHTML=h;
      var r='';if(rain){var n=rain==='storm'?14:7;for(var j=0;j<n;j++){var x=70+j*(180/n)+(j%2)*8;r+='<path d="M'+f1(x)+' 100l-4 12" stroke="'+WATER2+'" stroke-width="2" stroke-linecap="round"/>'}}
      rn.innerHTML=r;bar.style.width=(done?100:sp*90)+'%'}
    draw();
    function plantOn(k){busy=true;seed='ok';sp=0;wl=0;tries++;
      var bad=false;for(var j=k;j<Math.min(D.length,k+3);j++)if(D[j]!=='sun')bad=true;
      say(msg,'第 '+(k+1)+' 天播下種子……看看之後的天氣。');
      var j=k;
      (function day(){if(j>=D.length||j>k+3){end();return}
        lit=j;rain=D[j]==='sun'?'':D[j];
        if(D[j]==='storm')wl+=16;else if(D[j]==='rain')wl+=10;else wl=Math.max(0,wl-8);
        draw();j++;wait(day,650)})();
      function end(){rain='';
        if(bad){seed='rot';draw();
          say(msg,D[k]==='sun'?'第 '+(k+1)+' 天是晴天，可是播下去以後就<b>連續下雨</b>，田淹水了。種子泡爛，芽出不來。往後面看一看，再選一天。':'下雨天播種，土太濕，種子<b>泡爛</b>了。再選一天。',1);
          wait(function(){seed='';wl=0;lit=-1;busy=false;draw()},1800);return}
        lit=k;draw();say(msg,'播下去以後都是晴天！過了幾天……');
        anim(function(dt){sp=Math.min(1,sp+dt/1.2);draw();if(sp>=1){done=true;draw();lvDone(area,i,l,msg,'第 '+(k+1)+' 天播種，之後沒有連續下雨。芽冒出土了！');return false}})}}
    drag(svg,function(t,p){if(t!=='down'||busy||done)return;
      var b=-1,bd=28;D.forEach(function(k,j){var d=Math.abs(p.x-cx(j));if(d<bd&&p.y>8&&p.y<96){bd=d;b=j}});
      if(b<0){say(msg,'點上面的一張<b>天氣卡</b>，選那一天播種。',1);return}
      plantOn(b)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','六天的天氣卡和田，按 Enter 在第 5 天播種');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!busy&&!done){e.preventDefault();plantOn(4)}});
    later(function(){if(!done&&!tries)say(msg,'第 1 天是晴天，可是之後呢？播下去的那幾天，最好都<b>不要下雨</b>。')},8000);
  },

  /* 第 3 關：看三塊田的樣子，缺水的往上滑灌水（灌到八分），淹水的往下滑排水，剛好的不要動 */
  ditch:function(area,i,l){
    var G=160,TOP=118,LINE=f1(G-(G-TOP)*.8),busy=false,done=false,p0=null,k0=-1;
    var F=[{x:56,st:'dry',lab:'發芽一星期',w:G,goal:'in',wet:0},{x:160,st:'flood',lab:'開花時下大雨',w:108,goal:'out',wet:1},{x:264,st:'ok',lab:'開花時',w:G,goal:null,wet:0}];
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E8F0F2"><defs>'+F.map(function(f,k){return '<clipPath id="rc'+k+'"><path d="M'+(f.x-30)+' '+G+'L'+(f.x-20)+' '+TOP+'H'+(f.x+20)+'L'+(f.x+30)+' '+G+'Z"/></clipPath>'}).join('')+'</defs>'+
      '<rect x="-400" y="'+G+'" width="1200" height="60" fill="'+SOIL2+'"/><g id="fd"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),fd=svg.querySelector('#fd');

    function draw(){var h='';
      F.forEach(function(f,k){var x=f.x,dry=f.st==='dry'&&!f.fixed;
        h+='<text x="'+x+'" y="30" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle">'+f.lab+'</text>';
        if(f.w<G)h+='<rect x="'+(x-48)+'" y="'+f1(f.w)+'" width="96" height="'+f1(G-f.w)+'" fill="'+WATER+'"/>';
        h+='<path d="M'+(x-30)+' '+G+'L'+(x-20)+' '+TOP+'H'+(x+20)+'L'+(x+30)+' '+G+'Z" fill="'+(dry?'#D8C08A':SOIL)+'" stroke="'+SOIL2+'" stroke-width="1.2"/>';
        if(f.wet>0)h+='<rect x="'+(x-32)+'" y="'+f1(G-(G-TOP)*f.wet)+'" width="64" height="'+f1((G-TOP)*f.wet)+'" fill="'+WET+'" opacity=".45" clip-path="url(#rc'+k+')"/>';
        if(dry)h+='<path d="M'+(x-12)+' '+(TOP+4)+'l4 8l-3 9M'+(x+8)+' '+(TOP+6)+'l-3 9l4 7" stroke="'+SOIL2+'" stroke-width="1.4" fill="none"/>';
        h+=f.st==='dry'?plant(x,TOP,.55,{droop:dry}):plant(x,TOP,.75)+'<circle cx="'+(x-8)+'" cy="'+(TOP-22)+'" r="2.6" fill="#B888D0"/><circle cx="'+(x+7)+'" cy="'+(TOP-30)+'" r="2.6" fill="#B888D0"/>';
        if(f.w<TOP+1)h+='<rect x="'+(x-48)+'" y="'+f1(f.w)+'" width="96" height="'+f1(TOP+4-f.w)+'" fill="'+WATER+'" opacity=".7"/>';
        h+='<path d="M'+(x-48)+' '+LINE+'H'+(x+48)+'" stroke="#DB2E27" stroke-width="1.4" stroke-dasharray="4 3" opacity=".8"/>';
        if(f.fixed)h+='<circle cx="'+x+'" cy="54" r="11" fill="#3F6B2E"/><path d="M'+(x-5)+' 54l4 4l7 -8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
        else if(f.goal)h+='<g opacity=".6"><path d="M'+x+' 42V66M'+(x-7)+' 50L'+x+' 42L'+(x+7)+' 50M'+(x-7)+' 58L'+x+' 66L'+(x+7)+' 58" stroke="#6C2024" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>'});
      h+='<text x="10" y="'+(+LINE-4)+'" font-size="13" font-weight="700" fill="#DB2E27" stroke="#E8F0F2" stroke-width="3" paint-order="stroke">八分</text>';
      fd.innerHTML=h;var n=F.filter(function(f){return f.fixed}).length;bar.style.width=(done?100:n/2*90)+'%'}
    draw();
    function check(){if(F[0].fixed&&F[1].fixed){done=true;draw();lvDone(area,i,l,msg,'缺水的灌到紅色虛線，淹水的排掉了。三塊田的毛豆都好好的！')}}
    function act(k,dir){var f=F[k];
      if(f.fixed){say(msg,'這塊已經照顧好了，看看<b>別塊</b>田。');return}
      if(!f.goal){say(msg,'這塊開花了，土乾乾的剛剛好。開花的時候田要<b>乾一點</b>，不用灌水也不用排水。',1);return}
      if(dir!==f.goal){say(msg,f.st==='dry'?'這塊的土乾到裂開了，豆苗垂著頭。它要的是<b>水</b>：在這塊田上<b>往上滑</b>灌水。':'這塊已經淹水了！再灌水，根會泡壞。在這塊田上<b>往下滑</b>把水排掉。',1);return}
      busy=true;var t=0;
      if(dir==='in'){say(msg,'水從畦溝流進來……灌到<b>紅色虛線</b>就停。');

          if(t>=2){f.fixed=true;busy=false;draw();say(msg,'看！水從土裡<b>慢慢往上滲</b>，畦面也濕了，豆苗抬起頭來。');check();return false}})}
      else{say(msg,'打開出水口，水慢慢排出去……');

    drag(svg,function(t,p){if(done||busy)return;
      if(t==='down'){p0=p;k0=-1;var bd=52;F.forEach(function(f,k){var d=Math.abs(p.x-f.x);if(d<bd){bd=d;k0=k}});return}
      if(t==='up'&&p0){var dy=p.y-p0.y,k=k0;p0=null;if(k<0)return;
        if(Math.abs(dy)<20){say(msg,'在田上<b>往上滑</b>是灌水，<b>往下滑</b>是排水。先看看每塊田的樣子。',1);return}
        act(k,dy<0?'in':'out')}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','三塊毛豆田，按 Enter 幫下一塊田灌水或排水');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!busy&&!done){e.preventDefault();var k=F[0].fixed?1:0;act(k,F[k].goal)}});
    later(function(){if(!done&&!F[0].fixed&&!F[1].fixed)say(msg,'左邊的土<b>裂開</b>了，中間的<b>淹水</b>了，右邊的開花了、乾乾的。哪一塊要水？哪一塊水太多？')},8000);
  },

  /* 第 4 關：點每一個鼓鼓的豆莢數一數，看有幾成飽滿，再決定叫收穫機還是再等幾天 */
  count:function(area,i,l){
    var COL=[112,208],ROW=[34,64,94,124,154],R=[[1,1,0,1,1,0,1,1,0,1],[1,1,1,1,0,1,1,1,1,1]],rd=0,mk={},n=0,done=false,ask=null,busy=false,hx=-1;
    function pos(k){return {x:COL[k%2],y:ROW[Math.floor(k/2)]}}
    function need(){return R[rd].filter(function(v){return v}).length}
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EAF4EE"><rect x="-400" y="176" width="1200" height="60" fill="'+SOIL+'"/>'+
      '<path d="M160 180V18" stroke="'+GRN2+'" stroke-width="4" stroke-linecap="round"/>'+ROW.map(function(y){return '<path d="M160 '+(y+6)+'L136 '+y+'M160 '+(y+6)+'L184 '+y+'" stroke="'+GRN2+'" stroke-width="2"/>'}).join('')+
      leaf(146,20,-30)+leaf(174,16,30)+leaf(150,108,-40)+leaf(170,140,40)+'<g id="pd"></g><g id="hv"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),pd=svg.querySelector('#pd'),hv=svg.querySelector('#hv');

    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){var h='';
      for(var k=0;k<10;k++){var p=pos(k),L=k%2===0;h+=pod(p.x,p.y,1,{n:3,flat:!R[rd][k],rot:L?180:0});
        if(mk[k]){var cx=L?p.x-46:p.x+46;h+='<circle cx="'+cx+'" cy="'+p.y+'" r="9" fill="#3F6B2E"/><path d="M'+(cx-4)+' '+p.y+'l3 3l6 -7" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>'}}
      pd.innerHTML=h;
      hv.innerHTML=hx>=0?harvester(hx,176,1.1,{night:1}):'';
      bar.style.width=(done?100:(rd*.5+n/need()*.4)*90)+'%'}
    draw();
    function nearest(p){var b=-1,bd=16;for(var k=0;k<10;k++){var q=pos(k),d=Math.hypot(Math.max(0,Math.abs(p.x-q.x)-26),p.y-q.y);if(d<bd){bd=d;b=k}}return b}
    function choose(){if(ask)return;
      say(msg,'數好了！10 個裡有 <b>'+n+' 個</b>鼓起來。要叫收穫機來採，還是再等幾天？');
      ask=document.createElement('div');ask.className='opts';
      [['叫收穫機',1],['再等幾天',0]].forEach(function(a){var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=a[0];tap(b,function(){answer(a[1])});ask.appendChild(b)});
      msg.after(ask);into(ask)}
    function answer(go){if(busy||done)return;
      if(rd===0){if(go){say(msg,'才<b>十個裡有七個</b>，還不到九個。現在採，很多豆子還<b>小小的</b>。',1);return}
        ask.remove();ask=null;busy=true;say(msg,'對！才十個裡有七個，豆子再長大一點。過了幾天……');
        wait(function(){rd=1;mk={};n=0;busy=false;draw();say(msg,'過了幾天，再<b>數一次</b>鼓鼓的豆莢。')},1300);return}
      if(!go){say(msg,'已經<b>十個裡有九個</b>了，夠了。再等下去，豆莢會<b>變黃</b>，就不好賣了。',1);return}
      ask.remove();ask=null;busy=true;say(msg,'十個裡有九個，可以採了！晚上，收穫機開進田裡……');
      svg.style.background='#2E3A5A';fitStage();hx=380;
      anim(function(dt){hx-=90*dt;draw();if(hx<200){done=true;draw();lvDone(area,i,l,msg,'十個有九個鼓起來，夠了！晚上，大大的收穫機開進田裡採毛豆。');return false}})}
    function hit(k){if(busy||done||ask)return;
      if(!R[rd][k]){say(msg,'這個扁扁的，豆子還沒長大，<b>不算</b>。',1);return}
      if(mk[k]){say(msg,'這個數過了，找<b>別的</b>鼓鼓的豆莢。',1);return}
      mk[k]=1;n++;draw();
      if(n>=need()){choose();return}
      say(msg,'數到 <b>'+n+'</b> 個鼓鼓的。')}
    drag(svg,function(t,p){if(t!=='down')return;var k=nearest(p);if(k<0){if(!ask&&!busy&&!done)say(msg,'點一個<b>豆莢</b>。鼓鼓的才算。',1);return}hit(k)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','一株毛豆有十個豆莢，按 Enter 數下一個鼓鼓的豆莢');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!busy&&!done){e.preventDefault();if(ask){answer(rd);return}for(var k=0;k<10;k++)if(R[rd][k]&&!mk[k]){hit(k);return}}});
    later(function(){if(!done&&!n&&!rd)say(msg,'鼓鼓的豆莢有一顆一顆的豆子形狀；扁扁的豆莢中間只有一條線。點鼓鼓的！')},8000);
  },

  /* 第 5 關：毛豆一個一個掉下來，點畫面扳中間的擋板，好的送左邊、黃的扁的送右邊 */
  sorter:function(area,i,l){
    var Q=['g','g','y','g','f','g','g','y','g','f','g','g'],it=[],flap=-1,ok=0,T=1.2,done=false,bad=0,taps=0,first={};
    var PV={x:160,y:100},BIN={'-1':{x:72,y:150},'1':{x:248,y:150}};
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EEF2F4"><rect x="-400" y="182" width="1200" height="40" fill="#C8CED2"/>'+
      '<path d="M104 4H216L192 30H128Z" fill="#B8C4CA" stroke="'+STEEL2+'" stroke-width="1.4"/><text x="236" y="46" font-size="13" font-weight="700" fill="#3E4A52" text-anchor="middle">收穫機</text><text x="236" y="62" font-size="13" font-weight="700" fill="#3E4A52" text-anchor="middle">採來的</text>'+
      '<path d="M128 30V84M192 30V84" stroke="'+STEEL2+'" stroke-width="2.4"/>'+
      '<rect x="36" y="148" width="72" height="34" rx="4" fill="#DCEFD0" stroke="#3F6B2E" stroke-width="1.6"/><text x="72" y="170" font-size="14" font-weight="900" fill="#3F6B2E" text-anchor="middle">好毛豆</text>'+
      '<rect x="212" y="148" width="72" height="34" rx="4" fill="#F2E4D0" stroke="#A8643A" stroke-width="1.6"/><text x="248" y="170" font-size="14" font-weight="900" fill="#A8643A" text-anchor="middle">挑出去</text>'+
      '<text x="46" y="100" font-size="13" fill="#3F6B2E" text-anchor="middle">去殺菁、冷凍</text>'+
      '<g id="it"></g><g id="fp"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),ig=svg.querySelector('#it'),fp=svg.querySelector('#fp');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){
      ig.innerHTML=it.map(function(o){return pod(o.x,o.y,.9,{n:3,yel:o.k==='y',flat:o.k==='f'})}).join('');
      fp.innerHTML='<path d="M'+PV.x+' '+PV.y+'L'+(PV.x+flap*46)+' '+(PV.y+34)+'" stroke="#DB2E27" stroke-width="7" stroke-linecap="round"/><circle cx="'+PV.x+'" cy="'+PV.y+'" r="6" fill="#6C2024"/>';
      var f=it.filter(function(o){return o.ph==='fall'})[0];svg.dataset.k=f?f.k:'';svg.dataset.flap=flap;
      bar.style.width=(done?100:ok/12*90)+'%'}
    draw();
    var gap=.4;
    anim(function(dt){if(done)return false;
      gap-=dt;if(gap<=0&&Q.length&&it.filter(function(o){return o.ph==='fall'}).length===0){it.push({k:Q.shift(),x:160,y:8,ph:'fall'});gap=T}
      it.forEach(function(o){
        if(o.ph==='fall'){o.y+=62*dt;if(o.y>=PV.y-6){o.ph='slide';o.dir=flap;o.t=0;o.x0=o.x;o.y0=o.y}}
        else if(o.ph==='slide'){o.t+=dt/.7;var b=BIN[o.dir],t=Math.min(1,o.t);o.x=o.x0+(b.x-o.x0)*t;o.y=o.y0+(b.y-o.y0)*t;if(o.t>=1)land(o)}});
      it=it.filter(function(o){return o.ph!=='in'});
      draw();
      if(!Q.length&&!it.length&&ok>=12){done=true;draw();lvDone(area,i,l,msg,'12 個都分好了！好的毛豆送去殺菁、冷凍，顏色和甜味都留住了。');return false}});
    function land(o){o.ph='in';var good=o.k==='g',right=good?o.dir===-1:o.dir===1;
      if(right){ok++;
        if(!good&&!first.bad){first.bad=1;say(msg,'挑出去了！'+(o.k==='y'?'黃掉的':'扁扁的')+'毛豆不能送去冷凍。')}
        else if(ok===6)say(msg,'分好一半了，繼續！');
        if(ok>=6)T=1;return}
      bad++;Q.push(o.k);
      say(msg,good?'這個綠綠鼓鼓的是<b>好毛豆</b>，被挑出去太可惜了！好的要送到<b>左邊</b>。等一下它會再來一次。':(o.k==='y'?'黃掉的':'扁扁的')+'毛豆跑進好毛豆裡了！看到它的時候，<b>點畫面</b>把擋板扳到<b>右邊</b>。等一下它會再來一次。',1)}
    function flip(){flap=-flap;taps++;draw()}
    drag(svg,function(t,p){if(t==='down'&&!done)flip()});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','毛豆掉下來的選別機，按 Enter 扳動擋板');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();flip()}});
    later(function(){if(!done&&!taps)say(msg,'擋板現在往<b>左</b>。看到<b>黃掉的</b>或<b>扁扁的</b>掉下來，就趕快點一下畫面，把擋板扳到右邊。')},5000);
  },

  /* 第 6 關：按住圓餅圖繞著拖，把綠色（臺灣來的）拖到將近一半 */
  pie:function(area,i,l){
    var C={x:104,y:98},R=62,a=.1,down=false,done=false,tries=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F4EEE2"><rect x="-400" y="178" width="1200" height="40" fill="#E2D4B8"/>'+
      '<text x="238" y="38" font-size="15" font-weight="900" fill="#2A2020" text-anchor="middle">日本買的</text><text x="238" y="56" font-size="15" font-weight="900" fill="#2A2020" text-anchor="middle">冷凍毛豆</text>'+
      '<rect x="188" y="70" width="14" height="14" rx="3" fill="#6FA84A"/><text x="208" y="82" font-size="14" fill="#2A2020">臺灣來的</text>'+
      '<rect x="188" y="92" width="14" height="14" rx="3" fill="#D8D0C4"/><text x="208" y="104" font-size="14" fill="#2A2020">別的地方來的</text>'+
      '<g id="pc"></g><text id="pt" x="238" y="142" font-size="22" font-weight="900" fill="#3F6B2E" text-anchor="middle"></text></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),pc=svg.querySelector('#pc'),pt=svg.querySelector('#pt');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function ept(f,r){var th=f*2*Math.PI;return {x:C.x+r*Math.sin(th),y:C.y-r*Math.cos(th)}}
    function draw(){var h='<circle cx="'+C.x+'" cy="'+C.y+'" r="'+R+'" fill="#D8D0C4" stroke="#fff" stroke-width="2"/>';
      if(a>=.995)h+='<circle cx="'+C.x+'" cy="'+C.y+'" r="'+R+'" fill="#6FA84A"/>';
      else if(a>.005){var e=ept(a,R);h+='<path d="M'+C.x+' '+C.y+'L'+C.x+' '+(C.y-R)+'A'+R+' '+R+' 0 '+(a>.5?1:0)+' 1 '+f1(e.x)+' '+f1(e.y)+'Z" fill="#6FA84A"/>'}
      for(var k=0;k<10;k++){var q=ept(k/10,R),q2=ept(k/10,R-8);h+='<path d="M'+f1(q2.x)+' '+f1(q2.y)+'L'+f1(q.x)+' '+f1(q.y)+'" stroke="#fff" stroke-width="1.6"/>'}
      h+='<path d="M'+C.x+' '+(C.y-R-6)+'V'+(C.y+R+6)+'" stroke="#6C2024" stroke-width="1.6" stroke-dasharray="4 3"/><text x="'+(C.x-6)+'" y="'+(C.y-R-10)+'" font-size="13" font-weight="700" fill="#6C2024" text-anchor="end">一半</text>';
      var e2=ept(a,R);h+='<circle cx="'+f1(e2.x)+'" cy="'+f1(e2.y)+'" r="11" fill="#DB2E27" stroke="#fff" stroke-width="3"/>';
      if(done)h+='<text x="'+(C.x+24)+'" y="'+(C.y+6)+'" font-size="16" font-weight="900" fill="#fff" text-anchor="middle" stroke="#3F6B2E" stroke-width="3" paint-order="stroke">臺灣</text>';
      pc.innerHTML=h;pt.textContent=done?'將近一半':'約 '+Math.round(a*100)+'%';
      bar.style.width=(done?100:Math.min(a/.45,1)*60)+'%'}
    draw();
    function setA(p){var th=Math.atan2(p.x-C.x,-(p.y-C.y));if(th<0)th+=2*Math.PI;var n=th/(2*Math.PI);
      if(a>.8&&n<.2)n=1;else if(a<.2&&n>.8)n=0;a=clamp(n,0,1);draw()}
    function judge(){tries++;
      if(a>=.4&&a<=.5){done=true;a=.45;draw();lvDone(area,i,l,msg,'對！日本買的冷凍毛豆，大約 45% 是臺灣來的，將近一半！');return}
      if(a>.5)say(msg,'超過<b>一半</b>的虛線了。<b>將近一半</b>是差一點點就到一半，再少一點。',1);
      else if(a>=.3)say(msg,'很接近了！再多一點點，靠近<b>一半</b>的虛線，但不要超過。',1);
      else say(msg,'還太少了。<b>將近一半</b>是差一點點就到中間那條<b>一半</b>的虛線。',1)}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){if(dist(p,C)<R+30){down=true;setA(p)}else say(msg,'按住左邊的<b>圓餅圖</b>，繞著圓圈拖。',1);return}
      if(t==='move'&&down){setA(p);return}
      if(t==='up'&&down){down=false;judge()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','圓餅圖，按 Enter 把臺灣來的毛豆設成將近一半');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();a=.45;draw();judge()}});
    later(function(){if(!done&&!tries)say(msg,'紅色的圓點在圓圈上。按住它，<b>順著圓圈</b>往右下拖，綠色就會變多。')},7000);
  }
};
</script>
