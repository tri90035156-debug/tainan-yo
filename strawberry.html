<script>

/* ---------- 插畫元件 ---------- */
var K='#2A2020',NS='http://www.w3.org/2000/svg';
var SRED='#E0303A',SREDD='#A21E28',SWHT='#F1F0D8',LEAFC='#4E9A3A',LEAFD='#3A7A2C',SOIL='#8A6A4A';
function f1(v){return (Math.round(v*10)/10).toString()}
function rnd(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280}}
// 一顆草莓：st 0 白白的、1 半紅、2 紅了。(x,y) 是蒂頭；flip 蒂頭朝下
function berry(x,y,s,st,rot){
  var c=st===2?SRED:st===1?'#F0A0A0':SWHT,k=st===2?SREDD:st===1?'#C87070':'#C8C6A0';
  var h='<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+f1(rot||0)+') scale('+f1(s)+')"><path d="M0 2C-10 2 -12 10 -10 16C-7 25 -2 30 0 32C2 30 7 25 10 16C12 10 10 2 0 2Z" fill="'+c+'" stroke="'+k+'" stroke-width="1"/>';
  if(st===1)h+='<path d="M-10 16C-7 25 -2 30 0 32C2 30 7 25 10 16Q0 20 -10 16Z" fill="'+SRED+'"/>';
  [[-5,8],[0,7],[5,8],[-7,14],[-2,13],[3,13],[7,14],[-5,20],[0,19],[5,20],[-2,25],[2,25]].forEach(function(p){h+='<ellipse cx="'+p[0]+'" cy="'+p[1]+'" rx=".9" ry="1.3" fill="'+(st===0?'#C8B860':'#F4D35E')+'"/>'});
  return h+'<path d="M0 3L-8 -1L-4 3L-9 6L-2 5L0 8L2 5L9 6L4 3L8 -1Z" fill="'+LEAFD+'"/><path d="M0 2V-6" stroke="'+LEAFD+'" stroke-width="1.6"/></g>';
}
// 一片三出葉
function leaf3(x,y,s,a){var h='<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+f1(a||0)+') scale('+f1(s||1)+')"><path d="M0 0V-14" stroke="'+LEAFD+'" stroke-width="1.4"/>';
  [-35,0,35].forEach(function(r){h+='<ellipse cy="-21" rx="5.6" ry="8" fill="'+LEAFC+'" stroke="'+LEAFD+'" stroke-width=".6" transform="rotate('+r+' 0 -14)"/>'});return h+'</g>'}
// 一株草莓（地圖上的小株）
function splant(x,y,s,red){var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s||1)+')">'+leaf3(-4,0,.5,-25)+leaf3(4,0,.5,25)+leaf3(0,0,.55,0);if(red)h+='<circle cx="-6" cy="2" r="2.4" fill="'+SRED+'"/><circle cx="6" cy="3" r="2.4" fill="'+SRED+'"/>';return h+'</g>'}
function pot(x,y,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s||1)+')"><path d="M-12 -8H12L9 10H-9Z" fill="#3A3A3A"/><path d="M-13 -9H13" stroke="#2A2A2A" stroke-width="2.4"/></g>'}
var ICON={
  runner:'<path d="M-9 6Q-2 -8 8 2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="-9" cy="6" r="3" fill="none" stroke="#fff" stroke-width="2"/><circle cx="8" cy="2" r="2.6" fill="#fff"/>',
  straw:'<path d="M-10 4H10M-10 8H10" stroke="#fff" stroke-width="2"/><path d="M-6 0Q-4 -8 0 -9Q4 -8 6 0" fill="none" stroke="#fff" stroke-width="2"/>',
  flower:'<g fill="none" stroke="#fff" stroke-width="1.8"><circle cy="-6" r="3.6"/><circle cx="5.7" cy="-1.9" r="3.6"/><circle cx="3.5" cy="4.9" r="3.6"/><circle cx="-3.5" cy="4.9" r="3.6"/><circle cx="-5.7" cy="-1.9" r="3.6"/></g><circle r="2" fill="#fff"/>',
  berry:'<path d="M0 -4C-8 -4 -9 2 -7 6C-5 10 -1 12 0 12C1 12 5 10 7 6C9 2 8 -4 0 -4Z" fill="none" stroke="#fff" stroke-width="2"/><path d="M-5 -6L0 -3L5 -6M0 -3V-10" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>',
  box:'<rect x="-10" y="-5" width="20" height="13" rx="2" fill="none" stroke="#fff" stroke-width="2"/><path d="M-3.3 -5V8M3.3 -5V8M-10 1.5H10" stroke="#fff" stroke-width="1.4"/>',
  map:'<path d="M-2 -10Q6 -6 4 2Q2 8 -2 10Q-6 4 -5 -2Q-5 -8 -2 -10Z" fill="none" stroke="#fff" stroke-width="2"/><circle cx="-2" cy="4" r="2" fill="#fff"/>'
};
function icon(k){return '<svg viewBox="-12 -12 24 24" aria-hidden="true">'+ICON[k]+'</svg>'}

// 開場的認草莓圖
function idCard(t1,t2,art,C){
  var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F4EEE8" role="img" aria-label="'+t1+'的樣子"><rect x="-400" y="170" width="1200" height="60" fill="#E2D2C2"/>'+art;
  C.forEach(function(c){s+='<path d="M'+c[3]+' '+c[4]+'L'+c[1]+' '+(c[2]-5)+'" stroke="#8A7A70" stroke-width="1.2"/><circle cx="'+c[3]+'" cy="'+c[4]+'" r="2.6" fill="#2A2020"/>'+
    '<text x="'+c[1]+'" y="'+c[2]+'" font-size="15" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#F4EEE8" stroke-width="4" paint-order="stroke">'+c[0]+'</text>'});
  return s+'<text x="160" y="34" font-size="24" font-weight="900" fill="#2A2020" text-anchor="middle" font-family="Noto Serif TC,Songti TC,serif" stroke="#F4EEE8" stroke-width="4" paint-order="stroke">'+t1+'</text>'+(t2?'<text x="160" y="188" font-size="14" font-weight="700" fill="#A21E28" text-anchor="middle">'+t2+'</text>':'')+'</svg>';
}

/* ---------- 地圖 ---------- */
// 示意圖：善化的草莓園，北邊是曾文溪，一畦一畦的草莓，還有高架的溫室；切到「育苗時」看夏天的小盆苗
var STOPS=[{lv:1,n:'夏天育苗',x:180,y:200,k:'runner'},{lv:2,n:'種到畦上',x:400,y:180,k:'bed'},{lv:3,n:'開花',x:610,y:220,k:'flower'},{lv:4,n:'採草莓',x:520,y:360,k:'pick'},{lv:5,n:'裝盒',x:300,y:410,k:'box'},{lv:6,n:'北大湖南善化',x:140,y:420,k:'map'}];
var RIVER='M-300 60Q100 90 400 70Q700 50 1100 80';
function marker(s){
  var t='<g transform="translate('+s.x+' '+s.y+')">';
  if(s.k==='runner')return t+splant(-12,4,1.4)+'<path d="M-6 6Q6 -6 16 6" stroke="'+LEAFD+'" stroke-width="1.4" fill="none"/>'+pot(18,12,.7)+splant(18,6,.8)+'</g>';
  if(s.k==='bed')return t+'<path d="M-30 12Q0 -2 30 12Z" fill="'+SOIL+'"/><path d="M-30 12Q0 -2 30 12" stroke="#E6CF8A" stroke-width="4" fill="none"/>'+splant(-12,2,.9)+splant(10,2,.9)+'</g>';
  if(s.k==='flower')return t+splant(0,10,1.4)+'<g transform="translate(10 -10)">'+[0,1,2,3,4].map(function(k){var a=k*1.257;return '<circle cx="'+f1(Math.cos(a)*4)+'" cy="'+f1(Math.sin(a)*4)+'" r="3.4" fill="#fff" stroke="#DDD" stroke-width=".4"/>'}).join('')+'<circle r="2.4" fill="#F4C842"/></g></g>';
  if(s.k==='pick')return t+splant(-8,6,1.3)+berry(10,-2,.6,2)+berry(20,0,.55,2)+'</g>';
  if(s.k==='box')return t+'<rect x="-22" y="-8" width="44" height="22" rx="3" fill="#fff" stroke="#BBB" stroke-width="1"/>'+[-14,0,14].map(function(x){return berry(x,-6,.45,2)}).join('')+'</g>';
  return t+'<path d="M2 -24Q12 -18 10 -4Q8 8 2 16Q-6 6 -6 -6Q-6 -18 2 -24Z" fill="#9AC07A" stroke="#5E8A3A" stroke-width="1.2"/>'+berry(-2,4,.4,2)+'</g>';
}
function buildMap(){
  var h='<rect x="-400" y="-300" width="1600" height="1200" fill="#E8E0C4"/><g id="trees"></g>';
  h+='<path d="'+RIVER+'" stroke="#E2D9B8" stroke-width="50" fill="none"/><path d="'+RIVER+'" stroke="#6BB7D6" stroke-width="24" fill="none"/>';
  h+='<path d="M-400 300H1200M440 100V900" stroke="#F3EBD8" stroke-width="14"/>';
  // 高架溫室
  h+='<g transform="translate(680 420)"><path d="M-40 14V-6Q0 -26 40 -6V14Z" fill="#E8F4F4" fill-opacity=".85" stroke="#9AB0B8" stroke-width="1.4"/><path d="M-20 14V-14M0 14V-17M20 14V-14" stroke="#9AB0B8" stroke-width="1"/></g>';
  var T=function(t,x,y,sz,c,bg){return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" fill="'+c+'" text-anchor="middle" stroke="'+(bg||'#E8E0C4')+'" stroke-width="4" paint-order="stroke">'+t+'</text>'};
  h+=T('善化',300,290,26,'#7A4A2E')+T('曾文溪',620,44,17,'#2E7FA0')+T('高架溫室',680,456,14,'#6A5E50');
  h+='<g transform="translate(110 520)"><circle r="16" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.5"/><path d="M0 -11L5 4L0 1L-5 4Z" fill="#DB2E27"/><text y="12" font-size="9" fill="#5A4E48" text-anchor="middle">北</text></g>';
  h+='<g id="past"><g id="frPast"></g>'+T('育苗時：夏天，在小盆子裡養草莓苗',420,575,15,'#6C2024')+'</g>';
  h+='<g id="now"><g id="frNow"></g>'+T('結果時：冬天到春天，一畦一畦紅紅的草莓',420,575,15,'#6C2024')+'</g>';
  STOPS.forEach(function(s){h+='<g class="stop" data-lv="'+s.lv+'" role="button" aria-label="第 '+s.lv+' 關 '+s.n+'">'+marker(s)+'<circle cx="'+(s.x+24)+'" cy="'+(s.y-26)+'" r="10" fill="#fff" stroke="#E2574C" stroke-width="2"/><text x="'+(s.x+24)+'" y="'+(s.y-21.5)+'" font-size="13" fill="#E2574C" text-anchor="middle">'+s.lv+'</text><text x="'+s.x+'" y="'+(s.y+34)+'" font-size="16" font-weight="700" fill="#5A3E2B" text-anchor="middle" stroke="#FFF8EC" stroke-width="4" paint-order="stroke">'+s.n+'</text></g>'});
  h+='<g id="pin" style="display:none"><g class="pin"><path d="M0 0C-10 -14 -14 -20 -14 -27A14 14 0 1 1 14 -27C14 -20 10 -14 0 0Z" fill="#E2574C" stroke="#fff" stroke-width="2.5"/><text y="-22" font-size="12" fill="#fff" text-anchor="middle">你</text></g></g>';
  return h;
}
function near(x,y,w,hh){return STOPS.some(function(s){return Math.abs(s.x-x)<w&&Math.abs(s.y-y)<hh})}
function decorate(){
  var t='',p='',q='';
  for(var y=120;y<560;y+=30)for(var x=-20;x<840;x+=110){
    var cx=x+50,cy=y;
    if(near(cx,cy,90,52))continue;
    if(Math.abs(cy-300)<24||Math.abs(cx-440)<64)continue;
    if(Math.abs(cx-300)<60&&Math.abs(cy-284)<26)continue;
    if(Math.abs(cx-680)<70&&Math.abs(cy-430)<44)continue;
    if(Math.abs(cx-110)<40&&Math.abs(cy-520)<30)continue;
    if(cy>540&&Math.abs(cx-420)<240)continue;
    t+='<path d="M'+(cx-46)+' '+(cy+8)+'Q'+cx+' '+(cy-6)+' '+(cx+46)+' '+(cy+8)+'Z" fill="'+SOIL+'"/>';
    for(var k=-3;k<=3;k++){q+=splant(cx+k*13,cy+3,.55,k%2===0);p+=pot(cx+k*13,cy+5,.35)+splant(cx+k*13,cy+1,.35)}
  }
  map.querySelector('#trees').innerHTML=t;
  map.querySelector('#frPast').innerHTML=p;
  map.querySelector('#frNow').innerHTML=q;
}

/* ---------- 關卡 ---------- */
var LV=[
  {cam:[40,20,680,680],kick:'草莓任務',h:'冬天的紅寶石',
   html:'<p>天氣變冷了，臺南<b>善化</b>的田裡，一顆一顆<b>草莓</b>慢慢變紅。善化是臺灣<b>最南邊</b>的草莓產地，大家說「<b>北大湖、南善化</b>」。</p><p>善化的草莓大約 <b>11 月底</b>開始紅，一直可以採到隔年 <b>4 月</b>。</p><p class="task">跟著在善化種草莓的<b>姑姑</b>，從夏天的小苗，到你手上紅紅的草莓。每過一關，就能蓋一個章！</p>',
   after:'<p class="note">地圖右上角可以切換<b>育苗時／結果時</b>，看看草莓園夏天和冬天的樣子。<br>給大人：草莓園是農民的地，請到開放的觀光草莓園採果，照園主的規定。</p>',
   game:'start'},
  {cam:[0,0,300,225],kick:'第 1 關・夏天育苗（4 到 8 月）',h:'把走莖牽到小盆子',
   html:'<p>草莓的寶寶是怎麼來的？夏天，<b>草莓媽媽</b>會伸出長長細細的<b>走莖</b>，走莖的尾巴長出一株<b>小草莓苗</b>。</p><p>姑姑把小苗放進一個一個<b>小盆子</b>，讓它在裡面長根。夏天又熱、颱風又多，育苗好辛苦。</p><p class="note">給大人：苗栗區農業改良場的做法是 4 月母株上盆，3 到 4 個月長出子株，9、10 月出苗定植；很多農民自己育苗。善化的農民是自己育苗還是買苗，還要確認。</p>',
   task:'按住走莖尾巴的<b>小苗</b>，拖到一個<b>空盆子</b>裡放開。4 株都要放好！',game:'runner',stamp:['runner','牽好走莖'],
   win:'4 株小苗都住進小盆子了！等它們長出根，就可以種到田裡。',
   why:['為什麼不直接種草莓的種子？','用走莖長出來的小苗，和草莓媽媽一模一樣，長得快、結的草莓也一樣好吃。']},
  {cam:[0,0,300,225],kick:'第 2 關・種到畦上（9 月中）',h:'幫草莓鋪被子',
   html:'<p>9 月中，天氣涼一點了，姑姑把小苗種到田裡。田裡的土堆成一條一條<b>高高的</b>，叫做<b>畦</b>。</p><p>種好以後，畦上要鋪一層<b>稻草</b>（也有人鋪塑膠布），像幫草莓蓋被子。</p><p class="note">給大人：大湖從平畦鋪稻草，改成半圓畦鋪銀灰塑膠布；苗栗場也推廣用稻草。善化現在多用哪一種，還要確認。</p>',
   task:'按住左邊的<b>稻草捲</b>，沿著畦<b>一路往右拖</b>，把稻草鋪滿。兩條畦都要鋪！',game:'mulch',stamp:['straw','鋪好稻草'],
   win:'兩條畦都鋪好了！小苗從稻草的洞洞裡探出頭來。',
   why:['為什麼畦要堆得高高的？','畦高高的，下大雨的時候，水會流到旁邊的溝裡，草莓的根才<b>不會泡水</b>、不容易生病。'],
   q:{t:'草莓為什麼要種在高高的畦上？',o:['下雨時水才流得走','這樣比較好看','草莓喜歡爬山'],a:0,hint:'想想下大雨的時候，低低的地方會怎樣？',
      e:'答對了！畦高高的，<b>排水</b>好，下雨也不會積水。'}},
  {cam:[0,0,300,225],kick:'第 3 關・開花了（11 月）',h:'花謝了，草莓長出來',
   html:'<p>天氣變冷，草莓開出<b>白色的小花</b>。花瓣掉了以後，花中間的<b>花托</b>會慢慢變大、變紅，這就是我們吃的草莓！</p><p>草莓外面一點一點的，是什麼呢？</p><p class="note">給大人：多數草莓品種是短日植物，臺灣低海拔只能在中秋到春末生產。</p>',
   task:'按住一片<b>花瓣</b>，<b>拖走</b>。5 片花瓣都拖走，看看草莓怎麼長出來！',game:'petal',stamp:['flower','看草莓長大'],
   win:'花瓣都掉了！花托慢慢變大，從白白的變成紅紅的，外面長滿一點一點的小顆粒。',
   why:['草莓的種子在哪裡？','草莓外面一點一點的叫<b>瘦果</b>，是一個一個小小的果實，每一個裡面有<b>一粒種子</b>。我們吃的紅色部分，是變大的<b>花托</b>。'],
   q:{t:'草莓外面一點一點的小顆粒，叫做什麼？',o:['瘦果，裡面有種子','芝麻','草莓的毛'],a:0,hint:'看看「為什麼？」裡面的說明。',

      if(t==='down'){held=hit(p);st0=p;if(!held)return;if(held.st<2){say(msg,held.st===0?'這顆還<b>白白的</b>，留著再長幾天。':'這顆<b>還沒全紅</b>，再等一下。',1);held=null}return}
      if(!held)return;
      if(t==='move'){var dy=p.y-st0.y;held.r=Math.max(-40,Math.min(0,dy*1.4));if(dy<-24){var f=held;held=null;take(f)}else if(dy>22&&!held.warn){held.warn=1;say(msg,'不要往下<b>拉</b>，果子會受傷。要<b>往上折</b>。',1)}return}
      if(t==='up'){if(held){held.r=0;say(msg,'再往上<b>折多一點</b>，果梗才會斷。',1)}held=null}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','採草莓的畫面，按 Enter 採一顆紅草莓');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var f=F.filter(function(o){return o.on&&o.st===2})[0];if(f)take(f)}});
    later(function(){if(!n&&!done)say(msg,'按住一顆<b>紅色</b>的草莓，手指<b>往上</b>滑，像把它往上折斷。')},8000);
  },

  /* 第 5 關：先點一顆草莓，再點空格放進盒子 */
  box:function(area,i,l){
    var B=[{x:46,y:70},{x:72,y:78},{x:50,y:104},{x:78,y:108},{x:46,y:138},{x:74,y:140}],S=[],sel=null,n=0,N=6,done=false;
    for(var r=0;r<2;r++)for(var c=0;c<3;c++)S.push({x:162+c*44,y:76+r*58,b:null});
    B.forEach(function(b){b.in=null});
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F4EEE8"><rect x="-400" y="168" width="1200" height="80" fill="#C9B29A"/>'+
      '<path d="M22 54H104L96 160H30Z" fill="#B88A55" stroke="#7A5530" stroke-width="1.4"/><text x="63" y="182" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle">籃子</text>'+
      '<rect x="134" y="44" width="144" height="122" rx="6" fill="#fff" stroke="#BBB" stroke-width="1.6"/><g id="sl"></g><g id="bb"></g><text x="206" y="182" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle">草莓盒</text></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),sl=svg.querySelector('#sl'),bb=svg.querySelector('#bb');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){
      sl.innerHTML=S.map(function(q){return '<rect x="'+(q.x-19)+'" y="'+(q.y-24)+'" width="38" height="50" rx="5" fill="'+(sel&&!q.b?'#FCEAEA':'#F6F2EE')+'" stroke="'+(sel&&!q.b?'#DB2E27':'#DDD')+'" stroke-width="1.4" stroke-dasharray="'+(sel&&!q.b?'4 3':'0')+'"/>'}).join('');
      bb.innerHTML=B.map(function(b){var x=b.in?b.in.x:b.x,y=b.in?b.in.y-16:b.y-14;return (sel===b?'<circle cx="'+x+'" cy="'+(y+16)+'" r="17" fill="none" stroke="#DB2E27" stroke-width="2.4"/>':'')+berry(x,y,1,2,b.in?0:(b.x%3-1)*20)}).join('');
      bar.style.width=(n/N*100)+'%';
    }
    draw();
    svg.addEventListener('pointerdown',function(e){if(done)return;var p=toSvg(svg,e);
      var hb=null,bd=20;B.forEach(function(b){if(b.in)return;var d=Math.hypot(p.x-b.x,p.y-(b.y+2));if(d<bd){bd=d;hb=b}});
      if(hb){sel=hb;draw();say(msg,'拿起一顆了！現在點盒子裡的<b>空格</b>。');return}
      var hs=null;S.forEach(function(q){if(Math.abs(p.x-q.x)<21&&Math.abs(p.y-q.y)<26)hs=q});
      if(hs){if(!sel){say(msg,'先點左邊籃子裡的一顆<b>草莓</b>。',1);return}
        if(hs.b){say(msg,'這格已經有草莓了！<b>不要疊</b>，放到空格。',1);return}
        hs.b=sel;sel.in=hs;sel=null;n++;draw();
        if(n>=N){done=true;say(msg,'裝滿了！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},900)}else say(msg,'輕輕放好了。還有 '+(N-n)+' 顆。');return}
    });
    svg.style.touchAction='manipulation';
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','裝盒的畫面，按 Enter 放一顆草莓進盒子');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var b=B.filter(function(o){return !o.in})[0],q=S.filter(function(o){return !o.b})[0];if(b&&q){q.b=b;b.in=q;n++;draw();if(n>=N){done=true;say(msg,l.win);quiz(area,l,function(){finish(i)})}}}});
    later(function(){if(!n&&!done)say(msg,'先<b>點一顆</b>籃子裡的草莓（會出現紅圈圈），再<b>點</b>盒子裡的一個空格。')},8000);
  },

  /* 第 6 關：把草莓拖到臺灣地圖上善化的位置 */
  map:function(area,i,l){
    var T={x:162,y:126},bx=262,by=120,held=false,done=false,off={x:0,y:0};
    var tw='M188 14Q204 16 210 30Q214 54 210 86Q206 118 198 142Q190 164 180 180Q174 184 172 176Q164 158 156 134Q150 112 150 88Q152 60 162 40Q172 20 188 14Z';
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#DCEFF4"><rect x="-400" y="182" width="1200" height="60" fill="#DCEFF4"/>'+
      '<path d="'+tw+'" fill="#B8D48A" stroke="#6E9A4A" stroke-width="1.6"/><path d="M196 40Q186 90 174 150" stroke="#8FB06A" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6"/>'+
      '<g transform="translate(176 46)">'+berry(0,-8,.5,2)+'</g><text x="136" y="46" font-size="14" font-weight="700" fill="#2E6A80" text-anchor="end">北：苗栗大湖</text>'+
      '<circle cx="'+T.x+'" cy="'+T.y+'" r="14" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/><text x="136" y="131" font-size="14" font-weight="700" fill="#DB2E27" text-anchor="end">臺南的善化？</text>'+
      '<text x="250" y="24" font-size="14" font-weight="700" fill="#2E6A80">臺灣</text><g id="pin"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),pin=svg.querySelector('#pin');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){pin.innerHTML=berry(bx,by-14,1.1,2)+(done?'':'<text x="'+bx+'" y="'+(by+34)+'" font-size="13" font-weight="700" fill="#6C2024" text-anchor="middle">拖我</text>')}
    draw();
    function ok(){done=true;bx=T.x;by=T.y;draw();bar.style.width='100%';say(msg,'找到了！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},900)}
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){if(Math.hypot(p.x-bx,p.y-(by+2))<26){held=true;off={x:p.x-bx,y:p.y-by}}else say(msg,'要按住右邊的<b>草莓</b>，再拖到地圖上。',1);return}
      if(!held)return;
      if(t==='move'){bx=p.x-off.x;by=p.y-off.y;draw();return}
      if(t==='up'){held=false;if(Math.hypot(bx-T.x,by-T.y)<20)ok();else if(by<90&&bx>150&&bx<215)say(msg,'這裡是臺灣的<b>北邊</b>，大湖在這附近。善化在<b>南邊</b>的臺南。',1);else say(msg,'找找臺灣<b>南邊</b>、紅色的<b>虛線圈圈</b>。',1)}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','臺灣地圖的畫面，按 Enter 把草莓放到善化');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();ok()}});
    later(function(){if(!done)say(msg,'按住右邊的<b>草莓</b>，拖到臺灣地圖<b>南邊</b>的紅色虛線圈圈裡。')},8000);
  }
};
</script>
