<style>
:root{
  --bg:#FFF8EC; --card:#FFFDF7; --ink:#5A3E2B; --muted:#9A7B62; --line:#EBD9BF;
  --red:#E2574C; --sea:#9ED9EC; --water:#6EC3DD; --blue:#2E93B8; --green:#7BC47F; --sand:#F8E7C2;
  --f:"Huninn","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#F3E6CF;color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.7;overflow:hidden}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
header{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px}
header h1{margin:0;font-size:20px;font-weight:400;flex:1;line-height:1.3}
.chips{display:flex;gap:3px;background:none;border:0;padding:4px;cursor:pointer;border-radius:8px}
.chips i{display:grid;place-items:center;width:22px;height:22px;border:1.5px dashed #D9BFA0;border-radius:6px;font:14px/19px var(--f);font-style:normal;text-align:center;color:transparent}
.chips i.on{border:1.5px solid var(--red);background:var(--red);color:#fff}
.chips i svg{width:17px;height:17px}
.chips i.pop{animation:pop .5s cubic-bezier(.2,1.8,.4,1)}

.stage{flex:none;position:relative;height:clamp(250px,50vh,520px);background:var(--sea);overflow:hidden;border-top:3px solid var(--line);transition:height .35s}
#map{width:100%;height:100%;display:block;touch-action:manipulation}
[hidden]{display:none!important}
#scene{position:absolute;inset:0;background:#DFF3F8;animation:fadein .35s}
#scene svg{display:block;width:100%;height:100%;margin:0;border-radius:0;background:none!important}
@keyframes fadein{from{opacity:0}}
#peek{position:absolute;left:8px;top:8px;font:15px var(--f);background:#fff;color:var(--ink);border:0;border-radius:999px;padding:5px 14px;box-shadow:0 2px 6px rgba(90,62,43,.18);cursor:pointer}
#past,#now{transition:opacity .7s}
#map.now #past{opacity:0}
#map:not(.now) #now{opacity:0;pointer-events:none}
#boat{transition:opacity .7s}#map.now #boat{opacity:0}
.era{position:absolute;right:8px;top:8px;display:flex;background:#fff;border-radius:999px;padding:3px;box-shadow:0 2px 6px rgba(90,62,43,.18)}
.era button{font:15px var(--f);border:0;background:none;color:var(--muted);padding:4px 12px;border-radius:999px;cursor:pointer}
.era button[aria-pressed="true"]{background:var(--ink);color:#fff}
.stop{cursor:pointer}
.stop.lock{opacity:.55;cursor:default}
.pin{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

main{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 8px;font-size:19px;background:var(--card);border-radius:18px 18px 0 0;margin-top:-10px;position:relative;box-shadow:0 -3px 10px rgba(90,62,43,.08)}
.kick{margin:0;font-size:14px;color:var(--red)}
h2{margin:0 0 4px;font-size:26px;font-weight:400;line-height:1.35}
main p{margin:0 0 10px}
.task{background:#FFF0D6;border-radius:12px;padding:8px 12px;font-size:20px}
main .note{font-size:13px;line-height:1.5;color:var(--muted);margin-top:4px}
.big{display:block;width:100%;font:24px var(--f);background:var(--red);color:#fff;border:0;border-radius:16px;padding:12px;cursor:pointer;margin:8px 0;box-shadow:0 4px 0 #B8392F;transition:transform .08s}
.big:active,.big.down{transform:translateY(3px);box-shadow:0 1px 0 #B8392F}
.big.blue{background:var(--blue);box-shadow:0 4px 0 #1F6F8C}
.big.blue:active,.big.blue.down{box-shadow:0 1px 0 #1F6F8C}
.big:disabled{background:#D9C7B0;box-shadow:none;cursor:default}
.hold{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.mini{display:block;width:100%;height:auto;background:#DFF3F8;border-radius:14px;margin:4px 0 8px;touch-action:manipulation}
.item{transition:transform .55s cubic-bezier(.3,1.4,.5,1);cursor:pointer}
.item:focus-visible path{stroke:var(--red)}
.tap{cursor:pointer}
.tap:focus,.item:focus{outline:none}
.tap:focus-visible .ring{stroke:var(--red);stroke-width:3}
.bar{height:12px;background:#F0E2CC;border-radius:999px;overflow:hidden;margin:4px 0 8px}
.bar b{display:block;height:100%;width:0;background:var(--green);border-radius:999px;transition:width .3s}
.opt{display:block;width:100%;text-align:left;font:20px/1.5 var(--f);background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 0 8px;cursor:pointer}
.opt.no{color:#C3AE97;border-style:dashed;text-decoration:line-through}
.opt.yes{border-color:var(--green);background:#EEF8EC}
.opt:disabled{cursor:default}
.say{background:#EEF8EC;border-radius:12px;padding:8px 12px;font-size:18px}
.say.again{background:#FDECE8}
.skip{font:15px var(--f);background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px 0;cursor:pointer}
.got{display:flex;align-items:center;gap:14px;background:#FFF0D6;border-radius:14px;padding:10px 14px;margin:10px 0}
.got p{margin:0}
.why{background:#E6F4FA;border-radius:14px;padding:8px 12px;margin:0 0 10px}
.why summary{cursor:pointer;color:#1F6F8C;font-size:18px}
.why p{margin:6px 0 0}
.seal{display:grid;place-items:center;flex:none;width:56px;height:56px;border:3px solid var(--red);border-radius:12px;background:var(--red);color:#fff;font:32px/50px var(--f);text-align:center;transform:rotate(-6deg)}
.seal svg{width:74%;height:74%}
.seal.pop{animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(2.2) rotate(-20deg);opacity:0}100%{transform:rotate(-6deg);opacity:1}}
@keyframes pop{0%{transform:scale(1.8)}100%{transform:none}}
.again-btn{font:14px var(--f);background:none;border:1.5px solid var(--line);border-radius:999px;padding:3px 14px;color:var(--muted);cursor:pointer}

.foot{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--line)}
.foot button{font:17px var(--f);background:none;border:0;color:var(--ink);padding:6px 10px;cursor:pointer;border-radius:8px}
.foot #nx{color:var(--red)}
.foot button:disabled{color:#D9C7B0;cursor:default}
.foot span{font-size:14px;color:var(--muted)}

.doc{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px 14px 8px}
.doc h3{margin:0 0 8px;font-size:24px;font-weight:400;text-align:center;letter-spacing:.2em}
.doc dl{margin:0 0 8px;display:grid;grid-template-columns:4em minmax(0,1fr);gap:0 8px;font-size:15px}
.doc dt{color:var(--muted)}.doc dd{margin:0}
.doc ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:2px dashed var(--line);padding-top:10px}
.doc li{text-align:center;font-size:13px;color:var(--muted);line-height:1.4}
.doc li .seal{width:48px;height:48px;margin:0 auto 4px}
.doc li .seal.empty{background:none;border:2px dashed #D9BFA0;transform:none;color:transparent}
.doc .fic{margin:8px 0 0;font-size:12px;color:var(--muted);text-align:center}
.name{font:17px var(--f);border:0;border-bottom:2px solid var(--ink);background:none;width:9em;color:var(--ink);padding:0 2px}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(90,62,43,.45);display:grid;place-items:center;padding:16px}
.sheet[hidden]{display:none}
.sheet .in{width:min(380px,100%);max-height:calc(100% - 32px);overflow-y:auto;background:var(--bg);border-radius:18px;padding:14px}
.sheet .x{display:block;margin:10px auto 0;font:16px var(--f);background:none;border:1.5px solid var(--line);border-radius:999px;padding:4px 18px;cursor:pointer;color:var(--ink)}
.conf{position:fixed;top:-12px;width:10px;height:14px;border-radius:3px;z-index:20;pointer-events:none;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main a{color:var(--blue)}
@media (prefers-reduced-motion:reduce){.stage{transition:none}.pin,.seal.pop,.chips i.pop,.conf{animation:none}.item{transition:none}}
/* 平板直拿：畫面變寬一點 */
@media (min-width:700px){.app{max-width:760px}}
/* 電腦、平板橫拿、手機橫拿：左邊大舞台（地圖／遊戲），右邊文字卡片 */
@media (min-width:700px) and (min-aspect-ratio:5/4){
  body{background:#EADBC0}
  .app{max-width:1320px;display:grid;grid-template-columns:minmax(0,1fr) clamp(330px,34vw,470px);grid-template-rows:auto minmax(0,1fr) auto}
  header{grid-column:1/-1;padding:10px 20px}
  header h1{font-size:24px}
  .chips i{width:26px;height:26px}.chips i svg{width:20px;height:20px}
  .stage{grid-column:1;grid-row:2/4;height:auto;border-top:3px solid var(--line)}
  main{grid-column:2;grid-row:2;margin-top:0;border-radius:0;box-shadow:none;border-top:3px solid var(--line);border-left:3px solid var(--line);padding:16px 20px 10px}
  .foot{grid-column:2;grid-row:3;border-left:3px solid var(--line)}
}
/* ===== 新版面：上面標題、中間遊戲畫面、下面文字 =====
   配色取自臺南城市識別：紅 #DB2E27、酒紅 #6C2024、金 #BD9558；插畫裡的水和海維持藍色 */
:root{
  --bg:#FBF7F1; --card:#FBF7F1; --paper:#FFFFFF; --ink:#2A2020; --muted:#8A7A70; --line:#EADFD3;
  --red:#DB2E27; --maroon:#6C2024; --gold:#BD9558; --goldsoft:#F3E8D6; --blue:#6C2024; --green:#BD9558;
  --f:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
body{background:#EFE7DC;color:var(--ink)}
header{padding:12px 18px 2px}
header h1{font:700 15px/1.3 var(--f);letter-spacing:.06em;color:var(--ink)}
.chips{gap:5px}
.chips i{width:20px;height:20px;border-radius:50%;border:1.5px dashed var(--gold)}
.chips i.on{background:var(--red);border-color:var(--red)}
.chips i svg{width:14px;height:14px}
.top{flex:none;padding:6px 18px 14px}
.top .kick{margin:0 0 2px;font:700 15px/1.4 var(--serif);letter-spacing:.06em;color:var(--red)}
.top h2{margin:0;font:900 30px/1.25 var(--serif);color:var(--ink);text-wrap:balance}
.stage{height:clamp(220px,42vh,480px);margin:0 16px;border-top:0;border-radius:26px;box-shadow:0 0 0 8px var(--goldsoft)}
main{margin-top:0;border-radius:0;box-shadow:none;background:var(--bg);padding:20px 18px 8px}
main p{line-height:1.75}
main .kick{font:700 15px var(--serif);letter-spacing:.04em}
.task{background:var(--goldsoft);border-radius:14px;padding:10px 14px;font-weight:500}
.big{font:700 22px var(--f);border-radius:14px;box-shadow:none;background:var(--red);letter-spacing:.04em}
.big:active,.big.down{transform:translateY(2px);box-shadow:none;filter:brightness(.9)}
.big.blue{background:var(--maroon);box-shadow:none}
.big.blue:active,.big.blue.down{box-shadow:none}
.big:disabled{background:#D8CFC4}
.opt{font:500 20px/1.5 var(--f);border:2px solid var(--line);background:var(--paper);border-radius:14px}
.opt.yes{border-color:var(--gold);background:#FAF3E6}
.say{background:#F2ECE2;border-radius:14px}
.say.again{background:#FBE8E5}
.why{background:var(--paper);border:2px solid var(--goldsoft);border-radius:14px}
.why summary{font:700 18px var(--serif);color:var(--maroon)}
.got{background:var(--paper);border:2px solid var(--goldsoft);border-radius:14px}
.seal{border:0;border-radius:50%;background:var(--red);transform:none;box-shadow:0 0 0 6px var(--goldsoft)}
@keyframes stamp{0%{transform:scale(1.8);opacity:0}100%{transform:none;opacity:1}}
.again-btn{border-color:var(--gold);color:var(--maroon)}
.bar{background:#EFE6D8}.bar b{background:var(--gold)}
.foot{background:var(--bg);border-top:1px solid var(--line)}
.foot #nx{color:var(--red);font-weight:700}
#peek,.era{box-shadow:0 2px 8px rgba(42,32,32,.15)}
.era button[aria-pressed="true"]{background:var(--maroon)}
.doc{border:0;border-radius:18px;background:var(--paper);box-shadow:0 0 0 8px var(--goldsoft)}
.doc h3{font:900 26px var(--serif);letter-spacing:.12em;color:var(--ink)}
.doc li .seal.empty{border:2px dashed var(--gold);box-shadow:none}
.sheet .in{background:var(--bg)}
/* 換關時文字一行一行浮上來 */
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.06s}.enter>*:nth-child(3){animation-delay:.12s}.enter>*:nth-child(4){animation-delay:.18s}.enter>*:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.enter>*{animation:none}}
@media (min-width:700px){.top h2{font-size:34px}.top{padding:8px 24px 16px}.stage{margin:0 24px}}
@media (min-width:700px) and (min-aspect-ratio:5/4){
  body{background:#EFE7DC}
  .app{grid-template-rows:auto auto minmax(0,1fr) auto}
  header{grid-column:1/-1;padding:12px 24px 4px}
  header h1{font-size:15px}
  .top{grid-column:1;grid-row:2}
  .stage{grid-column:1;grid-row:3/5;height:auto;margin:0 24px 24px;border-top:0}
  main{grid-column:2;grid-row:2/4;border-top:0;border-left:1px solid var(--line);padding:20px 22px 10px}
  .foot{grid-column:2;grid-row:4;border-left:1px solid var(--line)}
}
/* ===== 圓形遊戲框 ===== */
.stage{display:flex;align-items:center;justify-content:center;background:none;box-shadow:none;border-radius:0;overflow:visible;height:clamp(220px,46vh,460px)}
.stage{position:relative;min-height:0}
.disc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;height:300px;border-radius:50%;overflow:hidden;background:var(--sea);box-shadow:0 0 0 12px var(--goldsoft)}
#map{width:100%;height:100%}
#scene{display:flex;align-items:center;justify-content:center}
#scene svg{flex:none}
#scene svg:focus:not(:focus-visible),#scene [tabindex]:focus:not(:focus-visible){outline:none}
#peek{left:0;top:0}
.era{right:0;top:0}
@media (min-width:700px) and (min-aspect-ratio:5/4){.stage{height:auto}}
/* ===== 不用色塊區分文字：改用粗體和顏色；大按鈕是圓的 ===== */
.task{background:none;padding:0;border-radius:0;font-weight:700;color:var(--maroon)}
.say{background:none;padding:0;border-radius:0;font-weight:700;color:#4E7D3A}
.say.again{background:none;color:var(--red)}
.why,.got{background:none;border:0;padding:0;border-radius:0}
.why summary{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px}
.got{margin:16px 0}
.opt{border-radius:999px;padding:10px 20px}
.big{display:grid;place-items:center;width:116px;height:116px;margin:18px auto;padding:10px;border-radius:50%;font:700 20px/1.3 var(--f);text-align:center;box-shadow:0 0 0 8px var(--goldsoft)}
.big.blue{box-shadow:0 0 0 8px var(--goldsoft)}
.big:active,.big.down,.big.blue:active,.big.blue.down{box-shadow:0 0 0 8px var(--goldsoft)}
.big:disabled{box-shadow:0 0 0 8px #EFE8DF}
.again-btn{border-radius:999px}
/* ===== 用粗細帶重點：內文細一點、淡一點，重點字粗黑 ===== */
main p,main li,.doc dd{color:#5A4E48}
main b,main strong{font-weight:700;color:var(--ink)}
.task,.task b{color:var(--maroon)}
.say b{color:inherit}
.say.again b{color:inherit}
/* 回饋訊息用一般粗細，只有重點詞粗 */
.say{font-weight:400;color:#3F6B2E}
.say.again{font-weight:400;color:#B8261F}
.say b{font-weight:700}
/* ===== 手機：地圖和文字在同一頁一起捲，上一關／下一關固定在最下面 ===== */
@media (max-width:699.98px),(max-aspect-ratio:1249/1000){
  html,body{height:auto;min-height:100%}
  body{overflow:visible}
  .app{height:auto;min-height:100vh}
  main{flex:none;overflow:visible;min-height:0}
  .foot{position:sticky;bottom:0;z-index:5}
  .stage{margin:0 2px}
  /* 圓黏在畫面上方：往下捲找按鈕時，圓和按鈕一定同時看得到 */
  .stage{position:sticky;top:0;z-index:4;background:var(--bg)}
  main *{scroll-margin-bottom:76px}
  .big{width:96px;height:96px;margin:12px auto;font-size:19px}
}
/* ===== 卡片文字角色（使用者定的規則） ===== */
.task{color:#6C2024;font-weight:700}
.bar{height:4px;background:#EFE6D8;border-radius:2px;margin:10px 0 12px}
.bar b{background:#6C2024;border-radius:2px}
.say{font-weight:400;color:#3F6B2E}
.say.again{font-weight:400;color:#B8261F}
.say.again::before{content:"再試試";display:block;font:700 13px var(--serif);letter-spacing:.08em;color:var(--red);margin-bottom:2px}
main .kick+p{font-weight:700;color:var(--ink)}
.notes{margin-top:24px;padding-top:12px;border-top:1px solid var(--line)}
.notes .note{margin:0 0 6px}
.notes .note b{color:#8A7A70}
/* ===== 完成頁：一段一段回顧 ===== */
.recap{min-height:150px}
.rc{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:start}
.rc .seal{width:58px;height:58px;margin-top:4px}
.rc .seal.empty{background:none;border:2px dashed var(--gold);box-shadow:none}
.rk{margin:0;font:700 13px var(--serif);letter-spacing:.08em;color:var(--red)}
.rh{margin:0 0 6px;font:900 22px/1.35 var(--serif);color:var(--ink)}
.rn{margin:-6px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,60px);gap:8px;justify-content:center;margin:16px auto 12px}
.pad button{border:0;border-radius:50%;background:var(--maroon);color:#fff;font:700 26px/1 var(--f);box-shadow:0 0 0 5px var(--goldsoft);cursor:pointer;touch-action:manipulation}
.pad button:active{filter:brightness(.88)}
.pad button:disabled{background:#D8CFC4}
.notes .maps a{color:inherit;text-decoration:underline;text-decoration-color:#C9B8A6;text-underline-offset:3px}
.recap:empty{min-height:0}
/* 回到首頁的小房子（每個遊戲左上角都有） */
.home{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--paper,#fff);color:var(--maroon,#6C2024);text-decoration:none}.home svg{width:20px;height:20px}.home:active{background:var(--goldsoft,#F3E8D6)}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="home" href="index.html" aria-label="回到首頁"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg></a>
    <h1>採菱角任務</h1>
    <button class="chips" id="chips" type="button" aria-label="看回顧"></button>
  </header>
  <div class="top" id="top"></div>
  <div class="stage" id="stage">
    <div class="disc">
      <svg id="map" class="now" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="官田菱角田插畫地圖"></svg>
      <div id="scene" hidden></div>
    </div>
    <div class="era" role="group" aria-label="切換春天和秋天"><button type="button" data-era="past" aria-pressed="false">春天</button><button type="button" data-era="now" aria-pressed="true">秋天</button></div>
    <button id="peek" type="button" hidden>看地圖</button>
  </div>
  <main id="card" aria-live="polite"></main>
  <nav class="foot"><button type="button" id="pv">‹ 上一關</button><span id="pos"></span><button type="button" id="nx">下一關 ›</button></nav>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="任務單"><div class="in"><div id="sheetDoc"></div><button class="x" type="button" id="sheetX">收起任務單</button></div></div>

<script>
/* ---------- 插畫元件 ---------- */
var K='#2A2020',NS='http://www.w3.org/2000/svg';
var RIPE='#4E1F2C',RED='#8E3346',YOUNG='#A85A70',LEAF='#5C9A3E',LEAF2='#3F7A2C';
function f1(v){return (Math.round(v*10)/10).toString()}
// 二角菱（正面看，兩個尖角像蝙蝠的翅膀）。(x,y) 是中間；col 殼的顏色；bend 尖角往下彎幾度
function lj(x,y,s,col,bend){
  col=col||RED;var b=bend||0;
  return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+s+')">'+
    '<path class="hl" d="M-6 -4Q-12 -7 -17 0Q-12 -2 -6 1Z" fill="'+col+'" transform="rotate('+(-b)+' -6 -1.5)"/>'+
    '<path class="hr" d="M6 -4Q12 -7 17 0Q12 -2 6 1Z" fill="'+col+'" transform="rotate('+b+' 6 -1.5)"/>'+
    '<path d="M-7 -3Q-8 6 0 8Q8 6 7 -3Q4 -7 0 -7Q-4 -7 -7 -3Z" fill="'+col+'"/>'+
    '<rect x="-1.6" y="-10" width="3.2" height="3.6" rx="1" fill="#5A4030"/>'+
    '<path d="M-4 -3Q-4.5 2 -1.5 4.5" stroke="#fff" stroke-opacity=".35" stroke-width="1.4" fill="none" stroke-linecap="round"/></g>';
}
// 剝開的菱角：裡面白白的菱角仁
function ljOpen(x,y,s){
  return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+s+')"><path d="M-6 -4Q-12 -7 -17 0Q-12 -2 -6 1ZM6 -4Q12 -7 17 0Q12 -2 6 1Z" fill="'+RIPE+'"/>'+
    '<path d="M-7 -3Q-8 6 0 8Q8 6 7 -3Q4 -7 0 -7Q-4 -7 -7 -3Z" fill="'+RIPE+'"/><path d="M-5 -2.5Q-5.6 5 0 6.2Q5.6 5 5 -2.5Q3 -5 0 -5Q-3 -5 -5 -2.5Z" fill="#FBF6EA" stroke="#E6DCC6" stroke-width=".5"/></g>';
}
// 小花（4 片花瓣）
function flower(x,y,s){
  var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+(s||1)+')">';
  for(var k=0;k<4;k++)h+='<ellipse cy="-2.6" rx="1.9" ry="2.8" fill="#FFF6F2" stroke="#E5C2C8" stroke-width=".5" transform="rotate('+(k*90+45)+')"/>';
  return h+'<circle r="1.1" fill="#F0C64A"/></g>';
}
// 菱盤（從上面看：一圈菱形的葉子）。o 有 flower 就開花
function pan(x,y,s,o){
  var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+s+')">';
  for(var k=0;k<12;k++)h+='<path d="M0 -3L4.6 -10L0 -16.5L-4.6 -10Z" fill="'+(k%2?LEAF:'#6AAA48')+'" stroke="'+LEAF2+'" stroke-width=".7" stroke-linejoin="round" transform="rotate('+(k*30)+')"/>';
  for(var j=0;j<8;j++)h+='<path d="M0 -1L3.4 -6L0 -10L-3.4 -6Z" fill="#7DBB55" stroke="'+LEAF2+'" stroke-width=".6" stroke-linejoin="round" transform="rotate('+(j*45+22)+')"/>';
  if(o==='flower')h+=flower(-3,-4,1.3)+flower(4,3,1.1);
  return h+'</g>';
}
// 水雉（夏天的羽毛：臉和脖子白白的、脖子後面金黃色、身體黑褐色、長長的尾巴，腳和腳趾很長）。臉朝左，(0,0) 是腳底
// o：shelter 張開翅膀蹲著替寶寶擋雨
function jac(x,y,s,o){
  var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+s+')">',ft='#6E7F86';
  if(o==='shelter'){
    h+='<path d="M-14 0H14" stroke="'+ft+'" stroke-width="1" stroke-linecap="round"/>'+
      '<path d="M8 -12Q22 -14 32 -4Q24 -10 9 -8Z" fill="#2B211C"/>'+
      '<path d="M-2 -13Q-22 -30 -32 -3Q-18 -9 -4 -6Z" fill="#F4F1EA" stroke="#BDB3A8" stroke-width=".8"/>'+
      '<path d="M4 -13Q22 -30 32 -3Q18 -9 6 -6Z" fill="#F4F1EA" stroke="#BDB3A8" stroke-width=".8"/>'+
      '<ellipse cx="1" cy="-10" rx="10" ry="6" fill="#2F2420"/>'+
      '<path d="M-6 -13Q-9 -18 -9 -22" stroke="#F7F4EE" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M-5.4 -14Q-6.8 -18 -6 -22" stroke="#E7BE3C" stroke-width="3" fill="none" stroke-linecap="round"/>'+
      '<circle cx="-9.5" cy="-24" r="3.8" fill="#F7F4EE" stroke="#BDB3A8" stroke-width=".6"/><circle cx="-10.6" cy="-24.5" r=".8" fill="'+K+'"/><path d="M-9.6 -24.2Q-6 -23 -6 -19" stroke="#2B211C" stroke-width="1" fill="none"/><path d="M-13 -24.6L-17.5 -23.6L-13 -22.8Z" fill="#7A8FA8"/>';
    return h+'</g>';
  }
  h+='<path d="M-1 -16L-2 0M3 -16L4 0" stroke="'+ft+'" stroke-width="1.3" stroke-linecap="round"/>'+
    '<path d="M-13 0H8M-2 0L-6 2.6M-9 0L-11 2M4 0H17M4 0L8 2.6" stroke="'+ft+'" stroke-width="1" stroke-linecap="round"/>'+
    '<path d="M8 -20Q22 -22 32 -12Q24 -18 9 -17Z" fill="#2B211C"/>'+
    '<ellipse cx="2" cy="-20" rx="10" ry="6" fill="#2F2420"/><path d="M-4 -23Q4 -27 11 -22Q4 -20 -3 -21Z" fill="#F4F1EA"/>'+
    '<path d="M-5 -24Q-8 -30 -8 -34" stroke="#F7F4EE" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M-4.4 -25Q-5.8 -30 -5 -34" stroke="#E7BE3C" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M-2.8 -24Q-4.2 -29 -3.4 -33" stroke="#2B211C" stroke-width="1" fill="none"/>'+
    '<circle cx="-8.5" cy="-36" r="3.8" fill="#F7F4EE" stroke="#BDB3A8" stroke-width=".6"/><circle cx="-9.6" cy="-36.5" r=".8" fill="'+K+'"/><path d="M-8.6 -36.2Q-5 -35 -5 -31" stroke="#2B211C" stroke-width="1" fill="none"/><path d="M-12 -36.6L-16.5 -35.6L-12 -34.8Z" fill="#7A8FA8"/>';
  return h+'</g>';
}
// 小水雉（毛茸茸、腳很長，臉朝左，(0,0) 是腳底）
function jchick(x,y,s){
  var ft='#7E8F96';
  return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+(s||1)+')"><path d="M-1 -8L-1.5 0M2 -8L2.5 0" stroke="'+ft+'" stroke-width="1.1" stroke-linecap="round"/><path d="M-8 0H5M0 0H10" stroke="'+ft+'" stroke-width=".9" stroke-linecap="round"/>'+
    '<ellipse cx="1" cy="-11" rx="6" ry="4.6" fill="#B58C5E"/><ellipse cx="0" cy="-9.4" rx="4.4" ry="2.6" fill="#F6EFE2"/>'+
    '<circle cx="-4" cy="-16" r="3.6" fill="#B58C5E"/><path d="M-7 -17Q-4 -19 -1 -17" stroke="#F6EFE2" stroke-width="1.2" fill="none"/><path d="M-6.6 -15.4H-1.6" stroke="#4A3A2E" stroke-width=".9"/><circle cx="-5" cy="-16" r=".75" fill="'+K+'"/><path d="M-7.4 -16L-10 -15.4L-7.4 -14.8Z" fill="#7A8FA8"/></g>';
}
// 阿嬤穿青蛙裝，戴斗笠，腰上綁著腳桶（大鋁盆）。(0,0) 是水面
function ama(x,y,s){
  return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+(s||1)+')"><ellipse cy="1" rx="20" ry="3.6" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.4"/>'+
    '<rect x="-7" y="-22" width="14" height="22" rx="5" fill="#4E6B3A"/><path d="M-7 -18L-12 -6M7 -18L11 -9" stroke="#E59A8C" stroke-width="3.4" stroke-linecap="round"/>'+
    '<circle cy="-27" r="5" fill="#F1C9A5"/><path d="M-15 -29L0 -39L15 -29Z" fill="#E8D28E" stroke="#B89A55" stroke-width="1"/>'+
    '<ellipse cx="14" cy="-5" rx="10" ry="3.6" fill="#DADFE3" stroke="#8F969C" stroke-width="1"/><path d="M4 -5L6 1H22L24 -5" fill="#C8CDD2" stroke="#8F969C" stroke-width="1"/>'+lj(13,-6.5,.32,RIPE)+lj(17,-5.5,.3,RED)+'</g>';
}
// 蝙蝠形的「菱角」招牌
function bat(x,y,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+s+')"><path d="M-32 -8Q-24 -20 -11 -12Q-6 -20 0 -14Q6 -20 11 -12Q24 -20 32 -8Q26 2 19 -1Q15 8 8 3Q4 10 0 6Q-4 10 -8 3Q-15 8 -19 -1Q-26 2 -32 -8Z" fill="#DB2E27"/><text y="-1" font-size="12" font-weight="900" fill="#fff" text-anchor="middle" font-family="Noto Serif TC,Songti TC,serif">菱角</text></g>'}
var ICON={
  water:'<path d="M0 -10C-5 -3 -7 1 -7 4A7 7 0 0 0 7 4C7 1 5 -3 0 -10Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M-3 4Q-3 7 0 7.5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>',
  sprout:'<path d="M0 10V-1M0 -1C-2 -7 -8 -8 -10 -6C-8 -1 -3 0 0 -1M0 2C2 -4 8 -6 10 -4C8 1 3 2 0 2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 10H8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>',
  leaf:'<path d="M0 -10L4 -4L10 0L4 4L0 10L-4 4L-10 0L-4 -4Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle r="2.6" fill="#fff"/>',
  bird:'<path d="M-11 2Q0 -12 11 2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M-5 2V9M-7 9H-3M0 2V9M-2 9H2M5 2V9M3 9H7" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>',
  ling:'<path d="M-5 -3Q-5 6 0 7Q5 6 5 -3Q3 -6 0 -6Q-3 -6 -5 -3ZM-5 -3Q-9 -5 -11 0M5 -3Q9 -5 11 0" fill="none" stroke="#fff" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>',
  bucket:'<path d="M-10 -4H10L8 9H-8Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M-9 0Q-5 -2 0 0T9 0" stroke="#fff" stroke-width="1.6" fill="none"/><circle cx="-3" cy="-3" r="1.7" fill="#fff"/><circle cx="3" cy="6" r="1.7" fill="#fff"/>'
};
function icon(k){return '<svg viewBox="-12 -12 24 24" aria-hidden="true">'+ICON[k]+'</svg>'}
function rnd(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280}}

// 開場的認水果圖：大大的菱角，加上幾個認得出它的特徵
function idCard(t1,t2,art,C){
  var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EEF4EC" role="img" aria-label="'+t1+'的樣子"><rect x="-400" y="172" width="1200" height="60" fill="#DCE7D2"/>'+art;
  C.forEach(function(c){s+='<path d="M'+c[3]+' '+c[4]+'L'+c[1]+' '+(c[2]-5)+'" stroke="#8A7A70" stroke-width="1.2"/><circle cx="'+c[3]+'" cy="'+c[4]+'" r="2.6" fill="#DB2E27"/>'+
    '<text x="'+c[1]+'" y="'+c[2]+'" font-size="15" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#EEF4EC" stroke-width="4" paint-order="stroke">'+c[0]+'</text>'});
  return s+'<text x="160" y="34" font-size="24" font-weight="900" fill="#2A2020" text-anchor="middle" font-family="Noto Serif TC,Songti TC,serif" stroke="#EEF4EC" stroke-width="4" paint-order="stroke">'+t1+'</text>'+(t2?'<text x="160" y="190" font-size="14" font-weight="700" fill="#4E6B3A" text-anchor="middle">'+t2+'</text>':'')+'</svg>';
}

/* ---------- 地圖 ---------- */
// 示意圖：右上是烏山頭水庫，水順著嘉南大圳往西流，兩邊是一格一格的田（春天種稻、秋天種菱角），左邊是台 1 線
var STOPS=[{lv:1,n:'水圳的水口',x:540,y:290,k:'gate'},{lv:2,n:'栽仔堀',x:452,y:198,k:'sprout'},{lv:3,n:'菱角田',x:404,y:372,k:'leaf'},{lv:4,n:'水雉的家',x:268,y:450,k:'bird'},{lv:5,n:'採菱角',x:290,y:250,k:'ling'},{lv:6,n:'菱角攤',x:182,y:360,k:'stall'}];
function marker(s){
  var t='<g transform="translate('+s.x+' '+s.y+')">';
  if(s.k==='gate')return t+'<rect x="-20" y="-6" width="40" height="13" rx="3" fill="#6BB7D6" stroke="#F7EEDA" stroke-width="2"/><rect x="-5" y="-16" width="10" height="20" rx="1.5" fill="#B08A55" stroke="#6E5530" stroke-width="1.2"/><path d="M0 -16V-22" stroke="#6E5530" stroke-width="2.4"/><path d="M12 -20C9 -15 8 -13 8 -11A4 4 0 0 0 16 -11C16 -13 15 -15 12 -20Z" fill="#4FA3C7"/></g>';
  if(s.k==='sprout')return t+'<ellipse rx="26" ry="13" fill="#8FC7D6" stroke="#F7EEDA" stroke-width="3"/>'+pan(-12,0,.42)+pan(0,-3,.42)+pan(12,1,.42)+pan(-4,6,.36)+pan(9,-7,.34)+'</g>';
  if(s.k==='leaf')return t+'<ellipse rx="27" ry="20" fill="#8FC7D6"/>'+pan(0,0,1.2,'flower')+'</g>';
  if(s.k==='bird')return t+'<ellipse cy="3" rx="30" ry="12" fill="#8FC7D6"/>'+pan(-12,4,.75)+pan(12,6,.6)+jac(-2,4,.7)+'</g>';
  if(s.k==='ling')return t+'<ellipse cy="2" rx="26" ry="9" fill="#8FC7D6"/>'+pan(-16,3,.5)+ama(0,4,.85)+'</g>';
  return t+'<rect x="-18" y="-2" width="36" height="16" rx="2" fill="#C98A4E" stroke="#8A5A2E" stroke-width="1.2"/><path d="M-18 -2H18L14 -8H-14Z" fill="#E8C27A"/>'+lj(-8,6,.4,RIPE)+lj(2,7,.4,RIPE)+lj(10,5,.4,RED)+bat(0,-20,.85)+'</g>';
}
function buildMap(){
  var h='<rect x="-400" y="-300" width="1600" height="1200" fill="#E9E1C6"/>';
  // 東邊的山
  h+='<ellipse cx="740" cy="60" rx="120" ry="70" fill="#C3D6A0"/><ellipse cx="800" cy="230" rx="90" ry="80" fill="#BBD198"/><ellipse cx="690" cy="-10" rx="90" ry="50" fill="#B2CA8C"/>';
  // 台 1 線
  h+='<rect x="128" y="-300" width="22" height="1200" fill="#D3CCBE"/><path d="M139 -300V900" stroke="#fff" stroke-width="2" stroke-dasharray="12 12"/>';
  h+='<g id="pans"></g>';
  // 烏山頭水庫和嘉南大圳
  h+='<path transform="translate(-40 10)" d="M552 112Q578 80 622 92Q660 70 688 104Q706 140 682 176Q664 214 620 206Q584 222 566 192Q534 152 552 112Z" fill="#7CC7E0" stroke="#F7EEDA" stroke-width="3"/>';
  h+='<path d="M508 206L530 236" stroke="#B5AFA3" stroke-width="9" stroke-linecap="round"/>';
  h+='<path d="M522 238Q534 266 524 284Q500 302 450 302Q370 306 300 306Q220 308 160 304Q60 300 -200 306" stroke="#6BB7D6" stroke-width="13" fill="none" stroke-linecap="round"/>';
  // 葫蘆埤
  h+='<ellipse cx="322" cy="168" rx="30" ry="20" fill="#8FC7D6" stroke="#F7EEDA" stroke-width="3"/><ellipse cx="366" cy="158" rx="22" ry="15" fill="#8FC7D6" stroke="#F7EEDA" stroke-width="3"/>';
  // 水雉生態教育園區的水池
  h+='<path d="M210 420Q240 400 300 412Q336 430 320 470Q290 494 240 486Q200 470 210 420Z" fill="#8FC7D6" stroke="#F7EEDA" stroke-width="3"/>';
  var T=function(t,x,y,sz,c){return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" fill="'+c+'" text-anchor="middle" stroke="#E9E1C6" stroke-width="4" paint-order="stroke">'+t+'</text>'};
  h+=T('官田',250,118,26,'#7A4A2E')+T('烏山頭水庫',584,166,17,'#2E7FA0')+T('嘉南大圳',420,330,15,'#2E7FA0')+T('葫蘆埤',344,200,14,'#2E7FA0')+T('台 1 線',139,236,14,'#6A5E50')+T('水雉生態教育園區',268,512,13,'#4E6B3A');
  h+='<g transform="translate(650 420)"><circle r="16" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.5"/><path d="M0 -11L5 4L0 1L-5 4Z" fill="#DB2E27"/><text y="12" font-size="9" fill="#5A4E48" text-anchor="middle">北</text></g>';
  // 春天：田裡種稻子
  h+='<g id="past"><g id="pansPast"></g>'+T('春天：田裡種稻子',420,566,15,'#6C2024')+'</g>';
  // 秋天：稻子收完，田裡種菱角
  h+='<g id="now">'+T('秋天：稻子收完，田裡種菱角',420,566,15,'#6C2024')+'</g>';
  STOPS.forEach(function(s){h+='<g class="stop" data-lv="'+s.lv+'" role="button" aria-label="第 '+s.lv+' 關 '+s.n+'">'+marker(s)+'<circle cx="'+(s.x+24)+'" cy="'+(s.y-26)+'" r="10" fill="#fff" stroke="#E2574C" stroke-width="2"/><text x="'+(s.x+24)+'" y="'+(s.y-21.5)+'" font-size="13" fill="#E2574C" text-anchor="middle">'+s.lv+'</text><text x="'+s.x+'" y="'+(s.y+34)+'" font-size="16" font-weight="700" fill="#5A3E2B" text-anchor="middle" stroke="#FFF8EC" stroke-width="4" paint-order="stroke">'+s.n+'</text></g>'});
  h+='<g id="pin" style="display:none"><g class="pin"><path d="M0 0C-10 -14 -14 -20 -14 -27A14 14 0 1 1 14 -27C14 -20 10 -14 0 0Z" fill="#E2574C" stroke="#fff" stroke-width="2.5"/><text y="-22" font-size="12" fill="#fff" text-anchor="middle">你</text></g></g>';
  return h;
}
function near(x,y,w,hh){return STOPS.some(function(s){return Math.abs(s.x-x)<w&&Math.abs(s.y-y)<hh})}
function decorate(){
  var r=rnd(17),p='',q='';
  for(var x=22;x<640;x+=44)for(var y=-40;y<600;y+=34){
    var cx=x+19,cy=y+14;
    if(cx>110&&cx<170)continue; // 台 1 線
    if(near(cx,cy,48,44))continue;
    if(cy>278&&cy<332)continue; // 嘉南大圳
    if(Math.pow((cx-578)/96,2)+Math.pow((cy-160)/92,2)<1.15)continue; // 水庫
    if(cx>520&&cy<250)continue;
    if(Math.abs(cx-340)<70&&Math.abs(cy-172)<40)continue; // 葫蘆埤
    if(Math.abs(cx-250)<44&&Math.abs(cy-110)<24)continue; // 官田
    if(Math.abs(cx-266)<80&&cy>396&&cy<522)continue; // 水雉園區
    if(Math.abs(cx-650)<30&&Math.abs(cy-420)<30)continue;
    if(cy>540&&Math.abs(cx-420)<170)continue; // 季節的字
    if(r()<.1)continue;
    p+='<rect x="'+x+'" y="'+y+'" width="38" height="28" rx="3" fill="#A9CFD8" stroke="#F3EAD4" stroke-width="3"/><circle cx="'+f1(x+9+r()*6)+'" cy="'+f1(y+9+r()*4)+'" r="5" fill="#6AA548"/><circle cx="'+f1(x+25+r()*5)+'" cy="'+f1(y+17+r()*4)+'" r="6" fill="#5C9A3E"/>';

  end:function(area,i,l){

      var k=steps[n],v=LV[k],s=stopOf(k);
      cam(camFor(k,v));setEra(v.era||'now');
      if(s){pinEl.style.display='';pinEl.setAttribute('transform','translate('+s.x+' '+(s.y-18)+')')}else pinEl.style.display='none';
      var txt=v.win||(v.q&&v.q.e)||(v.why&&v.why[1])||'';
      box.innerHTML='<div class="rc"><span class="seal'+(st.done[k]?'':' empty')+'">'+(st.done[k]?icon(v.stamp[0]):'')+'</span><div><p class="rk">'+v.kick+'</p><p class="rh">'+v.h+'</p><p>'+txt+'</p></div></div>';
      btn.innerHTML=n<steps.length-1?'下一段':'從頭<br>再看';
      cnt.textContent='第 '+(n+1)+' / '+steps.length+' 段';
    }
    btn.addEventListener('click',function(){n=n<steps.length-1?n+1:-1;show();into(btn)});
    area.querySelector('.again-btn').addEventListener('click',function(){st={far:0,done:{0:1},name:''};save();chips();setEra('now');go(0)});
    show();
    if(!reduce&&firstTime)confetti();
  }

};
function confetti(){var cs=['#E2574C','#F5A623','#7BC47F','#6EC3DD','#F7A8C4'];for(var k=0;k<36;k++){var c=document.createElement('i');c.className='conf';c.style.left=(Math.random()*100)+'vw';c.style.background=cs[k%5];c.style.animationDelay=(Math.random()*.8)+'s';document.body.appendChild(c);setTimeout(function(x){return function(){x.remove()}}(c),3600)}}

/* ---------- 換關 ---------- */
var pv=document.getElementById('pv'),nx=document.getElementById('nx');
function paint(){
  nx.disabled=cur===LV.length-1||!st.done[cur];nx.textContent=st.done[cur]||cur===LV.length-1?'下一關 ›':'先完成任務';
  pv.disabled=cur===0;nx.style.visibility=cur===LV.length-1?'hidden':'';document.getElementById('pos').textContent=cur===0?'開始':(cur===LV.length-1?'完成':'第 '+cur+' / 6 關');
  map.querySelectorAll('.stop').forEach(function(g){g.classList.toggle('lock',+g.dataset.lv>st.far)});
}
// 鏡頭：每一關都把那一關的地點放在圓的正中間；全景（正方形鏡頭）照原樣
function camFor(i,l){var c=l.cam;if(c[2]===c[3])return c;var s=null;STOPS.forEach(function(t){if(t.lv===i)s=t});if(!s&&l.pin!==undefined)s=STOPS[l.pin];
  var z=c[3]*1.05,cx=s?s.x:c[0]+c[2]/2,cy=s?s.y-6:c[1]+c[3]/2;return [cx-z/2,cy-z/2,z,z]}
function go(i){
  cur=i;if(i>st.far){st.far=i;save()}replay=-1;var l=LV[i];clearScene();
  cam(camFor(i,l));setEra(l.era||'now');
  if(l.pin!==undefined){var s=STOPS[l.pin];pinEl.style.display='';pinEl.setAttribute('transform','translate('+s.x+' '+(s.y-18)+')')}else pinEl.style.display='none';
  render(i);paint();
}
pv.addEventListener('click',function(){if(cur>0)go(cur-1)});
nx.addEventListener('click',function(){if(st.done[cur]&&cur<LV.length-1)go(cur+1)});
var sheet=document.getElementById('sheet');
document.getElementById('chips').addEventListener('click',function(){if(st.far>=LV.length-1)go(LV.length-1)});
function closeSheet(){sheet.hidden=true;document.getElementById('chips').focus()}
document.getElementById('sheetX').addEventListener('click',closeSheet);
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)closeSheet()});
chips();go(Math.min(st.far,LV.length-1));
</script>
</body>
