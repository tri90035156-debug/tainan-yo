<h1>黑琵度冬任務・候鳥・黑面琵鷺</h1>
<p>當<b>賞鳥亭</b>的小小解說員，從秋天到春天陪<b>黑琵</b>：安靜等牠降落、用望遠鏡找<b>腳環</b>、轉<b>水門</b>放水，最後送牠<b>飛回北方</b>。</p>
<p>地點：曾文溪口（臺南市七股區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>每年秋天，有一群很特別的鳥，從北方飛到臺南過冬。牠們叫黑面琵鷺，大家都叫牠黑琵。黑琵的臉黑黑的，嘴巴前面扁扁圓圓的，像一支湯匙。全世界的黑琵，有一大半會來臺灣過冬。你的任務：從秋天到春天，好好照顧來過冬的黑琵。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・曾文溪口（10 月）：黑琵飛來了</h3><p>十月，東北季風吹起來了。一群黑琵飛過大海，看到了曾文溪口的泥灘（退潮時露出來的爛泥地）。牠們飛累了，想降落休息。這時候如果有人大叫、跑來跑去，黑琵就會嚇得又飛起來。</p><p>為什麼？為什麼不能嚇鳥？ 黑琵白天大多聚在空曠、安靜的泥灘上休息。被嚇飛一次，就要多用掉很多力氣。看鳥的時候要小聲、慢慢走，也不要靠太近。</p></li>
<li><h3>第 2 關・黑面琵鷺賞鳥亭：找找戴腳環的黑琵</h3><p>賞鳥亭是讓人躲在裡面看鳥的小房子。鳥看不到人，就不會被嚇到。有些黑琵的腳上，戴著有號碼的腳環。看清楚號碼，就能查到牠是從哪裡來的。</p><p>為什麼？腳環有什麼用？ 研究的人會幫黑琵戴上有號碼的腳環，有些還背著小小的衛星發報器。別人在別的地方看到號碼，就知道這隻鳥去過哪裡。曾經有一隻在韓國戴上腳環的小黑琵，後來飛到了臺灣。</p></li>
<li><h3>第 3 關・七股的淺魚塭（晚上）：晚上出門吃飯</h3><p>天黑了。休息了一整天的黑琵，飛到水淺淺的魚塭找東西吃。黑琵吃東西的樣子很特別：把扁扁的嘴巴伸進水裡，左右掃來掃去，碰到小魚小蝦就咬住。</p><p>為什麼？為什麼晚上才吃飯？ 黑琵習慣在晚上出來找東西吃，白天大多聚在空曠、不容易被打擾的地方休息。所以白天在泥灘上看到的黑琵，常常是在睡覺。</p></li>
<li><h3>第 4 關・友善魚塭（冬天）：把水放淺一點</h3><p>冬天，魚塭的阿伯把虱目魚收成了。池子裡還有很深的水，水裡剩下一些小魚小蝦。可是水太深了，黑琵站不到底，吃不到東西。阿伯請你幫忙，打開水門放水。</p><p>為什麼？為什麼水太深不行？ 黑琵大多在水深大約 20 公分以下的淺水裡找東西吃。水太深就站不住、吃不到。以前的淺坪魚塭冬天會休息、水放得淺淺的，就變成候鳥吃飯的好地方。現在有些漁民收成後，也會特別把水放淺，留給黑琵。</p></li>
<li><h3>第 5 關・一月數鳥：一起數黑琵</h3><p>每年一月，世界各地看鳥的人約好在同一個週末，一起數黑琵。這叫同步普查（大家同時數，才不會重複數到同一隻）。你也來幫忙！你用畫正字的方法記：數一隻，畫一筆。</p><p>為什麼？為什麼要數鳥？ 數一數，才知道黑琵變多還是變少。2026 年全世界一共數到 7,746 隻，是有紀錄以來最多的。黑琵越來越多，表示大家保護牠們的方法有用。</p></li>
<li><h3>第 6 關・春天（3 到 5 月）：換上新羽毛，飛回北方</h3><p>春天到了，黑琵要準備飛回北方生寶寶。出發前，牠們的頭和脖子會長出金黃色的羽毛，叫做繁殖羽（準備生寶寶時才有的漂亮羽毛）。在臺灣，只有出發前一小段時間看得到。</p><p>為什麼？牠們怎麼飛回去？ 研究的人在黑琵背上放了小小的衛星發報器，看到牠們從七股起飛，沿著臺灣西邊的海岸往北飛，再飛過臺灣海峽。2026 年 3 月 30 日，就有黑琵這樣從七股出發。</p></li>
</ol>

function decorate(){
  // 一格一格的魚塭（避開河、泥灘和關卡）
  var r=rnd(23),h='',m='';
  for(var x=316;x<860;x+=60)for(var y=-60;y<660;y+=46){
    var px=x+(r()<.5?0:6),py=y;
    if(py>262&&py<350)continue;
    if(px<420&&py>180&&py<400)continue;
    if(STOPS.some(function(s){return Math.abs(s.x-px-24)<44&&Math.abs(s.y-py-14)<40}))continue;
    if(Math.abs(px+24-452)<40&&Math.abs(py+14-182)<30)continue;
    if(Math.abs(px+24-480)<70&&Math.abs(py+14-400)<20)continue;
    if(r()<.18)continue;
    h+='<rect x="'+px+'" y="'+py+'" width="50" height="36" rx="4" fill="#A9DCEA" stroke="#F7EEDA" stroke-width="3"/>';
  }
  map.querySelector('#ponds').innerHTML=h;
  for(var mx=330;mx<800;mx+=34){if(Math.abs(mx-400)<20)continue;m+=mangrove(mx,286+r()*4)+mangrove(mx+16,336+r()*4)}
  map.querySelector('#mang').innerHTML=m;
}

    // 點到哪一隻：找離手指最近的黑琵
    svg.addEventListener('pointerdown',function(e){var p=toSvg(svg,e),best=-1,bd=30;P.forEach(function(q,k){var d=Math.hypot(q[0]-p.x,q[1]-14-p.y);if(d<bd){bd=d;best=k}});if(best>=0)mark(best)});
    gs.forEach(function(g){g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();mark(+g.dataset.k)}})});
  },

  /* 第 6 關：擦一擦，換上金黃色的繁殖羽，再飛回北方 */
  molt:function(area,i,l){
    var BX=180,BY=128,S=2.6,BR=11,dots=[],done=false,lastP=null;
    var SAMP=[[-4,-25],[0,-26],[3,-22],[-10,-15],[-9.5,-11],[-7.5,-8],[-4,-6],[-7,-3],[-3,-3],[1,-3.5]].map(function(q){return {x:BX+q[0]*S,y:BY+q[1]*S,on:false}});
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F6EEDC"><defs><mask id="gm" maskUnits="userSpaceOnUse" x="-400" y="-400" width="1200" height="1200"><g id="gmk"></g></mask></defs>'+
      '<circle cx="62" cy="44" r="14" fill="#FFD66B" opacity=".8"/>'+tree(36,150)+tree(286,146)+'<rect x="-400" y="160" width="1200" height="60" fill="#DCC9A3"/>'+
      '<g id="me" style="transform:translate(0px,0px)'+(reduce?'':';transition:transform 1.6s ease-in')+'"><g id="stand">'+bird(BX,BY,S)+
      '<g id="gold" mask="url(#gm)"><g transform="translate('+BX+' '+BY+') scale('+S+')" fill="'+GOLD+'" stroke="'+GOLD+'">'+GOLDSHAPE+'</g></g>'+
      '<g id="hint" transform="translate('+BX+' '+BY+') scale('+S+')" fill="none" stroke="#BD9558" stroke-width=".7" stroke-dasharray="1.6 1.6">'+GOLDSHAPE.replace(/stroke-width="[^"]*"/g,'')+'</g></g>'+
      '<g id="flyer" style="display:none">'+bird(BX,BY-40,2,'fly gold')+'</g></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),mk=svg.querySelector('#gmk');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function dab(x,y){
      mk.insertAdjacentHTML('beforeend','<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+BR+'" fill="#fff"/>');
      SAMP.forEach(function(q){if(!q.on&&Math.hypot(q.x-x,q.y-y)<BR+2)q.on=true});
    }
    function paintTo(p){
      if(done)return;
      if(lastP){var d=Math.hypot(p.x-lastP.x,p.y-lastP.y),k=Math.ceil(d/5);for(var j=1;j<=k;j++)dab(lastP.x+(p.x-lastP.x)*j/k,lastP.y+(p.y-lastP.y)*j/k)}else dab(p.x,p.y);
      lastP=p;var c=SAMP.filter(function(q){return q.on}).length;bar.style.width=(c/SAMP.length*100)+'%';
      if(c>=SAMP.length-1)fly();
    }
    function fly(){
      done=true;svg.querySelector('#gold').removeAttribute('mask');svg.querySelector('#hint').remove();say(msg,'好漂亮的金黃色羽毛！準備出發⋯⋯');
      later(function(){svg.querySelector('#stand').style.display='none';svg.querySelector('#flyer').style.display='';svg.querySelector('#me').style.transform='translate(29px,0px) scale(.45)';
        say(msg,l.win);quiz(area,l,function(){finish(i)})},900);
    }
    drag(svg,function(t,p){if(t==='down'){lastP=null;paintTo(p)}else if(t==='move')paintTo(p);else lastP=null});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','黑琵的圖，按 Enter 幫牠換羽毛');
    svg.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();var q=SAMP.filter(function(q){return !q.on})[0];if(q){lastP=null;paintTo({x:q.x,y:q.y})}}});
    later(function(){if(!done&&!SAMP.some(function(q){return q.on}))say(msg,'金色虛線圍起來的地方，就是要擦的地方。')},9000);
  }
};
