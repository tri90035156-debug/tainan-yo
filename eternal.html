<h1>砲台任務・古蹟・安平億載金城</h1>
<p>跟著古蹟的導覽哥哥看<b>億載金城</b>：把城的四個角拉成<b>稜堡</b>、在<b>護城河</b>上鋪木橋、讓 5 尊大砲<b>對著海</b>、從砲口裝好<b>前膛砲</b>、找出有<b>膛線</b>的老砲，再把砲台蓋在第二個鯤鯓小島上。</p>
<p>地點：安平（臺南市安平區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>臺南安平的海邊，有一座四個角尖尖的城：億載金城。它是 1876 年蓋好的砲台，用來保護安平港。城門上的「億載金城」四個字，是當時的大官沈葆楨寫的，意思是希望它永遠堅固。跟著古蹟的導覽哥哥，從設計砲台一路看到今天。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・稜堡（1874 年）：把四個角拉尖</h3><p>1874 年，日本出兵臺灣（牡丹社事件），清朝派沈葆楨來加強海防。他決定在安平港旁邊蓋砲台，還請了法國工程師幫忙設計。安平港外都是沙洲，沒有山可以擋。所以他們把城蓋成「稜堡」：四個角往外尖尖地突出去，站在角上就能看到每一面城牆，沒有看不到的死角。</p><p>為什麼？稜堡是哪裡來的？ 稜堡是五百多年前從義大利開始流行的城堡樣子。億載金城是臺灣唯一還留著的稜堡。</p></li>
<li><h3>第 2 關・護城河：鋪一座木橋</h3><p>城的外面挖了一圈壕溝，裡面有水，叫護城河，敵人不容易靠近。要進城，就走城門外面的木橋。日本時代木橋壞了，才改成現在的水泥橋。</p><p>為什麼？護城河有什麼用？ 水擋在城的外面，敵人很難直接爬到城牆邊。要進城，只能走窄窄的橋，比較好守。</p></li>
<li><h3>第 3 關・向海的砲：大砲要對著海</h3><p>億載金城是保護海口的砲台，所以最大的砲要對著海。向海的那一面，放了 5 尊英國做的阿姆斯脫朗大砲；其他三面，放比較小的 20 磅和 40 磅小砲。</p><p>為什麼？城中間空空的大廣場是做什麼的？ 那是士兵操練的地方。士兵在這裡練習，有事的時候再跑到城牆上的砲台。</p></li>
<li><h3>第 4 關・前膛砲：從砲口裝填</h3><p>億載金城的阿姆斯脫朗大砲是「前膛砲」：火藥和砲彈要從前面的砲口放進去。今天城裡看到的，有一些是後來照著做的大砲；2024 年還放了一尊照日本時代老照片做的1:1 大砲模型。</p><p>為什麼？為什麼叫「前膛」？ 「膛」是砲管裡面的空間。從前面（砲口）裝東西的，叫前膛砲；後來的大砲改成從後面裝，叫後膛砲，裝得比較快。</p></li>
<li><h3>第 5 關・老砲：找出真正的老砲</h3><p>城牆上的大砲小砲，大多是 1975 年照著做的觀賞砲。可是城裡還有 1 尊，是當年真正的 20 磅小砲！怎麼認？真正的老砲，砲管裡面有一條一條螺旋的溝，叫「膛線」，可以讓砲彈轉著飛出去，飛得比較直。</p><p>為什麼？觀賞砲是做什麼的？ 當年大部分的真砲後來都不在了。1975 年照著以前的樣子，做了觀賞砲放回城牆上，讓大家看得到以前的樣子。</p></li>
<li><h3>第 6 關・二鯤鯓：第二個小島</h3><p>億載金城原本的名字，叫「二鯤鯓礮台」。很久以前，台江內海外面有一串沙洲小島，叫鯤鯓，從北到南有 7 個。億載金城就蓋在第二個小島上，所以叫二鯤鯓。旁邊比較小的安平小砲台，是對應的「小」砲台，億載金城以前也叫「安平大砲台」。</p><p>為什麼？七鯤鯓現在在哪裡？ 小島後來被泥沙連成陸地。最南邊的七鯤鯓，就是今天南區的灣裡（可以去玩「沙灘任務」）。</p></li>
</ol>

      if(!q){say(msg,'點一個<b>沙洲小島</b>。',1);return}
      if(q.k===1){done=true;draw();lvDone(area,i,l,msg,'就是第二個：二鯤鯓！');return}
      wrong++;say(msg,'這是第 <b>'+(q.k+1)+'</b> 個小島。從<b>上面（北邊）</b>開始數：一、二……',1)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','海上 7 個鯤鯓小島，按 Enter 選第二個');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();done=true;draw();lvDone(area,i,l,msg,'就是第二個：二鯤鯓！')}});
    later(function(){if(!done)say(msg,'從最<b>上面</b>那個小島開始數：一、二。點第二個。')},6000);
  }
};
</script>
