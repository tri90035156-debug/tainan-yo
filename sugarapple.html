<h1>釋迦任務・水果・歸仁釋迦</h1>
<p>跟著在<b>歸仁</b>種釋迦的舅舅：倒水比出<b>崙頂里</b>沙沙的土、剪短粗壯的枝、拿<b>圭筆</b>幫花授粉、把疏果套袋採收排上日子尺、撥開<b>鱗目</b>看鱗溝的顏色採收，再調溫度讓硬硬的釋迦兩天變軟。</p>
<p>地點：歸仁（臺南市歸仁區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>歸仁是臺灣西部最大的大目釋迦產區。歸仁南邊的崙頂里，種出來的大目釋迦又大又香，大約七月開始上市。一顆釋迦從開花到吃進嘴巴，要經過好多步驟。農業部的農業改良場有一本教釋迦怎麼種的教材，下面是教材說的大目釋迦一般種法。跟著在歸仁種釋迦的舅舅，從果園一路走到歸仁文化中心。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・崙頂里：沙沙的土</h3><p>舅舅抓起一把果園的土，土從手指縫流下去，沙沙的。農業部的食農教育網站說，崙頂里的土是沙質土壤，下雨以後水很快就流到地下去。這裡太陽也很充足，又沒有又熱又乾的焚風（從山上吹下來的熱風）吹過來。</p><p>為什麼？為什麼歸仁的釋迦長得好？ 食農教育網站說，歸仁南邊的崙頂里，土是沙質土壤，水流得快；太陽也很充足，又沒有焚風。1989 年起，農會開始推廣種釋迦。這裡的大目釋迦，最大一顆可以到一斤半。</p></li>
<li><h3>第 2 關・修剪：剪短粗壯的枝</h3><p>大目釋迦一般一年可以收兩次：冬天用力剪一次，新枝長出來就開花，夏天收成；夏天再剪一次，冬天又能收一次。教材說，夏天的這次，要挑樹冠裡面、下半部長得粗壯的枝，把它剪短，再拔掉葉子。這叫短截。剪完大約 7 到 10 天，剪口旁邊就會冒出新芽。</p><p>為什麼？為什麼剪了枝，釋迦反而會開花？ 釋迦的花，開在新長出來的枝上。夏天剪過以後，大約 7 到 10 天就冒出新芽，接著一朵一朵開花、結果。所以什麼時候剪，就差不多決定了什麼時候收成。</p></li>
<li><h3>第 3 關・開花：幫釋迦授粉</h3><p>新枝上開了花。釋迦的花很特別：裡面的雌蕊先準備好，花粉晚了一兩天才跑出來。因為這樣，要靠人來幫忙，這叫人工授粉。常見的工具之一，是一支細細的小筆，叫圭筆。</p><p>為什麼？為什麼釋迦要人幫忙授粉？ 釋迦的花，雌蕊先準備好，花粉晚一兩天才出來，所以要靠人幫忙。人拿圭筆，把別朵花的花粉塗到正在等的柱頭上，結的果子會比較多、比較好。有一說，釋迦的花粉大多在清晨跑出來。</p></li>
<li><h3>第 4 關・疏果和套袋：排好要做的事</h3><p>花謝了，小小的釋迦長出來。接下來，從授粉那天開始算日子：教材說，一個月內先疏果；大約第 50 到 65 天，幫果子套袋，擋住果實蠅；夏天收的果子，大約第 90 到 110 天就可以採了。</p><p>為什麼？為什麼要幫釋迦套袋子？ 釋迦長到中大的時候，很容易被果實蠅叮。套上紙袋，就像幫果子穿一件衣服，把蟲擋在外面。套袋以前，還要先疏果：把長歪的、生病的、一根枝上太多的果子摘掉，留下來的才長得好。</p></li>
<li><h3>第 5 關・採收：撥開看鱗溝</h3><p>釋迦表面一格一格凸起來的，叫鱗目；鱗目和鱗目中間的縫，叫鱗溝。教材說，果子熟了，鱗目會轉成黃色或淺綠色，鱗溝也會裂開，變成奶黃色。這時候就可以採了。採下來要放在陰涼的地方。</p><p>為什麼？為什麼採下來要放在陰涼的地方？ 果子剛從太陽下的果園採下來，身上帶著田間熱。趕快放到陰涼的地方，把熱散掉，釋迦就可以放比較久。</p></li>
<li><h3>第 6 關・歸仁文化中心：讓釋迦變軟</h3><p>歸仁每年夏天辦釋迦節。2026 年的釋迦節，就在歸仁文化中心廣場，有賣釋迦，還有釋迦做的點心。你買了一顆硬硬的釋迦。教材說，剛採下來的釋迦是硬的，要放在室溫等它變軟才能吃，這叫後熟。</p><p>為什麼？為什麼硬硬的釋迦不能放冰箱？ 釋迦怕冷，硬的時候放進冰箱，就再也不會好好變軟。也不能裝進塑膠袋綁起來：釋迦一直在呼吸，袋子裡的空氣變差，它會悶住、不會軟。等它軟了還沒吃完，才可以放冰箱。</p></li>
</ol>

function anim(fn){var raf=0,last=0,on=true;function step(now){if(!on)return;var dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(fn(dt)===false){on=false;return}raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step);loops.push(function(){on=false;cancelAnimationFrame(raf)});return function(){on=false;cancelAnimationFrame(raf)}}
// 一定要等的時間（later() 在「減少動態效果」時會變成 0）
function wait(fn,ms){var t=setTimeout(fn,ms);loops.push(function(){clearTimeout(t)})}
// 點到線段的距離（只算線段外面那一段 t0~1）
function segD(p,a,t0){var dx=a[2]-a[0],dy=a[3]-a[1],L=dx*dx+dy*dy,t=clamp(((p.x-a[0])*dx+(p.y-a[1])*dy)/L,t0,1);return Math.hypot(p.x-(a[0]+t*dx),p.y-(a[1]+t*dy))}

  /* 第 2 關：點樹冠裡面、下半部粗壯的枝剪短（細的、最外面高高的不要剪） */

        var a=Math.atan2(b[3]-b[1],b[2]-b[0])*180/Math.PI;

        else{h+='<circle cx="'+f1(e[0])+'" cy="'+f1(e[1])+'" r="3" fill="#E8D8B0" stroke="'+BARK2+'"/>';if(b.bud)h+='<circle cx="'+f1(e[0]+3)+'" cy="'+f1(e[1]-5)+'" r="3.2" fill="#9CD06A" stroke="'+GRN2+'"/>'}});

    function cut(b){b.cut=true;n++;
      [.5,.75,1].forEach(function(t,j){fall.push({x:b[0]+(b[2]-b[0])*t,y:b[1]+(b[3]-b[1])*t-5,a:0,t:j})});

      say(msg,'喀嚓！剪短了，葉子也拔掉了。還要再剪 '+(3-n)+' 根。')}
    drag(svg,function(t,p){if(t!=='down'||done)return;
      var b=null,bd=22;B.forEach(function(q){var d=segD(p,q,.35);if(d<bd){bd=d;b=q}});
      if(!b){say(msg,'點一根<b>樹枝</b>。找樹冠裡面、下半部，<b>粗粗壯壯</b>的那種。',1);return}

      if(b[5]==='top'){say(msg,'這根長在樹冠<b>最外面、高高的</b>，不用剪。找<b>裡面、下半部</b>粗壯的枝。',1);return}

    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','一棵釋迦樹，按 Enter 剪下一根粗壯的枝');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var b=null;B.forEach(function(q){if(!b&&q[5]==='ok'&&!q.cut)b=q});if(b)cut(b)}});

  /* 第 4 關：把疏果、套袋、採收三張卡拖到日子尺上對的日子（拖的時候看那天的果子多大） */
  timeline:function(area,i,l){
    var RY=150,X0=30,X1=290,C=[{n:'疏果',s:'一個月內',lo:0,hi:30,x:70},{n:'套袋',s:'第 50–65 天',lo:50,hi:65,x:160},{n:'採收',s:'第 90–110 天',lo:90,hi:110,x:250}];

    var cur=-1,pd=-1,done=false,n=0;
    function X(d){return X0+d*(X1-X0)/120}

    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F2F0E6"><rect x="-400" y="176" width="1200" height="60" fill="'+SAND+'"/>'+

    for(var d=0;d<=120;d+=10)s+='<path d="M'+f1(X(d))+' '+RY+'v'+(d%30?5:9)+'" stroke="#6C2024" stroke-width="'+(d%30?1.2:2)+'"/>';

    function card(c,x,y,on){return '<g transform="translate('+f1(x)+' '+f1(y)+')"><rect x="-42" y="-19" width="84" height="38" rx="9" fill="'+(on?'#FFF1C8':'#FFF8EC')+'" stroke="'+(on?'#DB2E27':'#BD9558')+'" stroke-width="'+(on?2.6:1.6)+'"/><text y="-2" font-size="15" font-weight="900" fill="#6C2024" text-anchor="middle">'+c.n+'</text><text y="14" font-size="13" fill="#5A4E48" text-anchor="middle">'+c.s+'</text></g>'}
    function draw(){var h='';
      C.forEach(function(c,k){if(c.d>=0){var x=X(c.d);h+='<path d="M'+f1(x)+' '+RY+'V'+(RY-30)+'" stroke="#3F6B2E" stroke-width="2"/><path d="M'+f1(x)+' '+(RY-30)+'h30v14h-30z" fill="#3F6B2E"/><text x="'+f1(x+15)+'" y="'+(RY-19)+'" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">'+c.n+'</text>'}
        else if(k!==cur)h+=card(c,c.x,31)});

      pv.innerHTML=v;bar.style.width=(done?100:n*30)+'%'}
    draw();
    function place(k,d){var c=C[k];
      if(d>=c.lo&&d<=c.hi){c.d=d;n++;draw();
        if(n>=3){done=true;draw();lvDone(area,i,l,msg,'第 '+C[0].d+' 天疏果、第 '+C[1].d+' 天套袋、第 '+C[2].d+' 天採收！');return}
        say(msg,'放好了！第 '+d+' 天'+c.n+'。還有 '+(3-n)+' 張卡片。');return}
      var late=d>c.hi;
      var t={'疏果':late?'太晚了！疏果要在授粉後<b>一個月內</b>（30 天以前）做。':'',
        '套袋':late?'太晚了！套袋要在第 <b>50 到 65 天</b>。':'第 '+d+' 天果子還小，套袋要等到第 <b>50 到 65 天</b>。',
        '採收':late?'太晚了！夏天的果子，大約第 <b>90 到 110 天</b>採收。':'第 '+d+' 天果子還沒長好，要等到第 <b>90 到 110 天</b>。'}[c.n];

    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F4EEE4"><rect x="-400" y="176" width="1200" height="60" fill="#D8C8A8"/>'+
      '<rect x="'+(TX-7)+'" y="'+(TOP-4)+'" width="14" height="'+(BOT-TOP+10)+'" rx="7" fill="#fff" stroke="#8A7A70" stroke-width="1.6"/><circle cx="'+TX+'" cy="'+(BOT+14)+'" r="12" fill="#DB2E27" stroke="#8A7A70" stroke-width="1.6"/>';
    ST.forEach(function(t){s+='<path d="M'+(TX+8)+' '+t.y+'h8" stroke="#8A7A70" stroke-width="1.6"/><text x="'+(TX+20)+'" y="'+(t.y+5)+'" font-size="13" font-weight="700" fill="#5A4E48">'+t.lab+'</text>'});
    s+='<rect x="'+(TX-4)+'" y="0" width="8" height="0" fill="#DB2E27" id="col"/><circle id="knob" cx="'+TX+'" cy="0" r="9" fill="#fff" stroke="#DB2E27" stroke-width="3"/>'+
      '<path d="M192 160H290" stroke="#B8A888" stroke-width="3" stroke-linecap="round"/><g id="fx"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),col=svg.querySelector('#col'),knob=svg.querySelector('#knob'),fx=svg.querySelector('#fx');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function val(){var b=ST[0],bd=999;ST.forEach(function(t){var d=Math.abs(t.y-ty);if(d<bd){bd=d;b=t}});return b}
    function draw(){col.setAttribute('y',f1(ty));col.setAttribute('height',f1(BOT+6-ty));knob.setAttribute('cy',f1(ty));
      var h='<rect x="208" y="16" width="64" height="44" rx="6" fill="#fff" stroke="#BD9558" stroke-width="1.6"/><rect x="208" y="16" width="64" height="12" rx="4" fill="#DB2E27"/><text x="240" y="52" font-size="17" font-weight="900" fill="#2A2020" text-anchor="middle">第 '+day+' 天</text>';
      h+=sa(240,124,28,{ripe:soft>.5,open:soft});
      if(shell)h+='<ellipse cx="240" cy="126" rx="30" ry="32" fill="#6A4A2A" opacity=".55"/><text x="240" y="174" font-size="14" font-weight="900" fill="#6A4A2A" text-anchor="middle">長出硬殼</text>';
      else if(day>0)h+='<text x="240" y="174" font-size="14" font-weight="900" fill="'+(soft>=1?'#3F6B2E':'#6C2024')+'" text-anchor="middle">'+(soft>=1?'軟了':'還是硬的')+'</text>';
      fx.innerHTML=h;bar.style.width=(done?100:Math.min(80,tries*20))+'%'}
    draw();
    function run(){var t=val();busy=true;tries++;ty=t.y;day=0;soft=0;shell=0;draw();
      var need=t.v===20?4:t.v===30?2:t.v===5?5:1,j=0;
      say(msg,'放在 <b>'+t.v+' 度</b>……一天一天過去。');
      (function tick(){j++;day=j;
        if(t.v===20||t.v===30)soft=Math.min(1,j/need);
        if(t.v===45)shell=1;
        draw();
        if(j<need){wait(tick,600);return}
        wait(function(){busy=false;
          if(t.v===30){done=true;draw();lvDone(area,i,l,msg,'<b>30 度</b>左右，第 2 天就軟了！');return}
          if(t.v===20)say(msg,'<b>20 度</b>要大約 <b>4 天</b>才變軟，兩天後還是硬的，來不及給外婆。再找找看。',1);
          else if(t.v===5)say(msg,'<b>5 度</b>就像放在冰箱裡，太冷了！釋迦不會變軟。再找找看。',1);
          else say(msg,'<b>45 度</b>太熱了！高過 40 度，果皮會長出<b>硬殼</b>，不能好好變軟。再找找看。',1);
          day=0;soft=0;shell=0;draw()},700)})()}
    drag(svg,function(t,p){if(busy||done)return;
      if(t==='down'){if(p.x>TX+110||p.x<TX-40){say(msg,'按住左邊<b>溫度計</b>的紅色柱子，上下拖。',1);return}hold=true}
      if(!hold)return;
      if(t==='down'||t==='move'){ty=clamp(p.y,ST[3].y,ST[0].y);draw();return}
      if(t==='up'){hold=false;ty=val().y;draw();run()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','溫度計和一顆釋迦，按上下鍵選溫度，按 Enter 放放看');
    svg.addEventListener('keydown',function(e){if(busy||done)return;var k=ST.indexOf(val());
      if(e.key==='ArrowUp'){e.preventDefault();ty=ST[Math.min(3,k+1)].y;draw()}else if(e.key==='ArrowDown'){e.preventDefault();ty=ST[Math.max(0,k-1)].y;draw()}
      else if(e.key==='Enter'||e.key===' '){e.preventDefault();run()}});
    later(function(){if(!tries)say(msg,'手指按住溫度計的<b>紅色柱子</b>，往上拖溫度變高，往下拖變低，放開就開始放放看。')},7000);
  }
};
</script>
