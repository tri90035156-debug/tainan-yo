<style>
:root{
  --bg:#FFF8EC; --card:#FFFDF7; --ink:#5A3E2B; --muted:#9A7B62; --line:#EBD9BF;
  --red:#E2574C; --sea:#9ED9EC; --water:#6EC3DD; --blue:#2E93B8; --green:#7BC47F; --sand:#F8E7C2;
  --f:"Huninn","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#F3E6CF;color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.7;overflow:hidden}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
header{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px}
header h1{margin:0;font-size:20px;font-weight:400;flex:1;line-height:1.3}
.chips{display:flex;gap:3px;background:none;border:0;padding:4px;cursor:pointer;border-radius:8px}
.chips i{display:grid;place-items:center;width:22px;height:22px;border:1.5px dashed #D9BFA0;border-radius:6px;font:14px/19px var(--f);font-style:normal;text-align:center;color:transparent}
.chips i.on{border:1.5px solid var(--red);background:var(--red);color:#fff}
.chips i svg{width:17px;height:17px}
.chips i.pop{animation:pop .5s cubic-bezier(.2,1.8,.4,1)}

.stage{flex:none;position:relative;height:clamp(250px,50vh,520px);background:var(--sea);overflow:hidden;border-top:3px solid var(--line);transition:height .35s}
#map{width:100%;height:100%;display:block;touch-action:manipulation}
[hidden]{display:none!important}
#scene{position:absolute;inset:0;background:#DFF3F8;animation:fadein .35s}
#scene svg{display:block;width:100%;height:100%;margin:0;border-radius:0;background:none!important}
@keyframes fadein{from{opacity:0}}
#peek{position:absolute;left:8px;top:8px;font:15px var(--f);background:#fff;color:var(--ink);border:0;border-radius:999px;padding:5px 14px;box-shadow:0 2px 6px rgba(90,62,43,.18);cursor:pointer}
#past,#now{transition:opacity .7s}
#map.now #past{opacity:0}
#map:not(.now) #now{opacity:0;pointer-events:none}
#boat{transition:opacity .7s}#map.now #boat{opacity:0}
.era{position:absolute;right:8px;top:8px;display:flex;background:#fff;border-radius:999px;padding:3px;box-shadow:0 2px 6px rgba(90,62,43,.18)}
.era button{font:15px var(--f);border:0;background:none;color:var(--muted);padding:4px 12px;border-radius:999px;cursor:pointer}
.era button[aria-pressed="true"]{background:var(--ink);color:#fff}
.stop{cursor:pointer}
.stop.lock{opacity:.55;cursor:default}
.pin{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

main{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 8px;font-size:19px;background:var(--card);border-radius:18px 18px 0 0;margin-top:-10px;position:relative;box-shadow:0 -3px 10px rgba(90,62,43,.08)}
.kick{margin:0;font-size:14px;color:var(--red)}
h2{margin:0 0 4px;font-size:26px;font-weight:400;line-height:1.35}
main p{margin:0 0 10px}
.task{background:#FFF0D6;border-radius:12px;padding:8px 12px;font-size:20px}
main .note{font-size:13px;line-height:1.5;color:var(--muted);margin-top:4px}
.big{display:block;width:100%;font:24px var(--f);background:var(--red);color:#fff;border:0;border-radius:16px;padding:12px;cursor:pointer;margin:8px 0;box-shadow:0 4px 0 #B8392F;transition:transform .08s}
.big:active,.big.down{transform:translateY(3px);box-shadow:0 1px 0 #B8392F}
.big.blue{background:var(--blue);box-shadow:0 4px 0 #1F6F8C}
.big.blue:active,.big.blue.down{box-shadow:0 1px 0 #1F6F8C}
.big:disabled{background:#D9C7B0;box-shadow:none;cursor:default}
.hold{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.mini{display:block;width:100%;height:auto;background:#DFF3F8;border-radius:14px;margin:4px 0 8px;touch-action:manipulation}
.item{transition:transform .55s cubic-bezier(.3,1.4,.5,1);cursor:pointer}
.item:focus-visible path{stroke:var(--red)}
.tap{cursor:pointer}
.tap:focus,.item:focus{outline:none}
.tap:focus-visible .ring{stroke:var(--red);stroke-width:3}
.bar{height:12px;background:#F0E2CC;border-radius:999px;overflow:hidden;margin:4px 0 8px}
.bar b{display:block;height:100%;width:0;background:var(--green);border-radius:999px;transition:width .3s}
.opt{display:block;width:100%;text-align:left;font:20px/1.5 var(--f);background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 0 8px;cursor:pointer}
.opt.no{color:#C3AE97;border-style:dashed;text-decoration:line-through}
.opt.yes{border-color:var(--green);background:#EEF8EC}
.opt:disabled{cursor:default}
.say{background:#EEF8EC;border-radius:12px;padding:8px 12px;font-size:18px}
.say.again{background:#FDECE8}
.skip{font:15px var(--f);background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px 0;cursor:pointer}
.got{display:flex;align-items:center;gap:14px;background:#FFF0D6;border-radius:14px;padding:10px 14px;margin:10px 0}
.got p{margin:0}
.why{background:#E6F4FA;border-radius:14px;padding:8px 12px;margin:0 0 10px}
.why summary{cursor:pointer;color:#1F6F8C;font-size:18px}
.why p{margin:6px 0 0}
.seal{display:grid;place-items:center;flex:none;width:56px;height:56px;border:3px solid var(--red);border-radius:12px;background:var(--red);color:#fff;font:32px/50px var(--f);text-align:center;transform:rotate(-6deg)}
.seal svg{width:74%;height:74%}
.seal.pop{animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(2.2) rotate(-20deg);opacity:0}100%{transform:rotate(-6deg);opacity:1}}
@keyframes pop{0%{transform:scale(1.8)}100%{transform:none}}
.again-btn{font:14px var(--f);background:none;border:1.5px solid var(--line);border-radius:999px;padding:3px 14px;color:var(--muted);cursor:pointer}

.foot{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--line)}
.foot button{font:17px var(--f);background:none;border:0;color:var(--ink);padding:6px 10px;cursor:pointer;border-radius:8px}
.foot #nx{color:var(--red)}
.foot button:disabled{color:#D9C7B0;cursor:default}
.foot span{font-size:14px;color:var(--muted)}

.doc{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px 14px 8px}
.doc h3{margin:0 0 8px;font-size:24px;font-weight:400;text-align:center;letter-spacing:.2em}
.doc dl{margin:0 0 8px;display:grid;grid-template-columns:4em minmax(0,1fr);gap:0 8px;font-size:15px}
.doc dt{color:var(--muted)}.doc dd{margin:0}
.doc ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:2px dashed var(--line);padding-top:10px}
.doc li{text-align:center;font-size:13px;color:var(--muted);line-height:1.4}
.doc li .seal{width:48px;height:48px;margin:0 auto 4px}
.doc li .seal.empty{background:none;border:2px dashed #D9BFA0;transform:none;color:transparent}
.doc .fic{margin:8px 0 0;font-size:12px;color:var(--muted);text-align:center}
.name{font:17px var(--f);border:0;border-bottom:2px solid var(--ink);background:none;width:9em;color:var(--ink);padding:0 2px}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(90,62,43,.45);display:grid;place-items:center;padding:16px}
.sheet[hidden]{display:none}
.sheet .in{width:min(380px,100%);max-height:calc(100% - 32px);overflow-y:auto;background:var(--bg);border-radius:18px;padding:14px}
.sheet .x{display:block;margin:10px auto 0;font:16px var(--f);background:none;border:1.5px solid var(--line);border-radius:999px;padding:4px 18px;cursor:pointer;color:var(--ink)}
.conf{position:fixed;top:-12px;width:10px;height:14px;border-radius:3px;z-index:20;pointer-events:none;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main a{color:var(--blue)}
@media (prefers-reduced-motion:reduce){.stage{transition:none}.pin,.seal.pop,.chips i.pop,.conf{animation:none}.item{transition:none}}
/* 平板直拿：畫面變寬一點 */
@media (min-width:700px){.app{max-width:760px}}
/* 電腦、平板橫拿、手機橫拿：左邊大舞台（地圖／遊戲），右邊文字卡片 */
@media (min-width:700px) and (min-aspect-ratio:5/4){
  body{background:#EADBC0}
  .app{max-width:1320px;display:grid;grid-template-columns:minmax(0,1fr) clamp(330px,34vw,470px);grid-template-rows:auto minmax(0,1fr) auto}
  header{grid-column:1/-1;padding:10px 20px}
  header h1{font-size:24px}
  .chips i{width:26px;height:26px}.chips i svg{width:20px;height:20px}
  .stage{grid-column:1;grid-row:2/4;height:auto;border-top:3px solid var(--line)}
  main{grid-column:2;grid-row:2;margin-top:0;border-radius:0;box-shadow:none;border-top:3px solid var(--line);border-left:3px solid var(--line);padding:16px 20px 10px}
  .foot{grid-column:2;grid-row:3;border-left:3px solid var(--line)}
}
/* ===== 新版面：上面標題、中間遊戲畫面、下面文字 =====
   配色取自臺南城市識別：紅 #DB2E27、酒紅 #6C2024、金 #BD9558；插畫裡的水和海維持藍色 */
:root{
  --bg:#FBF7F1; --card:#FBF7F1; --paper:#FFFFFF; --ink:#2A2020; --muted:#8A7A70; --line:#EADFD3;
  --red:#DB2E27; --maroon:#6C2024; --gold:#BD9558; --goldsoft:#F3E8D6; --blue:#6C2024; --green:#BD9558;
  --f:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
body{background:#EFE7DC;color:var(--ink)}
header{padding:12px 18px 2px}
header h1{font:700 15px/1.3 var(--f);letter-spacing:.06em;color:var(--ink)}
.chips{gap:5px}
.chips i{width:20px;height:20px;border-radius:50%;border:1.5px dashed var(--gold)}
.chips i.on{background:var(--red);border-color:var(--red)}
.chips i svg{width:14px;height:14px}
.top{flex:none;padding:6px 18px 14px}
.top .kick{margin:0 0 2px;font:700 15px/1.4 var(--serif);letter-spacing:.06em;color:var(--red)}
.top h2{margin:0;font:900 30px/1.25 var(--serif);color:var(--ink);text-wrap:balance}
.stage{height:clamp(220px,42vh,480px);margin:0 16px;border-top:0;border-radius:26px;box-shadow:0 0 0 8px var(--goldsoft)}
main{margin-top:0;border-radius:0;box-shadow:none;background:var(--bg);padding:20px 18px 8px}
main p{line-height:1.75}
main .kick{font:700 15px var(--serif);letter-spacing:.04em}
.task{background:var(--goldsoft);border-radius:14px;padding:10px 14px;font-weight:500}
.big{font:700 22px var(--f);border-radius:14px;box-shadow:none;background:var(--red);letter-spacing:.04em}
.big:active,.big.down{transform:translateY(2px);box-shadow:none;filter:brightness(.9)}
.big.blue{background:var(--maroon);box-shadow:none}
.big.blue:active,.big.blue.down{box-shadow:none}
.big:disabled{background:#D8CFC4}
.opt{font:500 20px/1.5 var(--f);border:2px solid var(--line);background:var(--paper);border-radius:14px}
.opt.yes{border-color:var(--gold);background:#FAF3E6}
.say{background:#F2ECE2;border-radius:14px}
.say.again{background:#FBE8E5}
.why{background:var(--paper);border:2px solid var(--goldsoft);border-radius:14px}
.why summary{font:700 18px var(--serif);color:var(--maroon)}
.got{background:var(--paper);border:2px solid var(--goldsoft);border-radius:14px}
.seal{border:0;border-radius:50%;background:var(--red);transform:none;box-shadow:0 0 0 6px var(--goldsoft)}
@keyframes stamp{0%{transform:scale(1.8);opacity:0}100%{transform:none;opacity:1}}
.again-btn{border-color:var(--gold);color:var(--maroon)}
.bar{background:#EFE6D8}.bar b{background:var(--gold)}
.foot{background:var(--bg);border-top:1px solid var(--line)}
.foot #nx{color:var(--red);font-weight:700}
#peek,.era{box-shadow:0 2px 8px rgba(42,32,32,.15)}
.era button[aria-pressed="true"]{background:var(--maroon)}
.doc{border:0;border-radius:18px;background:var(--paper);box-shadow:0 0 0 8px var(--goldsoft)}
.doc h3{font:900 26px var(--serif);letter-spacing:.12em;color:var(--ink)}
.doc li .seal.empty{border:2px dashed var(--gold);box-shadow:none}
.sheet .in{background:var(--bg)}
/* 換關時文字一行一行浮上來 */
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.06s}.enter>*:nth-child(3){animation-delay:.12s}.enter>*:nth-child(4){animation-delay:.18s}.enter>*:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.enter>*{animation:none}}
@media (min-width:700px){.top h2{font-size:34px}.top{padding:8px 24px 16px}.stage{margin:0 24px}}
@media (min-width:700px) and (min-aspect-ratio:5/4){
  body{background:#EFE7DC}
  .app{grid-template-rows:auto auto minmax(0,1fr) auto}
  header{grid-column:1/-1;padding:12px 24px 4px}
  header h1{font-size:15px}
  .top{grid-column:1;grid-row:2}
  .stage{grid-column:1;grid-row:3/5;height:auto;margin:0 24px 24px;border-top:0}
  main{grid-column:2;grid-row:2/4;border-top:0;border-left:1px solid var(--line);padding:20px 22px 10px}
  .foot{grid-column:2;grid-row:4;border-left:1px solid var(--line)}
}
/* ===== 圓形遊戲框 ===== */
.stage{display:flex;align-items:center;justify-content:center;background:none;box-shadow:none;border-radius:0;overflow:visible;height:clamp(220px,46vh,460px)}
.stage{position:relative;min-height:0}
.disc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;height:300px;border-radius:50%;overflow:hidden;background:var(--sea);box-shadow:0 0 0 12px var(--goldsoft)}
#map{width:100%;height:100%}
#scene{display:flex;align-items:center;justify-content:center}
#scene svg{flex:none}
#scene svg:focus:not(:focus-visible),#scene [tabindex]:focus:not(:focus-visible){outline:none}
#peek{left:0;top:0}
.era{right:0;top:0}
@media (min-width:700px) and (min-aspect-ratio:5/4){.stage{height:auto}}
/* ===== 不用色塊區分文字：改用粗體和顏色；大按鈕是圓的 ===== */
.task{background:none;padding:0;border-radius:0;font-weight:700;color:var(--maroon)}
.say{background:none;padding:0;border-radius:0;font-weight:700;color:#4E7D3A}
.say.again{background:none;color:var(--red)}
.why,.got{background:none;border:0;padding:0;border-radius:0}
.why summary{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px}
.got{margin:16px 0}
.opt{border-radius:999px;padding:10px 20px}
.big{display:grid;place-items:center;width:116px;height:116px;margin:18px auto;padding:10px;border-radius:50%;font:700 20px/1.3 var(--f);text-align:center;box-shadow:0 0 0 8px var(--goldsoft)}
.big.blue{box-shadow:0 0 0 8px var(--goldsoft)}
.big:active,.big.down,.big.blue:active,.big.blue.down{box-shadow:0 0 0 8px var(--goldsoft)}
.big:disabled{box-shadow:0 0 0 8px #EFE8DF}
.again-btn{border-radius:999px}
/* ===== 用粗細帶重點：內文細一點、淡一點，重點字粗黑 ===== */
main p,main li,.doc dd{color:#5A4E48}
main b,main strong{font-weight:700;color:var(--ink)}
.task,.task b{color:var(--maroon)}
.say b{color:inherit}
.say.again b{color:inherit}
/* 回饋訊息用一般粗細，只有重點詞粗 */
.say{font-weight:400;color:#3F6B2E}
.say.again{font-weight:400;color:#B8261F}
.say b{font-weight:700}
/* ===== 手機：地圖和文字在同一頁一起捲，上一關／下一關固定在最下面 ===== */
@media (max-width:699.98px),(max-aspect-ratio:1249/1000){
  html,body{height:auto;min-height:100%}
  body{overflow:visible}
  .app{height:auto;min-height:100vh}
  main{flex:none;overflow:visible;min-height:0}
  .foot{position:sticky;bottom:0;z-index:5}
  .stage{margin:0 2px}
  /* 圓黏在畫面上方：往下捲找按鈕時，圓和按鈕一定同時看得到 */
  .stage{position:sticky;top:0;z-index:4;background:var(--bg)}
  main *{scroll-margin-bottom:76px}
  .big{width:96px;height:96px;margin:12px auto;font-size:19px}
}
/* ===== 卡片文字角色（使用者定的規則） ===== */
.task{color:#6C2024;font-weight:700}
.bar{height:4px;background:#EFE6D8;border-radius:2px;margin:10px 0 12px}
.bar b{background:#6C2024;border-radius:2px}
.say{font-weight:400;color:#3F6B2E}
.say.again{font-weight:400;color:#B8261F}
.say.again::before{content:"再試試";display:block;font:700 13px var(--serif);letter-spacing:.08em;color:var(--red);margin-bottom:2px}
main .kick+p{font-weight:700;color:var(--ink)}
.notes{margin-top:24px;padding-top:12px;border-top:1px solid var(--line)}
.notes .note{margin:0 0 6px}
.notes .note b{color:#8A7A70}
/* ===== 完成頁：一段一段回顧 ===== */
.recap{min-height:150px}
.rc{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:start}
.rc .seal{width:58px;height:58px;margin-top:4px}
.rc .seal.empty{background:none;border:2px dashed var(--gold);box-shadow:none}
.rk{margin:0;font:700 13px var(--serif);letter-spacing:.08em;color:var(--red)}
.rh{margin:0 0 6px;font:900 22px/1.35 var(--serif);color:var(--ink)}
.rn{margin:-6px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,60px);gap:8px;justify-content:center;margin:16px auto 12px}
.pad button{border:0;border-radius:50%;background:var(--maroon);color:#fff;font:700 26px/1 var(--f);box-shadow:0 0 0 5px var(--goldsoft);cursor:pointer;touch-action:manipulation}
.pad button:active{filter:brightness(.88)}
.pad button:disabled{background:#D8CFC4}
.notes .maps a{color:inherit;text-decoration:underline;text-decoration-color:#C9B8A6;text-underline-offset:3px}
.recap:empty{min-height:0}
/* 回到首頁的小房子（每個遊戲左上角都有） */
.home{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--paper,#fff);color:var(--maroon,#6C2024);text-decoration:none}.home svg{width:20px;height:20px}.home:active{background:var(--goldsoft,#F3E8D6)}
</style>
</head>
<body>

<script>
/* ---------- 插畫元件 ---------- */
var K='#2A2020',NS='http://www.w3.org/2000/svg';
var SOIL='#B08A60',SOILD='#8A6A48',CLAY='#C88A5A',BONE='#F4EAD2';
function f1(v){return (Math.round(v*10)/10).toString()}
function rnd(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280}}
// 把幾個點連成圓滑的線
function smooth(pts){var d='M'+f1(pts[0][0])+' '+f1(pts[0][1]);
  for(var k=1;k<pts.length-1;k++)d+='Q'+f1(pts[k][0])+' '+f1(pts[k][1])+' '+f1((pts[k][0]+pts[k+1][0])/2)+' '+f1((pts[k][1]+pts[k+1][1])/2);
  var l=pts[pts.length-1];return d+'L'+f1(l[0])+' '+f1(l[1])}
// 圓底陶罐的半邊形狀：[離罐口多遠, 半邊多寬]
var PROF=[[0,30],[10,25],[22,40],[42,58],[66,64],[90,54],[108,32],[118,0]];
function potW(dy){if(dy<=0)return PROF[0][1];for(var k=1;k<PROF.length;k++)if(dy<=PROF[k][0]){var a=PROF[k-1],b=PROF[k];return a[1]+(b[1]-a[1])*(dy-a[0])/(b[0]-a[0])}return 0}
function potSide(cx,top,s,dir){return PROF.map(function(p){return [cx+dir*p[1]*s,top+p[0]*s]})}
function potPath(cx,top,s){var r=potSide(cx,top,s,1),l=potSide(cx,top,s,-1).reverse();return smooth(r)+smooth(l).replace('M','L')+'Z'}
// 繩紋：斜斜的細線花紋（id 要不一樣，地圖和遊戲圖才不會打架）
function cordDef(id,c){return '<defs><pattern id="'+id+'" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><rect width="5" height="5" fill="none"/><path d="M0 2.5H5" stroke="'+(c||'#6E3E22')+'" stroke-width="1.5" opacity=".6"/></pattern></defs>'}
function pot(cx,top,s,cord){var d=potPath(cx,top,s);return '<path d="'+d+'" fill="'+CLAY+'" stroke="#7A4A2E" stroke-width="'+f1(1.6/Math.max(.5,s))+'"/>'+(cord?'<path d="'+d+'" fill="url(#'+cord+')"/>':'')+'<ellipse cx="'+f1(cx)+'" cy="'+f1(top)+'" rx="'+f1(30*s)+'" ry="'+f1(5*s)+'" fill="#7A4A2E"/>'}
// 小狗的骨頭（頭朝下＝朝南）
function dogBones(x,y,s){var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s)+')" stroke="#A8906A" stroke-linecap="round" stroke-linejoin="round">';
  h+='<path d="M0 -50Q7 -43 2 -34" fill="none" stroke-width="2.6"/>';
  h+='<path d="M-6 -26L-17 -15L-19 -3M6 -26L17 -15L19 -3M-5 14L-16 22L-18 33M5 14L16 22L18 33" fill="none" stroke-width="3.2"/><path d="M-6 -26L-17 -15L-19 -3M6 -26L17 -15L19 -3M-5 14L-16 22L-18 33M5 14L16 22L18 33" fill="none" stroke="'+BONE+'" stroke-width="1.6"/>';
  h+='<ellipse cy="-26" rx="9" ry="4.5" fill="'+BONE+'" stroke-width="1"/>';
  for(var k=-8;k<=12;k+=5)h+='<path d="M-1 '+k+'Q-12 '+(k+2)+' -10 '+(k+7)+'M1 '+k+'Q12 '+(k+2)+' 10 '+(k+7)+'" fill="none" stroke-width="1.6"/>';
  for(var v=-33;v<=19;v+=5)h+='<circle cy="'+v+'" r="2.6" fill="'+BONE+'" stroke-width=".9"/>';
  h+='<path d="M-9 24Q0 17 9 24L5 41Q0 47 -5 41Z" fill="'+BONE+'" stroke-width="1.2"/><circle cx="-3.5" cy="29" r="1.8" fill="#8A7050" stroke="none"/><circle cx="3.5" cy="29" r="1.8" fill="#8A7050" stroke="none"/>';
  return h+'</g>'}
function riceG(x,y,r,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+(r||0)+') scale('+(s||1)+')"><ellipse rx="8" ry="3.6" fill="#2E2622"/><ellipse cx="-2" cy="-1.2" rx="3" ry="1" fill="#6A5A50"/></g>'}
function milletG(x,y,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+(s||1)+')"><circle r="4.4" fill="#3A2E28"/><circle cx="-1.4" cy="-1.4" r="1.2" fill="#7A6A60"/></g>'}
function stoneG(x,y,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+(s||1)+')"><path d="M-8 3Q-9 -5 -1 -6Q8 -6 8 1Q7 7 0 7Q-6 7 -8 3Z" fill="#9A9AA0" stroke="#6A6A70" stroke-width="1"/></g>'}
// 考古館（深色石牆、黃色的天井）
function museum(x,y,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s)+')"><path d="M-46 18H46V-12L30 -22H-30L-46 -12Z" fill="#4A4A4E" stroke="#2E2E32" stroke-width="1.4"/><rect x="-10" y="-22" width="20" height="40" fill="#F2C230"/><path d="M-40 -6H-16M-40 2H-16M16 -6H40M16 2H40" stroke="#6A6A70" stroke-width="1.2"/><rect x="-6" y="6" width="12" height="12" fill="#2E2E32"/></g>'}
var ICON={
  layers:'<rect x="-11" y="-10" width="22" height="20" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M-11 -4H11M-11 2H11" stroke="#fff" stroke-width="2"/><circle cx="-4" cy="6" r="1.6" fill="#fff"/><circle cx="4" cy="-7" r="1.4" fill="#fff"/>',
  dog:'<path d="M-6 0H6" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><circle cx="-8" cy="-3" r="2.8" fill="#fff"/><circle cx="-8" cy="3" r="2.8" fill="#fff"/><circle cx="8" cy="-3" r="2.8" fill="#fff"/><circle cx="8" cy="3" r="2.8" fill="#fff"/>',
  rice:'<ellipse cx="-4" cy="-4" rx="5" ry="2.2" transform="rotate(-30 -4 -4)" fill="#fff"/><ellipse cx="5" cy="-1" rx="5" ry="2.2" transform="rotate(40 5 -1)" fill="#fff"/><ellipse cx="-2" cy="6" rx="5" ry="2.2" fill="#fff"/>',
  cord:'<rect x="-5" y="-11" width="10" height="14" rx="2" fill="none" stroke="#fff" stroke-width="2"/><path d="M0 3V11" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M-5 -8L5 -5M-5 -3L5 0" stroke="#fff" stroke-width="1.2"/>',
  pot:'<path d="M-5 -10H5V-7Q10 -4 10 2Q10 10 0 11Q-10 10 -10 2Q-10 -4 -5 -7Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M-6 -1L6 4M-7 4L5 8" stroke="#fff" stroke-width="1"/>',
  museum:'<path d="M-11 9H11M-9 9V-3H9V9M-11 -3L-6 -9H6L11 -3" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><rect x="-2" y="-9" width="4" height="18" fill="#fff"/>'
};
function icon(k){return '<svg viewBox="-12 -12 24 24" aria-hidden="true">'+ICON[k]+'</svg>'}

function idCard(t1,t2,art,C){
  var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F2EBDD" role="img" aria-label="'+t1+'的樣子"><rect x="-400" y="170" width="1200" height="60" fill="'+SOIL+'"/>'+art;
  C.forEach(function(c){s+='<path d="M'+c[3]+' '+c[4]+'L'+c[1]+' '+(c[2]-5)+'" stroke="#8A7A70" stroke-width="1.2"/><circle cx="'+c[3]+'" cy="'+c[4]+'" r="2.6" fill="#DB2E27"/>'+
    '<text x="'+c[1]+'" y="'+c[2]+'" font-size="15" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#F2EBDD" stroke-width="4" paint-order="stroke">'+c[0]+'</text>'});
  return s+'<text x="160" y="30" font-size="24" font-weight="900" fill="#2A2020" text-anchor="middle" font-family="Noto Serif TC,Songti TC,serif" stroke="#F2EBDD" stroke-width="4" paint-order="stroke">'+t1+'</text>'+(t2?'<text x="160" y="188" font-size="14" font-weight="700" fill="#FFF8EC" text-anchor="middle">'+t2+'</text>':'')+'</svg>';
}
// 一關做完：說過關的話，有題目就出題，再蓋章
function lvDone(area,i,l,msg,t){say(msg,t);later(function(){say(msg,l.win);if(l.q)quiz(area,l,function(){finish(i)});else finish(i)},900)}

/* ---------- 地圖 ---------- */
// 示意圖：南科（新市）。「5000 年前」是村子、稻田和小米田；「今天」是科學園區的工廠和考古館
var STOPS=[{lv:1,n:'南科工地',x:220,y:200,k:'pit'},{lv:2,n:'南關里',x:400,y:150,k:'dog'},{lv:3,n:'南關里東',x:560,y:240,k:'rice'},{lv:4,n:'做陶罐',x:290,y:370,k:'pot'},{lv:5,n:'研究室',x:470,y:400,k:'lab'},{lv:6,n:'南科考古館',x:640,y:350,k:'museum'}];
function marker(s){
  var t='<g transform="translate('+s.x+' '+s.y+')">';
  if(s.k==='pit')return t+'<rect x="-22" y="-14" width="44" height="28" fill="'+SOILD+'" stroke="#5A3E2B" stroke-width="1.2"/><path d="M-22 -5H22M-22 4H22" stroke="#C8A470" stroke-width="2"/><path d="M14 -24L20 -12" stroke="#5A3E2B" stroke-width="2.4" stroke-linecap="round"/><path d="M18 -14L24 -10L20 -4Z" fill="#9AA6B0"/></g>';
  if(s.k==='dog')return t+'<rect x="-22" y="-26" width="44" height="50" fill="'+SOILD+'" stroke="#5A3E2B" stroke-width="1.2"/>'+dogBones(0,-2,.46)+'</g>';
  if(s.k==='rice')return t+'<ellipse rx="22" ry="11" fill="#F4F0E8" stroke="#A89A88" stroke-width="1.2"/>'+riceG(-8,-2,-20,.8)+riceG(6,-3,30,.8)+riceG(0,4,0,.8)+milletG(12,4,.7)+'</g>';
  if(s.k==='pot')return t+cordDef('cordM')+pot(0,-24,.38,'cordM')+'</g>';
  if(s.k==='lab')return t+'<rect x="-24" y="2" width="48" height="6" fill="#8A6A3A"/><path d="M-20 8V20M20 8V20" stroke="#5A3E2B" stroke-width="2.4"/>'+pot(-6,-22,.2)+'<circle cx="12" cy="-10" r="8" fill="#DDEFF4" stroke="#5A4E48" stroke-width="2"/><path d="M17 -4L23 2" stroke="#5A4E48" stroke-width="3" stroke-linecap="round"/></g>';
  return t+museum(0,-4,.62)+'</g>';
}
function buildMap(){
  var h='<rect x="-400" y="-300" width="1600" height="1200" fill="#E6DCC4"/>';
  h+='<g id="past"><rect x="-400" y="-300" width="1600" height="1200" fill="#D4E4B4"/><path d="M-400 520Q100 470 330 500Q560 540 820 470Q1000 430 1200 460" stroke="#8EC3D8" stroke-width="22" fill="none" stroke-linecap="round"/><g id="frPast"></g><text x="400" y="560" font-size="15" fill="#6C2024" text-anchor="middle" stroke="#D4E4B4" stroke-width="4" paint-order="stroke">5000 年前：這裡是村子、稻田和小米田</text></g>';
  h+='<g id="now"><rect x="-400" y="-300" width="1600" height="1200" fill="#E4E0D6"/><path d="M-400 90H1200M-400 470H1200M110 -300V900M740 -300V900" stroke="#F8F6F0" stroke-width="18" fill="none"/><g id="frNow"></g><text x="400" y="560" font-size="15" fill="#6C2024" text-anchor="middle" stroke="#E4E0D6" stroke-width="4" paint-order="stroke">今天：南部科學園區，有好多工廠</text></g>';
  var T=function(t,x,y,sz,c,bg){return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" fill="'+c+'" text-anchor="middle" stroke="'+(bg||'#E6DCC4')+'" stroke-width="4" paint-order="stroke">'+t+'</text>'};
  h+=T('新市',400,56,28,'#7A4A2E');
  h+='<g transform="translate(100 400)"><circle r="16" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.5"/><path d="M0 -11L5 4L0 1L-5 4Z" fill="#DB2E27"/><text y="12" font-size="9" fill="#5A4E48" text-anchor="middle">北</text></g>';
  h+=T('示意圖，不是真實比例',400,584,12,'#8A7A70');
  STOPS.forEach(function(s){h+='<g class="stop" data-lv="'+s.lv+'" role="button" aria-label="第 '+s.lv+' 關 '+s.n+'">'+marker(s)+'<circle cx="'+(s.x+26)+'" cy="'+(s.y-28)+'" r="10" fill="#fff" stroke="#E2574C" stroke-width="2"/><text x="'+(s.x+26)+'" y="'+(s.y-23.5)+'" font-size="13" fill="#E2574C" text-anchor="middle">'+s.lv+'</text><text x="'+s.x+'" y="'+(s.y+36)+'" font-size="16" font-weight="700" fill="#5A3E2B" text-anchor="middle" stroke="#FFF8EC" stroke-width="4" paint-order="stroke">'+s.n+'</text></g>'});
  h+='<g id="pin" style="display:none"><g class="pin"><path d="M0 0C-10 -14 -14 -20 -14 -27A14 14 0 1 1 14 -27C14 -20 10 -14 0 0Z" fill="#E2574C" stroke="#fff" stroke-width="2.5"/><text y="-22" font-size="12" fill="#fff" text-anchor="middle">你</text></g></g>';
  return h;
}
function near(x,y,w,hh){return STOPS.some(function(s){return Math.abs(s.x-x)<w&&Math.abs(s.y-y)<hh})}
function decorate(){
  var r=rnd(41),p='',q='';
  for(var x=20;x<820;x+=46)for(var y=30;y<540;y+=42){
    var cx=x+(r()-.5)*10,cy=y+(r()-.5)*8,a=r(),b=r();
    if(near(cx,cy,62,66))continue;
    if(Math.abs(cx-400)<50&&Math.abs(cy-48)<24)continue;
    if(Math.abs(cx-100)<34&&Math.abs(cy-400)<34)continue;
    // 5000 年前：茅草屋、稻田、樹（河的旁邊不放）
    if(cy<488||cy>530){
      if(a<.16)p+='<g transform="translate('+f1(cx)+' '+f1(cy)+')"><rect x="-10" y="-2" width="20" height="12" fill="#C8A878" stroke="#8A6A3A" stroke-width="1"/><path d="M-15 -1L0 -15L15 -1Z" fill="#B89A5A" stroke="#7A6030" stroke-width="1"/></g>';
      else if(a<.6)p+='<g transform="translate('+f1(cx)+' '+f1(cy)+')"><rect x="-17" y="-11" width="34" height="22" fill="'+(b<.5?'#A8CC78':'#C8D888')+'" stroke="#8AAA5A" stroke-width="1"/><path d="M-12 -6V6M-4 -6V6M4 -6V6M12 -6V6" stroke="#6E9A44" stroke-width="1.4" stroke-dasharray="2 2"/></g>';
      else if(a<.8)p+='<g transform="translate('+f1(cx)+' '+f1(cy)+')"><path d="M0 2V10" stroke="#6A4A2A" stroke-width="2.4"/><circle cy="-4" r="9" fill="#6EA048"/></g>';
    }
    // 今天：工廠（避開馬路）
    if(Math.abs(cy-90)<26||Math.abs(cy-470)<26||Math.abs(cx-110)<30||Math.abs(cx-740)<30)continue;
    if(b<.55)q+='<g transform="translate('+f1(cx)+' '+f1(cy)+')"><rect x="-17" y="-8" width="34" height="18" fill="'+(a<.5?'#B8C4CC':'#C8CCD4')+'" stroke="#8A96A0" stroke-width="1"/><path d="M-17 -8L-11 -14V-8L-5 -14V-8L1 -14V-8L7 -14V-8" fill="#9AA6B0" stroke="#8A96A0" stroke-width="1"/></g>';
    else if(b<.75)q+='<g transform="translate('+f1(cx)+' '+f1(cy)+')"><path d="M0 2V9" stroke="#6A4A2A" stroke-width="2.2"/><circle cy="-3" r="7" fill="#7EA858"/></g>';
  }
  // 5000 年前：村子裡的人和小狗
  p+='<g transform="translate(350 250)"><circle cy="-14" r="5" fill="#C8906A"/><path d="M-5 -9H5L6 6H-6Z" fill="#8A6A4A"/><path d="M14 2Q20 -4 28 0Q30 4 26 6H16Z" fill="#B8865A"/><circle cx="29" cy="-1" r="3.4" fill="#B8865A"/><path d="M15 3Q10 -2 12 -6" stroke="#B8865A" stroke-width="2" fill="none"/></g>';
  map.querySelector('#frPast').innerHTML=p;
  map.querySelector('#frNow').innerHTML=q;
}

/* ---------- 關卡 ---------- */
var LV=[
  {cam:[60,0,660,660],kick:'考古任務',h:'土裡的 5000 年',
   html:'<p>臺南<b>新市</b>有一大片<b>南部科學園區</b>（大家叫它<b>南科</b>），裡面有好多高科技工廠。</p><p>大約 30 年前要蓋南科的時候，往下一挖，竟然挖到好多 <b>5000 年前</b>的人留下來的東西！</p><p class="task">跟著南科考古隊的<b>考古姊姊</b>，一層一層往下挖，看看 5000 年前的人怎麼生活。每過一關，就能蓋一個章！</p>',
   after:'<p class="note">地圖右上角可以切換<b>5000 年前／今天</b>，看看同一個地方以前和今天的樣子。<br>給大人：南科考古館在新市區南科三路 10 號，週一休館；開放時間和票價以國立臺灣史前文化博物館公告為準。</p>',
   game:'start'},
  {cam:[0,0,300,225],kick:'第 1 關・南科工地（1995 年）',h:'土是一層一層的',

   task:'工地的土層被弄亂了！先<b>點一層</b>，再<b>點另一層</b>，兩層就會<b>交換</b>。把<b>最老的</b>換到<b>最下面</b>，最新的放最上面。',game:'swap',stamp:['layers','排好土層'],
   win:'排好了！<b>越下面的土越老</b>。南科最下面那一層，大約是 <b>5000 年前</b>的。',
   why:['為什麼越下面越老？','土一年一年<b>堆上來</b>，就像疊書：最早放的書在最下面，最後放的在最上面。'],
   q:{t:'在同一個地方往下挖，越深的地方，東西越怎樣？',o:['越老','越新','都一樣'],a:0,hint:'想想疊書，最早放的在哪裡？',
      e:'答對了！<b>越深越老</b>，考古學家就是這樣看出東西的先後。'}},

    var L=[{t:'今天的土',c:'#9A7A58'},{t:'約 1000 年前・鐵器',c:'#B58A5A'},{t:'約 3000 年前・灰黑陶',c:'#8E7E6E'},{t:'約 5000 年前・繩紋陶',c:'#C49A6A'}],ord=[2,0,3,1],sel=-1,done=false,X0=44,W=232,Y0=10,H=42;
    function art(k){
      if(k===0)return '<path d="M-12 8L-10 -6M-5 8L-4 -9M2 8L4 -7M9 8L12 -5" stroke="#4E8A3A" stroke-width="2.4" stroke-linecap="round"/>';
      if(k===1)return '<path d="M-14 2L8 -5L15 -2L-12 6Z" fill="#7A7A80" stroke="#4A4A50" stroke-width="1"/><rect x="-20" y="2" width="9" height="4" fill="#6A4A2A"/>';
      if(k===2)return '<path d="M-13 -6Q0 -11 13 -6L10 7Q0 10 -10 7Z" fill="#4A4448" stroke="#2A2428" stroke-width="1"/>';
      return '<path d="M-13 -6Q0 -11 13 -6L10 7Q0 10 -10 7Z" fill="#C0703E" stroke="#7A4A2E" stroke-width="1"/><path d="M-9 -4L-4 5M-3 -6L2 6M3 -6L8 5" stroke="#7A4A2E" stroke-width="1.2"/>'}
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#DDEFF4"><rect x="-400" y="178" width="1200" height="80" fill="#7A5A3E"/><g id="ly"></g>'+
      '<path d="M24 34V150" stroke="#6C2024" stroke-width="2"/><path d="M18 144L24 156L30 144" fill="#6C2024"/><text x="24" y="26" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle">上</text><text x="24" y="172" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle">下</text></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),ly=svg.querySelector('#ly');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){var h='';
      ord.forEach(function(v,k){var y=Y0+k*H,o=L[v];h+='<rect x="'+X0+'" y="'+y+'" width="'+W+'" height="'+H+'" fill="'+o.c+'"/>';
        for(var q=0;q<7;q++)h+='<circle cx="'+(X0+20+((q*53+v*29)%(W-30)))+'" cy="'+(y+8+((q*17+v*11)%(H-14)))+'" r="1.6" fill="#fff" opacity=".25"/>';
        h+='<g transform="translate('+(X0+28)+' '+(y+H/2)+')">'+art(v)+'</g><text x="'+(X0+W/2+18)+'" y="'+(y+H/2+5)+'" font-size="15" font-weight="700" fill="#2A2020" text-anchor="middle" stroke="#FFF8EC" stroke-width="3.5" paint-order="stroke">'+o.t+'</text>';
        if(k===sel)h+='<rect x="'+(X0+2)+'" y="'+(y+2)+'" width="'+(W-4)+'" height="'+(H-4)+'" fill="#fff" fill-opacity=".2" stroke="#DB2E27" stroke-width="3" stroke-dasharray="7 4"/>'});
      h+='<rect x="'+X0+'" y="'+Y0+'" width="'+W+'" height="'+(H*4)+'" fill="none" stroke="#5A3E2B" stroke-width="1.6"/>';
      ly.innerHTML=h;bar.style.width=(ord.filter(function(v,k){return v===k}).length/4*100)+'%'}
    draw();
    function check(){if(ord.every(function(v,k){return v===k})){done=true;sel=-1;draw();lvDone(area,i,l,msg,'排好了！')}}
    drag(svg,function(t,p){
      if(done||t!=='down')return;
      if(p.x<X0-8||p.x>X0+W+8)return;
      var k=Math.floor((p.y-Y0)/H);if(k<0||k>3)return;
      if(sel<0){sel=k;draw();say(msg,'選好了！再點<b>另一層</b>，兩層就會交換。');return}
      if(sel===k){sel=-1;draw();say(msg,'取消了，再選一層。');return}
      var tmp=ord[sel];ord[sel]=ord[k];ord[k]=tmp;sel=-1;draw();
      if(!done)say(msg,'換好了！最上面要是<b>今天的土</b>，最下面要是<b>最老的</b>。');check()
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','土層的畫面，按 Enter 直接排好');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();ord=[0,1,2,3];check()}});
    later(function(){if(!done&&sel<0)say(msg,'先<b>點一層</b>（它會出現紅色虛線），再點另一層，兩層就會交換位置。')},9000);
  },

  /* 第 2 關：看記錄單的方格座標，點出那一格，清出小狗的骨頭 */
  grid:function(area,i,l){
    var C=47,OX=50,OY=22,COL='ABCD',SEQ=['C2','B4','B1','C3','B2','B3'],k=0,done=false,open={},miss=0;
    var s='<svg class="mini" viewBox="0 0 320 216" style="background:#EFE6D2"><rect x="-400" y="212" width="1200" height="80" fill="'+SOILD+'"/><rect x="'+OX+'" y="'+OY+'" width="'+(C*4)+'" height="'+(C*4)+'" fill="#C8A47A"/>'+dogBones(144,116,1.75)+'<g id="cv"></g>';
    for(var c=0;c<4;c++)s+='<text x="'+(OX+c*C+C/2)+'" y="'+(OY-6)+'" font-size="15" font-weight="900" fill="#6C2024" text-anchor="middle">'+COL[c]+'</text>';
    for(var r=0;r<4;r++)s+='<text x="'+(OX-12)+'" y="'+(OY+r*C+C/2+5)+'" font-size="15" font-weight="900" fill="#6C2024" text-anchor="middle">'+(r+1)+'</text>';
    s+='<g transform="translate(18 116)"><circle r="14" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.5"/><path d="M0 -10L4 3L0 1L-4 3Z" fill="#DB2E27"/><text y="11" font-size="8" fill="#5A4E48" text-anchor="middle">北</text></g>';
    s+='<rect x="246" y="56" width="66" height="96" rx="6" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.5"/><text x="279" y="76" font-size="13" font-weight="700" fill="#5A4E48" text-anchor="middle">記錄單</text><text id="cd" x="279" y="116" font-size="30" font-weight="900" fill="#DB2E27" text-anchor="middle"></text><text id="cn" x="279" y="140" font-size="13" fill="#5A4E48" text-anchor="middle"></text><g id="hl"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),cv=svg.querySelector('#cv'),hl=svg.querySelector('#hl');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function cell(n){return [COL.indexOf(n[0]),+n[1]-1]}
    function draw(){var h='';
      for(var c=0;c<4;c++)for(var r=0;r<4;r++){var n=COL[c]+(r+1),x=OX+c*C,y=OY+r*C;
        if(!open[n]){h+='<rect x="'+x+'" y="'+y+'" width="'+C+'" height="'+C+'" fill="#9A7550"/>';for(var q=0;q<4;q++)h+='<circle cx="'+(x+6+((q*13+c*7+r*5)%28))+'" cy="'+(y+6+((q*11+c*5+r*9)%28))+'" r="1.5" fill="#7A5A3E"/>'}
        h+='<rect x="'+x+'" y="'+y+'" width="'+C+'" height="'+C+'" fill="none" stroke="#FFF8EC" stroke-width="1" stroke-dasharray="3 2"/>'}
      cv.innerHTML=h;
      svg.querySelector('#cd').textContent=done?'完成':SEQ[k];svg.querySelector('#cn').textContent=done?'':'第 '+(k+1)+' / 6 格';
      bar.style.width=(k/6*100)+'%'}
    draw();
    function hit(n){
      if(n===SEQ[k]){open[n]=1;k++;miss=0;hl.innerHTML='';
        if(k>=SEQ.length){done=true;'ABCD'.split('').forEach(function(a){for(var r=1;r<=4;r++)open[a+r]=1});draw();
          hl.innerHTML='<text x="214" y="184" font-size="15" font-weight="900" fill="#DB2E27" text-anchor="middle" stroke="#FFF8EC" stroke-width="4" paint-order="stroke">頭朝南</text><path d="M214 189V203M209 197L214 204L219 197" stroke="#DB2E27" stroke-width="2" fill="none"/>';
          lvDone(area,i,l,msg,'6 格都清好了！把旁邊的土也清掉，看看整隻小狗。')}
        else{draw();say(msg,'找到了！<b>'+n+'</b> 有骨頭。再看記錄單的下一格。')}
        return}
      miss++;var g=SEQ[k];
      say(msg,'你點的是 <b>'+n+'</b>。記錄單寫的是 <b>'+g+'</b>：先找上面的字母 <b>'+g[0]+'</b>，再往下找數字 <b>'+g[1]+'</b>。',1);
      if(miss>=2){var q=cell(g);hl.innerHTML='<rect x="'+(OX+q[0]*C+2)+'" y="'+(OY+q[1]*C+2)+'" width="'+(C-4)+'" height="'+(C-4)+'" fill="none" stroke="#DB2E27" stroke-width="3" stroke-dasharray="6 4"/>'}
    }
    drag(svg,function(t,p){
      if(done||t!=='down')return;
      var c=Math.floor((p.x-OX)/C),r=Math.floor((p.y-OY)/C);if(c<0||c>3||r<0||r>3)return;
      var n=COL[c]+(r+1);if(open[n]){say(msg,'<b>'+n+'</b> 已經清好了。看記錄單，現在要找 <b>'+SEQ[k]+'</b>。',1);return}
      hit(n)
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','方格的畫面，按 Enter 清出記錄單上的那一格');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();hit(SEQ[k])}});
    later(function(){if(!done&&k===0&&!miss)say(msg,'記錄單寫 <b>C2</b>：在上面找到字母 <b>C</b> 那一行，再往下數到 <b>2</b>，點那一格。')},8000);
  },

  /* 第 3 關：用鑷子點兩下，夾起碳化稻米和小米 */
  tweezer:function(area,i,l){
    var T=[{k:'r',x:90,y:80,r:20},{k:'r',x:150,y:58,r:-30},{k:'r',x:218,y:92,r:60},{k:'r',x:118,y:134,r:10},{k:'m',x:186,y:140},{k:'m',x:250,y:70},{k:'s',x:62,y:110},{k:'s',x:132,y:96},{k:'s',x:180,y:104},{k:'s',x:242,y:128}],
      N=6,n=0,done=false,lastK=-1,lastT=0,tm=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E8EEF0"><rect x="-400" y="180" width="1200" height="80" fill="#C8BCA8"/><ellipse cx="160" cy="100" rx="134" ry="78" fill="#F4F0E8" stroke="#A89A88" stroke-width="2"/><ellipse cx="160" cy="100" rx="122" ry="68" fill="#D8BC90"/>';
    var r0=rnd(7);for(var q=0;q<70;q++){var a=r0()*6.283,d=Math.sqrt(r0());s+='<circle cx="'+f1(160+Math.cos(a)*d*114)+'" cy="'+f1(100+Math.sin(a)*d*62)+'" r="'+f1(.8+r0()*1.2)+'" fill="#B89868"/>'}
    s+='<g id="it"></g><g id="tw"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),it=svg.querySelector('#it'),tw=svg.querySelector('#tw');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){it.innerHTML=T.filter(function(o){return !o.got}).map(function(o){return o.k==='r'?riceG(o.x,o.y,o.r,1.35):o.k==='m'?milletG(o.x,o.y,1.3):stoneG(o.x,o.y,1.3)}).join('');bar.style.width=(n/N*100)+'%'}
    function tweez(o,shut){if(!o){tw.innerHTML='';return}var g=shut?2:7;
      tw.innerHTML='<g transform="translate('+o.x+' '+o.y+')"><path d="M2 -3L34 -50M'+g+' 0L44 -44" stroke="#8A96A0" stroke-width="3" stroke-linecap="round"/><path d="M2 -3L34 -50M'+g+' 0L44 -44" stroke="#D8E0E6" stroke-width="1.2" stroke-linecap="round"/></g>'}
    draw();
    loops.push(function(){clearTimeout(tm)});
    function pick(o){o.got=true;n++;tweez(null);draw();
      if(n>=N){done=true;lvDone(area,i,l,msg,'夾滿 6 粒了！')}else say(msg,'夾到'+(o.k==='r'?'<b>碳化稻米</b>':'<b>小米</b>')+'了！還要 '+(N-n)+' 粒。')}
    drag(svg,function(t,p){
      if(done||t!=='down')return;
      var now=performance.now(),best=-1,bd=22;T.forEach(function(o,j){if(o.got)return;var d=Math.hypot(p.x-o.x,p.y-o.y);if(d<bd){bd=d;best=j}});
      if(best<0){lastK=-1;tweez(null);say(msg,'要點在<b>米粒</b>上喔。',1);return}
      var o=T[best];
      if(best===lastK&&now-lastT<550){lastK=-1;clearTimeout(tm);
        if(o.k==='s'){tweez(null);say(msg,'那是<b>小石頭</b>，不是米。碳化的米是<b>黑黑的</b>喔。',1);return}
        tweez(o,1);later(function(){pick(o)},120);return}
      lastK=best;lastT=now;tweez(o);clearTimeout(tm);
      tm=setTimeout(function(){if(lastK===best&&!done)say(msg,'鑷子對準了！要<b>很快</b>連點兩下，才夾得起來。',1)},700)
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','盤子的畫面，按 Enter 夾一粒米');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var o=T.filter(function(q){return !q.got&&q.k!=='s'})[0];if(o)pick(o)}});
    later(function(){if(!n&&!done)say(msg,'找一粒<b>黑黑長長</b>的米，手指在它上面<b>很快點兩下</b>（像按兩下滑鼠一樣）。')},8000);
  },

  /* 第 4 關：點一下陶罐，木拍拍出繩紋，拍滿整個陶罐 */
  stamp:function(area,i,l){
    var TOP=28,S=1.22,CX=160,pts=[],done=false,tm=0,d=potPath(CX,TOP,S),r0=rnd(5);
    function inPot(x,y){var dy=(y-TOP)/S;return dy>=0&&dy<=118&&Math.abs(x-CX)<=potW(dy)*S}
    for(var y=TOP+5;y<TOP+118*S-5;y+=8)for(var x=CX-80;x<=CX+80;x+=8){var dy=(y-TOP)/S;if(Math.abs(x-CX)<potW(dy)*S-5)pts.push({x:x,y:y,c:false})}
    var coil='';for(var cy=TOP+8;cy<TOP+118*S;cy+=9)coil+='<path d="M60 '+cy+'H260" stroke="#B87A4A" stroke-width="1.4"/>';
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EDE4CC"><rect x="-400" y="176" width="1200" height="80" fill="#B8A07A"/>'+cordDef('cordS')+'<defs><clipPath id="potClip"><path d="'+d+'"/></clipPath></defs><path d="'+d+'" fill="'+CLAY+'"/><g clip-path="url(#potClip)">'+coil+'<g id="stp"></g></g><path d="'+d+'" fill="none" stroke="#7A4A2E" stroke-width="2"/><ellipse cx="'+CX+'" cy="'+TOP+'" rx="'+f1(30*S)+'" ry="'+f1(5*S)+'" fill="#7A4A2E"/><g id="dots"></g><g id="pd"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),stp=svg.querySelector('#stp'),dots=svg.querySelector('#dots'),pd=svg.querySelector('#pd');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    loops.push(function(){clearTimeout(tm)});
    function cov(){return pts.filter(function(q){return q.c}).length/pts.length}
    function hitAt(x,y){var a=Math.round((r0()-.5)*30);
      stp.insertAdjacentHTML('beforeend','<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+a+')"><rect x="-21" y="-21" width="42" height="42" fill="#B47444"/><rect x="-21" y="-21" width="42" height="42" fill="url(#cordS)"/></g>');
      pts.forEach(function(q){if(Math.abs(q.x-x)<=19&&Math.abs(q.y-y)<=19)q.c=true});
      var c=cov();bar.style.width=f1(Math.min(1,c/.92)*100)+'%';
      pd.innerHTML='<g transform="translate('+f1(x)+' '+f1(y)+') rotate(-20)"><rect x="-4" y="-40" width="8" height="24" rx="2" fill="#8A5A3A"/><rect x="-16" y="-16" width="32" height="18" rx="3" fill="#A87A4A" stroke="#6A4A2A" stroke-width="1.2"/><path d="M-16 -12L16 -8M-16 -6L16 -2" stroke="#E8D8B0" stroke-width="1.6"/></g>';
      clearTimeout(tm);tm=setTimeout(function(){pd.innerHTML=''},220);
      if(c>=.92){done=true;dots.innerHTML='';pts.forEach(function(q){q.c=true});stp.insertAdjacentHTML('beforeend','<rect x="0" y="0" width="320" height="190" fill="#B47444"/><rect x="0" y="0" width="320" height="190" fill="url(#cordS)"/>');bar.style.width='100%';lvDone(area,i,l,msg,'拍滿了！');return}
      if(c>.7){dots.innerHTML=pts.filter(function(q){return !q.c}).map(function(q){return '<circle cx="'+q.x+'" cy="'+q.y+'" r="2.2" fill="#FFF8EC"/>'}).join('');say(msg,'快好了！還有<b>白點點</b>的地方沒拍到。')}
      else say(msg,'啪！再拍光光的地方。')}
    drag(svg,function(t,p){
      if(done||t!=='down')return;
      if(!inPot(p.x,p.y)){say(msg,'要點在<b>陶罐</b>上喔。',1);return}
      hitAt(p.x,p.y)
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','陶罐的畫面，按 Enter 拍滿繩紋');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();pts.forEach(function(q){q.c=true});hitAt(CX,TOP+60)}});
    later(function(){if(!done&&cov()===0)say(msg,'手指<b>點一下</b>陶罐，木拍就會拍一下。一直點不同的地方，把陶罐拍滿。')},7000);
  },

  /* 第 5 關：看左邊半個陶罐，在右邊畫出對稱的另一半 */
  mirror:function(area,i,l){
    var TOP=30,S=1.18,CX=160,HH=118*S,line=[],on=false,done=false,fails=0,TG=[];
    for(var dy=0;dy<=118;dy+=1)TG.push([CX+potW(dy)*S,TOP+dy*S]);
    var left=potSide(CX,TOP,S,-1),right=potSide(CX,TOP,S,1);
    var dl='M'+CX+' '+TOP+smooth(left).replace('M','L')+'Z',dr='M'+CX+' '+TOP+smooth(right).replace('M','L')+'Z';
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F2EEE6"><rect x="-400" y="180" width="1200" height="80" fill="#C8BCA8"/>'+cordDef('cordR')+
      '<path d="'+dl+'" fill="'+CLAY+'" stroke="#7A4A2E" stroke-width="2"/><path d="'+dl+'" fill="url(#cordR)"/><path d="M140 46L122 80L132 110M98 112L122 128L138 158M112 64L96 86" stroke="#6E3E22" stroke-width="1.4" fill="none"/>'+
      '<path d="M160 20V182" stroke="#8A7A70" stroke-width="1.4" stroke-dasharray="5 4"/><g id="gd"></g><g id="rt"></g>'+
      '<circle cx="'+f1(CX+30*S)+'" cy="'+TOP+'" r="5" fill="#DB2E27"/><text x="'+f1(CX+30*S+12)+'" y="'+(TOP-6)+'" font-size="13" font-weight="700" fill="#DB2E27">從這裡開始</text><path id="ln" d="" stroke="#6C2024" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),ln=svg.querySelector('#ln'),gd=svg.querySelector('#gd'),rt=svg.querySelector('#rt');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function show(){ln.setAttribute('d',line.length?'M'+line.map(function(q){return f1(q.x)+' '+f1(q.y)}).join('L'):'')}
    function dist(q){var m=1e9;TG.forEach(function(g){var d=Math.hypot(q.x-g[0],q.y-g[1]);if(d<m)m=d});return m}
    function win(){done=true;on=false;gd.innerHTML='';rt.innerHTML='<path d="'+dr+'" fill="'+CLAY+'" stroke="#7A4A2E" stroke-width="2"/><path d="'+dr+'" fill="url(#cordR)"/>';bar.style.width='100%';lvDone(area,i,l,msg,'左右一樣了！')}
    function check(){
      var err=0;line.forEach(function(q){err+=dist(q)});err/=Math.max(1,line.length);
      var hitN=0,tot=0;TG.forEach(function(g,k){if(k%4)return;tot++;if(line.some(function(q){return Math.hypot(q.x-g[0],q.y-g[1])<15}))hitN++});
      var cv=hitN/tot;bar.style.width=f1(Math.min(1,cv)*100)+'%';
      if(cv>=.8&&err<10){win();return}
      fails++;line=[];show();
      if(cv<.8&&err<10)say(msg,'形狀很像！可是要從<b>罐口</b>（紅點）一路畫到<b>罐底</b>（中間的虛線）才放開。',1);
      else say(msg,'和左邊不太一樣。看看左邊：罐口<b>小小的</b>，肚子<b>圓圓鼓起來</b>，底是<b>圓的</b>。右邊要畫成一樣的。',1);
      if(fails>=2){gd.innerHTML='<path d="'+smooth(right)+'" stroke="#DB2E27" stroke-width="2" stroke-dasharray="3 5" fill="none" opacity=".7"/>';say(msg,'跟著<b>紅色的點點線</b>畫，從紅點畫到罐底。',1)}
    }
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){if(p.x<CX-6){say(msg,'要畫在<b>右邊</b>喔，左邊已經拼好了。',1);on=false;return}on=true;line=[{x:p.x,y:p.y}];show();return}
      if(!on)return;
      if(t==='move'){var a=line[line.length-1];if(Math.hypot(p.x-a.x,p.y-a.y)>2){line.push({x:p.x,y:p.y});show()}return}
      if(t==='up'){on=false;if(line.length<5){line=[];show();say(msg,'手指<b>按著不要放開</b>，一路畫下去。',1);return}check()}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','陶罐的畫面，按 Enter 畫好另一半');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();win()}});
    later(function(){if(!done&&!fails&&!line.length)say(msg,'手指按在右上的<b>紅點</b>，不要放開，照著左邊的樣子（左右顛倒）一路畫到罐底。')},8000);
  },

  /* 第 6 關：慢慢把文物拖進展示櫃（太快會晃） */
  slow:function(area,i,l){
    var SL=[{x:222,y:72},{x:274,y:72},{x:248,y:128}],IT=[{k:'pot',x:48,y:116},{k:'dog',x:86,y:116},{k:'rice',x:124,y:116}],held=null,off={x:0,y:0},lastP=null,lastT=0,v=0,fast=0,n=0,done=false;
    IT.forEach(function(o){o.hx=o.x;o.hy=o.y});
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F0ECE4"><rect x="-400" y="172" width="1200" height="80" fill="#A8A4A0"/>'+cordDef('cordL')+
      '<rect x="196" y="38" width="106" height="120" rx="4" fill="#DDEFF4" fill-opacity=".8" stroke="#7A8A90" stroke-width="2"/><path d="M196 100H302" stroke="#7A8A90" stroke-width="2"/><rect x="190" y="158" width="118" height="10" fill="#5A4E48"/><text x="249" y="30" font-size="14" font-weight="700" fill="#5A4E48" text-anchor="middle">展示櫃</text>'+
      '<path d="M24 134H148V146H24Z" fill="#8A6A3A" stroke="#5A3E2B" stroke-width="1.2"/><path d="M148 134L160 110" stroke="#5A3E2B" stroke-width="3" stroke-linecap="round"/><circle cx="42" cy="156" r="9" fill="#5A3E2B"/><circle cx="130" cy="156" r="9" fill="#5A3E2B"/><text x="86" y="170" font-size="13" fill="#5A4E48" text-anchor="middle" stroke="#F0ECE4" stroke-width="3" paint-order="stroke">推車</text><g id="sl"></g><g id="it"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),slg=svg.querySelector('#sl'),itg=svg.querySelector('#it');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function art(o){var x=o.x,y=o.y;
      if(o.k==='pot')return pot(x,y-17,.28,'cordL');
      if(o.k==='dog')return '<rect x="'+(x-16)+'" y="'+(y-20)+'" width="32" height="40" rx="3" fill="#C8A47A" stroke="#8A6A48"/>'+dogBones(x,y-1,.36);
      return '<ellipse cx="'+x+'" cy="'+(y+6)+'" rx="17" ry="8" fill="#F4F0E8" stroke="#A89A88" stroke-width="1.2"/>'+riceG(x-6,y+4,-20,.7)+riceG(x+6,y+3,25,.7)+milletG(x,y+9,.7)}
    function draw(){
      slg.innerHTML=SL.map(function(q){return q.o?'':'<rect x="'+(q.x-21)+'" y="'+(q.y-21)+'" width="42" height="42" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="5 4"/>'}).join('');
      itg.innerHTML=IT.map(function(o){var w='';
        if(o===held){var c=v>.3?'#F5A623':'#7BC47F',a=v>.3?Math.sin(performance.now()/40)*10:0;w='<circle cx="'+f1(o.x)+'" cy="'+f1(o.y)+'" r="26" fill="'+c+'" opacity=".35"/>';return w+'<g transform="rotate('+f1(a)+' '+f1(o.x)+' '+f1(o.y+18)+')">'+art(o)+'</g>'}
        return art(o)}).join('');
      bar.style.width=(n/3*100)+'%'}
    draw();
    function drop(o,t,again){o.x=o.hx;o.y=o.hy;held=null;v=0;fast=0;draw();say(msg,t,again)}
    function place(o,q){q.o=o;o.on=true;o.x=q.x;o.y=q.y;held=null;n++;draw();
      if(n>=3){done=true;lvDone(area,i,l,msg,'3 件都放好了！')}else say(msg,'放好了！還有 '+(3-n)+' 件。')}
    drag(svg,function(t,p){
      if(done)return;
      var now=performance.now();
      if(t==='down'){held=null;var bd=26;IT.forEach(function(o){if(o.on)return;var d=Math.hypot(p.x-o.x,p.y-o.y);if(d<bd){bd=d;held=o}});
        if(held){off={x:p.x-held.x,y:p.y-held.y};lastP=p;lastT=now;v=0;fast=0;draw()}else say(msg,'要按住<b>推車上</b>的文物。',1);return}
      if(!held)return;
      if(t==='move'){var dt=Math.max(16,now-lastT),inst=Math.hypot(p.x-lastP.x,p.y-lastP.y)/dt;lastP=p;lastT=now;v=.5*v+.5*inst;
        if(v>.42)fast++;else fast=Math.max(0,fast-1);
        if(fast>=4){drop(held,'太快了！文物晃了一下，差點摔破。回到推車，<b>慢慢</b>拖。',1);return}
        held.x=p.x-off.x;held.y=p.y-off.y;draw();return}
      if(t==='up'){var o=held,q=null;SL.forEach(function(s2){if(!s2.o&&Math.hypot(o.x-s2.x,o.y-s2.y)<30)q=s2});
        if(q)place(o,q);else drop(o,'要放進<b>展示櫃</b>裡的紅色虛線格喔。',1)}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','展示櫃的畫面，按 Enter 放好一件文物');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var o=IT.filter(function(q){return !q.on})[0],q=SL.filter(function(q){return !q.o})[0];if(o&&q)place(o,q)}});
    later(function(){if(!n&&!done)say(msg,'按住推車上的一件文物，<b>慢慢</b>往右上拖，放進展示櫃的紅色虛線格。光圈變<b>黃色</b>就是太快了。')},8000);
  },


  end:function(area,i,l){
    // 回顧：每一段把鏡頭飛到那一關的地點，下面講那一關做了什麼
    var steps=[];LV.forEach(function(v,k){if(v.stamp&&k>0)steps.push(k)});
    var n=-1,firstTime=nStamps()===steps.length;
    area.innerHTML='<div class="recap" aria-live="polite"></div><button class="big" type="button">開始<br>回顧</button><p class="rn"></p><p><button class="again-btn" type="button">重新開始遊戲</button></p><p class="note" style="margin-top:20px">給大人：南科考古館在臺南市新市區南科三路 10 號，週一休館，開放時間和票價以國立臺灣史前文化博物館公告為準。<br>資料來源：關鍵評論網（1995 年選址、道爺遺址試掘、停工搶救考古）；科技新報 2016（南科考古計畫 1996 年啟動、58 處遺址、34 處大規模發掘、距今約 300 到 5000 年）；新頭殼、蕃薯藤、微笑台灣 2019（南科考古館開館、800 多萬件文物、姚仁喜設計）；中央社 2022、文化部（南關里遺址的臺灣第一狗、頭朝南）；文化部、清華大學論文（南關里東遺址碳化稻米、小米）；公視 2025（大湖文化灰黑陶）；繩紋陶的做法、陶片拼合參考一般考古資料。地圖是示意圖，不是真實比例。</p>';
    var box=area.querySelector('.recap'),btn=area.querySelector('.big'),cnt=area.querySelector('.rn');
    function stopOf(k){var s=null;STOPS.forEach(function(t){if(t.lv===k)s=t});if(!s&&LV[k].pin!==undefined)s=STOPS[LV[k].pin];return s}
    function show(){
      box.classList.remove('enter');void box.offsetWidth;box.classList.add('enter');
      if(n<0){cam(camFor(i,l));setEra('now');pinEl.style.display='none';box.innerHTML='';btn.innerHTML='開始<br>回顧';cnt.textContent='';return}
      var k=steps[n],v=LV[k],s=stopOf(k);
      cam(camFor(k,v));setEra(v.era||'now');
      if(s){pinEl.style.display='';pinEl.setAttribute('transform','translate('+s.x+' '+(s.y-18)+')')}else pinEl.style.display='none';
      var txt=v.win||(v.q&&v.q.e)||(v.why&&v.why[1])||'';
      box.innerHTML='<div class="rc"><span class="seal'+(st.done[k]?'':' empty')+'">'+(st.done[k]?icon(v.stamp[0]):'')+'</span><div><p class="rk">'+v.kick+'</p><p class="rh">'+v.h+'</p><p>'+txt+'</p></div></div>';
      btn.innerHTML=n<steps.length-1?'下一段':'從頭<br>再看';
      cnt.textContent='第 '+(n+1)+' / '+steps.length+' 段';
    }
    btn.addEventListener('click',function(){n=n<steps.length-1?n+1:-1;show();into(btn)});
    area.querySelector('.again-btn').addEventListener('click',function(){st={far:0,done:{0:1},name:''};save();chips();setEra('now');go(0)});
    show();
    if(!reduce&&firstTime)confetti();
  }

};

function confetti(){var cs=['#E2574C','#F5A623','#7BC47F','#6EC3DD','#F7A8C4'];for(var k=0;k<36;k++){var c=document.createElement('i');c.className='conf';c.style.left=(Math.random()*100)+'vw';c.style.background=cs[k%5];c.style.animationDelay=(Math.random()*.8)+'s';document.body.appendChild(c);setTimeout(function(x){return function(){x.remove()}}(c),3600)}}

/* ---------- 換關 ---------- */
var pv=document.getElementById('pv'),nx=document.getElementById('nx');
function paint(){
  nx.disabled=cur===LV.length-1||!st.done[cur];nx.textContent=st.done[cur]||cur===LV.length-1?'下一關 ›':'先完成任務';
  pv.disabled=cur===0;nx.style.visibility=cur===LV.length-1?'hidden':'';document.getElementById('pos').textContent=cur===0?'開始':(cur===LV.length-1?'完成':'第 '+cur+' / 6 關');
  map.querySelectorAll('.stop').forEach(function(g){g.classList.toggle('lock',+g.dataset.lv>st.far)});
}
// 鏡頭：每一關都把那一關的地點放在圓的正中間；全景（正方形鏡頭）照原樣
function camFor(i,l){var c=l.cam;if(c[2]===c[3])return c;var s=null;STOPS.forEach(function(t){if(t.lv===i)s=t});if(!s&&l.pin!==undefined)s=STOPS[l.pin];
  var z=c[3]*1.05,cx=s?s.x:c[0]+c[2]/2,cy=s?s.y-6:c[1]+c[3]/2;return [cx-z/2,cy-z/2,z,z]}
function go(i){
  cur=i;if(i>st.far){st.far=i;save()}replay=-1;var l=LV[i];clearScene();
  cam(camFor(i,l));setEra(l.era||'now');
  if(l.pin!==undefined){var s=STOPS[l.pin];pinEl.style.display='';pinEl.setAttribute('transform','translate('+s.x+' '+(s.y-18)+')')}else pinEl.style.display='none';
  render(i);paint();
}
pv.addEventListener('click',function(){if(cur>0)go(cur-1)});
nx.addEventListener('click',function(){if(st.done[cur]&&cur<LV.length-1)go(cur+1)});
var sheet=document.getElementById('sheet');
document.getElementById('chips').addEventListener('click',function(){if(st.far>=LV.length-1)go(LV.length-1)});
function closeSheet(){sheet.hidden=true;document.getElementById('chips').focus()}
document.getElementById('sheetX').addEventListener('click',closeSheet);
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)closeSheet()});
chips();go(Math.min(st.far,LV.length-1));
</script>
