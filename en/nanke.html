<script type="application/ld+json">{"@context":"https://schema.org","@type":["Game","LearningResource"],"name":"Town Gate Mission Play Dig a new canal, carry night soil (poop used to feed the crops), follow a red light to Mazu Tower (a temple of Mazu, goddess of the sea), and pass through Duiyue Gate, an old city gate you can still walk through. Five Canals · Fotou (in Chinese) Fir Log Mission Play A small boat brings fir logs from Fuzhou in China into Fotou Canal. Row like a dragon boat team, share the work fairly, and help the timber shop get the logs to the right places. Five Canals · Nanshi (in Chinese) Little Cargo Mission Play A big sailing ship is here! Move the cloth and medicine onto small boats and row all the way to Shuixian Temple (the temple of the water gods). Five Canals · Nanhe (in Chinese) Welcome Mission Play A new official is arriving by boat! Blow the boat to shore, lead him through the stone welcome gate, learn about Tainan’s coming-of-age party at 16, and fetch water at the Great Well. Five Canals · Anhai (in Chinese) Sugar Boat Mission Play Load bags of sugar onto the boat, connect three little canals, toss the moon blocks (two wooden blocks people use to ask the gods a question), dodge the sandbars, and deliver it all to Anping. Theme · History Step into history, back to long ago Tainan is the oldest city in Taiwan, and it has historic sites everywhere. About 400 years ago, the Dutch built Fort Zeelandia on a sandbar in Anping. Today it is called Anping Old Fort. That was around the time the Pilgrims sailed to America on the Mayflower. You can visit historic sites any time of year. History · Anping Old Fort (in Chinese) Old Fort Mission Play Join a volunteer at the old fort and go back 400 years. Mark out Fort Zeelandia on the sandbar, catch the ingredients to mix mortar, push crates in the storehouse, watch soldiers carry bricks away to build the Eternal Golden Castle, let a banyan’s roots grow into the south wall, and help the sword lions (lion faces holding swords in their mouths, to keep bad luck away) find their doors. Theme · Temples A birthday party for a child god The 9th day of the 9th month on the lunar calendar is the Double Ninth Festival. It is also the birthday of Prince Nezha, a god who looks like a boy. Xinying Taizi Temple is a very old and famous Nezha temple. Many Nezha temples around Taiwan began here, so on his birthday they all come back to visit, like going home to Mom’s house. At a temple, please speak softly and don’t disturb people who are praying. Temples · Xinying Taizi Temple (in Chinese) Nezha’s Birthday Mission Play Join Grandma, who lives next to Taizi Temple, to wish Prince Nezha a happy birthday. Photograph the four magic weapons held by the statue on the roof, circle and pull the weeds in the carp pond, walk softly in the main hall, flip cards to learn about the old temple, count the bats on the big incense burner, and follow the god’s sedan chair back home. Theme · Festivals Follow the lunar calendar to Tainan’s festivals Tainan has busy festivals all year long. On the night of the Lantern Festival, Yanshui holds the beehive fireworks: huge racks of bottle rockets that all shoot off at once. The story goes that it began as a way to chase away a deadly sickness: people set off fireworks along the path of the sedan chair of the god Guan Gong and prayed to be safe. Beehive fireworks are very dangerous, so children must not go near them. In this game you will learn how to stay safe. Festivals · Yanshui beehive fireworks (in Chinese) Fireworks Safety Mission Play Join Great-uncle, who lives in Yanshui. Hear the old story at Yanshui Wu Temple (Guan Gong’s temple), help Great-uncle put on his safety gear, measure a safe distance with a tape measure, draw a beehive design on paper, find the rocket racks with a safety check mark, and sweep up afterward. Beehive fireworks are very dangerous. Children must not go near them. Theme · Fruit Tainan’s fruit, starting on the farm Tainan has fruit all year round. These games start on the farm. Why does it grow here? How does it grow? What do farmers do all year? How do we eat it? In fall there are four: water caltrops from Guantian (water from Wushantou Reservoir; rice fields in spring, caltrop ponds in fall), avocados from Danei (grown by the Zengwen River; they never get soft on the tree), big pomelos from Madou (Madou used to be a harbor town; picked around Shuangjiang, “frost’s descent,” in late October) and coffee from Dongshan (grown on Mt. Kantou; the coffee cherries turn red in fall, and there is a coffee festival in October). In winter there are two: strawberries from Shanhua (Taiwan’s southernmost strawberry farms, late November to April) and plums from Meiling, Nanxi (plum blossoms in winter, plums in spring). Fruit · Guantian water caltrop (in Chinese) Water Caltrop Mission Play Join Grandma, who grows water caltrops in Guantian, from June to October. Zoom in to see water from Wushantou Reservoir flow into the fields, lift the leaves to find water caltrops (a horned nut that grows under water), help a jacana dad keep his chicks out of the rain, then press the horns and sort the nuts in water into hard and tender ones. Fruit · Danei avocado (in Chinese) Avocado Mission Play Join an uncle who grows avocados in Danei, from January to October. Graft on a tasty kind, draw paths for the bees to carry pollen, pick off extra baby fruit, dig to see the shallow roots, snip ripe avocados off the stem, and find the place where avocados get soft. Fruit · Madou big pomelo (in Chinese) Big Pomelo Mission Play Join an aunt who grows pomelos in Madou, from winter to fall. Prune branches with shears, follow the smell to find pomelo flowers, cover the fruit with paper bags, keep the soil from getting too wet or too dry, pick the fruit at Shuangjiang by holding it and cutting twice, and peel the thick skin. Fruit · Dongshan coffee (in Chinese) Coffee Mission Play Join a young farmer who grows coffee in Dongshan. Piece together the first coffee tree on Mt. Kantou, push the leaves aside to pick only red coffee cherries, twist one open to find two seeds, dry the cherries in the sun, shake a net to roast the beans, and drive up Route 175 to the coffee festival. Fruit · Shanhua strawberry (in Chinese) Strawberry Mission Play Join an aunt who grows strawberries in Shanhua. In summer, root the baby plants from the runners in pots. In September, plant them on high beds and lay down straw. Pull off the petals to watch a strawberry grow, snap ripe ones upward to pick them, pack them in boxes, and find “Dahu in the north, Shanhua in the south” on a map of Taiwan. Fruit · Meiling plum (in Chinese) Plum Mission Play Join an uncle who grows plums in Meiling. Change the “Banana Mountain” sign to Meiling (Plum Ridge), bring in cold air to open the blossoms all over the hill, hold an umbrella over the flowers, gently pick green plums without breaking branches, make crunchy pickled plums and jam, and cook a pot of plum chicken soup. Fruit · Dongshan ponkan (in Chinese) Ponkan Mission Play Join an uncle who grows ponkan mandarins in Dongshan. Prop up branches with bamboo poles before a typhoon, move the sun to see that green ponkans are ripe even while their skin is green, sort them by size on a tilting board, turn them over to find bad ones, weigh one catty (600 grams) at a fruit stand, and share the segments with everyone. Theme · Rice One grain of rice, from field to bowl Tainan is warm, so farmers can grow rice twice a year. The rice cut in fall is the second crop. In October the heads of rice turn gold and bow down, and in mid-November it is harvest time. These games start in Jingliao, Houbi: look at the rice, cut it, dry it and polish it, and see how many steps it takes to make one grain of rice. Rice · Jingliao, Houbi (in Chinese) Rice Harvest Mission Play Join Grandpa, a rice farmer in Jingliao, from the old street to the fields. Dip white cloth into an indigo dye pot to learn where the name Jingliao comes from, lift the rice to find the fullest heads, drive a harvester across the whole field, beat the grain loose in a threshing tub, spread it flat in the drying yard, and rub it until it turns into white rice. Theme · Fish farms Along Tainan’s coast, square fish ponds Tainan’s coast is covered with fish ponds. About half of all the milkfish in Taiwan are raised in Tainan. Milkfish hate the cold, so every August to December farmers rush to catch them before a cold snap comes. These games start in Xuejia: follow a milkfish from a tiny baby fish to a bowl of breakfast porridge. Fish farms · Xuejia milkfish (in Chinese) Milkfish Mission Play Join an uncle who raises milkfish in Xuejia. Scoop up baby fish from below, draw circles so the fish can eat the algae, pull the net from both sides to bring in the fish, herd small fish into a winter ditch when a cold snap comes, scrape off scales at the fish stall, and pick the bones out of your milkfish at breakfast. Theme · Birds Winter and summer, birds fly to Tainan Every fall, many birds fly down from the north to spend the winter in Tainan. Black-faced spoonbills go to the Zengwen River mouth in Qigu, and whiskered terns go to the Beimen Lagoon. More than half of all the black-faced spoonbills in the world spend the winter in Taiwan. In summer, little terns fly up from Australia to lay their eggs in the salt fields of Dingshan, Qigu. Birds · Black-faced spoonbill (in Chinese) Spoonbill Winter Mission Play Be a young guide at the bird-watching hut and keep the spoonbills company from fall to spring. Wait quietly for them to land, find a leg band with a telescope, turn the water gate to let water out, and wave goodbye as they fly back north. Birds · Whiskered tern (in Chinese) Bird Tornado Mission Play Go out with Grandpa on the Beimen Lagoon to keep a record of the “black-belly birds.” Spot the whiskered terns, watch them dip down for fish, spin a bird tornado with your finger, and steer the boat quietly home. Birds · Little tern (in Chinese) Sandy Nest Mission Play Be a young ranger at the Qigu salt fields in summer. Launch little terns with a slingshot so they island-hop from Australia, give the eggs camouflage, stack hollow bricks as rain shelters, and spin the 360° camera on the floating ark. Theme · Hot springs A hot spring in the hills with an underground secret In the hills northeast of Tainan is Guanziling Hot Spring. Its water is a gray mud hot spring. When Japan ruled Taiwan, it was one of Taiwan’s four great hot springs. Nearby is the Water and Fire Cave, where fire burns right out of the water. In fall, when the weather cools down, there is a hot spring food festival. Hot springs · Guanziling (in Chinese) Mud Hot Spring Mission Play Join a cousin who grew up on Guanziling’s hot spring street. Take the water’s temperature at Baoquan Bridge, push hot water up through mudstone, see the fire at the Water and Fire Cave that rain can’t put out, climb the Brave Man’s Slope one foot at a time, mix a bath that is just right, and snap a night photo at the hot spring food festival. Theme · Old trees Hug an old tree and hear its 100-year story Tainan has 342 old trees that are listed and protected. Old trees can get sick, and typhoons can hurt them, so everyone helps look after them. Tainan Park in the North District opened in 1917 and has lots of 100-year-old trees. You can visit any time of year. Old trees · Tainan Park (in Chinese) Old Tree Mission Play Meet Tainan Park’s old trees with a tree doctor. Water the young trees in one line without lifting your finger, hold hands around a 100-year-old bodhi tree, guide birds back to their nests in the rain tree, find out who is singing in the orchid trees, tap trunks to find hollow spots, and tie ropes to hold up young trees after a typhoon. Theme · Archaeology Dig down to 5,000 years ago When the Southern Taiwan Science Park was built, lots of things left by people 5,000 years ago came out of the ground: pots, rice, and Taiwan’s oldest dog. These treasures are now at the Nanke Archaeology Museum in Xinshi. You can visit any time of year. Archaeology · Nanke Archaeology Museum Dig Mission","url":"https://tainanyo.tw/en/nanke.html","description":"Dig down with a young archaeologist. Put the layers in order from oldest to newest, find Taiwan’s first dog on a grid, pick up 5,000-year-old charred rice with tweezers, pat a cord-marked pot, draw a whole pot from half, and slowly put the treasures in the display case.","inLanguage":"en","image":"https://tainanyo.tw/img/nanke.png","isAccessibleForFree":true,"learningResourceType":"interactive game","educationalLevel":"elementary school","audience":{"@type":"EducationalAudience","educationalRole":"student"},"translationOfWork":{"@id":"https://tainanyo.tw/nanke.html#game"},"publisher":{"@type":"Organization","@id":"https://tainanyo.tw/#org","name":"三角影像有限公司","url":"https://www.trimedia.tw/","email":"tri90035156@gmail.com","logo":{"@type":"ImageObject","url":"https://tainanyo.tw/logo.png","width":512,"height":512}},"contentLocation":{"@type":"Place","name":"南科考古館（臺南市新市區）","address":{"@type":"PostalAddress","addressRegion":"臺南市","addressCountry":"TW","addressLocality":"新市區"},"geo":{"@type":"GeoCoordinates","latitude":23.1059,"longitude":120.2727}}}</script>

<script>

/* ---------- 插畫元件 ---------- */
var K='#2A2020',NS='http://www.w3.org/2000/svg';
var SOIL='#B08A60',SOILD='#8A6A48',CLAY='#C88A5A',BONE='#F4EAD2';
function f1(v){return (Math.round(v*10)/10).toString()}
function rnd(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280}}
// 把幾個點連成圓滑的線
function smooth(pts){var d='M'+f1(pts[0][0])+' '+f1(pts[0][1]);
  for(var k=1;k<pts.length-1;k++)d+='Q'+f1(pts[k][0])+' '+f1(pts[k][1])+' '+f1((pts[k][0]+pts[k+1][0])/2)+' '+f1((pts[k][1]+pts[k+1][1])/2);
  var l=pts[pts.length-1];return d+'L'+f1(l[0])+' '+f1(l[1])}
// 圓底陶罐的半邊形狀：[離罐口多遠, 半邊多寬]
var PROF=[[0,30],[10,25],[22,40],[42,58],[66,64],[90,54],[108,32],[118,0]];
function potW(dy){if(dy<=0)return PROF[0][1];for(var k=1;k<PROF.length;k++)if(dy<=PROF[k][0]){var a=PROF[k-1],b=PROF[k];return a[1]+(b[1]-a[1])*(dy-a[0])/(b[0]-a[0])}return 0}
function potSide(cx,top,s,dir){return PROF.map(function(p){return [cx+dir*p[1]*s,top+p[0]*s]})}
function potPath(cx,top,s){var r=potSide(cx,top,s,1),l=potSide(cx,top,s,-1).reverse();return smooth(r)+smooth(l).replace('M','L')+'Z'}
// 繩紋：斜斜的細線花紋（id 要不一樣，地圖和遊戲圖才不會打架）
function cordDef(id,c){return '<defs><pattern id="'+id+'" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><rect width="5" height="5" fill="none"/><path d="M0 2.5H5" stroke="'+(c||'#6E3E22')+'" stroke-width="1.5" opacity=".6"/></pattern></defs>'}
function pot(cx,top,s,cord){var d=potPath(cx,top,s);return '<path d="'+d+'" fill="'+CLAY+'" stroke="#7A4A2E" stroke-width="'+f1(1.6/Math.max(.5,s))+'"/>'+(cord?'<path d="'+d+'" fill="url(#'+cord+')"/>':'')+'<ellipse cx="'+f1(cx)+'" cy="'+f1(top)+'" rx="'+f1(30*s)+'" ry="'+f1(5*s)+'" fill="#7A4A2E"/>'}
// 小狗的骨頭（頭朝下＝朝南）
function dogBones(x,y,s){var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s)+')" stroke="#A8906A" stroke-linecap="round" stroke-linejoin="round">';
  h+='<path d="M0 -50Q7 -43 2 -34" fill="none" stroke-width="2.6"/>';
  h+='<path d="M-6 -26L-17 -15L-19 -3M6 -26L17 -15L19 -3M-5 14L-16 22L-18 33M5 14L16 22L18 33" fill="none" stroke-width="3.2"/><path d="M-6 -26L-17 -15L-19 -3M6 -26L17 -15L19 -3M-5 14L-16 22L-18 33M5 14L16 22L18 33" fill="none" stroke="'+BONE+'" stroke-width="1.6"/>';
  h+='<ellipse cy="-26" rx="9" ry="4.5" fill="'+BONE+'" stroke-width="1"/>';
  for(var k=-8;k<=12;k+=5)h+='<path d="M-1 '+k+'Q-12 '+(k+2)+' -10 '+(k+7)+'M1 '+k+'Q12 '+(k+2)+' 10 '+(k+7)+'" fill="none" stroke-width="1.6"/>';
  for(var v=-33;v<=19;v+=5)h+='<circle cy="'+v+'" r="2.6" fill="'+BONE+'" stroke-width=".9"/>';
  h+='<path d="M-9 24Q0 17 9 24L5 41Q0 47 -5 41Z" fill="'+BONE+'" stroke-width="1.2"/><circle cx="-3.5" cy="29" r="1.8" fill="#8A7050" stroke="none"/><circle cx="3.5" cy="29" r="1.8" fill="#8A7050" stroke="none"/>';
  return h+'</g>'}
function riceG(x,y,r,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+(r||0)+') scale('+(s||1)+')"><ellipse rx="8" ry="3.6" fill="#2E2622"/><ellipse cx="-2" cy="-1.2" rx="3" ry="1" fill="#6A5A50"/></g>'}
function milletG(x,y,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+(s||1)+')"><circle r="4.4" fill="#3A2E28"/><circle cx="-1.4" cy="-1.4" r="1.2" fill="#7A6A60"/></g>'}
function stoneG(x,y,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+(s||1)+')"><path d="M-8 3Q-9 -5 -1 -6Q8 -6 8 1Q7 7 0 7Q-6 7 -8 3Z" fill="#9A9AA0" stroke="#6A6A70" stroke-width="1"/></g>'}
// 考古館（深色石牆、黃色的天井）
function museum(x,y,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s)+')"><path d="M-46 18H46V-12L30 -22H-30L-46 -12Z" fill="#4A4A4E" stroke="#2E2E32" stroke-width="1.4"/><rect x="-10" y="-22" width="20" height="40" fill="#F2C230"/><path d="M-40 -6H-16M-40 2H-16M16 -6H40M16 2H40" stroke="#6A6A70" stroke-width="1.2"/><rect x="-6" y="6" width="12" height="12" fill="#2E2E32"/></g>'}
var ICON={
  layers:'<rect x="-11" y="-10" width="22" height="20" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M-11 -4H11M-11 2H11" stroke="#fff" stroke-width="2"/><circle cx="-4" cy="6" r="1.6" fill="#fff"/><circle cx="4" cy="-7" r="1.4" fill="#fff"/>',
  dog:'<path d="M-6 0H6" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><circle cx="-8" cy="-3" r="2.8" fill="#fff"/><circle cx="-8" cy="3" r="2.8" fill="#fff"/><circle cx="8" cy="-3" r="2.8" fill="#fff"/><circle cx="8" cy="3" r="2.8" fill="#fff"/>',
  rice:'<ellipse cx="-4" cy="-4" rx="5" ry="2.2" transform="rotate(-30 -4 -4)" fill="#fff"/><ellipse cx="5" cy="-1" rx="5" ry="2.2" transform="rotate(40 5 -1)" fill="#fff"/><ellipse cx="-2" cy="6" rx="5" ry="2.2" fill="#fff"/>',
  cord:'<rect x="-5" y="-11" width="10" height="14" rx="2" fill="none" stroke="#fff" stroke-width="2"/><path d="M0 3V11" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M-5 -8L5 -5M-5 -3L5 0" stroke="#fff" stroke-width="1.2"/>',
  pot:'<path d="M-5 -10H5V-7Q10 -4 10 2Q10 10 0 11Q-10 10 -10 2Q-10 -4 -5 -7Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M-6 -1L6 4M-7 4L5 8" stroke="#fff" stroke-width="1"/>',
  museum:'<path d="M-11 9H11M-9 9V-3H9V9M-11 -3L-6 -9H6L11 -3" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><rect x="-2" y="-9" width="4" height="18" fill="#fff"/>'
};
function icon(k){return '<svg viewBox="-12 -12 24 24" aria-hidden="true">'+ICON[k]+'</svg>'}

function idCard(t1,t2,art,C){
  var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F2EBDD" role="img" aria-label="'+t1+': what it looks like"><rect x="-400" y="170" width="1200" height="60" fill="'+SOIL+'"/>'+art;
  C.forEach(function(c){s+='<path d="M'+c[3]+' '+c[4]+'L'+c[1]+' '+(c[2]-5)+'" stroke="#8A7A70" stroke-width="1.2"/><circle cx="'+c[3]+'" cy="'+c[4]+'" r="2.6" fill="#DB2E27"/>'+
    '<text x="'+c[1]+'" y="'+c[2]+'" font-size="15" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#F2EBDD" stroke-width="4" paint-order="stroke">'+c[0]+'</text>'});
  return s+'<text x="160" y="30" font-size="24" font-weight="900" fill="#2A2020" text-anchor="middle" font-family="Noto Serif,Songti TC,serif" stroke="#F2EBDD" stroke-width="4" paint-order="stroke">'+t1+'</text>'+(t2?'<text x="160" y="188" font-size="14" font-weight="700" fill="#FFF8EC" text-anchor="middle">'+t2+'</text>':'')+'</svg>';
}
// 一關做完：說過關的話，有題目就出題，再蓋章
function lvDone(area,i,l,msg,t){say(msg,t);later(function(){say(msg,l.win);if(l.q)quiz(area,l,function(){finish(i)});else finish(i)},900)}

/* ---------- 地圖 ---------- */
// 示意圖：南科（新市）。「5000 年前」是村子、稻田和小米田；「今天」是科學園區的工廠和考古館
var STOPS=[{lv:1,n:'Dig site',x:220,y:200,k:'pit'},{lv:2,n:'Nanguanli',x:400,y:150,k:'dog'},{lv:3,n:'Nanguanli East',x:560,y:240,k:'rice'},{lv:4,n:'Pot making',x:290,y:370,k:'pot'},{lv:5,n:'Lab',x:470,y:400,k:'lab'},{lv:6,n:'Museum',x:640,y:350,k:'museum'}];
function marker(s){
  var t='<g transform="translate('+s.x+' '+s.y+')">';

  if(s.k==='dog')return t+'<rect x="-22" y="-26" width="44" height="50" fill="'+SOILD+'" stroke="#5A3E2B" stroke-width="1.2"/>'+dogBones(0,-2,.46)+'</g>';
  if(s.k==='rice')return t+'<ellipse rx="22" ry="11" fill="#F4F0E8" stroke="#A89A88" stroke-width="1.2"/>'+riceG(-8,-2,-20,.8)+riceG(6,-3,30,.8)+riceG(0,4,0,.8)+milletG(12,4,.7)+'</g>';

  p+='<g transform="translate(350 250)"><circle cy="-14" r="5" fill="#C8906A"/><path d="M-5 -9H5L6 6H-6Z" fill="#8A6A4A"/><path d="M14 2Q20 -4 28 0Q30 4 26 6H16Z" fill="#B8865A"/><circle cx="29" cy="-1" r="3.4" fill="#B8865A"/><path d="M15 3Q10 -2 12 -6" stroke="#B8865A" stroke-width="2" fill="none"/></g>';

  /* 第 2 關：看記錄單的方格座標，點出那一格，清出小狗的骨頭 */
  grid:function(area,i,l){

        if(!open[n]){h+='<rect x="'+x+'" y="'+y+'" width="'+C+'" height="'+C+'" fill="#9A7550"/>';for(var q=0;q<4;q++)h+='<circle cx="'+(x+6+((q*13+c*7+r*5)%28))+'" cy="'+(y+6+((q*11+c*5+r*9)%28))+'" r="1.5" fill="#7A5A3E"/>'}

    draw();

  /* 第 3 關：用鑷子點兩下，夾起碳化稻米和小米 */
  tweezer:function(area,i,l){
    var T=[{k:'r',x:90,y:80,r:20},{k:'r',x:150,y:58,r:-30},{k:'r',x:218,y:92,r:60},{k:'r',x:118,y:134,r:10},{k:'m',x:186,y:140},{k:'m',x:250,y:70},{k:'s',x:62,y:110},{k:'s',x:132,y:96},{k:'s',x:180,y:104},{k:'s',x:242,y:128}],

    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E8EEF0"><rect x="-400" y="180" width="1200" height="80" fill="#C8BCA8"/><ellipse cx="160" cy="100" rx="134" ry="78" fill="#F4F0E8" stroke="#A89A88" stroke-width="2"/><ellipse cx="160" cy="100" rx="122" ry="68" fill="#D8BC90"/>';
    var r0=rnd(7);for(var q=0;q<70;q++){var a=r0()*6.283,d=Math.sqrt(r0());s+='<circle cx="'+f1(160+Math.cos(a)*d*114)+'" cy="'+f1(100+Math.sin(a)*d*62)+'" r="'+f1(.8+r0()*1.2)+'" fill="#B89868"/>'}

    function draw(){it.innerHTML=T.filter(function(o){return !o.got}).map(function(o){return o.k==='r'?riceG(o.x,o.y,o.r,1.35):o.k==='m'?milletG(o.x,o.y,1.3):stoneG(o.x,o.y,1.3)}).join('');bar.style.width=(n/N*100)+'%'}
    function tweez(o,shut){if(!o){tw.innerHTML='';return}var g=shut?2:7;
      tw.innerHTML='<g transform="translate('+o.x+' '+o.y+')"><path d="M2 -3L34 -50M'+g+' 0L44 -44" stroke="#8A96A0" stroke-width="3" stroke-linecap="round"/><path d="M2 -3L34 -50M'+g+' 0L44 -44" stroke="#D8E0E6" stroke-width="1.2" stroke-linecap="round"/></g>'}
    draw();
    loops.push(function(){clearTimeout(tm)});

    drag(svg,function(t,p){
      if(done||t!=='down')return;

      if(best<0){lastK=-1;tweez(null);say(msg,'Tap right on a <b>grain</b>.',1);return}
      var o=T[best];
      if(best===lastK&&now-lastT<550){lastK=-1;clearTimeout(tm);

    });

  /* 第 4 關：點一下陶罐，木拍拍出繩紋，拍滿整個陶罐 */
  stamp:function(area,i,l){
    var TOP=28,S=1.22,CX=160,pts=[],done=false,tm=0,d=potPath(CX,TOP,S),r0=rnd(5);

    function cov(){return pts.filter(function(q){return q.c}).length/pts.length}
    function hitAt(x,y){var a=Math.round((r0()-.5)*30);

      if(c>.7){dots.innerHTML=pts.filter(function(q){return !q.c}).map(function(q){return '<circle cx="'+q.x+'" cy="'+q.y+'" r="2.2" fill="#FFF8EC"/>'}).join('');say(msg,'Almost! The spots with <b>white dots</b> still need patting.')}
      else say(msg,'Pat! Now pat the smooth parts.')}

    });

  },

  /* 第 5 關：看左邊半個陶罐，在右邊畫出對稱的另一半 */
  mirror:function(area,i,l){
    var TOP=30,S=1.18,CX=160,HH=118*S,line=[],on=false,done=false,fails=0,TG=[];
    for(var dy=0;dy<=118;dy+=1)TG.push([CX+potW(dy)*S,TOP+dy*S]);
    var left=potSide(CX,TOP,S,-1),right=potSide(CX,TOP,S,1);

    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F2EEE6"><rect x="-400" y="180" width="1200" height="80" fill="#C8BCA8"/>'+cordDef('cordR')+
      '<path d="'+dl+'" fill="'+CLAY+'" stroke="#7A4A2E" stroke-width="2"/><path d="'+dl+'" fill="url(#cordR)"/><path d="M140 46L122 80L132 110M98 112L122 128L138 158M112 64L96 86" stroke="#6E3E22" stroke-width="1.4" fill="none"/>'+
      '<path d="M160 20V182" stroke="#8A7A70" stroke-width="1.4" stroke-dasharray="5 4"/><g id="gd"></g><g id="rt"></g>'+
      '<circle cx="'+f1(CX+30*S)+'" cy="'+TOP+'" r="5" fill="#DB2E27"/><text x="'+f1(CX+30*S+12)+'" y="'+(TOP-6)+'" font-size="13" font-weight="700" fill="#DB2E27">Start here</text><path id="ln" d="" stroke="#6C2024" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),ln=svg.querySelector('#ln'),gd=svg.querySelector('#gd'),rt=svg.querySelector('#rt');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function show(){ln.setAttribute('d',line.length?'M'+line.map(function(q){return f1(q.x)+' '+f1(q.y)}).join('L'):'')}
    function dist(q){var m=1e9;TG.forEach(function(g){var d=Math.hypot(q.x-g[0],q.y-g[1]);if(d<m)m=d});return m}
    function win(){done=true;on=false;gd.innerHTML='';rt.innerHTML='<path d="'+dr+'" fill="'+CLAY+'" stroke="#7A4A2E" stroke-width="2"/><path d="'+dr+'" fill="url(#cordR)"/>';bar.style.width='100%';lvDone(area,i,l,msg,'Both sides match!')}
    function check(){
      var err=0;line.forEach(function(q){err+=dist(q)});err/=Math.max(1,line.length);
      var hitN=0,tot=0;TG.forEach(function(g,k){if(k%4)return;tot++;if(line.some(function(q){return Math.hypot(q.x-g[0],q.y-g[1])<15}))hitN++});
      var cv=hitN/tot;bar.style.width=f1(Math.min(1,cv)*100)+'%';

    }

    });

    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();win()}});
    later(function(){if(!done&&!fails&&!line.length)say(msg,'Put your finger on the <b>red dot</b> at the top right. Without letting go, copy the left side (flipped) all the way to the bottom.')},8000);
  },

      if(t==='down'){held=null;var bd=26;IT.forEach(function(o){if(o.on)return;var d=Math.hypot(p.x-o.x,p.y-o.y);if(d<bd){bd=d;held=o}});
        if(held){off={x:p.x-held.x,y:p.y-held.y};lastP=p;lastT=now;v=0;fast=0;draw()}else say(msg,'Hold a treasure <b>on the cart</b>.',1);return}
      if(!held)return;
      if(t==='move'){var dt=Math.max(16,now-lastT),inst=Math.hypot(p.x-lastP.x,p.y-lastP.y)/dt;lastP=p;lastT=now;v=.5*v+.5*inst;
        if(v>.42)fast++;else fast=Math.max(0,fast-1);
        if(fast>=4){drop(held,'Too fast! It wobbled and nearly broke. It went back to the cart. Drag it <b>slowly</b>.',1);return}
        held.x=p.x-off.x;held.y=p.y-off.y;draw();return}
      if(t==='up'){var o=held,q=null;SL.forEach(function(s2){if(!s2.o&&Math.hypot(o.x-s2.x,o.y-s2.y)<30)q=s2});
        if(q)place(o,q);else drop(o,'Put it in a red dotted box in the <b>display case</b>.',1)}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','Display case. Press Enter to place one treasure');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var o=IT.filter(function(q){return !q.on})[0],q=SL.filter(function(q){return !q.o})[0];if(o&&q)place(o,q)}});
    later(function(){if(!n&&!done)say(msg,'Hold a treasure on the cart and drag it <b>slowly</b> up to the right, into a red dotted box in the display case. If the glow turns <b>yellow</b>, you are going too fast.')},8000);
  }
};
