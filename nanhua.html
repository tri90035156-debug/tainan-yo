<h1>家裡的水任務・水利・南化水庫</h1>
<p>跟著阿姨到臺南最東邊的<b>南化水庫</b>，看看家裡的水從哪裡來：點出和湖水一樣高的<b>水位柱</b>、把高雄<b>旗山溪</b>的水接過山、沿著<b>聯通管</b>讓三座水庫互相幫忙、數一數 2024 年 4 月和 6 月的<b>水尺</b>、從水龍頭倒著追回<b>淨水場</b>和水庫，最後在家省水洗澡。</p>
<p>地點：南化（臺南市南化區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>打開水龍頭，水就嘩啦啦流出來。這些水，是從哪裡來的呢？臺南最東邊的南化，山裡有一座南化水庫。它在三十多年前蓋好，主要是給大臺南和大高雄的家家戶戶用水。跟著阿姨到南化水庫，看看家裡的水，走了多遠的路。每過一關，就能蓋一個章。</p><h2>關卡</h2><ol>
<li><h3>第 1 關・觀景台：湖裡的水剩多少？</h3><p>阿姨帶你走上大壩旁邊的觀景台。從這裡看出去，整座大壩和水庫的湖都看得到。今天湖邊露出一圈黃黃的土。雨很少的那段日子，叫枯水期，水庫的水會越來越少。</p><p>為什麼？為什麼要蓋水庫？ 臺灣的雨，有時候下很多，有時候很久不下。水庫就像一個大水缸：雨多的時候把水存起來，雨少的時候再慢慢拿出來用。這樣不下雨的日子，家裡也有水可以用。</p></li>
<li><h3>第 2 關・甲仙攔河堰：水從山的另一邊來</h3><p>南化水庫的水，有一部分不是下在南化的雨，而是從高雄的旗山溪送來的。旗山溪上有一座甲仙攔河堰，把溪水攔下來，送過山，送進南化水庫。把一條溪的水送過山，到另一邊用，叫越域引水。</p><p>為什麼？為什麼要從高雄送水來？ 南化這邊的雨不夠的時候，就靠甲仙攔河堰把旗山溪的水送過來。報導說，2024 年上半年送來的水，讓快見底的南化水庫，到了 6 月又回到大約四分之三。</p></li>
<li><h3>第 3 關・聯通管：水庫手拉手</h3><p>南化水庫不是自己一個。它和北邊的曾文水庫、烏山頭水庫，用很粗的水管接在一起，叫聯通管。哪一座水庫快沒水了，水多的那一座就可以送水過去幫忙。</p><p>為什麼？為什麼水庫要互相幫忙？ 每座水庫的雨下得不一樣多，有的快空了，有的還很多。用聯通管接起來，水就能從水多的地方，送到缺水的地方。政府說，曾文水庫和南化水庫可以雙向幫忙：你幫我，我也幫你。</p></li>
<li><h3>第 4 關・大壩旁的水尺：4 月和 6 月</h3><p>水庫邊有一根量水有多高的尺，叫水尺（這裡畫成 4 格，是示意）。2024 年的春天很缺水。4 月的時候，南化水庫能用的水，最少只剩大約四分之一。後來甲仙攔河堰送了很多水來，到了 6 月，又回到大約四分之三。</p><p>為什麼？4 格裡有 1 格，是多少？ 把水庫能用的水分成一樣大的 4 份，有水的只有 1 份，就是四分之一；有 3 份，就是四分之三。2024 年 4 月的南化水庫，能用的水只剩大約四分之一。</p></li>
<li><h3>第 5 關・淨水場：倒著追水源</h3><p>水庫的水，還不能直接喝。水庫裡的水叫原水，要先送到淨水場變乾淨。自來水公司說，自來水要走四步：取水（從水庫把原水取出來）、導水（用水路把原水送到淨水場）、淨水（把水變乾淨）、送水（用水管送到家）。淨水場會把水沉澱、過濾，再消毒，殺掉看不見的病菌，才變成可以喝的自來水。</p><p>為什麼？為什麼水龍頭一打開就有水？ 因為家家戶戶的下面，都接著一條一條的水管。淨水場把乾淨的自來水，一直送進這些水管裡。你一打開水龍頭，水就流出來了。</p></li>
<li><h3>第 6 關・家裡：洗澡也能省水</h3><p>水庫的水，要靠下雨，有一部分還要從高雄送過山來，才存得起來。缺水的時候，每個人在家省一點，水庫的水就能用久一點。新聞報導裡，臺北自來水事業處的人說：淋浴的時候，抹肥皂就先把水關起來。少開 1 分鐘，大約可以省 10 公升的水。</p><p>為什麼？為什麼淋浴比泡澡省水？ 泡澡要放滿一整缸的水。新聞報導裡，自來水事業處的人說，改成淋浴，每個人每天大約可以省 40 公升的水。</p></li>
</ol>

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
// 一直跑的動畫（換關時會自動停）
function anim(fn){var raf=0,last=0,on=true;function step(now){if(!on)return;var dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(fn(dt)===false){on=false;return}raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step);loops.push(function(){on=false;cancelAnimationFrame(raf)});return function(){on=false;cancelAnimationFrame(raf)}}
// 一定要等的時間（later() 在「減少動態效果」時會變成 0）
function wait(fn,ms){var t=setTimeout(fn,ms);loops.push(function(){clearTimeout(t)})}
// 點到線段的距離，和投影在線段上的位置（0～1）
function segP(p,a,b){var dx=b.x-a.x,dy=b.y-a.y,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy),0,1);return {d:Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy),t:t}}
// 點到折線的最近距離
function polyD(P,p){var d=999;for(var k=1;k<P.length;k++)d=Math.min(d,segP(p,P[k-1],P[k]).d);return d}

  /* 第 3 關：看三座水庫的水，手指從水多的那一座沿著聯通管滑到最缺水的那一座（2 次） */
  link:function(area,i,l){

        if(k>=1){good();return false}})}
    function judge(a,b){var q=ROUND[r];trail=[];draw();
      if(a===q.a&&b===q.b){send(a,b,function(){r++;lock=false;

  /* 第 4 關：2024 年 4 月，點水尺上泡在水裡的格子數出四分之一；再猜 6 月的四分之三會漲到哪一格，點對水才漲 */

        '<text x="260" y="'+(BY[2]+48)+'" font-size="15" font-weight="900" fill="#3F6B2E" text-anchor="middle">'+(guess?'猜一猜':hit.length+' 格有水')+'</text>';
      bar.style.width=(done?100:(r*4+hit.length)/8*90)+'%'}

    function tapBox(j){if(done||lock)return;
      if(guess){gp=j;

      for(var m=0;m<=Math.min(k,4);m++){h+=art(N[m])+lab(N[m].n,N[m].x+(m===0?6:0),N[m].y+(m===0?-50:30),'#2A2020')}
      if(!done){var c=N[k];h+='<circle cx="'+c.x+'" cy="'+c.y+'" r="24" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>';
        opts().forEach(function(o){h+='<path d="M'+c.x+' '+c.y+'L'+o.x+' '+o.y+'" stroke="#BD9558" stroke-width="2" stroke-dasharray="3 4"/><circle cx="'+o.x+'" cy="'+o.y+'" r="18" fill="#FFF8EC" stroke="#BD9558" stroke-width="2"/><text x="'+o.x+'" y="'+(o.y+5)+'" font-size="15" font-weight="900" fill="#BD9558" text-anchor="middle">?</text>'+lab(o.n,o.x,o.y+(o.y<70?-24:o.y>150?-24:32),'#6C2024')})}
      ng.innerHTML=h;bar.style.width=(done?100:k/4*90)+'%'}
    draw();
    function choose(o){if(done||lock)return;
      if(!o.ok){say(msg,o.e,1);return}
      say(msg,'對了！這一步是'+STEP[k]+'。');k++;draw();
      if(k>=4){done=true;draw();lvDone(area,i,l,msg,'追到了！水龍頭的水，最早是從<b>南化水庫</b>取出來的。')}}
    drag(svg,function(t,p){if(t!=='down'||done||lock)return;var b=null,bd=26;opts().forEach(function(o){var d=dist(p,o);if(d<bd){bd=d;b=o}});
      if(!b){say(msg,'點有<b>問號</b>的圓圈，選水是從哪裡送來的。',1);return}choose(b)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','自來水的路，按 Enter 往回找下一站');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();choose(opts()[0])}});
    later(function(){if(!done&&!k)say(msg,'家裡的水，是從地下的<b>大水管</b>送來的。點大水管那個問號。')},8000);
  },

  /* 第 6 關：看他在做什麼，點水龍頭開水或關水（沖水時開，抹肥皂、抹洗髮精時關） */
  shower:function(area,i,l){
    var SS=[{t:'沖濕身體',on:1,d:2.2},{t:'抹肥皂',on:0,d:2.6},{t:'沖掉泡泡',on:1,d:2.2},{t:'抹洗髮精',on:0,d:2.6},{t:'沖乾淨',on:1,d:2.2}],
      k=0,tt=0,water=false,waste=0,done=false,bad=0,started=false,hold=0,KN={x:236,y:96};
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E4F0F2">'+
      [20,60,100,140,180,220,260,300].map(function(x){return '<path d="M'+x+' 0V176" stroke="#D0E2E6" stroke-width="1.4"/>'}).join('')+[30,70,110,150].map(function(y){return '<path d="M-400 '+y+'H720" stroke="#D0E2E6" stroke-width="1.4"/>'}).join('')+
      '<rect x="-400" y="176" width="1200" height="40" fill="#C8D6DA"/>'+
      '<path d="M236 70V40Q236 26 210 26H164" stroke="#8A96A2" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M146 34Q164 20 182 34Z" fill="#8A96A2"/>'+
      '<g id="wg"></g><g id="pg"></g><g id="kg"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),wg=svg.querySelector('#wg'),pg=svg.querySelector('#pg'),kg=svg.querySelector('#kg');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){var q=SS[Math.min(k,4)],h='';
      if(water)for(var m=0;m<6;m++){var x=150+m*6,o=(tt*80+m*13)%30;h+='<path d="M'+x+' '+f1(36+o)+'V'+f1(48+o)+'M'+x+' '+f1(66+o)+'V'+f1(78+o)+'M'+x+' '+f1(96+o)+'V'+f1(104+o)+'" stroke="'+WATER2+'" stroke-width="2.4" stroke-linecap="round"/>'}
      wg.innerHTML=h;
      h='<g transform="translate(164 170) scale(1.7)"><path d="M-4 0V-14M4 0V-14" stroke="#E8B890" stroke-width="4" stroke-linecap="round"/><path d="M-9 -13Q-10 -30 0 -32Q10 -30 9 -13Z" fill="#E8B890"/><rect x="-9" y="-16" width="18" height="6" rx="2" fill="#5A8AC0"/><circle cy="-39" r="7.5" fill="#E8B890"/><circle cx="-2.6" cy="-40" r="1" fill="#2A2020"/><circle cx="2.6" cy="-40" r="1" fill="#2A2020"/><path d="M-7 -41Q-6 -48 0 -47.5Q6 -48 7 -41" fill="#3A2E28"/></g>';
      if(!done&&(q.t==='抹肥皂'||q.t==='抹洗髮精'||(k>0&&SS[k-1].on===0&&q.on&&tt<q.d*.5))){var by=q.t==='抹洗髮精'?92:120;
        [[-10,0],[0,-8],[10,2],[-4,10],[8,12]].forEach(function(b){h+='<circle cx="'+(164+b[0])+'" cy="'+(by+b[1])+'" r="5" fill="#fff" stroke="#B8D0D8" stroke-width="1.2"/>'})}
      if(!done)h+='<rect x="40" y="40" width="90" height="28" rx="14" fill="#fff" stroke="#6C2024" stroke-width="1.6"/><text x="85" y="59" font-size="15" font-weight="900" fill="#6C2024" text-anchor="middle">'+q.t+'</text>';
      if(!done)h+='<text x="85" y="88" font-size="13" fill="#5A4A3A" text-anchor="middle">'+(k+1)+'／5</text>';
      if(waste>0)h+='<text x="85" y="150" font-size="14" font-weight="700" fill="#DB2E27" text-anchor="middle">浪費的水：'+Math.round(waste*10)/10+' 秒</text>';
      pg.innerHTML=h;
      kg.innerHTML='<circle cx="'+KN.x+'" cy="'+KN.y+'" r="22" fill="'+(water?'#3E7EA8':'#fff')+'" stroke="#6A7682" stroke-width="3"/><path d="M'+(KN.x-12)+' '+KN.y+'H'+(KN.x+12)+'" stroke="'+(water?'#fff':'#6A7682')+'" stroke-width="5" stroke-linecap="round" transform="rotate('+(water?90:0)+' '+KN.x+' '+KN.y+')"/>'+
        '<text x="'+KN.x+'" y="'+(KN.y+40)+'" font-size="14" font-weight="700" fill="#2A2020" text-anchor="middle">'+(water?'水開著':'水關著')+'</text>'+
        (!done&&((SS[Math.min(k,4)].on?1:0)!==(water?1:0))?'<circle cx="'+KN.x+'" cy="'+KN.y+'" r="28" fill="none" stroke="#DB2E27" stroke-width="2.2" stroke-dasharray="4 3"/>':'');
      bar.style.width=(done?100:(k+Math.min(1,tt/SS[Math.min(k,4)].d))/5*90)+'%'}
    draw();
    function reset(){k=0;tt=0;water=false;waste=0;draw()}
    anim(function(dt){if(done||!started)return;var q=SS[k];
      if(q.on){if(water)tt+=dt}else{tt+=dt;if(water)waste+=dt}
      if(tt>=q.d){tt=0;k++;
        if(k>=SS.length){if(water){k=4;tt=q.d;draw();if(!hold){hold=1;say(msg,'洗好了，記得把水<b>關起來</b>。')}return}
          endCheck();return}
        var n=SS[k];say(msg,n.on?'該<b>沖水</b>了，打開水龍頭。':'現在要<b>'+n.t+'</b>，水用不到，先關起來。')}
      draw()});
    function endCheck(){hold=0;
      if(waste>3){bad++;say(msg,'洗好了，可是抹東西的時候，水開了 '+Math.round(waste*10)/10+' 秒，浪費了。再洗一次，<b>抹肥皂、抹洗髮精</b>的時候先把水關起來。',1);reset();started=false;return}
      done=true;draw();lvDone(area,i,l,msg,'洗好了，水也關好了！浪費的水只有一點點。')}
    function toggle(){if(done)return;
      if(hold&&water){water=false;endCheck();return}
      water=!water;if(!started){started=true;say(msg,'沖濕身體中……')}draw()}
    drag(svg,function(t,p){if(t!=='down'||done)return;if(dist(p,KN)<32){toggle();return}say(msg,'點右邊的<b>水龍頭</b>開關，開水或關水。',1)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','洗澡的地方，按 Enter 開水或關水');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();toggle()}});
    say(msg,'先要沖濕身體。點<b>水龍頭</b>，把水打開。');
    later(function(){if(!done&&!started)say(msg,'點右邊那個圓圓的<b>水龍頭開關</b>。')},7000);
  }
};
</script>
