<script>

/* ---------- 插畫元件 ---------- */
var K='#2A2020',NS='http://www.w3.org/2000/svg';
var GOLD='#E2B23C',GOLDD='#B98A24',PALE='#DCD39A',LEAFC='#5E9A46',STEM='#A89A3A';
function f1(v){return (Math.round(v*10)/10).toString()}
function rnd(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280}}
// 一支稻穗：(x,y) 是穗的頂端，ang 是方向（0 往上，越大越往右下垂），full 飽滿
function ear(x,y,ang,s,full){
  var dx=Math.sin(ang),dy=-Math.cos(ang),px=-dy,py=dx,L=(full?44:38)*s,h='';
  h+='<path d="M'+f1(x)+' '+f1(y)+'L'+f1(x+dx*L)+' '+f1(y+dy*L)+'" stroke="'+STEM+'" stroke-width="'+f1(1.4*s)+'"/>';
  for(var k=1;k<=9;k++){var t=k/9.5,cx=x+dx*L*t,cy=y+dy*L*t,side=k%2?1:-1,o=(full?3.4:2.4)*s,gx=cx+px*o*side,gy=cy+py*o*side,a=Math.atan2(dy,dx)*57.3+side*25;
    h+='<ellipse cx="'+f1(gx)+'" cy="'+f1(gy)+'" rx="'+f1((full?4:3)*s)+'" ry="'+f1((full?2.3:1.3)*s)+'" fill="'+(full?GOLD:PALE)+'" stroke="'+GOLDD+'" stroke-width="'+f1(.4*s)+'" transform="rotate('+f1(a)+' '+f1(gx)+' '+f1(gy)+')"/>'}
  return h;
}
// 一叢稻子（地圖上的小圖）
function clump(x,y,s,gold){
  var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+(s||1)+')">';
  [-6,-2,2,6].forEach(function(d){h+='<path d="M0 0Q'+f1(d*.6)+' -8 '+d+' -16" stroke="'+(gold?STEM:LEAFC)+'" stroke-width="1.4" fill="none"/>';if(gold)h+=ear(d,-16,(d<0?-1.9:1.9),.32,true)});
  return h+'</g>';
}
// 一粒米：st 0 稻穀（有粗糠）、1 糙米、2 白米
function grain(x,y,s,st){
  var c=['#D9A93A','#D2B07C','#FBF8F0'][st],k=['#9A7420','#A8875A','#CFC6B2'][st],h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+s+')"><ellipse rx="10" ry="17" fill="'+c+'" stroke="'+k+'" stroke-width="1"/>';
  if(st===0)h+='<path d="M0 -17V17M-5 -15Q-7.5 0 -5 15M5 -15Q7.5 0 5 15" stroke="'+k+'" stroke-width=".7" fill="none"/><path d="M0 -17V-21" stroke="'+k+'" stroke-width="1.2"/>';
  if(st===1)h+='<path d="M-4 12Q0 17 4 12Z" fill="#E9D3A6" stroke="#B8945E" stroke-width=".8"/><path d="M-6 -6Q-7 2 -5 8" stroke="#fff" stroke-opacity=".45" stroke-width="1.6" fill="none"/>';
  if(st===2)h+='<path d="M-5 -8Q-7 0 -5 8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
  return h+'</g>';
}
// 割稻機（往右開，前面黃色的是割刀）
function combine(x,y,a,s){
  return '<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+f1(a)+') scale('+(s||1)+')">'+
    '<rect x="-17" y="-13" width="30" height="5" rx="2" fill="#4A4A4A"/><rect x="-17" y="8" width="30" height="5" rx="2" fill="#4A4A4A"/>'+
    '<rect x="-16" y="-10" width="28" height="20" rx="3" fill="#E2574C" stroke="#9A2A22" stroke-width="1"/>'+
    '<rect x="-12" y="-7" width="10" height="9" rx="1.5" fill="#BFE3F0" stroke="#9A2A22" stroke-width=".8"/><circle cx="6" cy="0" r="3" fill="#C9402F"/>'+
    '<path d="M13 -15H19V15H13Z" fill="#F2C94C" stroke="#A88420" stroke-width="1"/><path d="M19 -13H22M19 -8H22M19 -3H22M19 2H22M19 7H22M19 12H22" stroke="#A88420" stroke-width="1.4"/></g>';
}
// 摔桶（木頭桶子）
function tub(x,y,s){
  return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+(s||1)+')"><path d="M-32 -14H32L26 14H-26Z" fill="#A8774A" stroke="#6E4A2A" stroke-width="1.2"/><path d="M-30 -5H30M-28 6H28" stroke="#6E4A2A" stroke-width="2"/><path d="M-32 -14H32" stroke="#6E4A2A" stroke-width="2.4"/></g>';
}
// 稻埕上的穀耙
function rakeArt(x,y,s){
  return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+(s||1)+')"><path d="M0 0V-34" stroke="#8A6A3A" stroke-width="2.6" stroke-linecap="round"/><path d="M-13 0H13" stroke="#6E4A2A" stroke-width="3.4" stroke-linecap="round"/><path d="M-11 0V5M-5.5 0V5M0 0V5M5.5 0V5M11 0V5" stroke="#6E4A2A" stroke-width="1.8" stroke-linecap="round"/></g>';
}
var ICON={
  cloth:'<path d="M-8 -8H8V7Q4 10 0 7Q-4 4 -8 7Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M-10 -9H10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>',
  ear:'<path d="M-7 10Q-5 -4 3 -8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><g fill="#fff"><ellipse cx="0" cy="-5" rx="2.6" ry="1.6" transform="rotate(30 0 -5)"/><ellipse cx="4" cy="-3" rx="2.6" ry="1.6" transform="rotate(70 4 -3)"/><ellipse cx="6" cy="1" rx="2.6" ry="1.6" transform="rotate(80 6 1)"/><ellipse cx="6.5" cy="5.5" rx="2.6" ry="1.6" transform="rotate(95 6.5 5.5)"/><ellipse cx="2" cy="1" rx="2.6" ry="1.6" transform="rotate(60 2 1)"/></g>',
  combine:'<rect x="-10" y="-3" width="13" height="9" rx="1.5" fill="none" stroke="#fff" stroke-width="2"/><rect x="-7" y="-9" width="6" height="6" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M7 -7V10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M3 1H7" stroke="#fff" stroke-width="2"/><circle cx="-6" cy="8.5" r="2" fill="#fff"/><circle cx="0" cy="8.5" r="2" fill="#fff"/>',
  tub:'<path d="M-9 -1H9L6 9H-6Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M-3 -3L3 -11" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="-6" cy="-6" r="1.4" fill="#fff"/><circle cx="7" cy="-5" r="1.4" fill="#fff"/><circle cx="1" cy="-7" r="1.2" fill="#fff"/>',
  rake:'<path d="M0 -10V4M-8 4H8M-8 4V9M-3 4V9M3 4V9M8 4V9" stroke="#fff" stroke-width="2.1" stroke-linecap="round" fill="none"/>',
  bowl:'<path d="M-10 0H10A10 9 0 0 1 -10 0Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M-6.5 0Q-4 -6 0 -2.5Q4 -7 6.5 0" fill="none" stroke="#fff" stroke-width="1.8"/>'
};
function icon(k){return '<svg viewBox="-12 -12 24 24" aria-hidden="true">'+ICON[k]+'</svg>'}

// 開場的認稻穗圖：大大的稻穗，加上幾個認得出它的特徵
function idCard(t1,t2,art,C){
  var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F2F1E4" role="img" aria-label="'+t1+'的樣子"><rect x="-400" y="172" width="1200" height="60" fill="#E4DAB4"/>'+art;
  C.forEach(function(c){s+='<path d="M'+c[3]+' '+c[4]+'L'+c[1]+' '+(c[2]-5)+'" stroke="#8A7A70" stroke-width="1.2"/><circle cx="'+c[3]+'" cy="'+c[4]+'" r="2.6" fill="#DB2E27"/>'+
    '<text x="'+c[1]+'" y="'+c[2]+'" font-size="15" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#F2F1E4" stroke-width="4" paint-order="stroke">'+c[0]+'</text>'});
  return s+'<text x="160" y="34" font-size="24" font-weight="900" fill="#2A2020" text-anchor="middle" font-family="Noto Serif TC,Songti TC,serif" stroke="#F2F1E4" stroke-width="4" paint-order="stroke">'+t1+'</text>'+(t2?'<text x="160" y="190" font-size="14" font-weight="700" fill="#7A5A20" text-anchor="middle">'+t2+'</text>':'')+'</svg>';
}

/* ---------- 地圖 ---------- */
// 示意圖：後壁菁寮一帶，老街在十字路口旁邊，四周都是稻田；「插秧時」田裡有水和秧苗，「收割時」一片金黃
var STOPS=[{lv:1,n:'菁寮老街',x:300,y:200,k:'street'},{lv:2,n:'10 月的稻田',x:530,y:170,k:'ear'},{lv:3,n:'開割稻機',x:630,y:330,k:'combine'},{lv:4,n:'以前的割稻',x:440,y:330,k:'tub'},{lv:5,n:'稻埕曬穀',x:250,y:400,k:'yard'},{lv:6,n:'碾米廠',x:500,y:450,k:'mill'}];
function marker(s){
  var t='<g transform="translate('+s.x+' '+s.y+')">';
  if(s.k==='street'){[-1,0,1].forEach(function(k){t+='<rect x="'+(k*16-7)+'" y="-6" width="14" height="18" fill="#F3E6CC" stroke="#9A7A55" stroke-width="1"/><path d="M'+(k*16-9)+' -6L'+(k*16)+' -14L'+(k*16+9)+' -6Z" fill="#8A5A3A"/><rect x="'+(k*16-3)+'" y="3" width="6" height="9" fill="#9A7A55"/>'});return t+'<path d="M26 -10V14" stroke="#8A6A3A" stroke-width="1.6"/><rect x="27" y="-8" width="10" height="16" fill="#2F5590"/></g>'}
  if(s.k==='ear')return t+clump(-16,14,1.8,true)+clump(16,14,1.8,true)+clump(0,12,2.2,true)+'</g>';
  if(s.k==='combine')return t+combine(0,2,0,1.1)+'</g>';
  if(s.k==='tub')return t+tub(0,6,.8)+'<path d="M-6 -24L2 -6M2 -24L6 -6" stroke="'+STEM+'" stroke-width="2"/>'+ear(2,-6,2.6,.4,true)+'</g>';
  if(s.k==='yard')return t+'<rect x="-26" y="-6" width="52" height="20" rx="3" fill="#E8C55A" stroke="#B98A24" stroke-width="1"/>'+rakeArt(14,6,.8)+'</g>';
  return t+'<rect x="-18" y="-10" width="36" height="22" rx="2" fill="#E9E4DA" stroke="#8A8070" stroke-width="1.2"/><path d="M-22 -9L0 -22L22 -9Z" fill="#7A8A96"/><rect x="-5" y="2" width="10" height="10" fill="#8A8070"/><path d="M14 4H24V12H14Z" fill="#F3E6CC" stroke="#9A7A55" stroke-width=".8"/></g>';
}
function buildMap(){
  var h='<defs><pattern id="pSeed" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#A9D3CC"/><path d="M4 6V2.5M4 4.2L2.4 2.6M4 4.2L5.6 2.6" stroke="#4E9A3A" stroke-width="1"/></pattern>'+
    '<pattern id="pGold" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#E8C55A"/><path d="M2 6Q4 2 6.5 3" stroke="#C4952C" stroke-width="1" fill="none"/></pattern></defs>';
  h+='<rect x="-400" y="-300" width="1600" height="1200" fill="#E4DBBE"/><g id="trees"></g>';
  // 十字路口和老街前的路
  h+='<path d="M-400 262H1200M360 -300V900" stroke="#F3EBD8" stroke-width="16"/>';
  // 菁寮聖十字架天主堂（尖尖的屋頂）
  h+='<g transform="translate(170 214)"><rect x="-14" y="-6" width="28" height="18" fill="#F1ECE2" stroke="#9A8C7A" stroke-width="1.2"/><path d="M-16 -6L0 -38L16 -6Z" fill="#8A9AA6" stroke="#6A7A86" stroke-width="1"/><path d="M0 -46V-36M-4 -42H4" stroke="#6A5E50" stroke-width="1.6"/></g>';
  var T=function(t,x,y,sz,c,bg){return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" fill="'+c+'" text-anchor="middle" stroke="'+(bg||'#E4DBBE')+'" stroke-width="4" paint-order="stroke">'+t+'</text>'};
  h+=T('菁寮',390,118,26,'#7A4A2E')+T('菁寮天主堂',170,250,14,'#6A5E50');
  h+='<g transform="translate(110 476)"><circle r="16" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.5"/><path d="M0 -11L5 4L0 1L-5 4Z" fill="#DB2E27"/><text y="12" font-size="9" fill="#5A4E48" text-anchor="middle">北</text></g>';
  h+='<g id="past"><g id="frPast"></g>'+T('插秧時：田裡放水，種下綠綠的秧苗',420,540,15,'#6C2024')+'</g>';
  h+='<g id="now"><g id="frNow"></g>'+T('收割時：一片金黃色的稻田',420,540,15,'#6C2024')+'</g>';
  STOPS.forEach(function(s){h+='<g class="stop" data-lv="'+s.lv+'" role="button" aria-label="第 '+s.lv+' 關 '+s.n+'">'+marker(s)+'<circle cx="'+(s.x+24)+'" cy="'+(s.y-26)+'" r="10" fill="#fff" stroke="#E2574C" stroke-width="2"/><text x="'+(s.x+24)+'" y="'+(s.y-21.5)+'" font-size="13" fill="#E2574C" text-anchor="middle">'+s.lv+'</text><text x="'+s.x+'" y="'+(s.y+34)+'" font-size="16" font-weight="700" fill="#5A3E2B" text-anchor="middle" stroke="#FFF8EC" stroke-width="4" paint-order="stroke">'+s.n+'</text></g>'});
  h+='<g id="pin" style="display:none"><g class="pin"><path d="M0 0C-10 -14 -14 -20 -14 -27A14 14 0 1 1 14 -27C14 -20 10 -14 0 0Z" fill="#E2574C" stroke="#fff" stroke-width="2.5"/><text y="-22" font-size="12" fill="#fff" text-anchor="middle">你</text></g></g>';
  return h;
}
function near(x,y,w,hh){return STOPS.some(function(s){return Math.abs(s.x-x)<w&&Math.abs(s.y-y)<hh})}
function decorate(){
  var t='',p='',q='';
  for(var x=-40;x<840;x+=50)for(var y=-40;y<620;y+=40){
    var cx=x+25,cy=y+20;
    if(near(cx,cy,62,60))continue;
    if(Math.abs(cy-262)<28||Math.abs(cx-360)<30)continue; // 路
    if(Math.abs(cx-170)<46&&Math.abs(cy-214)<56)continue; // 天主堂
    if(Math.abs(cx-390)<62&&Math.abs(cy-110)<26)continue; // 菁寮
    if(Math.abs(cx-110)<30&&Math.abs(cy-476)<30)continue;
    if(cy>516&&cy<566&&Math.abs(cx-420)<200)continue; // 季節的字
    t+='<rect x="'+(x+2)+'" y="'+(y+2)+'" width="46" height="36" rx="3" fill="#C9B98C"/>';
    p+='<rect x="'+(x+5)+'" y="'+(y+5)+'" width="40" height="30" rx="2" fill="url(#pSeed)"/>';
    q+='<rect x="'+(x+5)+'" y="'+(y+5)+'" width="40" height="30" rx="2" fill="url(#pGold)"/>';
  }
  map.querySelector('#trees').innerHTML=t;
  map.querySelector('#frPast').innerHTML=p;
  map.querySelector('#frNow').innerHTML=q;
}

/* ---------- 關卡 ---------- */
var LV=[
  {cam:[100,0,620,620],kick:'割稻任務',h:'稻田變金黃了',
   html:'<p>秋天，臺南北邊的<b>後壁</b>，田裡一片金黃。這是一年裡第二次種的稻子，叫<b>二期稻</b>。</p><p>後壁的<b>菁寮</b>是一個種稻的老村子，四周都是稻田。你每天吃的白米飯，就是從這樣的稻田來的。</p><p class="task">跟著菁寮種稻的<b>阿公</b>，從稻穗變黃到收割、曬穀、碾米，看一粒米怎麼來到你的碗裡。每過一關，就能蓋一個章！</p>',
   after:'<p class="note">地圖右上角可以切換<b>插秧時／收割時</b>，看看稻田的兩種樣子。<br>給大人：後壁二期稻大約 10 月出穗，11 月中旬收割，每年看天氣和颱風會提早或延後。稻田是農民的地，請不要走進田裡。</p>',
   game:'start'},
  {cam:[0,0,300,225],kick:'第 1 關・菁寮老街',h:'菁寮的名字從哪裡來',
   html:'<p><b>菁寮老街</b>是一條很老的街，還留著日本時代的木頭房子。以前結婚要用的東西，在這條街上一次就能買齊，所以大家叫它<b>嫁妝街</b>。</p><p>有一說，很久以前這裡的人種一種植物叫<b>菁仔</b>，用它做<b>藍色的染料</b>染布。所以這裡叫<b>菁仔寮</b>，後來變成<b>菁寮</b>。</p><p class="note">老街上有人住，請小聲，不要隨便走進別人家。<br>給大人：「菁仔寮」的地名由來只見於旅遊介紹，還沒找到官方或學術資料。老街附近的<b>菁寮聖十字架天主堂</b>由德國建築師波姆設計，約 1955 到 1960 年建造，2025 年颱風受損，去之前先查開放時間。</p>',
   task:'按住<b>白布</b>，往下拖進<b>染缸</b>泡一泡，再拉上來。泡 <b>4 次</b>！',game:'dye',stamp:['cloth','染出藍布'],
   win:'泡了 4 次，白布變成一塊藍布了！以前的菁寮人，就是這樣用菁仔的藍色染布。',

    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','稻田的畫面，按 Enter 托起一支飽滿的稻穗');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var o=S.filter(function(o){return o.full&&!o.ok})[0];if(o){o.max=1;o.a=.3;release(o)}}});
    later(function(){if(!n&&!done)say(msg,'手指按住一支<b>稻穗</b>，往上推高，再放開手指。看它是重重地垂下去，還是輕輕地翹起來？')},8000);
  },

  /* 第 3 關：拖著割稻機，把整片田割完 */
  reap:function(area,i,l){
    var CO=14,RO=6,X0=20,Y0=40,CW=20,CH=18,cells=[],cut=0,TOT=CO*RO,done=false,pos={x:40,y:168},ang=0,tgt=null,raf=0,last=performance.now();
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E8F0F2"><defs><pattern id="rG" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#E8C55A"/><path d="M2 7Q4 2 6.5 3" stroke="#C4952C" stroke-width="1.1" fill="none"/></pattern>'+
      '<pattern id="rS" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#D5C48E"/><path d="M2 5V3M4.5 5V3" stroke="#A88E50" stroke-width=".9"/></pattern></defs>'+
      '<rect x="-400" y="154" width="1200" height="120" fill="#A88E5E"/><rect x="'+(X0-6)+'" y="'+(Y0-6)+'" width="'+(CO*CW+12)+'" height="'+(RO*CH+12)+'" rx="4" fill="#9A845A"/><g id="cl"></g><g id="cb"></g>'+
      '<text x="160" y="182" font-size="14" font-weight="700" fill="#FFF8EC" text-anchor="middle">田邊的路</text></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),cl=svg.querySelector('#cl'),cb=svg.querySelector('#cb');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    for(var r=0;r<RO;r++)for(var c=0;c<CO;c++){var e=document.createElementNS(NS,'rect');e.setAttribute('x',X0+c*CW);e.setAttribute('y',Y0+r*CH);e.setAttribute('width',CW+.5);e.setAttribute('height',CH+.5);e.setAttribute('fill','url(#rG)');cl.appendChild(e);cells.push({e:e,cut:0})}
    function cutAt(x,y){var c=Math.floor((x-X0)/CW),r=Math.floor((y-Y0)/CH);if(c<0||c>=CO||r<0||r>=RO)return;var o=cells[r*CO+c];if(o.cut)return;o.cut=1;cut++;o.e.setAttribute('fill','url(#rS)')}
    function progress(){bar.style.width=Math.min(100,cut/(TOT*.95)*100)+'%';
      if(!done&&cut>=TOT*.95){done=true;cells.forEach(function(o){if(!o.cut){o.cut=1;o.e.setAttribute('fill','url(#rS)')}});cut=TOT;bar.style.width='100%';say(msg,'割完了！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},1000)}}
    var said=0;
    (function loop(now){var dt=Math.min(50,now-last)/1000;last=now;
      if(tgt&&!done){var dx=tgt.x-pos.x,dy=tgt.y-pos.y,d=Math.hypot(dx,dy);
        if(d>2){var st=Math.min(d,170*dt);pos.x+=dx/d*st;pos.y+=dy/d*st;var want=Math.atan2(dy,dx),da=want-ang;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;ang+=da*Math.min(1,dt*10)}
        pos.x=Math.max(14,Math.min(306,pos.x));pos.y=Math.max(28,Math.min(176,pos.y));
        var fx=pos.x+Math.cos(ang)*23,fy=pos.y+Math.sin(ang)*23,px=-Math.sin(ang),py=Math.cos(ang);
        [-17,-8.5,0,8.5,17].forEach(function(o){cutAt(fx+px*o,fy+py*o)});
        progress();
        if(!said&&cut>TOT*.4){said=1;say(msg,'割了快一半了！看看還有哪裡是<b>金黃色</b>的。')}
      }
      cb.innerHTML=combine(pos.x,pos.y,ang*57.3,1.3);raf=requestAnimationFrame(loop)})(last);
    loops.push(function(){cancelAnimationFrame(raf)});
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'||t==='move')tgt={x:p.x,y:p.y};
      if(t==='up')tgt=null;
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','稻田的畫面，按 Enter 割完一整行');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();for(var r=0;r<RO;r++){var row=cells.slice(r*CO,r*CO+CO);if(row.some(function(o){return !o.cut})){for(var c=0;c<CO;c++)cutAt(X0+c*CW+5,Y0+r*CH+5);pos={x:X0+CO*CW-10,y:Y0+r*CH+CH/2};break}}progress()}});
    later(function(){if(!cut&&!done)say(msg,'手指按住<b>田裡</b>不要放開，割稻機就會跟著開過去。像塗顏色一樣，一行一行來回開。')},7000);
  },

  /* 第 4 關：抓著稻子用力往下甩，打在摔桶上 */
  slam:function(area,i,l){
    var n=0,N=6,done=false,held=false,hx=160,hy=40,off=0,armed=true,hist=[],parts=[],raf=0,last=performance.now(),shake=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EEF0E6"><rect x="-400" y="168" width="1200" height="100" fill="#C2AA72"/>'+
            '<g id="tb"><ellipse id="gr" cx="160" cy="124" rx="4" ry="3" fill="'+GOLD+'"/><path d="M92 122H228L214 178H106Z" fill="#A8774A" stroke="#6E4A2A" stroke-width="1.4"/><path d="M98 140H222M102 158H218" stroke="#6E4A2A" stroke-width="2.4"/><path d="M92 122H228" stroke="#6E4A2A" stroke-width="4" stroke-linecap="round"/>'+
      '<text x="160" y="153" font-size="16" font-weight="700" fill="#FFF8EC" text-anchor="middle">摔桶</text></g><g id="bd"></g><g id="pt"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),bd=svg.querySelector('#bd'),pt=svg.querySelector('#pt'),tb=svg.querySelector('#tb'),gr=svg.querySelector('#gr');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function bundle(){var h='',left=1-n/N;
      for(var k=-3;k<=3;k++){var x=hx+k*4;h+='<path d="M'+f1(x)+' '+f1(hy-24)+'L'+f1(x+k*2)+' '+f1(hy+22)+'" stroke="#C9B060" stroke-width="2"/>'}
      h+='<rect x="'+f1(hx-12)+'" y="'+f1(hy-8)+'" width="24" height="7" rx="3" fill="#8A6A3A"/>';
      for(k=-3;k<=3;k++){if(Math.abs(k)>left*3.5+.5)continue;h+=ear(hx+k*6,hy+20,Math.PI+k*.12,.9,true)}
      return h+'<circle cx="'+f1(hx)+'" cy="'+f1(hy-4)+'" r="7" fill="#F1C9A5" stroke="#C8946A" stroke-width="1"/>'}
    function hit(){
      armed=false;n++;bar.style.width=(n/N*100)+'%';shake=.25;
      for(var k=0;k<14;k++)parts.push({x:hx+(Math.random()-.5)*30,y:124,vx:(Math.random()-.5)*120,vy:-80-Math.random()*90});
      gr.setAttribute('rx',f1(6+n*8));gr.setAttribute('ry',f1(3+n*1.2));
      if(n>=N){done=true;held=false;say(msg,'打完了！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},1100)}
      else say(msg,['打中了！稻穀掉進桶子裡。再<b>舉高</b>，用力甩下來！','好！再一次！','一半了！','手上的稻穀越來越少了。','最後一次！'][n-1]);
    }
    (function loop(now){var dt=Math.min(50,now-last)/1000;last=now;
      if(!held&&!done&&hy>40)hy=Math.max(40,hy-160*dt);
      if(done&&hy>40)hy=Math.max(40,hy-160*dt);
      parts=parts.filter(function(p){p.vy+=400*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;return p.y<126||p.vy<0});
      pt.innerHTML=parts.map(function(p){return '<ellipse cx="'+f1(p.x)+'" cy="'+f1(p.y)+'" rx="2.4" ry="1.4" fill="'+GOLD+'"/>'}).join('');
      if(shake>0){shake-=dt;tb.setAttribute('transform','translate('+f1(Math.sin(now/20)*2*shake/.25)+' 0)')}else tb.removeAttribute('transform');
      bd.innerHTML=bundle();raf=requestAnimationFrame(loop)})(last);
    loops.push(function(){cancelAnimationFrame(raf)});
    drag(svg,function(t,p,e){
      if(done)return;
      if(t==='down'){if(Math.abs(p.x-hx)<34&&p.y>hy-34&&p.y<hy+70){held=true;off=p.y-hy;hist=[{y:hy,t:performance.now()}]}else say(msg,'要按住上面那把<b>稻子</b>，再往下甩。',1);return}
      if(!held)return;
      if(t==='move'){var ny=Math.max(24,Math.min(82,p.y-off)),now=performance.now();hx=Math.max(124,Math.min(196,p.x));hy=ny;hist.push({y:hy,t:now});hist=hist.filter(function(h){return now-h.t<120});
        if(hy<46&&!armed)armed=true;
        if(armed&&hy+58>=118){var h0=hist[0],v=(hy-h0.y)/Math.max(.016,(now-h0.t)/1000);
          if(v>260)hit();else{armed=false;say(msg,'太慢了，稻穀打不下來。<b>舉高</b>一點，<b>快快地</b>往下甩！',1)}}
        return}
      if(t==='up'){held=false;if(!armed&&!done&&n<N)armed=true}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','摔桶的畫面，按 Enter 把稻子摔在桶子上一次');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();hit()}});
    later(function(){if(!n&&!done)say(msg,'手指按住上面那把<b>稻子</b>，<b>很快地</b>往下拉，讓稻穗打在桶子的邊上。')},8000);
  },

  /* 第 5 關：用穀耙把一堆穀子推開、推平，曬乾 */
  rake:function(area,i,l){
    var CO=10,RO=4,X0=20,Y0=50,W=28,H=26,a=[],w=[],done=false,raf=0,last=performance.now(),prev=-1,pt=null,held=false,said=0,R=[],M=[];
    for(var k=0;k<CO*RO;k++){a[k]=0;w[k]=1}
    [[3,1],[4,1],[5,1],[6,1],[3,2],[4,2],[5,2],[6,2]].forEach(function(c){a[c[1]*CO+c[0]]=5});
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F2ECDD"><rect x="-400" y="162" width="1200" height="100" fill="#CBB991"/>'+
      '<circle cx="290" cy="24" r="13" fill="#F7D35A"/><path d="M290 4V0M290 48V44M270 24H266M314 24H310" stroke="#F7D35A" stroke-width="2.4" stroke-linecap="round"/>'+
      '<rect x="'+(X0-6)+'" y="'+(Y0-6)+'" width="'+(CO*W+12)+'" height="'+(RO*H+12)+'" rx="4" fill="#DCD3C2" stroke="#BFB39C" stroke-width="1.2"/><g id="gc"></g><g id="mo"></g><g id="rk"></g>'+
      '<text x="160" y="184" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#CBB991" stroke-width="4" paint-order="stroke">稻埕（曬穀場）</text><text id="dt" x="20" y="34" font-size="14" font-weight="700" fill="#6C2024"></text></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),gc=svg.querySelector('#gc'),mo=svg.querySelector('#mo'),rk=svg.querySelector('#rk'),dtx=svg.querySelector('#dt');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    for(k=0;k<CO*RO;k++){var c=k%CO,r=Math.floor(k/CO),e=document.createElementNS(NS,'rect');e.setAttribute('x',X0+c*W+1);e.setAttribute('y',Y0+r*H+1);e.setAttribute('width',W-2);e.setAttribute('height',H-2);e.setAttribute('rx','4');gc.appendChild(e);R.push(e);
      var m=document.createElementNS(NS,'ellipse');m.setAttribute('cx',X0+c*W+W/2);m.setAttribute('cy',Y0+r*H+H/2);mo.appendChild(m);M.push(m)}
    function col(q){var A=[150,118,46],B=[236,198,92];return 'rgb('+A.map(function(v,j){return Math.round(v+(B[j]-v)*q)}).join(',')+')'}
    function cellAt(p){var c=Math.floor((p.x-X0)/W),r=Math.floor((p.y-Y0)/H);if(c<0||c>=CO||r<0||r>=RO)return -1;return r*CO+c}
    function stats(){var ok=0,mx=0,sa=0,sw=0,ex=0;for(var k=0;k<CO*RO;k++){if(a[k]>=.3)ok++;mx=Math.max(mx,a[k]);ex+=Math.max(0,a[k]-1.9);sa+=a[k];sw+=a[k]*w[k]}return {ok:ok,mx:mx,ex:ex,wet:sw/sa}}
    (function loop(now){var dt=Math.min(60,now-last)/1000;last=now;
      for(var k=0;k<CO*RO;k++){if(a[k]>.05)w[k]=Math.max(0,w[k]-dt*(a[k]<=1.7?.085:.01));
        R[k].setAttribute('fill',col(1-w[k]));R[k].setAttribute('opacity',f1(a[k]<.05?0:Math.min(1,.3+a[k]*.7)));
        var big=a[k]>1.7;M[k].setAttribute('rx',f1(big?Math.min(16,6+a[k]*1.1):0));M[k].setAttribute('ry',f1(big?Math.min(12,4+a[k]*.8):0));M[k].setAttribute('fill',col((1-w[k])*.7))}
      if(!done){var S=stats(),sp=S.ok>=32&&S.mx<=1.9,sf=sp?1:Math.min(.98,.5*Math.min(1,S.ok/32)+.5*(1-S.ex/24.8)),df=Math.max(0,Math.min(1,(1-S.wet)/.88));
        bar.style.width=f1((sf*.5+(sp?df:0)*.5)*100)+'%';
        dtx.textContent=S.wet>.6?'穀子：濕濕的':S.wet>.3?'穀子：快乾了':'穀子：乾乾的';
        if(sp&&!said){said=1;say(msg,'推平了！太陽會把<b>薄薄的</b>穀子曬乾。也可以再耙一耙，幫穀子<b>翻面</b>。')}
        if(!sp&&said===0&&S.mx>1.9&&S.ok>=26){said=-1;say(msg,'還有幾個地方堆得<b>厚厚的</b>，把它推開。',1)}
        if(sp&&S.wet<.12){done=true;rk.innerHTML='';say(msg,'穀子乾了，變得亮亮的！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},1100)}}
      raf=requestAnimationFrame(loop)})(last);
    loops.push(function(){cancelAnimationFrame(raf)});
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){held=true;prev=cellAt(p)}
      if(t==='up'){held=false;rk.innerHTML='';prev=-1;return}
      if(t==='hover')return;
      rk.innerHTML=rakeArt(p.x,p.y+4,1.1);
      var cur=cellAt(p);
      if(cur>=0){w[cur]=Math.max(0,w[cur]-.012);
        if(prev>=0&&cur!==prev&&a[prev]>a[cur]){var d=(a[prev]-a[cur])*.5;a[prev]-=d;a[cur]+=d;w[prev]=Math.max(0,w[prev]-.03)}}
      prev=cur;
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','曬穀的畫面，按 Enter 把穀子推平');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();for(var k=0;k<CO*RO;k++){a[k]=1;w[k]=Math.min(w[k],.1)}}});
    later(function(){if(!said&&!done)say(msg,'手指按在中間那堆<b>穀子</b>上，往外<b>拖出去</b>，穀子就會被推開。往不同方向推，推到整片平平的。')},7000);
  },

  /* 第 6 關：在稻穀上來回搓，搓掉粗糠、磨掉米糠 */
  rub:function(area,i,l){
    var G=[{x:80},{x:160},{x:240}],Y=92,NEED=400,n=0,done=false,cur=null,lp=null,acc=0,parts=[],raf=0,last=performance.now(),NAME=['稻穀','糙米','白米'];
    G.forEach(function(g){g.p=0;g.st=0});
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F3EEE4"><rect x="-400" y="152" width="1200" height="120" fill="#C9A774"/><g id="gr"></g><g id="pt"></g><g id="lb"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),grG=svg.querySelector('#gr'),ptG=svg.querySelector('#pt'),lb=svg.querySelector('#lb');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function paintG(){grG.innerHTML=G.map(function(g){var q=g.st<2?g.p/NEED:0,wob=cur===g?Math.sin(performance.now()/30)*1.5:0;
        return grain(g.x+wob,Y,2.6,g.st)+(q>0?'<circle cx="'+g.x+'" cy="'+Y+'" r="50" fill="none" stroke="#EADFD3" stroke-width="3"/><path d="M'+g.x+' '+(Y-50)+'A50 50 0 '+(q>.5?1:0)+' 1 '+f1(g.x+Math.sin(q*6.283)*50)+' '+f1(Y-Math.cos(q*6.283)*50)+'" stroke="#DB2E27" stroke-width="3" fill="none"/>':'')}).join('');
      lb.innerHTML=G.map(function(g){return '<text x="'+g.x+'" y="172" font-size="16" font-weight="700" fill="'+(g.st===2?'#3F6B2E':'#6C2024')+'" text-anchor="middle" stroke="#C9A774" stroke-width="4" paint-order="stroke">'+NAME[g.st]+'</text>'}).join('')}
    function prog(){var t=0;G.forEach(function(g){t+=g.st*NEED+(g.st<2?g.p:0)});bar.style.width=f1(t/(G.length*2*NEED)*100)+'%'}
    function adv(g){
      g.st++;g.p=0;
      if(g.st===1)say(msg,'粗糠搓掉了！裡面是褐色的<b>糙米</b>。再搓，把外面的<b>米糠</b>磨掉。');
      else{n++;if(n>=N()){done=true;cur=null;say(msg,'3 粒都是白米了！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},1100)}
        else say(msg,'變成白白的<b>白米</b>了！還有 '+(N()-n)+' 粒。')}
      prog();
    }
    function N(){return G.length}
    (function loop(now){var dt=Math.min(50,now-last)/1000;last=now;
      parts=parts.filter(function(p){p.vy+=260*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*2;return p.y<154});
      ptG.innerHTML=parts.map(function(p){return p.k?'<circle cx="'+f1(p.x)+'" cy="'+f1(p.y)+'" r="1.6" fill="#C8A878"/>':'<path d="M'+f1(p.x)+' '+f1(p.y)+'l5 '+f1(Math.sin(p.r)*3)+'" stroke="#C99A2E" stroke-width="2" stroke-linecap="round"/>'}).join('');
      paintG();raf=requestAnimationFrame(loop)})(last);
    loops.push(function(){cancelAnimationFrame(raf)});
    function hitG(p){var r=null;G.forEach(function(g){if(g.st<2&&Math.abs(p.x-g.x)<36&&Math.abs(p.y-Y)<54)r=g});return r}
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){cur=hitG(p);lp=p;if(!cur)say(msg,G.every(function(g){return g.st===2})?'':'要按在<b>稻穀</b>上，再來回搓。',1);return}
      if(t==='up'){cur=null;return}
      if(t!=='move'||!cur)return;
      if(hitG(p)!==cur){lp=p;return}
      var d=Math.hypot(p.x-lp.x,p.y-lp.y);lp=p;cur.p+=d;acc+=d;
      if(acc>14){acc=0;parts.push({x:cur.x+(Math.random()-.5)*30,y:Y+(Math.random()-.5)*50,vx:(Math.random()-.5)*80,vy:-30,r:Math.random()*3,k:cur.st})}
      if(cur.p>=NEED){var g=cur;adv(g);if(g.st===2)cur=null}
      prog();
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','碾米的畫面，按 Enter 搓掉一層');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var g=G.filter(function(o){return o.st<2})[0];if(g)adv(g)}});
    later(function(){if(!n&&!done&&G[0].st+G[1].st+G[2].st===0)say(msg,'手指按住一粒<b>稻穀</b>，在上面<b>左右來回</b>一直搓，紅色的圈圈轉滿就會掉一層。')},7000);
  }
};
</script>
