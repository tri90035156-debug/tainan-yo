<h1>大白柚任務・水果・麻豆大白柚</h1>
<p>跟著<b>麻豆</b>種柚子的阿姨，從冬天到秋天：拖著剪刀<b>修剪</b>樹枝、跟著香味找<b>柚子花</b>、替柚子套<b>紙袋</b>、讓土裡的水不要忽多忽少，<b>霜降</b>時扶著柚子剪兩次，最後剝開厚厚的皮。</p>
<p>地點：麻豆（臺南市麻豆區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>秋天，市場上會出現一種好大好大的柚子，一顆有 1 到 2 公斤多，捧在手上沉沉的。它是麻豆白柚，大家也叫它大白柚。大白柚是從臺南的麻豆來的。麻豆很久以前靠著一片海，叫倒風內海，是一個港口；後來泥沙把海填平，變成平原，現在種滿了柚子。跟著麻豆種柚子的阿姨，從冬天到秋天，看大白柚怎麼長大。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・麻口里的柚子園（12 月底）：冬天，幫柚子樹剪頭髮</h3><p>傳說兩百年前，麻豆的麻口里有一位農民種了一棵柚子苗。長大以後，結的柚子跟別的白柚不一樣。大家從這棵樹分苗出去種，越種越多。冬天，阿姨要幫柚子樹修剪：剪掉沒有用的樹枝，讓陽光和風照得進來。</p><p>為什麼？為什麼要等到 12 月底才剪？ 太早剪，樹在冬天就會冒出新芽，春天開的花反而變少。柚子樹冬天要冷冷的、乾乾的，才會準備開花，所以阿姨等到 12 月底以後才剪。</p></li>
<li><h3>第 2 關・柚子園（3 月）：跟著香味找花</h3><p>立春（2 月 4 日左右）前後，阿姨幫果園灌水。柚子樹醒過來了：舊葉子掉了好多，換上新葉子，也冒出一串一串的花苞。3 月，白色的小花開了，有 4 片花瓣。開車經過麻豆，就聞得到柚子花的香味！</p><p>為什麼？花那麼多，為什麼柚子沒那麼多？ 開花以後到 5 月底，花和小柚子會自己掉兩次，最後只留下一小部分，慢慢長成大柚子。</p></li>
<li><h3>第 3 關・柚子園（6 到 7 月）：幫柚子穿紙衣</h3><p>小柚子越長越大。阿姨先把太多、長歪和太小的柚子摘掉（這叫疏果），不然柚子太多，樹枝會被壓斷。接著要套袋：替每一顆柚子套上紙袋。看！有果實蠅在柚子旁邊飛來飛去。</p><p>為什麼？為什麼要套紙袋？ 紙袋可以擋住果實蠅，牠會害柚子受傷、流出黏黏的膠；也可以讓柚子不被太陽曬傷，皮的顏色也比較漂亮。</p></li>
<li><h3>第 4 關・柚子園（7 到 9 月）：水不能忽多忽少</h3><p>夏天，柚子長得最快，需要很多水。可是土裡的水一下太乾、一下太濕，柚子就容易裂開。阿姨常常看土裡的水，太乾了就澆一點。小心，夏天常常會突然下大雨⋯⋯</p><p>為什麼？為什麼柚子會裂開？ 土裡的水一下很乾、一下很濕，柚子就容易裂開。所以阿姨夏天會常常看土，平均地給水，不要一次給太多。</p></li>
<li><h3>第 5 關・霜降，採柚子（10 月下旬）：扶著柚子，剪兩次</h3><p>柚子從開花到熟，大約要 28 到 30 個星期，差不多 7 個月。麻豆的柚農習慣在霜降（10 月 23 日左右）前後採柚子。要等天晴、露水乾了才採。大白柚很重，不能用拉的：一手扶著，一手用採果剪剪，而且要剪兩次。</p><p>為什麼？什麼是霜降？ 霜降是一年二十四節氣裡的一個，在 10 月 23 日左右，意思是天氣變冷、開始會下霜。麻豆的柚農從以前就看節氣，在霜降前後採大白柚。</p></li>
<li><h3>第 6 關・阿姨家：剝開大白柚</h3><p>大白柚的皮好厚，有 1 到 2 公分多！阿姨先用刀在皮上劃了幾刀，請你把皮剝開。剝開以後，裡面有 12 到 16 瓣白白的果肉，酸酸甜甜、水水的。</p><p>為什麼？為什麼大白柚可以放很久？ 大白柚很耐放：放在陰涼、通風的地方，可以放 1 到 2 個月。霜降採的柚子，可以一直吃到冬天。</p></li>
</ol>

<script>

/* ---------- 插畫元件 ---------- */
var K='#2A2020',NS='http://www.w3.org/2000/svg';
var YOUNGP='#C9D77A',RIPEP='#F0DC72',PITH='#FBF7EA',LEAFC='#4E8A3A',LEAFD='#3C6E2C';
function f1(v){return (Math.round(v*10)/10).toString()}
function rnd(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280}}
// 大白柚（扁扁圓圓的）。(x,y) 是中間；o：c 皮的顏色、stem 果梗長度、crack 裂開
function pom(x,y,s,o){
  o=o||{};var c=o.c||RIPEP,h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+s+')">';
  if(o.stem)h+='<path d="M0 -14V'+f1(-15-o.stem)+'" stroke="#6E7A3A" stroke-width="2.4" stroke-linecap="round"/>';
  h+='<ellipse rx="18" ry="15.5" fill="'+c+'" stroke="#B7A24A" stroke-width=".8"/>';
  var r=rnd(o.seed||7);for(var k=0;k<14;k++){var a=r()*6.28,rr=Math.sqrt(r());h+='<circle cx="'+f1(Math.cos(a)*rr*14)+'" cy="'+f1(Math.sin(a)*rr*12)+'" r=".55" fill="#B7A24A" opacity=".55"/>'}
  h+='<path d="M-2 -15Q0 -17 2 -15" stroke="#7A8A3A" stroke-width="1.6" fill="none"/><path d="M-11 -6Q-13 0 -10 6" stroke="#fff" stroke-opacity=".5" stroke-width="2" fill="none" stroke-linecap="round"/>';
  if(o.crack)h+='<path d="M2 -10L-2 -4L3 1L-1 7L2 12" stroke="#7A5A20" stroke-width="1.6" fill="none" stroke-linejoin="round"/><path d="M2 -10L-2 -4L3 1L-1 7L2 12" stroke="#F7F1DC" stroke-width=".7" fill="none"/>';
  return h+'</g>';
}
// 切開的大白柚：厚厚的白皮、一瓣一瓣白色的果肉
function pomCut(x,y,s,seg){
  var n=seg||14,h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+s+')"><circle r="18" fill="'+RIPEP+'" stroke="#B7A24A" stroke-width=".8"/><circle r="15.6" fill="'+PITH+'"/><circle r="11" fill="#F4EEDB" stroke="#E2D7BA" stroke-width=".6"/>';
  for(var k=0;k<n;k++){var a=k/n*6.283;h+='<path d="M0 0L'+f1(Math.cos(a)*11)+' '+f1(Math.sin(a)*11)+'" stroke="#E2D7BA" stroke-width=".6"/>'}
  for(k=0;k<5;k++){var b=k*1.3+.4;h+='<ellipse cx="'+f1(Math.cos(b)*4)+'" cy="'+f1(Math.sin(b)*4)+'" rx="1" ry=".6" fill="#E8DCB0" transform="rotate('+f1(b*57)+' '+f1(Math.cos(b)*4)+' '+f1(Math.sin(b)*4)+')"/>'}
  return h+'<circle r="1.6" fill="#EDE4C6"/></g>';
}
// 柚子樹（地圖上的小樹）。mode：flower 開花、fruit 結果、bag 套袋
function ptree(x,y,s,mode){
  var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+(s||1)+')"><path d="M-2.5 0L-2 -12H2L2.5 0Z" fill="#7A5A3A"/><ellipse cy="-22" rx="17" ry="13" fill="'+LEAFD+'"/><ellipse cx="-4" cy="-25" rx="11" ry="8" fill="'+LEAFC+'"/>';
  if(mode==='flower')[[-9,-22],[-2,-31],[7,-27],[11,-17],[-4,-15],[3,-21]].forEach(function(p){h+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.2" fill="#fff"/>'});
  if(mode==='fruit')[[-8,-12],[7,-11],[0,-21]].forEach(function(p){h+=pom(p[0],p[1],.26,{})});
  if(mode==='bag')[[-8,-11],[7,-10],[0,-20]].forEach(function(p){h+='<path d="M'+(p[0]-4)+' '+(p[1]-5)+'H'+(p[0]+4)+'L'+(p[0]+5)+' '+(p[1]+5)+'H'+(p[0]-5)+'Z" fill="#E8D8B4" stroke="#B89A6A" stroke-width=".6"/>'});
  return h+'</g>';
}
// 柚子花（白色、4 片花瓣、黃色的花蕊）
function pflower(x,y,s){
  var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+(s||1)+')">';
  for(var k=0;k<4;k++)h+='<ellipse cy="-3.4" rx="2.3" ry="3.6" fill="#fff" stroke="#D8D3C4" stroke-width=".4" transform="rotate('+(k*90+45)+')"/>';
  for(k=0;k<8;k++)h+='<circle cx="'+f1(Math.cos(k*.785)*1.5)+'" cy="'+f1(Math.sin(k*.785)*1.5)+'" r=".55" fill="#E8B830"/>';
  return h+'<circle r=".9" fill="#B9C66A"/></g>';
}
function pbud(x,y,s){return '<ellipse cx="'+f1(x)+'" cy="'+f1(y)+'" rx="'+f1(1.6*s)+'" ry="'+f1(2.4*s)+'" fill="#F4F1E4" stroke="#C9C2AE" stroke-width=".4"/>'}
// 果實蠅
function fly(x,y,s){
  return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+(s||1)+')"><ellipse cx="-1" cy="-2.6" rx="2.6" ry="1.4" fill="#fff" fill-opacity=".8" stroke="#9AA" stroke-width=".3" transform="rotate(-30 -1 -2.6)"/><ellipse cx="1.4" cy="-2.6" rx="2.6" ry="1.4" fill="#fff" fill-opacity=".8" stroke="#9AA" stroke-width=".3" transform="rotate(30 1.4 -2.6)"/>'+
    '<ellipse rx="3" ry="1.7" fill="#C8902E"/><path d="M-.6 -1.5V1.5M.8 -1.5V1.5" stroke="#5A3A10" stroke-width=".6"/><circle cx="-3" r="1.3" fill="#7A3A20"/></g>';
}
// 紙袋（套在柚子外面）
function pbag(x,y,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+(s||1)+')"><path d="M-14 -22H14L21 20H-21Z" fill="#E8D8B4" stroke="#B89A6A" stroke-width="1"/><path d="M-10 -22H10" stroke="#8A6A3A" stroke-width="3" stroke-linecap="round"/><path d="M-16 0H16M-18 10H18" stroke="#D6C29A" stroke-width=".8"/></g>'}
var ICON={
  scissors:'<circle cx="-5" cy="6.4" r="3.4" fill="none" stroke="#fff" stroke-width="2"/><circle cx="5" cy="6.4" r="3.4" fill="none" stroke="#fff" stroke-width="2"/><path d="M-3 3.4L6 -10M3 3.4L-6 -10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>',

  slice:'<circle r="9.6" fill="none" stroke="#fff" stroke-width="2.2"/><circle r="5.4" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M0 -5.4V5.4M-5.4 0H5.4M-3.8 -3.8L3.8 3.8M3.8 -3.8L-3.8 3.8" stroke="#fff" stroke-width="1.2"/>'
};

function near(x,y,w,hh){return STOPS.some(function(s){return Math.abs(s.x-x)<w&&Math.abs(s.y-y)<hh})}
function decorate(){
  var r=rnd(31),t='',q='';
  for(var x=10;x<820;x+=40)for(var y=-40;y<600;y+=34){
    var cx=x+(r()-.5)*10,cy=y+(r()-.5)*8;
    if(near(cx,cy,54,56))continue;
    if(cy>548)continue; // 曾文溪
    if(Math.abs(cx-180)<44&&Math.abs(cy-322)<24)continue; // 麻豆
    if(Math.abs(cx-590)<60&&Math.abs(cy-462)<44)continue; // 總爺
    if(Math.abs(cx-210)<28&&Math.abs(cy-456)<28)continue;
    if(cy>514&&Math.abs(cx-420)<120)continue; // 季節的字
    if(r()<.2)continue;
    t+='<g transform="translate('+f1(cx)+' '+f1(cy)+')"><ellipse rx="14" ry="11" fill="'+LEAFD+'"/><ellipse cx="-3" cy="-3" rx="9" ry="6" fill="'+LEAFC+'"/></g>';
    q+='<g transform="translate('+f1(cx)+' '+f1(cy)+')"><circle cx="-5" cy="3" r="3.2" fill="#E8DC7A" stroke="#8A7A30" stroke-width=".5"/><circle cx="5" cy="1" r="3.2" fill="#E8DC7A" stroke="#8A7A30" stroke-width=".5"/></g>';
  }
  map.querySelector('#trees').innerHTML=t;
  map.querySelector('#frNow').innerHTML=q;
}

    }
    drag(svg,function(t,p){
      if(done)return;var dx=p.x-C.x,dy=p.y-C.y,d=Math.hypot(dx,dy);
      if(t==='down'){held=-1;if(d<R+6){var a=Math.atan2(dy,dx)*57.3,k=((Math.round((a+90)/90)%4)+4)%4;if(!open[k]){held=k;d0=d}}if(held<0&&d>=R+6)say(msg,'要按住<b>柚子皮</b>，再往外拉。',1);return}
      if(held<0)return;
      if(t==='move'){var off=Math.max(0,d-d0);setP(held,Math.min(30,off));if(off>26){var k2=held;held=-1;openP(k2)}return}
      if(t==='up'){var k3=held;held=-1;if(!open[k3]){setP(k3,0);say(msg,'再<b>往外</b>拉多一點，皮才會打開。',1)}}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','剝柚子的畫面，按 Enter 拉開一片柚子皮');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var k=open.indexOf(0);if(k>=0)openP(k)}});
    later(function(){if(!n&&!done)say(msg,'手指按在<b>柚子皮</b>上，順著紅色的虛線<b>往外</b>拉。')},8000);
    hint();
  }
};
