<script>

/* ---------- 插畫元件 ---------- */
var K='#2A2020',NS='http://www.w3.org/2000/svg';
var BRICK='#B8573E',BRICKD='#8A3A2A',SAND='#EBD9A8',SEA='#7FB8D0';
function f1(v){return (Math.round(v*10)/10).toString()}
function rnd(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280}}
// 一段紅磚牆（磚塊上下錯開）
function bricks(x,y,w,h,c){var s='<rect x="'+f1(x)+'" y="'+f1(y)+'" width="'+f1(w)+'" height="'+f1(h)+'" fill="'+(c||BRICK)+'"/>';for(var r=0;r*6<h;r++){s+='<path d="M'+f1(x)+' '+f1(y+r*6)+'H'+f1(x+w)+'" stroke="#E8C8A8" stroke-width=".6"/>';for(var q=(r%2)*6;q<w;q+=12)s+='<path d="M'+f1(x+q)+' '+f1(y+r*6)+'v6" stroke="#E8C8A8" stroke-width=".6"/>'}return s}
// 今天的安平古堡：白色城牆和紅頂瞭望台
function fortNow(x,y,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s)+')"><path d="M-40 10H40V24H-40Z" fill="#F4EFE6" stroke="#B8A890" stroke-width="1"/><path d="M-40 10V6H-34V10M-28 10V6H-22V10M-16 10V6H-10V10M-4 10V6H2V10M8 10V6H14V10M20 10V6H26V10M32 10V6H38V10" fill="#F4EFE6" stroke="#B8A890" stroke-width=".8"/><rect x="-8" y="-18" width="16" height="28" fill="#F4EFE6" stroke="#B8A890" stroke-width="1"/><rect x="-3" y="-10" width="6" height="8" fill="#8AA6B8"/><path d="M-11 -18L0 -34L11 -18Z" fill="#C8483A" stroke="#8A2A20" stroke-width="1"/></g>'}
// 荷蘭時代的熱蘭遮城（俯看，四個角有突出的稜堡）
function fortOld(x,y,s){var b=function(cx,cy){return '<path d="M'+(cx-9)+' '+cy+'L'+cx+' '+(cy-9)+'L'+(cx+9)+' '+cy+'L'+cx+' '+(cy+9)+'Z" fill="'+BRICK+'" stroke="'+BRICKD+'" stroke-width="1"/>'};
  return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s)+')"><rect x="-24" y="-18" width="48" height="36" fill="#D8A888" stroke="'+BRICKD+'" stroke-width="3"/>'+b(-24,-18)+b(24,-18)+b(-24,18)+b(24,18)+'<rect x="-8" y="-8" width="16" height="12" fill="#F3E6CC" stroke="'+BRICKD+'" stroke-width="1"/><path d="M0 -8V-20" stroke="#5A3E2B" stroke-width="1"/><path d="M0 -20H8V-16H0Z" fill="#F07A3A"/></g>'}
// 劍獅（門楣上的獅頭咬著一把劍）；k 換不同樣子
function jianshi(x,y,s,k,sil){var c=sil?'#5A4E48':'#E8A030',d=sil?'#5A4E48':'#8A4A1A';
  var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s)+')">';
  h+=k===1?'<path d="M-12 -2Q-14 -14 0 -14Q14 -14 12 -2Q14 10 0 12Q-14 10 -12 -2Z" fill="'+c+'"/>':k===2?'<path d="M-13 -12H13V8Q13 12 9 12H-9Q-13 12 -13 8Z" fill="'+c+'"/>':k===3?'<circle r="13" fill="'+c+'"/><path d="M-13 -6L-17 -12L-9 -10M13 -6L17 -12L9 -10" fill="'+c+'"/>':'<path d="M0 -15L13 -5L9 12H-9L-13 -5Z" fill="'+c+'"/>';
  if(!sil)h+='<circle cx="-5" cy="-4" r="2.2" fill="#2A2020"/><circle cx="5" cy="-4" r="2.2" fill="#2A2020"/><path d="M-3 2Q0 4 3 2" stroke="'+d+'" stroke-width="1.2" fill="none"/>';
  h+='<path d="'+(k===2||k===4?'M-20 6L20 2':'M-20 2L20 6')+'" stroke="'+(sil?'#5A4E48':'#9AA6B0')+'" stroke-width="3" stroke-linecap="round"/>';
  if(!sil)h+='<path d="M-20 2L-22 0M-20 2L-22 4" stroke="#5A3E2B" stroke-width="1.4"/>';
  return h+'</g>'}
var ICON={
  frame:'<path d="M-10 -8H10V8H-10Z" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 2"/><path d="M-12 -10l4 0l-4 4zM12 10l-4 0l4 -4z" fill="#fff"/>',
  bucket:'<path d="M-8 -6H8L6 9H-6Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M-8 -6Q0 -14 8 -6" stroke="#fff" stroke-width="1.6" fill="none"/><circle cx="-2" cy="2" r="1.6" fill="#fff"/><circle cx="3" cy="4" r="1.6" fill="#fff"/>',
  crate:'<rect x="-9" y="-8" width="18" height="16" fill="none" stroke="#fff" stroke-width="2"/><path d="M-9 -8L9 8M9 -8L-9 8" stroke="#fff" stroke-width="1.4"/>',
  brick:'<rect x="-10" y="-7" width="9" height="6" fill="#fff"/><rect x="1" y="-7" width="9" height="6" fill="#fff"/><rect x="-5" y="1" width="10" height="6" fill="#fff"/>',
  root:'<path d="M0 -10V-2M0 -2Q-6 2 -8 10M0 -2Q2 4 0 10M0 -2Q6 2 8 9" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M-6 -12Q0 -16 6 -12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>',
  lion:'<circle r="8" fill="none" stroke="#fff" stroke-width="2"/><circle cx="-3" cy="-2" r="1.4" fill="#fff"/><circle cx="3" cy="-2" r="1.4" fill="#fff"/><path d="M-11 4L11 1" stroke="#fff" stroke-width="2" stroke-linecap="round"/>'
};
function icon(k){return '<svg viewBox="-12 -12 24 24" aria-hidden="true">'+ICON[k]+'</svg>'}

function idCard(t1,t2,art,C){
  var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EAF2F4" role="img" aria-label="'+t1+'的樣子"><rect x="-400" y="170" width="1200" height="60" fill="#D8CDB4"/>'+art;
  C.forEach(function(c){s+='<path d="M'+c[3]+' '+c[4]+'L'+c[1]+' '+(c[2]-5)+'" stroke="#8A7A70" stroke-width="1.2"/><circle cx="'+c[3]+'" cy="'+c[4]+'" r="2.6" fill="#DB2E27"/>'+
    '<text x="'+c[1]+'" y="'+c[2]+'" font-size="15" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#EAF2F4" stroke-width="4" paint-order="stroke">'+c[0]+'</text>'});
  return s+'<text x="160" y="30" font-size="24" font-weight="900" fill="#2A2020" text-anchor="middle" font-family="Noto Serif TC,Songti TC,serif" stroke="#EAF2F4" stroke-width="4" paint-order="stroke">'+t1+'</text>'+(t2?'<text x="160" y="188" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle">'+t2+'</text>':'')+'</svg>';
}

/* ---------- 地圖 ---------- */
// 示意圖：安平古堡和旁邊。「以前」是荷蘭時代，古堡蓋在海邊的沙洲上（大員），東邊是台江內海；「今天」海變成陸地和街道
var STOPS=[{lv:1,n:'沙洲上的城',x:420,y:250,k:'none'},{lv:2,n:'調灰漿',x:230,y:300,k:'bucket'},{lv:3,n:'城裡的倉庫',x:470,y:170,k:'crate'},{lv:4,n:'拆磚',x:560,y:300,k:'brick'},{lv:5,n:'南牆和老榕樹',x:380,y:360,k:'wall'},{lv:6,n:'劍獅埕',x:200,y:180,k:'lion'}];
function marker(s){
  var t='<g transform="translate('+s.x+' '+s.y+')">';
  if(s.k==='none')return t+'</g>';
  if(s.k==='bucket')return t+'<path d="M-12 -8H12L9 12H-9Z" fill="#9AA6B0" stroke="#5E676C" stroke-width="1.2"/><ellipse cy="-8" rx="12" ry="3" fill="#E8DCC0"/></g>';
  if(s.k==='crate')return t+'<rect x="-14" y="-10" width="20" height="18" fill="#C8A060" stroke="#7A5530" stroke-width="1.2"/><rect x="2" y="-4" width="16" height="14" fill="#B88A50" stroke="#7A5530" stroke-width="1.2"/><path d="M-14 -10L6 8M6 -10L-14 8" stroke="#7A5530" stroke-width="1"/></g>';
  if(s.k==='brick')return t+'<path d="M-18 4H18V12H-18Z" fill="#8A6A3A"/><circle cx="-12" cy="14" r="5" fill="#5A3E2B"/><circle cx="12" cy="14" r="5" fill="#5A3E2B"/>'+bricks(-14,-8,28,12)+'</g>';
  if(s.k==='wall')return t+bricks(-26,-10,52,24)+'<path d="M-20 -10Q-24 0 -18 14M-8 -10Q-12 2 -6 14M6 -10Q2 0 8 14" stroke="#6E5A3A" stroke-width="2.4" fill="none"/><ellipse cx="-6" cy="-18" rx="24" ry="12" fill="#4E8A3A"/></g>';
  return t+'<rect x="-22" y="-16" width="44" height="30" fill="#F3E2C8" stroke="#8A6A3A" stroke-width="1.2"/>'+jianshi(0,-2,.8,1)+'</g>';
}
function buildMap(){
  var h='<rect x="-400" y="-300" width="1600" height="1200" fill="#E6DCC4"/>';
  h+='<g id="past"><rect x="-400" y="-300" width="1600" height="1200" fill="'+SEA+'"/><path d="M60 120Q200 80 420 110Q620 140 700 260Q720 380 600 420Q400 460 200 420Q60 380 40 260Q30 160 60 120Z" fill="'+SAND+'"/><g id="frPast"></g>'+'<text x="420" y="560" font-size="15" fill="#6C2024" text-anchor="middle" stroke="'+SEA+'" stroke-width="4" paint-order="stroke">以前（荷蘭時代）：古堡蓋在海邊的沙洲上</text></g>';
  h+='<g id="now"><path d="M-400 520Q200 480 820 520V900H-400Z" fill="#E0D4B8"/><path d="M-400 70H1200M330 -300V560M-400 420Q300 400 1200 440" stroke="#F8F3E8" stroke-width="16" fill="none"/><g id="frNow"></g><text x="420" y="560" font-size="15" fill="#6C2024" text-anchor="middle" stroke="#E0D4B8" stroke-width="4" paint-order="stroke">今天：海變成陸地，古堡在街道中間</text></g>';
  var T=function(t,x,y,sz,c,bg){return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" fill="'+c+'" text-anchor="middle" stroke="'+(bg||'#E6DCC4')+'" stroke-width="4" paint-order="stroke">'+t+'</text>'};
  h+=T('安平',580,110,28,'#7A4A2E');
  h+='<g transform="translate(90 400)"><circle r="16" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.5"/><path d="M0 -11L5 4L0 1L-5 4Z" fill="#DB2E27"/><text y="12" font-size="9" fill="#5A4E48" text-anchor="middle">北</text></g>';
  h+=T('示意圖，不是真實比例',420,584,12,'#8A7A70');
  STOPS.forEach(function(s){h+='<g class="stop" data-lv="'+s.lv+'" role="button" aria-label="第 '+s.lv+' 關 '+s.n+'">'+marker(s)+'<circle cx="'+(s.x+24)+'" cy="'+(s.y-26)+'" r="10" fill="#fff" stroke="#E2574C" stroke-width="2"/><text x="'+(s.x+24)+'" y="'+(s.y-21.5)+'" font-size="13" fill="#E2574C" text-anchor="middle">'+s.lv+'</text><text x="'+s.x+'" y="'+(s.y+34)+'" font-size="16" font-weight="700" fill="#5A3E2B" text-anchor="middle" stroke="#FFF8EC" stroke-width="4" paint-order="stroke">'+s.n+'</text></g>'});
  h+='<g id="pin" style="display:none"><g class="pin"><path d="M0 0C-10 -14 -14 -20 -14 -27A14 14 0 1 1 14 -27C14 -20 10 -14 0 0Z" fill="#E2574C" stroke="#fff" stroke-width="2.5"/><text y="-22" font-size="12" fill="#fff" text-anchor="middle">你</text></g></g>';
  return h;
}
function near(x,y,w,hh){return STOPS.some(function(s){return Math.abs(s.x-x)<w&&Math.abs(s.y-y)<hh})}
function decorate(){
  var r=rnd(29),p='',q='';
  // 今天：古堡（白牆紅頂）在中間，旁邊是老街的房子；以前：沙洲上的城和小屋，海上有帆船
  q+=fortNow(420,236,1.2);p+=fortOld(420,236,1.2);
  for(var x=20;x<820;x+=44)for(var y=40;y<480;y+=40){
    var cx=x+(r()-.5)*10,cy=y+(r()-.5)*8;
    if(near(cx,cy,60,64))continue;
    if(Math.abs(cx-420)<80&&Math.abs(cy-245)<50)continue;
    if(Math.abs(cy-70)<16||Math.abs(cx-330)<16||Math.abs(cy-420)<18)continue;
    if(Math.abs(cx-580)<54&&Math.abs(cy-102)<24)continue;
    if(Math.abs(cx-90)<34&&Math.abs(cy-400)<34)continue;
    if(r()<.35)continue;
    q+='<g transform="translate('+f1(cx)+' '+f1(cy)+')"><rect x="-13" y="-7" width="26" height="16" fill="'+(r()<.5?'#F3E2C8':'#E8C8A8')+'" stroke="#B8A080" stroke-width="1"/><path d="M-15 -7L0 -16L15 -7Z" fill="#B8634A"/></g>';
  }
  for(var k=0;k<5;k++){var sx=[60,700,760,120,520][k],sy=[60,80,460,480,500][k];p+='<g transform="translate('+sx+' '+sy+')"><path d="M-14 4H14L10 10H-10Z" fill="#8A5A3A"/><path d="M0 4V-18L12 0Z" fill="#fff" stroke="#B8A890"/></g>'}
  map.querySelector('#frPast').innerHTML=p;
  map.querySelector('#frNow').innerHTML=q;
}

/* ---------- 關卡 ---------- */
var LV=[
  {cam:[60,0,660,660],kick:'古堡任務',h:'臺南最老的城堡',
   html:'<p>臺南的<b>安平</b>，有一座<b>安平古堡</b>。它最早叫<b>熱蘭遮城</b>，是大約 400 年前<b>荷蘭人</b>蓋的。</p><p>那時候，這裡還是海邊的一塊<b>沙洲</b>，四周都是海水。</p><p class="task">跟著古堡的<b>志工伯伯</b>，回到 400 年前，看古堡怎麼蓋、怎麼變成今天的樣子。每過一關，就能蓋一個章！</p>',
   after:'<p class="note">地圖右上角可以切換<b>以前／今天</b>，看看古堡以前在海邊、今天在街道中間。<br>給大人：安平古堡要買票入園，臺南市民憑證件免費；開放時間以臺南市政府公告為準。</p>',
   game:'start'},
  {cam:[0,0,300,225],kick:'第 1 關・沙洲上的城（1624 年）',h:'先圍出城堡',era:'past',
   html:'<p><b>1624 年</b>，荷蘭人來到這裡的沙洲（那時候叫<b>大員</b>），開始蓋城堡。</p><p>一開始沒有磚頭，只好先用<b>沙、竹子和木頭</b>蓋。後來才慢慢換成<b>磚</b>，城堡的名字也改成<b>熱蘭遮城</b>，蓋了大約 10 年才蓋好。</p><p class="note">給大人：臺南市政府資料：1624 年佔據大員後興建、1627 年定名熱蘭遮城、1634 年完工（另有資料寫 1632、1633 年）；初期因缺磚石，先用砂土、竹、木構築。</p>',
   task:'用手指在沙洲上<b>從一個角拖到對面的角</b>，拉出一個<b>方框</b>，圍出城堡的位置。方框要<b>夠大</b>，但不能超出沙洲！',game:'rect',stamp:['frame','圍出城堡'],
   win:'城堡的位置圍好了！四個角還多了尖尖突出來的<b>稜堡</b>，守城的人可以從旁邊看到敵人。',
   why:['為什麼要蓋在沙洲上？','沙洲在海邊，船可以開進來<b>停靠</b>、搬貨，從海上來的人也看得清楚。'],
   q:{t:'熱蘭遮城剛開始蓋的時候，用什麼材料？',o:['沙、竹子和木頭','鋼筋和水泥','玻璃'],a:0,hint:'一開始還沒有磚頭喔。',
      e:'答對了！一開始先用<b>沙、竹子和木頭</b>，後來才換成磚。'}},
  {cam:[0,0,300,225],kick:'第 2 關・調灰漿',h:'把磚黏起來',era:'past',
   html:'<p>磚頭和磚頭中間，要用<b>灰漿</b>黏起來。</p><p><b>有一說</b>，熱蘭遮城的灰漿是用<b>糖</b>、<b>糯米</b>、<b>磨碎的貝殼</b>和<b>沙</b>混在一起做的。</p><p class="note">給大人：「糖、沙、磨碎的貝殼和糯米」出自英文維基百科等資料，臺灣常說「糖水、糯米、蚵殼灰」，沒有找到官方考古報告寫明配方，所以寫「有一說」。</p>',
   task:'左右拖動下面的<b>木桶</b>，接住掉下來的<b>糖、糯米、貝殼和沙</b>。<b>石頭</b>和<b>樹葉</b>不要接！接到 <b>8 樣</b>對的。',game:'catch',stamp:['bucket','調好灰漿'],
   win:'灰漿調好了！黏黏的灰漿把紅磚一塊一塊黏起來，城牆好堅固。',

    function onGoal(q){return G.some(function(g){return g[0]===q[0]&&g[1]===q[1]})}
    function draw(){var h='';
      for(var y=0;y<5;y++)for(var x=0;x<7;x++){var X=OX+x*C,Y=OY+y*C;h+=wall(x,y)?bricks(X,Y,C,C):'<rect x="'+X+'" y="'+Y+'" width="'+C+'" height="'+C+'" fill="#D8C8A0" stroke="#C8B488" stroke-width=".8"/>'}
      G.forEach(function(g){h+='<rect x="'+(OX+g[0]*C+3)+'" y="'+(OY+g[1]*C+3)+'" width="'+(C-6)+'" height="'+(C-6)+'" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>'});
      bx.forEach(function(q){var X=OX+q[0]*C,Y=OY+q[1]*C,ok=onGoal(q);h+='<rect x="'+(X+3)+'" y="'+(Y+3)+'" width="'+(C-6)+'" height="'+(C-6)+'" fill="'+(ok?'#D8A050':'#C8A060')+'" stroke="'+(ok?'#3F6B2E':'#7A5530')+'" stroke-width="'+(ok?2.4:1.4)+'"/><path d="M'+(X+3)+' '+(Y+3)+'L'+(X+C-3)+' '+(Y+C-3)+'M'+(X+C-3)+' '+(Y+3)+'L'+(X+3)+' '+(Y+C-3)+'" stroke="#7A5530" stroke-width="1"/>'});
      var X=OX+me[0]*C+C/2,Y=OY+me[1]*C+C/2;h+='<g transform="translate('+X+' '+Y+')"><circle cy="-5" r="5" fill="#F2C8A0"/><path d="M-6 -1H6V9H-6Z" fill="#4A6A9A"/><path d="M-7 -9H7L0 -14Z" fill="#2A2020"/></g>';
      gd.innerHTML=h;var k=bx.filter(onGoal).length;bar.style.width=(k/2*100)+'%'}
    draw();
    function step(dx,dy){if(done)return;var nx=me[0]+dx,ny=me[1]+dy;if(wall(nx,ny)){say(msg,'前面是<b>牆</b>，走不過去。',1);return}
      var k=boxAt(nx,ny);if(k>=0){var bx2=nx+dx,by2=ny+dy;if(wall(bx2,by2)||boxAt(bx2,by2)>=0){say(msg,'箱子推不動了，後面擋住了。卡住的話按「<b>重來</b>」。',1);return}bx[k]=[bx2,by2]}
      me=[nx,ny];draw();
      if(bx.every(onGoal)){done=true;rb.remove();say(msg,'都推好了！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},900)}}
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){st0=p;return}
      if(t==='up'&&st0){var dx=p.x-st0.x,dy=p.y-st0.y;st0=null;
        if(Math.max(Math.abs(dx),Math.abs(dy))<12){var mx=OX+me[0]*C+C/2,my=OY+me[1]*C+C/2;dx=p.x-mx;dy=p.y-my;if(Math.max(Math.abs(dx),Math.abs(dy))<C/2)return}
        if(Math.abs(dx)>Math.abs(dy))step(dx>0?1:-1,0);else step(0,dy>0?1:-1)}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','倉庫的畫面，用方向鍵走路推箱子，按 Enter 直接完成');
    svg.addEventListener('keydown',function(e){if(done)return;var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();step(m[0],m[1])}else if(e.key==='Enter'){e.preventDefault();bx=G.map(function(g){return g.slice()});draw();done=true;say(msg,l.win);quiz(area,l,function(){finish(i)})}});
    later(function(){if(!done&&me[0]===3&&me[1]===3)say(msg,'先往<b>左</b>滑一下，再往<b>上</b>滑，把左邊的箱子推上去。也可以<b>點</b>工人旁邊的格子走過去。')},8000);
  },

  /* 第 4 關：把磚塊拖到走來走去的推車上 */
  cart:function(area,i,l){
    var B=[],cx=80,dir=1,held=null,off={x:0,y:0},n=0,N=6,done=false,raf=0,last=performance.now();
    for(var k=0;k<N;k++)B.push({x:62+k*39,y:58,on:false});
    B.forEach(function(b){b.hx=b.x;b.hy=b.y});
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EAE4D8"><rect x="-400" y="168" width="1200" height="80" fill="#C8B490"/><g id="wl"></g><g id="ct"></g><g id="bk"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),wl=svg.querySelector('#wl'),ct=svg.querySelector('#ct'),bk=svg.querySelector('#bk');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    (function loop(now){var d=Math.min(50,now-last)/1000;last=now;
      if(!done){cx+=dir*44*d;if(cx>250){cx=250;dir=-1}if(cx<70){cx=70;dir=1}}
      var top=70+n*8;wl.innerHTML=bricks(36,top,248,168-top);
      ct.innerHTML='<g transform="translate('+f1(cx)+' 150)"><path d="M-30 -10H30V6H-30Z" fill="#8A6A3A" stroke="#5A3E2B" stroke-width="1.4"/><circle cx="-18" cy="10" r="7" fill="#5A3E2B"/><circle cx="18" cy="10" r="7" fill="#5A3E2B"/><path d="M30 -6L44 -16" stroke="#5A3E2B" stroke-width="3" stroke-linecap="round"/>'+(n?bricks(-26,-10-Math.min(3,n)*4,52,Math.min(3,n)*4):'')+'</g>';
      bk.innerHTML=B.filter(function(b){return !b.on}).map(function(b){return '<g'+(b===held?' opacity=".9"':'')+'>'+bricks(b.x-16,b.y-7,32,12)+'<rect x="'+f1(b.x-16)+'" y="'+f1(b.y-7)+'" width="32" height="12" fill="none" stroke="'+BRICKD+'" stroke-width="1.4"/></g>'}).join('');
      raf=requestAnimationFrame(loop)})(last);
    loops.push(function(){cancelAnimationFrame(raf)});
    function load(b){b.on=true;n++;bar.style.width=(n/N*100)+'%';
      if(n>=N){done=true;say(msg,'6 塊都裝好了！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},900)}else say(msg,'裝上車了！還有 '+(N-n)+' 塊。')}
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){held=null;var bd=24;B.forEach(function(b){if(b.on)return;var d=Math.hypot(p.x-b.x,p.y-b.y);if(d<bd){bd=d;held=b}});if(held)off={x:p.x-held.x,y:p.y-held.y};else say(msg,'要按住城牆上面<b>鬆掉的磚塊</b>。',1);return}
      if(!held)return;
      if(t==='move'){held.x=p.x-off.x;held.y=p.y-off.y;return}
      if(t==='up'){var b=held;held=null;if(Math.abs(b.x-cx)<38&&b.y>116&&b.y<170)load(b);else{b.x=b.hx;b.y=b.hy;say(msg,'要放在<b>推車</b>上喔！推車會走來走去，等它過來再放。',1)}}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','拆磚的畫面，按 Enter 裝一塊磚');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var b=B.filter(function(q){return !q.on})[0];if(b)load(b)}});
    later(function(){if(!n&&!done)say(msg,'按住城牆上面的一塊<b>磚</b>，拖到下面的<b>推車</b>上再放開。')},7000);
  },

  /* 第 5 關：按住讓樹根往下長，長到磚縫時放開 */
  grow:function(area,i,l){
    var R=[{x:78,t:104},{x:132,t:130},{x:188,t:96},{x:242,t:146}],Y0=66,GND=168,held=null,n=0,done=false,raf=0,last=performance.now();
    R.forEach(function(r){r.len=0;r.ok=false});
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E6EEE2"><rect x="-400" y="168" width="1200" height="80" fill="#B8A890"/>'+bricks(40,Y0,240,GND-Y0)+
      '<ellipse cx="160" cy="40" rx="150" ry="34" fill="#4E8A3A"/><ellipse cx="110" cy="32" rx="60" ry="18" fill="#5E9A46"/><ellipse cx="220" cy="36" rx="50" ry="16" fill="#5E9A46"/><g id="ck"></g><g id="rt"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),ck=svg.querySelector('#ck'),rt=svg.querySelector('#rt');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    (function loop(now){var d=Math.min(50,now-last)/1000;last=now;
      if(held&&!held.ok){held.len+=38*d;if(Y0+held.len>=GND){held.len=0;held=null;say(msg,'長太長，碰到地上了！再按一次，看到<b>綠色的磚縫</b>就放開。',1)}}
      ck.innerHTML=R.map(function(r){return r.ok?'':'<rect x="'+(r.x-14)+'" y="'+(r.t-5)+'" width="28" height="10" rx="2" fill="#7ACB5A" opacity=".85"/>'}).join('');
      rt.innerHTML=R.map(function(r){var y1=Y0+r.len,w=Math.sin(r.x)*4;return '<path d="M'+r.x+' '+(Y0-8)+'Q'+f1(r.x+w)+' '+f1((Y0+y1)/2)+' '+r.x+' '+f1(y1)+'" stroke="'+(r.ok?'#5A4A2A':'#7A6440')+'" stroke-width="'+(r===held?5:4)+'" fill="none" stroke-linecap="round"/>'+(r.ok?'<path d="M'+(r.x-10)+' '+r.t+'H'+(r.x+10)+'" stroke="#5A4A2A" stroke-width="3" stroke-linecap="round"/>':'')}).join('');
      raf=requestAnimationFrame(loop)})(last);
    loops.push(function(){cancelAnimationFrame(raf)});
    function fix(r){r.ok=true;r.len=r.t-Y0;n++;bar.style.width=(n/4*100)+'%';
      if(n>=4){done=true;say(msg,'4 條都長好了！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},900)}else say(msg,'長進磚縫了！還有 '+(4-n)+' 條。')}
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){held=null;R.forEach(function(r){if(!r.ok&&Math.abs(p.x-r.x)<26)held=r});if(!held)say(msg,'按住一條<b>還沒長好</b>的樹根（看上面的樹）。',1);return}
      if(t==='up'&&held){var r=held;held=null;var tip=Y0+r.len;if(Math.abs(tip-r.t)<=7)fix(r);else if(tip<r.t)say(msg,'還沒到磚縫，再<b>按住</b>讓它長長一點。',1);else{r.len=0;say(msg,'長過頭了，樹根縮回去了。到<b>綠色</b>的地方就要放開喔！',1)}}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','樹根的畫面，按 Enter 長好一條');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var r=R.filter(function(q){return !q.ok})[0];if(r)fix(r)}});
    later(function(){if(!n&&!done)say(msg,'手指<b>按住</b>一條樹根不要放開，它會往下長；長到<b>綠色的磚縫</b>時，馬上放開。')},7000);
  },

  /* 第 6 關：把劍獅拖到門上形狀一樣的影子 */
  shadow:function(area,i,l){
    var D=[{x:50,k:3},{x:123,k:1},{x:197,k:4},{x:270,k:2}],J=[1,2,3,4].map(function(k,j){return {k:k,x:50+j*73.3,y:150,on:false}}),held=null,off={x:0,y:0},n=0,done=false;
    J.forEach(function(o){o.hx=o.x;o.hy=o.y});
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F4EADA"><rect x="-400" y="178" width="1200" height="80" fill="#C8B490"/>';
    D.forEach(function(d){s+='<rect x="'+(d.x-32)+'" y="26" width="64" height="100" fill="#F3E2C8" stroke="#B8A080" stroke-width="1"/><rect x="'+(d.x-18)+'" y="70" width="36" height="56" fill="#8A5A3A" stroke="#5A3E2B" stroke-width="1.2"/><path d="M'+d.x+' 70V126" stroke="#5A3E2B" stroke-width="1"/><path d="M'+(d.x-34)+' 26L'+d.x+' 12L'+(d.x+34)+' 26Z" fill="#B8634A"/>'});
    s+='<g id="sh"></g><g id="jl"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),sh=svg.querySelector('#sh'),jl=svg.querySelector('#jl');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){sh.innerHTML=D.map(function(d){return d.got?jianshi(d.x,48,1.05,d.k):'<g opacity=".55">'+jianshi(d.x,48,1.05,d.k,1)+'</g>'}).join('');
      jl.innerHTML=J.filter(function(o){return !o.on&&o!==held}).concat(held?[held]:[]).map(function(o){return '<circle cx="'+f1(o.x)+'" cy="'+f1(o.y)+'" r="'+(o===held?0:24)+'" fill="#fff" stroke="#E2D4BC"/>'+jianshi(o.x,o.y,1.05,o.k)}).join('')}
    draw();
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){held=null;var bd=26;J.forEach(function(o){if(o.on)return;var d=Math.hypot(p.x-o.x,p.y-o.y);if(d<bd){bd=d;held=o}});if(held)off={x:p.x-held.x,y:p.y-held.y};else say(msg,'要按住下面的一隻<b>劍獅</b>。',1);draw();return}
      if(!held)return;
      if(t==='move'){held.x=p.x-off.x;held.y=p.y-off.y;draw();return}
      if(t==='up'){var o=held;held=null;var dd=null;D.forEach(function(d){if(!d.got&&Math.abs(o.x-d.x)<32&&Math.abs(o.y-48)<34)dd=d});
        if(dd&&dd.k===o.k){dd.got=true;o.on=true;n++;bar.style.width=(n/4*100)+'%';
          if(n>=4){done=true;say(msg,'全部回家了！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},900)}else say(msg,'形狀一樣！這隻劍獅回家了。還有 '+(4-n)+' 隻。')}
        else{o.x=o.hx;o.y=o.hy;if(dd)say(msg,'形狀不一樣喔！看看<b>頭的形狀</b>和<b>劍的方向</b>。',1)}
        draw()}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','劍獅的畫面，按 Enter 放好一隻');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var o=J.filter(function(q){return !q.on})[0];if(!o)return;var d=D.filter(function(q){return q.k===o.k})[0];d.got=true;o.on=true;n++;draw();if(n>=4){done=true;say(msg,l.win);quiz(area,l,function(){finish(i)})}}});
    later(function(){if(!n&&!done)say(msg,'按住下面的一隻劍獅，拖到門上<b>灰色影子</b>形狀一樣的地方。')},7000);
  }
};
</script>
