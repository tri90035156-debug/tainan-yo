<h1>綠色隧道任務・候鳥・四草</h1>
<p>跟著開船的阿姨到<b>安南四草</b>：扣好救生衣、在<b>綠色隧道</b>找到綠色之眼、把<b>水筆仔</b>的胎生苗種進泥巴、偷偷靠近<b>招潮蟹</b>、算出保護區有多少<b>雁鴨</b>，最後從<b>四草砲台</b>的砲孔看出去。</p>
<p>地點：四草（臺南市安南區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>安南區的四草，有一大片濕地和紅樹林。這裡是野生動物保護區，冬天很多候鳥從北方飛來過冬，像一群一群的雁鴨（野鴨），還有黑面琵鷺。從四草大眾廟旁邊搭船，可以穿過紅樹林長成的綠色隧道。跟著開船的阿姨，搭船穿過綠色隧道，再到泥灘、保護區和老砲台看看。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・四草大眾廟：扣好救生衣</h3><p>搭船的地方在四草大眾廟旁邊。大眾廟拜的是鎮海元帥，大家叫他大將爺。上船以前，要先穿上救生衣、戴上斗笠遮太陽。救生衣的扣環一定要扣好，才不會鬆掉。</p><p>為什麼？鎮海元帥是誰？ 傳說他叫陳酉，以前在府城用牛車幫人搬東西，力氣非常大，曾經一個人把卡在沙灘上的官船推回海裡。後來大家蓋廟拜他，請他保佑台江一帶的人。</p></li>
<li><h3>第 2 關・綠色隧道：找到綠色之眼</h3><p>船開進竹筏港。兩邊的紅樹林往中間長，枝葉交在一起，像一條綠色隧道。水面平平的，會映出另一片紅樹林。從某個地方看過去，樹和倒影拼成一個像眼睛、也像嘴唇的形狀，有人叫它綠色之眼，也有人叫天使之吻。</p><p>為什麼？為什麼水面會映出樹？ 綠色隧道裡沒有大浪，水面平平的，像一面鏡子，就把上面的樹倒過來映在水裡。風大、船開快的時候，水面一晃，倒影就亂掉了。</p></li>
<li><h3>第 3 關・水筆仔：幫胎生苗種下去</h3><p>四草有四種紅樹林：水筆仔、五梨跤（紅海欖）、海茄苳、欖李。水筆仔很特別：種子還掛在樹上，就先長成一根長長的胎生苗，像一支筆，大約 15 到 20 公分。南部大約冬天成熟，成熟了輕輕一拉就掉下來。</p><p>為什麼？為什麼叫胎生苗？ 一般的種子，要掉到土裡才發芽。水筆仔的種子，還在媽媽樹上就發芽、長成小苗，像小寶寶在媽媽肚子裡長大，所以叫胎生。掉下來插進泥巴，就能很快長根。</p></li>
<li><h3>第 4 關・泥灘：一二三，木頭人</h3><p>退潮了，紅樹林旁邊露出泥灘。泥巴上有好多小洞，是招潮蟹的家；還有在泥上跳來跳去的彈塗魚。雄的招潮蟹有一隻特別大的白色螯，常常舉起來揮。牠們很膽小，一看到有東西在動，就躲進洞裡。</p><p>為什麼？招潮蟹為什麼要揮大螯？ 雄的招潮蟹揮大螯，像在說：「這是我的地盤！」也是在吸引雌蟹，讓牠看看自己很健康。打架的時候，也會把大螯高高舉起來。</p></li>
<li><h3>第 5 關・保護區：鴨子有多少隻</h3><p>到了四草野生動物保護區的水池。冬天，很多候鳥從北方飛來四草過冬；2024 年冬天的調查，四草的雁鴨（野鴨）變多了。鳥太多，一隻一隻數不完。可以先數一小格有幾隻，再看看整片有幾格，就能算出大約有多少隻。</p><p>為什麼？候鳥為什麼冬天要來四草？ 北方的冬天很冷，水會結冰，鳥找不到東西吃。四草冬天比較暖，水池和泥灘有很多小魚、小蝦、小蟲，候鳥就飛來這裡過冬，春天再飛回北方。</p></li>
<li><h3>第 6 關・四草砲台：從砲孔看出去</h3><p>最後到四草砲台。它是清朝鴉片戰爭那時候（大約 1840 年）蓋的，和對面的安平砲台一左一右，守住進出台江的船。砲台的外牆是花崗石，牆上有 13 個圓形的砲孔。現在砲台在鎮海國小旁邊，被榕樹的根包住，變成學校圍牆的一部分。</p><p>為什麼？為什麼要蓋砲台？ 以前大船要從海口開進台江、到府城。那時候發生鴉片戰爭，怕外國的船打進來，就在海口兩邊蓋砲台，一左一右守著，船一進來就看得到。</p></li>
</ol>

function decorate(){
  var r=rnd(43),m='',p='',q='';
  function free(x,y){return STOPS.every(function(s){return Math.abs(s.x-x)>56||Math.abs(s.y-y)>60})}
  // 竹筏港兩邊的紅樹林
  for(var k=0;k<34;k++){var t=k/33,x=120+t*740,y=t<.28?170+t/.28*40:t<.6?210+(t-.28)/.32*20:230+(t-.6)/.4*20;
    [-24,24].forEach(function(o){var yy=y+o+(r()-.5)*6;if(free(x,yy))m+=mangrove(x+(r()-.5)*10,yy+16,.62+r()*.2)})}
  map.querySelector('#mg').innerHTML=m;
  // 冬天：水池裡很多鴨子和黑琵；夏天：高蹺鴴（黑白、紅色長腳）
  [[300,370,220,120],[560,410,200,110],[640,40,220,150]].forEach(function(P){
    for(var n=0;n<14;n++){var x=P[0]+20+r()*(P[2]-40),y=P[1]+24+r()*(P[3]-36);if(!free(x,y))continue;
      q+=r()<.85?duck(x,y,.8,r()<.5?1:-1):spoon(x,y+4,.7);
      if(n%3===0)p+='<g transform="translate('+f1(x)+' '+f1(y)+')"><path d="M-2 0L-1 -10M2 0L1 -10" stroke="#E0506A" stroke-width="1.2"/><ellipse cy="-13" rx="7" ry="3.6" fill="#fff"/><path d="M-7 -13Q0 -17 6 -14" stroke="#2A2020" stroke-width="2.4" fill="none"/><circle cx="7" cy="-16" r="2.6" fill="#fff" stroke="#2A2020" stroke-width=".8"/><path d="M9 -16H15" stroke="#2A2020" stroke-width="1"/></g>'}});
  map.querySelector('#frPast').innerHTML=p;
  map.querySelector('#frNow').innerHTML=q;
}

function anim(fn){var raf=0,last=0,on=true;function step(now){if(!on)return;var dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(fn(dt)===false){on=false;return}raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step);loops.push(function(){on=false;cancelAnimationFrame(raf)});return function(){on=false;cancelAnimationFrame(raf)}}

    s+='<path d="M14 42Q4 100 18 176M70 44Q84 110 62 176M134 42Q120 70 128 120M262 40Q252 120 270 176M306 40Q318 100 300 150" stroke="#7A5A3E" stroke-width="4" fill="none"/>'+
      '<path d="M190 42Q200 80 186 110" stroke="#7A5A3E" stroke-width="3" fill="none"/><g id="hl"></g><g id="vw"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),hl=svg.querySelector('#hl'),vw=svg.querySelector('#vw');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    var NAME=['榕樹的根','學校的操場','魚塭','海口','紅樹林'];
    function scene(k){var g='';
      if(k===0)g='<rect x="60" y="0" width="200" height="190" fill="#6A5A40"/><path d="M80 0Q100 90 70 190M130 0Q110 100 150 190M190 0Q210 80 180 190M240 0Q220 100 250 190" stroke="#8A6A48" stroke-width="12" fill="none"/>';
      else if(k===1)g='<rect x="60" y="0" width="200" height="190" fill="#CFE6F2"/><rect x="60" y="110" width="200" height="80" fill="#C8A878"/><path d="M90 150H240" stroke="#fff" stroke-width="2"/>'+person(130,150,1,'#E8A040')+person(170,154,1,'#4A86B8',{dir:-1})+'<rect x="200" y="60" width="50" height="50" fill="#F2E6D0" stroke="#B8A888"/>';
      else if(k===2)g='<rect x="60" y="0" width="200" height="190" fill="#DDEBF0"/><rect x="60" y="100" width="200" height="90" fill="#8EC5E0"/><path d="M60 100H260" stroke="#C8B890" stroke-width="5"/><path d="M110 130l8 -6l8 6M180 150l8 -6l8 6" stroke="#fff" stroke-width="2" fill="none"/>';
      else if(k===3)g='<rect x="60" y="0" width="200" height="190" fill="#E2F0F6"/><rect x="60" y="96" width="200" height="94" fill="#6EAFD0"/><path d="M60 96Q100 92 130 96M200 96Q230 90 260 94" stroke="#C8B890" stroke-width="6"/>'+
        '<path d="M150 120L176 120L170 128H156Z" fill="#8A5A3A"/><path d="M162 120V92L178 116Z" fill="#FFF8EC" stroke="#8A7A70"/><rect x="214" y="80" width="28" height="12" fill="#B8B0A0"/><text x="228" y="74" font-size="11" fill="#2A2020" text-anchor="middle">安平</text>';
      else g='<rect x="60" y="0" width="200" height="190" fill="#DDEDE4"/><rect x="60" y="120" width="200" height="70" fill="#6EAFD0"/>'+mangrove(110,124,1.4)+mangrove(170,126,1.6)+mangrove(230,124,1.3);
      return '<defs><clipPath id="pc"><circle cx="160" cy="92" r="70"/></clipPath></defs><circle cx="160" cy="92" r="78" fill="#3A342E"/><g clip-path="url(#pc)">'+g+'</g>'+
        '<rect x="104" y="158" width="112" height="26" rx="13" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.2"/><text x="160" y="176" font-size="15" font-weight="700" fill="#2A2020" text-anchor="middle">看到：'+NAME[k]+'</text>'}
    function draw(){hl.innerHTML=tried.map(function(k){return k===RIGHT?'':'<path d="M'+(HO[k].x-6)+' '+(HO[k].y-6)+'L'+(HO[k].x+6)+' '+(HO[k].y+6)+'M'+(HO[k].x+6)+' '+(HO[k].y-6)+'L'+(HO[k].x-6)+' '+(HO[k].y+6)+'" stroke="#DB2E27" stroke-width="3"/>'}).join('');
      vw.innerHTML=view>=0?scene(view):'';bar.style.width=(done?100:tried.length/5*60)+'%'}
    draw();
    function look(k){view=k;if(tried.indexOf(k)<0)tried.push(k);draw();
      if(k===RIGHT){done=true;lvDone(area,i,l,msg,'看到海口了！還看得到對面的安平。');return}
      say(msg,'從這個洞看出去，是<b>'+NAME[k]+'</b>。點一下畫面回到牆，再看別的洞。',1)}
    drag(svg,function(t,p){if(done||t!=='down')return;
      if(view>=0){view=-1;draw();return}
      var best=-1,bd=26;HO.forEach(function(h,k){var d=dist(p,h);if(d<bd){bd=d;best=k}});
      if(best<0){say(msg,'點牆上<b>圓圓的砲孔</b>，從洞裡看出去。',1);return}
      look(best)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','四草砲台的牆上有五個圓形砲孔，按 Enter 看下一個砲孔');
    var kk=0;svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();if(view>=0){view=-1;draw()}else look(kk++%5)}});
    later(function(){if(!done&&!tried.length)say(msg,'點一個<b>砲孔</b>，看看從洞裡看出去是什麼。')},6000);
  }
};
