<h1>迎媽祖任務・廟宇・中西區祀典大天后宮</h1>
<p>跟著廟裡的志工阿伯逛<b>祀典大天后宮</b>：攤開施琅的信看<b>寧靖王</b>的王府變成媽祖廟、按住一座一座殿看懂<b>四進</b>和<b>平臺紀略碑</b>、照記錄做一塊<b>仿製</b>的匾，再抬著<b>神轎</b>繞一圈回到廟裡。</p>
<p>地點：赤崁樓・武廟（臺南市中西區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>中西區的祀典大天后宮，是臺灣第一座官方（政府）蓋的媽祖廟，大家也叫它大媽祖廟。它是古蹟。廟名前面的祀典，是說官方把它列進固定要來祭拜的名單。跟著廟裡的志工阿伯，從廟前走到正殿，再看看迎媽祖的時候，神轎走去哪裡。每過一關，就能蓋一個章。</p><h2>關卡</h2><ol>
<li><h3>第 1 關・廟前：王府變成媽祖廟</h3><p>阿伯小聲說：「這裡以前不是廟，是明朝寧靖王住的王府。」清朝初年，施琅打下臺灣，寫信請皇帝答應，把王府改成媽祖廟。</p><p>為什麼？為什麼媽祖廟以前是王府？ 明朝的寧靖王住在這裡。清朝初年，施琅請皇帝答應，把王府改成媽祖廟。觀光署的介紹說，因為臺灣的人很信媽祖，施琅想用這個方法讓大家安心、願意跟著清朝。</p></li>
<li><h3>第 2 關・一進一進：四座殿和老石碑</h3><p>阿伯說：「大天后宮從前面往裡面，有三川殿、拜殿、正殿、後殿，一共四座，叫做四進。」觀光署的介紹說，拜殿兩邊的牆上嵌著兩塊老石碑，其中一塊是施琅立的平臺紀略碑。報紙說，這兩塊碑是臺灣和澎湖很老很老的石碑，2026 年被指定為古物。</p><p>為什麼？為什麼叫做四進？ 進就是往裡面走。大天后宮從前面往裡面走，會經過四座殿：三川殿、拜殿、正殿、後殿，所以叫四進。</p></li>
<li><h3>第 3 關・正殿：燒掉的匾，再做一塊</h3><p>正殿中間拜的是媽祖。有一說，左右兩邊的龕（放神像的小房間）裡，一邊是水仙尊王，一邊是四海龍王。抬頭看，樑上掛著很多匾額。有一說，清朝皇帝送的匾在嘉慶年間的大火燒掉了，現在掛的多是照原來的樣子仿製的。</p><p>為什麼？為什麼媽祖廟裡還拜別的神？ 有一說，正殿旁邊龕裡的水仙尊王，原本是臺南水仙宮的神像。水仙宮被拆掉以後，就搬到這裡來。不過也有資料說，在那之前這裡就已經拜水仙尊王了。</p></li>
<li><h3>第 4 關・迎媽祖：隔了 6 年的迎媽祖</h3><p>阿伯說：「2024 年 9 月，府城迎媽祖，新聞說這是隔了 6 年才又辦的。」媽祖坐上神轎出門遶境（在城裡繞一圈，拜訪別的廟）。活動前的新聞說，會有大約 50 頂神轎、100 個陣頭。第一天從大天后宮出發，經過民族路牌樓（民族路上大天后宮的牌樓，像一座大門）、中山路的開隆宮（一間廟），再回到大天后宮。</p><p>為什麼？迎媽祖會去多少間廟？ 活動前的新聞說，2024 年迎媽祖第一天要拜訪 43 間宮廟，第二天 30 間。神轎一間一間去，所以要走兩天。</p></li>
</ol>

/* ---------- 這個遊戲自己用的小工具 ---------- */
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
// 一直跑的動畫（換關時會自動停）
function anim(fn){var raf=0,last=0,on=true;function step(now){if(!on)return;var dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(fn(dt)===false){on=false;return}raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step);loops.push(function(){on=false;cancelAnimationFrame(raf)});return function(){on=false;cancelAnimationFrame(raf)}}
// 一定要等的時間（later() 在「減少動態效果」時會變成 0）
function wait(fn,ms){var t=setTimeout(fn,ms);loops.push(function(){clearTimeout(t)})}

  /* 第 2 關：從前面看四座殿，按住最前面那一座等它變透明，看到後面那一座；拜殿要先點牆上的石碑 */
  halls:function(area,i,l){
    var H=[{n:'三川殿',w:250,y:170,h:52},{n:'拜殿',w:212,y:142,h:44},{n:'正殿',w:176,y:118,h:38},{n:'後殿',w:142,y:96,h:32}];
    var ST=[{x:74,y:124},{x:246,y:124}],seen=false,ghost=[0,0,0,0],holdT=null,hp=null,prog=0,done=false,tries=0;
    H.forEach(function(q){q.r=Math.max(10,q.h*.42)});
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EEF0EA"><rect x="-400" y="170" width="1200" height="60" fill="#D8CCAE"/><g id="hg"></g><g id="rg"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),hg=svg.querySelector('#hg'),rg=svg.querySelector('#rg');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function front(){for(var k=0;k<4;k++)if(!ghost[k])return k;return 4}
    function draw(){var h='',f=front();
      for(var k=3;k>=0;k--){var q=H[k];h+=hall(160,q.y,q.w,q.h,{ghost:ghost[k]});
        if(k===1&&ghost[0])ST.forEach(function(t){h+=stele(t.x,t.y+18,1.2)+(!seen?'<circle cx="'+t.x+'" cy="'+t.y+'" r="21" fill="none" stroke="#fff" stroke-width="2.6" stroke-dasharray="5 3"/>':'')})}
      // 已經看過的殿：寫上第幾進
      for(var k=0;k<4;k++)if(ghost[k]){var q=H[k];h+='<text x="160" y="'+(q.y-4)+'" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#EEF0EA" stroke-width="4" paint-order="stroke">第 '+(k+1)+' 進・'+q.n+'</text>'}
      if(f<4&&!done&&!holdT&&!(f===1&&!seen)){var q=H[f];h+='<circle cx="160" cy="'+f1(q.y-q.h*.45)+'" r="20" fill="none" stroke="#fff" stroke-width="2.6" stroke-dasharray="5 3"/>'}
      hg.innerHTML=h;bar.style.width=(done?100:(ghost.reduce(function(a,b){return a+b},0)+(seen?.5:0))/4.5*90)+'%'}
    function ring(){rg.innerHTML=hp&&holdT?'<circle cx="'+f1(hp.x)+'" cy="'+f1(hp.y)+'" r="18" fill="none" stroke="#fff" stroke-width="6"/><circle cx="'+f1(hp.x)+'" cy="'+f1(hp.y)+'" r="18" fill="none" stroke="#DB2E27" stroke-width="4" stroke-dasharray="'+f1(113*prog)+' 200" transform="rotate(-90 '+f1(hp.x)+' '+f1(hp.y)+')"/>':''}
    draw();
    function inHall(k,p){var q=H[k];return Math.abs(p.x-160)<=q.w/2+10&&p.y>=q.y-q.h-q.r-4&&p.y<=q.y+4}
    var MSG=['<b>三川殿</b>變透明了，看到後面的拜殿！拜殿兩邊的牆上有石碑，點一下看看。','拜殿變透明了，看到正殿。媽祖就在正殿裡。繼續按住正殿。','正殿變透明了，最後面是後殿。按住後殿，數完四座。'];
    function complete(k){ghost[k]=1;holdT=null;hp=null;ring();draw();
      if(k<3){say(msg,MSG[k]);return}
      done=true;draw();wait(function(){lvDone(area,i,l,msg,'後殿後面沒有殿了。一共四座殿！')},500)}
    function stop(){if(holdT){holdT();holdT=null}hp=null;prog=0;ring();draw()}
    drag(svg,function(t,p){if(done)return;var f=front();
      if(t==='down'){
        if(f===1&&!seen){var hit=ST.some(function(st){return dist(p,st)<24});
          if(hit){seen=true;draw();say(msg,'觀光署的介紹說，拜殿牆上這兩塊老石碑，其中一塊就是<b>施琅</b>立的<b>平臺紀略碑</b>。看完了，再按住拜殿，看後面那一座。');return}
          if(inHall(1,p)){say(msg,'先看看拜殿兩邊牆上的<b>石碑</b>（白色虛線圈圈），點一下。',1);return}}
        for(var k=f+1;k<4;k++)if(inHall(k,p)&&!inHall(f,p)){say(msg,'後面的殿被擋住了。先按住<b>最前面</b>那一座。',1);return}
        if(!inHall(f,p)){say(msg,'按住<b>最前面</b>那一座殿（白色虛線圈圈附近）。',1);return}
        hp=p;prog=0;tries++;var tt=0;holdT=anim(function(dt){tt+=dt;prog=Math.min(1,tt/.8);ring();if(prog>=1){complete(f);return false}});draw();return}
      if(t==='move'&&hp&&dist(p,hp)>30){stop();say(msg,'手指不要移開，按著<b>不要動</b>，等紅色的圈圈轉滿。',1);return}
      if(t==='up'&&hp){stop();say(msg,'按住<b>久一點</b>，等紅色的圈圈轉滿一圈再放開。',1)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','從前面看四座殿，按 Enter 讓最前面那一座變透明，按 S 看拜殿的石碑');
    svg.addEventListener('keydown',function(e){if(done)return;var f=front();
      if(e.key==='s'||e.key==='S'){if(f===1&&!seen){e.preventDefault();seen=true;draw();say(msg,'觀光署的介紹說，拜殿牆上這兩塊老石碑，其中一塊就是<b>施琅</b>立的<b>平臺紀略碑</b>。')}return}
      if(e.key==='Enter'||e.key===' '){e.preventDefault();if(f===1&&!seen){say(msg,'先按 S 看看拜殿牆上的石碑。',1);return}complete(f)}});
    later(function(){if(!tries)say(msg,'用手指<b>按住</b>最前面那一座殿，不要放開，等紅色的圈圈轉滿。')},8000);
  },

  /* 第 4 關：按住神轎沿著街道一格一格拖，經過牌樓和開隆宮、沿路拜訪小廟，再回到大天后宮 */
  route:function(area,i,l){
    var XS=[50,105,160,215,270],YS=[40,98,156],N=[];
    YS.forEach(function(y,r){XS.forEach(function(x,c){N.push({x:x,y:y,r:r,c:c})})});
    var HOME=6,GATE=11,KL=4,SMALL=[0,2,7,8,10,13,14],path=[HOME],hold=false,done=false,moved=0,needLit=5;
    function adj(a,b){return Math.abs(N[a].r-N[b].r)+Math.abs(N[a].c-N[b].c)===1}
    function lit(){return SMALL.filter(function(k){return path.indexOf(k)>=0}).length}
    var roads='';N.forEach(function(a,k){N.forEach(function(b,m){if(m>k&&adj(k,m))roads+='<path d="M'+a.x+' '+a.y+'L'+b.x+' '+b.y+'" stroke="'+ROAD+'" stroke-width="14" stroke-linecap="round"/>'})});
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E4D8BC"><rect x="-400" y="182" width="1200" height="60" fill="#E4D8BC"/>'+roads+
      '<text x="160" y="178" font-size="13" font-weight="700" fill="#8A7A70" text-anchor="middle">民族路（示意）</text>'+
      '<text x="292" y="98" font-size="13" font-weight="700" fill="#8A7A70" text-anchor="middle" transform="rotate(90 292 98)">中山路（示意）</text>'+
      '<g id="mg"></g><g id="pg"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),mg=svg.querySelector('#mg'),pgE=svg.querySelector('#pg');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function mini(x,y,on){return '<g transform="translate('+x+' '+y+')">'+(on?'<circle r="15" fill="'+GOLD+'" opacity=".5"/>':'')+'<rect x="-8" y="-4" width="16" height="10" fill="'+(on?WALL:'#B8AFA0')+'" stroke="'+(on?WALL2:'#8A8070')+'" stroke-width="1.2"/><path d="M-11 -4L-6 -10H6L11 -4Z" fill="'+(on?ROOF:'#9A9488')+'"/></g>'}
    function draw(){var h='';
      SMALL.forEach(function(k){h+=mini(N[k].x,N[k].y,path.indexOf(k)>=0)});
      var g=N[GATE];h+='<g transform="translate('+g.x+' '+g.y+')"><path d="M-12 8V-8M12 8V-8" stroke="#B8302A" stroke-width="3"/><path d="M-16 -8H16L12 -14H-12Z" fill="'+ROOF+'"/>'+(path.indexOf(GATE)>=0?'<circle r="17" fill="none" stroke="'+GOLD+'" stroke-width="3"/>':'')+'</g><text x="'+g.x+'" y="'+(g.y-18)+'" font-size="13" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#E4D8BC" stroke-width="3" paint-order="stroke">牌樓</text>';
      var kl=N[KL];h+='<g transform="translate('+kl.x+' '+kl.y+') scale(1.3)">'+mini(0,0,path.indexOf(KL)>=0)+'</g><text x="'+(kl.x-4)+'" y="'+(kl.y+26)+'" font-size="13" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#E4D8BC" stroke-width="3" paint-order="stroke">開隆宮</text>';
      var hm=N[HOME];h+='<g transform="translate('+hm.x+' '+(hm.y-2)+')"><rect x="-14" y="-6" width="28" height="14" fill="'+WALL+'" stroke="'+WALL2+'" stroke-width="1.4"/><path d="M-19 -6L-12 -14H12L19 -6Z" fill="'+ROOF+'" stroke="'+ROOF2+'"/></g><text x="'+hm.x+'" y="'+(hm.y-20)+'" font-size="13" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#E4D8BC" stroke-width="3" paint-order="stroke">大天后宮</text>';
      mg.innerHTML=h;
      var d='M'+path.map(function(k){return N[k].x+' '+N[k].y}).join('L');
      var c=N[path[path.length-1]];
      pgE.innerHTML='<path d="'+d+'" stroke="#DB2E27" stroke-width="4" fill="none" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round"/>'+sedan(c.x,c.y+12,.42)+
        (!done&&!hold?'<circle cx="'+c.x+'" cy="'+c.y+'" r="21" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>':'');
      var n=Math.min(lit(),needLit)+(path.indexOf(GATE)>=0?1:0)+(path.indexOf(KL)>=0?1:0);bar.style.width=(done?100:n/(needLit+2)*90)+'%'}
    draw();
    function step(k){var cur=path[path.length-1];if(!adj(cur,k))return;
      if(path.length>1&&k===path[path.length-2]){path.pop();moved=1;draw();return}
      if(k===HOME&&path.length>1){path.push(k);draw();
        var g=path.indexOf(GATE)>=0,kk=path.indexOf(KL)>=0,n=lit();
        if(g&&kk&&n>=needLit){done=true;hold=false;draw();wait(function(){lvDone(area,i,l,msg,'回到大天后宮了！沿路拜訪了 '+n+' 間小廟。')},500);return}
        path.pop();draw();
        say(msg,!g?'還沒經過<b>民族路牌樓</b>呢，先不要回廟裡。':!kk?'還沒去中山路的<b>開隆宮</b>呢，先不要回廟裡。':'沿路才拜訪了 '+n+' 間小廟，要<b>至少 5 間</b>。繞遠一點再回來。',1);return}
      if(path.indexOf(k)>=0){say(msg,'這條街走過了，換一條沒走過的街。',1);return}
      path.push(k);moved=1;draw();
      if(k===GATE)say(msg,'經過<b>民族路牌樓</b>了！');
      else if(k===KL)say(msg,'到了中山路的<b>開隆宮</b>！');
      else if(SMALL.indexOf(k)>=0)say(msg,'拜訪了一間小廟，現在 '+lit()+' 間。')}
    drag(svg,function(t,p){if(done)return;var c=N[path[path.length-1]];
      if(t==='down'){if(dist(p,c)<28){hold=true;draw();return}
        say(msg,'按住<b>神轎</b>（紅色虛線圈圈），沿著街道拖。',1);return}
      if(t==='move'&&hold){var best=-1,bd=26;N.forEach(function(q,k){if(!adj(path[path.length-1],k))return;var d=dist(p,q);if(d<bd){bd=d;best=k}});if(best>=0)step(best);return}
      if(t==='up'&&hold){hold=false;draw()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','街道地圖，按方向鍵讓神轎沿著街道走一格');
    svg.addEventListener('keydown',function(e){if(done)return;var m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(!m)return;e.preventDefault();
      var c=N[path[path.length-1]],r=c.r+m[0],cc=c.c+m[1];if(r<0||r>2||cc<0||cc>4)return;step(r*5+cc)});
    later(function(){if(!moved)say(msg,'按住<b>神轎</b>，先往下拖到<b>民族路牌樓</b>。')},8000);
  }
};
</script>
