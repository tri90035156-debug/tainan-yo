<h1>曬鹽任務・鹽田・北門井仔腳</h1>
<p>跟著<b>井仔腳</b>的老鹽工阿伯曬鹽：看海水一池一池變鹹、把<b>瓦盤</b>敲成碎片、比出瓦片底的鹽比較白、輕輕<b>耙鹽</b>、堆出尖尖的<b>小鹽山</b>，再記住一年的曬鹽季。</p>
<p>地點：北門（臺南市北門區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>北門的井仔腳瓦盤鹽田，從 1818 年就開始曬鹽，是北門第一座鹽田，也是現在留下來最老的瓦盤鹽田。以前臺灣的海邊有很多鹽田，靠太陽把海水曬成鹽。2002 年，臺灣的曬鹽業結束了；後來井仔腳重新整理好，大家可以來看、來體驗收鹽。跟著老鹽工阿伯，從曬海水一路做到堆鹽山。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・蒸發池：一池一池變鹹</h3><p>海水先流進大大的蒸發池。太陽一直曬，水慢慢變少，剩下的水就越來越鹹。鹽工用鹹度（用「度」來算）看水夠不夠鹹：大蒸發池最後一層大約 10 到 12 度，小蒸發池最後一層大約 20 到 22 度，夠鹹了才放進結晶池。小蒸發池一層比一層低，像梯田。</p><p>為什麼？為什麼要分好幾個池子？ 海水在大池子先曬掉一些，再換到下一池繼續曬，越換越鹹。最後只把很鹹的水放進結晶池，在那裡曬出鹽。</p></li>
<li><h3>第 2 關・瓦盤：把瓦盤敲成碎片</h3><p>結晶池的池底，鋪滿了碎瓦片。這些碎片是鹽工把瓦盤敲碎，再一片一片拼貼上去的，所以叫瓦盤鹽田。據說明鄭時期的陳永華，改良了曬鹽的方法：在海邊做平平的鹽埕，鋪上碎瓦片，再把海水引進來曬。</p><p>為什麼？陳永華做了什麼？ 陳永華是明鄭時期鄭家的大臣。他改良曬鹽的方法：在海邊做平平的鹽埕，鋪上碎瓦片，再把海水引進來，讓太陽把鹽曬在瓦片上。</p></li>
<li><h3>第 3 關・結晶池：泥土底和瓦片底</h3><p>很鹹的水放進結晶池，太陽再曬 3 到 5 天，池底就長出一層白白的鹽。為什麼池底要鋪瓦片，不直接用泥土？我們來比比看！</p><p>為什麼？瓦片還有什麼好處？ 瓦片曬了太陽會吸熱，再把熱散出來，鹽結晶得比較快；這樣曬出來的鹽，顆粒比較小，表面也比較白。</p></li>
<li><h3>第 4 關・收鹽：耙鹽不要刮到底</h3><p>鹽曬好了，鹽工拿著長長的耙子，把池底的鹽耙到一邊集中起來。耙的時候要輕輕的，只刮上面的鹽，不能刮到底下的瓦片和泥土，鹽才不會髒掉。</p><p>為什麼？收完鹽，池子怎麼辦？ 收完鹽，把池子稍微沖洗一下，就能再引海水進來，繼續曬下一批鹽，又省工又省時。</p></li>
<li><h3>第 5 關・鹽山：堆一座小鹽山</h3><p>收好的鹽，堆在池子旁邊，一堆一堆白白尖尖的，像一座座小鹽山。以前的鹽工，還要用扁擔把鹽一擔一擔挑走。現在來井仔腳，也可以體驗挑鹽、收鹽。</p><p>為什麼？一年可以曬幾天鹽？ 鹽要靠太陽曬，下雨就不行。所以一年 365 天裡，大約只有 180 天收得到鹽。</p></li>
<li><h3>第 6 關・看夕陽：哪幾個月可以曬鹽</h3><p>傍晚，太陽掉進北門潟湖外面的海裡，鹽田的水面映出整片天空，這裡被叫做「台灣最後一道夕陽」。阿伯說：10 月以後雨變少，又可以曬鹽，一直到隔年 3 月，鹽工叫它小汛季；3 到 5 月太陽大、雨很少，叫大汛季，最忙；5 到 9 月是雨季和颱風，鹽田休息、整修。</p><p>為什麼？為什麼 2002 年不曬鹽了？ 曬鹽要很多人力，又累又辛苦。後來人工越來越貴，2002 年臺灣結束了 338 年的曬鹽業。井仔腳後來重新整理，讓大家可以來看、來體驗。</p></li>
</ol>

      return saltpile(x,162,1.4)}
    function draw(){sl.innerHTML=PS.map(function(P,k){return P.done?'':'<rect x="'+P.x+'" y="'+Y0+'" width="'+P.w+'" height="'+(Y1-Y0)+'" fill="#FFFFFF" opacity=".35"/>'+SP[k].map(function(c){return '<rect x="'+f1(c.x)+'" y="'+f1(c.y)+'" width="5" height="5" fill="#FFFFFF" stroke="#D0D4D4" stroke-width=".6" transform="rotate('+f1(c.r)+' '+f1(c.x+2.5)+' '+f1(c.y+2.5)+')"/>'}).join('')}).join('');
      pl.innerHTML=PS.map(function(P){return P.done?pile(P):''}).join('')+(PS[0].done&&PS[1].done&&!done?PS.map(function(P){return '<circle cx="'+(P.x+P.w/2)+'" cy="148" r="30" fill="none" stroke="#DB2E27" stroke-width="2.4" stroke-dasharray="5 4"/>'}).join(''):'');
      ln.innerHTML=cur&&cur.length>1?'<path d="M'+cur.map(function(q){return f1(q.x)+' '+f1(q.y)}).join('L')+'" stroke="#DB2E27" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>':'';
      bar.style.width=(done?100:(PS.filter(function(P){return P.done}).length/2*70))+'%'}
    draw();
    drag(svg,function(t,p){if(done)return;
      if(PS[0].done&&PS[1].done){if(t!=='down')return;var k=-1;PS.forEach(function(P,j){if(dist(p,{x:P.x+P.w/2,y:148})<36)k=j});
        if(k<0){say(msg,'點下面<b>其中一堆鹽</b>。',1);return}
        if(PS[k].mud){say(msg,'這一堆<b>黏到泥土</b>了，黃黃的、有黑黑的土，不乾淨。看看另一堆！',1);return}
        done=true;draw();lvDone(area,i,l,msg,'對！瓦片底的鹽，沒有黏到泥土。');return}
      if(t==='down'){cur=[p];return}
      if(t==='move'&&cur){cur.push(p);draw();return}
      if(t==='up'&&cur){var a=cur[0],b=p,pts=cur;cur=null;draw();
        var k2=-1;PS.forEach(function(P,j){if(a.x>=P.x-6&&a.x<=P.x+P.w+6&&b.x>=P.x-6&&b.x<=P.x+P.w+6&&a.y>Y0-8&&a.y<Y1+8)k2=j});
        if(k2<0||Math.abs(b.x-a.x)<50){say(msg,'在<b>一個池子</b>裡，手指<b>橫著</b>刮過去，長一點。',1);return}
        if(PS[k2].done){say(msg,'這一池刮過了，換<b>另一池</b>。');return}
        PS[k2].done=true;draw();
        if(PS[0].done&&PS[1].done)say(msg,'兩邊都刮好了！哪一堆鹽比較<b>白</b>、比較<b>乾淨</b>？點那一堆。');
        else say(msg,PS[k2].mud?'泥土底刮好了。再刮<b>瓦片底</b>。':'瓦片底刮好了。再刮<b>泥土底</b>。')}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','泥土底和瓦片底兩個結晶池，按 Enter 刮鹽、選出比較白的鹽');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();if(!PS[0].done||!PS[1].done){PS[0].done=PS[1].done=true;draw()}else{done=true;draw();lvDone(area,i,l,msg,'對！瓦片底的鹽，沒有黏到泥土。')}}});
    later(function(){if(!done&&!PS[0].done&&!PS[1].done)say(msg,'手指按在<b>左邊池子</b>裡，橫著刮到另一邊。')},7000);
  },

  /* 第 4 關：從旁邊看結晶池，拖耙子往左把鹽耙到池邊；耙齒要在鹽層裡（太高刮不到、太低刮到泥） */
  rake:function(area,i,l){
    var TOP=112,BOT=131,T={x:276,y:100},grab=false,ok=0,start=0,bad=false,done=false,n=0,warned=0,hiMsg=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EAF2F4"><rect x="-400" y="136" width="1200" height="100" fill="'+MUD+'"/>'+
      '<rect x="-400" y="130" width="1200" height="7" fill="#B8704A"/><path d="M-400 130H720" stroke="#8A4A2E" stroke-width="1"/>'+
      '<rect x="-400" y="100" width="20" height="40" fill="'+BANK+'"/><rect x="0" y="96" width="14" height="44" fill="'+BANK+'"/><rect x="306" y="96" width="14" height="44" fill="'+BANK+'"/>'+
      '<path d="M14 '+TOP+'V'+BOT+'M306 '+TOP+'V'+BOT+'" stroke="#3E7EA8" stroke-width="2" stroke-dasharray="3 3"/>'+
      '<text x="296" y="'+(TOP+3)+'" font-size="12" font-weight="700" fill="#2E5A74" text-anchor="end">鹽</text><text x="296" y="158" font-size="12" font-weight="700" fill="#FFF8EC" text-anchor="end">泥土</text>'+
      '<g id="sl"></g><g id="pl"></g><g id="rk"></g><g id="ct"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),sl=svg.querySelector('#sl'),pl=svg.querySelector('#pl'),rk=svg.querySelector('#rk'),ct=svg.querySelector('#ct');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    var scr=320;// 這一耙刮到哪裡（右邊的鹽已經刮走）
    function draw(){var h='<rect x="14" y="'+TOP+'" width="'+f1(Math.max(0,Math.min(scr,306)-14))+'" height="'+(BOT-TOP)+'" fill="#FBFBF6"/>';
      for(var x=18;x<Math.min(scr,304);x+=9)h+='<path d="M'+x+' '+TOP+'l4 -3l4 3" fill="#FBFBF6" stroke="#D8DCDC" stroke-width=".6"/>';
      if(bad)h+='<rect x="'+f1(T.x-14)+'" y="'+TOP+'" width="40" height="'+(BOT-TOP)+'" fill="#8A6A4E" opacity=".5"/>';
      sl.innerHTML=h;
      pl.innerHTML=n?saltpile(30,TOP+2,.6+n*.3):'';
      rk.innerHTML=rake(T.x,T.y,1.1)+(!grab&&!done?'<circle cx="'+T.x+'" cy="'+(T.y+16)+'" r="20" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>':'');
      ct.innerHTML='<rect x="122" y="6" width="76" height="24" rx="12" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.2"/><text x="160" y="23" font-size="14" font-weight="700" fill="#2A2020" text-anchor="middle">耙了 '+n+'／3</text>';
      bar.style.width=(done?100:(n+(grab?clamp((276-T.x)/220,0,1):0))/3*90)+'%'}
    draw();
    function reset(){grab=false;T={x:276,y:100};scr=320;bad=false;draw()}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){if(dist(p,{x:T.x,y:T.y+16})<32){grab=true;start=T.x;bad=false}else say(msg,'按住右邊的<b>耙子</b>（紅色虛線圈圈）。',1);return}
      if(t==='move'&&grab){T={x:clamp(p.x,20,300),y:clamp(p.y-20,80,160)};
        if(T.y>BOT){bad=true;draw();grab=false;say(msg,'太低了！耙子<b>刮到瓦片和泥土</b>，鹽變髒了。耙子拿高一點，再耙一次。',1);wait(reset,900);return}
        if(T.y>=TOP-1){scr=Math.min(scr,T.x+10)}
        else if(T.x<start-30&&!hiMsg){hiMsg=1;say(msg,'太高了，耙子<b>碰不到鹽</b>。耙齒要放在<b>白色的鹽</b>裡。',1)}
        if(scr<=48&&T.y>=TOP-1){n++;grab=false;scr=320;
          if(n>=3){done=true;draw();lvDone(area,i,l,msg,'耙好了！鹽堆在池邊。');return}
          say(msg,['耙好一次！鹽集中到左邊了。再耙一次。','很好！再耙最後一次。'][n-1]);T={x:276,y:100};hiMsg=0}
        draw();return}
      if(t==='up'&&grab){grab=false;if(scr<320&&!done)say(msg,'還沒耙到左邊。按住耙子，一路拖到<b>左邊的鹽堆</b>。',1);scr=320;T={x:276,y:100};draw()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','從旁邊看的結晶池，有鹽、瓦片和泥土，按 Enter 耙一次鹽');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();n++;draw();if(n>=3){done=true;draw();lvDone(area,i,l,msg,'耙好了！鹽堆在池邊。')}}});
    later(function(){if(!done&&!n&&!grab)say(msg,'按住耙子，先<b>往下</b>放到白色的鹽裡，再<b>往左</b>拖。')},7000);
  },

  /* 第 5 關：點鹽堆的正上方倒鹽；倒在正中間鹽山越堆越高，倒歪了會滑下來變扁 */
  pile:function(area,i,l){
    var CX=160,G=164,H=12,W=30,GOAL=70,fall=[],done=false,miss=0,n=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EEF2F2"><rect x="-400" y="'+G+'" width="1200" height="70" fill="'+BANK+'"/>'+
      '<g transform="translate(20 120)">'+mosaic(0,0,70,44,31,10)+'</g><rect x="20" y="120" width="70" height="44" fill="#fff" opacity=".4"/>'+
      '<path d="M40 '+(G-GOAL)+'H280" stroke="#3E7EA8" stroke-width="2" stroke-dasharray="6 4"/><text x="286" y="'+(G-GOAL+4)+'" font-size="12" font-weight="700" fill="#2E5A74">這麼高</text>'+
      person(270,G,1.1,'#4A86B8',{hat:true,dir:-1})+'<g id="pi"></g><g id="fa"></g><g id="tg"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),pi=svg.querySelector('#pi'),fa=svg.querySelector('#fa'),tg=svg.querySelector('#tg');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){pi.innerHTML='<path d="M'+f1(CX-W)+' '+G+'Q'+f1(CX-W*.3)+' '+f1(G-H*.9)+' '+CX+' '+f1(G-H)+'Q'+f1(CX+W*.3)+' '+f1(G-H*.9)+' '+f1(CX+W)+' '+G+'Z" fill="#FBFBF6" stroke="#C8C8C0" stroke-width="1.4"/>';
      fa.innerHTML=fall.map(function(f){return '<circle cx="'+f1(f.x+f.dx*f.t*20)+'" cy="'+f1(f.y+f.t*f.t*80)+'" r="2" fill="#fff" stroke="#C8C8C0" stroke-width=".5"/>'}).join('');
      tg.innerHTML=done?'':'<circle cx="'+CX+'" cy="'+f1(G-H-18)+'" r="18" fill="none" stroke="#DB2E27" stroke-width="2.2" stroke-dasharray="4 3"/>';
      bar.style.width=(done?100:clamp((H-12)/(GOAL-12),0,1)*90)+'%'}
    draw();
    anim(function(dt){fall.forEach(function(f){f.t+=dt*2.2});fall=fall.filter(function(f){return f.t<1});draw();if(done&&!fall.length)return false});
    function pour(x){n++;for(var k=0;k<10;k++)fall.push({x:x+(Math.random()-.5)*8,y:G-H-40,dx:(Math.random()-.5),t:Math.random()*.2});
      var d=Math.abs(x-CX);
      if(d<=18){H=Math.min(GOAL+4,H+8);W=Math.max(W,H*.95+8);
        if(H>=GOAL){done=true;draw();lvDone(area,i,l,msg,'堆到虛線了，好尖的小鹽山！');return}
        say(msg,n===1?'倒在正中間，鹽山變高了！再倒。':'越堆越高了！')}
      else{miss++;W=Math.min(130,W+10);H=Math.max(12,H-2);say(msg,'倒歪了！鹽從旁邊<b>滑下來</b>，鹽山變扁了。要倒在<b>正上方</b>的紅色圈圈。',1)}
      draw()}
    drag(svg,function(t,p){if(done||t!=='down')return;
      if(p.y>G-4){say(msg,'點在鹽山的<b>上面</b>，不是地上。',1);return}
      if(Math.abs(p.x-CX)>90){say(msg,'要倒在<b>鹽山</b>上面喔。',1);return}
      pour(p.x)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','池子旁邊的小鹽山，按 Enter 在正中間倒一鏟鹽');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();pour(CX)}});
    later(function(){if(!done&&n===0)say(msg,'點鹽堆正上方的<b>紅色虛線圈圈</b>，鹽就會倒下去。')},6000);
  },

  /* 第 6 關：一年 12 個月的圓圈，沿著圓圈拖，塗出可以曬鹽的月份（10 月到隔年 4 月） */
  ring:function(area,i,l){
    var C={x:160,y:94},R0=40,R1=80,PAINT={},NEED=[10,11,12,1,2,3,4],BAD=[5,6,7,8,9],done=false,flash=null,warn=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F6DCB8"><rect x="-400" y="132" width="1200" height="60" fill="#E8A070"/><circle cx="30" cy="132" r="16" fill="#F07840"/><path d="M14 140H46M20 148H40M24 156H36" stroke="#F8C080" stroke-width="3" stroke-linecap="round"/><rect x="-400" y="176" width="1200" height="60" fill="#C8B48C"/>'+
      '<circle cx="'+C.x+'" cy="'+C.y+'" r="30" fill="#F5A040"/><text x="'+C.x+'" y="'+(C.y+6)+'" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">一年</text><g id="sc"></g><g id="lb"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),sg=svg.querySelector('#sc'),lb=svg.querySelector('#lb');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    // 月份像時鐘：12 月在最上面，3 月在右邊，6 月在下面，9 月在左邊
    function ang(m){return (m%12)*30-90}
    function pt(a,r){var t=a*Math.PI/180;return {x:C.x+Math.cos(t)*r,y:C.y+Math.sin(t)*r}}
    function sector(m){var a0=ang(m)-15,a1=ang(m)+15,p0=pt(a0,R1),p1=pt(a1,R1),p2=pt(a1,R0),p3=pt(a0,R0);
      return 'M'+f1(p0.x)+' '+f1(p0.y)+'A'+R1+' '+R1+' 0 0 1 '+f1(p1.x)+' '+f1(p1.y)+'L'+f1(p2.x)+' '+f1(p2.y)+'A'+R0+' '+R0+' 0 0 0 '+f1(p3.x)+' '+f1(p3.y)+'Z'}
    function draw(){var h='',t='';for(var m=1;m<=12;m++){var on=PAINT[m],big=m>=3&&m<=5;
        h+='<path d="'+sector(m)+'" fill="'+(on?(big?'#F5C030':'#FFFFFF'):flash===m?'#E89090':'#C8B8A0')+'" stroke="#8A6A4E" stroke-width="1.4"/>';
        var c=pt(ang(m),(R0+R1)/2);t+='<text x="'+f1(c.x)+'" y="'+f1(c.y+5)+'" font-size="14" font-weight="700" fill="'+(on?'#6C2024':'#5A4A3A')+'" text-anchor="middle">'+m+'月</text>'}
      sg.innerHTML=h;
      if(done)t+='<text x="40" y="40" font-size="13" font-weight="700" fill="#6C2024" text-anchor="middle">小汛季</text><text x="40" y="56" font-size="12" fill="#6C2024" text-anchor="middle">10–3 月</text><text x="282" y="40" font-size="13" font-weight="700" fill="#8A5A10" text-anchor="middle">大汛季</text><text x="282" y="56" font-size="12" fill="#8A5A10" text-anchor="middle">3–5 月</text><text x="160" y="190" font-size="13" font-weight="700" fill="#5A3A20" text-anchor="middle">5–9 月：雨季，鹽田休息</text>';
      lb.innerHTML=t;bar.style.width=(done?100:NEED.filter(function(m){return PAINT[m]}).length/7*90)+'%'}
    draw();
    function at(p){var dx=p.x-C.x,dy=p.y-C.y,r=Math.hypot(dx,dy);if(r<R0-6||r>R1+8)return 0;var a=(Math.atan2(dy,dx)*180/Math.PI+90+15+360)%360;var m=Math.floor(a/30);return m===0?12:m}
    function paint(m){if(!m||PAINT[m])return;
      if(BAD.indexOf(m)>=0){flash=m;draw();if(warn!==m){warn=m;say(msg,'<b>'+m+' 月</b>是雨季和颱風，鹽田休息，<b>不要塗</b>。',1)}return}
      PAINT[m]=1;draw();var c=NEED.filter(function(k){return PAINT[k]}).length;
      if(c>=7){done=true;draw();lvDone(area,i,l,msg,'10 月到隔年 4 月都塗好了！');return}
      if(c===1)say(msg,'塗好 <b>'+m+' 月</b>了！沿著圓圈繼續拖，一個月一個月塗。')}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){flash=null;var m=at(p);if(!m){say(msg,'手指放在<b>月份的圓圈</b>上，沿著圓圈拖。',1);return}paint(m);return}
      if(t==='move'){paint(at(p));return}
      if(t==='up'){flash=null;draw()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','一年十二個月的圓圈，按 Enter 塗一個可以曬鹽的月份');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();for(var k=0;k<7;k++)if(!PAINT[NEED[k]]){paint(NEED[k]);break}}});
    later(function(){if(!done&&!Object.keys(PAINT).length)say(msg,'找到左上方的 <b>10 月</b>，從那裡按下去，順著時鐘的方向，經過 12 月，拖到 <b>4 月</b>。')},7000);
  }
};
</script>
