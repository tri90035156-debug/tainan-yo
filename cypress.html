<h1>落羽松任務・樹林・六甲落羽松</h1>
<p>坐火車到<b>六甲林鳳營</b>：開火車停在白線、讓天氣變冷把<b>落羽松</b>催紅、避開<b>膝根</b>走到步道、撿起像羽毛的小枝、種樹保護牧場的乳牛，最後拼好<b>菁埔埤</b>的紅樹倒影。</p>
<p>地點：六甲（臺南市六甲區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>六甲的林鳳營，有一大片落羽松樹林，有上千棵。夏天綠油油；冬天天氣變冷，葉子會變黃、變橘、變紅。六甲在臺灣南部，冬天比較暖，這裡的落羽松比較晚紅，大約過年前後最漂亮。坐火車到林鳳營，走進落羽松林，一路走到菁埔埤。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・林鳳營車站：慢慢停在林鳳營</h3><p>坐區間車往南，下一站是林鳳營。林鳳營車站是白色的木造車站，1933 年蓋的，已經九十多歲了，是歷史建築。下車以後，走過高架橋，就到落羽松林。</p><p>為什麼？為什麼叫林鳳營？ 傳說三百多年前，鄭成功的將軍林鳳帶著士兵來這裡屯田：一邊種田、一邊守衛。後來大家就用他的名字，叫這裡林鳳營。附近的新營、柳營，名字裡也都有一個營字。</p></li>
<li><h3>第 2 關・落羽松林：天氣冷，葉子變紅</h3><p>走進樹林，落羽松一棵一棵，又高又直，像尖尖的寶塔。落羽松的葉子，要等天氣變冷才會變色：先變黃，再變橘，最後變紅。冷一兩天還不夠，要冷好幾次才會紅。</p><p>為什麼？為什麼天氣冷，葉子會變紅？ 葉子裡有很多綠色，平常把別的顏色蓋住了。天氣變冷，綠色慢慢退掉，本來藏著的黃色就露出來，有的再變成紅色。</p></li>
<li><h3>第 3 關・膝根：小心，不要踩到膝根</h3><p>樹林裡的地濕濕的，地上冒出一根一根、像小木頭的東西。那是落羽松的膝根，也叫呼吸根。落羽松的老家在北美洲的沼澤。根泡在水裡，吸不到空氣，就長出冒出地面的根，幫忙呼吸。</p><p>為什麼？膝根為什麼叫膝根？ 它從地上冒出來，圓圓的、彎彎的，像人的膝蓋。它是幫落羽松呼吸的根，所以也叫呼吸根。</p></li>
<li><h3>第 4 關・落葉：像羽毛一樣落下</h3><p>風一吹，紅紅的葉子飄下來。仔細看：落羽松的葉子細細的，排成兩排，像羽毛。別的樹，葉子大多是一片一片掉；落羽松是連著小枝，一整條掉下來。名字裡的落羽，就像羽毛落下來。</p><p>為什麼？落羽松是松樹嗎？ 不是喔！落羽松是杉科的樹，和松樹不是同一家。它是冬天會落葉的樹：葉子變紅、掉光，春天再長出新葉子。</p></li>
<li><h3>第 5 關・林鳳營牧場：種樹保護乳牛</h3><p>樹林旁邊，是林鳳營牧場，養著很多乳牛。這一大片落羽松是誰種的？有一說：牧場為了防疫（不讓病菌傳進來），種樹把牧場和外面隔開，保護乳牛。後來樹長大了，變成大家來看的樹林。</p><p>為什麼？為什麼樹可以把牧場隔開？ 一大片樹像一道綠色的牆，把牧場和外面的路、人、車隔開，外面的東西比較不容易靠近乳牛。</p></li>
<li><h3>第 6 關・菁埔埤：拍一張紅樹倒影</h3><p>走到樹林旁邊的菁埔埤。埤是存水的大水塘，水是拿來灌溉農田的。水面平平的，紅紅的落羽松倒映在水裡，像上下兩排樹。旁邊還有區公所種的花海。</p><p>為什麼？埤是什麼？ 埤是存水的大水塘。下雨的時候把水存起來，要種田的時候，再把水送到田裡灌溉。</p></li>
</ol>

}

      sp-=dt;lastTw+=dt;
      if(sp<=0&&IT.length<7){var tw=lastTw>1.6||r()<.55;add(tw);if(tw)lastTw=0;sp=.8}
      IT.forEach(function(q){q.t+=dt;q.y+=q.v*dt});
      IT=IT.filter(function(q){if(q.y>170){var p=pos(q);if(ground.length<24)ground.push(q.tw?twig(p.x,172,(r()-.5)*30,.9,q.c):leaf1(p.x,173,(r()-.5)*60,1));return false}return true});
      pops.forEach(function(o){o.t+=dt*1.5});pops=pops.filter(function(o){return o.t<1});
      draw()});
    function got(q){var p=pos(q);IT.splice(IT.indexOf(q),1);n++;pops.push({x:p.x,y:p.y,t:0});draw();
      if(n>=6){done=true;IT=[];draw();lvDone(area,i,l,msg,'撿好了！')}
      else if(n===1)say(msg,'撿到一條！你看，葉子排成兩排，像<b>羽毛</b>。再撿 5 條。')}
    drag(svg,function(t,p){if(done||t!=='down'||t0<1.2)return;var best=null,bd=28;IT.forEach(function(q){var dd=dist(p,pos(q));if(dd<bd){bd=dd;best=q}});
      if(!best)return;
      if(best.tw)got(best);else say(msg,'這是<b>一片一片</b>的葉子，是別的樹的。要找<b>像羽毛</b>、一整條的小枝。',1)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','落羽松林，小枝和葉子飄下來，按 Enter 撿一條小枝');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();for(var k=0;k<IT.length;k++)if(IT[k].tw){got(IT[k]);return}add(true);n++;IT.pop();draw();if(n>=6){done=true;lvDone(area,i,l,msg,'撿好了！')}}});
  },

  /* 第 5 關：在小路上的圓點種樹（只有 3 排），把病菌擋在牧場外面，按「試試看」 */
  block:function(area,i,l){
    var N={P:{x:160,y:100},G1:{x:128,y:100},G2:{x:160,y:74},G3:{x:192,y:100},J1:{x:72,y:100},J2:{x:248,y:100},E1:{x:30,y:58},E2:{x:30,y:146},E3:{x:160,y:12},E4:{x:290,y:58},E5:{x:290,y:146}};
    var ED=[['E1','J1'],['E2','J1'],['J1','G1'],['E3','G2'],['E4','J2'],['E5','J2'],['J2','G3']];
    var SP=ED.map(function(e){return {x:(N[e[0]].x+N[e[1]].x)/2,y:(N[e[0]].y+N[e[1]].y)/2,on:false}});
    var RT=[['E1','J1','G1','P',0],['E2','J1','G1','P',0],['E3','G2','P',0],['E4','J2','G3','P',0],['E5','J2','G3','P',0]];
    var done=false,run=false,GM=[],leak=[],tries=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#C4CE90"><rect x="-400" y="176" width="1200" height="60" fill="#C4CE90"/>';
    ED.forEach(function(e){s+='<path d="M'+N[e[0]].x+' '+N[e[0]].y+'L'+N[e[1]].x+' '+N[e[1]].y+'" stroke="#E8DCC0" stroke-width="13" stroke-linecap="round"/>'});
    s+='<g id="lk"></g><rect x="122" y="70" width="76" height="60" rx="8" fill="#B4CC7C" stroke="#8A6A4A" stroke-width="2.4" stroke-dasharray="6 4"/>'+cow(148,112,.75)+cow(176,96,.6,-1)+
      '<text x="160" y="146" font-size="14" font-weight="700" fill="#3F5A2A" text-anchor="middle" stroke="#C4CE90" stroke-width="4" paint-order="stroke">牧場</text><g id="sp"></g><g id="gm"></g><g id="ct"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),spg=svg.querySelector('#sp'),gm=svg.querySelector('#gm'),ct=svg.querySelector('#ct'),lk=svg.querySelector('#lk');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    var b=bigBtn(area,'試試看');
    function used(){return SP.filter(function(q){return q.on}).length}
    function germ(x,y){return '<g transform="translate('+f1(x)+' '+f1(y)+')"><path d="M-8 0H8M0 -8V8M-6 -6L6 6M-6 6L6 -6" stroke="#7A4A98" stroke-width="1.6" stroke-linecap="round"/><circle r="5.5" fill="#9A6AB8"/><circle cx="-2" cy="-1" r="1" fill="#fff"/><circle cx="2" cy="-1" r="1" fill="#fff"/></g>'}
    function draw(){spg.innerHTML=SP.map(function(q){return q.on?cypress(q.x-9,q.y+8,.32,0)+cypress(q.x+1,q.y+10,.36,0)+cypress(q.x+10,q.y+8,.32,0):
        '<circle cx="'+f1(q.x)+'" cy="'+f1(q.y)+'" r="10" fill="#FFF8EC" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>'}).join('');
      gm.innerHTML=GM.map(function(g){return germ(g.x,g.y)}).join('');
      lk.innerHTML=leak.map(function(k){var R=RT[k],d='M'+R.slice(0,-1).map(function(n){return N[n].x+' '+N[n].y}).join('L');return '<path d="'+d+'" stroke="#DB2E27" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6"/>'}).join('');
      ct.innerHTML=done?'':'<rect x="214" y="160" width="96" height="24" rx="12" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.2"/><text x="262" y="177" font-size="14" font-weight="700" fill="#2A2020" text-anchor="middle">樹苗 '+(3-used())+' 排</text>';
      bar.style.width=(done?100:used()/3*60)+'%'}
    draw();
    function test(){if(run||done)return;run=true;leak=[];tries++;
      // 每隻病菌沿著路走；路上有種樹，就停在那排樹前面（樹在路段的正中間）
      GM=RT.map(function(R,k){var nd=R.slice(0,-1),pts=nd.map(function(n){return N[n]}),segs=[],L=0,lim=null;
        for(var a=0;a<pts.length-1;a++){var j=-1;ED.forEach(function(e,q){if((e[0]===nd[a]&&e[1]===nd[a+1])||(e[1]===nd[a]&&e[0]===nd[a+1]))j=q});
          var dd=dist(pts[a],pts[a+1]);if(lim===null&&j>=0&&SP[j].on)lim=L+dd/2-14;segs.push(dd);L+=dd}
        return {k:k,pts:pts,segs:segs,lim:lim===null?L:lim,stop:lim!==null,x:pts[0].x,y:pts[0].y,d:0}});
      var t=0;
      anim(function(dt){t+=dt;var all=true;
        GM.forEach(function(g){g.d=Math.min(g.lim,g.d+dt*70);if(g.d<g.lim)all=false;
          var rem=g.d;for(var a=0;a<g.segs.length;a++){if(rem<=g.segs[a]||a===g.segs.length-1){var f=Math.min(1,rem/g.segs[a]);g.x=g.pts[a].x+(g.pts[a+1].x-g.pts[a].x)*f;g.y=g.pts[a].y+(g.pts[a+1].y-g.pts[a].y)*f;break}rem-=g.segs[a]}});
        draw();
        if(all||t>4){run=false;leak=GM.filter(function(g){return !g.stop}).map(function(g){return g.k});
          if(!leak.length){done=true;if(b.parentNode)b.remove();draw();lvDone(area,i,l,msg,'每一條路都擋住了！');return false}
          say(msg,'有病菌從<b>紅色的路</b>跑進牧場了！'+(used()<3?'還有樹苗，種在那條路上。':'樹苗用完了：點已經種的樹可以拔起來，<b>種在靠近牧場</b>的地方，一排可以擋好幾條路。'),1);
          wait(function(){if(!done&&!run){GM=[];draw()}},1600);return false}})}
    b.addEventListener('click',test);
    drag(svg,function(t,p){if(done||run||t!=='down')return;var best=null,bd=24;SP.forEach(function(q){var dd=dist(p,q);if(dd<bd){bd=dd;best=q}});
      if(!best){say(msg,'點路上的<b>紅色虛線圓點</b>種樹。',1);return}
      if(best.on){best.on=false;leak=[];draw();say(msg,'拔起來了。再找一個地方種。');return}
      if(used()>=3){say(msg,'樹苗用完了！點已經種的樹，可以<b>拔起來</b>換地方。',1);return}
      best.on=true;leak=[];GM=[];draw();
      if(used()===3){say(msg,'3 排都種好了！按「<b>試試看</b>」。');into(b)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','牧場和通到牧場的小路，按 Enter 在靠近牧場的地方種樹');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done&&!run){e.preventDefault();SP.forEach(function(q,j){q.on=(j===2||j===3||j===6)});draw();test()}});
    later(function(){if(!done&&used()===0&&!tries)say(msg,'看看哪幾條路會通到<b>牧場</b>。有的路在半路上會合在一起喔！')},8000);
  },

  /* 第 6 關：照片被切成 5 條、上下歪掉，上下拖每一條，把落羽松和倒影對整齊 */
  strips:function(area,i,l){
    var DY=[-34,26,-20,38,-28],OK=[false,false,false,false,false],cur=-1,y0=0,d0=0,done=false;
    var pic='<rect x="-10" y="-80" width="340" height="176" fill="#DDEAF2"/><circle cx="262" cy="34" r="12" fill="#F7C948" opacity=".8"/><rect x="-10" y="88" width="340" height="10" fill="#8A7A58"/>';
    var tr='',r=rnd(7);for(var k=0;k<13;k++){var x=6+k*24+(r()-.5)*6,sc2=.78+r()*.3,c=r()<.65?3:r()<.6?2:1;tr+=cypress(x,92,sc2,c)}
    pic+=tr+'<rect x="-10" y="96" width="340" height="140" fill="#8EC5E0"/><g transform="translate(0 192) scale(1 -1)" opacity=".5">'+tr+'</g>'+
      '<path d="M20 130h40M110 150h50M200 124h36M240 160h44M60 168h30" stroke="#fff" stroke-width="1.6" opacity=".6" stroke-linecap="round"/>';
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#DDEAF2"><defs><g id="qpPic">'+pic+'</g>';
    for(var k2=0;k2<5;k2++)s+='<clipPath id="qpc'+k2+'"><rect x="'+(k2*64)+'" y="0" width="64" height="176"/></clipPath>';
    s+='</defs><g id="st"></g><rect x="-400" y="176" width="1200" height="60" fill="#B8A888"/><g id="fr"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),st=svg.querySelector('#st'),fr=svg.querySelector('#fr');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){var h='',g='';for(var k=0;k<5;k++){h+='<g clip-path="url(#qpc'+k+')"><g transform="translate(0 '+f1(DY[k])+')"><use href="#qpPic"/></g></g>';
        if(!done&&k)g+='<path d="M'+(k*64)+' 0V176" stroke="#FFF8EC" stroke-width="2.4"/>';
        if(!done&&k===cur)g+='<rect x="'+(k*64+2)+'" y="2" width="60" height="172" fill="none" stroke="#DB2E27" stroke-width="3"/>'}
      if(done)g='<text x="160" y="186" font-size="14" font-weight="700" fill="#FFF8EC" text-anchor="middle">菁埔埤的紅色落羽松</text>';
      st.innerHTML=h;fr.innerHTML=g;bar.style.width=(done?100:OK.filter(Boolean).length/5*90)+'%'}
    draw();
    function lock(k){DY[k]=0;OK[k]=true;var m=OK.filter(Boolean).length;
      if(m>=5){done=true;cur=-1;draw();lvDone(area,i,l,msg,'對整齊了！');return}
      draw();say(msg,['對齊一條了！','兩條了，樹和倒影慢慢接起來了。','三條了！','只剩最後一條！'][m-1])}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){var k=clamp(Math.floor(p.x/64),0,4);if(OK[k]){say(msg,'這一條已經對好了，換<b>別條</b>。');return}cur=k;y0=p.y;d0=DY[k];draw();return}
      if(t==='move'&&cur>=0){DY[cur]=clamp(d0+(p.y-y0),-60,60);draw();return}
      if(t==='up'&&cur>=0){var c=cur;cur=-1;if(Math.abs(DY[c])<8)lock(c);else{draw();say(msg,'還沒對齊。看旁邊那一條的<b>岸邊</b>，對到一樣高。',1)}}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','切成五條的菁埔埤照片，按 Enter 對齊一條');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();for(var k=0;k<5;k++)if(!OK[k]){lock(k);break}}});
    later(function(){if(!done&&OK.every(function(o){return !o}))say(msg,'按住一條，<b>往上或往下</b>拖，讓岸邊和旁邊的對齊。')},8000);
  }
};
</script>
