<h1>鹽山任務・鹽田・七股鹽山</h1>
<p>跟著以前在<b>七股鹽場</b>工作的阿公看<b>七股鹽山</b>：猜鹽山有多高、繞著山腳走 400 公尺、找出鹽山最怕的<b>雨季</b>、用澳洲的鹽補好裂縫、一階一階爬上山頂，再蓋好<b>鹽博館</b>的白色金字塔。</p>
<p>地點：七股鹽山（臺南市七股區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>七股鹽場在 1938 年開始曬鹽，是臺灣最大的曬鹽場。曬好的鹽，堆在堆置場，越堆越高。2002 年前後，七股鹽場不再曬鹽，最後一批鹽留了下來，變成一座白白的七股鹽山，第二年開放給大家參觀。跟著以前在鹽場工作的阿公，量鹽山、看雨季、補鹽山、爬上山頂。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・鹽山腳下：鹽山有多高</h3><p>站在鹽山腳下往上看，好高！阿公問：「你猜鹽山有多高？」鹽山大約有 6 層樓那麼高。2018 年量的時候，大約 18 公尺，裡面堆了3 萬多噸的鹽。</p><p>為什麼？鹽山為什麼會留下來？ 七股鹽場不再曬鹽的時候，最後曬好的一大堆鹽沒有運走，整座留了下來。台鹽就把它變成可以參觀的七股鹽山。</p></li>
<li><h3>第 2 關・繞一圈：繞著鹽山走一圈</h3><p>鹽山不只高，也很大：它占了大約 1 公頃的地，底座繞一圈，大約 400 公尺。阿公說：「我們沿著山腳走一圈，每走 100 公尺，就插一支小旗子。」</p><p>為什麼？1 公頃有多大？ 1 公頃，就是一塊100 公尺長、100 公尺寬的地。鹽山的底座，差不多就有這麼大。</p></li>
<li><h3>第 3 關・雨季：鹽山最怕雨</h3><p>鹽場的副場長說：「鹽山最怕雨。」鹽會溶在水裡，雨水一沖，表面就被沖掉；雨水滲進裂縫，裡面也會溶掉，表層就崩下來。2018 年報導，鹽山被雨溶掉，矮了大約 3 公尺。</p><p>為什麼？鹽為什麼怕雨？ 鹽會溶在水裡，就像糖放進水裡會不見一樣。鹽山是一整座鹽，雨下得越多，溶掉的就越多。</p></li>
<li><h3>第 4 關・修補：補好鹽山的裂縫</h3><p>雨季過後，鹽山上有裂縫，有的地方還崩了一塊。臺灣已經不曬鹽了，所以鹽場每 1、2 個月，就用從澳洲進口的鹽（叫艙底鹽），把裂縫和崩下去的地方補起來。</p><p>為什麼？為什麼用澳洲的鹽來補？ 臺灣在 2002 年前後就不再曬鹽了，鹽場沒有自己曬的新鹽。所以修補鹽山，就用從澳洲坐船運來的鹽。</p></li>
<li><h3>第 5 關・登頂：一階一階爬上去</h3><p>鹽場在鹽山上開了 2 條階梯，讓大家可以爬到山頂，往遠方看。阿公說：「階梯是鹽做的，一階一階慢慢走，不要跑、不要跳。」</p><p>為什麼？可以吃鹽山上的鹽嗎？ 不行！鹽山放在外面很多年，表面卡了很多灰塵，有的地方都黑黑的。看就好，不要舔、不要吃。</p></li>
<li><h3>第 6 關・鹽博館：白色的金字塔</h3><p>鹽山旁邊，有兩座白白的金字塔：那是台灣鹽博物館，屋頂就是照著鹽山的樣子做的。這幾年它正在整修，以後會改名叫台灣鹽產業展示館，用新的方法介紹臺灣曬鹽的故事。</p><p>為什麼？博物館整修好以後會怎樣？ 整修好以後，會改名叫台灣鹽產業展示館，用科技和互動的方法，讓臺灣曬鹽的歷史「動起來」。</p></li>
</ol>

        if(!dir){if(Math.abs(d)<.02)return;dir=d>0?1:-1}var nm=clamp(m+d*dir/(2*Math.PI)*400,(next-1)*100,410);th+=(nm-m)/400*2*Math.PI*dir;m=nm;draw();return}

  chart:function(area,i,l){
    var H=[2,3,4,6,13,14,15,16,9,3,2,2],X0=22,DX=25,G=150,S=6.4,P={},done=false,n=0,wrong=0;

      bar.style.width=(done?100:n/4*90)+'%'}

  patch:function(area,i,l){

    function draw(){var q=ST[cur],nx=ST[cur+1];pp.innerHTML=person(q.x,q.y+4,.6,'#DB2E27')+(nx&&!done?'<circle cx="'+nx.x+'" cy="'+(nx.y+4)+'" r="15" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>':'')+
        (done?'<path d="M'+(q.x-30)+' '+(q.y-40)+'q8 -4 16 0M'+(q.x+16)+' '+(q.y-46)+'q8 -4 16 0" stroke="#8A9AA8" stroke-width="2" fill="none"/>':'');
      ct.innerHTML='<rect x="8" y="6" width="96" height="24" rx="12" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.2"/><text x="56" y="23" font-size="14" font-weight="700" fill="#2A2020" text-anchor="middle">第 '+cur+'／7 階</text>';
      bar.style.width=(done?100:cur/7*90)+'%'}
    draw();
    function step(j){if(j<=cur){say(msg,'這一階已經走過了，點<b>上面</b>那一階。',1);return}
      if(j>cur+1){slip++;cur=Math.max(0,cur-1);draw();say(msg,'一次跳太多階，<b>滑下來</b>了！要<b>一階一階</b>走。',1);return}
      cur=j;draw();if(cur>=7){done=true;draw();lvDone(area,i,l,msg,'到山頂了！');return}
      say(msg,cur<3?'很好，一階一階慢慢走。':cur<6?'快到了，加油！':'最後一階！')}
    drag(svg,function(t,p){if(done||t!=='down')return;var k=-1,best=20;ST.forEach(function(q,j){var d=dist(p,{x:q.x,y:q.y+4});if(d<best){best=d;k=j}});if(k>=0)step(k)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','鹽山上的階梯，按 Enter 往上走一階');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();step(cur+1)}});
    later(function(){if(!cur&&!slip)say(msg,'點小人<b>右上方</b>紅色虛線圈圈的那一階。')},6000);
  },

  /* 第 6 關：拖三角形的尖尖，讓兩座金字塔變得跟虛線一樣大 */
  pyramid:function(area,i,l){
    var G=166,PY=[{x:158,t:86,h:34,ok:false},{x:268,t:50,h:22,ok:false}],hold=null,done=false;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EAF2F6"><rect x="-400" y="'+G+'" width="1200" height="60" fill="'+SAND+'"/>'+mountain(46,G,90,56)+
      '<text x="46" y="'+(G+18)+'" font-size="13" font-weight="700" fill="#5A4A3A" text-anchor="middle">鹽山</text><g id="tg"></g><g id="py"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),tg=svg.querySelector('#tg'),py=svg.querySelector('#py');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){tg.innerHTML=PY.map(function(p){return p.ok?'':'<path d="M'+f1(p.x-p.t*.8)+' '+G+'L'+p.x+' '+f1(G-p.t)+'L'+f1(p.x+p.t*.8)+' '+G+'Z" fill="none" stroke="#8A7A70" stroke-width="2" stroke-dasharray="5 4"/>'}).join('');
      py.innerHTML=PY.map(function(p){return pyramid(p.x,G,p.h)+(p.ok?'':'<circle cx="'+p.x+'" cy="'+f1(G-p.h)+'" r="12" fill="#DB2E27" opacity=".85"/><path d="M'+p.x+' '+f1(G-p.h-5)+'V'+f1(G-p.h+5)+'" stroke="#fff" stroke-width="2"/>')}).join('');
      bar.style.width=(done?100:PY.filter(function(p){return p.ok}).length/2*90)+'%'}
    draw();
    function check(p){if(Math.abs(p.h-p.t)<=7){p.h=p.t;p.ok=true;draw();
        if(PY.every(function(q){return q.ok})){done=true;draw();lvDone(area,i,l,msg,'兩座金字塔都一樣大了！');return}
        say(msg,'一樣大了！再拉另一座。')}
      else say(msg,p.h<p.t?'還<b>太矮</b>，再往上拉一點。':'太<b>高</b>了，往下一點。',1)}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){var k=null,best=26;PY.forEach(function(q){if(q.ok)return;var d=dist(p,{x:q.x,y:G-q.h});if(d<best){best=d;k=q}});if(k)hold=k;else say(msg,'按住三角形尖尖上的<b>紅點</b>，往上拖。',1);return}
      if(t==='move'&&hold){hold.h=clamp(G-p.y,16,130);draw();return}
      if(t==='up'&&hold){var q=hold;hold=null;check(q)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','鹽山旁邊兩座金字塔，按 Enter 拉好一座');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var q=PY.filter(function(q){return !q.ok})[0];q.h=q.t;check(q)}});
    later(function(){if(!done&&!PY[0].ok&&!PY[1].ok)say(msg,'按住左邊三角形尖尖上的<b>紅點</b>，往上拖到虛線的尖尖。')},6000);
  }
};
