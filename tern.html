<body>
<div class="app">
  <header>
    <a class="home" href="index.html" aria-label="回到首頁"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg></a>
    <h1>鳥龍捲任務</h1>
    <button class="chips" id="chips" type="button" aria-label="看回顧"></button>
  </header>
  <div class="top" id="top"></div>
  <div class="stage" id="stage">
    <div class="disc">
      <svg id="map" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="北門潟湖、井仔腳插畫地圖"></svg>
      <div id="scene" hidden></div>
    </div>
    <div class="era" role="group" aria-label="切換白天黃昏"><button type="button" data-era="past" aria-pressed="true">白天</button><button type="button" data-era="now" aria-pressed="false">黃昏</button></div>
    <button id="peek" type="button" hidden>這關在哪</button>
  </div>
  <main id="card" aria-live="polite"></main>
  <nav class="foot"><button type="button" id="pv">‹ 上一關</button><span id="pos"></span><button type="button" id="nx">下一關 ›</button></nav>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="任務單"><div class="in"><div id="sheetDoc"></div><button class="x" type="button" id="sheetX">收起任務單</button></div></div>

<script>

/* ---------- 插畫元件 ---------- */
var K='#2A2020',OL='#B9AEA3',TG='#D3D9DF',LEG='#A8322D',NS='http://www.w3.org/2000/svg';
// 黑腹燕鷗的頭（冬天的羽毛：頭頂淡淡的，眼睛後面到後腦勺一塊黑）
function thead(x,y,sl){
  return '<circle cx="'+x+'" cy="'+y+'" r="4" fill="#fff" stroke="'+OL+'" stroke-width="1.2"/>'+
    '<path d="M'+(x-1.2)+' '+(y-1.6)+'Q'+(x+1.4)+' '+(y-4.6)+' '+(x+4)+' '+(y-1.2)+'Q'+(x+3.4)+' '+(y+1.6)+' '+(x+1.2)+' '+(y+1.4)+'Q'+(x+.2)+' '+(y-.2)+' '+(x-1.2)+' '+(y-.4)+'Z" fill="'+K+'"/>'+
    (sl?'<path d="M'+(x-3)+' '+(y-.4)+'q1 1 2 0" stroke="'+K+'" stroke-width=".8" fill="none"/>'
      :'<circle cx="'+(x-1.9)+'" cy="'+(y-.8)+'" r=".9" fill="'+K+'"/><path d="M'+(x-3.6)+' '+(y-.8)+'L'+(x-10)+' '+(y+.6)+'L'+(x-3.6)+' '+(y+1.2)+'Z" fill="'+K+'"/>');
}
// 黑腹燕鷗（臉朝左）。o：fly 飛（翅膀往上）、down 飛（翅膀往下）、sleep 睡覺。停著的時候 (0,0) 是腳底，飛的時候 (0,0) 是身體中間
function tern(x,y,s,o){
  o=o||'';var h='<g transform="translate('+x+' '+y+') scale('+(s||1)+')">';
  if(o.indexOf('fly')>=0||o.indexOf('down')>=0){
    var d=o.indexOf('down')>=0?-1:1;
    h+='<path d="M-1 '+(-2*d)+'Q4 '+(-12*d)+' 11 '+(-20*d)+'Q9 '+(-9*d)+' 6 '+(-2*d)+'Z" fill="#BFC6CD"/>'+
      '<path d="M9 -1L19 -4.5L15.5 0L19 4L9 1Z" fill="#fff" stroke="'+OL+'" stroke-width="1" stroke-linejoin="round"/>'+
      '<ellipse cx="1" cy="0" rx="10" ry="3.8" fill="#fff" stroke="'+OL+'" stroke-width="1.2"/>'+thead(-10,-1.5)+
      '<path d="M-4 '+(-1*d)+'Q-1 '+(-13*d)+' 5 '+(-22*d)+'Q7 '+(-10*d)+' 4 '+(-1*d)+'Z" fill="'+TG+'" stroke="'+OL+'" stroke-width=".8" stroke-linejoin="round"/>';
    return h+'</g>';
  }
  var sl=o.indexOf('sleep')>=0;
  h+='<path d="M-1 -4.5V0M3 -4.5V0" stroke="'+LEG+'" stroke-width="1.6" stroke-linecap="round"/>'+
    '<path d="M10 -9L19 -11.5L16 -8.6L19 -6.5Z" fill="#fff" stroke="'+OL+'" stroke-width="1"/>'+
    '<ellipse cx="2" cy="-8" rx="10" ry="5" fill="#fff" stroke="'+OL+'" stroke-width="1.2"/>'+
    '<path d="M-5 -11Q6 -14.5 21 -9.5Q8 -5.5 -3 -7Z" fill="'+TG+'" stroke="'+OL+'" stroke-width=".8" stroke-linejoin="round"/>'+
    thead(sl?-6:-8,sl?-11:-13.5,sl);
  return h+'</g>';
}
// 遠遠看的鳥（黃昏的剪影）
function vbird(){return '<path d="M-4 -1.6Q-2 -3.4 0 0Q2 -3.4 4 -1.6" stroke="#3B2A35" stroke-width="1.4" fill="none" stroke-linecap="round"/>'}
// 白鷺鷥（臉朝左，(0,0) 是腳底）
function egret(x,y,s){return '<g transform="translate('+x+' '+y+') scale('+s+')"><path d="M1 -20V0M5 -20V0" stroke="'+K+'" stroke-width="1.8" stroke-linecap="round"/><path d="M-2 0H3M2 0H7" stroke="#E8C53A" stroke-width="1.8" stroke-linecap="round"/>'+
  '<path d="M-6 -27Q-13 -33 -9 -40Q-5 -46 -10 -50" stroke="'+OL+'" stroke-width="5.4" fill="none" stroke-linecap="round"/><path d="M-6 -27Q-13 -33 -9 -40Q-5 -46 -10 -50" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round"/>'+
  '<ellipse cx="4" cy="-24" rx="12" ry="6.5" fill="#fff" stroke="'+OL+'" stroke-width="1.2" transform="rotate(-18 4 -24)"/>'+
  '<circle cx="-11" cy="-51" r="3.8" fill="#fff" stroke="'+OL+'" stroke-width="1.2"/><circle cx="-12.4" cy="-51.6" r=".9" fill="'+K+'"/><path d="M-14.4 -52L-27 -50.6L-14.4 -49.6Z" fill="'+K+'"/></g>'}
// 鸕鶿（全身黑，臉朝左，(0,0) 是腳底）
function cormo(x,y,s){return '<g transform="translate('+x+' '+y+') scale('+s+')"><path d="M-2 -5V0M3 -5V0" stroke="'+K+'" stroke-width="2.2" stroke-linecap="round"/><path d="M5 -6L11 2" stroke="#2E2B2B" stroke-width="4" stroke-linecap="round"/><path d="M-3 -26Q-8 -33 -4 -40" stroke="#2E2B2B" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="1" cy="-15" rx="7.5" ry="12" fill="#2E2B2B" transform="rotate(10 1 -15)"/>'+
  '<circle cx="-5" cy="-41" r="4.6" fill="#2E2B2B"/><path d="M-7 -39.5Q-5 -37 -2 -38.5" stroke="#F2F0EA" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="-6.6" cy="-42" r="1" fill="#E9D27A"/><path d="M-9 -42L-18 -41Q-19.5 -39 -17.5 -39.4L-9 -40Z" fill="#7A7068"/></g>'}
// 黑面琵鷺（臉朝左，(0,0) 是腳底）
function spoon(x,y,s){
  return '<g transform="translate('+x+' '+y+') scale('+s+') translate(0 -22)"><path d="M-2 7L-4 22M5 7L7 22" stroke="'+K+'" stroke-width="2.2" stroke-linecap="round"/><path d="M-8 22H-1M4 22H11" stroke="'+K+'" stroke-width="1.8" stroke-linecap="round"/>'+
    '<path d="M-6 -4Q-13 -12 -11 -20" stroke="'+OL+'" stroke-width="8.6" fill="none" stroke-linecap="round"/>'+
    '<ellipse cx="3" cy="0" rx="15" ry="9" fill="#fff" stroke="'+OL+'" stroke-width="1.5"/><path d="M10 -3Q14 0 17 -1" stroke="'+OL+'" stroke-width="1.2" fill="none"/>'+
    '<path d="M-6 -4Q-13 -12 -11 -20" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>'+
    '<circle cx="-11" cy="-22" r="6" fill="#fff" stroke="'+OL+'" stroke-width="1.5"/>'+
    '<path d="M-11 -28A6 6 0 0 0 -11 -16Q-14.5 -18 -16.5 -22Q-14.5 -26 -11 -28Z" fill="'+K+'"/><circle cx="-13" cy="-23" r="1" fill="#fff"/>'+
    '<path d="M-16 -24.5L-30 -21Q-36 -20 -35 -16Q-34 -13 -29 -15L-16 -20Z" fill="'+K+'"/></g>';
}
// 蚵棚：竹竿插在水裡，橫竿下面吊著一串一串的牡蠣。birds 是停在上面的燕鷗（'sit' 停著、'sleep' 睡覺）
function rackSvg(x,y,s,birds){
  var h='<g transform="translate('+x+' '+y+') scale('+(s||1)+')"><path d="M-22 -16V8M-8 -16V8M8 -16V8M22 -16V8" stroke="#8A6A48" stroke-width="2.2" stroke-linecap="round"/><path d="M-25 -16H25" stroke="#6E5236" stroke-width="2.8" stroke-linecap="round"/>';
  [-15,0,15].forEach(function(q){h+='<path d="M'+q+' -16V2" stroke="#C9B79C" stroke-width="1.2"/><ellipse cx="'+q+'" cy="-8" rx="2.2" ry="1.6" fill="#B7AFA4"/><ellipse cx="'+q+'" cy="-2" rx="2.2" ry="1.6" fill="#B7AFA4"/>'});
  if(birds)h+=tern(-14,-16,.62,birds)+tern(1,-16,.62,birds)+tern(15,-16,.62,birds);
  return h+'</g>';
}
function boatSvg(x,y,s){return '<g transform="translate('+x+' '+y+') scale('+s+')"><path d="M-20 0H20Q18 8 12 9H-14Q-19 7 -20 0Z" fill="#C0583F" stroke="#7A3A2A" stroke-width="1.4"/><path d="M-20 0H20" stroke="#F3E8D6" stroke-width="1.6"/><rect x="-4" y="-9" width="8" height="9" rx="2" fill="#F3E8D6" stroke="#7A3A2A" stroke-width="1.2"/></g>'}
function fishSvg(kind){return kind?'<path d="M-6 3Q-3 -6 6 -2" stroke="#F09A8A" stroke-width="3.6" fill="none" stroke-linecap="round"/><path d="M-6 3L-9 0M-6 3L-9 5" stroke="#F09A8A" stroke-width="1.5"/>':'<path d="M-7 0Q0 -5 6 0Q0 5 -7 0Z" fill="#E8C27A"/><path d="M6 0L11 -4V4Z" fill="#E8C27A"/><circle cx="-4" cy="-1" r=".9" fill="#5A3E2B"/>'}
var ICON={
  eye:'<circle cx="3" cy="1" r="7" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M-4 -1L-12 1.5L-4 3Z" fill="#fff"/><path d="M2 -2Q6 -5.5 9.5 0Q8 3 5.5 3Q4.5 0 2 -2Z" fill="#fff"/>',
  fish:'<path d="M-10 0Q-1 -8 7 0Q-1 8 -10 0Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M7 0L11 -5V5Z" fill="#fff"/><circle cx="-5" cy="-1" r="1.4" fill="#fff"/>',
  swirl:'<path d="M1 0A1.5 1.5 0 1 0 -2 0A3.5 3.5 0 1 0 5 0A5.5 5.5 0 1 0 -6 0A7.5 7.5 0 1 0 9 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>',
  rack:'<path d="M-10 -5H10M-8 -7V9M0 -7V9M8 -7V9" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M-11 5Q-5.5 2 0 5T11 5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>',
  boat:'<path d="M-11 2H11L7 8H-7Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M-3 2V-6H4V2" stroke="#fff" stroke-width="2" fill="none" stroke-linejoin="round"/><circle cx="0" cy="-10" r="1.6" fill="#fff"/>',
  fly:'<path d="M-11 2Q-5 -6 0 1Q5 -6 11 2" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -4V-11M-3 -8L0 -11L3 -8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
};
function icon(k){return '<svg viewBox="-12 -12 24 24" aria-hidden="true">'+ICON[k]+'</svg>'}
function rnd(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280}}

// 開場的認鳥圖：大大的鳥，加上幾個認得出牠的特徵
function idCard(t1,t2,art,C){
  var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EAF5F8" role="img" aria-label="'+t1+'的樣子"><rect x="-400" y="172" width="1200" height="60" fill="#E9DDBF"/>'+art;
  C.forEach(function(c){s+='<path d="M'+c[3]+' '+c[4]+'L'+c[1]+' '+(c[2]-5)+'" stroke="#8A7A70" stroke-width="1.2"/><circle cx="'+c[3]+'" cy="'+c[4]+'" r="2.6" fill="#DB2E27"/>'+
    '<text x="'+c[1]+'" y="'+c[2]+'" font-size="15" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#EAF5F8" stroke-width="4" paint-order="stroke">'+c[0]+'</text>'});
  return s+'<text x="160" y="34" font-size="24" font-weight="900" fill="#2A2020" text-anchor="middle" font-family="Noto Serif TC,Songti TC,serif" stroke="#EAF5F8" stroke-width="4" paint-order="stroke">'+t1+'</text>'+(t2?'<text x="160" y="190" font-size="14" font-weight="700" fill="#7A5A3A" text-anchor="middle">'+t2+'</text>':'')+'</svg>';
}

/* ---------- 地圖 ---------- */
// 示意圖：左邊是臺灣海峽，海邊一條長長的沙洲圍出北門潟湖；潟湖東岸是井仔腳鹽田和北門，南邊是蘆竹溝漁港和將軍溪
var STOPS=[{lv:1,n:'北門潟湖',x:262,y:150,k:'lagoon'},{lv:2,n:'魚塭',x:600,y:196,k:'pond'},{lv:3,n:'井仔腳鹽田',x:424,y:118,k:'salt'},{lv:4,n:'蚵棚',x:262,y:334,k:'rack'},{lv:5,n:'蘆竹溝漁港',x:352,y:494,k:'port'},{lv:6,n:'飛回北方',x:240,y:40,k:'north'}];
function marker(s){
  var t='<g transform="translate('+s.x+' '+s.y+')">';
  if(s.k==='lagoon')return t+'<ellipse cy="8" rx="30" ry="9" fill="#8FCBE0"/>'+tern(-10,-6,.8,'fly')+tern(13,0,.66,'down')+'</g>';
  if(s.k==='pond')return t+'<rect x="-24" y="-4" width="48" height="22" rx="4" fill="#7CC3DB" stroke="#F7EEDA" stroke-width="3"/>'+tern(2,-12,.8,'fly')+'</g>';
  if(s.k==='salt')return t+'<rect x="-24" y="-2" width="48" height="20" rx="2" fill="#D9D3C8" stroke="#F7EEDA" stroke-width="2"/><path d="M-24 8H24M-8 -2V18M8 -2V18" stroke="#B5ADA0" stroke-width="1"/><path d="M-16 6L-9 -8L-2 6Z" fill="#fff" stroke="#C9C1B4"/><path d="M4 8L10 -3L16 8Z" fill="#fff" stroke="#C9C1B4"/></g>';
  if(s.k==='rack')return t+'<ellipse cy="8" rx="30" ry="8" fill="#8FCBE0"/>'+rackSvg(0,8,.9,'sit')+'</g>';
  if(s.k==='port')return t+'<rect x="8" y="-2" width="26" height="7" fill="#8A6A48"/><path d="M28 -2V-20" stroke="#7A6A5A" stroke-width="2.4"/><circle cx="28" cy="-22" r="4" fill="#FFD66B"/>'+boatSvg(-6,6,.9)+'</g>';
  return t+'<path d="M0 14V-14M-9 -5L0 -14L9 -5" stroke="#DB2E27" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'+tern(22,4,.7,'fly')+'</g>';
}
function buildMap(){
  var h='<defs><pattern id="wave" width="40" height="22" patternUnits="userSpaceOnUse"><path d="M4 12q6 -6 12 0t12 0" stroke="#fff" stroke-opacity=".55" stroke-width="2" fill="none" stroke-linecap="round"/></pattern></defs>';
  h+='<rect x="-400" y="-300" width="1600" height="1200" fill="#9ED9EC"/><rect x="-400" y="-300" width="1600" height="1200" fill="url(#wave)"/>';
  // 潟湖：沙洲和陸地中間比較淺的海水
  h+='<rect x="180" y="-300" width="260" height="1000" fill="#B8E4EF"/>';
  // 沙洲
  h+='<path d="M170 -300Q196 100 186 300Q178 460 206 640Q196 650 190 640Q160 460 172 300Q182 100 156 -300Z" fill="#F3E2BC"/>';
  // 陸地
  h+='<path d="M330 -300H1200V900H430C424 760 402 640 396 590C390 548 372 520 366 470C360 420 346 380 352 320C358 260 344 220 352 170C358 120 340 80 318 40C300 10 316 -120 330 -300Z" fill="#EFE3C4"/>';
  h+='<g id="ponds"></g><g id="pans"></g><g id="racks"></g>';
  // 將軍溪
  h+='<path d="M900 604C780 580 660 606 560 584S450 570 398 574" stroke="#7CC7E0" stroke-width="22" fill="none" stroke-linecap="round"/>';
  var T=function(t,x,y,sz,c){return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" fill="'+c+'" text-anchor="middle" stroke="#EFE3C4" stroke-width="4" paint-order="stroke">'+t+'</text>'};
  h+=T('北門',604,398,24,'#7A4A2E')+'<text x="620" y="560" font-size="15" fill="#2E7FA0" text-anchor="middle">將軍溪</text><text x="96" y="470" font-size="17" fill="#2E7FA0" text-anchor="middle">臺灣海峽</text><text x="150" y="236" font-size="13" fill="#9A8460" text-anchor="middle">沙洲</text>';
  h+='<g transform="translate(640 470)"><circle r="16" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.5"/><path d="M0 -11L5 4L0 1L-5 4Z" fill="#DB2E27"/><text y="12" font-size="9" fill="#5A4E48" text-anchor="middle">北</text></g>';
  // 白天：燕鷗飛到魚塭找東西吃
  h+='<g id="past"><circle cx="520" cy="-14" r="24" fill="#FFD66B" opacity=".9"/>';
  [[536,146],[574,124],[652,158],[694,250],[520,250]].forEach(function(p,k){h+=tern(p[0],p[1],.8,k%2?'down':'fly')});
  h+=T('白天：燕鷗飛去魚塭找東西吃',560,306,14,'#6C2024')+'</g>';
  // 黃昏：鳥群回到潟湖，轉圈圈以後停在蚵棚上
  h+='<g id="now"><rect x="-400" y="-300" width="1600" height="1200" fill="#3B2350" opacity=".38"/><circle cx="84" cy="330" r="26" fill="#F48A54" opacity=".95"/>';
  var r=rnd(11);for(var k=0;k<40;k++){var a=r()*6.283,hh=r(),rr=46-hh*34;h+='<g transform="translate('+(300+rr*Math.cos(a)).toFixed(1)+' '+(212+hh*60+rr*.25*Math.sin(a)).toFixed(1)+') scale(1.6)">'+vbird()+'</g>'}
  [[218,286],[238,286],[296,384],[316,384],[214,410]].forEach(function(p){h+=tern(p[0],p[1],.5,'sleep')});
  h+='<text x="560" y="306" font-size="14" fill="#FFE9C8" text-anchor="middle" stroke="#3B2350" stroke-width="4" paint-order="stroke">黃昏：鳥群回到潟湖，停在蚵棚上</text></g>';
  STOPS.forEach(function(s){h+='<g class="stop" data-lv="'+s.lv+'" role="button" aria-label="第 '+s.lv+' 關 '+s.n+'">'+marker(s)+'<circle cx="'+(s.x+22)+'" cy="'+(s.y-24)+'" r="10" fill="#fff" stroke="#E2574C" stroke-width="2"/><text x="'+(s.x+22)+'" y="'+(s.y-19.5)+'" font-size="13" fill="#E2574C" text-anchor="middle">'+s.lv+'</text><text x="'+s.x+'" y="'+(s.y+32)+'" font-size="16" font-weight="700" fill="#5A3E2B" text-anchor="middle" stroke="#FFF8EC" stroke-width="4" paint-order="stroke">'+s.n+'</text></g>'});

    svg.addEventListener('pointerdown',function(e){var p=toSvg(svg,e),c=Math.floor((p.x-X0)/C),r=Math.floor((p.y-Y0)/C),dr=r-pos[0],dc=c-pos[1];if(Math.abs(dr)+Math.abs(dc)===1)move(dr,dc)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','潟湖的畫面，可以用方向鍵開船');
    svg.addEventListener('keydown',function(e){var d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(d){e.preventDefault();move(d[0],d[1])}});
  },

  /* 第 6 關：把 4 塊地圖拖回去，拼出回家的路 */
  puzzle:function(area,i,l){
    var BX=80,BY=30,PW=80,PH=60,S=.5,TRAY=[[12,40],[12,118],[268,40],[268,118]],pcs=[],held=null,fx=0,fy=0,placed=0,done=false;
    var ROUTE='M116 90Q104 70 92 56T42 38';
    function art(){
      return '<rect width="160" height="120" fill="#9ED9EC"/>'+
        '<path d="M0 0H134Q120 14 102 22Q80 30 68 46Q58 62 54 80Q48 100 32 112Q16 120 0 118Z" fill="#EFE3C4"/>'+
        '<path d="M116 68Q124 60 130 68Q135 86 129 104Q123 116 117 108Q110 92 116 68Z" fill="#EFE3C4" stroke="#C9B48A" stroke-width="1"/>'+
        '<text x="12" y="20" font-size="13" font-weight="700" fill="#6C2024">北方</text><text x="12" y="31" font-size="9.5" fill="#5A4E48">生寶寶的地方</text>'+
        '<text x="138" y="80" font-size="9.5" fill="#7A4A2E">臺灣</text><text x="84" y="110" font-size="9.5" fill="#2E7FA0" text-anchor="middle">臺灣海峽</text>'+
        '<path d="'+ROUTE+'" fill="none" stroke="#DB2E27" stroke-width="2.2" stroke-dasharray="4 3"/><path d="M48 33L41 38L49 42" fill="none" stroke="#DB2E27" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'+
        '<circle cx="116" cy="90" r="3.2" fill="#DB2E27"/><text x="112" y="100" font-size="9.5" font-weight="700" fill="#2A2020" text-anchor="end" stroke="#9ED9EC" stroke-width="2" paint-order="stroke">北門</text>'+
        tern(96,62,.32,'fly')+tern(70,46,.32,'down')+
        '<g transform="translate(148 14)"><path d="M0 -8L4 4L0 1L-4 4Z" fill="#DB2E27"/><text y="12" font-size="8.1" fill="#5A4E48" text-anchor="middle">北</text></g>';
    }
    var A=art(),s='<svg class="mini" viewBox="0 0 320 190" style="background:#F6EEDC"><defs>';
    for(var k=0;k<4;k++)s+='<clipPath id="pz'+k+'"><rect width="'+PW+'" height="'+PH+'"/></clipPath>';
    s+='</defs><rect x="-400" y="168" width="1200" height="60" fill="#E6D5B5"/>'+
      '<g id="board"><rect x="'+BX+'" y="'+BY+'" width="160" height="120" fill="#fff" stroke="#BD9558" stroke-width="2" stroke-dasharray="5 4"/><g opacity=".16" transform="translate('+BX+' '+BY+')">'+A+'</g><path d="M'+(BX+80)+' '+BY+'V'+(BY+120)+'M'+BX+' '+(BY+60)+'H'+(BX+160)+'" stroke="#BD9558" stroke-width="1.2" stroke-dasharray="3 4"/></g><g id="pcs"></g><g id="fl" transform="translate('+BX+' '+BY+')"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),pg=svg.querySelector('#pcs');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    var order=[0,1,2,3].sort(function(){return Math.random()-.5});
    if(order.every(function(k,j){return k===j}))order=[3,2,1,0];
    order.forEach(function(k,j){
      var g=document.createElementNS(NS,'g'),ox=(k%2)*PW,oy=Math.floor(k/2)*PH;g.style.cursor='grab';
      g.innerHTML='<rect width="'+PW+'" height="'+PH+'" fill="#fff"/><g clip-path="url(#pz'+k+')"><g transform="translate('+(-ox)+' '+(-oy)+')">'+A+'</g></g><rect width="'+PW+'" height="'+PH+'" fill="none" stroke="#8A7A70" stroke-width="1.6"/>';
      pg.appendChild(g);var p={k:k,el:g,tx:BX+ox,ty:BY+oy,home:TRAY[j],x:0,y:0,s:S,ok:false};pcs.push(p);set(p,TRAY[j][0],TRAY[j][1],S);
    });
    function set(p,x,y,sc){p.x=x;p.y=y;p.s=sc;p.el.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+sc+')')}
    function lock(p){set(p,p.tx,p.ty,1);p.ok=true;p.el.style.cursor='';pg.insertBefore(p.el,pg.firstChild);placed++;bar.style.width=(placed/4*100)+'%';
      if(placed>=4)complete();else say(msg,'放對了！還有 '+(4-placed)+' 塊。')}
    function complete(){
      done=true;svg.querySelector('#board').style.display='none';say(msg,'拼好了！看，黑腹燕鷗出發了⋯⋯');
      var fl=svg.querySelector('#fl'),path=document.createElementNS(NS,'path');path.setAttribute('d',ROUTE);path.setAttribute('fill','none');fl.appendChild(path);
      var L=path.getTotalLength(),bs=[0,1,2].map(function(){var g=document.createElementNS(NS,'g');fl.appendChild(g);return g}),t0=performance.now(),raf=0;
      (function fly(now){var q=Math.min(1,(now-t0)/(reduce?1:2400));
        bs.forEach(function(g,j){var d=Math.max(0,Math.min(1,q*1.3-j*.15)),pt=path.getPointAtLength(L*d);g.setAttribute('transform','translate('+pt.x.toFixed(1)+' '+(pt.y+(j-1)*5).toFixed(1)+')');g.innerHTML=tern(0,0,.42,Math.floor(now/170+j)%2?'down':'fly')});
        if(q<1)raf=requestAnimationFrame(fly)})(t0);
      loops.push(function(){cancelAnimationFrame(raf)});
      later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},reduce?0:2500);
    }
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){held=null;for(var j=pcs.length-1;j>=0;j--){var q=pcs[j];if(q.ok)continue;var w=PW*q.s,h=PH*q.s;if(p.x>q.x-10&&p.x<q.x+w+10&&p.y>q.y-10&&p.y<q.y+h+10){held=q;break}}
        if(!held)return;fx=Math.max(0,Math.min(1,(p.x-held.x)/(PW*held.s)));fy=Math.max(0,Math.min(1,(p.y-held.y)/(PH*held.s)));pg.appendChild(held.el);set(held,p.x-fx*PW,p.y-fy*PH,1);return}
      if(!held)return;
      if(t==='move'){set(held,Math.max(-20,Math.min(260,p.x-fx*PW)),Math.max(-10,Math.min(150,p.y-fy*PH)),1);return}
      if(t==='up'){var q=held;held=null;
        if(Math.hypot(q.x-q.tx,q.y-q.ty)<28){lock(q);return}
        var wrong=pcs.some(function(o){return Math.hypot(q.x-o.tx,q.y-o.ty)<28});
        set(q,q.home[0],q.home[1],S);
        if(wrong)say(msg,'這塊不是放這裡。看看<b>海岸線</b>和<b>紅色虛線</b>，接得起來嗎？',1);
      }
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','拼圖的畫面，按 Enter 放好一塊');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var q=pcs.filter(function(o){return !o.ok})[0];if(q)lock(q)}});
    later(function(){if(!placed&&!done)say(msg,'用手指<b>按住</b>旁邊的一小塊地圖，拖到中間虛線框裡對的位置。')},9000);
  }
};
