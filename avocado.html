<body>
<div class="app">
  <header>
    <a class="home" href="index.html" aria-label="回到首頁"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg></a>
    <h1>酪梨任務</h1>
    <button class="chips" id="chips" type="button" aria-label="看回顧"></button>
  </header>
  <div class="top" id="top"></div>
  <div class="stage" id="stage">
    <div class="disc">
      <svg id="map" class="now" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="大內酪梨園插畫地圖"></svg>
      <div id="scene" hidden></div>
    </div>
    <div class="era" role="group" aria-label="切換開花時和結果時"><button type="button" data-era="past" aria-pressed="false">開花時</button><button type="button" data-era="now" aria-pressed="true">結果時</button></div>
    <button id="peek" type="button" hidden>這關在哪</button>
  </div>
  <main id="card" aria-live="polite"></main>
  <nav class="foot"><button type="button" id="pv">‹ 上一關</button><span id="pos"></span><button type="button" id="nx">下一關 ›</button></nav>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="任務單"><div class="in"><div id="sheetDoc"></div><button class="x" type="button" id="sheetX">收起任務單</button></div></div>

<script>

/* ---------- 插畫元件 ---------- */
var K='#2A2020',NS='http://www.w3.org/2000/svg';
var SKIN='#4F7A2E',SKIN2='#33521F',RIM='#BFD46A',FLESH='#ECE8A8',SEED='#8A5A36',LEAFC='#4E8A3A',LEAFD='#3C6E2C',STEMG='#5E8A3A',STEMY='#D8B43A';
function f1(v){return (Math.round(v*10)/10).toString()}
function rnd(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280}}
// 酪梨（西洋梨的形狀）。(x,y) 是果子中間；o：c 皮的顏色、stem 果梗長度、sc 果梗顏色、dots 小黃點幾個、dull 沒光澤、bite 被蟲咬、wr 皺皺的
var AVP='M0 -13C4 -13 5.5 -8 6.5 -3C10 3 10.5 14 0 14C-10.5 14 -10 3 -6.5 -3C-5.5 -8 -4 -13 0 -13Z';
function avo(x,y,s,o){
  o=o||{};var c=o.c||SKIN,L=o.stem==null?5:o.stem,h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+s+')">';
  if(L>0)h+='<path d="M0 -12V'+f1(-13-L)+'" stroke="'+(o.sc||STEMG)+'" stroke-width="'+(o.sw||2.2)+'" stroke-linecap="round"/>';
  h+='<path d="'+AVP+'" fill="'+c+'" stroke="#2C461B" stroke-width=".8"/>';
  if(o.wr)h+='<path d="M-6 -2Q-3 0 -6 3M4 -5Q7 -2 4 1M-3 6Q0 8 -3 11M5 5Q8 8 5 11" stroke="#22301A" stroke-width=".9" fill="none" stroke-linecap="round"/>';
  if(o.black)h+='<circle cx="-3" cy="2" r="3" fill="#1F2418" opacity=".8"/><circle cx="4" cy="7" r="2.4" fill="#1F2418" opacity=".8"/><circle cx="2" cy="-5" r="1.6" fill="#1F2418" opacity=".8"/>';
  if(o.dots){var r=rnd(o.seed||3);for(var k=0;k<o.dots;k++){var a=r()*6.28,rr=Math.sqrt(r());h+='<circle cx="'+f1(Math.cos(a)*rr*6.4)+'" cy="'+f1(3+Math.sin(a)*rr*9)+'" r=".8" fill="#EDE27E"/>'}}
  if(o.bite)h+='<circle cx="3" cy="3" r="2.8" fill="#6E4E28"/><circle cx="3" cy="3" r="1.2" fill="#2A1C10"/><circle cx="-4" cy="8" r="1.8" fill="#6E4E28"/><circle cx="-2" cy="-4" r="1.3" fill="#6E4E28"/>';
  if(!o.wr&&!o.black)h+='<path d="M-4 -4Q-6 2 -4 8" stroke="#fff" stroke-opacity="'+(o.dull?.12:.45)+'" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
  return h+'</g>';
}
// 切開一半的酪梨：黃綠色的果肉和大大的種子
function avoHalf(x,y,s){
  return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+s+')"><path d="'+AVP+'" fill="'+SKIN2+'"/><path d="'+AVP+'" transform="translate(0 .8) scale(.86)" fill="'+RIM+'"/><path d="'+AVP+'" transform="translate(0 1.4) scale(.7)" fill="'+FLESH+'"/>'+
    '<circle cy="5" r="4.8" fill="'+SEED+'"/><path d="M-2.4 2.6Q-3 5 -1.6 7" stroke="#fff" stroke-opacity=".35" stroke-width="1" fill="none" stroke-linecap="round"/></g>';
}
// 酪梨樹（地圖上的小樹）。mode：flower 開花、fruit 結果、bag 套袋
function tree(x,y,s,mode){
  var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+(s||1)+')"><path d="M-2.5 0L-2 -14H2L2.5 0Z" fill="#7A5A3A"/><circle cx="-8" cy="-18" r="9" fill="'+LEAFD+'"/><circle cx="8" cy="-18" r="9" fill="'+LEAFD+'"/><circle cy="-25" r="11" fill="'+LEAFC+'"/><circle cx="-5" cy="-21" r="6" fill="#5E9A46"/>';
  if(mode==='flower')[[-9,-22],[-2,-31],[6,-26],[11,-17],[-4,-15],[3,-20],[-12,-14]].forEach(function(p){h+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="1.9" fill="#F1F2BE"/>'});
  if(mode==='fruit')[[-7,-11],[6,-10],[0,-19]].forEach(function(p){h+=avo(p[0],p[1],.3,{c:'#9DBB4A',stem:2})});
  if(mode==='bag')[[-7,-10],[6,-9],[0,-18]].forEach(function(p){h+='<path d="M'+(p[0]-3)+' '+(p[1]-4)+'H'+(p[0]+3)+'L'+(p[0]+4)+' '+(p[1]+5)+'H'+(p[0]-4)+'Z" fill="#F6F0E0" stroke="#C9BC9C" stroke-width=".6"/>'});
  return h+'</g>';
}
// 酪梨的小花：ph='f' 第一次開（媽媽花，花小小的、中間白白的）；'m' 第二次開（爸爸花，開比較大，有黃色花粉）
function flw(x,y,s,ph){
  var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+s+')">',len=ph==='m'?4.6:3;
  for(var k=0;k<6;k++)h+='<ellipse cy="'+f1(-len*.55)+'" rx="1.5" ry="'+f1(len*.55)+'" fill="#E6EAA6" stroke="#AEB65E" stroke-width=".4" transform="rotate('+(k*60+30)+')"/>';
  if(ph==='m'){h+='<circle r="1.3" fill="#C9D27A"/>';for(var j=0;j<6;j++)h+='<circle cx="'+f1(Math.cos(j*1.047)*2.3)+'" cy="'+f1(Math.sin(j*1.047)*2.3)+'" r=".75" fill="#E8B020"/>'}
  else h+='<circle r="1.4" fill="#C9D27A"/><circle r=".8" fill="#fff"/>';
  return h+'</g>';
}
// 一串小花
function flCluster(x,y,s,ph,pol){
  var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+s+')"><path d="M0 6V-2M0 0L-6 -5M0 0L6 -5M0 -2L-2 -8" stroke="#8FA05A" stroke-width=".9" fill="none"/>';
  [[0,-9],[-7,-6],[7,-6],[-3,-2],[4,1]].forEach(function(p){h+=flw(p[0],p[1],1,ph)});
  if(pol)[[0,-9],[-7,-6],[7,-6]].forEach(function(p){h+='<circle cx="'+(p[0]+.6)+'" cy="'+(p[1]-.4)+'" r=".9" fill="#F2B21C"/>'});
  return h+'</g>';
}
// 蜜蜂（臉朝左）
function bee(x,y,s,flip){
  return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+(flip?-s:s)+' '+s+')"><ellipse cx="-1" cy="-5" rx="3" ry="4.2" fill="#fff" fill-opacity=".9" stroke="#AFC0C8" stroke-width=".5" transform="rotate(-22 -1 -5)"/><ellipse cx="2.4" cy="-5" rx="2.6" ry="3.8" fill="#fff" fill-opacity=".9" stroke="#AFC0C8" stroke-width=".5" transform="rotate(22 2.4 -5)"/>'+
    '<ellipse rx="5.4" ry="3.6" fill="#F2C230" stroke="#3A2A10" stroke-width=".6"/><path d="M-1.6 -3.3V3.3M1.6 -3.2V3.2" stroke="#3A2A10" stroke-width="1.3"/><circle cx="-5.6" cy="-.4" r="2.3" fill="#3A2A10"/><circle cx="-6.4" cy="-1" r=".6" fill="#fff"/></g>';
}
var ICON={
  graft:'<path d="M0 11V-1" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M0 -1L-1 -11M-1 -7C-6 -10 -9 -7 -10 -4C-6 -3 -3 -5 -1 -7M0 -3C4 -7 8 -6 9 -3C6 -1 3 -1 0 -3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="-3.6" y="-2.4" width="7.2" height="4.6" rx="1" fill="#fff"/>',
  bee:'<ellipse cx="-2.4" cy="-5.6" rx="3.2" ry="4.4" fill="none" stroke="#fff" stroke-width="1.8" transform="rotate(-25 -2.4 -5.6)"/><ellipse cx="3" cy="-5.6" rx="3.2" ry="4.4" fill="none" stroke="#fff" stroke-width="1.8" transform="rotate(25 3 -5.6)"/><ellipse cy="3" rx="8.4" ry="5" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M-2 -1.6V7.6M2.6 -1.6V7.6" stroke="#fff" stroke-width="2"/>',
  bag:'<path d="M-6 -5H6L8 10H-8Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M-4 -5Q0 -9 4 -5M0 -8V-11" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>',
  root:'<path d="M-10 -1H10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M0 -1V-8M0 -8C-3 -12 -7 -11 -8 -9C-5 -7 -2 -7 0 -8M0 -6C3 -10 7 -10 8 -7C5 -5 2 -5 0 -6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M0 -1Q-1 4 -6 8M0 -1Q1 5 5 9M0 -1V10" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>',
  scissors:'<circle cx="-5" cy="6.4" r="3.4" fill="none" stroke="#fff" stroke-width="2"/><circle cx="5" cy="6.4" r="3.4" fill="none" stroke="#fff" stroke-width="2"/><path d="M-3 3.4L6 -10M3 3.4L-6 -10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>',
  avo:'<path d="M0 -10C3.6 -10 4.6 -6 5.4 -2C8 2.6 8.4 10.5 0 10.5C-8.4 10.5 -8 2.6 -5.4 -2C-4.6 -6 -3.6 -10 0 -10Z" fill="none" stroke="#fff" stroke-width="2.2"/><circle cy="4" r="3.6" fill="#fff"/>'
};
function icon(k){return '<svg viewBox="-12 -12 24 24" aria-hidden="true">'+ICON[k]+'</svg>'}

// 開場的認水果圖：大大的酪梨，加上幾個認得出它的特徵
function idCard(t1,t2,art,C){
  var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EEF4EC" role="img" aria-label="'+t1+'的樣子"><rect x="-400" y="172" width="1200" height="60" fill="#DCE7D2"/>'+art;
  C.forEach(function(c){s+='<path d="M'+c[3]+' '+c[4]+'L'+c[1]+' '+(c[2]-5)+'" stroke="#8A7A70" stroke-width="1.2"/><circle cx="'+c[3]+'" cy="'+c[4]+'" r="2.6" fill="#DB2E27"/>'+
    '<text x="'+c[1]+'" y="'+c[2]+'" font-size="15" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#EEF4EC" stroke-width="4" paint-order="stroke">'+c[0]+'</text>'});
  return s+'<text x="160" y="34" font-size="24" font-weight="900" fill="#2A2020" text-anchor="middle" font-family="Noto Serif TC,Songti TC,serif" stroke="#EEF4EC" stroke-width="4" paint-order="stroke">'+t1+'</text>'+(t2?'<text x="160" y="190" font-size="14" font-weight="700" fill="#4E6B3A" text-anchor="middle">'+t2+'</text>':'')+'</svg>';
}

/* ---------- 地圖 ---------- */
// 示意圖：曾文溪從右上流到左下，兩岸是一棵一棵的酪梨樹，四周是小山
var STOPS=[{lv:1,n:'苗圃',x:560,y:150,k:'pots'},{lv:2,n:'開花的果園',x:400,y:190,k:'flower'},{lv:3,n:'套袋',x:290,y:300,k:'bag'},{lv:4,n:'曾文溪河堤',x:540,y:320,k:'bank'},{lv:5,n:'採酪梨',x:420,y:300,k:'pick'},{lv:6,n:'阿伯家',x:250,y:420,k:'house'}];
var RIVER='M900 100Q720 200 660 300Q610 400 470 420Q330 440 250 600Q220 680 200 760';
function riverPts(){
  var S=[[900,100,720,200,660,300],[660,300,610,400,470,420],[470,420,330,440,250,600],[250,600,220,680,200,760]],P=[];
  S.forEach(function(s){for(var t=0;t<=1;t+=.05){var u=1-t;P.push([u*u*s[0]+2*u*t*s[2]+t*t*s[4],u*u*s[1]+2*u*t*s[3]+t*t*s[5]])}});return P;
}
function marker(s){
  var t='<g transform="translate('+s.x+' '+s.y+')">';
  if(s.k==='pots'){var h=t;[-16,0,16].forEach(function(dx){h+='<path d="M'+(dx-6)+' 0H'+(dx+6)+'L'+(dx+4)+' 10H'+(dx-4)+'Z" fill="#C9744A" stroke="#8A4A2A" stroke-width="1"/><path d="M'+dx+' 0V-12" stroke="#6E7A3A" stroke-width="2"/><ellipse cx="'+(dx-4)+'" cy="-11" rx="4" ry="2.2" fill="'+LEAFC+'" transform="rotate(-25 '+(dx-4)+' -11)"/><ellipse cx="'+(dx+4)+'" cy="-13" rx="4" ry="2.2" fill="#5E9A46" transform="rotate(25 '+(dx+4)+' -13)"/>'});return h+'</g>'}
  if(s.k==='flower')return t+tree(0,10,1.15,'flower')+bee(16,-26,1.1)+'</g>';
  if(s.k==='bag')return t+tree(0,10,1.15,'bag')+'</g>';
  if(s.k==='bank')return t+'<path d="M-30 12Q-10 4 10 12T40 12" stroke="#8FC7D6" stroke-width="6" fill="none" stroke-linecap="round"/>'+tree(-4,8,1.1,'fruit')+'<path d="M-4 8Q-12 12 -18 11M-4 8Q2 13 8 13" stroke="#7A5A3A" stroke-width="1.4" fill="none"/></g>';
  if(s.k==='pick')return t+tree(-8,10,1.1,'fruit')+'<path d="M8 2H26L23 12H11Z" fill="#B88A55" stroke="#7A5530" stroke-width="1"/>'+avo(13,0,.32,{stem:0})+avo(19,1,.32,{stem:0})+'</g>';
  return t+'<rect x="-16" y="-8" width="32" height="20" rx="2" fill="#F3E6CC" stroke="#9A7A55" stroke-width="1.2"/><path d="M-20 -7L0 -22L20 -7Z" fill="#C0583F"/><rect x="-4" y="2" width="8" height="10" fill="#9A7A55"/>'+avo(-9,3,.3,{stem:0})+'</g>';
}
function buildMap(){
  var h='<rect x="-400" y="-300" width="1600" height="1200" fill="#E9E1C6"/>';
  // 四周的小山
  [[40,-10,150,80],[380,-60,170,80],[760,-20,120,90],[880,300,90,150],[600,640,200,80],[-60,380,90,170],[90,640,130,60]].forEach(function(e,k){h+='<ellipse cx="'+e[0]+'" cy="'+e[1]+'" rx="'+e[2]+'" ry="'+e[3]+'" fill="'+(k%2?'#BBD198':'#C3D6A0')+'"/>'});
  h+='<g id="trees"></g>';
  // 曾文溪和兩岸的河灘
  h+='<path d="'+RIVER+'" stroke="#E2D9B8" stroke-width="58" fill="none" stroke-linecap="round"/><path d="'+RIVER+'" stroke="#6BB7D6" stroke-width="30" fill="none" stroke-linecap="round"/>';
  // 南瀛天文館
  h+='<g transform="translate(690 470)"><rect x="-22" y="-6" width="44" height="18" rx="2" fill="#F1ECE2" stroke="#9A8C7A" stroke-width="1.2"/><path d="M-14 -6A14 14 0 0 1 14 -6Z" fill="#D9DEE4" stroke="#9A8C7A" stroke-width="1.2"/></g>';
  var T=function(t,x,y,sz,c){return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" fill="'+c+'" text-anchor="middle" stroke="#E9E1C6" stroke-width="4" paint-order="stroke">'+t+'</text>'};
  h+=T('大內',200,112,26,'#7A4A2E')+T('曾文溪',748,334,17,'#2E7FA0')+T('南瀛天文館',690,506,14,'#6A5E50');
  h+='<g transform="translate(110 540)"><circle r="16" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.5"/><path d="M0 -11L5 4L0 1L-5 4Z" fill="#DB2E27"/><text y="12" font-size="9" fill="#5A4E48" text-anchor="middle">北</text></g>';
  // 開花時：樹上開滿小花；結果時：樹上掛著酪梨
  h+='<g id="past"><g id="flPast"></g>'+T('開花時：1 到 4 月開滿小花',425,556,15,'#6C2024')+'</g>';
  h+='<g id="now"><g id="frNow"></g>'+T('結果時：樹上掛著酪梨',425,556,15,'#6C2024')+'</g>';
  STOPS.forEach(function(s){h+='<g class="stop" data-lv="'+s.lv+'" role="button" aria-label="第 '+s.lv+' 關 '+s.n+'">'+marker(s)+'<circle cx="'+(s.x+24)+'" cy="'+(s.y-26)+'" r="10" fill="#fff" stroke="#E2574C" stroke-width="2"/><text x="'+(s.x+24)+'" y="'+(s.y-21.5)+'" font-size="13" fill="#E2574C" text-anchor="middle">'+s.lv+'</text><text x="'+s.x+'" y="'+(s.y+34)+'" font-size="16" font-weight="700" fill="#5A3E2B" text-anchor="middle" stroke="#FFF8EC" stroke-width="4" paint-order="stroke">'+s.n+'</text></g>'});
  h+='<g id="pin" style="display:none"><g class="pin"><path d="M0 0C-10 -14 -14 -20 -14 -27A14 14 0 1 1 14 -27C14 -20 10 -14 0 0Z" fill="#E2574C" stroke="#fff" stroke-width="2.5"/><text y="-22" font-size="12" fill="#fff" text-anchor="middle">你</text></g></g>';
  return h;
}
function near(x,y,w,hh){return STOPS.some(function(s){return Math.abs(s.x-x)<w&&Math.abs(s.y-y)<hh})}
function decorate(){
  var r=rnd(23),RP=riverPts(),t='',p='',q='';
  for(var x=10;x<800;x+=40)for(var y=-30;y<600;y+=36){
    var cx=x+(r()-.5)*12,cy=y+(r()-.5)*10;
    if(near(cx,cy,52,56))continue;
    if(RP.some(function(a){return Math.hypot(a[0]-cx,a[1]-cy)<40}))continue;
    if(Math.abs(cx-200)<52&&Math.abs(cy-104)<26)continue; // 大內
    if(Math.abs(cx-748)<40&&Math.abs(cy-326)<18)continue; // 曾文溪
    if(Math.abs(cx-690)<56&&Math.abs(cy-484)<40)continue; // 天文館
    if(Math.abs(cx-110)<28&&Math.abs(cy-540)<28)continue;
    if(cy>536&&Math.abs(cx-425)<115)continue; // 季節的字
    if(r()<.22)continue;
    t+='<g transform="translate('+f1(cx)+' '+f1(cy)+')"><circle r="12" fill="'+LEAFD+'"/><circle cx="-2" cy="-3" r="8" fill="'+LEAFC+'"/></g>';

      if(t==='down'){ly=p.y;dug=false;sh.style.display='';sh.setAttribute('transform','translate('+f1(p.x)+' '+f1(p.y)+')');return}
      if(t==='move'){sh.setAttribute('transform','translate('+f1(p.x)+' '+f1(p.y)+')');if(p.y-ly>=22){ly=p.y;dig()}else if(p.y<ly)ly=p.y;return}
      if(t==='up'){sh.style.display='none';if(!dug)say(msg,'要<b>往下滑</b>，才挖得動喔。',1)}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','挖土的畫面，按 Enter 往下挖一層');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();dig()}});
    later(function(){if(!step&&!done)say(msg,'手指按在土上，像拿鏟子一樣<b>往下滑</b>。滑一次，挖一層。')},8000);
  },

  /* 第 5 關：看果梗和小黃點，熟的才剪；手指劃過果梗，留一小段蒂頭 */
  cut:function(area,i,l){
    var X=[48,104,160,216,272],ST=40,FT=74,S=1.5,FY=FT+13*S,F=[],n=0,N=3,done=false,last=null,trail=[],hitThis={};
    var ripe=[0,1,2,3,4].sort(function(){return Math.random()-.5}).slice(0,3);
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E8F1EA"><rect x="-400" y="172" width="1200" height="80" fill="#CDBB8E"/>'+
      '<path d="M-30 24Q80 14 160 22T350 20" stroke="#7A5A3A" stroke-width="8" fill="none" stroke-linecap="round"/>';
    [[16,12,-20],[76,10,15],[132,30,-12],[190,10,18],[246,30,-20],[306,12,20]].forEach(function(e){s+='<ellipse cx="'+e[0]+'" cy="'+e[1]+'" rx="16" ry="6" fill="'+LEAFC+'" transform="rotate('+e[2]+' '+e[0]+' '+e[1]+')"/>'});
    s+='<g id="st"></g><g id="fr"></g><path d="M112 146H208L198 178H122Z" fill="#B88A55" stroke="#7A5530" stroke-width="1.4"/><path d="M116 156H204M119 166H201" stroke="#9A7040" stroke-width="1"/><g id="bk"></g><path id="tr" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/><g id="fx"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),stG=svg.querySelector('#st'),frG=svg.querySelector('#fr'),bk=svg.querySelector('#bk'),tr=svg.querySelector('#tr'),fx=svg.querySelector('#fx');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    X.forEach(function(x,k){var f={x:x,ripe:ripe.indexOf(k)>=0,cut:0};
      stG.insertAdjacentHTML('beforeend','<path d="M'+(x-6)+' 27H'+(x+6)+'L'+(x+5)+' '+ST+'H'+(x-5)+'Z" fill="#F6F0E0" stroke="#C9BC9C" stroke-width=".8"/><path d="M'+(x-5)+' 32L'+(x+4)+' 34M'+(x-4)+' 37L'+(x+5)+' 36" stroke="#D6CBB0" stroke-width=".8"/>');
      f.up=document.createElementNS(NS,'path');f.up.setAttribute('stroke',f.ripe?STEMY:STEMG);f.up.setAttribute('stroke-width','3');f.up.setAttribute('stroke-linecap','round');f.up.setAttribute('d','M'+x+' '+ST+'V'+FT);stG.appendChild(f.up);
      f.g=document.createElementNS(NS,'g');f.g.innerHTML=avo(0,0,S,f.ripe?{stem:0,dots:18,dull:true,seed:k+2}:{stem:0,dots:3,c:'#5C8A34',seed:k+2});f.g.setAttribute('transform','translate('+x+' '+FY+')');frG.appendChild(f.g);F.push(f)});
    function cut(f,yy){
      f.cut=1;n++;bar.style.width=(n/N*100)+'%';f.up.setAttribute('d','M'+f.x+' '+ST+'V'+f1(yy));
      var stub=document.createElementNS(NS,'path');stub.setAttribute('d','M0 '+f1(yy-FY)+'V'+f1(-13*S));stub.setAttribute('stroke',STEMY);stub.setAttribute('stroke-width','3');stub.setAttribute('stroke-linecap','round');f.g.insertBefore(stub,f.g.firstChild);
      var tx=136+(n-1)*24,ty=150,t0=performance.now();
      (function d(now){var q=Math.min(1,(now-t0)/(reduce?1:700)),x=f.x+(tx-f.x)*q,y=FY+(ty-FY)*q-30*Math.sin(Math.PI*q),k=1-.45*q;f.g.setAttribute('transform','translate('+f1(x)+' '+f1(y)+') scale('+f1(k*100)/100+')');if(q<1){requestAnimationFrame(d);return}
        if(n>=N){done=true;say(msg,'3 顆都剪好了！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},900)}})(t0);
      say(msg,n<N?'剪下來了！蒂頭留著一小段。還要 '+(N-n)+' 顆。':'剪下來了！');
    }
    function hit(f,yy){
      if(hitThis[f.x])return;hitThis[f.x]=1;
      fx.innerHTML='<circle cx="'+f.x+'" cy="'+f1(yy)+'" r="8" fill="none" stroke="'+(f.ripe&&yy<=64?'#fff':'#DB2E27')+'" stroke-width="2"/>';later(function(){fx.innerHTML=''},400);
      if(!f.ripe){say(msg,'這顆的果梗還是<b>綠的</b>，小黃點也很少，還沒熟。留在樹上！',1);return}
      if(yy>64){say(msg,'剪得太靠近果子了！要留<b>一小段蒂頭</b>，剪高一點。',1);return}
      cut(f,yy);
    }
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){last=p;trail=[p];hitThis={};return}
      if(t==='move'&&last){
        F.forEach(function(f){if(f.cut||last.x===p.x)return;if((last.x-f.x)*(p.x-f.x)<=0){var yy=last.y+(p.y-last.y)*(f.x-last.x)/(p.x-last.x);if(yy>ST&&yy<FT+2)hit(f,yy)}});
        last=p;trail.push(p);if(trail.length>7)trail.shift();tr.setAttribute('d','M'+trail.map(function(o){return f1(o.x)+' '+f1(o.y)}).join('L'));return}
      if(t==='up'){last=null;later(function(){tr.setAttribute('d','')},150);
        if(!Object.keys(hitThis).length&&trail.length<3)say(msg,'手指要<b>劃過</b>果梗，像剪刀剪一下。',1)}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','採酪梨的畫面，按 Enter 剪下一顆熟的酪梨');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var f=F.filter(function(o){return o.ripe&&!o.cut})[0];if(f)cut(f,52)}});
    later(function(){if(!n&&!done)say(msg,'找<b>果梗黃黃的</b>酪梨，手指在果梗的上半段，<b>快快地左右劃過去</b>。')},8000);
  },

  /* 第 6 關：把剛採的酪梨放到冰箱、太陽下或陰涼的房間，看哪裡會變軟 */
  ripen:function(area,i,l){
    var SP=[{n:'冰箱',x:58,y:90,k:'cold'},{n:'太陽下',x:160,y:66,k:'hot'},{n:'陰涼的房間',x:262,y:104,k:'ok'}],H={x:160,y:150},av={x:160,y:150},held=false,busy=false,done=false,tried={};
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F6EEDF"><rect x="-400" y="162" width="1200" height="100" fill="#D9C4A0"/>'+
      '<rect x="24" y="30" width="68" height="134" rx="6" fill="#F4F7F8" stroke="#AAB4B8" stroke-width="1.6"/><rect x="30" y="72" width="56" height="44" rx="2" fill="#D6ECF3"/><path d="M30 114H86" stroke="#AAB4B8" stroke-width="1.6"/><path d="M24 64H92" stroke="#AAB4B8" stroke-width="1.4"/><rect x="80" y="40" width="4" height="16" rx="2" fill="#AAB4B8"/>'+
      '<text x="58" y="56" font-size="14" font-weight="700" fill="#2E7FA0" text-anchor="middle">很冷</text>'+
      '<path d="M124 24H196V64H124Z" fill="#BFE3F2" stroke="#9A7A55" stroke-width="3"/><path d="M160 24V64" stroke="#9A7A55" stroke-width="2"/><circle cx="182" cy="36" r="8" fill="#F7C948"/>'+
      '<path d="M128 64L120 92H200L192 64Z" fill="#FFE9A0" opacity=".55"/><rect x="116" y="88" width="88" height="6" rx="1" fill="#B88A55"/>'+
      '<text x="140" y="58" font-size="14" font-weight="700" fill="#C0583F" text-anchor="middle">很熱</text>'+
      '<rect x="222" y="128" width="80" height="6" rx="1" fill="#A8774A"/><path d="M230 134V162M294 134V162" stroke="#8A5A3A" stroke-width="4"/>'+
      '<text x="262" y="96" font-size="14" font-weight="700" fill="#4E6B3A" text-anchor="middle">不冷不熱</text>';
    SP.forEach(function(p){s+='<ellipse cx="'+p.x+'" cy="'+(p.y+21)+'" rx="22" ry="6" fill="none" stroke="#DB2E27" stroke-width="1.8" stroke-dasharray="4 4" class="drop"/>'});
    s+='<text x="58" y="24" font-size="15" font-weight="700" fill="#2A2020" text-anchor="middle" stroke="#F6EEDF" stroke-width="4" paint-order="stroke">冰箱</text><text x="160" y="18" font-size="15" font-weight="700" fill="#2A2020" text-anchor="middle" stroke="#F6EEDF" stroke-width="4" paint-order="stroke">太陽下</text><text x="262" y="78" font-size="15" font-weight="700" fill="#2A2020" text-anchor="middle" stroke="#F6EEDF" stroke-width="4" paint-order="stroke">陰涼的房間</text>'+
      '<path d="M138 156H182L178 170H142Z" fill="#B88A55" stroke="#7A5530" stroke-width="1"/><text id="day" x="160" y="124" font-size="17" font-weight="900" fill="#6C2024" text-anchor="middle" stroke="#F6EEDF" stroke-width="4" paint-order="stroke"></text><g id="av"></g><g id="fx"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),avG=svg.querySelector('#av'),day=svg.querySelector('#day'),fx=svg.querySelector('#fx');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    var look={stem:2,sc:STEMY,dots:14,dull:true};
    function drawAv(o){avG.innerHTML=avo(av.x,av.y,1.6,o||look)}
    function mix(a,b,q){var A=[parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)],B2=[parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)];return 'rgb('+A.map(function(c,k){return Math.round(c+(B2[k]-c)*q)}).join(',')+')'}
    function reset(){av.x=H.x;av.y=H.y;busy=false;day.textContent='';drawAv()}
    function place(p){
      busy=true;av.x=p.x;av.y=p.y;drawAv();tried[p.k]=1;var N=p.k==='ok'?5:6,d=0;
      bar.style.width=(Object.keys(tried).length/3*60)+'%';
      (function tick(){d++;day.textContent='第 '+d+' 天';var q=d/N;
        if(p.k==='ok')drawAv({stem:2,sc:STEMY,dots:14,dull:true,c:mix('#4F7A2E','#5A3046',q)});
        else if(p.k==='cold')drawAv({stem:2,sc:STEMY,c:mix('#4F7A2E','#2F3A22',q),black:d>=4});
        else drawAv({stem:2,sc:'#B89A4A',c:mix('#4F7A2E','#6A7A3A',q),wr:d>=4});
        if(d<N){later(tick,480);return}
        if(p.k==='cold'){say(msg,'放在冰箱 6 天，還是<b>硬硬的</b>，皮還變得黑黑的。太冷了！還沒變軟的酪梨，不能放冰箱。阿伯再拿一顆給你，換個地方試試看。',1);later(reset,1800);return}
        if(p.k==='hot'){say(msg,'曬了 6 天，皮<b>皺皺的</b>，還是軟不起來。太熱了！阿伯再拿一顆給你，換個地方試試看。',1);later(reset,1800);return}
        // 陰涼的房間：第 5 天，大拇指輕輕壓
        fx.innerHTML='<circle cx="'+(av.x+6)+'" cy="'+(av.y+4)+'" r="9" fill="#F1C9A5" stroke="#C8946A" stroke-width="1"/>';
        later(function(){fx.innerHTML='<text x="'+av.x+'" y="'+(av.y-30)+'" font-size="15" font-weight="700" fill="#3F6B2E" text-anchor="middle" stroke="#fff" stroke-width="4" paint-order="stroke">軟軟的！</text>';
          say(msg,'第 5 天，大拇指輕輕一壓，<b>軟軟的</b>！阿伯把它切開來⋯⋯');
          later(function(){done=true;bar.style.width='100%';avG.innerHTML=avoHalf(av.x-14,av.y+2,1.5)+avoHalf(av.x+14,av.y+2,1.5).replace('<circle cy="5" r="4.8" fill="'+SEED+'"/>','<ellipse cy="5" rx="4.6" ry="4.4" fill="#C9BE6A"/>');fx.innerHTML='';day.textContent='';
            say(msg,l.win);quiz(area,l,function(){finish(i)})},1300)},700);
      })();
    }
    drag(svg,function(t,p){
      if(done||busy)return;
      if(t==='down'){held=Math.hypot(p.x-av.x,p.y-av.y)<28;if(!held)say(msg,'要按住<b>酪梨</b>（下面籃子裡那顆），再拖過去。',1);return}
      if(!held)return;
      if(t==='move'){av.x=Math.max(16,Math.min(304,p.x));av.y=Math.max(20,Math.min(176,p.y));drawAv();return}
      if(t==='up'){held=false;var best=null,bd=46;SP.forEach(function(s2){var d=Math.hypot(s2.x-av.x,s2.y-av.y);if(d<bd){bd=d;best=s2}});
        if(best)place(best);else{reset();say(msg,'放到<b>冰箱</b>、<b>太陽下</b>或<b>陰涼的房間</b>試試看。',1)}}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','阿伯家的畫面，按 Enter 把酪梨放到陰涼的房間');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done&&!busy){e.preventDefault();place(SP[2])}});
    later(function(){if(!Object.keys(tried).length&&!done)say(msg,'手指按住<b>籃子裡的酪梨</b>，拖到冰箱、窗邊的太陽下，或右邊的桌子上。')},8000);
    reset();
  }
};
</script>
