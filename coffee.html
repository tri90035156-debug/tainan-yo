<body>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="任務單"><div class="in"><div id="sheetDoc"></div><button class="x" type="button" id="sheetX">收起任務單</button></div></div>

<script>

/* ---------- 插畫元件 ---------- */
var K='#2A2020',NS='http://www.w3.org/2000/svg';
var RED='#C8323A',REDD='#8E1F26',GRN='#8DB24E',BLK='#4A2E22',LEAFC='#4E8A3A',LEAFD='#3C6E2C',BEAN='#C9B27A';
function f1(v){return (Math.round(v*10)/10).toString()}
function rnd(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280}}
// 一顆咖啡果。c：red 熟、green 沒熟、black 過熟乾掉
function cherry(x,y,r,c){var f=c==='green'?GRN:c==='black'?BLK:RED,k=c==='green'?'#5E7A30':c==='black'?'#2A1A12':REDD;
  return '<g transform="translate('+f1(x)+' '+f1(y)+')"><ellipse rx="'+f1(r)+'" ry="'+f1(r*1.12)+'" fill="'+f+'" stroke="'+k+'" stroke-width="'+f1(r*.1)+'"/><circle cx="'+f1(r*.1)+'" cy="'+f1(r*1)+'" r="'+f1(r*.18)+'" fill="'+k+'"/><path d="M'+f1(-r*.45)+' '+f1(-r*.4)+'Q'+f1(-r*.55)+' 0 '+f1(-r*.35)+' '+f1(r*.35)+'" stroke="#fff" stroke-opacity=".45" stroke-width="'+f1(r*.18)+'" fill="none" stroke-linecap="round"/></g>'}
// 一顆咖啡豆（平的那面朝外看得到中間的線）
function bean(x,y,s,c,rot){return '<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+f1(rot||0)+') scale('+f1(s)+')"><ellipse rx="7" ry="9.5" fill="'+(c||BEAN)+'" stroke="#7A6030" stroke-width=".8"/><path d="M0 -8Q-2.4 -3 0 0Q2.4 3 0 8" stroke="#7A6030" stroke-width="1" fill="none"/></g>'}
// 咖啡樹（地圖上的小樹）
function bush(x,y,s,c){var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s||1)+')"><ellipse rx="10" ry="8" fill="'+LEAFD+'"/><ellipse cx="-2" cy="-2" rx="6" ry="4" fill="'+LEAFC+'"/>';
  if(c)h+='<circle cx="-4" cy="2" r="1.8" fill="'+c+'"/><circle cx="3" cy="3" r="1.8" fill="'+c+'"/><circle cx="5" cy="-2" r="1.6" fill="'+c+'"/>';return h+'</g>'}
// 龍眼樹
function longan(x,y,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s||1)+')"><path d="M-3 0L-2 -16H2L3 0Z" fill="#7A5A3A"/><ellipse cy="-26" rx="20" ry="14" fill="#3E6E34"/><ellipse cx="-6" cy="-30" rx="11" ry="7" fill="#4E8A3A"/></g>'}
var ICON={
  puzzle:'<path d="M-9 -9H-2Q-2 -12 0 -12Q2 -12 2 -9H9V-2Q12 -2 12 0Q12 2 9 2V9H-9Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>',
  cherry:'<circle cx="-4" cy="3" r="5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="5" cy="4" r="4.4" fill="none" stroke="#fff" stroke-width="2"/><path d="M-4 -2Q0 -10 8 -10M5 0Q4 -6 8 -10" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>',
  bean:'<ellipse cx="-4" rx="5" ry="7.5" fill="none" stroke="#fff" stroke-width="2"/><ellipse cx="5" rx="5" ry="7.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M-4 -6Q-6 0 -4 6M5 -6Q3 0 5 6" stroke="#fff" stroke-width="1.4" fill="none"/>',
  sun:'<circle r="5" fill="none" stroke="#fff" stroke-width="2"/><path d="M0 -11V-8M0 8V11M-11 0H-8M8 0H11M-8 -8L-6 -6M6 6L8 8M8 -8L6 -6M-6 6L-8 8" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>',
  roast:'<ellipse cy="-1" rx="9" ry="3.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M9 -1H12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M-4 10Q-6 6 -3 4Q-2 7 0 5Q2 8 4 6Q5 9 3 10" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>',
  road:'<path d="M-6 -10H6L10 -2L6 10H-6L-10 -2Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M-4 -1H4M-4 3H4" stroke="#fff" stroke-width="1.6"/>'
};
function icon(k){return '<svg viewBox="-12 -12 24 24" aria-hidden="true">'+ICON[k]+'</svg>'}

// 開場的認咖啡果圖：一枝咖啡果，加上剖開的果子
function idCard(t1,t2,art,C){
  var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F1F0E2" role="img" aria-label="'+t1+'的樣子"><rect x="-400" y="170" width="1200" height="60" fill="#D8DDB8"/>'+art;
  C.forEach(function(c){s+='<path d="M'+c[3]+' '+c[4]+'L'+c[1]+' '+(c[2]-5)+'" stroke="#8A7A70" stroke-width="1.2"/><circle cx="'+c[3]+'" cy="'+c[4]+'" r="2.6" fill="#DB2E27"/>'+
    '<text x="'+c[1]+'" y="'+c[2]+'" font-size="15" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#F1F0E2" stroke-width="4" paint-order="stroke">'+c[0]+'</text>'});
  return s+'<text x="160" y="34" font-size="24" font-weight="900" fill="#2A2020" text-anchor="middle" font-family="Noto Serif TC,Songti TC,serif" stroke="#F1F0E2" stroke-width="4" paint-order="stroke">'+t1+'</text>'+(t2?'<text x="160" y="188" font-size="14" font-weight="700" fill="#5A6A2E" text-anchor="middle">'+t2+'</text>':'')+'</svg>';
}

/* ---------- 地圖 ---------- */
// 示意圖：東山的山上，市道 175 彎彎曲曲穿過咖啡園，崁頭山在東北邊；切到「綠果時」，咖啡果還是綠的
var STOPS=[{lv:1,n:'崁頭山',x:640,y:120,k:'mount'},{lv:2,n:'咖啡園',x:420,y:210,k:'farm'},{lv:3,n:'剝開咖啡果',x:610,y:300,k:'open'},{lv:4,n:'路邊日曬',x:270,y:410,k:'dry'},{lv:5,n:'烘豆子',x:540,y:440,k:'roast'},{lv:6,n:'咖啡公路',x:130,y:510,k:'road'}];
var ROAD='M-60 580C80 540 120 470 250 440S430 410 470 350S380 260 430 225S560 190 620 150S760 70 900 40';
function marker(s){
  var t='<g transform="translate('+s.x+' '+s.y+')">';
  if(s.k==='mount')return t+'<path d="M-30 14L-6 -22L4 -10L12 -18L32 14Z" fill="#7FA05A" stroke="#4E6E34" stroke-width="1.2"/><path d="M-6 -22L-1 -14L4 -10L7 -14L12 -18" stroke="#fff" stroke-width="1.4" fill="none"/>'+bush(-10,10,.7,RED)+bush(10,10,.7,RED)+'</g>';
  if(s.k==='farm')return t+longan(-18,12,.8)+bush(4,8,1.3,RED)+bush(20,10,1.1,RED)+'</g>';
  if(s.k==='open')return t+cherry(-8,2,8,'red')+bean(10,0,.9)+bean(20,2,.9,null,10)+'</g>';
  if(s.k==='dry')return t+'<rect x="-26" y="-4" width="52" height="14" rx="2" fill="#B88A55" stroke="#7A5530" stroke-width="1"/>'+[-18,-10,-2,6,14].map(function(x,k){return cherry(x+2,2,3.2,k%2?'red':'black')}).join('')+'<circle cx="20" cy="-18" r="7" fill="#F7D35A"/></g>';
  if(s.k==='roast')return t+'<path d="M-14 12Q-16 4 -10 0Q-8 6 -4 2Q0 8 4 2Q8 6 10 0Q16 4 14 12Z" fill="#F29A3A"/><ellipse cy="-4" rx="18" ry="6" fill="#8A949A" stroke="#5E676C" stroke-width="1"/><path d="M18 -4H32" stroke="#8A6A3A" stroke-width="3" stroke-linecap="round"/>'+bean(-6,-6,.5,'#8A5A32')+bean(4,-6,.5,'#8A5A32')+'</g>';
  return t+'<path d="M-14 -16H14L20 -4L14 14H-14L-20 -4Z" fill="#fff" stroke="#2E6A80" stroke-width="2"/><text y="3" font-size="12" font-weight="700" fill="#2E6A80" text-anchor="middle">175</text></g>';
}
function buildMap(){
  var h='<rect x="-400" y="-300" width="1600" height="1200" fill="#E4E2C4"/>';
  // 山
  h+='<path d="M-400 360Q-100 260 120 300Q300 200 480 240Q600 80 760 120Q900 60 1200 100V-300H-400Z" fill="#CFD8A8"/><path d="M400 -300Q560 40 640 100Q720 40 900 60V-300Z" fill="#B8C890"/><g id="trees"></g><g id="past"><g id="frPast"></g></g><g id="now"><g id="frNow"></g></g>';
  h+='<path d="'+ROAD+'" stroke="#F5EEDC" stroke-width="16" fill="none" stroke-linecap="round"/><path d="'+ROAD+'" stroke="#E0D2B0" stroke-width="2" fill="none" stroke-dasharray="8 8"/>';
  var T=function(t,x,y,sz,c,bg){return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" fill="'+c+'" text-anchor="middle" stroke="'+(bg||'#E4E2C4')+'" stroke-width="4" paint-order="stroke">'+t+'</text>'};
  h+=T('東山',230,270,26,'#7A4A2E','#D8DDB0')+T('市道 175',740,96,15,'#2E6A80','#CFD8A8');
  h+='<g transform="translate(90 400)"><circle r="16" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.5"/><path d="M0 -11L5 4L0 1L-5 4Z" fill="#DB2E27"/><text y="12" font-size="9" fill="#5A4E48" text-anchor="middle">北</text></g>';
  h+='<g id="eraT">'+T('',420,575,15,'#6C2024')+'</g>';
  STOPS.forEach(function(s){h+='<g class="stop" data-lv="'+s.lv+'" role="button" aria-label="第 '+s.lv+' 關 '+s.n+'">'+marker(s)+'<circle cx="'+(s.x+24)+'" cy="'+(s.y-26)+'" r="10" fill="#fff" stroke="#E2574C" stroke-width="2"/><text x="'+(s.x+24)+'" y="'+(s.y-21.5)+'" font-size="13" fill="#E2574C" text-anchor="middle">'+s.lv+'</text><text x="'+s.x+'" y="'+(s.y+34)+'" font-size="16" font-weight="700" fill="#5A3E2B" text-anchor="middle" stroke="#FFF8EC" stroke-width="4" paint-order="stroke">'+s.n+'</text></g>'});
  h+='<g id="pin" style="display:none"><g class="pin"><path d="M0 0C-10 -14 -14 -20 -14 -27A14 14 0 1 1 14 -27C14 -20 10 -14 0 0Z" fill="#E2574C" stroke="#fff" stroke-width="2.5"/><text y="-22" font-size="12" fill="#fff" text-anchor="middle">你</text></g></g>';
  return h;
}
function near(x,y,w,hh){return STOPS.some(function(s){return Math.abs(s.x-x)<w&&Math.abs(s.y-y)<hh})}
function decorate(){
  var r=rnd(17),t='',p='',q='';
  for(var x=10;x<820;x+=34)for(var y=60;y<560;y+=30){
    var cx=x+(r()-.5)*10,cy=y+(r()-.5)*8;
    if(near(cx,cy,64,62))continue;
    if(Math.abs(cx-230)<50&&Math.abs(cy-262)<24)continue; // 東山
    if(Math.abs(cx-740)<50&&Math.abs(cy-90)<18)continue;
    if(Math.abs(cx-90)<26&&Math.abs(cy-400)<26)continue;
    if(cy>540&&Math.abs(cx-420)<200)continue;
    if(r()<.5)continue;
    if(r()<.12){t+=longan(cx,cy+8,.6);continue}
    t+=bush(cx,cy,1);
    q+='<g transform="translate('+f1(cx)+' '+f1(cy)+')"><circle cx="-4" cy="2" r="1.8" fill="'+RED+'"/><circle cx="3" cy="3" r="1.8" fill="'+RED+'"/><circle cx="5" cy="-2" r="1.6" fill="'+RED+'"/></g>';
    p+='<g transform="translate('+f1(cx)+' '+f1(cy)+')"><circle cx="-4" cy="2" r="1.8" fill="'+GRN+'"/><circle cx="3" cy="3" r="1.8" fill="'+GRN+'"/><circle cx="5" cy="-2" r="1.6" fill="'+GRN+'"/></g>';
  }
  map.querySelector('#trees').innerHTML=t;
  map.querySelector('#frPast').innerHTML=p;
  map.querySelector('#frNow').innerHTML=q;
  var e=map.querySelector('#eraT text');
  new MutationObserver(function(){e.textContent=map.classList.contains('now')?'紅果時：咖啡果紅了，一顆一顆採':'綠果時：咖啡果還綠綠的，慢慢長大'}).observe(map,{attributes:true,attributeFilter:['class']});
  e.textContent='紅果時：咖啡果紅了，一顆一顆採';
}

/* ---------- 關卡 ---------- */
var LV=[
  {cam:[25,-45,720,720],kick:'咖啡任務',h:'東山的咖啡紅了',
   html:'<p>秋天，臺南<b>東山</b>的山上，咖啡樹結的果子慢慢<b>變紅</b>了。熟了的咖啡果紅通通的，像小櫻桃，大家叫它<b>咖啡櫻桃</b>。</p><p>每年 <b>10 月</b>左右，東山還會辦<b>咖啡節</b>。</p><p class="task">跟著在東山種咖啡的<b>大哥哥</b>，看紅紅的果子怎麼變成咖啡豆。每過一關，就能蓋一個章！</p>',
   after:'<p class="note">地圖右上角可以切換<b>綠果時／紅果時</b>，看看咖啡果的兩種顏色。<br>提醒：咖啡有咖啡因，小朋友不要喝，聞聞香味就好。<br>給大人：東山咖啡大約秋天開始紅、冬天採收最多。咖啡園是農民的地，請不要自己進去摘。</p>',
   game:'start'},
  {cam:[0,0,300,225],kick:'第 1 關・崁頭山（日本時代）',h:'東山咖啡從哪裡來',
   html:'<p>很久很久以前，日本時代，東山<b>南勢</b>有一位<b>曾綠波</b>先生，在日本人開的<b>咖啡試驗農場</b>工作。</p><p>他把<b>咖啡苗</b>帶回家鄉，種在<b>崁頭山</b>上。這就是東山咖啡的開始！</p><p class="note">給大人：資料來自農業部水土保持局 2007 年的文章；東山咖啡是阿拉比卡種，主要種在南勢、高原村一帶的崁頭山，海拔約 500 到 800 公尺。</p>',
   task:'點<b>空格旁邊</b>的方塊，它會滑過去。把方塊排好，拼出<b>崁頭山的咖啡樹</b>！左邊的小圖是答案。',game:'slide',stamp:['puzzle','拼出崁頭山'],
   win:'拼好了！崁頭山上的咖啡樹，就是從曾綠波帶回來的咖啡苗開始的。',
   why:['曾綠波是在哪裡學會種咖啡的？','他在日本人開的<b>咖啡試驗農場</b>工作，學會照顧咖啡，再把<b>咖啡苗</b>帶回東山。現在東山咖啡種在海拔大約 <b>500 到 800 公尺</b>的山上。'],
   q:{t:'東山咖啡最早是什麼時候開始種的？',o:['日本時代','去年','一百年以後'],a:0,hint:'想想上面的故事，曾綠波是在什麼時代工作的？',
      e:'答對了！<b>日本時代</b>，曾綠波把咖啡苗帶回東山，種在<b>崁頭山</b>。'}},
  {cam:[0,0,300,225],kick:'第 2 關・咖啡園（秋冬）',h:'撥開葉子，只摘紅的',
   html:'<p>東山的咖啡樹，很多種在<b>龍眼樹</b>下。咖啡果藏在<b>葉子</b>後面，要撥開才看得到。</p><p>同一根樹枝上，有<b>紅</b>的、<b>綠</b>的，還有乾掉變<b>黑</b>的。大哥哥只摘<b>紅</b>的，綠的留著，過幾天再來摘。</p><p class="note">給大人：「種在龍眼樹下」來自食力的報導；同一枝上紅、綠、過熟果同時存在、要分好幾次採是國外的咖啡採收資料。</p>',
   task:'用手指<b>左右撥</b>，把葉子撥開，再點<b>紅色</b>的咖啡果摘下來。摘 <b>8 顆</b>！',game:'pick',stamp:['cherry','摘紅咖啡果'],
   win:'摘了 8 顆紅紅的咖啡果！綠的還留在樹上，再過幾天就紅了。',
   why:['為什麼不一次全部摘下來？','咖啡果不會一起變紅。只摘<b>熟透的紅果</b>，咖啡才會甜甜香香的；沒熟的綠果，喝起來會有草味、澀澀的。'],
   q:{t:'什麼顏色的咖啡果，才是熟了可以摘的？',o:['紅色','綠色','黑色'],a:0,hint:'大家叫它「咖啡櫻桃」，櫻桃是什麼顏色？',
      e:'答對了！熟了的咖啡果是<b>紅色</b>的，像小櫻桃。'}},
  {cam:[0,0,300,225],kick:'第 3 關・剝開咖啡果',h:'扭開來，裡面有兩顆',
   html:'<p>紅紅的咖啡果裡面，藏著什麼呢？</p><p>咖啡果裡面有<b>兩顆種子</b>，平平的那一面貼在一起。這兩顆種子，就是<b>咖啡豆</b>！</p>',
   task:'按住咖啡果<b>轉一轉、扭一扭</b>（兩根手指一起扭，或一根手指繞著它轉），把它扭開。扭開 <b>3 顆</b>！',game:'twist',stamp:['bean','看到兩顆種子'],
   win:'3 顆都扭開了！每一顆裡面都有兩顆種子，平平的面貼在一起。',

    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function half(clip,rot,dx,dy){return '<g transform="translate('+f1(dx)+' '+f1(dy)+') rotate('+f1(rot)+' '+CX+' '+CY+')"><g clip-path="url(#'+clip+')"><ellipse cx="'+CX+'" cy="'+CY+'" rx="46" ry="52" fill="'+RED+'" stroke="'+REDD+'" stroke-width="3"/><ellipse cx="'+CX+'" cy="'+CY+'" rx="38" ry="44" fill="'+(open?'#F2D9B0':RED)+'"/>'+(clip==='cTop'?'<path d="M'+CX+' '+(CY-52)+'Q'+(CX+4)+' '+(CY-64)+' '+(CX+12)+' '+(CY-68)+'" stroke="#6E7A3A" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M'+(CX-26)+' '+(CY-28)+'Q'+(CX-32)+' '+(CY-8)+' '+(CX-26)+' '+(CY+4)+'" stroke="#fff" stroke-opacity=".4" stroke-width="5" fill="none" stroke-linecap="round"/>':'<circle cx="'+(CX+4)+'" cy="'+(CY+48)+'" r="6" fill="'+REDD+'"/>')+'</g></g>'}
    (function loop(now){var dt=Math.min(50,now-last)/1000;last=now;
      if(open&&open<1)open=Math.min(1,open+dt*2.5);
      var tw=Math.min(acc,NEED)*.35;
      bn.innerHTML=open?bean(CX-14,CY,3,null,0)+bean(CX+14,CY,3,null,180):'';
      hv.innerHTML=open?half('cTop',-18*open,-40*open,-22*open)+half('cBot',18*open,40*open,22*open):half('cTop',tw,0,0)+half('cBot',-tw,0,0);
      dn.innerHTML=Array.apply(null,{length:N}).map(function(_,j){return '<circle cx="'+(140+j*20)+'" cy="174" r="6" fill="'+(j<n?'#3F6B2E':'#fff')+'" stroke="#8A6A3A" stroke-width="1.2"/>'}).join('');
      raf=requestAnimationFrame(loop)})(last);
    loops.push(function(){cancelAnimationFrame(raf)});
    function prog(){bar.style.width=f1((n+(open?0:Math.min(1,acc/NEED)))/N*100)+'%'}
    function addRot(d){if(busy||done)return;if(Math.abs(d)>1)return;acc+=Math.abs(d)*57.3;prog();if(acc>=NEED)pop()}
    function pop(){busy=true;open=.01;n++;prog();
      if(n>=N){done=true;say(msg,'扭開了！兩顆種子，平平的那面貼在一起。');later(function(){say(msg,l.win);finish(i)},1300)}
      else{say(msg,'扭開了！裡面有<b>兩顆種子</b>，平平的那面貼在一起，這就是<b>咖啡豆</b>。再扭一顆！');later(function(){open=0;acc=0;busy=false;prog()},1600)}}
    function ang(p){return Math.atan2(p.y-CY,p.x-CX)}
    svg.style.touchAction='none';
    svg.addEventListener('pointerdown',function(e){var p=toSvg(svg,e);ptrs[e.pointerId]=p;try{svg.setPointerCapture(e.pointerId)}catch(_){}prevA=null});
    svg.addEventListener('pointermove',function(e){if(!ptrs[e.pointerId])return;var p=toSvg(svg,e);ptrs[e.pointerId]=p;var k=Object.keys(ptrs);
      var a;if(k.length>=2){var A=ptrs[k[0]],B=ptrs[k[1]];a=Math.atan2(B.y-A.y,B.x-A.x)}else{if(Math.hypot(p.x-CX,p.y-CY)<12)return;a=ang(p)}
      if(prevA!==null){var d=a-prevA;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;addRot(d)}prevA=a});
    ['pointerup','pointercancel'].forEach(function(t){svg.addEventListener(t,function(e){delete ptrs[e.pointerId];prevA=null})});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','咖啡果的畫面，按 Enter 扭開一顆');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done&&!busy){e.preventDefault();acc=NEED;pop()}});
    later(function(){if(!n&&acc<20&&!done)say(msg,'手指按在咖啡果上，<b>繞著它轉圈</b>；或用兩根手指捏住，像轉瓶蓋一樣<b>扭</b>。')},8000);
  },

  /* 第 4 關：拖著曬盤，一直待在有太陽的地方 */
  sun:function(area,i,l){
    var T=[64,166,262],tx=160,dry=0,done=false,shadeT=0,raf=0,last=performance.now(),t0=performance.now(),said=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EAF4F7"><rect x="-400" y="134" width="1200" height="120" fill="#D9C9A0"/><g id="sn"></g><g id="sh"></g>'+T.map(function(x){return longan(x,134,1.5)}).join('')+'<g id="tr"></g><text id="tx" x="160" y="186" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#D9C9A0" stroke-width="4" paint-order="stroke"></text></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),sn=svg.querySelector('#sn'),sh=svg.querySelector('#sh'),tr=svg.querySelector('#tr'),txt=svg.querySelector('#tx');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function mix(q){var a=[200,50,58],b=[74,46,34];return 'rgb('+a.map(function(v,k){return Math.round(v+(b[k]-v)*q)}).join(',')+')'}
    (function loop(now){var dt=Math.min(50,now-last)/1000;last=now;
      var q=((now-t0)/1000/16)%1,sx=30+q*260,sy=40-Math.sin(Math.PI*q)*22;
      sn.innerHTML='<circle cx="'+f1(sx)+'" cy="'+f1(sy)+'" r="13" fill="#F7D35A"/><circle cx="'+f1(sx)+'" cy="'+f1(sy)+'" r="19" fill="#F7D35A" opacity=".3"/>';
      var S=T.map(function(x){return x+(x-sx)*.4});
      sh.innerHTML=S.map(function(x){return '<ellipse cx="'+f1(x)+'" cy="152" rx="40" ry="12" fill="#6E6450" opacity=".45"/>'}).join('');
      var shade=S.some(function(x){return Math.abs(x-tx)<44});
      if(!done){if(shade){shadeT+=dt;if(shadeT>1.4&&said<3){said++;shadeT=-3;say(msg,'曬盤被<b>樹影</b>遮住了，曬不乾！拖到有太陽的地方。',1)}}else{shadeT=0;dry=Math.min(1,dry+dt/9)}
        bar.style.width=f1(dry*100)+'%';txt.textContent=shade?'在影子裡，曬不到':dry<.5?'曬太陽中⋯⋯':'快乾了！';
        if(dry>=1){done=true;txt.textContent='曬乾了！';say(msg,'曬好了！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},1000)}}
      var c=mix(dry),h='<rect x="'+f1(tx-40)+'" y="150" width="80" height="14" rx="2" fill="#B88A55" stroke="#7A5530" stroke-width="1.2"/>';
      for(var k=0;k<8;k++)h+='<circle cx="'+f1(tx-31.5+k*9)+'" cy="'+(k%2?154:156)+'" r="4.6" fill="'+c+'" stroke="#3A2018" stroke-width=".5"/>';
      tr.innerHTML=h;raf=requestAnimationFrame(loop)})(last);
    loops.push(function(){cancelAnimationFrame(raf)});
    drag(svg,function(t,p){if(done||t==='hover'||t==='up')return;tx=Math.max(50,Math.min(270,p.x))});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','曬咖啡果的畫面，按 Enter 曬乾');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();dry=1}});
    later(function(){if(dry<.1&&!done)say(msg,'手指按住畫面<b>左右拖</b>，曬盤會跟著你。看好樹影，讓曬盤待在<b>亮亮</b>的地方。')},8000);
  },

  /* 第 5 關：拿著烘豆網在火上一直左右搖 */
  roast:function(area,i,l){
    var nx=160,prog=0,burn=0,moveE=0,lastX=160,done=false,cracked=false,raf=0,last=performance.now(),offT=0,pops=[],smoke=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F3EEE4"><rect x="-400" y="150" width="1200" height="120" fill="#8A7A70"/><rect x="104" y="124" width="112" height="28" rx="4" fill="#4A4A4A"/><g id="fi"></g><g id="nt"></g><g id="pp"></g><text id="tx" x="160" y="182" font-size="15" font-weight="700" fill="#fff" text-anchor="middle"></text></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),fi=svg.querySelector('#fi'),nt=svg.querySelector('#nt'),pp=svg.querySelector('#pp'),txt=svg.querySelector('#tx');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    var Bp=[[-24,-2],[-12,-5],[0,-3],[12,-6],[24,-2],[-18,4],[-6,3],[6,5],[18,3]];
    function col(q){var st=[[157,179,106],[217,194,106],[138,90,50]],a,b,t;if(q<.5){a=st[0];b=st[1];t=q/.5}else{a=st[1];b=st[2];t=(q-.5)/.5}return 'rgb('+a.map(function(v,k){return Math.round(v+(b[k]-v)*t)}).join(',')+')'}
    (function loop(now){var dt=Math.min(50,now-last)/1000;last=now;
      moveE=moveE*Math.exp(-3*dt);var over=Math.abs(nx-160)<50,moving=moveE>30;
      if(!done){
        if(over&&moving){prog=Math.min(1,prog+dt/8);burn=Math.max(0,burn-dt)}
        else if(over){burn+=dt;if(burn>1.6){burn=0;prog=Math.max(0,prog-.06);smoke=1;say(msg,'冒煙了，豆子<b>焦</b>了一點！要一直<b>左右搖</b>。',1)}}
        else{offT+=dt;if(offT>2.5){offT=-4;say(msg,'網子要在<b>火</b>的上面搖，豆子才會熱。',1)}}
        if(prog>=.85&&!cracked){cracked=true;say(msg,'聽！啪、啪⋯⋯一爆開始了！再搖一下。')}
        if(cracked&&Math.random()<dt*6)pops.push({x:nx+(Math.random()-.5)*50,y:70,t:0});
        if(prog>=1){done=true;say(msg,'烘好了！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},1200)}
        bar.style.width=f1(prog*100)+'%';
        txt.textContent=prog<.3?'綠綠的生豆':prog<.6?'變黃了':prog<.85?'變成咖啡色了':'啪！啪！一爆';
      }
      smoke=Math.max(0,smoke-dt*.6);
      var fl='';for(var k=0;k<5;k++){var x=116+k*22,h=14+Math.sin(now/90+k*1.7)*5;fl+='<path d="M'+(x-8)+' 126Q'+(x-6)+' '+f1(126-h)+' '+x+' '+f1(122-h)+'Q'+(x+6)+' '+f1(126-h)+' '+(x+8)+' 126Z" fill="#F29A3A"/><path d="M'+(x-4)+' 126Q'+x+' '+f1(124-h*.6)+' '+(x+4)+' 126Z" fill="#F7D35A"/>'}
      fi.innerHTML=fl;
      var c=col(prog),jig=moving?1.5:0,h='<path d="M'+f1(nx+46)+' 88H'+f1(nx+96)+'" stroke="#8A6A3A" stroke-width="5" stroke-linecap="round"/><ellipse cx="'+f1(nx)+'" cy="90" rx="48" ry="14" fill="#C9D2D8" fill-opacity=".5" stroke="#6E777D" stroke-width="2"/>';
      Bp.forEach(function(b,k){h+=bean(nx+b[0]+(Math.random()-.5)*jig,88+b[1]+(Math.random()-.5)*jig,.85,c,k*40)});
      h+='<path d="M'+f1(nx-46)+' 90Q'+f1(nx)+' 112 '+f1(nx+46)+' 90" stroke="#6E777D" stroke-width="1.4" fill="none"/>';
      if(smoke>0)h+='<g opacity="'+f1(smoke)+'"><circle cx="'+f1(nx-10)+'" cy="58" r="10" fill="#9A9A9A"/><circle cx="'+f1(nx+6)+'" cy="46" r="13" fill="#B0B0B0"/></g>';
      nt.innerHTML=h;
      pops=pops.filter(function(o){o.t+=dt;return o.t<.6});
      pp.innerHTML=pops.map(function(o){return '<text x="'+f1(o.x)+'" y="'+f1(o.y-o.t*30)+'" font-size="15" font-weight="900" fill="#DB2E27" text-anchor="middle" opacity="'+f1(1-o.t/.6)+'">啪</text>'}).join('');
      raf=requestAnimationFrame(loop)})(last);
    loops.push(function(){cancelAnimationFrame(raf)});
    drag(svg,function(t,p){if(done||t==='hover')return;if(t==='down'){lastX=p.x;return}if(t==='move'){var x=Math.max(70,Math.min(250,p.x));moveE+=Math.abs(x-lastX)*3;lastX=x;nx=x}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','烘豆子的畫面，按 Enter 烘好');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();prog=1}});
    later(function(){if(prog<.05&&!done)say(msg,'手指按住畫面，在火的上面<b>左右來回</b>一直拖，網子就會搖。')},7000);
  },

  /* 第 6 關：上下滑數字，在導航上轉出 175 */
  dial:function(area,i,l){
    var D=[3,0,8],G=[1,7,5],X=[150,192,234],done=false,drv=0,act=null,acc=0,moved=0,raf=0,last=performance.now();
    if(D.every(function(d,k){return d===G[k]}))D=[2,0,8];
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EAF2F4"><rect x="-400" y="158" width="1200" height="100" fill="#CFD8A8"/>'+
      '<path id="rd" d="M-10 176C40 166 70 186 120 176S200 164 240 176S300 184 330 172" stroke="#F5EEDC" stroke-width="9" fill="none"/>'+
      '<rect x="72" y="24" width="190" height="124" rx="14" fill="#2E3A40"/><text x="167" y="44" font-size="14" font-weight="700" fill="#BFE3F0" text-anchor="middle">導航：要走哪一條路？</text>'+
      '<text x="106" y="102" font-size="20" font-weight="900" fill="#fff" text-anchor="middle">市道</text><g id="wh"></g><g id="car"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),wh=svg.querySelector('#wh'),car=svg.querySelector('#car'),rd=svg.querySelector('#rd');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){
      wh.innerHTML=D.map(function(d,k){var x=X[k],ok=d===G[k];return '<rect x="'+(x-18)+'" y="56" width="36" height="78" rx="8" fill="'+(ok?'#3F6B2E':'#46555C')+'"/>'+
        '<text x="'+x+'" y="72" font-size="13" fill="#9AB0BC" text-anchor="middle">'+((d+1)%10)+'</text><text x="'+x+'" y="106" font-size="32" font-weight="900" fill="#fff" text-anchor="middle">'+d+'</text><text x="'+x+'" y="128" font-size="13" fill="#9AB0BC" text-anchor="middle">'+((d+9)%10)+'</text>'+
        '<path d="M'+(x-6)+' 54L'+x+' 47L'+(x+6)+' 54Z" fill="#BFE3F0"/><path d="M'+(x-6)+' 136L'+x+' 143L'+(x+6)+' 136Z" fill="#BFE3F0"/>'}).join('');
      var ok=D.filter(function(d,k){return d===G[k]}).length;if(!done)bar.style.width=f1(ok/3*90)+'%';
    }
    draw();
    var L=rd.getTotalLength?rd.getTotalLength():300;
    (function loop(now){var dt=Math.min(50,now-last)/1000;last=now;
      if(done&&drv<1)drv=Math.min(1,drv+dt/1.8);
      var p=rd.getPointAtLength?rd.getPointAtLength(L*(.05+drv*.9)):{x:20+drv*280,y:176};
      car.innerHTML='<g transform="translate('+f1(p.x)+' '+f1(p.y-6)+')"><rect x="-12" y="-6" width="24" height="10" rx="3" fill="#DB2E27"/><rect x="-7" y="-11" width="13" height="6" rx="2" fill="#F2B0A8"/><circle cx="-7" cy="5" r="3" fill="#2A2020"/><circle cx="7" cy="5" r="3" fill="#2A2020"/></g>';
      raf=requestAnimationFrame(loop)})(last);
    loops.push(function(){cancelAnimationFrame(raf)});
    function step(k,d){if(done)return;D[k]=(D[k]+d+10)%10;draw();
      if(D.every(function(v,j){return v===G[j]})){done=true;bar.style.width='100%';say(msg,'市道 175，出發！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},2000)}}
    function wheelAt(p){for(var k=0;k<3;k++)if(Math.abs(p.x-X[k])<22&&p.y>40&&p.y<150)return k;return -1}
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){var w=wheelAt(p);moved=0;if(w<0){act=null;say(msg,'要在三個<b>數字</b>上面滑，或點數字的上面、下面。',1)}else act={k:w,y:p.y};return}
      if(!act)return;
      if(t==='move'){var dy=p.y-act.y;moved=Math.max(moved,Math.abs(dy));if(Math.abs(dy)>16){step(act.k,dy<0?1:-1);act.y=p.y}return}
      if(t==='up'){if(moved<6)step(act.k,p.y<95?1:-1);act=null}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','導航的畫面，按 Enter 設定市道 175');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();D=[1,7,4];step(2,1)}});
    later(function(){if(!done&&D.join('')==='308')say(msg,'手指按在數字上<b>往上滑</b>，數字會變大；<b>往下滑</b>會變小。也可以點數字上面的小三角形。')},8000);
  }
};
</script>
