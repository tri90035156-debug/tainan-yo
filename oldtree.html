<script>

/* ---------- 插畫元件 ---------- */
var K='#2A2020',NS='http://www.w3.org/2000/svg';
var GRASS='#CFE3B0',LEAF='#5E9A44',LEAFD='#3F7A34',BARK='#7A5638',BARKD='#5A3E28';
function f1(v){return (Math.round(v*10)/10).toString()}
function rnd(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280}}
// 一團一團的樹冠
function crown(cx,cy,rx,ry,c,c2,seed){var r=rnd(seed||3),h='<ellipse cx="'+f1(cx)+'" cy="'+f1(cy)+'" rx="'+f1(rx)+'" ry="'+f1(ry)+'" fill="'+c+'"/>';
  for(var k=0;k<7;k++){var a=k/7*6.283+r(),d=.62;h+='<circle cx="'+f1(cx+Math.cos(a)*rx*d)+'" cy="'+f1(cy+Math.sin(a)*ry*d)+'" r="'+f1(Math.min(rx,ry)*(.42+r()*.16))+'" fill="'+(k%2?c:c2)+'"/>'}
  return h}
// 從旁邊看的樹：bodhi 菩提樹（圓圓的大樹冠）、rain 雨豆樹（又寬又平像大傘）、bau 羊蹄甲（有粉紅色的花）、young 小樹
function treeSide(x,y,s,kind,seed){var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s)+')">';
  if(kind==='young')return h+'<path d="M0 0V-26" stroke="'+BARK+'" stroke-width="3" stroke-linecap="round"/><circle cy="-30" r="9" fill="#7EB85A"/><circle cx="-6" cy="-25" r="6" fill="#8CC46A"/><circle cx="6" cy="-26" r="6" fill="#6EA84C"/></g>';
  if(kind==='rain')return h+'<path d="M-6 0Q-4 -22 -2 -30L-22 -44M2 -30L24 -46M0 -30Q4 -20 6 0Z" stroke="'+BARK+'" stroke-width="5" fill="'+BARK+'" stroke-linecap="round" stroke-linejoin="round"/>'+crown(0,-52,58,18,'#6EA850','#5A9440',seed)+'</g>';
  if(kind==='bau'){var r=rnd(seed||5),f='';for(var k=0;k<9;k++)f+='<circle cx="'+f1((r()-.5)*44)+'" cy="'+f1(-44+(r()-.5)*24)+'" r="3.4" fill="#F2A6C8" stroke="#D8709C" stroke-width=".8"/>';
    return h+'<path d="M-4 0Q-3 -18 0 -28Q3 -18 4 0Z" fill="'+BARK+'"/>'+crown(0,-44,28,20,'#78AE58','#649A48',seed)+f+'</g>'}
  return h+'<path d="M-12 0Q-8 -10 -7 -30L-18 -44M7 -30L18 -46M7 -30Q8 -10 12 0Z" stroke="'+BARKD+'" stroke-width="4" fill="'+BARK+'" stroke-linejoin="round"/>'+crown(0,-58,40,30,LEAF,LEAFD,seed)+'</g>'}
// 菩提樹的葉子：像愛心，尾巴尖尖長長（尾巴朝下）
function bodhiLeaf(x,y,s,rot,c){return '<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+(rot||0)+') scale('+f1(s)+')"><path d="M0 -13C7 -21 17 -12 12 0C9 6 3 10 0 22C-3 10 -9 6 -12 0C-17 -12 -7 -21 0 -13Z" fill="'+(c||'#6EA850')+'" stroke="#3F7A34" stroke-width="1"/><path d="M0 -13V20M0 -4L7 -9M0 -4L-7 -9M0 4L6 0M0 4L-6 0" stroke="#3F7A34" stroke-width=".8" fill="none"/><path d="M0 -13V-19" stroke="#3F7A34" stroke-width="1.4"/></g>'}
// 羊蹄甲的葉子：前面裂成兩半，像羊的腳蹄（葉柄朝下）
function bauLeaf(x,y,s,rot,c){return '<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+(rot||0)+') scale('+f1(s)+')"><path d="M0 12C-10 12 -17 4 -16 -5C-15 -13 -7 -14 -2 -7L0 2L2 -7C7 -14 15 -13 16 -5C17 4 10 12 0 12Z" fill="'+(c||'#78AE58')+'" stroke="#3F7A34" stroke-width="1"/><path d="M0 12V2M0 7L-9 -4M0 7L9 -4" stroke="#3F7A34" stroke-width=".8" fill="none"/><path d="M0 12V17" stroke="#3F7A34" stroke-width="1.4"/></g>'}
// 從上面往下看的小朋友：肩膀＋頭
function kidTop(x,y,rot,c,hair,sc){return '<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+f1(rot||0)+') scale('+(sc||1)+')"><ellipse rx="11" ry="6.5" fill="'+c+'" stroke="#5A4E48" stroke-width="1"/><circle r="6.4" fill="'+(hair||'#3A2E28')+'"/><circle cy="-3.4" r="2.6" fill="#E8B890"/></g>'}
// 從旁邊看的小鳥（dir=-1 頭朝左）
function birdSide(x,y,s,c,dir,belly){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1((dir||1)*s)+' '+f1(s)+')"><path d="M-14 2L-22 -2L-20 6Z" fill="'+c+'"/><ellipse rx="13" ry="9" fill="'+c+'"/><ellipse cx="2" cy="3" rx="8" ry="5" fill="'+(belly||'#F4EEE0')+'"/><circle cx="9" cy="-6" r="6.5" fill="'+c+'"/><circle cx="11" cy="-7" r="1.6" fill="#1A1A1A"/><path d="M15 -6L21 -4L15 -3Z" fill="#E8A030"/><path d="M-2 8V13M3 8V13" stroke="#8A6A4A" stroke-width="1.4"/></g>'}
var ICON={
  water:'<path d="M-9 -3H4V9H-9Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M4 0L10 -6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M-9 0Q-14 2 -11 7" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="11" cy="-1" r="1.3" fill="#fff"/><circle cx="12" cy="3.5" r="1.3" fill="#fff"/><circle cx="10" cy="8" r="1.3" fill="#fff"/>',
  ring:'<circle r="4.2" fill="#fff"/><circle r="9" fill="none" stroke="#fff" stroke-width="1.4"/><circle cy="-9" r="2.6" fill="#fff"/><circle cx="7.8" cy="4.5" r="2.6" fill="#fff"/><circle cx="-7.8" cy="4.5" r="2.6" fill="#fff"/>',
  nest:'<path d="M-11 0Q0 13 11 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M-9 3H9M-7 6H7" stroke="#fff" stroke-width="1.1"/><ellipse cx="-3.4" cy="-2" rx="3.4" ry="2.6" fill="#fff"/><ellipse cx="3.4" cy="-2" rx="3.4" ry="2.6" fill="#fff"/>',
  bird:'<path d="M-4 6V-8L8 -10V4" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="-6.5" cy="6" r="3.2" fill="#fff"/><circle cx="5.5" cy="4" r="3.2" fill="#fff"/>',
  mallet:'<path d="M-1 -1L9 10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><rect x="-11" y="-6" width="14" height="8" rx="2" transform="rotate(42 -4 -2)" fill="#fff"/>',
  stake:'<path d="M0 -12L7 0H-7Z" fill="#fff"/><path d="M0 0V9" stroke="#fff" stroke-width="2.4"/><path d="M0 -3L-10 9M0 -3L10 9" stroke="#fff" stroke-width="1.4"/><rect x="-12" y="8" width="4" height="4" fill="#fff"/><rect x="8" y="8" width="4" height="4" fill="#fff"/>'
};
function icon(k){return '<svg viewBox="-12 -12 24 24" aria-hidden="true">'+ICON[k]+'</svg>'}

function idCard(t1,t2,art,C){
  var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EEF4E2" role="img" aria-label="'+t1+'的樣子"><rect x="-400" y="170" width="1200" height="60" fill="#8CB46A"/>'+art;
  C.forEach(function(c){s+='<path d="M'+c[3]+' '+c[4]+'L'+c[1]+' '+(c[2]-5)+'" stroke="#8A7A70" stroke-width="1.2"/><circle cx="'+c[3]+'" cy="'+c[4]+'" r="2.6" fill="#DB2E27"/>'+
    '<text x="'+c[1]+'" y="'+c[2]+'" font-size="15" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#EEF4E2" stroke-width="4" paint-order="stroke">'+c[0]+'</text>'});
  return s+'<text x="160" y="30" font-size="24" font-weight="900" fill="#2A2020" text-anchor="middle" font-family="Noto Serif TC,Songti TC,serif" stroke="#EEF4E2" stroke-width="4" paint-order="stroke">'+t1+'</text>'+(t2?'<text x="160" y="188" font-size="14" font-weight="700" fill="#FFF8EC" text-anchor="middle">'+t2+'</text>':'')+'</svg>';
}
// 一關做完：說過關的話，有題目就出題，再蓋章
function lvDone(area,i,l,msg,t){say(msg,t);later(function(){say(msg,l.win);if(l.q)quiz(area,l,function(){finish(i)});else finish(i)},900)}

/* ---------- 地圖 ---------- */
// 示意圖：臺南公園（北區）。「開園時」是 1917 年剛種下的小樹林；「今天」是長大的老樹、燕潭和重道崇文坊
var STOPS=[{lv:1,n:'公園大門',x:180,y:480,k:'gate'},{lv:2,n:'百年菩提樹',x:280,y:220,k:'bodhi'},{lv:3,n:'雨豆樹',x:610,y:190,k:'rain'},{lv:4,n:'羊蹄甲林',x:650,y:410,k:'bau'},{lv:5,n:'老樹檢查',x:440,y:470,k:'doctor'},{lv:6,n:'新的小樹',x:250,y:360,k:'young'}];
function marker(s){
  var t='<g transform="translate('+s.x+' '+s.y+')">';
  if(s.k==='gate')return t+'<rect x="-30" y="-26" width="9" height="34" fill="#E8DCC4" stroke="#8A7A60" stroke-width="1.2"/><rect x="21" y="-26" width="9" height="34" fill="#E8DCC4" stroke="#8A7A60" stroke-width="1.2"/><rect x="-34" y="-32" width="17" height="7" fill="#C8B898"/><rect x="17" y="-32" width="17" height="7" fill="#C8B898"/><path d="M-21 -18Q0 -30 21 -18" stroke="#6A5A40" stroke-width="2.4" fill="none"/></g>';
  if(s.k==='bodhi')return t+treeSide(0,14,.62,'bodhi',11)+bodhiLeaf(22,-30,.7,20,'#8CC46A')+'</g>';
  if(s.k==='rain')return t+treeSide(0,14,.56,'rain',12)+'</g>';
  if(s.k==='bau')return t+treeSide(-16,14,.5,'bau',13)+treeSide(16,16,.5,'bau',14)+'</g>';
  if(s.k==='doctor')return t+'<path d="M-14 16Q-10 -4 -10 -20H10Q10 -4 14 16Z" fill="'+BARK+'" stroke="'+BARKD+'" stroke-width="1.4"/><ellipse cx="0" cy="-2" rx="4" ry="6" fill="'+BARKD+'"/>'+crown(0,-28,24,12,LEAF,LEAFD,15)+'<path d="M18 4L28 -8" stroke="#8A6A3A" stroke-width="3" stroke-linecap="round"/><rect x="22" y="-16" width="14" height="8" rx="2" transform="rotate(40 29 -12)" fill="#C89A5A" stroke="#7A5A30" stroke-width="1"/></g>';
  return t+treeSide(0,10,.85,'young')+'<path d="M0 -14L-22 12M0 -14L22 12M0 -14L0 16" stroke="#E8D8A8" stroke-width="1.4"/><rect x="-25" y="9" width="5" height="7" fill="#8A6A3A"/><rect x="20" y="9" width="5" height="7" fill="#8A6A3A"/></g>';
}
function buildMap(){
  var h='<rect x="-400" y="-300" width="1600" height="1200" fill="#E4DCC8"/>';
  // 公園四周的馬路
  var road='<path d="M60 90H740V560H60Z" fill="none" stroke="#F8F4EA" stroke-width="22" stroke-linejoin="round"/>';
  h+='<g id="past"><rect x="-400" y="-300" width="1600" height="1200" fill="#E8E0C8"/>'+road+'<rect x="72" y="102" width="656" height="446" rx="18" fill="#DCE6B8"/><path d="M180 480Q240 400 300 330Q400 260 520 250Q620 260 650 400" stroke="#EADFC0" stroke-width="12" fill="none" stroke-linecap="round"/><g id="frPast"></g><text x="400" y="534" font-size="15" fill="#6C2024" text-anchor="middle" stroke="#DCE6B8" stroke-width="4" paint-order="stroke">1917 年開園：種下好多不同的小樹</text></g>';
  h+='<g id="now"><rect x="-400" y="-300" width="1600" height="1200" fill="#E4DCC8"/>'+road+'<rect x="72" y="102" width="656" height="446" rx="18" fill="'+GRASS+'"/>'+
    '<path d="M180 480Q240 400 300 330Q400 260 520 250Q620 260 650 400M440 470Q450 400 450 360" stroke="#F0E6CC" stroke-width="12" fill="none" stroke-linecap="round"/>'+
    '<ellipse cx="450" cy="315" rx="92" ry="44" fill="#8EC6DC" stroke="#6AA8C0" stroke-width="2"/><path d="M380 318Q410 300 430 322T470 316T520 320" stroke="#C89A6A" stroke-width="5" fill="none"/><g transform="translate(450 312)"><rect x="-10" y="-6" width="20" height="10" fill="#E8DCC4"/><path d="M-15 -6L0 -18L15 -6Z" fill="#B8573E"/></g>'+
    '<text x="450" y="378" font-size="15" font-weight="700" fill="#3A7A9A" text-anchor="middle" stroke="'+GRASS+'" stroke-width="4" paint-order="stroke">燕潭</text>'+
    '<g transform="translate(450 232)"><rect x="-26" y="-4" width="5" height="26" fill="#B8B0A0"/><rect x="21" y="-4" width="5" height="26" fill="#B8B0A0"/><rect x="-7" y="-4" width="4" height="26" fill="#B8B0A0"/><rect x="3" y="-4" width="4" height="26" fill="#B8B0A0"/><rect x="-32" y="-12" width="64" height="9" fill="#A8A090"/><path d="M-36 -12L0 -22L36 -12Z" fill="#8A8278"/></g>'+
    '<text x="450" y="274" font-size="14" fill="#5A4E48" text-anchor="middle" stroke="'+GRASS+'" stroke-width="4" paint-order="stroke">重道崇文坊</text>'+
    '<g id="frNow"></g><text x="400" y="534" font-size="15" fill="#6C2024" text-anchor="middle" stroke="'+GRASS+'" stroke-width="4" paint-order="stroke">今天：100 歲的老樹，長得好高好大</text></g>';
  var T=function(t,x,y,sz,c,bg){return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" fill="'+c+'" text-anchor="middle" stroke="'+(bg||'#E4DCC8')+'" stroke-width="4" paint-order="stroke">'+t+'</text>'};
  h+=T('臺南公園',400,60,28,'#3F6B2E');
  h+=T('往臺南火車站',640,594,13,'#8A7A70');
  h+='<g transform="translate(120 150)"><circle r="16" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.5"/><path d="M0 -11L5 4L0 1L-5 4Z" fill="#DB2E27"/><text y="12" font-size="9" fill="#5A4E48" text-anchor="middle">北</text></g>';
  h+=T('示意圖，不是真實比例',260,594,12,'#8A7A70');
  STOPS.forEach(function(s){h+='<g class="stop" data-lv="'+s.lv+'" role="button" aria-label="第 '+s.lv+' 關 '+s.n+'">'+marker(s)+'<circle cx="'+(s.x+30)+'" cy="'+(s.y-34)+'" r="10" fill="#fff" stroke="#E2574C" stroke-width="2"/><text x="'+(s.x+30)+'" y="'+(s.y-29.5)+'" font-size="13" fill="#E2574C" text-anchor="middle">'+s.lv+'</text><text x="'+s.x+'" y="'+(s.y+36)+'" font-size="16" font-weight="700" fill="#3F5A2A" text-anchor="middle" stroke="#FFF8EC" stroke-width="4" paint-order="stroke">'+s.n+'</text></g>'});
  h+='<g id="pin" style="display:none"><g class="pin"><path d="M0 0C-10 -14 -14 -20 -14 -27A14 14 0 1 1 14 -27C14 -20 10 -14 0 0Z" fill="#E2574C" stroke="#fff" stroke-width="2.5"/><text y="-22" font-size="12" fill="#fff" text-anchor="middle">你</text></g></g>';
  return h;
}
function near(x,y,w,hh){return STOPS.some(function(s){return Math.abs(s.x-x)<w&&Math.abs(s.y-y)<hh})}
function decorate(){
  var r=rnd(29),p='',q='';
  for(var x=100;x<720;x+=50)for(var y=130;y<520;y+=46){
    var cx=x+(r()-.5)*14,cy=y+(r()-.5)*10,a=r(),b=r();
    if(near(cx,cy,64,70))continue;
    if(Math.abs(cx-400)<120&&cy>505)continue;
    if(Math.abs(cx-120)<36&&Math.abs(cy-150)<36)continue;
    // 開園時：排得整整齊齊的小樹（實驗林）
    if(a<.7)p+=treeSide(x,y+10,.6,'young');
    // 今天：長大的樹（避開燕潭和牌坊）
    if(Math.abs(cx-450)<120&&cy>190&&cy<390)continue;
    if(b<.5)q+=treeSide(cx,cy+18,.36+r()*.12,b<.2?'rain':(b<.32?'bau':'bodhi'),Math.floor(r()*99));
    else if(b<.62)q+='<circle cx="'+f1(cx)+'" cy="'+f1(cy)+'" r="7" fill="#9CC878"/>';
  }
  map.querySelector('#frPast').innerHTML=p;
  map.querySelector('#frNow').innerHTML=q;
}

/* ---------- 關卡 ---------- */
var LV=[
  {cam:[60,0,660,660],kick:'老樹任務',h:'臺南公園的老樹',
   html:'<p>臺南火車站北邊的<b>臺南公園</b>，是臺南<b>最老、最大</b>的公園，<b>1917 年</b>就開園了。</p><p>公園裡有好多 <b>100 歲</b>的<b>老樹</b>。老樹也會生病、也怕颱風，需要有人照顧。</p><p class="task">跟著照顧老樹的<b>樹醫生阿姨</b>，去認識公園裡的老樹。每過一關，就能蓋一個章！</p>',
   after:'<p class="note">地圖右上角可以切換<b>開園時／今天</b>，看看 100 年前剛種下的小樹，和今天長大的老樹。<br>給大人：臺南公園在臺南市北區，臺南火車站北邊。爬樹、摘葉子會傷到老樹，抱抱、看看就好。</p>',

  {cam:[0,0,300,225],kick:'第 1 關・公園大門（1917 年）',h:'一筆畫走過小樹林',era:'past',

  /* 第 2 關：把小朋友拖到樹幹旁，手牽手圍成一圈 */

  /* 第 3 關：畫路讓小鳥回到同顏色的巢，路不能交叉 */

    var r0=rnd(6);for(var q=0;q<26;q++){var x=20+r0()*280,y=24+r0()*110;s+='<path d="M'+f1(x)+' '+f1(y)+'l7 -3M'+f1(x)+' '+f1(y)+'l7 3" stroke="#8AB060" stroke-width="2" stroke-linecap="round"/>'}
    for(var c=0;c<NC;c++)for(var r=0;r<NR;r++)s+='<rect x="'+(OX+c*C+2)+'" y="'+(OY+r*H+2)+'" width="'+(C-4)+'" height="'+(H-4)+'" rx="8" fill="#FFF8EC" fill-opacity=".62" stroke="#BD9558" stroke-width="1"/>';

      pl.innerHTML=h;en.innerHTML=e;bar.style.width=(fin.filter(Boolean).length/4*100)+'%'}

    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E4EED8"><rect x="-400" y="176" width="1200" height="80" fill="#9CBC78"/>'+crown(40,20,60,30,'#6EA850','#5A9440',3)+crown(280,24,60,30,'#6EA850','#5A9440',4)+
      '<path d="M100 -10L100 140Q96 166 72 178H248Q224 166 220 140L220 -10Z" fill="'+BARK+'" stroke="'+BARKD+'" stroke-width="2"/>';
    var r0=rnd(15);for(var q=0;q<9;q++){var x=110+q*12+(r0()-.5)*4;s+='<path d="M'+f1(x)+' 0Q'+f1(x+(r0()-.5)*10)+' 70 '+f1(x+(r0()-.5)*6)+' 170" stroke="'+BARKD+'" stroke-width="1.6" fill="none" opacity=".7"/>'}
    s+='<ellipse cx="178" cy="40" rx="5" ry="8" fill="'+BARKD+'"/><ellipse cx="124" cy="150" rx="6" ry="4" fill="'+BARKD+'"/><g id="mk"></g><g id="fx"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),mk=svg.querySelector('#mk'),fx=svg.querySelector('#fx');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){var h='';marks.slice(-40).forEach(function(m){h+='<circle cx="'+f1(m.x)+'" cy="'+f1(m.y)+'" r="3" fill="#E8D8B8" opacity=".75"/>'});
      HO.forEach(function(o){if(o.f)h+='<circle cx="'+o.x+'" cy="'+o.y+'" r="20" fill="#3A2818" fill-opacity=".35" stroke="#DB2E27" stroke-width="2.4" stroke-dasharray="5 4"/><text x="'+o.x+'" y="'+(o.y+5)+'" font-size="14" font-weight="900" fill="#FFF8EC" text-anchor="middle">空心</text>';
        else if(o.hint)h+='<circle cx="'+o.x+'" cy="'+o.y+'" r="26" fill="none" stroke="#FFF8EC" stroke-width="1.6" stroke-dasharray="3 5" opacity=".8"/>'});
      mk.innerHTML=h;bar.style.width=(HO.filter(function(o){return o.f}).length/2*100)+'%'}
    draw();
    function pop(p,t,c,big){var g=document.createElementNS(NS,'g');
      g.innerHTML='<g transform="translate('+f1(p.x+16)+' '+f1(p.y-14)+') rotate(-30)"><path d="M0 0L14 16" stroke="#8A6A3A" stroke-width="3" stroke-linecap="round"/><rect x="-9" y="-6" width="16" height="9" rx="2" fill="#C89A5A" stroke="#7A5A30" stroke-width="1"/></g><text x="'+f1(p.x)+'" y="'+f1(p.y-22)+'" font-size="'+(big?17:15)+'" font-weight="900" fill="'+c+'" text-anchor="middle" stroke="#FFF8EC" stroke-width="4" paint-order="stroke">'+t+'</text>';
      fx.appendChild(g);tms.push(setTimeout(function(){g.remove()},700))}
    drag(svg,function(t,p){
      if(done||t!=='down')return;
      if(!inTrunk(p)){say(msg,'要敲在<b>樹幹</b>上喔。',1);return}
      var o=null;HO.forEach(function(h){if(dist(p,h)<22)o=h});
      if(o&&o.f){pop(p,'空空～','#DB2E27');say(msg,'這裡已經找到了。再找另一個空心的地方。');return}
      if(o){o.f=1;o.hint=0;pop(p,'空空～','#DB2E27',1);beep(170,0,.5,'sine',.4,110);beep(260,0,.3,'sine',.15,180);draw();
        var n=HO.filter(function(h){return h.f}).length;
        if(n>=2){done=true;lvDone(area,i,l,msg,'<b>空空～</b>2 個空心的地方都找到了！');return}
        say(msg,'<b>空空～</b>聲音悶悶的！這裡是<b>空心</b>的。還有 1 個。');return}
      marks.push(p);miss++;pop(p,'叩叩！','#5A3E28');beep(950,0,.05,'triangle',.3);beep(1400,.05,.04,'triangle',.2);draw();
      if(miss===10)say(msg,'<b>叩叩！</b>還是好的木頭。從上面到下面、<b>一排一排</b>敲過去，不要漏掉。');
      else if(miss>=18&&!HO.some(function(h){return h.hint})){var h=HO.filter(function(q){return !q.f})[0];h.hint=1;draw();say(msg,'阿姨說：看看白色虛線圈起來的地方，敲那裡試試。')}
      else say(msg,'<b>叩叩！</b>聲音清脆、紮實，這裡是好的木頭。')
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','老樹樹幹的畫面，按 Enter 找出空心的地方');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();HO.forEach(function(h){h.f=1});done=true;draw();lvDone(area,i,l,msg,'2 個空心的地方都找到了！')}});
    later(function(){if(!done&&!miss&&!HO.some(function(h){return h.f}))say(msg,'用手指<b>點樹幹</b>，小木槌就會敲一下。聽聽看、看看字：<b>叩叩</b>是好的，<b>空空</b>是空心的。')},8000);
  },

  /* 第 6 關：從樹幹拉 3 條繩子到木樁，要往三個方向分開 */
  rope:function(area,i,l){
    var CX=160,CY=95,on=false,fp=null,done=false,busy=false,tilt={x:0,y:0},wind='',tms=[];
    loops.push(function(){tms.forEach(clearTimeout)});
    var ST=[270,320,20,100,160,215].map(function(a){var r=a*Math.PI/180;return {x:CX+108*Math.cos(r),y:CY+68*Math.sin(r),u:false}});
    ST.forEach(function(s){s.a=(Math.atan2(s.y-CY,s.x-CX)*180/Math.PI+360)%360});
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#D8E8C0"><rect x="-400" y="184" width="1200" height="80" fill="#C8DCA8"/>';
    var r0=rnd(21);for(var q=0;q<30;q++)s+='<path d="M'+f1(r0()*320)+' '+f1(r0()*180)+'l2 -5l2 5" stroke="#A8C890" stroke-width="1.4" fill="none"/>';
    s+='<g id="rp"></g><g id="tree"></g><g id="stk"></g><g id="wd"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),rp=svg.querySelector('#rp'),wd=svg.querySelector('#wd'),tree=svg.querySelector('#tree'),stk=svg.querySelector('#stk');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function used(){return ST.filter(function(s){return s.u})}
    function draw(){var h='',T={x:CX+tilt.x,y:CY+tilt.y};
      used().forEach(function(s){h+='<path d="M'+f1(T.x)+' '+f1(T.y)+'L'+f1(s.x)+' '+f1(s.y)+'" stroke="#8A7040" stroke-width="5" stroke-linecap="round"/><path d="M'+f1(T.x)+' '+f1(T.y)+'L'+f1(s.x)+' '+f1(s.y)+'" stroke="#E8D8A8" stroke-width="2.6" stroke-linecap="round"/>'});
      if(on&&fp)h+='<path d="M'+CX+' '+CY+'L'+f1(fp.x)+' '+f1(fp.y)+'" stroke="#E8D8A8" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>';
      rp.innerHTML=h;
      tree.innerHTML='<circle cx="'+f1(T.x)+'" cy="'+f1(T.y)+'" r="34" fill="#7EB85A" opacity=".55"/>'+[0,1,2,3,4,5].map(function(k){var a=k/6*6.283;return '<circle cx="'+f1(T.x+Math.cos(a)*20)+'" cy="'+f1(T.y+Math.sin(a)*20)+'" r="12" fill="#6EA84C" opacity=".6"/>'}).join('')+'<circle cx="'+CX+'" cy="'+CY+'" r="8" fill="'+BARK+'" stroke="'+BARKD+'" stroke-width="1.6"/>';
      stk.innerHTML=ST.map(function(s){return '<g transform="translate('+f1(s.x)+' '+f1(s.y)+')"><rect x="-11" y="-11" width="22" height="22" rx="3" fill="#A8804A" stroke="'+(s.u?'#DB2E27':'#6A4A2A')+'" stroke-width="'+(s.u?2.4:1.4)+'"/><circle r="5" fill="#C8A06A"/></g>'}).join('');
      wd.innerHTML=wind;bar.style.width=(done?100:used().length/3*95)+'%'}
    draw();
    function arrowFrom(a){var r=a*Math.PI/180,x1=CX+Math.cos(r)*150,y1=CY+Math.sin(r)*96,x2=CX+Math.cos(r)*56,y2=CY+Math.sin(r)*40,ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
      return '<g opacity=".85"><path d="M'+f1(x1)+' '+f1(y1)+'L'+f1(x2)+' '+f1(y2)+'" stroke="#6EC3DD" stroke-width="6" stroke-linecap="round"/><path d="M0 -9L14 0L0 9Z" fill="#6EC3DD" transform="translate('+f1(x2)+' '+f1(y2)+') rotate('+f1(ang)+')"/><text x="'+f1(x1+(x2-x1)*.35)+'" y="'+f1(y1+(y2-y1)*.35-8)+'" font-size="14" font-weight="700" fill="#2E7A98" text-anchor="middle" stroke="#FFF8EC" stroke-width="3" paint-order="stroke">風</text></g>'}
    function later2(fn,ms){tms.push(setTimeout(fn,reduce?0:ms))}
    function test(){var A=used().map(function(s){return s.a}).sort(function(a,b){return a-b}),best=0,mid=0;
      A.forEach(function(a,k){var n=A[(k+1)%A.length],g=n-a;if(g<=0)g+=360;if(g>best){best=g;mid=(a+g/2)%360}});
      busy=true;
      if(best>170){var from=(mid+180)%360,r=mid*Math.PI/180;wind=arrowFrom(from);tilt={x:Math.cos(r)*26,y:Math.sin(r)*18};draw();
        say(msg,'風從這邊吹過來，小樹往<b>沒有繩子</b>的那一邊歪了！點一個<b>木樁</b>拆掉繩子，換個方向綁。',1);
        later2(function(){tilt={x:0,y:0};wind='';busy=false;draw()},1500);return}
      var D=A.map(function(a){return (a+180)%360}),k=0;
      (function blow(){if(k>=D.length){wind='';tilt={x:0,y:0};done=true;busy=false;draw();lvDone(area,i,l,msg,'風從三個方向吹來，小樹都<b>站得穩穩的</b>！');return}
        var r=(D[k]+180)*Math.PI/180;wind=arrowFrom(D[k]);tilt={x:Math.cos(r)*3,y:Math.sin(r)*2};draw();say(msg,'試試看：風吹來了⋯⋯小樹站得住！');k++;later2(blow,700)})();
    }
    drag(svg,function(t,p){
      if(done||busy)return;
      if(t==='down'){
        if(Math.hypot(p.x-CX,p.y-CY)<28){if(used().length>=3){say(msg,'已經有 3 條繩子了。點一個<b>木樁</b>可以拆掉那條。',1);return}on=true;fp=p;draw();return}
        var s0=null;ST.forEach(function(s){if(s.u&&dist(p,s)<24)s0=s});
        if(s0){s0.u=false;draw();say(msg,'拆掉一條繩子了。再從<b>樹幹</b>拉一條到別的木樁。');return}
        say(msg,'從中間的<b>樹幹</b>開始，把繩子拉到木樁。',1);return}
      if(t==='move'&&on){fp=p;draw();return}
      if(t==='up'&&on){on=false;fp=null;var s1=null,bd=26;ST.forEach(function(s){var d=dist(p,s);if(!s.u&&d<bd){bd=d;s1=s}});
        if(!s1){draw();say(msg,'繩子要拉到<b>木樁</b>上再放開。',1);return}
        s1.u=true;draw();var n=used().length;
        if(n<3)say(msg,'綁好 <b>'+n+'</b> 條了！還要 '+(3-n)+' 條。');else test()}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','小樹和木樁的畫面，按 Enter 直接綁好繩子');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done&&!busy){e.preventDefault();ST.forEach(function(s,k){s.u=k%2===0});draw();test()}});
    later(function(){if(!done&&!used().length)say(msg,'手指按在中間的<b>樹幹</b>，不要放開，拉到一個<b>木樁</b>再放開，就綁好一條繩子。')},8000);
  }
};
