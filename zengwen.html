<h1>大水庫任務・水利・曾文水庫</h1>
<p>跟著水庫的阿姨看臺南和嘉義交界的<b>曾文水庫</b>：找出流進水庫的雨、選出不怕水推的<b>土石壩</b>、拖水輪讓發電的燈亮起來、大雨前先空出<b>滯洪空間</b>、打開<b>防淤隧道</b>排出泥水，最後讓<b>新烏山嶺隧道</b>繞開不穩的岩層。</p>
<p>地點：曾文水庫（臺南市楠西區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>曾文水庫在臺南和嘉義交界的山裡，攔住曾文溪的上游。水庫就是把雨水存起來的大水池，缺水的時候再放出來用。跟著在水庫上班的阿姨，從山上的雨開始，一路看到水被送去烏山頭。每過一關，就能蓋一個章。</p><h2>關卡</h2><ol>
<li><h3>第 1 關・上游的山：雨水從哪裡來</h3><p>阿姨指著水庫後面一大片山：「水庫裡的水，大部分是下在這些山上的雨。」雨落在山上，會順著山坡往下流。下雨以後，雨水會流進水庫的這一整片山，叫做集水區。曾文水庫的集水區大約有 481 平方公里，很大很大。</p><p>為什麼？為什麼水庫要蓋在山裡？ 水庫要接住一大片山流下來的雨。山谷的四周都是山，雨水從四面八方往山谷流，在山谷的出口蓋一道壩，就能把水攔下來存著。</p></li>
<li><h3>第 2 關・柳藤潭：用土和石頭堆的大壩</h3><p>水庫的大壩，蓋在一個叫柳藤潭的地方。大壩就是攔住河水的高牆。這道大壩不是用水泥灌的，是用土和石頭堆起來的土石壩。1967 年動工，1973 年蓋好，大約蓋了 6 年。</p><p>為什麼？為什麼大壩蓋在柳藤潭？ 有一說，1939 年就有人提議在這裡蓋壩，後來因為戰爭停下來。1959 年開始規劃，最後選了柳藤潭。</p></li>
<li><h3>第 3 關・發電廠：水往下衝，就能發電</h3><p>大壩旁邊的山肚子裡，藏著一座發電廠。水庫放水的時候，水從高的地方往下衝，推著水輪轉起來，就能發電。從水面到水輪的高度，叫做水頭。發完電的水，再流去烏山頭水庫給大家用。</p><p>為什麼？曾文水庫是為了發電蓋的嗎？ 不是。曾文的發電是順便的：水庫要放多少水，是看大家要用多少水決定的。水放下來的時候順便發電，發完電的水再流到烏山頭水庫。</p></li>
<li><h3>第 4 關・溢洪道：大雨來之前，先放水</h3><p>水庫快滿了，天氣預報說大雨要來。阿姨說：「要先放一點水，空出位子。」先空出來、準備裝大雨的位子，叫做滯洪空間。如果水庫已經滿了還一直下雨，水就要從溢洪道流走。溢洪道就是水太滿的時候，讓水流走的通道。</p><p>為什麼？空出來太多，也不好嗎？ 先放掉太多水，雨停了水庫卻裝不滿，缺水的時候就不夠用。所以要看預報，想好要空出多少。（這是遊戲的想法；真的要放多少，由水利署決定。）</p></li>
<li><h3>第 5 關・防淤隧道：泥沙要從底下排</h3><p>大雨會把山上的泥沙沖進水庫，沉在大壩前面的水底。沉在水庫裡的泥沙，叫做淤積。曾文水庫蓋的時候，水底沒有排沙的出口。2009 年的莫拉克颱風，一次帶來多到數不清的泥沙，堆得比發電的進水口還高。後來水庫蓋了防淤隧道，2018 年完工。</p><p>為什麼？防淤隧道是怎麼排沙的？ 大雨的時候，打開水庫底下的隧道，讓帶著泥沙的水直接衝到大壩的下游。這叫水力排砂，就是用水的力量把泥沙帶走。行政院的新聞稿說，一年能排掉很多很多泥沙。</p></li>
<li><h3>第 6 關・新烏山嶺隧道：穿過山，把水送去烏山頭</h3><p>曾文水庫的水，要穿過一座叫烏山嶺的山，送到烏山頭水庫。穿過山送水的隧道，叫做引水隧道。舊的烏山嶺隧道，是一百多年前、1920 年開始規劃施工的。報導說，2015 年起，旁邊又挖了一條新烏山嶺隧道，大約 3.4 公里長。</p><p>為什麼？已經有舊隧道，為什麼還要挖新的？ 舊隧道已經用了很久。報導說，新隧道每秒可以送 56 立方公尺的水，比舊的大約 40 還多。新的蓋好以後，舊的就留著當備用。</p></li>
</ol>

// 一直跑的動畫（換關時會自動停）
function anim(fn){var raf=0,last=0,on=true;function step(now){if(!on)return;var dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(fn(dt)===false){on=false;return}raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step);loops.push(function(){on=false;cancelAnimationFrame(raf)});return function(){on=false;cancelAnimationFrame(raf)}}
// 一定要等的時間（later() 在「減少動態效果」時會變成 0）
function wait(fn,ms){var t=setTimeout(fn,ms);loops.push(function(){clearTimeout(t)})}
// 點到線段的距離，和投影在線段上的位置（0～1）
function segP(p,a,b){var dx=b.x-a.x,dy=b.y-a.y,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy),0,1);return {d:Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy),t:t}}

        if(fill)h+='<path d="M'+f1(P[k].x)+' '+f1(P[k].y)+'L'+f1(P[k+1].x)+' '+f1(P[k+1].y)+'" stroke="'+WATER2+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 5"/>'}
      B.forEach(function(b,j){h+='<circle cx="'+f1(b.x)+'" cy="'+f1(b.y)+'" r="9" fill="#fff" stroke="#6C2024" stroke-width="2.4"/>';
        if(!done)h+='<circle cx="'+f1(b.x)+'" cy="'+f1(b.y)+'" r="20" fill="none" stroke="'+(sel===j?'#DB2E27':'#BD9558')+'" stroke-width="2" stroke-dasharray="4 3"/>'});
      tg.innerHTML=h;bar.style.width=(done?100:(3-nb)/3*80)+'%';return nb}
    draw();
    function check(){var nb=draw();if(done)return;
      if(nb){say(msg,'還有 <b>'+nb+'</b> 段（紅色的）碰到不穩的岩層。拖<b>轉彎點</b>繞開它。',1);return}
      done=true;draw();var t0=0;anim(function(dt){t0+=dt;draw(true);if(t0>1.2)return false});
      wait(function(){lvDone(area,i,l,msg,'繞開了！水從東口流進新隧道，從西口流出去。')},900)}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){var j=-1,bd=28;B.forEach(function(b,m){var d=dist(p,b);if(d<bd){bd=d;j=m}});if(j>=0){hold=j;sel=j;return}say(msg,'按住隧道上的<b>轉彎點</b>（金色虛線圈圈）拖。',1);return}
      if(t==='move'&&hold>=0){B[hold].x=clamp(p.x,62,254);B[hold].y=clamp(p.y,80,176);draw();return}
      if(t==='up'&&hold>=0){hold=-1;wait(check,250)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','隧道的兩個轉彎點，按空白鍵換一個，按方向鍵移動，按 Enter 看接通了沒');
    svg.addEventListener('keydown',function(e){if(done)return;var b=B[sel],m={ArrowUp:[0,-6],ArrowDown:[0,6],ArrowLeft:[-6,0],ArrowRight:[6,0]}[e.key];
      if(m){e.preventDefault();b.x=clamp(b.x+m[0],62,254);b.y=clamp(b.y+m[1],80,176);draw()}
      else if(e.key===' '){e.preventDefault();sel=1-sel;draw()}
      else if(e.key==='Enter'){e.preventDefault();check()}});
    later(function(){if(!done)say(msg,'試試一個往<b>上</b>、一個往<b>下</b>。')},9000);
  }
};
</script>
