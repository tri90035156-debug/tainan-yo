<script type="application/ld+json">{"@context":"https://schema.org","@type":["Game","LearningResource"],"name":"城門ミッション あそぶ 新しい水路をほったり、下肥（人のうんちのこやし）を運んだり、赤い光について媽祖楼（海の女神・媽祖のお宮）までこいだり。さいごは、いまも通れる清の時代の城門兌悦門をくぐります。 五条港・佛頭港（中国語版） 杉の木はこびミッション あそぶ 中国の福州から来た杉の木を小船にのせて、佛頭港へ。ドラゴンボートのようにこいだり、みんなで公平に分けたりして、材木屋さんの木を正しい場所へとどけよう。 五条港・南勢港（中国語版） 荷物はこびミッション あそぶ 大きな帆船が海の向こうから来たよ！布と薬を小船につみかえて、水仙宮（水の神さまのお宮）までこいでいこう。 五条港・南河港（中国語版） お役人おむかえミッション あそぶ 新しいお役人が船でやって来た！風をふかせて岸につけ、接官亭石坊（お役人をむかえる石の門）へ道案内。台南の16歳の成人式「做十六歳」も知って、さいごは大井頭（大きな井戸）で水をくもう。 五条港・安海港（中国語版） さとう船ミッション あそぶ ふくろづめのさとうを船につみこみ、3本の小さな水路をつなぎ、ポエ（神さまに聞く三日月形の木）をなげて、砂州をよけながら安平までとどけよう。 テーマ・史跡 史跡に入って、 ずっとむかしへ 台南は台湾でいちばん古い町で、あちこちに史跡があります。およそ400年前、オランダ人が安平の砂州にゼーランディア城をたてました。いまの安平古堡です。日本では江戸時代のはじめごろのことです。史跡は一年中見学できます。 史跡・安平古堡（中国語版） 古いとりでミッション あそぶ 古堡のボランティアのおじさんと、400年前へ。砂州の上にゼーランディア城のかたちをかこみ、材料をキャッチしてしっくいをつくり、倉庫で箱をおそう。清の兵士がレンガを運んで億載金城をたてるのを見て、ガジュマルの根を南の城壁にのばし、さいごは剣獅（剣をくわえた、シーサーのような魔よけ）を自分の門にもどします。 テーマ・お宮 旧暦9月9日は、 神さまのお誕生日 旧暦の9月9日は重陽の節句。そして三太子（太子爺）のお誕生日です。三太子はナタ（哪吒）という、子どもの姿をした神さまです。新営の太子宮はとても古くて有名なお宮で、台湾のあちこちの太子爺はここから分かれていったので、お誕生日には「里帰り」してきます。お宮では小さな声で、お参りの人のじゃまをしないようにね。 お宮・新営太子宮（中国語版） 太子爺のお誕生日ミッション あそぶ 太子宮のとなりにすむおばあちゃんと、太子爺のお誕生日のお祝いへ。屋根の上の銅像がもつ4つの神さまの道具を写真にとり、コイの池の草を丸でかこんでぬき、本殿ではしずかに歩こう。カードめくりで古いお宮のお話を知り、天公炉（大きな香炉）のコウモリを数え、さいごはみこしといっしょに里帰りします。 テーマ・お祭り 旧暦にあわせて、 台南のお祭りへ 台南では一年中にぎやかなお祭りがあります。旧暦1月15日の元宵節（げんしょうせつ）の夜、塩水では蜂炮（たくさんのロケット花火をいっせいに飛ばすお祭り）があります。むかし、はやり病をおいはらうために、関羽（関聖帝君）のみこしについて花火をあげ、無事をいのったのが始まりといわれています。蜂炮はとてもあぶないので、子どもは近づいてはいけません。ゲームで、自分の身を守る方法をおぼえよう。 お祭り・塩水の蜂炮（中国語版） 蜂炮あんぜんミッション あそぶ 塩水にすむ大おじさんと。塩水武廟（関羽のお宮）でいい伝えを聞き、大おじさんに防護服を着せ、メジャーで安全なきょりをはかり、紙にハチの巣の設計図をかこう。検査合格マークのある花火の台をさがして、さいごに花火のくずをそうじします。蜂炮はとてもあぶないので、子どもは近づいてはいけません。 テーマ・くだもの 台南のくだもの、 畑から知ろう 台南では一年中くだものがとれます。このテーマは産地からスタート。どうしてここで育つの？どうやって大きくなるの？農家さんは1年に何をするの？どうやって食べるの？秋は4つ：官田のヒシの実（烏山頭ダムの水で、春は田んぼ、秋はヒシの池に）、大内のアボカド（曽文渓のそばで育ち、木の上ではやわらかくならない）、麻豆のザボン（麻豆はむかし海べの港。二十四節気の霜降のころにとる）、東山のコーヒー（崁頭山で育ち、秋に実が赤くなる。10月にコーヒーまつり）。冬は2つ：善化のイチゴ（台湾でいちばん南のイチゴ産地。11月末から4月まで）、楠西・梅嶺のウメ（冬に梅の花、春にウメの実）。 くだもの・官田のヒシの実（中国語版） ヒシの実とりミッション あそぶ 官田でヒシを育てるおばあちゃんと、6月から10月まで。烏山頭ダムの水が田んぼに流れこむのを拡大して見て、葉っぱをめくってヒシの実をさがし、レンカク（水草の上を歩く鳥）のお父さんとひなの雨やどりを手伝おう。さいごは角をおして、水に入れてかたい実とやわらかい実に分けます。 くだもの・大内のアボカド（中国語版） アボカドミッション あそぶ 大内でアボカドを育てるおじさんと、1月から10月まで。おいしい品種をつぎ木し、ミツバチが花粉を運ぶ道をかき、多すぎる小さな実をとり、土をほって浅い根を見よう。熟した実を枝から切ったら、アボカドがやわらかくなる場所をさがします。 くだもの・麻豆のザボン（中国語版） ザボンミッション あそぶ 麻豆で大きなザボン（大白柚）を育てるおばさんと、冬から秋まで。はさみで枝をせんていし、においをたよりに花をさがし、実に紙ぶくろをかけ、土の水がふえすぎたりへりすぎたりしないようにしよう。霜降のころ、実をささえて2回切ってとり、さいごに厚い皮をむきます。 くだもの・東山のコーヒー（中国語版） コーヒーミッション あそぶ 東山でコーヒーを育てるお兄さんと。パズルで崁頭山の最初のコーヒーの木をつくり、葉っぱをかきわけて赤い実だけをつみ、実をひねって2つの種を見つけ、お日さまでほし、あみをゆすって豆をいる。さいごは175号線を通ってコーヒーまつりへ。 くだもの・善化のイチゴ（中国語版） イチゴミッション あそぶ 善化でイチゴを育てるおばさんと。夏はランナー（のびたくき）の先の苗をポットへ、9月に高いうねに植えてわらをしこう。花びらをとってイチゴが育つのを見て、赤くなったら上へおってつみ、1つずつパックへ。さいごは台湾の地図で「北は大湖、南は善化」をさがします。 くだもの・楠西梅嶺のウメ（中国語版） ウメミッション あそぶ 梅嶺でウメを育てるおじさんと。「バナナ山」のかんばんを梅嶺にかえ、冷たい空気を運んで山いっぱいの梅の花をさかせ、雨から花をかさで守り、枝をおらずに青梅をそっとつもう。熟し方でカリカリ梅やジャムにして、さいごはウメのチキンスープをつくります。 くだもの・東山のポンカン（中国語版） ポンカンミッション あそぶ 東山でポンカンを育てるおじさんと。台風の前に竹の棒で枝をささえ、お日さまを動かして皮が緑のポンカンも熟していることをたしかめよう。ななめの板で大きさを分け、うらがえして悪い実をよけ、くだもの屋さんで1斤（600グラム）をはかって、さいごはひとふさずつみんなに分けます。 水果・關廟鳳梨（中国語版） 旺來任務 あそぶ 跟著關廟種鳳梨的阿嬤：跨過山西宮的門檻、從太陽拉一條陽光找出向陽的山坡、算好秋天催花讓鳳梨春天收成、把鳳梨丟上貨車，再到關廟區農會挑出裂開的鳳梨、把好鳳梨排進箱子。 テーマ・お米 1つぶのお米、 田んぼからお茶わんまで 台南はあたたかいので、1年に2回お米をつくれます（二期作）。秋にかるのは2回目のお米。10月に穂が黄色くなって頭をたれ、11月なかばに稲かりです。このテーマは後壁・菁寮から。穂を見て、稲をかって、ほして、精米して、1つぶのお米ができるまでの手間を知ろう。 お米・後壁菁寮（中国語版） 稲かりミッション あそぶ 菁寮でお米をつくるおじいちゃんと、古い町なみから田んぼへ。白い布を藍のかめにひたして菁寮の名前のひみつを知り、穂をもち上げて実のつまった稲穂をさがし、コンバインで田んぼをかろう。脱穀おけでもみを落とし、もみほし場でならしてほして、さいごは白いお米になるまでこすります。 テーマ・魚の養殖 台南の海ぞいに、 四角い養殖池 台南の海ぞいには、魚を育てる養殖池がどこまでもならんでいます。台湾のサバヒー（ミルクフィッシュ）のおよそ半分は台南で育てられています。サバヒーは寒さに弱いので、毎年8月から12月、寒波が来る前に池から上げます。このテーマは学甲から。サバヒーが赤ちゃんの魚から、台南の朝ごはんのおかゆになるまでを見てみよう。 魚の養殖・学甲のサバヒー（中国語版） サバヒーミッション あそぶ 学甲でサバヒーを育てるおじさんと。下からすくって稚魚をとり、まるくかこんで魚に藻を食べさせ、両がわからあみを引いて魚をとろう。寒波の日は小さな魚を冬ごしのみぞへおいこみ、魚屋さんでうろこをとって、朝ごはんにはサバヒーの小骨をぬきます。 テーマ・渡り鳥 冬も夏も、 渡り鳥が台南へ 毎年秋になると、たくさんの渡り鳥が北から台南へ冬をこしにやって来ます。クロツラヘラサギは七股の曽文渓の河口へ、クロハラアジサシは北門のラグーンへ。世界のクロツラヘラサギの半分以上が、台湾で冬をすごします（日本の九州にも少し来ます）。夏になると、こんどはコアジサシが南のオーストラリアから来て、七股・頂山の塩田で卵をうみます。日本でも夏に見られる鳥です。 渡り鳥・クロツラヘラサギ（中国語版） クロツラヘラサギの冬ミッション あそぶ 野鳥観察小屋の小さな解説員になって、秋から春までクロツラヘラサギとすごそう。しずかにおりてくるのを待ち、望遠鏡で足環をさがし、水門をまわして水をぬき、さいごは北へ帰るのを見送ります。 渡り鳥・クロハラアジサシ（中国語版） 鳥のたつまきミッション あそぶ おじいちゃんと北門のラグーンで「おなかの黒い鳥」を記録しよう。クロハラアジサシを見分け、水面で魚をとるところを見て、指で鳥のたつまきをつくり、小船でしずかに港へもどります。 渡り鳥・コアジサシ（中国語版） 砂の巣ミッション あそぶ 夏の七股の塩田で、小さなパトロール隊員に。パチンコでコアジサシをオーストラリアから島づたいにとばし、卵に保護色をつけ、ブロックをつんで雨やどりの場所をつくり、うかぶ観察台の360度カメラをまわそう。 テーマ・温泉 山の温泉に、 地下のひみつ 台南の北東の山に関子嶺温泉があります。お湯は灰色のどろの温泉で、日本統治時代には台湾の四大温泉の1つでした。近くには、水の中から火がもえる水火同源もあります。秋になってすずしくなると、温泉グルメまつりの季節です。 温泉・関子嶺（中国語版） どろ温泉ミッション あそぶ 関子嶺の温泉街で育ったいとこのお姉さんと。宝泉橋で温泉の温度をはかり、地下の熱いお湯を泥岩の中におし上げ、雨がふってもきえない水火同源の火を見よう。右足・左足で好漢坡の階段をのぼり、ちょうどいい温度のお風呂をつくって、温泉グルメまつりの夜景を写真にとります。 テーマ・古い木 古い木をだっこして、 100年のお話を聞こう 台南市には、登録されて守られている古い木（老樹）が342本あります。古い木も病気になるし、台風もこわいので、みんなで世話をしています。北区の台南公園は1917年に開園し、100歳の古い木がたくさんあります。一年中見に行けます。 古い木・台南公園（中国語版） 古い木ミッション あそぶ 樹木のお医者さんのおばさんと、台南公園の古い木を知ろう。一筆がきで小さな木に水をやり、手をつないで100年のボダイジュをかこみ、小鳥をレインツリー（雨豆樹）の巣へもどそう。バウヒニア（羊蹄甲）の林で鳴き声の主をあて、木をたたいて空洞を見つけ、台風のあとに植えた小さな木をロープでささえます。 テーマ・考古学 下へほって、 5000年前を見よう 南部サイエンスパークをつくるとき、土の中から5000年前（日本の縄文時代のころ）の人がのこしたものがたくさん出てきました。土器、お米、そして台湾でいちばん古いイヌ。そのお宝は、いま新市の南科考古館にあり、一年中見学できます。 考古学・南科考古館 発掘ミッション","url":"https://tainanyo.tw/ja/nanke.html","description":"発掘チームのお姉さんと下へほろう。地層を古い順にならべ、マス目から台湾でいちばん古いイヌを見つけ、ピンセットで5000年前の炭化米をつまみ、なわめもようの土器をつくろう。半分から土器のかたちをかいて、さいごにお宝をゆっくり展示ケースへ。","inLanguage":"ja","image":"https://tainanyo.tw/img/nanke.png","isAccessibleForFree":true,"learningResourceType":"interactive game","educationalLevel":"elementary school","audience":{"@type":"EducationalAudience","educationalRole":"student"},"translationOfWork":{"@id":"https://tainanyo.tw/nanke.html#game"},"publisher":{"@type":"Organization","@id":"https://tainanyo.tw/#org","name":"三角影像有限公司","url":"https://www.trimedia.tw/","email":"tri90035156@gmail.com","logo":{"@type":"ImageObject","url":"https://tainanyo.tw/logo.png","width":512,"height":512}},"contentLocation":{"@type":"Place","name":"南科考古館（臺南市新市區）","address":{"@type":"Postal function smooth(pts){var d='M'+f1(pts[0][0])+' '+f1(pts[0][1]);
  for(var k=1;k<pts.length-1;k++)d+='Q'+f1(pts[k][0])+' '+f1(pts[k][1])+' '+f1((pts[k][0]+pts[k+1][0])/2)+' '+f1((pts[k][1]+pts[k+1][1])/2);
  var l=pts[pts.length-1];return d+'L'+f1(l[0])+' '+f1(l[1])}
// 圓底陶罐的半邊形狀：[離罐口多遠, 半邊多寬]
var PROF=[[0,30],[10,25],[22,40],[42,58],[66,64],[90,54],[108,32],[118,0]];
function potW(dy){if(dy<=0)return PROF[0][1];for(var k=1;k<PROF.length;k++)if(dy<=PROF[k][0]){var a=PROF[k-1],b=PROF[k];return a[1]+(b[1]-a[1])*(dy-a[0])/(b[0]-a[0])}return 0}
function potSide(cx,top,s,dir){return PROF.map(function(p){return [cx+dir*p[1]*s,top+p[0]*s]})}
function potPath(cx,top,s){var r=potSide(cx,top,s,1),l=potSide(cx,top,s,-1).reverse();return smooth(r)+smooth(l).replace('M','L')+'Z'}
// 繩紋：斜斜的細線花紋（id 要不一樣，地圖和遊戲圖才不會打架）
function cordDef(id,c){return '<defs><pattern id="'+id+'" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><rect width="5" height="5" fill="none"/><path d="M0 2.5H5" stroke="'+(c||'#6E3E22')+'" stroke-width="1.5" opacity=".6"/></pattern></defs>'}
function pot(cx,top,s,cord){var d=potPath(cx,top,s);return '<path d="'+d+'" fill="'+CLAY+'" stroke="#7A4A2E" stroke-width="'+f1(1.6/Math.max(.5,s))+'"/>'+(cord?'<path d="'+d+'" fill="url(#'+cord+')"/>':'')+'<ellipse cx="'+f1(cx)+'" cy="'+f1(top)+'" rx="'+f1(30*s)+'" ry="'+f1(5*s)+'" fill="#7A4A2E"/>'}

function dogBones(x,y,s){var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s)+')" stroke="#A8906A" stroke-linecap="round" stroke-linejoin="round">';

  return h+'</g>'}

function near(x,y,w,hh){return STOPS.some(function(s){return Math.abs(s.x-x)<w&&Math.abs(s.y-y)<hh})}
function decorate(){
  var r=rnd(41),p='',q='';
  for(var x=20;x<820;x+=46)for(var y=30;y<540;y+=42){
    var cx=x+(r()-.5)*10,cy=y+(r()-.5)*8,a=r(),b=r();
    if(near(cx,cy,62,66))continue;
    if(Math.abs(cx-400)<50&&Math.abs(cy-48)<24)continue;
    if(Math.abs(cx-100)<34&&Math.abs(cy-400)<34)continue;
    // 5000 年前：茅草屋、稻田、樹（河的旁邊不放）
    if(cy<488||cy>530){
      if(a<.16)p+='<g transform="translate('+f1(cx)+' '+f1(cy)+')"><rect x="-10" y="-2" width="20" height="12" fill="#C8A878" stroke="#8A6A3A" stroke-width="1"/><path d="M-15 -1L0 -15L15 -1Z" fill="#B89A5A" stroke="#7A6030" stroke-width="1"/></g>';

      else if(a<.8)p+='<g transform="translate('+f1(cx)+' '+f1(cy)+')"><path d="M0 2V10" stroke="#6A4A2A" stroke-width="2.4"/><circle cy="-4" r="9" fill="#6EA048"/></g>';
    }
    // 今天：工廠（避開馬路）
    if(Math.abs(cy-90)<26||Math.abs(cy-470)<26||Math.abs(cx-110)<30||Math.abs(cx-740)<30)continue;
    if(b<.55)q+='<g transform="translate('+f1(cx)+' '+f1(cy)+')"><rect x="-17" y="-8" width="34" height="18" fill="'+(a<.5?'#B8C4CC':'#C8CCD4')+'" stroke="#8A96A0" stroke-width="1"/><path d="M-17 -8L-11 -14V-8L-5 -14V-8L1 -14V-8L7 -14V-8" fill="#9AA6B0" stroke="#8A96A0" stroke-width="1"/></g>';

  }
  // 5000 年前：村子裡的人和小狗
  p+='<g transform="translate(350 250)"><circle cy="-14" r="5" fill="#C8906A"/><path d="M-5 -9H5L6 6H-6Z" fill="#8A6A4A"/><path d="M14 2Q20 -4 28 0Q30 4 26 6H16Z" fill="#B8865A"/><circle cx="29" cy="-1" r="3.4" fill="#B8865A"/><path d="M15 3Q10 -2 12 -6" stroke="#B8865A" stroke-width="2" fill="none"/></g>';
  map.querySelector('#frPast').innerHTML=p;
  map.querySelector('#frNow').innerHTML=q;
}

  /* 第 3 關：用鑷子點兩下，夾起碳化稻米和小米 */
  tweezer:function(area,i,l){
    var T=[{k:'r',x:90,y:80,r:20},{k:'r',x:150,y:58,r:-30},{k:'r',x:218,y:92,r:60},{k:'r',x:118,y:134,r:10},{k:'m',x:186,y:140},{k:'m',x:250,y:70},{k:'s',x:62,y:110},{k:'s',x:132,y:96},{k:'s',x:180,y:104},{k:'s',x:242,y:128}],
      N=6,n=0,done=false,lastK=-1,lastT=0,tm=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E8EEF0"><rect x="-400" y="180" width="1200" height="80" fill="#C8BCA8"/><ellipse cx="160" cy="100" rx="134" ry="78" fill="#F4F0E8" stroke="#A89A88" stroke-width="2"/><ellipse cx="160" cy="100" rx="122" ry="68" fill="#D8BC90"/>';
    var r0=rnd(7);for(var q=0;q<70;q++){var a=r0()*6.283,d=Math.sqrt(r0());s+='<circle cx="'+f1(160+Math.cos(a)*d*114)+'" cy="'+f1(100+Math.sin(a)*d*62)+'" r="'+f1(.8+r0()*1.2)+'" fill="#B89868"/>'}
    s+='<g id="it"></g><g id="tw"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),it=svg.querySelector('#it'),tw=svg.querySelector('#tw');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){it.innerHTML=T.filter(function(o){return !o.got}).map(function(o){return o.k==='r'?riceG(o.x,o.y,o.r,1.35):o.k==='m'?milletG(o.x,o.y,1.3):stoneG(o.x,o.y,1.3)}).join('');bar.style.width=(n/N*100)+'%'}
    function tweez(o,shut){if(!o){tw.innerHTML='';return}var g=shut?2:7;
      tw.innerHTML='<g transform="translate('+o.x+' '+o.y+')"><path d="M2 -3L34 -50M'+g+' 0L44 -44" stroke="#8A96A0" stroke-width="3" stroke-linecap="round"/><path d="M2 -3L34 -50M'+g+' 0L44 -44" stroke="#D8E0E6" stroke-width="1.2" stroke-linecap="round"/></g>'}
    draw();
    loops.push(function(){clearTimeout(tm)});
    function pick(o){o.got=true;n++;tweez(null);draw();
      if(n>=N){done=true;lvDone(area,i,l,msg,'6つぶ、ぜんぶつまめた！')}else say(msg,(o.k==='r'?'<b>炭化米</b>':'<b>アワ</b>')+'をつまんだ！あと '+(N-n)+' つぶ。')}
    drag(svg,function(t,p){
      if(done||t!=='down')return;
      var now=performance.now(),best=-1,bd=22;T.forEach(function(o,j){if(o.got)return;var d=Math.hypot(p.x-o.x,p.y-o.y);if(d<bd){bd=d;best=j}});
      if(best<0){lastK=-1;tweez(null);say(msg,'<b>つぶ</b>の上をタップしてね。',1);return}
      var o=T[best];
      if(best===lastK&&now-lastT<550){lastK=-1;clearTimeout(tm);
        if(o.k==='s'){tweez(null);say(msg,'それは<b>小石</b>だよ。炭化米は<b>黒い</b>よ。',1);return}
        tweez(o,1);later(function(){pick(o)},120);return}
      lastK=best;lastT=now;tweez(o);clearTimeout(tm);
      tm=setTimeout(function(){if(lastK===best&&!done)say(msg,'ピンセットが合ったよ！<b>すばやく</b>2回タップすると、つまめるよ。',1)},700)
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','お皿の画面。Enter キーで1つぶつまみます');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var o=T.filter(function(q){return !q.got&&q.k!=='s'})[0];if(o)pick(o)}});
    later(function(){if(!n&&!done)say(msg,'<b>黒くて細長い</b>お米をさがして、その上を<b>すばやく2回タップ</b>しよう（マウスのダブルクリックみたいに）。')},8000);
  },

  /* 第 4 關：點一下陶罐，木拍拍出繩紋，拍滿整個陶罐 */
  stamp:function(area,i,l){
    var TOP=28,S=1.22,CX=160,pts=[],done=false,tm=0,d=potPath(CX,TOP,S),r0=rnd(5);
    function inPot(x,y){var dy=(y-TOP)/S;return dy>=0&&dy<=118&&Math.abs(x-CX)<=potW(dy)*S}
    for(var y=TOP+5;y<TOP+118*S-5;y+=8)for(var x=CX-80;x<=CX+80;x+=8){var dy=(y-TOP)/S;if(Math.abs(x-CX)<potW(dy)*S-5)pts.push({x:x,y:y,c:false})}
    var coil='';for(var cy=TOP+8;cy<TOP+118*S;cy+=9)coil+='<path d="M60 '+cy+'H260" stroke="#B87A4A" stroke-width="1.4"/>';
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EDE4CC"><rect x="-400" y="176" width="1200" height="80" fill="#B8A07A"/>'+cordDef('cordS')+'<defs><clipPath id="potClip"><path d="'+d+'"/></clipPath></defs><path d="'+d+'" fill="'+CLAY+'"/><g clip-path="url(#potClip)">'+coil+'<g id="stp"></g></g><path d="'+d+'" fill="none" stroke="#7A4A2E" stroke-width="2"/><ellipse cx="'+CX+'" cy="'+TOP+'" rx="'+f1(30*S)+'" ry="'+f1(5*S)+'" fill="#7A4A2E"/><g id="dots"></g><g id="pd"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),stp=svg.querySelector('#stp'),dots=svg.querySelector('#dots'),pd=svg.querySelector('#pd');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    loops.push(function(){clearTimeout(tm)});
    function cov(){return pts.filter(function(q){return q.c}).length/pts.length}
    function hitAt(x,y){var a=Math.round((r0()-.5)*30);
      stp.insertAdjacentHTML('beforeend','<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+a+')"><rect x="-21" y="-21" width="42" height="42" fill="#B47444"/><rect x="-21" y="-21" width="42" height="42" fill="url(#cordS)"/></g>');
      pts.forEach(function(q){if(Math.abs(q.x-x)<=19&&Math.abs(q.y-y)<=19)q.c=true});
      var c=cov();bar.style.width=f1(Math.min(1,c/.92)*100)+'%';
      pd.innerHTML='<g transform="translate('+f1(x)+' '+f1(y)+') rotate(-20)"><rect x="-4" y="-40" width="8" height="24" rx="2" fill="#8A5A3A"/><rect x="-16" y="-16" width="32" height="18" rx="3" fill="#A87A4A" stroke="#6A4A2A" stroke-width="1.2"/><path d="M-16 -12L16 -8M-16 -6L16 -2" stroke="#E8D8B0" stroke-width="1.6"/></g>';
      clearTimeout(tm);tm=setTimeout(function(){pd.innerHTML=''},220);
      if(c>=.92){done=true;dots.innerHTML='';pts.forEach(function(q){q.c=true});stp.insertAdjacentHTML('beforeend','<rect x="0" y="0" width="320" height="190" fill="#B47444"/><rect x="0" y="0" width="320" height="190" fill="url(#cordS)"/>');bar.style.width='100%';lvDone(area,i,l,msg,'ぜんぶたたけた！');return}
      if(c>.7){dots.innerHTML=pts.filter(function(q){return !q.c}).map(function(q){return '<circle cx="'+q.x+'" cy="'+q.y+'" r="2.2" fill="#FFF8EC"/>'}).join('');say(msg,'もうすこし！<b>白い点</b>のところが、まだだよ。')}
      else say(msg,'ペタン！つるつるのところも、たたこう。')}
    drag(svg,function(t,p){
      if(done||t!=='down')return;
      if(!inPot(p.x,p.y)){say(msg,'<b>土器</b>の上をタップしてね。',1);return}
      hitAt(p.x,p.y)
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','土器の画面。Enter キーで、なわのもようをつけます');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();pts.forEach(function(q){q.c=true});hitAt(CX,TOP+60)}});
    later(function(){if(!done&&cov()===0)say(msg,'土器を<b>タップ</b>すると、木の板でペタンとたたくよ。いろいろなところをタップして、土器ぜんたいをたたこう。')},7000);
  },

  /* 第 5 關：看左邊半個陶罐，在右邊畫出對稱的另一半 */
  mirror:function(area,i,l){
    var TOP=30,S=1.18,CX=160,HH=118*S,line=[],on=false,done=false,fails=0,TG=[];
    for(var dy=0;dy<=118;dy+=1)TG.push([CX+potW(dy)*S,TOP+dy*S]);
    var left=potSide(CX,TOP,S,-1),right=potSide(CX,TOP,S,1);
    var dl='M'+CX+' '+TOP+smooth(left).replace('M','L')+'Z',dr='M'+CX+' '+TOP+smooth(right).replace('M','L')+'Z';
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F2EEE6"><rect x="-400" y="180" width="1200" height="80" fill="#C8BCA8"/>'+cordDef('cordR')+
      '<path d="'+dl+'" fill="'+CLAY+'" stroke="#7A4A2E" stroke-width="2"/><path d="'+dl+'" fill="url(#cordR)"/><path d="M140 46L122 80L132 110M98 112L122 128L138 158M112 64L96 86" stroke="#6E3E22" stroke-width="1.4" fill="none"/>'+
      '<path d="M160 20V182" stroke="#8A7A70" stroke-width="1.4" stroke-dasharray="5 4"/><g id="gd"></g><g id="rt"></g>'+
      '<circle cx="'+f1(CX+30*S)+'" cy="'+TOP+'" r="5" fill="#DB2E27"/><text x="'+f1(CX+30*S+12)+'" y="'+(TOP-6)+'" font-size="13" font-weight="700" fill="#DB2E27">ここから</text><path id="ln" d="" stroke="#6C2024" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),ln=svg.querySelector('#ln'),gd=svg.querySelector('#gd'),rt=svg.querySelector('#rt');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function show(){ln.setAttribute('d',line.length?'M'+line.map(function(q){return f1(q.x)+' '+f1(q.y)}).join('L'):'')}
    function dist(q){var m=1e9;TG.forEach(function(g){var d=Math.hypot(q.x-g[0],q.y-g[1]);if(d<m)m=d});return m}
    function win(){done=true;on=false;gd.innerHTML='';rt.innerHTML='<path d="'+dr+'" fill="'+CLAY+'" stroke="#7A4A2E" stroke-width="2"/><path d="'+dr+'" fill="url(#cordR)"/>';bar.style.width='100%';lvDone(area,i,l,msg,'左右がそろった！')}
    function check(){
      var err=0;line.forEach(function(q){err+=dist(q)});err/=Math.max(1,line.length);
      var hitN=0,tot=0;TG.forEach(function(g,k){if(k%4)return;tot++;if(line.some(function(q){return Math.hypot(q.x-g[0],q.y-g[1])<15}))hitN++});
      var cv=hitN/tot;bar.style.width=f1(Math.min(1,cv)*100)+'%';
      if(cv>=.8&&err<10){win();return}
      fails++;line=[];show();
      if(cv<.8&&err<10)say(msg,'形はそっくり！でも<b>口</b>（赤い点）から<b>底</b>（まん中の点線）まで、ずっとかいてから指をはなしてね。',1);
      else say(msg,'左とちょっとちがうね。左を見て：口は<b>小さく</b>、おなかは<b>まるくふくらんで</b>、底は<b>まるい</b>よ。右も同じ形にかこう。',1);
      if(fails>=2){gd.innerHTML='<path d="'+smooth(right)+'" stroke="#DB2E27" stroke-width="2" stroke-dasharray="3 5" fill="none" opacity=".7"/>';say(msg,'<b>赤い点線</b>をなぞって、赤い点から底までかこう。',1)}
    }
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){if(p.x<CX-6){say(msg,'<b>右がわ</b>にかいてね。左はもうできているよ。',1);on=false;return}on=true;line=[{x:p.x,y:p.y}];show();return}
      if(!on)return;
      if(t==='move'){var a=line[line.length-1];if(Math.hypot(p.x-a.x,p.y-a.y)>2){line.push({x:p.x,y:p.y});show()}return}
      if(t==='up'){on=false;if(line.length<5){line=[];show();say(msg,'指を<b>はなさずに</b>、ずっとかいていこう。',1);return}check()}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','土器の画面。Enter キーで、のこり半分をかきます');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();win()}});
    later(function(){if(!done&&!fails&&!line.length)say(msg,'右上の<b>赤い点</b>に指をおいて、はなさずに、左と同じ形（左右反対）で底までかこう。')},8000);
  },

  /* 第 6 關：慢慢把文物拖進展示櫃（太快會晃） */
  slow:function(area,i,l){
    var SL=[{x:222,y:72},{x:274,y:72},{x:248,y:128}],IT=[{k:'pot',x:48,y:116},{k:'dog',x:86,y:116},{k:'rice',x:124,y:116}],held=null,off={x:0,y:0},lastP=null,lastT=0,v=0,fast=0,n=0,done=false;
    IT.forEach(function(o){o.hx=o.x;o.hy=o.y});
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F0ECE4"><rect x="-400" y="172" width="1200" height="80" fill="#A8A4A0"/>'+cordDef('cordL')+
      '<rect x="196" y="38" width="106" height="120" rx="4" fill="#DDEFF4" fill-opacity=".8" stroke="#7A8A90" stroke-width="2"/><path d="M196 100H302" stroke="#7A8A90" stroke-width="2"/><rect x="190" y="158" width="118" height="10" fill="#5A4E48"/><text x="249" y="30" font-size="14" font-weight="700" fill="#5A4E48" text-anchor="middle">展示ケース</text>'+
      '<path d="M24 134H148V146H24Z" fill="#8A6A3A" stroke="#5A3E2B" stroke-width="1.2"/><path d="M148 134L160 110" stroke="#5A3E2B" stroke-width="3" stroke-linecap="round"/><circle cx="42" cy="156" r="9" fill="#5A3E2B"/><circle cx="130" cy="156" r="9" fill="#5A3E2B"/><text x="86" y="170" font-size="13" fill="#5A4E48" text-anchor="middle" stroke="#F0ECE4" stroke-width="3" paint-order="stroke">台車</text><g id="sl"></g><g id="it"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),slg=svg.querySelector('#sl'),itg=svg.querySelector('#it');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function art(o){var x=o.x,y=o.y;
      if(o.k==='pot')return pot(x,y-17,.28,'cordL');
      if(o.k==='dog')return '<rect x="'+(x-16)+'" y="'+(y-20)+'" width="32" height="40" rx="3" fill="#C8A47A" stroke="#8A6A48"/>'+dogBones(x,y-1,.36);
      return '<ellipse cx="'+x+'" cy="'+(y+6)+'" rx="17" ry="8" fill="#F4F0E8" stroke="#A89A88" stroke-width="1.2"/>'+riceG(x-6,y+4,-20,.7)+riceG(x+6,y+3,25,.7)+milletG(x,y+9,.7)}
    function draw(){
      slg.innerHTML=SL.map(function(q){return q.o?'':'<rect x="'+(q.x-21)+'" y="'+(q.y-21)+'" width="42" height="42" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="5 4"/>'}).join('');
      itg.innerHTML=IT.map(function(o){var w='';
        if(o===held){var c=v>.3?'#F5A623':'#7BC47F',a=v>.3?Math.sin(performance.now()/40)*10:0;w='<circle cx="'+f1(o.x)+'" cy="'+f1(o.y)+'" r="26" fill="'+c+'" opacity=".35"/>';return w+'<g transform="rotate('+f1(a)+' '+f1(o.x)+' '+f1(o.y+18)+')">'+art(o)+'</g>'}
        return art(o)}).join('');
      bar.style.width=(n/3*100)+'%'}
    draw();
    function drop(o,t,again){o.x=o.hx;o.y=o.hy;held=null;v=0;fast=0;draw();say(msg,t,again)}
    function place(o,q){q.o=o;o.on=true;o.x=q.x;o.y=q.y;held=null;n++;draw();
      if(n>=3){done=true;lvDone(area,i,l,msg,'3つともならべた！')}else say(msg,'おいたよ！あと '+(3-n)+' こ。')}
    drag(svg,function(t,p){
      if(done)return;
      var now=performance.now();
      if(t==='down'){held=null;var bd=26;IT.forEach(function(o){if(o.on)return;var d=Math.hypot(p.x-o.x,p.y-o.y);if(d<bd){bd=d;held=o}});
        if(held){off={x:p.x-held.x,y:p.y-held.y};lastP=p;lastT=now;v=0;fast=0;draw()}else say(msg,'<b>台車の上</b>の出土品をおさえてね。',1);return}
      if(!held)return;
      if(t==='move'){var dt=Math.max(16,now-lastT),inst=Math.hypot(p.x-lastP.x,p.y-lastP.y)/dt;lastP=p;lastT=now;v=.5*v+.5*inst;
        if(v>.42)fast++;else fast=Math.max(0,fast-1);
        if(fast>=4){drop(held,'はやすぎ！ゆれて、もうすこしでわれるところだった。台車にもどったよ。<b>ゆっくり</b>動かそう。',1);return}
        held.x=p.x-off.x;held.y=p.y-off.y;draw();return}
      if(t==='up'){var o=held,q=null;SL.forEach(function(s2){if(!s2.o&&Math.hypot(o.x-s2.x,o.y-s2.y)<30)q=s2});
        if(q)place(o,q);else drop(o,'<b>展示ケース</b>の赤い点線のわくに入れてね。',1)}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','展示ケースの画面。Enter キーで出土品を1つならべます');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var o=IT.filter(function(q){return !q.on})[0],q=SL.filter(function(q){return !q.o})[0];if(o&&q)place(o,q)}});
    later(function(){if(!n&&!done)say(msg,'台車の上の出土品を1つおさえて、<b>ゆっくり</b>右上へ動かし、展示ケースの赤い点線のわくに入れよう。まわりの光が<b>黄色</b>になったら、はやすぎだよ。')},8000);
  }
};
