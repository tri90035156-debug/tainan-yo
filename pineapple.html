<h1>旺來任務・水果・關廟鳳梨</h1>
<p>跟著<b>關廟</b>種鳳梨的阿嬤：跨過<b>山西宮</b>的門檻、從太陽拉一條陽光找出<b>向陽的山坡</b>、算好秋天<b>催花</b>讓鳳梨春天收成、把鳳梨丟上貨車，再到<b>關廟區農會</b>挑出裂開的鳳梨、把好鳳梨排進箱子。</p>
<p>地點：關廟區農會（臺南市）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>關廟在臺南的東南邊，有很多山坡地，是臺南種鳳梨最多的地方。鳳梨的臺語念起來像旺來，聽起來很吉利。跟著種鳳梨的阿嬤，從關廟街上走到山坡上的鳳梨田，最後把鳳梨送到關廟區農會。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・山西宮：跨過門檻，走進廟裡</h3><p>阿嬤早上先帶你到街上的山西宮。山西宮拜的是關聖帝君，大家叫祂關公。這一帶就是因為這座廟，被叫做關廟。有一說，山西宮已經有 300 多年了。</p><p>為什麼？為什麼這裡叫關廟？ 因為街上的山西宮拜關公。地名關廟，就是從這座廟來的。</p></li>
<li><h3>第 2 關・向陽的山坡：太陽照得到哪一面？</h3><p>阿嬤的鳳梨田在街外面的山坡上。關廟的鳳梨，大多種在向陽的山坡地。向陽，就是面向太陽、曬得到太陽的那一面。</p><p>為什麼？鳳梨為什麼要種在向陽的山坡上？ 鳳梨喜歡太陽，向陽的山坡曬得到太陽。山坡下雨的時候，水流得走，不會積水。關廟的土是偏酸的紅砂土，鳳梨長得好。</p></li>
<li><h3>第 3 關・秋天的鳳梨田：算一算，什麼時候催花</h3><p>鳳梨長大以後，要開花才會結果。農人會在對的時候幫它催花，就是讓它開花。開花的時候，50 到 150 朵小花從下面一圈一圈往上開，大約開三個星期。一朵小花，以後就變成鳳梨身上的一格果目。</p><p>為什麼？為什麼要催花？ 催花以後，鳳梨會在差不多的時候開花。農人秋天催花，就能讓鳳梨在春天收成。</p></li>
<li><h3>第 4 關・春天的鳳梨田：把鳳梨丟上貨車</h3><p>到了春天，鳳梨長大了。台農 17 號鳳梨不能太晚採，太熟了，味道會變，也不好運送。阿嬤把鳳梨一顆一顆採下來，你幫忙丟上貨車，要載去農會。</p><p>為什麼？為什麼鳳梨不能太晚採？ 太晚採，鳳梨會太熟，味道會變；送到遠的地方，路上也容易壞。</p></li>
<li><h3>第 5 關・農會集貨場：挑出裂開的鳳梨</h3><p>鳳梨載到了關廟區農會。農會幫農民收購鳳梨、整理好，再送去賣。工作人員先挑選。有些鳳梨的皮裂開了，白天和晚上的溫度差太多，鳳梨就容易裂開。裂開的不送去市場，會做成加工品。</p><p>為什麼？鳳梨為什麼會裂開？ 關廟區農會說，白天和晚上的溫度差太多（超過 13 度），鳳梨就容易裂開。2023 年 2 月，冷氣團一波一波來，很多鳳梨都裂開了。</p></li>
<li><h3>第 6 關・裝箱出貨：把鳳梨排進箱子</h3><p>挑好的鳳梨，農會再除塵、防霉，一顆一顆套上袋子，最後裝進箱子。箱子上還要貼產銷履歷的條碼。2024 年總統就職的國宴，也用了關廟農會的鳳梨。</p><p>為什麼？箱子上為什麼要貼條碼？ 那是產銷履歷的條碼。掃一掃，就查得到這箱鳳梨是哪裡、誰種的。</p></li>
</ol>

function marker(s){
  var t='<g transform="translate('+s.x+' '+s.y+')">';
  if(s.k==='temple')return t+'<rect x="-28" y="-8" width="56" height="22" fill="#F2E0C0" stroke="#8A6A4A" stroke-width="1.2"/><path d="M-36 -6Q-18 -10 0 -20Q18 -10 36 -6L40 -13M-36 -6L-40 -13" fill="#C8463A" stroke="#8A2A20" stroke-width="1.4" stroke-linejoin="round"/><rect x="-6" y="0" width="12" height="14" fill="#8A2A20"/><ellipse cx="-17" cy="3" rx="3.5" ry="4.5" fill="#E2574C"/><ellipse cx="17" cy="3" rx="3.5" ry="4.5" fill="#E2574C"/></g>';
  if(s.k==='slope')return t+'<circle cx="20" cy="-28" r="10" fill="#F5C040"/>'+plant(-14,12,.7,true,true)+plant(12,14,.7,true,true)+'</g>';
  if(s.k==='flower')return t+plant(-12,12,.75,false,false,true)+plant(14,14,.75,false,false,true)+'</g>';
  if(s.k==='harvest')return t+'<rect x="-30" y="-6" width="40" height="16" rx="2" fill="#5E86B8" stroke="#3E5E88" stroke-width="1.2"/><rect x="10" y="-14" width="18" height="24" rx="3" fill="#7EA0CC" stroke="#3E5E88" stroke-width="1.2"/><circle cx="-20" cy="12" r="5" fill="#3A3A3A"/><circle cx="18" cy="12" r="5" fill="#3A3A3A"/>'+pine(-20,-12,.5)+pine(-6,-12,.5)+'</g>';
  if(s.k==='sort')return t+'<rect x="-34" y="-24" width="68" height="38" fill="#F4F0E6" stroke="#8A7A60" stroke-width="1.2"/><path d="M-38 -24H38L30 -34H-30Z" fill="#9AAA8A" stroke="#6A7A5A" stroke-width="1"/><rect x="-28" y="2" width="56" height="7" rx="3" fill="#7A6A5A"/>'+pine(-14,-6,.45)+pine(2,-6,.45)+pine(18,-6,.45)+'</g>';
  return t+'<rect x="-30" y="-20" width="60" height="34" fill="#F4F0E6" stroke="#8A7A60" stroke-width="1.2"/><rect x="-24" y="-31" width="48" height="13" rx="3" fill="#3F7A34"/><text y="-20.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">農會</text><rect x="-22" y="-4" width="20" height="16" fill="#D8A860" stroke="#9A7038" stroke-width="1"/><rect x="2" y="-4" width="20" height="16" fill="#D8A860" stroke="#9A7038" stroke-width="1"/><rect x="-12" y="-14" width="20" height="10" fill="#D8A860" stroke="#9A7038" stroke-width="1"/></g>';
}
var HC={x:650,y:250,rx:290,ry:215};
function inHill(x,y){return Math.pow((x-HC.x)/HC.rx,2)+Math.pow((y-HC.y)/HC.ry,2)<1}
function buildMap(){
  var h='<rect x="-400" y="-300" width="1600" height="1200" fill="#EEE6CF"/>';
  // 山坡地
  h+='<ellipse cx="'+HC.x+'" cy="'+HC.y+'" rx="'+(HC.rx+20)+'" ry="'+(HC.ry+20)+'" fill="#B4C888"/><ellipse cx="'+HC.x+'" cy="'+HC.y+'" rx="'+HC.rx+'" ry="'+HC.ry+'" fill="'+HILL+'"/><ellipse cx="'+(HC.x+40)+'" cy="'+(HC.y-40)+'" rx="150" ry="110" fill="#B4C888" opacity=".6"/>';
  // 街上的路和房子
  h+='<path d="M-60 400H430M215 170V660M215 400Q330 340 440 320Q520 300 560 240" stroke="#F8F2E4" stroke-width="20" fill="none" stroke-linecap="round"/>';
  var r=rnd(17);[[60,330],[110,330],[60,460],[90,540],[300,460],[350,470],[300,540],[150,540],[150,230],[100,230]].forEach(function(p){var w=26+r()*12;h+='<rect x="'+f1(p[0]-w/2)+'" y="'+(p[1]-14)+'" width="'+f1(w)+'" height="22" fill="#F4ECDC" stroke="#B8A888" stroke-width="1"/><path d="M'+f1(p[0]-w/2-3)+' '+(p[1]-14)+'L'+p[0]+' '+(p[1]-24)+'L'+f1(p[0]+w/2+3)+' '+(p[1]-14)+'Z" fill="#C88A6A"/>'});
  // 走過的路
  h+='<path d="M150 470Q190 420 215 400Q260 360 255 330Q330 300 385 285Q470 250 560 190Q630 250 650 330Q610 390 540 400" stroke="#DB2E27" stroke-width="3" fill="none" stroke-dasharray="2 8" stroke-linecap="round" opacity=".55"/>';
  h+='<g id="past"><g id="frPast"></g><text x="470" y="566" font-size="15" fill="#6C2024" text-anchor="middle" stroke="#EEE6CF" stroke-width="4" paint-order="stroke">催花時（秋天）：鳳梨還沒開花</text></g>';
  h+='<g id="now"><g id="frNow"></g><text x="470" y="566" font-size="15" fill="#6C2024" text-anchor="middle" stroke="#EEE6CF" stroke-width="4" paint-order="stroke">結果時（春天到初夏）：鳳梨長大了</text></g>';
  var T=function(t,x,y,sz,c,bg){return '<text x="'+x+'" y="'+y+'" font-size="'+sz+'" fill="'+c+'" text-anchor="middle" stroke="'+(bg||'#EEE6CF')+'" stroke-width="4" paint-order="stroke">'+t+'</text>'};
  h+=T('關廟',300,190,30,'#6C2024');
  h+=T('關廟街上',110,400-14,14,'#8A7A70');
  h+=T('山坡上的鳳梨田',600,96,16,'#3F6B2E',HILL);
  h+='<g transform="translate(130 76)"><circle r="16" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.5"/><path d="M0 -11L5 4L0 1L-5 4Z" fill="#DB2E27"/><text y="12" font-size="9" fill="#5A4E48" text-anchor="middle">北</text></g>';
  h+=T('示意圖，不是真實比例',220,620,12,'#8A7A70');
  STOPS.forEach(function(s){var bg=inHill(s.x,s.y)?HILL:'#FFF8EC';h+='<g class="stop" data-lv="'+s.lv+'" role="button" aria-label="第 '+s.lv+' 關 '+s.n+'">'+marker(s)+'<circle cx="'+(s.x+34)+'" cy="'+(s.y-34)+'" r="10" fill="#fff" stroke="#E2574C" stroke-width="2"/><text x="'+(s.x+34)+'" y="'+(s.y-29.5)+'" font-size="13" fill="#E2574C" text-anchor="middle">'+s.lv+'</text><text x="'+s.x+'" y="'+(s.y+36)+'" font-size="16" font-weight="700" fill="#3F5A2A" text-anchor="middle" stroke="#FFF8EC" stroke-width="4" paint-order="stroke">'+s.n+'</text></g>'});
  h+='<g id="pin" style="display:none"><g class="pin"><path d="M0 0C-10 -14 -14 -20 -14 -27A14 14 0 1 1 14 -27C14 -20 10 -14 0 0Z" fill="#E2574C" stroke="#fff" stroke-width="2.5"/><text y="-22" font-size="12" fill="#fff" text-anchor="middle">你</text></g></g>';
  return h;
}
function near(x,y,w,hh){return STOPS.some(function(s){return Math.abs(s.x-x)<w&&Math.abs(s.y-y)<hh})}
// 往山坡的路經過的點（路上不種鳳梨）
var RD=[];(function(){function qd(a,b,c){for(var t=0;t<=1;t+=.05)RD.push([(1-t)*(1-t)*a[0]+2*t*(1-t)*b[0]+t*t*c[0],(1-t)*(1-t)*a[1]+2*t*(1-t)*b[1]+t*t*c[1]])}qd([215,400],[330,340],[440,320]);qd([440,320],[520,300],[560,240])})();
function decorate(){
  var r=rnd(31),p='',q='';
  for(var y=70;y<470;y+=30)for(var x=380;x<940;x+=34){
    var cx=x+(y/30%2?17:0)+(r()-.5)*6,cy=y+(r()-.5)*4;
    if(!inHill(cx,cy+10)||near(cx,cy,60,62))continue;
    if(Math.abs(cx-600)<80&&Math.abs(cy-92)<16)continue;
    if(RD.some(function(q){return Math.hypot(q[0]-cx,q[1]-cy)<22}))continue;
    // 一排一排紅砂土
    var soil='<ellipse cx="'+f1(cx)+'" cy="'+f1(cy+1)+'" rx="14" ry="4" fill="'+SOIL+'" opacity=".55"/>';
    p+=soil+plant(cx,cy,.42,false);
    q+=soil+plant(cx,cy,.42,true,r()<.6);
  }
  map.querySelector('#frPast').innerHTML=p;
  map.querySelector('#frNow').innerHTML=q;
}

      var f='<svg class="mini" viewBox="0 0 320 190" style="background:#EAF1DC"><rect x="-400" y="172" width="1200" height="60" fill="#B9CC88"/>'+plant(160,176,2.3,false)+'<path d="M160 160V128" stroke="#6E8A40" stroke-width="5"/><ellipse cx="160" cy="96" rx="25" ry="36" fill="#D9789E" stroke="#A84870" stroke-width="1.4"/>';
      for(var r=0;r<6;r++){var y=122-r*10,w=Math.sqrt(1-Math.pow((y-96)/36,2))*22;f+='<g class="ring" data-r="'+r+'">';for(var k=-2;k<=2;k++)f+='<circle cx="'+f1(160+k*w/2.5)+'" cy="'+y+'" r="3.4" fill="#E8B8C8"/>';f+='</g>'}
      f+='<path d="M150 62L160 46L170 62Z" fill="#4E8A3A"/><text x="160" y="24" font-size="15" font-weight="700" fill="#6C2024" text-anchor="middle">小花從下面一圈一圈往上開</text><g id="wk"></g></svg>';
      setScene(f);var g=sceneEl.querySelector('svg'),wk=g.querySelector('#wk');
      [0,1,2,3,4,5].forEach(function(r){later(function(){g.querySelectorAll('.ring[data-r="'+r+'"] circle').forEach(function(c){c.setAttribute('fill','#8E66C8')});
        wk.innerHTML='<text x="246" y="'+(126-r*10)+'" font-size="14" font-weight="700" fill="#5A3A70">第 '+(Math.floor(r/2)+1)+' 週</text>'},400+r*380)});
      later(function(){lvDone(area,i,l,msg,'三個星期，小花都開完了！')},400+6*380+300)}
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){if(p.y<Y0+30){hold=true;setIdx(p.x)}else say(msg,'拖上面紅色的<b>催花</b>旗子。',1);return}
      if(t==='move'&&hold){setIdx(p.x);return}
      if(t==='up'&&hold){hold=false;draw();check()}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','月曆的畫面，左右鍵移動催花的旗子，Enter 確定');
    svg.addEventListener('keydown',function(e){if(done)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();idx=clamp(idx+(e.key==='ArrowRight'?1:-1),0,5);draw()}else if(e.key==='Enter'||e.key===' '){e.preventDefault();check()}});
    later(function(){if(!done&&idx===0)say(msg,'現在旗子在 <b>7 月</b>，收成在冬天。按住紅色<b>催花</b>旗子往右拖。')},8000);
  },

  /* 第 4 關：按住鳳梨往貨車一滑就放開，滑得快丟得遠 */
  toss:function(area,i,l){
    var HX=86,HY=146,BED={x0:212,x1:292,y:122},n=0,NEED=6,hold=false,fly=false,done=false,smp=[],cur={x:HX,y:HY};
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#DCEFF6"><path d="M-400 120Q60 96 200 130L800 140V300H-400Z" fill="#C2D394"/><rect x="-400" y="164" width="1200" height="80" fill="#B9A070"/>';
    var r0=rnd(8);for(var q=0;q<7;q++)s+=plant(12+q*26+r0()*6,124+r0()*8,.5,true,true);
    s+=person(40,166,1.1,'#7A9AC8',{dir:1,hat:true})+pine(70,160,.6,RIPE,80)+pine(58,162,.6,RIPE,100);
    s+='<rect x="206" y="122" width="92" height="30" fill="#5E86B8" stroke="#3E5E88" stroke-width="1.4"/><path d="M298 152V104H318L332 124V152Z" fill="#7EA0CC" stroke="#3E5E88" stroke-width="1.4"/><rect x="302" y="110" width="14" height="12" fill="#DCEFF6"/>'+
      '<rect x="200" y="148" width="136" height="8" fill="#3E5E88"/><circle cx="230" cy="158" r="9" fill="#3A3A3A"/><circle cx="230" cy="158" r="3.5" fill="#9A9A9A"/><circle cx="290" cy="158" r="9" fill="#3A3A3A"/><circle cx="290" cy="158" r="3.5" fill="#9A9A9A"/>'+
      '<text x="252" y="142" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">貨車</text><g id="bd"></g><g id="pn"></g><text id="ct" x="160" y="26" font-size="15" font-weight="700" fill="#6C2024" text-anchor="middle"></text></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),bd=svg.querySelector('#bd'),pn=svg.querySelector('#pn'),ct=svg.querySelector('#ct');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){var h='';for(var k=0;k<n;k++)h+=pine(222+(k%4)*20,114-Math.floor(k/4)*10,.62,RIPE,(k%2?82:98));bd.innerHTML=h;
      pn.innerHTML=(cur?pine(cur.x,cur.y,.75,RIPE)+(!hold&&!fly?'<circle cx="'+cur.x+'" cy="'+(cur.y-4)+'" r="20" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>':''):'');
      ct.textContent='丟進貨車 '+n+' / '+NEED;bar.style.width=(n/NEED*100)+'%'}
    draw();
    function next(){if(n>=NEED){done=true;cur=null;draw();lvDone(area,i,l,msg,'6 顆都上車了！');return}cur={x:HX,y:HY};draw()}
    function throwIt(v){
      var sx=cur.x,sy=cur.y,D=260*(1-Math.exp(-v/1.2)),lx=HX+D,inBed=lx>=BED.x0&&lx<=BED.x1,ly=inBed?BED.y-6:(lx>BED.x1?150:160),t=0;fly=true;
      anim(function(dt){t+=dt/.8;var q=Math.min(1,t);cur={x:sx+(lx-sx)*q,y:sy+(ly-sy)*q-80*4*q*(1-q)};draw();
        if(q<1)return;fly=false;
        if(inBed){n++;cur=null;draw();say(msg,n<NEED?'丟進去了！還要 '+(NEED-n)+' 顆。':'丟進去了！')}
        else{cur=null;draw();say(msg,lx<BED.x0?'太近了，掉在地上！滑<b>快一點</b>。':'太用力了，飛過貨車了！滑<b>慢一點</b>。',1)}
        later(next,450);return false})}
    drag(svg,function(t,p,e){
      if(done||fly||!cur)return;
      var now=performance.now();
      if(t==='down'){if(dist(p,cur)<36){hold=true;smp=[{t:now,x:p.x,y:p.y}];draw()}else say(msg,'按住阿嬤腳邊、有紅色圈圈的<b>鳳梨</b>。',1);return}
      if(t==='move'&&hold){cur={x:clamp(p.x,40,150),y:clamp(p.y,90,170)};smp.push({t:now,x:p.x,y:p.y});draw();return}
      if(t==='up'&&hold){hold=false;smp.push({t:now,x:p.x,y:p.y});
        // 只看放開前一下下的速度（手機的移動事件比較少時，至少用最後兩點）
        var rec=smp.filter(function(q){return now-q.t<150});if(rec.length<2)rec=smp.slice(-2);
        var a=rec[0],b=rec[rec.length-1],dt=Math.max(16,b.t-a.t),v=(b.x-a.x)/dt;
        if(v<.15){cur={x:HX,y:HY};draw();say(msg,'要往<b>右邊</b>（貨車那邊）<b>滑一下</b>再放開，才丟得出去。',1);return}
        throwIt(v)}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','鳳梨田和貨車的畫面，按 Enter 直接把鳳梨都裝上車');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done&&!fly){e.preventDefault();n=NEED;next()}});
    later(function(){if(!done&&n===0&&!fly)say(msg,'按住紅色圈圈裡的鳳梨，往<b>右上</b>一滑就放開。')},8000);
  },

  /* 第 5 關：左右拖輸送帶，點裂開的鳳梨放進加工的籃子 */
  belt:function(area,i,l){
    var N=12,SP=58,BAD=[2,6,10],off=0,MINO=-(N-1)*SP+230,it=[],hold=false,moved=false,p0=null,o0=0,tg=-1,done=false,got=0;
    for(var k=0;k<N;k++)it.push({bad:BAD.indexOf(k)>=0,out:false});
    function X(k){return 40+k*SP+off}
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#ECE6DA"><rect x="-400" y="170" width="1200" height="60" fill="#B8AE9C"/>'+
      '<rect x="-400" y="120" width="1200" height="24" fill="#5A5A5A"/><rect x="-400" y="118" width="1200" height="4" fill="#8A8A8A"/><g id="rl"></g>'+
      '<path d="M40 150H92L86 178H46Z" fill="#C8A060" stroke="#8A6A30" stroke-width="1.4"/><path d="M44 158H88M45 166H87" stroke="#8A6A30" stroke-width="1"/><text x="66" y="173" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">加工</text><g id="bk"></g>'+
      '<text x="200" y="166" font-size="13" fill="#8A7A70" text-anchor="middle">← 輸送帶可以左右拖 →</text><g id="pp"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),rl=svg.querySelector('#rl'),pp=svg.querySelector('#pp'),bk=svg.querySelector('#bk');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){var r='',o=((off%24)+24)%24;for(var x=-24+o;x<340;x+=24)r+='<circle cx="'+f1(x)+'" cy="132" r="5" fill="#7A7A7A" stroke="#4A4A4A" stroke-width="1"/>';rl.innerHTML=r;
      var h='';it.forEach(function(q,k){if(q.out)return;var x=X(k);if(x<-20||x>340)return;h+=pine(x,100,.92)+(q.bad?crack(x+3,104,1):'')});pp.innerHTML=h;
      var b='';for(var j=0;j<got;j++)b+=pine(54+j*12,146,.42,RIPE,(j%2?-20:20))+crack(56+j*12,148,.4);bk.innerHTML=b;
      bar.style.width=(got/3*100)+'%'}
    draw();
    function hit(p){for(var k=0;k<N;k++){if(it[k].out)continue;var x=X(k);if(Math.abs(p.x-x)<24&&p.y>62&&p.y<130)return k}return -1}
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){hold=true;moved=false;p0=p;o0=off;tg=hit(p);return}
      if(t==='move'&&hold){if(Math.abs(p.x-p0.x)>6)moved=true;if(moved){off=clamp(o0+(p.x-p0.x),MINO,0);draw()}return}
      if(t==='up'&&hold){hold=false;if(moved)return;
        if(tg<0){say(msg,'點<b>裂開</b>的鳳梨（身上有一條黑黑的裂縫）。看不到的話，左右拖輸送帶。',1);return}
        if(!it[tg].bad){say(msg,'這顆好好的，沒有裂開，讓它繼續往前送。',1);return}
        it[tg].out=true;got++;draw();
        if(got>=3){done=true;lvDone(area,i,l,msg,'3 顆裂開的都挑出來了！')}
        else say(msg,'挑出 '+got+' 顆了！還有 '+(3-got)+' 顆，拖輸送帶找找看。')}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','輸送帶的畫面，按 Enter 直接挑完裂開的鳳梨');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();it.forEach(function(q){if(q.bad)q.out=true});got=3;draw();done=true;lvDone(area,i,l,msg,'3 顆裂開的都挑出來了！')}});
    later(function(){if(!done&&got<3)say(msg,'輸送帶可以<b>左右拖</b>，後面還有鳳梨喔。')},9000);
  },

  /* 第 6 關：把套好袋子的鳳梨拖進箱子排滿；點一下轉方向 */
  pack:function(area,i,l){
    var BX=34,BY=42,CS=34,NC=4,NR=3,P=[],occ=[],ord=[],hold=-1,p0=null,moved=false,off={x:0,y:0},done=false;
    for(var r=0;r<NR;r++){occ.push([]);for(var c=0;c<NC;c++)occ[r].push(-1)}
    for(var k=0;k<6;k++){var hx=184+(k%3)*36+17,hy=26+Math.floor(k/3)*74+34;P.push({w:1,h:2,hx:hx,hy:hy,x:hx-17,y:hy-34,c:-1,r:-1,pc:-1,pr:-1});ord.push(k)}
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EDE6DA"><rect x="-400" y="172" width="1200" height="60" fill="#C8BCA8"/>'+
      '<rect x="'+(BX-7)+'" y="'+(BY-7)+'" width="'+(NC*CS+14)+'" height="'+(NR*CS+14)+'" rx="4" fill="#C89A5A" stroke="#8A6030" stroke-width="1.6"/><rect x="'+BX+'" y="'+BY+'" width="'+(NC*CS)+'" height="'+(NR*CS)+'" fill="#E8C890"/>';
    for(var c2=0;c2<NC;c2++)for(var r2=0;r2<NR;r2++)s+='<rect x="'+(BX+c2*CS+2)+'" y="'+(BY+r2*CS+2)+'" width="'+(CS-4)+'" height="'+(CS-4)+'" rx="5" fill="none" stroke="#B8905A" stroke-width="1" stroke-dasharray="3 3"/>';
    s+='<text x="'+(BX+NC*CS/2)+'" y="'+(BY-12)+'" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle">箱子</text><text x="237" y="18" font-size="13" fill="#8A7A70" text-anchor="middle">套好袋子的鳳梨</text><g id="pc"></g><g id="lb"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),pc=svg.querySelector('#pc'),lb=svg.querySelector('#lb');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function filled(){var n=0;occ.forEach(function(row){row.forEach(function(v){if(v>=0)n++})});return n}
    function draw(){pc.innerHTML=ord.map(function(k){var o=P[k],w=o.w*CS,h=o.h*CS,cx=o.x+w/2,cy=o.y+h/2;
        return '<g'+(k===hold?' opacity=".9"':'')+'><rect x="'+f1(o.x+2)+'" y="'+f1(o.y+2)+'" width="'+(w-4)+'" height="'+(h-4)+'" rx="9" fill="#F6EED6" stroke="#C8B88A" stroke-width="1.4" stroke-dasharray="2 2"/>'+(o.h>o.w?pine(cx,cy+8,1):pine(cx-8,cy,1,RIPE,90))+'</g>'}).join('');
      bar.style.width=(filled()/12*100)+'%'}
    draw();
    function fits(o,c,r){if(c<0||r<0||c+o.w>NC||r+o.h>NR)return false;for(var y=r;y<r+o.h;y++)for(var x=c;x<c+o.w;x++)if(occ[y][x]>=0)return false;return true}
    function place(k,c,r){var o=P[k];for(var y=r;y<r+o.h;y++)for(var x=c;x<c+o.w;x++)occ[y][x]=k;o.c=c;o.r=r;o.x=BX+c*CS;o.y=BY+r*CS}
    function lift(k){var o=P[k];o.pc=o.c;o.pr=o.r;if(o.c<0)return;for(var y=o.r;y<o.r+o.h;y++)for(var x=o.c;x<o.c+o.w;x++)occ[y][x]=-1;o.c=o.r=-1}
    function home(k){var o=P[k];o.c=o.r=-1;o.x=o.hx-o.w*CS/2;o.y=o.hy-o.h*CS/2}
    function turn(o){var t=o.w;o.w=o.h;o.h=t}
    function canAny(k,w,h){var o={w:w,h:h};for(var r=0;r<NR;r++)for(var c=0;c<NC;c++)if(fits(o,c,r))return true;return false}
    function check(){var n=filled();
      if(n>=12){done=true;draw();lb.innerHTML='<rect x="'+(BX+NC*CS-58)+'" y="'+(BY+NR*CS-24)+'" width="54" height="20" fill="#fff" stroke="#5A4E48" stroke-width="1"/><path d="M'+(BX+NC*CS-54)+' '+(BY+NR*CS-21)+'v14m3 -14v14m2 -14v14m4 -14v14m2 -14v14m3 -14v14m4 -14v14m2 -14v14" stroke="#2A2020" stroke-width="1.4"/><text x="'+(BX+NC*CS/2)+'" y="'+(BY+NR*CS+26)+'" font-size="13" font-weight="700" fill="#3F6B2E" text-anchor="middle">產銷履歷條碼</text>';
        lvDone(area,i,l,msg,'箱子排滿了！');return}
      var left=P.map(function(o,k){return k}).filter(function(k){return P[k].c<0});
      if(left.length&&left.every(function(k){var o=P[k];return !canAny(k,o.w,o.h)})&&left.some(function(k){var o=P[k];return canAny(k,o.h,o.w)}))
        say(msg,'直的放不下了！<b>點一下</b>鳳梨，轉成<b>橫的</b>再放。',1)}
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){hold=-1;for(var j=ord.length-1;j>=0;j--){var o=P[ord[j]];if(p.x>=o.x&&p.x<=o.x+o.w*CS&&p.y>=o.y&&p.y<=o.y+o.h*CS){hold=ord[j];break}}
        if(hold<0){say(msg,'按住右邊<b>套好袋子</b>的鳳梨，拖進箱子。',1);return}
        ord.splice(ord.indexOf(hold),1);ord.push(hold);lift(hold);p0=p;moved=false;off={x:p.x-P[hold].x,y:p.y-P[hold].y};draw();return}
      if(hold<0)return;
      var o=P[hold];
      if(t==='move'){if(dist(p,p0)>6)moved=true;if(moved){o.x=p.x-off.x;o.y=p.y-off.y;draw()}return}
      if(t==='up'){var k=hold;hold=-1;
        if(!moved){turn(o);
          if(o.pc>=0){if(fits(o,o.pc,o.pr))place(k,o.pc,o.pr);else{turn(o);place(k,o.pc,o.pr);say(msg,'這裡轉不過去，旁邊的位置不夠。先拖出來再轉。',1)}}
          else home(k);
          draw();check();return}
        var c=Math.round((o.x-BX)/CS),r=Math.round((o.y-BY)/CS);
        if(fits(o,c,r)){place(k,c,r);draw();say(msg,'放好了！');check()}
        else{var over=o.x+o.w*CS/2<BX+NC*CS+10;home(k);draw();if(over)say(msg,'這裡放不下：超出箱子，或和別的鳳梨疊在一起了。<b>點一下</b>可以轉方向。',1);check()}}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','箱子和鳳梨的畫面，按 Enter 直接排滿箱子');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();occ.forEach(function(row){row.fill(-1)});P.forEach(function(o,k){o.w=2;o.h=1;place(k,(k%2)*2,Math.floor(k/2))});draw();check()}});
    later(function(){if(!done&&filled()===0)say(msg,'按住右邊一顆鳳梨，拖到左邊的<b>箱子</b>裡。<b>點一下</b>鳳梨可以轉方向。')},8000);
  }
};
</script>
