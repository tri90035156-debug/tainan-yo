<h1>飛雁新村任務・歷史建築・永康飛雁新村</h1>
<p>跟著文化局的導覽姐姐看永康飛雁新村裡的<b>無線羅針所</b>：轉<b>環狀天線</b>幫飛機找到電台的方向、幫房子裝上<b>防爆門窗</b>和厚厚的牆、看到古人的碎片就停下來請考古的人記錄，再把施工圍籬圍好、留給大樹。</p>
<p>地點：飛雁新村（臺南市永康區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>永康的飛雁新村裡，藏著幾棟日本時代的軍事房子，叫做無線羅針所。2009 年，它被登錄為歷史建築。跟著文化局來看修復的導覽姐姐，一起看看這些厚厚的房子。每過一關，就能蓋一個章。</p><h2>關卡</h2><ol>
<li><h3>第 1 關・無線羅針所：看不見地面，怎麼找方向</h3><p>導覽姐姐說：「羅針就是指南針裡那根指方向的針。這裡的名字有無線電，也有羅針。」用無線電的訊號，可以幫飛機找方向。這類設備有一種方法：飛機上有圓圈形的環狀天線，慢慢轉，轉到訊號最小的時候，紅色箭頭就對著電台的方向（電台就是送出無線電訊號的地方）。</p><p>為什麼？為什麼飛機要靠無線電找方向？ 飛機飛在天上，有時候雲很厚、或是天黑了，看不到地面。用無線電的訊號，就算看不到地面，也能知道電台在哪個方向。</p></li>
<li><h3>第 2 關・厚厚的牆：幫房子擋住爆炸</h3><p>導覽姐姐拿出一份政府開會的紀錄，上面寫著這些房子的特別地方：有防爆門窗、有通氣孔，磚頭疊的牆有 80 公分厚，屋頂那一大片厚厚的板子叫頂板，是鋼筋混凝土做的，有 120 公分厚。</p><p>為什麼？為什麼這些房子要蓋得這麼厚？ 政府登錄它成為歷史建築的理由寫著：防爆門窗、通氣孔、厚厚的牆和屋頂，反映了當時軍事上的需求和做法。這樣的軍事房子，在臺南一帶很特別。</p></li>
<li><h3>第 3 關・修復工地：看到古人的東西，先停</h3><p>修老房子的時候，要在旁邊挖土。報導說，這裡的地底下有六甲頂遺址的文化層；挖土的時候，要請考古的人在旁邊看著、記錄，叫做考古監看。所以修房子花了比較久的時間。</p><p>為什麼？為什麼挖土前後要請考古的人來看？ 地底下可能藏著古人留下的東西，被挖壞了就再也找不回來。法律規定，蓋房子的時候挖到像是遺址的東西，要先停下來、通知政府。</p></li>
<li><h3>第 4 關・大樹和圍籬：圍起來修，也要留給大樹</h3><p>修房子的時候，要用圍籬把工地圍起來。可是房子旁邊有好幾棵大樹。政府的規劃寫著：歷史建築的旁邊，要適度留下原本的大樹。樹根藏在地底下，被壓傷、挖傷了，病菌可能從傷口跑進去。</p><p>為什麼？為什麼修一棟老房子要這麼久？ 報導說，這裡修房子的時間比原本預計的長。原因有：中間改過設計、挖土要配合考古監看和搶救、地方爭取多加遊憩設施，還有颱風來了要搶修。</p></li>
</ol>

      if(t.id==='wall'&&best==='roof')say(msg,'這片是 80 公分的磚牆，要放在<b>牆</b>的位置。屋頂的頂板更厚。',1);
      else if(t.id==='roof')say(msg,'這片是 120 公分的頂板，又長又厚，要放在<b>屋頂</b>。',1);
      else if((t.id==='win'&&best==='door')||(t.id==='door'&&best==='win'))say(msg,'門和窗放反了。看看空格的形狀：<b>門</b>比較高，窗比較小。',1);
      else say(msg,'這裡要放別的東西。看看空格的<b>形狀</b>和位置。',1)}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){var b=null,bd=999;T.forEach(function(u){if(u.used)return;if(Math.abs(p.x-u.x)<60&&Math.abs(p.y-u.y)<15){var d=Math.abs(p.y-u.y);if(d<bd){bd=d;b=u}}});
        if(!b){say(msg,'按住左邊的<b>牌子</b>，拖到剖面圖上的紅色虛線空格。',1);return}
        hold=b;ox=0;oy=-20;b.x=p.x;b.y=p.y+oy;draw();return}
      if(t==='move'&&hold){hold.x=p.x;hold.y=p.y+oy;draw();return}
      if(t==='up'&&hold){var h=hold;hold=null;drop(h,{x:h.x,y:h.y});draw()}});
    var ks=0;svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','左邊的牌子，按上下鍵選一個，按 1 到 5 放到屋頂、牆、窗、門、通氣孔');
    svg.addEventListener('keydown',function(e){if(done)return;var free=T.filter(function(u){return !u.used});if(!free.length)return;
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();ks=(ks+(e.key==='ArrowDown'?1:free.length-1))%free.length;hold=free[ks];draw();hold=null;return}
      var n='12345'.indexOf(e.key);if(n>=0){e.preventDefault();var u=free[ks%free.length];drop(u,S[['roof','wall','win','door','vent'][n]]);draw()}});
    later(function(){if(!Object.keys(filled).length)say(msg,'最長的那片<b>頂板</b>，放在最上面的屋頂。')},9000);
  },

  /* 第 3 關：點洞挖一層，看到碎片就停，把考古的人拖過去；另外兩個洞挖到虛線 */
  dig:function(area,i,l){
    var GY=56,LH=24,DEEP=4,H=[{x:64,d:0,rock:1},{x:152,d:0,shard:2},{x:240,d:0}],P={x:284,y:GY,home:true},hold=false,called=false,done=false,broke=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:'+SKY+'"><rect x="-400" y="'+GY+'" width="1200" height="200" fill="'+SOIL+'"/>'+
      '<g opacity=".35">'+[[20,80],[110,120],[200,90],[290,130],[40,170],[130,160],[230,176],[300,100]].map(function(q){return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="2" fill="'+SOIL2+'"/>'}).join('')+'</g>'+
      '<path d="M-400 '+(GY+LH*DEEP)+'H800" stroke="#6C2024" stroke-width="2" stroke-dasharray="6 4"/><text x="196" y="'+(GY+LH*DEEP+18)+'" font-size="13" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="'+SOIL+'" stroke-width="3" paint-order="stroke">要挖到虛線</text>'+
      '<g id="hg"></g><g id="pg"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),hg=svg.querySelector('#hg'),pgE=svg.querySelector('#pg');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function floorY(c){return GY+LH*c.d}
    function draw(){var h='';
      H.forEach(function(c,j){var x0=c.x-22,fy=floorY(c);
        // 挖出來的土堆在洞口旁邊
        if(c.d)h+='<path d="M'+(c.x+16)+' '+GY+'Q'+(c.x+26)+' '+f1(GY-6-c.d*2.5)+' '+(c.x+36)+' '+GY+'Z" fill="'+SOIL2+'"/>';
        if(c.d)h+='<rect x="'+x0+'" y="'+GY+'" width="44" height="'+(fy-GY)+'" fill="'+HOLE+'"/>';
        // 洞底露出來的東西
        if(c.shard&&c.d===c.shard){h+='<rect x="'+x0+'" y="'+(fy-7)+'" width="44" height="7" fill="#3E2E20"/>'+shard(c.x-10,fy-4,15)+shard(c.x+4,fy-3,-25)+shard(c.x+14,fy-5,40,'#D07850')}
        if(c.shard&&c.broke)h+='<path d="M'+(c.x-8)+' '+(fy-12)+'L'+(c.x+8)+' '+(fy+2)+'M'+(c.x+8)+' '+(fy-12)+'L'+(c.x-8)+' '+(fy+2)+'" stroke="#DB2E27" stroke-width="3"/>';
        if(c.rock&&c.d===c.rock)h+='<ellipse cx="'+(c.x+6)+'" cy="'+(fy-4)+'" rx="10" ry="6" fill="#9A9690" stroke="#6A6660" stroke-width="1.2"/>';
        if(!done&&!(c.shard&&called)&&c.d<DEEP)h+='<rect x="'+(x0-4)+'" y="'+(GY-4)+'" width="52" height="'+Math.max(30,fy-GY+10)+'" rx="8" fill="none" stroke="#fff" stroke-width="1.8" stroke-dasharray="4 3"/>';
        if(c.d>=DEEP)h+='<text x="'+c.x+'" y="'+(GY-8)+'" font-size="13" font-weight="700" fill="#3F6B2E" text-anchor="middle">挖好了</text>';
        if(c.shard&&called)h+='<text x="'+c.x+'" y="'+(GY-34)+'" font-size="13" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="'+SKY+'" stroke-width="3" paint-order="stroke">記錄中</text>'});
      hg.innerHTML=h;
      pgE.innerHTML=person(P.x,P.y,.8,'#4E7A9A',{cap:1})+(P.home&&!called&&!done?'<circle cx="'+P.x+'" cy="'+(P.y-16)+'" r="22" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/><text x="'+P.x+'" y="'+(P.y+16)+'" font-size="13" font-weight="700" fill="#2A2020" text-anchor="middle">考古的人</text>':'');
      var n=Math.min(H[0].d,DEEP)+Math.min(H[2].d,DEEP)+(called?4:0);bar.style.width=(done?100:n/12*90)+'%'}
    draw();
    function check(){if(H[0].d>=DEEP&&H[2].d>=DEEP&&called&&!done){done=true;draw();wait(function(){lvDone(area,i,l,msg,'兩個洞挖好了，有碎片的那個洞也請考古的人來記錄了！')},600);return true}}
    function digAt(j){if(done)return;var c=H[j];
      if(c.shard&&called){say(msg,'考古的人正在記錄，這個洞先不要挖。',1);return}
      if(c.d>=DEEP){say(msg,'這個洞已經挖到虛線了，夠深了。挖別的洞。',1);return}
      if(c.shard&&c.d===c.shard){c.d++;c.broke=1;draw();say(msg,'停！挖過頭了，古人的碎片被挖壞了（示意）。看到碎片就要停下來。這個洞重新來一次。',1);
        wait(function(){c.d=0;c.broke=0;draw()},1800);return}
      c.d++;draw();
      if(c.shard&&c.d===c.shard){say(msg,'咦，土裡有<b>碎片</b>！是古人留下的東西。這個洞先不要挖了，把考古的人拖過來。');return}
      if(c.rock&&c.d===c.rock){say(msg,'挖到一顆<b>石頭</b>，不是古人做的東西，可以繼續挖。');return}
      if(c.d>=DEEP){if(!check())say(msg,'這個洞挖到虛線了！'+(called?'':'還有別的洞要挖。'));return}
      say(msg,'挖了一層。')}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){if(!called&&dist(p,{x:P.x,y:P.y-16})<26){hold=true;P.home=false;return}
        var j=-1,bd=34;H.forEach(function(c,m){var d=Math.abs(p.x-c.x);if(d<bd&&p.y>GY-30&&p.y<floorY(c)+24){bd=d;j=m}});
        if(j<0){say(msg,'點工地上的<b>洞</b>（白色虛線框）挖一層。',1);return}digAt(j);return}
      if(t==='move'&&hold){P.x=clamp(p.x,20,300);P.y=clamp(p.y+20,40,180);draw();return}
      if(t==='up'&&hold){hold=false;var c=H[1];
        if(Math.abs(P.x-c.x)<34&&c.d===c.shard){called=true;P.x=c.x+30;P.y=GY;draw();say(msg,'考古的人來了，她在洞旁邊一片一片記錄。這個洞先停工。');check();return}
        var near=H.some(function(h){return Math.abs(P.x-h.x)<34});
        P.x=284;P.y=GY;P.home=true;draw();
        say(msg,near?'這裡還沒看到古人的東西。考古的人先在旁邊看著，你繼續挖。':'把考古的人拖到<b>有碎片的洞</b>上面。',1)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','工地上的三個洞，按 1、2、3 挖一層，按 C 請考古的人到第 2 個洞');
    svg.addEventListener('keydown',function(e){if(done)return;var n='123'.indexOf(e.key);if(n>=0){e.preventDefault();digAt(n);return}
      if((e.key==='c'||e.key==='C')&&!called){e.preventDefault();if(H[1].d===H[1].shard){called=true;P.x=182;P.y=GY;P.home=false;draw();check()}else say(msg,'第 2 個洞還沒看到古人的東西。',1)}});
    later(function(){if(!H[0].d&&!H[1].d&&!H[2].d)say(msg,'點一下<b>洞</b>（白色虛線框），就挖一層。')},8000);
  },

  /* 第 4 關：拖圍籬四邊的把手往外、往內，圍住老房子和施工的地方，又不壓到樹根圈；再選一個最想保護的 */
  fence:function(area,i,l){
    var E={L:112,R:208,T:72,B:128},Z={L:100,R:220,T:62,B:138},TR=[{x:56,y:100,r:20},{x:264,y:100,r:20},{x:160,y:24,r:14},{x:160,y:172,r:14}];
    var hold=null,sel='L',done=false,moved=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:'+LAND+'"><rect x="-400" y="170" width="1200" height="60" fill="'+LAND+'"/>'+
      TR.map(function(t){return '<circle cx="'+t.x+'" cy="'+t.y+'" r="'+t.r+'" fill="#C8D8A8" stroke="'+LEAF2+'" stroke-width="1.6" stroke-dasharray="4 3"/>'+tree(t.x,t.y,t.r*.6)}).join('')+
      '<rect x="'+Z.L+'" y="'+Z.T+'" width="'+(Z.R-Z.L)+'" height="'+(Z.B-Z.T)+'" fill="#F4E4A8" fill-opacity=".5" stroke="#D8A82A" stroke-width="2" stroke-dasharray="6 4"/>'+
      roofTop(160,100,80,44)+'<text x="160" y="105" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">老房子</text>'+
      '<text x="56" y="136" font-size="13" font-weight="700" fill="#3E6A2E" text-anchor="middle">樹根圈</text><g id="fg"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),fg=svg.querySelector('#fg');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function seg(k){return k==='L'?[{x:E.L,y:E.T},{x:E.L,y:E.B}]:k==='R'?[{x:E.R,y:E.T},{x:E.R,y:E.B}]:k==='T'?[{x:E.L,y:E.T},{x:E.R,y:E.T}]:[{x:E.L,y:E.B},{x:E.R,y:E.B}]}
    function hitTree(k){var q=seg(k);return TR.some(function(t){return segD(t,q[0],q[1])<t.r+2})}
    function inside(k){return k==='L'?E.L>Z.L:k==='R'?E.R<Z.R:k==='T'?E.T>Z.T:E.B<Z.B}
    function stOf(k){return hitTree(k)?'tree':inside(k)?'in':'ok'}
    function hp(k){return k==='L'?{x:E.L,y:(E.T+E.B)/2}:k==='R'?{x:E.R,y:(E.T+E.B)/2}:k==='T'?{x:(E.L+E.R)/2,y:E.T}:{x:(E.L+E.R)/2,y:E.B}}
    function draw(){var h='',ok=0;
      ['L','R','T','B'].forEach(function(k){var q=seg(k),st=stOf(k),c=st==='tree'?'#DB2E27':st==='in'?'#D8A82A':'#5A6670';if(st==='ok')ok++;
        h+='<path d="M'+q[0].x+' '+q[0].y+'L'+q[1].x+' '+q[1].y+'" stroke="'+c+'" stroke-width="5" stroke-linecap="round"/>';
        h+='<path d="M'+q[0].x+' '+q[0].y+'L'+q[1].x+' '+q[1].y+'" stroke="#fff" stroke-width="1.2" stroke-dasharray="2 8"/>'});
      if(!done)['L','R','T','B'].forEach(function(k){var p=hp(k);h+='<circle cx="'+p.x+'" cy="'+p.y+'" r="9" fill="#fff" stroke="#6C2024" stroke-width="2.4"/>'+
        '<circle cx="'+p.x+'" cy="'+p.y+'" r="17" fill="none" stroke="'+(hold===k||sel===k&&!hold?'#DB2E27':'#BD9558')+'" stroke-width="2" stroke-dasharray="4 3"/>'});
      fg.innerHTML=h;bar.style.width=(done?100:ok/4*80)+'%';return ok}
    draw();
    function check(k){var ok=draw();if(done)return;
      if(ok===4){done=true;draw();say(msg,'四邊都剛好！老房子和施工的地方都圍進去了，大樹的樹根圈都在外面。');wait(choose,900);return}
      var st=stOf(k);
      if(st==='tree')say(msg,'圍籬壓到大樹的<b>樹根圈</b>了（紅色）！往裡面拉一點。',1);
      else if(st==='in')say(msg,'這一邊還沒把施工的地方（黃色虛線）圍進去（黃色）。往外拖。',1);
      else say(msg,'這一邊剛好！再拖其他邊（還有 '+(4-ok)+' 邊）。')}
    function choose(){
      var box=el('<p class="kick" style="margin-top:6px">想一想</p><p>老房子旁邊有三樣東西都要保護。你最想保護哪一樣？</p>'),opts=document.createElement('div'),m2=document.createElement('p');m2.hidden=true;
      var R=[['厚厚的牆','厚厚的牆和<b>防爆門窗</b>，是政府登錄它成為<b>歷史建築</b>的理由。拆掉了，就再也看不到了。'],
             ['大樹','政府的規劃說，歷史建築的旁邊要適度留下原本的大樹。報導說，以前這裡種了很多樹，把房子遮起來。'],
             ['地下的遺址','<b>文化層</b>被挖壞了，就再也找不回來。報導說，這裡挖土的時候請考古的人在旁邊看著，就是為了記錄它。']],fin=false;
      R.forEach(function(r){var b=document.createElement('button');b.type='button';b.className='opt';b.textContent=r[0];
        tap(b,function(){opts.querySelectorAll('.opt').forEach(function(x){x.classList.remove('yes')});b.classList.add('yes');
          say(m2,r[1]+'<br>其實每一樣都很重要，所以修老房子要慢慢來。');if(!fin){fin=true;later(function(){finish(i)},900)}});opts.appendChild(b)});
      box.appendChild(opts);box.appendChild(m2);area.appendChild(box);into(box)}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){var k=null,bd=24;['L','R','T','B'].forEach(function(m){var d=dist(p,hp(m));if(d<bd){bd=d;k=m}});
        if(!k){say(msg,'按住圍籬中間的<b>把手</b>（虛線圈圈）拖。',1);return}hold=k;sel=k;draw();return}
      if(t==='move'&&hold){if(hold==='L')E.L=clamp(p.x,20,150);else if(hold==='R')E.R=clamp(p.x,170,300);else if(hold==='T')E.T=clamp(p.y,8,76);else E.B=clamp(p.y,124,186);draw();return}
      if(t==='up'&&hold){var k=hold;hold=null;moved++;check(k)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','圍籬的四邊，按 1 到 4 選一邊（左右上下），按方向鍵移動，按 Enter 看圍好了沒');
    svg.addEventListener('keydown',function(e){if(done)return;var n='1234'.indexOf(e.key);if(n>=0){e.preventDefault();sel='LRTB'[n];draw();return}
      var m={ArrowUp:-4,ArrowDown:4,ArrowLeft:-4,ArrowRight:4}[e.key];
      if(m!==undefined){e.preventDefault();var hz=e.key==='ArrowLeft'||e.key==='ArrowRight';
        if(sel==='L'&&hz)E.L=clamp(E.L+m,20,150);else if(sel==='R'&&hz)E.R=clamp(E.R+m,170,300);else if(sel==='T'&&!hz)E.T=clamp(E.T+m,8,76);else if(sel==='B'&&!hz)E.B=clamp(E.B+m,124,186);draw()}
      else if(e.key==='Enter'){e.preventDefault();check(sel)}});
    later(function(){if(!moved)say(msg,'先按住<b>左邊</b>的把手，往左拖一點。')},8000);
  }
};
</script>
