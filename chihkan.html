<h1>赤崁樓任務・古蹟・中西區赤崁樓</h1>
<p>跟著古蹟的導覽志工看<b>赤崁樓</b>：用 15 匹布換到<b>普羅民遮</b>的土地、掛上鄭成功的<b>承天府</b>招牌、看見<b>赤崁夕照</b>、在荷蘭台基上蓋好<b>文昌閣</b>、把九座石碑放回<b>贔屭</b>背上，還補好石碑的裂縫。</p>
<p>地點：赤崁樓（臺南市中西區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>臺南市中西區的赤崁樓，紅牆紅瓦，是臺南最有名的古蹟之一。它下面是荷蘭人蓋的城堡，上面是清朝蓋的樓閣，一個地方疊著好幾個時代。跟著古蹟的導覽志工，從 400 年前一路走到今天。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・普羅民遮（1625 年）：用布換土地</h3><p>1625 年，荷蘭人用十五匹布，向住在這裡的原住民換到赤崁一帶的土地。他們在這裡蓋商館、市街、倉庫和醫院，把街取名叫「普羅民遮」。</p><p>為什麼？為什麼叫「普羅民遮」？ 「普羅民遮」是荷蘭人取的街名。後來在這裡蓋的城堡，就叫「普羅民遮城」；漢人叫它「紅毛樓」，因為那時候漢人叫荷蘭人「紅毛」。</p></li>
<li><h3>第 2 關・承天府（1661 年）：換一塊新招牌</h3><p>1653 年，荷蘭人在這裡蓋好城堡，叫「普羅民遮城」。城牆用紅磚，還用糖水、糯米汁攪拌蚵殼灰來黏。1661 年，鄭成功來到臺灣，趕走荷蘭人，住進普羅民遮城，把它改成「承天府」。</p><p>為什麼？「承天府」是做什麼的地方？ 「府」是管理一大片地方的官府。鄭成功把這裡當成管理臺灣的地方，所以叫承天府。</p></li>
<li><h3>第 3 關・赤崁夕照：太陽落進台江</h3><p>清朝初年，台江內海還沒有被泥沙填滿，海浪可以一直打到赤崁樓下。傍晚站在樓上，看夕陽落進台江，水面金金紅紅的，叫做「赤崁夕照」，是當時有名的臺灣八景之一。後來台江慢慢變成陸地，這個景色就看不到了。</p><p>為什麼？台江內海跑到哪裡去了？ 河流帶來好多泥沙，慢慢把台江填起來，變成陸地。現在的西門路一帶，四百年前差不多就是海邊！</p></li>
<li><h3>第 4 關・文昌閣（1886 年）：在老城堡上蓋樓閣</h3><p>1862 年一場大地震，樓上的荷蘭建築全倒了，只剩下紅磚台基。1886 年，臺灣知縣沈受謙為了鼓勵大家讀書，在旁邊蓋了蓬壺書院，又在荷蘭城堡的台基上蓋了文昌閣和海神廟。所以今天的赤崁樓，下面是荷蘭的，上面是清朝的。</p><p>為什麼？屋簷為什麼翹翹的？ 這叫「飛簷」，是閩南、中國式建築常見的樣子。屋簷的角翹起來，整座樓看起來很輕巧，好像要飛起來。</p></li>
<li><h3>第 5 關・贔屭碑：九隻石龜背石碑</h3><p>赤崁樓南邊，有一排九座石龜背著石碑，叫「贔屭碑」。贔屭是傳說中很會背重東西的神獸。這些碑是乾隆皇帝為了紀念平定林爽文事件送來的。相傳一共做了十座，一座送去嘉義；運來的時候，有一隻石龜掉進海裡，只好在臺灣另外做一隻。1960 年，它們從大南門搬到赤崁樓。</p><p>為什麼？贔屭和烏龜一樣嗎？ 長得很像，可是贔屭是傳說中的神獸，力氣很大、喜歡背重的東西，所以常被做成背石碑的樣子。</p></li>
<li><h3>第 6 關・修復：把古蹟顧好</h3><p>赤崁樓在 1983 年被列為第一級古蹟。日本時代它當過陸軍醫院，戰後變成歷史文物館，一直被修了又修。現在，贔屭碑正在修復：老石頭有裂縫，修復的人要很小心，順著裂縫把它補起來。</p><p>為什麼？去古蹟要注意什麼？ 不要摸、不要爬、不要刻字。老石頭、老木頭很脆弱，一點點小傷，都要花很久才修得好。</p></li>
</ol>

/* ---------- 這個遊戲自己用的小工具 ---------- */
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
// 一直跑的動畫（換關時會自動停）
function anim(fn){var raf=0,last=0,on=true;function step(now){if(!on)return;var dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(fn(dt)===false){on=false;return}raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step);loops.push(function(){on=false;cancelAnimationFrame(raf)});return function(){on=false;cancelAnimationFrame(raf)}}
// 一定要等的時間（later() 在「減少動態效果」時會變成 0）
function wait(fn,ms){var t=setTimeout(fn,ms);loops.push(function(){clearTimeout(t)})}
// 點到線段的距離
function segD(p,a,b){var dx=b.x-a.x,dy=b.y-a.y,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy),0,1);return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}

var NOTE='給大人：赤崁樓在中西區民族路二段，全票 70 元，臺南市民憑身分證免費；御贔屭碑和海神廟正在修復，部分區域暫時不能參觀。古蹟不要摸、不要爬。<br>資料來源：臺南市政府文化局古蹟營運科「赤嵌樓」（1625 年布十五匹換土地、1653 年普羅民遮城、糖水糯米汁蚵殼灰、1862 年地震、1886 年沈受謙建蓬壺書院文昌閣並復建海神廟、1895 年陸軍衛戍醫院、1960 年御贔屭碑遷入、1983 年第一級古蹟、開放資訊）、臺南市政府文化局「赤崁樓」（鄭成功改為承天府、清初浪濤直達樓下、赤崁夕照為臺灣八景、九座石龜馱碑）、遠見 2017-09-30（台江內海、西門路一帶是海岸線）、遠見城市學 2023-10-11 專欄（乾隆賜十座碑、一座送嘉義、相傳一座的贔屭落海另做）。布換地的份量、換招牌、太陽的位置、蓋樓閣的順序、裂縫的補法，都是遊戲示意。地圖是示意圖，不是真實比例。';

    setScene(idCard('赤崁樓','荷蘭城堡上的清朝樓閣',art,[['清朝的樓閣',86,42,98,62],['荷蘭的紅磚台基',236,108,250,140],['拱門',160,186,124,152]]));
    var b=el('<button class="big" type="button">出發</button>').firstChild;fastClick(b);b.addEventListener('click',function(){go(1)});area.appendChild(b);area.insertAdjacentHTML('beforeend',LV[0].after)},

  trade:function(area,i,l){

      '<path d="M-20 150H100L88 168H-8Z" fill="'+WOOD+'"/><path d="M40 150V80" stroke="'+WOOD+'" stroke-width="4"/><path d="M42 84L82 120H42Z" fill="#F4ECD8"/>'+
      person(262,168,1.1,'#C85A3A',{dir:-1,hair:'#2A2020'})+'<g id="ld"></g><g id="pl"></g><g id="hd"></g><g id="ct"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),ld=svg.querySelector('#ld'),pl=svg.querySelector('#pl'),hd=svg.querySelector('#hd'),ct=svg.querySelector('#ct');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function bolt(x,y,c){return '<g transform="translate('+f1(x)+' '+f1(y)+')"><rect x="-16" y="-10" width="32" height="20" rx="6" fill="'+c+'" stroke="#8A6A5A" stroke-width="1.4"/><path d="M-16 -3H16M-16 3H16" stroke="#fff" stroke-width="1" opacity=".6"/><text y="4" font-size="11" font-weight="700" fill="#5A3A2A" text-anchor="middle">5 匹</text></g>'}
    var CL=['#D8C8E8','#E8C8B0','#C8E0D0'];
    function draw(){var h='';for(var r=0;r<3;r++)for(var c=0;c<5;c++){var on=r<n;h+='<rect x="'+(126+c*26)+'" y="'+(30+r*24)+'" width="22" height="20" rx="3" fill="'+(on?'#9CC870':'#E4DCC4')+'" stroke="'+(on?'#5E9A48':'#C8BCA0')+'" stroke-width="1.4"/>'}
      ld.innerHTML='<text x="190" y="22" font-size="13" font-weight="700" fill="#3F5A2A" text-anchor="middle">換到的土地</text>'+h;

    drag(svg,function(t,p){if(done)return;
      if(t==='down'){if(dist(p,{x:PIL.x,y:PIL.y-(2-n)*14})<34||dist(p,PIL)<34){hold={x:p.x,y:p.y};draw()}else say(msg,'按住左邊船上的<b>布</b>，拖給右邊的人。',1);return}

    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','荷蘭船上的布和原住民，按 Enter 給一捆布');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();give()}});
    later(function(){if(!n)say(msg,'按住左邊船上的<b>一捆布</b>，拖給右邊的人。')},6000);
  },

  /* 第 2 關：舊招牌往下拉拿下來，再把新招牌往上推到掛鉤 */
  sign:function(area,i,l){
    var HK={x:160,y:56},O={x:160,y:56,on:true,gone:false},N={x:160,y:164,on:false},hold=null,off=null,done=false;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E8EEE4"><rect x="-400" y="172" width="1200" height="60" fill="#C8B888"/>'+
      '<rect x="60" y="30" width="200" height="142" fill="#E8D8C0" stroke="'+BRICK2+'" stroke-width="3"/><path d="M120 172V118Q160 86 200 118V172" fill="#5A3020"/><path d="M60 30L160 6L260 30Z" fill="'+ROOF+'"/>'+
      '<circle cx="'+(HK.x-30)+'" cy="40" r="3" fill="#5A5A54"/><circle cx="'+(HK.x+30)+'" cy="40" r="3" fill="#5A5A54"/><g id="sg"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),sg=svg.querySelector('#sg');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function board(x,y,txt,c,f){return '<g transform="translate('+f1(x)+' '+f1(y)+')"><path d="M-30 -16L0 -28M30 -16L0 -28" stroke="#5A5A54" stroke-width="1.4"/><rect x="-56" y="-16" width="112" height="32" rx="3" fill="'+c+'" stroke="#D8A040" stroke-width="2.4"/><text y="7" font-size="'+f+'" font-weight="900" fill="#D8A040" text-anchor="middle" font-family="Noto Serif TC,Songti TC,serif">'+txt+'</text></g>'}
    function draw(){var h='';if(!O.gone)h+=board(O.x,O.y,'普羅民遮城','#3A3A54',18);if(O.gone||N.on)h+=board(N.x,N.y,'承天府','#3A2A20',22);
      if(O.gone&&!done)h+='<rect x="'+(HK.x-58)+'" y="'+(HK.y-18)+'" width="116" height="36" rx="4" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="5 4"/>';
      sg.innerHTML=h;bar.style.width=(done?100:O.gone?45:0)+'%'}
    draw();
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){if(!O.gone&&Math.abs(p.x-O.x)<60&&Math.abs(p.y-O.y)<24){hold=O;off={y:O.y-p.y}}else if(O.gone&&Math.abs(p.x-N.x)<60&&Math.abs(p.y-N.y)<24){hold=N;off={y:N.y-p.y}}
        else say(msg,O.gone?'按住下面的<b>承天府</b>新招牌，往上推。':'按住城門上的<b>舊招牌</b>，往下拉。',1);return}
      if(t==='move'&&hold){hold.y=clamp(p.y+off.y,40,172);draw();return}
      if(t==='up'&&hold){var h=hold;hold=null;
        if(h===O){if(O.y>110){O.gone=true;N.on=true;draw();say(msg,'舊招牌拿下來了！現在把<b>承天府</b>的新招牌往上推，掛上去。')}else{O.y=HK.y;draw();say(msg,'再<b>往下拉</b>多一點，把舊招牌拿下來。',1)}}
        else{if(Math.abs(N.y-HK.y)<14){N.y=HK.y;done=true;draw();lvDone(area,i,l,msg,'承天府的招牌掛上去了！')}else if(N.y<HK.y){N.y=HK.y+20;draw();say(msg,'推太高了，對準<b>紅色虛線框</b>。',1)}else say(msg,'再<b>往上推</b>，推到紅色虛線框。',1)}}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','城門和招牌，按 Enter 換招牌');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();if(!O.gone){O.gone=true;N.on=true;draw()}else{N.y=HK.y;done=true;draw();lvDone(area,i,l,msg,'承天府的招牌掛上去了！')}}});
    later(function(){if(!O.gone)say(msg,'按住舊招牌，<b>往下拉</b>到城門下面。')},6000);
  },

  /* 第 3 關：按住讓太陽往下落，剛好碰到海面時放開 */
  sunset:function(area,i,l){
    var HZ=118,R=15,sy=24,hold=false,done=false;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F4D8A8"><rect id="sk" x="-400" y="-100" width="1200" height="'+(HZ+100)+'" fill="#F4D8A8"/><g id="sn"></g>'+
      '<rect x="-400" y="'+HZ+'" width="1200" height="120" fill="'+SEA+'" id="se"/><path d="M-400 '+HZ+'H720" stroke="#E8B040" stroke-width="2" stroke-dasharray="6 4"/><g id="rf"></g>'+
      '<g transform="translate(250 '+(HZ+6)+')"><rect x="-40" y="-10" width="90" height="70" fill="'+BRICK2+'"/>'+pavilion(4,-10,.7).replace(/#B8402E/g,'#5A2A1E')+'</g><rect x="-400" y="176" width="1200" height="60" fill="'+SEA2+'"/></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),sn=svg.querySelector('#sn'),rf=svg.querySelector('#rf'),sk=svg.querySelector('#sk');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    var lastT=-1;
    function draw(){var t=clamp((sy-24)/(HZ-R-24),0,1),col='rgb('+Math.round(244-20*t)+','+Math.round(216-100*t)+','+Math.round(168-90*t)+')';
      sk.setAttribute('fill',col);
      // 圓裡、遊戲圖上面的天空也跟著變色
      if(Math.abs(t-lastT)>.04){lastT=t;svg.style.background=col;fitStage()}
      sn.innerHTML='<circle cx="120" cy="'+f1(sy)+'" r="'+R+'" fill="#F08A40"/><circle cx="120" cy="'+f1(sy)+'" r="'+(R+8)+'" fill="#F5B060" opacity=".35"/>';
      rf.innerHTML=t>.5?'<path d="M100 '+(HZ+10)+'H140M106 '+(HZ+22)+'H134M112 '+(HZ+34)+'H128" stroke="#F5B060" stroke-width="3" opacity="'+f1(t)+'"/>':'';
      bar.style.width=(done?100:t*80)+'%'}
    draw();
    anim(function(dt){if(done)return false;if(hold){sy+=dt*26;if(sy+R>HZ+R){hold=false;sy=24;say(msg,'太晚了！太陽<b>沉下去</b>了。再按住一次，碰到海面就<b>放開</b>。',1)}}draw()});
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){hold=true;return}
      if(t==='up'&&hold){hold=false;var gap=HZ-(sy+R);
        if(Math.abs(gap)<=6){sy=HZ-R;done=true;draw();lvDone(area,i,l,msg,'太陽剛好碰到海面！');}
        else if(gap>6)say(msg,'太陽還在天上。再<b>按住</b>，讓它繼續往下落。');
        else{sy=24;draw();say(msg,'太晚了！太陽沉下去了，再試一次。',1)}}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','台江內海的夕陽，按 Enter 讓太陽碰到海面');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();sy=HZ-R;done=true;draw();lvDone(area,i,l,msg,'太陽剛好碰到海面！')}});
    later(function(){if(sy<=24)say(msg,'<b>按住</b>畫面不要放，看太陽慢慢往下落。')},5000);
  },

  /* 第 4 關：在紅磚台基上照順序蓋兩座樓閣：柱子、橫樑、屋頂 */
  build:function(area,i,l){
    var B=[{x:104,parts:1},{x:216,parts:1}],cur=0,done=false;
    var BT=[{k:2,n:'柱子',x:220},{k:4,n:'屋頂',x:100},{k:3,n:'橫樑',x:160}];
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E8EEE4"><rect x="-400" y="150" width="1200" height="60" fill="#C8B888"/><rect x="40" y="128" width="240" height="22" fill="'+BRICK+'" stroke="'+BRICK2+'" stroke-width="1.6"/><g id="pv"></g><g id="bt"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),pv=svg.querySelector('#pv'),bt=svg.querySelector('#bt');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){pv.innerHTML=B.map(function(b,k){return pavilion(b.x,142,.9,b.parts)+(k===cur&&!done?'<path d="M'+(b.x-50)+' 66H'+(b.x+50)+'" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 4"/><text x="'+b.x+'" y="58" font-size="13" font-weight="700" fill="#DB2E27" text-anchor="middle">'+(k?'海神廟':'文昌閣')+'</text>':'')}).join('');
      bt.innerHTML=done?'':BT.map(function(t){return '<g transform="translate('+t.x+' 172)"><rect x="-28" y="-13" width="56" height="26" rx="13" fill="#FFF8EC" stroke="'+BRICK2+'" stroke-width="1.6"/><text y="5" font-size="14" font-weight="700" fill="#5A3020" text-anchor="middle">'+t.n+'</text></g>'}).join('');
      bar.style.width=(done?100:((B[0].parts-1)+(B[1].parts-1))/6*90)+'%'}
    draw();
    function put(k){var b=B[cur];if(k!==b.parts+1){say(msg,b.parts===1?'先立<b>柱子</b>，屋頂和橫樑才有地方放。':b.parts===2?'柱子立好了，接著放<b>橫樑</b>。':'最後蓋上<b>屋頂</b>。',1);return}
      b.parts=k;draw();
      if(b.parts>=4){if(cur===0){cur=1;draw();say(msg,'<b>文昌閣</b>蓋好了！旁邊再蓋一座<b>海神廟</b>。')}else{done=true;draw();lvDone(area,i,l,msg,'兩座樓閣都蓋好了！')}}}
    drag(svg,function(t,p){if(done||t!=='down')return;var best=32,q=null;BT.forEach(function(o){var d=Math.hypot(p.x-o.x,p.y-172);if(d<best){best=d;q=o}});
      if(!q){say(msg,'點下面的<b>零件</b>按鈕。',1);return}put(q.k)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','紅磚台基和樓閣零件，按 Enter 蓋下一步');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();put(B[cur].parts+1)}});
    later(function(){if(B[0].parts===1)say(msg,'蓋房子要先立<b>柱子</b>。點下面的「柱子」。')},6000);
  },

  /* 第 5 關：把九座石碑一座一座拖到贔屭背上 */
  stele:function(area,i,l){
    var X=[0,1,2,3,4,5,6,7,8].map(function(k){return 56+k*27}),Y=170,S=X.map(function(x,k){return {x:x,y:Y-26,on:false,odd:k===6}}),hold=null,ST={x:150,y:70},done=false,n=0;
    var s='<svg class="mini" viewBox="34 40 252 150" style="background:#E8EEE4"><rect x="-400" y="170" width="1200" height="60" fill="#C8B888"/><g id="bx"></g><g id="pl"></g><g id="hd"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),bx=svg.querySelector('#bx'),pl=svg.querySelector('#pl'),hd=svg.querySelector('#hd');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function stele(x,y){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale(.6)"><rect x="-9" y="-20" width="18" height="40" rx="2" fill="#C8C0B0" stroke="'+STONE2+'" stroke-width="2"/><path d="M-9 -16Q0 -26 9 -16" fill="#C8C0B0" stroke="'+STONE2+'" stroke-width="2"/><path d="M-4 -10V14M0 -10V14M4 -10V14" stroke="#9A9284" stroke-width="1.4"/></g>'}
    function draw(){bx.innerHTML=S.map(function(q){return bixi(q.x-6,Y,.55,q.odd?'#C8B898':STONE,false)+(q.on?stele(q.x-6,q.y-6):(done?'':'<rect x="'+(q.x-13)+'" y="'+(q.y-22)+'" width="14" height="28" fill="none" stroke="#DB2E27" stroke-width="1.6" stroke-dasharray="3 3"/>'))}).join('');
      pl.innerHTML=n<9?[0,1,2].slice(0,Math.min(3,9-n)).map(function(k){return stele(ST.x+k*4,ST.y-k*3)}).join('')+'<text x="'+(ST.x+40)+'" y="'+(ST.y+5)+'" font-size="13" font-weight="700" fill="#5A4E48">還有 '+(9-n)+' 座</text>':'';
      hd.innerHTML=hold?stele(hold.x,hold.y):'';bar.style.width=(done?100:n/9*90)+'%'}
    draw();
    function drop(p){var best=18,q=null;S.forEach(function(o){if(o.on)return;var d=Math.hypot(p.x-(o.x-6),p.y-(o.y-6));if(d<best){best=d;q=o}});
      if(!q){say(msg,'把石碑放到贔屭<b>背上</b>的紅色虛線框。',1);return}
      q.on=true;n++;draw();if(n>=9){done=true;draw();lvDone(area,i,l,msg,'九座石碑都放好了！');return}
      if(q.odd)say(msg,'這隻石龜顏色不太一樣喔！<b>相傳</b>它是在臺灣另外做的。');else say(msg,'放好一座！還有 '+(9-n)+' 座。')}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){if(n<9&&dist(p,ST)<30){hold={x:p.x,y:p.y};draw()}else say(msg,'按住上面的<b>石碑</b>。',1);return}
      if(t==='move'&&hold){hold.x=p.x;hold.y=p.y;draw();return}
      if(t==='up'&&hold){var h=hold;hold=null;draw();drop(h)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','九隻贔屭和石碑，按 Enter 放一座石碑');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var q=S.filter(function(o){return !o.on})[0];drop({x:q.x-6,y:q.y-6})}});
    later(function(){if(!n)say(msg,'按住上面的<b>石碑</b>，拖到一隻贔屭的背上。')},6000);
  },

  /* 第 6 關：順著石碑上的 3 條裂縫畫過去，把它補起來 */
  crack:function(area,i,l){
    var C=[[[120,40],[132,58],[126,74],[140,92]],[[200,70],[188,90],[196,110],[184,130]],[[130,130],[150,140],[168,136],[186,150]]].map(function(pts){return {p:pts.map(function(q){return {x:q[0],y:q[1]}}),prog:0,ok:false}}),act=null,done=false;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E8EEE4"><rect x="-400" y="172" width="1200" height="60" fill="#C8B888"/>'+
      '<rect x="100" y="24" width="120" height="150" rx="4" fill="#C8C0B0" stroke="'+STONE2+'" stroke-width="2.4"/><path d="M100 30Q160 0 220 30" fill="#C8C0B0" stroke="'+STONE2+'" stroke-width="2.4"/>'+
      [116,132,148,164,180,196].map(function(x){return '<path d="M'+x+' 44V160" stroke="#B0A898" stroke-width="2" stroke-dasharray="6 5"/>'}).join('')+'<g id="ck"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),ck=svg.querySelector('#ck');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function plen(c){var L=0;for(var k=1;k<c.p.length;k++)L+=dist(c.p[k-1],c.p[k]);return L}
    function at(c,d){for(var k=1;k<c.p.length;k++){var L=dist(c.p[k-1],c.p[k]);if(d<=L){var t=d/L;return {x:c.p[k-1].x+(c.p[k].x-c.p[k-1].x)*t,y:c.p[k-1].y+(c.p[k].y-c.p[k-1].y)*t}}d-=L}return c.p[c.p.length-1]}
    function proj(c,p){var best=1e9,bd=0,acc=0;for(var k=1;k<c.p.length;k++){var a=c.p[k-1],b=c.p[k],L=dist(a,b),t=clamp(((p.x-a.x)*(b.x-a.x)+(p.y-a.y)*(b.y-a.y))/(L*L),0,1),q={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t},d=dist(p,q);if(d<best){best=d;bd=acc+t*L}acc+=L}return {d:best,along:bd}}
    function draw(){ck.innerHTML=C.map(function(c){var pts=c.p.map(function(q){return q.x+','+q.y}).join(' '),done2=c.ok,tip=at(c,c.prog);
        return '<polyline points="'+pts+'" fill="none" stroke="#5A4A3A" stroke-width="3"/>'+(c.prog>0?'<polyline points="'+[c.p[0]].concat(c.p.slice(1).filter(function(q,k){var L=0;for(var j=0;j<=k;j++)L+=dist(c.p[j],c.p[j+1]);return L<=c.prog})).concat([tip]).map(function(q){return f1(q.x)+','+f1(q.y)}).join(' ')+'" fill="none" stroke="#E8DCC0" stroke-width="5" stroke-linecap="round"/>':'')+
          (done2?'':'<circle cx="'+c.p[0].x+'" cy="'+c.p[0].y+'" r="6" fill="#DB2E27" opacity=".8"/>')}).join('');
      bar.style.width=(done?100:C.filter(function(c){return c.ok}).length/3*90)+'%'}
    draw();
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){act=null;C.forEach(function(c){if(!c.ok&&dist(p,c.p[0])<22)act=c});if(!act){var near=C.filter(function(c){return !c.ok&&proj(c,p).d<14})[0];if(near){say(msg,'從裂縫的<b>紅點</b>那一頭開始畫。',1)}else say(msg,'按住一條裂縫頭上的<b>紅點</b>，順著裂縫畫。',1)}return}
      if(t==='move'&&act){var r=proj(act,p);if(r.d>20){act.prog=0;act=null;draw();say(msg,'畫歪了！要<b>順著裂縫</b>畫，從紅點重來。',1);return}
        if(r.along>act.prog&&r.along-act.prog<30)act.prog=r.along;draw();
        if(act.prog>=plen(act)-6){act.ok=true;act.prog=plen(act);act=null;draw();var n=C.filter(function(c){return c.ok}).length;if(n>=3){done=true;draw();lvDone(area,i,l,msg,'3 條裂縫都補好了！');}else say(msg,'補好一條了！還有 '+(3-n)+' 條。')}return}
      if(t==='up'&&act){if(!act.ok){act.prog=0;draw();say(msg,'還沒補完就放開了，從紅點再畫一次。',1)}act=null}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','有裂縫的石碑，按 Enter 補一條裂縫');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var c=C.filter(function(c){return !c.ok})[0];c.ok=true;c.prog=plen(c);draw();if(C.every(function(c){return c.ok})){done=true;draw();lvDone(area,i,l,msg,'3 條裂縫都補好了！')}}});
    later(function(){if(!C.some(function(c){return c.ok}))say(msg,'按住一條裂縫上的<b>紅點</b>，慢慢順著裂縫畫到另一頭。')},6000);
  }
};
