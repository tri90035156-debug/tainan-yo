<h1>王爺任務・廟宇・北門南鯤鯓代天府</h1>
<p>跟著來進香的阿公逛<b>南鯤鯓代天府</b>：跟著隊伍走過從前的大<b>牌樓</b>、看顏色和大小補好屋脊上的<b>剪黏</b>、排隊一個一個走進正殿認識<b>五府千歲</b>、看規律補好樑上的<b>彩繪</b>、摺一艘傳說裡的<b>王船</b>，再幫回來<b>進香</b>的廟充電。</p>
<p>地點：南鯤鯓（臺南市北門區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>北門的南鯤鯓代天府，拜的是五位王爺：李、池、吳、朱、范，大家叫祂們五府千歲。現在的廟，蓋在北門的槺榔山。很多地方的廟，都會帶著神明回到這裡進香。跟著來進香的阿公，從廟前一路走到正殿、走進大鯤園。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・牌樓：跟著隊伍走過牌樓</h3><p>從前，廟前有一座很大的牌樓，有五個門，是 1983 年用 12 根大大的檜木蓋的，新聞說它是亞洲最大的木頭牌樓。2025 年 7 月，丹娜絲颱風把牌樓吹倒了。我們先看看它從前的樣子，跟著進香的隊伍走進去！</p><p>為什麼？廟一直都在這裡嗎？ 不是喔！傳說 1662 年，大家先在海邊的南鯤鯓沙洲蓋了一間廟，後來被海水沖壞了。1817 年決定搬到槺榔山，也就是現在這裡；1822 年蓋好，取名叫代天府。</p></li>
<li><h3>第 2 關・三川殿：補屋脊上的剪黏</h3><p>走過廟埕，前面是三川殿，就是走進廟第一座看到的殿。抬頭看屋頂最高的那條線，叫屋脊，上面站著好多小人物：三國的人物、騎著鶴的仙翁、孫悟空。它們是用碎碎的瓷片貼成的，叫剪黏。</p><p>為什麼？屋頂上的剪黏怎麼了？ 2025 年夏天，颱風和大雨讓南鯤鯓的屋脊倒了一部分，剪黏也壞了。文化部長來看過，說希望不只修好，還要修得比以前更好。</p></li>
<li><h3>第 3 關・正殿：一個一個走進正殿</h3><p>正殿裡拜的，就是五府千歲：大王李、二王池、三王吳、四王朱、五王范。傳說祂們是一起結拜的好兄弟。拜拜的人很多，要排隊，一個一個慢慢進去。</p><p>為什麼？為什麼池王爺的臉是黑的？ 傳說瘟神要把瘟疫粉撒出去，讓大家生病。池王爺趁瘟神不注意，把瘟疫粉全部吞下去，臉就變黑了。所以池王爺的神像都是黑臉。這是傳說故事。</p></li>
<li><h3>第 4 關・金錢壁：看規律補彩繪</h3><p>繞到正殿後面，有一面金錢壁，是用從澎湖來的咾咕石砌的。新聞說，它有財運和長壽的意思。抬頭看廟裡的木頭橫樑，上面畫著漂亮的彩繪，是有名的畫師潘麗水畫的。彩繪的花紋，常常照著規律一直重複。</p><p>為什麼？為什麼叫金錢壁？ 新聞說，正殿後面這面牆有財運、長壽的意思，所以叫金錢壁。它用咾咕石砌成，石頭上有很多小洞洞，到現場可以看看（看就好，不要摸）。</p></li>
<li><h3>第 5 關・大鯤園：摺一艘王船</h3><p>廟旁邊的大鯤園，大約 6 公頃，是仿照江南的庭園，由建築家漢寶德設計，裡面還有文化館，可以看廟的歷史和文物。阿公說了一個傳說：很久以前，有一艘王船漂到南鯤鯓的海邊，船上有五位千歲。漁民把祂們迎上岸，搭了草寮來拜，這就是廟的開始。</p><p>為什麼？為什麼說廟是從一艘船開始的？ 這是傳說：很久以前，有一艘船漂到南鯤鯓的海邊，船上有五位千歲，漁民就搭草寮來拜。傳說有好幾種說法，有的說船是漂來的，有的說船是在海上擱淺了（船卡在淺水裡，動不了）。</p></li>
<li><h3>第 6 關・香爐：分香和回來進香</h3><p>回到廟埕，好熱鬧！很多地方的廟，都是從南鯤鯓分香出去的：新的神像先在南鯤鯓的大香爐上過一過，帶一點香灰回去，蓋一間新的廟。到了神明生日，這些廟會帶著神明回到南鯤鯓進香，就像回來「充電」。還有好幾百隊陣頭來表演祝壽。</p><p>為什麼？為什麼分出去的廟要回來？ 新聞說，分出去的廟，要在神明生日的時候，帶著神明回到原本的廟（祖廟），像幫神明充電。所以神明生日的時候，南鯤鯓會擠滿進香的隊伍和陣頭。</p></li>
</ol>

function stonewall(x,y,w,h,seed){var r=rnd(seed||5),s='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#B8B0A0"/>';
  for(var j=0;j<h;j+=16)for(var i=(j/16)%2?-10:0;i<w;i+=22){var a=Math.max(x,x+i)+1,c=Math.min(x+i+22,x+w)-a-1;if(c<4)continue;

            if(inN>=5&&!done){done=true;draw();lvDone(area,i,l,msg,crowd?'5 個人都進去了！':'5 個人都慢慢走進正殿，一次都沒有擠！')}}}ch=true}
        else if(q.o>0&&q.x<q.tx){q.x=Math.min(q.tx,q.x+50*dt);ch=true}});

  /* 第 4 關：橫樑上的彩繪花紋缺了幾格，看規律點下面的花、雲、葉補上 */
  pattern:function(area,i,l){
    var ROWS=[{y:57,seq:['花','雲','葉','花','雲','葉','花','雲','葉'],bl:[2,4,7]},{y:103,seq:['雲','花','花','雲','花','花','雲','花','花'],bl:[3,7]}];
    var TODO=[];ROWS.forEach(function(r,ri){r.got={};r.bl.forEach(function(b){TODO.push({r:ri,k:b})})});
    var CH=[{k:'花',x:100},{k:'雲',x:160},{k:'葉',x:220}],at=0,done=false,miss=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F2E8D8"><rect x="-400" y="132" width="1200" height="70" fill="#E8D8BC"/>'+
      ROWS.map(function(r){return '<rect x="26" y="'+(r.y-19)+'" width="268" height="38" rx="4" fill="#6A3A2A" stroke="'+GOLD+'" stroke-width="2"/>'}).join('')+

        if(blank)h+='<rect x="'+(cx(k)-12)+'" y="'+(r.y-13)+'" width="24" height="26" rx="4" fill="#8A5A42" stroke="'+(cur?'#FFF8EC':'#C8A888')+'" stroke-width="'+(cur?2.6:1.4)+'" stroke-dasharray="3 2.4"/>'+(cur?'<text x="'+cx(k)+'" y="'+(r.y+5)+'" font-size="14" font-weight="900" fill="#FFF8EC" text-anchor="middle">?</text>':'');
        else h+=motif(m,cx(k),r.y,1)})});

      chg.innerHTML=done?'':CH.map(function(c){return '<circle cx="'+c.x+'" cy="155" r="22" fill="#FFF8EC" stroke="#BD9558" stroke-width="2"/>'+motif(c.k,c.x,152,1.3)+'<text x="'+c.x+'" y="187" font-size="13" font-weight="700" fill="#5A4A3A" text-anchor="middle">'+c.k+'</text>'}).join('');
      bar.style.width=(done?100:at/TODO.length*90)+'%'}
    draw();
    function pick(k){var t=TODO[at],r=ROWS[t.r],need=r.seq[t.k];
      if(k!==need){miss++;say(msg,'這一格好像不是<b>'+k+'</b>。看看前面：'+(t.r===0?'上面那一條是<b>花、雲、葉</b>，三個一組一直重複。':'下面那一條是<b>雲、花、花</b>，三個一組一直重複。'),1);return}
      r.got[t.k]=1;at++;
      if(at>=TODO.length){done=true;draw();lvDone(area,i,l,msg,'補好了！花紋照著規律，一組一組排好。');return}
      say(msg,TODO[at].r!==t.r?'上面那一條補好了！再看<b>下面那一條</b>，它的規律不一樣喔。':'對了！再補下一格。');draw()}
    drag(svg,function(t,p){if(done||t!=='down')return;

    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var t=TODO[at];pick(ROWS[t.r].seq[t.k])}});
    later(function(){if(!done&&!at)say(msg,'有<b>問號</b>的那一格不見了。它前面是<b>花、雲</b>……下一個是什麼？')},7000);
  },

  /* 第 5 關：照虛線摺紙船：每一步點對的那一條虛線（點錯的會說為什麼） */
  fold:function(area,i,l){
    var S=[
      {p:'M100 30H220V150H100Z',L:[{a:[92,90],b:[228,90],ok:1},{a:[160,22],b:[160,66],no:'這樣摺，船會太窄。先把紙<b>上下</b>對摺。'}],ok:'對摺好了！接著摺<b>上面的兩個角</b>。'},
      {p:'M100 60H220V150H100Z',L:[{a:[160,60],b:[100,110],ok:1,c:1},{a:[160,60],b:[220,110],ok:1,c:2},{a:[92,130],b:[228,130],no:'下面的邊等一下再摺。先摺<b>上面的兩個角</b>。'}],ok:'兩個角都摺下來了！再把<b>下面的邊</b>往上摺。'},
      {p:'M100 110L160 60L220 110V150H100Z',L:[{a:[92,130],b:[228,130],ok:1},{a:[160,64],b:[160,104],no:'這樣會把它摺扁。摺<b>下面的邊</b>。'}],ok:'變成一頂紙帽子了！最後，<b>點紙的中間</b>，把兩邊拉開。'},
      {p:'M100 110L160 60L220 110V130H100Z',pull:1}
    ];
    var st=0,c1=0,c2=0,done=false;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E6F0E4"><rect x="-400" y="156" width="1200" height="60" fill="'+WATER+'"/><path d="M-400 160H720" stroke="#fff" stroke-width="1.4" opacity=".6"/>'+
      '<path d="M268 120H304M274 120V156M298 120V156" stroke="'+RED2+'" stroke-width="3"/><path d="M262 120Q286 102 310 120Z" fill="'+ROOF+'"/><g id="pa"></g><g id="ln"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),pa=svg.querySelector('#pa'),ln=svg.querySelector('#ln');

    var PAPER='#E8705A',PAPER2='#C8503E';
    function draw(){var cs=S[st],h='';
      if(done){h=boat(160,158,1.5)}
      else{var pth=cs.p;if(st===1&&(c1||c2))pth='M100 '+(c1?110:60)+'L160 60L220 '+(c2?110:60)+'V150H100Z';
        h='<path d="'+pth+'" fill="'+PAPER+'" stroke="'+PAPER2+'" stroke-width="2" stroke-linejoin="round"/>';
        if(st>=2||c1)h+='<path d="M100 110L160 60L160 110Z" fill="'+PAPER2+'" opacity=".35"/>';
        if(st>=2||c2)h+='<path d="M220 110L160 60L160 110Z" fill="'+PAPER2+'" opacity=".35"/>';
        if(st===3)h+='<rect x="100" y="110" width="120" height="20" fill="'+PAPER2+'" opacity=".45"/><circle cx="160" cy="100" r="24" fill="none" stroke="#2A2020" stroke-width="2.2" stroke-dasharray="4 3"/><text x="160" y="105" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">點這裡</text>'}
      pa.innerHTML=h;
      ln.innerHTML=done||cs.pull?'':cs.L.map(function(L){if(L.c&&(L.c===1?c1:c2))return '';return '<path d="M'+L.a[0]+' '+L.a[1]+'L'+L.b[0]+' '+L.b[1]+'" stroke="#2A2020" stroke-width="2.4" stroke-dasharray="6 4"/>'}).join('');

    drag(svg,function(t,p){if(done||t!=='down')return;var cs=S[st];

  /* 第 6 關：點大香爐分香火給四間新廟；神明生日到了，把每間廟的神轎拖回大香爐充電 */
  incense:function(area,i,l){
    var B={x:160,y:96},T=[{x:46,y:130},{x:274,y:130},{x:104,y:182},{x:216,y:182}],given=0,phase=0,done=false,hold=null,fly=null,charge=null;

    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F6EEE0"><rect x="-400" y="140" width="1200" height="70" fill="'+PLAZA+'"/>'+
      burner(160,130,1.6)+'<g id="tp"></g><g id="fx"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),tp=svg.querySelector('#tp'),fx=svg.querySelector('#fx');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function flame(x,y,on,s){return '<path transform="translate('+f1(x)+' '+f1(y)+') scale('+(s||1)+')" d="M0 -12Q8 -3 5 4Q3 8 0 8Q-3 8 -5 4Q-8 -3 0 -12Z" fill="'+(on?'#F5A030':'#B8B0A8')+'" stroke="'+(on?'#DB2E27':'#8A8078')+'" stroke-width="1.4"/>'}
    function draw(){var h='';
      T.forEach(function(t){h+=minitemple(t.x,t.y,1.3);
        if(t.lit)h+=flame(t.x,t.y-50,phase===0||t.ok);
        if(phase===1&&!t.ok&&hold!==t&&charge!==t)h+=sedan(t.x+(t.x<160?24:-24),t.y-2,.7);
        if(!done&&phase===1&&!t.ok&&hold!==t&&charge!==t)h+='<circle cx="'+t.x+'" cy="'+(t.y-22)+'" r="24" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>'});
      if(phase===0&&!done&&!fly)h+='<circle cx="'+B.x+'" cy="'+B.y+'" r="34" fill="none" stroke="#DB2E27" stroke-width="2.4" stroke-dasharray="5 4"/>';
      tp.innerHTML=h;
      var f='';if(fly)f+=flame(fly.x,fly.y,true,1.2);
      if(hold)f+=sedan(hold.hx,hold.hy,1.1);
      if(charge)f+=sedan(B.x+30,B.y+30,1.1)+'<circle cx="'+B.x+'" cy="'+B.y+'" r="'+f1(20+charge.t*24)+'" fill="#F5C842" opacity="'+f1(.5-charge.t*.4)+'"/>';
      fx.innerHTML=f;
      bar.style.width=(done?100:(given+T.filter(function(t){return t.ok}).length)/8*90)+'%'}
    draw();
    anim(function(dt){var ch=false;
      if(fly){fly.t+=dt*1.8;var t=T[fly.k],u=Math.min(1,fly.t);fly.x=B.x+(t.x-B.x)*u;fly.y=(B.y-30)+(t.y-50-(B.y-30))*u-Math.sin(u*Math.PI)*30;
        if(fly.t>=1){t.lit=1;fly=null;
          if(given>=4){say(msg,'四間新廟都分到香火了！……過了一年，神明生日到了，香火變暗了。');wait(function(){phase=1;draw();say(msg,'按住一間廟的<b>神轎</b>，拖回<b>大香爐</b>幫神明充電！')},1400)}}ch=true}
      if(charge){charge.t+=dt*1.4;if(charge.t>=1){charge.ok=1;charge=null;var n=T.filter(function(t){return t.ok}).length;
          if(n>=4){done=true;draw();lvDone(area,i,l,msg,'充好電了！四間廟的香火都亮起來。');return false}
          say(msg,'充好電了，神轎回家了！還有 '+(4-n)+' 間。')}ch=true}
      if(ch)draw()});
    function give(){if(fly||given>=4)return;fly={k:given,t:0,x:B.x,y:B.y-30};given++;if(given===1)say(msg,'香火分出去了！再點，分給每一間新廟。');draw()}
    function back(t){if(charge){say(msg,'等前一頂神轎充好電。',1);return false}charge=t;charge.t=0;draw();return true}
    drag(svg,function(t,p){if(done)return;
      if(phase===0){if(t!=='down')return;if(dist(p,B)<40)give();else if(!fly)say(msg,'先點中間的<b>大香爐</b>，把香火分出去。',1);return}
      if(t==='down'){var b=null,bd=30;T.forEach(function(q){var d=dist(p,{x:q.x,y:q.y-22});if(!q.ok&&q!==charge&&d<bd){bd=d;b=q}});
        if(!b){say(msg,'按住一間<b>還沒充電</b>的廟（紅色虛線圈圈），把神轎拖回大香爐。',1);return}hold=b;b.hx=p.x;b.hy=p.y-18;draw();return}
      if(t==='move'&&hold){hold.hx=p.x;hold.hy=p.y-18;draw();return}
      if(t==='up'&&hold){var h=hold;hold=null;if(dist({x:h.hx,y:h.hy},B)<46)back(h);else say(msg,'要拖到中間的<b>大香爐</b>旁邊。',1);draw()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','大香爐和四間分出去的廟，按 Enter 分香火、帶神轎回來充電');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();if(phase===0)give();else{var q=T.filter(function(x){return !x.ok&&x!==charge})[0];if(q)back(q)}}});
    later(function(){if(!done&&!given)say(msg,'點中間冒煙的<b>大香爐</b>（紅色虛線圈圈）。')},6000);
  }
};
</script>
