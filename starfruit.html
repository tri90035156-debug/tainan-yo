<h1>楊桃任務・水果・楠西楊桃</h1>
<p>跟著<b>楠西</b>種楊桃的阿姨走<b>楊桃路</b>：切出五個角的<b>星星</b>、掛<b>誘蟲盒</b>抓公蛾、幫小楊桃<b>套袋</b>、把落果撿乾淨、每天巡園只摘黃的，再<b>抽查</b>要出國的楊桃。</p>
<p>地點：楠西（臺南市楠西區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>楠西是臺灣種楊桃最多的地方：2023 年，全臺灣的楊桃園，有超過三分之一在楠西。從楠西街上往梅嶺的 188 縣道，兩旁都是楊桃園，大家叫它楊桃路；路經過的灣丘里，被叫做「最後的楊桃村」。跟著種楊桃的阿姨，從認識楊桃、掛誘蟲盒、套袋，一直做到把楊桃送出國。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・楊桃路：切出一顆星星</h3><p>阿姨拿出一顆黃黃的楊桃：「你看，它有 5 條凸凸的稜。」稜，就是像屋頂的屋脊那樣，凸起來的長長的邊。所以楊桃又叫五斂子、五稜子。楊桃的老家大概在馬來西亞，清朝的時候傳到臺灣。</p><p>為什麼？為什麼切開是星星？ 楊桃有 5 條稜，從旁邊看是一條一條凸起來的邊。把它一片一片切，每一片都有 5 個尖角，就像一顆星星。所以英文叫它 star fruit，就是「星星水果」。</p></li>
<li><h3>第 2 關・果園：掛上誘蟲盒</h3><p>秋天 10 月，楊桃樹開出小小的花，花謝了就結出小果子。這時候，一種小蛾也飛來了：楊桃花姬捲葉蛾。牠在果子上產卵，小蟲孵出來就鑽進果肉裡吃，楊桃就壞了。阿姨在果園裡掛誘蟲盒：盒子裡有母蛾的味道（叫性費洛蒙），公蛾聞到就飛進去，出不來。</p><p>為什麼？抓公蛾有什麼用？ 公蛾被抓走了，母蛾就找不到公蛾，生不出蛾寶寶，蟲就越來越少。誘蟲盒裡沒有農藥，對人和環境都比較安全。</p></li>
<li><h3>第 3 關・套袋：幫楊桃穿紙衣</h3><p>小楊桃長到大約 5 公分，阿姨就幫它套袋：用紙袋把果子整顆包起來。這樣捲葉蛾和果實蠅就沒辦法在果子上產卵。到了 12 月，楠西的楊桃大多都穿上紙衣了。</p><p>為什麼？袋口為什麼要封緊？ 袋口有縫，介殼蟲這種小蟲就會從縫鑽進去，躲在袋子裡吸楊桃的汁。所以袋口一定要封緊。</p></li>
<li><h3>第 4 關・撿落果：把落果撿乾淨</h3><p>樹下掉了好多落果，就是從樹上掉下來的果子。有的落果裡面，還住著小蟲。小蟲在落果裡長大，變成蛾，又飛去下一批楊桃產卵。所以阿姨說：落果一定要撿乾淨，這叫做清園。</p><p>為什麼？落果為什麼一定要撿？ 落果裡的小蟲會長大變成蛾，飛去下一批楊桃產卵。研究發現，楠西 12 月的蛾最多，很多就是從落果裡長出來的。撿掉落果，不用農藥，就能少很多蟲。</p></li>
<li><h3>第 5 關・採收：每天都要巡一次</h3><p>農曆年前後，是楊桃最多的時候。同一棵樹上的楊桃，不會一起熟：今天這顆黃了，明天換那顆。所以採收的時候，阿姨每天都要來果園巡，一顆一顆看，黃了才摘。楊桃的稜很容易碰傷，要輕輕拿。</p><p>為什麼？楊桃為什麼要一顆一顆用手摘？ 同一棵樹的楊桃，熟的時間不一樣，機器分不出來；楊桃的稜又很容易碰傷。所以只能靠人每天巡、一顆一顆看、輕輕摘。</p></li>
<li><h3>第 6 關・包裝場：抽查以後再出國</h3><p>楠西是臺灣最大的楊桃出口產區，很多楊桃要送到很遠的美國和加拿大。出國前要檢查。一箱一箱都打開，太慢了，所以挑幾箱出來抽查，看楊桃的蒂頭（連著果柄的那一頭）有沒有小蟲。只要找到一隻，整批都要送去燻蒸，就是用藥的氣體把蟲殺死。</p><p>為什麼？為什麼不是每一箱都打開？ 箱子太多了，每一箱都打開要花很多時間，楊桃也容易碰傷。所以挑幾箱出來抽查：抽到的都沒問題，這一批大概就沒問題；抽到一隻蟲，整批都要再處理。</p></li>
</ol>

    function flapPath(x,side,fold,fx){// 袋口的一邊：沒折是往外翹的耳朵，折好了貼在果柄上
      var e=side<0?x-20:x+20;if(fold)return '<path d="M'+e+' '+TOP+'L'+(x-side*2)+' '+(TOP-4)+'L'+(x-side*2)+' '+(TOP+8)+'Z" fill="#F4EEDC" stroke="#BFB49A" stroke-width="1.2"/>';
      var tx=fx!==undefined?fx:e+side*10;return '<path d="M'+e+' '+TOP+'L'+f1(tx)+' '+(TOP-12)+'L'+f1(e-side*12)+' '+TOP+'Z" fill="#FFFDF4" stroke="#BFB49A" stroke-width="1.4"/>'}
    function draw(){fr.innerHTML=FR.map(function(f){var h='<path d="M'+f.x+' 32V'+(TOP+2)+'" stroke="#7A5A30" stroke-width="2.4"/>'+sfruit(f.x,TOP+28,.7,GRN,90);
        if(f.bag){h+=bag(f.x,TOP,40,BH);
          h+=flapPath(f.x,-1,f.L,flap&&flap.f===f&&flap.s<0?flap.x:undefined)+flapPath(f.x,1,f.R,flap&&flap.f===f&&flap.s>0?flap.x:undefined);
          if(sealed(f))h+='<rect x="'+(f.x-9)+'" y="'+(TOP-1)+'" width="18" height="5" rx="2" fill="#DB2E27"/>';
          else if(!flap){if(!f.L)h+='<circle cx="'+(f.x-26)+'" cy="'+(TOP-6)+'" r="12" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>';if(!f.R)h+='<circle cx="'+(f.x+26)+'" cy="'+(TOP-6)+'" r="12" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>'}}
        return h}).join('');
      var left=FR.filter(function(f){return !f.bag}).length;
      pl.innerHTML=left&&!hold?bag(PILE.x-4,PILE.y-18,34,30)+bag(PILE.x+4,PILE.y-14,34,30)+'<text x="'+PILE.x+'" y="'+(PILE.y+30)+'" font-size="13" font-weight="700" fill="#4A6A2E" text-anchor="middle">紙袋</text>':'';
      hd.innerHTML=hold?bag(hold.x,hold.y-30,40,BH):'';
      bar.style.width=(done?100:(FR.filter(function(f){return f.bag}).length+nDone())/6*90)+'%'}
    draw();
    function after(f){draw();var n=nDone();if(n>=3){done=true;draw();lvDone(area,i,l,msg,'3 顆都套好、封緊了！');return}
      if(sealed(f))say(msg,'封緊了！介殼蟲鑽不進去。'+(n<3?'再套下一顆。':''));
      else if(f.L||f.R)say(msg,'折好一邊了！另一邊也往<b>中間</b>拖。');
      else say(msg,'套住了！袋口還開開的，把<b>左右兩邊</b>往中間的果柄拖，折起來。')}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){// 先看是不是袋口的耳朵，再看紙袋堆
        var best=24,hit=null;FR.forEach(function(f){if(!f.bag)return;[-1,1].forEach(function(sd){if(sd<0?f.L:f.R)return;var d=dist(p,{x:f.x+sd*26,y:TOP-6});if(d<best){best=d;hit={f:f,s:sd,x:f.x+sd*30}}})});
        if(hit){flap=hit;draw();return}
        if(FR.some(function(f){return !f.bag})&&dist(p,PILE)<34){if(FR.some(function(f){return f.bag&&!sealed(f)})){say(msg,'先把套好的那一顆，袋口<b>封緊</b>再套下一顆。',1);return}hold={x:p.x,y:p.y};draw();return}
        if(FR.some(function(f){return f.bag&&!sealed(f)}))say(msg,'按住袋口旁邊<b>紅色虛線圈圈</b>裡的耳朵，往<b>中間</b>拖。',1);
        else say(msg,'按住下面的<b>紙袋</b>，往上拖到小楊桃那裡。',1);return}
      if(t==='move'){if(hold){hold.x=p.x;hold.y=p.y;draw()}
        else if(flap){var f=flap.f,sd=flap.s;flap.x=sd<0?clamp(p.x,f.x-34,f.x):clamp(p.x,f.x,f.x+34);
          if(Math.abs(p.x-f.x)<7){if(sd<0)f.L=true;else f.R=true;flap=null;after(f);return}draw()}return}
      if(t==='up'){if(hold){var h=hold;hold=null;var k=null;FR.forEach(function(f){if(!f.bag&&Math.abs(h.x-f.x)<32&&h.y<TOP+60)k=f});
          if(k){k.bag=true;after(k)}else{draw();say(msg,'把紙袋拖到一顆<b>小楊桃</b>的位置，從下面往上套住它。',1)}}
        else if(flap){flap=null;draw();say(msg,'要一直拖到<b>中間</b>的果柄，才折得起來。',1)}}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','樹枝上三顆小楊桃，按 Enter 套好一顆紙袋');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var f=FR.filter(function(f){return !sealed(f)})[0];f.bag=f.L=f.R=true;after(f)}});
    later(function(){if(!done&&!FR.some(function(f){return f.bag}))say(msg,'按住下面的<b>紙袋</b>，往上拖到左邊那顆<b>小楊桃</b>再放開。')},7000);
  },

  /* 第 4 關：拖著袋子收落果，裝越多越重、拖得越慢；裝滿 5 顆要拖去桶子倒掉 */
  gather:function(area,i,l){
    var P=[[52,78],[92,118],[70,156],[128,70],[118,150],[160,108],[200,152],[206,74],[238,118],[270,82],[256,156],[160,160]],
      F=P.map(function(q,k){return {x:q[0],y:q[1],r:(k*67)%180-90,got:false,w:k%3===0}}),
      BK={x:160,y:30},CAP=5,sack={x:160,y:122},tgt=null,n=0,got=0,done=false,fullMsg=0;
    sack.x=40;sack.y=110;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#D8C8A0"><rect x="-400" y="170" width="1200" height="60" fill="#C8B48C"/>'+
      '<circle cx="-6" cy="30" r="40" fill="'+LEAF+'" opacity=".9"/><circle cx="326" cy="34" r="40" fill="'+LEAF+'" opacity=".9"/><circle cx="330" cy="150" r="36" fill="'+LEAF2+'" opacity=".85"/><circle cx="-10" cy="160" r="34" fill="'+LEAF2+'" opacity=".85"/>'+
      '<g id="bk"></g><g id="fa"></g><g id="sk"></g><g id="ct"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),bk=svg.querySelector('#bk'),fa=svg.querySelector('#fa'),sk=svg.querySelector('#sk'),ct=svg.querySelector('#ct');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){bk.innerHTML='<path d="M'+(BK.x-20)+' '+(BK.y-12)+'H'+(BK.x+20)+'L'+(BK.x+15)+' '+(BK.y+14)+'H'+(BK.x-15)+'Z" fill="#5A86A8" stroke="#3A5E7E" stroke-width="1.6"/><ellipse cx="'+BK.x+'" cy="'+(BK.y-12)+'" rx="20" ry="4" fill="#3A5E7E"/>'+
        (n>=CAP&&!done?'<circle cx="'+BK.x+'" cy="'+BK.y+'" r="26" fill="none" stroke="#DB2E27" stroke-width="2.2" stroke-dasharray="4 3"/>':'')+'<text x="'+(BK.x+28)+'" y="'+(BK.y+4)+'" font-size="13" font-weight="700" fill="#2A2020">桶子</text>';
      fa.innerHTML=F.map(function(f){return f.got?'':sfruit(f.x,f.y,.42,'#C8A040',f.r)+(f.w?'<path d="M'+(f.x+8)+' '+(f.y-5)+'q3 -4 6 0" stroke="#C83A2E" stroke-width="2" fill="none" stroke-linecap="round"/>':'')}).join('');
      var z=1+n*.09;sk.innerHTML='<g transform="translate('+f1(sack.x)+' '+f1(sack.y)+') scale('+f1(z)+')"><path d="M-14 -10Q-18 12 -10 16H10Q18 12 14 -10Z" fill="#E8DCC0" stroke="#A89470" stroke-width="1.6"/><path d="M-14 -10Q0 -16 14 -10" stroke="#A89470" stroke-width="2" fill="none"/>'+
        '<text y="8" font-size="11" font-weight="700" fill="#6C2024" text-anchor="middle">'+n+'/'+CAP+'</text></g>'+(!tgt&&!done&&got===0?'<circle cx="'+f1(sack.x)+'" cy="'+f1(sack.y)+'" r="24" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>':'');
      ct.innerHTML='<rect x="232" y="164" width="80" height="22" rx="11" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.2"/><text x="272" y="180" font-size="13" font-weight="700" fill="#2A2020" text-anchor="middle">撿了 '+got+'／12</text>';
      bar.style.width=(done?100:got/12*90)+'%'}
    draw();
    function pick(f){f.got=true;n++;got++;
      if(got>=12){done=true;draw();lvDone(area,i,l,msg,'12 顆落果都撿起來了！');return}
      if(n>=CAP){fullMsg++;say(msg,'袋子<b>滿了</b>，好重！拖到上面的<b>桶子</b>倒掉。')}
      else if(n===1)say(msg,'裝進去了！袋子變重一點，拖起來也<b>慢一點</b>。');
      draw()}
    function dump(){if(!n)return;n=0;say(msg,'倒進桶子了，袋子又變<b>輕</b>了！繼續撿。');draw()}
    anim(function(dt){if(done)return false;if(tgt){var k=clamp(.5-n*.08,.07,.5),a=1-Math.pow(1-k,dt*60);sack.x+=(tgt.x-sack.x)*a;sack.y+=(tgt.y-sack.y)*a;
        F.forEach(function(f){if(!f.got&&!done&&dist(f,sack)<18){if(n<CAP)pick(f);else if(!fullMsg){fullMsg++;say(msg,'袋子<b>滿了</b>，裝不下！先拖到上面的<b>桶子</b>倒掉。',1)}}});
        if(n&&dist(sack,BK)<26)dump();draw()}});
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){if(dist(p,sack)<34*(1+n*.09)){tgt={x:p.x,y:p.y};draw()}else say(msg,'先按住<b>袋子</b>，再拖著走。',1);return}
      if(t==='move'&&tgt){tgt.x=clamp(p.x,14,306);tgt.y=clamp(p.y,20,172);return}
      if(t==='up'){tgt=null;draw()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','樹下的落果和袋子，按 Enter 撿一顆落果');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();if(n>=CAP){dump();return}var f=F.filter(function(f){return !f.got})[0];sack.x=f.x;sack.y=f.y;pick(f)}});
    later(function(){if(!done&&!got)say(msg,'按住左邊的<b>袋子</b>（紅色虛線圈圈），拖到落果上面。')},7000);
  },

  /* 第 5 關：一天一天巡園，只摘那天變黃的楊桃（綠的明天再來），巡 3 天 */
  patrol:function(area,i,l){
    var P=[[58,86],[100,58],[112,118],[156,84],[204,58],[212,120],[258,88],[62,128]],RD=[0,1,2,1,0,2,1,2],
      F=P.map(function(q,k){return {x:q[0],y:q[1],d:RD[k],got:false,fly:0}}),day=0,done=false,basket=0,early=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EAF2F6"><rect x="-400" y="170" width="1200" height="60" fill="'+GRASS+'"/>'+
      '<path d="M150 170V120M170 170V120M150 130L110 104M170 128L214 104" stroke="#7A5A3A" stroke-width="8" stroke-linecap="round"/>'+
      '<ellipse cx="160" cy="88" rx="150" ry="66" fill="'+LEAF+'"/><ellipse cx="120" cy="70" rx="70" ry="36" fill="#6EAA56"/><ellipse cx="220" cy="100" rx="60" ry="30" fill="'+LEAF2+'"/>'+
      '<g id="fr"></g><g id="bs"></g><g id="ct"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),fr=svg.querySelector('#fr'),bs=svg.querySelector('#bs'),ct=svg.querySelector('#ct');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    var btn=bigBtn(area,'過一天');
    function ripe(f){return f.d<=day}
    function draw(){fr.innerHTML=F.map(function(f){if(f.got)return '';var c=ripe(f)?YEL:GRN,d=ripe(f)?YEL2:GRN2;
        return '<path d="M'+f.x+' '+(f.y-24)+'V'+(f.y-15)+'" stroke="#7A5A30" stroke-width="2"/><path d="M'+(f.x-9)+' '+(f.y+10)+'Q'+(f.x-8)+' '+(f.y+30)+' '+f.x+' '+(f.y+33)+'Q'+(f.x+8)+' '+(f.y+30)+' '+(f.x+9)+' '+(f.y+10)+'Z" fill="'+c+'" stroke="'+d+'" stroke-width="1.6"/>'+bag(f.x,f.y-16,22,30)}).join('');
      bs.innerHTML='<path d="M136 156H184L178 176H142Z" fill="#C8955A" stroke="#8A6A3A" stroke-width="1.5"/>'+F.filter(function(f){return f.got}).map(function(f,k){return sfruit(146+(k%4)*9,154-Math.floor(k/4)*6,.28,YEL,-20+k*10)}).join('');
      ct.innerHTML='<rect x="8" y="6" width="74" height="24" rx="12" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.2"/><text x="45" y="23" font-size="14" font-weight="700" fill="#2A2020" text-anchor="middle">第 '+(day+1)+' 天</text>';
      bar.style.width=(done?100:F.filter(function(f){return f.got}).length/F.length*90)+'%'}
    draw();
    function todayLeft(){return F.filter(function(f){return !f.got&&ripe(f)}).length}
    function pick(f){f.got=true;draw();var left=todayLeft();
      if(F.every(function(f){return f.got})){done=true;btn.remove();draw();lvDone(area,i,l,msg,'第 3 天的也摘完了！');return}
      say(msg,left?'摘下來了！還有 <b>'+left+' 顆</b>黃的。':'今天黃的都摘完了！按「<b>過一天</b>」，明天再來巡。')}
    btn.addEventListener('click',function(){if(done)return;if(todayLeft()){say(msg,'今天<b>黃的</b>還沒摘完喔！還有 '+todayLeft()+' 顆，不摘明天就太熟了。',1);return}
      day++;draw();var nw=todayLeft();say(msg,'第 '+(day+1)+' 天，又有 <b>'+nw+' 顆</b>變黃了！')});
    drag(svg,function(t,p){if(done||t!=='down')return;var k=null,best=24;F.forEach(function(f){if(f.got)return;var d=dist(p,{x:f.x,y:f.y+4});if(d<best){best=d;k=f}});
      if(!k)return;if(!ripe(k)){early++;say(msg,'這顆還是<b>綠的</b>，還沒熟。摘下來會酸，明天再來看！',1);return}pick(k)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','一棵套著紙袋的楊桃樹，按 Enter 摘今天黃的楊桃');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var f=F.filter(function(f){return !f.got&&ripe(f)})[0];if(f)pick(f);else{day++;draw()}}});
    later(function(){if(!done&&!F.some(function(f){return f.got}))say(msg,'找找看，紙袋下面露出<b>黃色尾巴</b>的楊桃，點它。')},7000);
  },

  /* 第 6 關：12 箱蓋著的楊桃，自己挑 3 箱點開抽查，再點蒂頭看有沒有小蟲 */
  sample:function(area,i,l){
    var B=[];[67,129,191,253].forEach(function(x){[52,100,148].forEach(function(y){B.push({x:x,y:y,open:false,bug:false})})});
    var nOpen=0,look=null,seen=false,done=false,TD={x:100,y:104};
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EEE8DC"><rect x="-400" y="172" width="1200" height="60" fill="#C8BCA4"/>'+
      '<rect x="30" y="168" width="260" height="8" fill="#A8804E"/><g id="bx"></g><g id="ov"></g><g id="ct"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),bx=svg.querySelector('#bx'),ov=svg.querySelector('#ov'),ct=svg.querySelector('#ct');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){bx.innerHTML=B.map(function(b){var h='<rect x="'+(b.x-28)+'" y="'+(b.y-21)+'" width="56" height="42" rx="3" fill="'+(b.open?'#F4E8CC':'#D8B888')+'" stroke="#A8804E" stroke-width="1.6"/>';
        if(b.open)h+=sfruit(b.x-6,b.y-4,.36)+sfruit(b.x+8,b.y+6,.36,YEL,15)+'<text x="'+b.x+'" y="'+(b.y+18)+'" font-size="11" font-weight="700" fill="'+(b.bug?'#DB2E27':'#3F6B2E')+'" text-anchor="middle">'+(b.bug?'有小蟲':b.ok?'沒問題':'')+'</text>';
        else h+='<path d="M'+(b.x-28)+' '+(b.y-8)+'H'+(b.x+28)+'" stroke="#B8945E" stroke-width="1.2"/><text x="'+b.x+'" y="'+(b.y+10)+'" font-size="12" font-weight="700" fill="#6A4A2E" text-anchor="middle">楊桃</text>';
        return h}).join('');
      if(look){var b=look;ov.innerHTML='<rect x="-400" y="-100" width="1200" height="400" fill="#FFF8EC" opacity=".94"/>'+sfruit(180,104,2.3)+
          (seen?'<circle cx="'+TD.x+'" cy="'+TD.y+'" r="26" fill="#fff" stroke="#5A4E48" stroke-width="3"/><path d="M'+(TD.x-14)+' '+TD.y+'H'+(TD.x+10)+'" stroke="#7A5A30" stroke-width="5" stroke-linecap="round"/>'+
            (b.bug?'<path d="M'+(TD.x-4)+' '+(TD.y+8)+'q4 -6 8 0q4 6 8 0" stroke="#C83A2E" stroke-width="3.2" fill="none" stroke-linecap="round"/>':'')+'<path d="M'+(TD.x+18)+' '+(TD.y+18)+'L'+(TD.x+32)+' '+(TD.y+32)+'" stroke="#5A4E48" stroke-width="5" stroke-linecap="round"/>'
          :'<circle cx="'+TD.x+'" cy="'+TD.y+'" r="22" fill="none" stroke="#DB2E27" stroke-width="2.4" stroke-dasharray="4 3"/><text x="'+TD.x+'" y="'+(TD.y+40)+'" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle">蒂頭</text>')+
          '<text x="160" y="28" font-size="15" font-weight="700" fill="#2A2020" text-anchor="middle">第 '+nOpen+' 箱的楊桃</text>'}
      else ov.innerHTML='';
      ct.innerHTML=look?'':'<rect x="110" y="2" width="100" height="22" rx="11" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.2"/><text x="160" y="18" font-size="13" font-weight="700" fill="#2A2020" text-anchor="middle">抽查 '+nOpen+'／3 箱</text>';
      bar.style.width=(done?100:(nOpen-(look&&!seen?1:0))/3*90)+'%'}
    draw();
    function openBox(b){nOpen++;b.open=true;b.bug=nOpen===2;look=b;seen=false;draw();say(msg,'打開了！點楊桃左邊的<b>蒂頭</b>（紅色虛線圈圈），看看有沒有小蟲。')}
    function inspect(){var b=look;seen=true;b.ok=!b.bug;draw();
      if(b.bug)say(msg,'蒂頭有一隻<b>小蟲</b>！這一批要整批送去<b>燻蒸</b>。');else say(msg,'蒂頭乾乾淨淨，沒有小蟲。');
      wait(function(){look=null;draw();
        if(nOpen>=3){done=true;draw();lvDone(area,i,l,msg,'抽了 3 箱，第 2 箱的蒂頭有一隻小蟲：這一批要整批送去燻蒸。');return}
        say(msg,nOpen===1?'再挑<b>一箱</b>點開。':'找到小蟲了，再抽最後<b>一箱</b>看看。')},reduce?300:1600)}
    drag(svg,function(t,p){if(done||t!=='down')return;
      if(look){if(seen)return;if(dist(p,TD)<30)inspect();else say(msg,'點楊桃<b>左邊</b>的蒂頭（連著果柄的那一頭）。',1);return}
      var k=null,best=30;B.forEach(function(b){var d=dist(p,b);if(d<best){best=d;k=b}});if(!k)return;
      if(k.open){say(msg,'這一箱看過了，挑<b>別的箱子</b>。',1);return}openBox(k)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','一批 12 箱楊桃，按 Enter 抽查一箱');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();if(look){if(!seen)inspect();return}openBox(B.filter(function(b){return !b.open})[0])}});
    later(function(){if(!done&&!nOpen)say(msg,'點<b>任何一箱</b>，打開來抽查。')},7000);
  }
};
</script>
