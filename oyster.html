<h1>蚵棚任務・養殖漁業・七股潟湖</h1>
<p>跟著船長開船進臺灣最大的<b>潟湖</b>：在淺灘插竿子讓船繞過去、當一條愛吃蚵的<b>黑格</b>找出黑網的破洞、看蚵自己把海水濾乾淨，最後把蚵殼串起來吊上<b>蚵棚</b>。</p>
<p>地點：七股潟湖（臺南市七股區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>臺南七股的海邊，有一大片被沙洲和陸地圍起來的海水，叫做潟湖。台江國家公園說，七股潟湖是臺灣最大的潟湖。很久以前，這裡是一大片叫台江內海的海。潟湖裡有一格一格養蚵的蚵棚。跟著船長開船進潟湖，看看蚵仔怎麼養。每過一關，就能蓋一個章。</p><h2>關卡</h2><ol>
<li><h3>第 1 關・七股溪：插竿子，船才不會卡住</h3><p>導覽說，七股溪的泥巴有深有淺，水底下藏著淺灘（水很淺的地方）。船開到那裡，會擱淺（卡在泥巴上動不了）。所以漁家會在河道上插竿：插上長長的塑膠竿，標出淺灘在哪裡。</p><p>為什麼？為什麼潟湖裡的浪比較小？ 台江國家公園說，潟湖外面有長長的沙洲，把外海的大浪擋住了，所以裡面比較平靜。沙洲中間留著潮口，海水還是會跟著漲潮、退潮進進出出。</p></li>
<li><h3>第 2 關・蚵棚外面：黑格想進來吃蚵</h3><p>導覽說，蚵棚外面插著一圈黑網，把整片蚵棚圍起來。因為有一種魚叫黑格，牙齒很利，最愛吃蚵。網要是破了一個洞呢？這一關，你來當一條黑格，繞著網找找看。</p><p>為什麼？為什麼蚵棚外面要圍網？ 導覽說，黑格又叫黑鯛，牙齒很利，愛吃蚵。用黑網把蚵棚圍成一圈，黑格就游不進來，蚵才不會被吃掉。</p></li>
<li><h3>第 3 關・潟湖裡的蚵架：蚵仔不用餵</h3><p>導覽說，七股的蚵架（吊蚵的架子）照海水的深淺，有三種：浮棚仔、站棚仔、倒棚仔。不管哪一種，一串一串的蚵都吊在水裡。蚵農不用餵飼料。因為蚵會濾食：把海水裡小小的藻類濾下來吃。</p><p>為什麼？為什麼養蚵不用餵飼料？ 牡蠣就是蚵。牠會濾食，靠海水裡的藻類和很小很小的東西長大，所以蚵農不用花錢買飼料。</p></li>
<li><h3>第 4 關・碼頭邊：把蚵殼串起來</h3><p>報導說，蚵農會把蚵殼用繩子串起來，再吊到蚵架上，海裡剛出生的小蚵（叫蚵苗）就會黏到殼上，慢慢長大。蚵長到一半，有時候還會搬家，送到別的地方再養。收成以後，要洗蚵、剖蚵（把殼剖開，拿出裡面的蚵）。剖蚵的人要長時間彎著腰、坐在矮矮的凳子上，很辛苦。</p><p>為什麼？為什麼要把蚵殼串起來？ 報導說，把串好的蚵殼吊在架子上，海裡剛出生的小蚵（蚵苗）就會黏在殼上。一串蚵殼，就是一串小蚵的家，牠們在上面慢慢長大。</p></li>
</ol>

function oyster(x,y,s,open){var o=open||0,g='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s||1)+')">';
  g+='<path d="M-9 1Q-10 9 0 10Q10 9 9 1Z" fill="'+SHELL+'" stroke="'+SHELL2+'" stroke-width="1.2"/>';

function blackfish(x,y,s,dir){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1((dir||1)*(s||1))+' '+f1(s||1)+')"><path d="M-20 0L-30 -9L-27 0L-30 9Z" fill="#4A4C50"/><path d="M-22 0Q-6 -15 14 -8Q22 -4 24 0Q22 5 14 8Q-6 14 -22 0Z" fill="#5A5E64" stroke="#2E3034" stroke-width="1.2"/><path d="M-8 -11L0 -18L8 -10Z" fill="#4A4C50"/><circle cx="14" cy="-3" r="2.6" fill="#fff"/><circle cx="14.6" cy="-3" r="1.4" fill="#111"/><path d="M19 3L21 5L23 3" stroke="#fff" stroke-width="1" fill="none"/></g>'}

function boatTop(x,y,s,rot){return '<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+f1(rot||0)+') scale('+f1(s||1)+')"><path d="M-22 0Q-14 -9 10 -9H20V9H10Q-14 9 -22 0Z" fill="#F4F0E6" stroke="#6C2024" stroke-width="1.8"/><rect x="0" y="-6" width="12" height="12" rx="2" fill="#DB2E27"/><path d="M-12 0H-2" stroke="#BD9558" stroke-width="1.6"/></g>'}

      rk.innerHTML=rackFloat(55,40,170,open)+rackStand(160,40,170,open)+rackFlat(265,40,170,open);
      var h='';D.forEach(function(d){if(d.on)h+='<circle cx="'+f1(d.x)+'" cy="'+f1(d.y)+'" r="3.4" fill="#4E8A2E" stroke="#3A6A20" stroke-width=".8"/>'});
      if(puff>0)O.forEach(function(o,j){if(j%3===0)h+='<path d="M'+f1(o.x+8)+' '+f1(o.y)+'h'+f1(10*puff)+'" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="'+f1(puff)+'"/>'});
      dg.innerHTML=h;
      // 這一口裝了多少
      h='<rect x="252" y="'+(46)+'" width="56" height="12" rx="6" fill="#fff" stroke="#8A7A70"/><rect x="252" y="46" width="'+f1(56*eat/CAP)+'" height="12" rx="6" fill="'+(full?'#DB2E27':'#4E8A2E')+'"/><text x="280" y="74" font-size="13" font-weight="700" fill="#2A2020" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">'+(full?'滿了，放開':hold?'濾一口':'按住張開')+'</text>';
      mg.innerHTML=h;
      var wc=mix('#B8D8A0','#BFE0EC',Math.min(1,eaten/WIN));wt.setAttribute('fill',wc);svg.style.background=wc;
      bar.style.width=(done?100:Math.min(1,eaten/WIN)*90)+'%'}
    draw();
    anim(function(dt){var t=performance.now()/1000;
      open+=((hold&&!done?1:0)-open)*Math.min(1,dt*10);puff=Math.max(0,puff-dt*1.5);
      D.forEach(function(d){if(!d.on)return;var best=null,bd=42;
        if(hold&&!full&&open>.5)O.forEach(function(o){var q=dist(d,o);if(q<bd){bd=q;best=o}});
        if(best){var v=70*dt/Math.max(bd,1);d.x+=(best.x-d.x)*Math.min(1,v);d.y+=(best.y-d.y)*Math.min(1,v);
          if(dist(d,best)<6){d.on=false;eat++;eaten++;if(eat>=CAP&&!full){full=true;say(msg,'這一口裝滿了！<b>放開</b>，蚵把殼合起來，吐出乾淨的海水。')}}}
        else{d.x+=dt*22;d.y+=Math.sin(t*1.3+d.ph)*dt*6;if(d.x>314)d.x=6;d.y=clamp(d.y,48,166)}});
      if(!done&&eaten>=WIN&&!hold){done=true;D.forEach(function(d){d.on=false});draw();lvDone(area,i,l,msg,'海水濾乾淨了！');return false}
      draw()});
    function release(){if(!hold)return;hold=false;if(eat>0){gulps++;puff=1;
        if(eaten>=WIN)say(msg,'最後一口吐出來了，海水變清了！');
        else say(msg,'吐出乾淨的海水了（第 '+gulps+' 口）。綠色小點還有 '+D.filter(function(d){return d.on}).length+' 個，再<b>按住</b>濾一口。')}
      else say(msg,'殼張開的時間太短，還沒濾到東西。按住久一點，等綠色小點被吸過來。',1);
      eat=0;full=false}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){hold=true;if(!full)say(msg,'蚵張開殼了，綠色小點被吸過來……');return}
      if(t==='up')release()});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','三種蚵架上的蚵，按 Enter 張開殼，再按一次合起來');
    svg.addEventListener('keydown',function(e){if(done)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();if(hold)release();else hold=true}});
    later(function(){if(!gulps&&!hold)say(msg,'用手指<b>按住</b>畫面不要放，蚵就會張開殼。')},8000);
  },

  /* 第 4 關：把蚵殼一個一個拖到繩子上串起來（6 個），再按住繩子上面的圈圈，把整串拖到蚵架的掛鉤吊好 */
  string:function(area,i,l){
    var RX=60,TOP=22,HOOK={x:246,y:50},SH=[[110,136],[142,132],[166,150],[110,166],[140,160],[162,178]].map(function(q){return {x:q[0],y:q[1],hx:q[0],hy:q[1]}});
    var on=0,hold=null,phase=1,H={x:RX,y:TOP},hung=false,done=false,spat=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EEF6F8"><rect x="-400" y="80" width="1200" height="200" fill="'+WATER+'"/>'+wave(200,96,30,'#fff')+wave(256,130,30,'#fff')+
      '<rect x="-400" y="118" width="576" height="200" fill="#C8B898"/><path d="M-400 118H176V300" stroke="#8A7A62" stroke-width="2" fill="none"/>'+[136,156,176].map(function(y){return '<path d="M-400 '+y+'H176" stroke="#A89878" stroke-width="1"/>'}).join('')+
      '<path d="M196 190V44M296 190V44" stroke="'+BAMBOO2+'" stroke-width="5"/><path d="M188 46H304" stroke="'+BAMBOO+'" stroke-width="7" stroke-linecap="round"/>'+
      '<path d="M'+HOOK.x+' 46v8q0 6 -6 6" stroke="#5A4E48" stroke-width="2.4" fill="none"/>'+
      '<text x="246" y="30" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle">蚵架</text><text x="70" y="186" font-size="14" font-weight="700" fill="#5A4A3A" text-anchor="middle">碼頭邊（示意）</text>'+
      '<path d="M30 18H76M36 18V118" stroke="#8A6A4A" stroke-width="4"/>'+
      '<g id="rg"></g><g id="cg"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),rg=svg.querySelector('#rg'),cg=svg.querySelector('#cg');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function shell(x,y,lit){return '<g transform="translate('+f1(x)+' '+f1(y)+')"><ellipse rx="12" ry="8" fill="'+SHELL+'" stroke="'+(lit?'#DB2E27':SHELL2)+'" stroke-width="'+(lit?2.2:1.4)+'"/><path d="M-7 -2Q0 -6 7 -2M-8 2Q0 -2 8 2" stroke="'+SHELL2+'" stroke-width=".8" fill="none"/><circle r="1.6" fill="#5A4E48"/></g>'}
    function draw(){var h='',ox=H.x-RX,oy=H.y-TOP;
      // 繩子和串好的殼
      h+='<path d="M'+f1(H.x)+' '+f1(H.y+6)+'V'+f1(H.y+140)+'" stroke="#6A5A48" stroke-width="2"/><circle cx="'+f1(H.x)+'" cy="'+f1(H.y)+'" r="6" fill="none" stroke="#6A5A48" stroke-width="2.4"/><circle cx="'+f1(H.x)+'" cy="'+f1(H.y+142)+'" r="3" fill="#6A5A48"/>';
      for(var n=0;n<on;n++){var y=H.y+128-n*20;h+=shell(H.x,y);
        if(spat)for(var m=0;m<3;m++)h+='<circle cx="'+f1(H.x-6+m*6)+'" cy="'+f1(y-1+(m%2)*2)+'" r="'+f1(2.4*spat)+'" fill="#5A4A38" stroke="#fff" stroke-width=".8"/>'}
      if(phase===1&&!hold)h+='<rect x="'+(RX-26)+'" y="'+(TOP+10)+'" width="52" height="'+(128-on*20)+'" rx="10" fill="none" stroke="#DB2E27" stroke-width="1.6" stroke-dasharray="4 3" opacity=".7"/>';
      if(phase===2&&!hung&&!hold)h+='<circle cx="'+f1(H.x)+'" cy="'+f1(H.y)+'" r="18" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>';
      if(phase===2&&!hung)h+='<circle cx="'+HOOK.x+'" cy="'+(HOOK.y+6)+'" r="16" fill="none" stroke="#BD9558" stroke-width="2" stroke-dasharray="4 3"/>';
      rg.innerHTML=h;h='';
      SH.forEach(function(c){if(!c.used&&c!==hold)h+=shell(c.x,c.y)});if(phase===1&&hold&&hold.hx!==undefined)h+=shell(hold.x,hold.y,1);
      cg.innerHTML=h;bar.style.width=(done?100:(on+(hung?2:0))/8*90)+'%'}
    draw();
    function thread(c){c.used=true;on++;
      if(on<6)say(msg,'串上去了！殼順著繩子滑下去（'+on+' 個）。');
      else{phase=2;say(msg,'6 個蚵殼都串好了！按住繩子上面的<b>圈圈</b>，把整串拖到右邊<b>蚵架</b>的掛鉤上。')}}
    function hang(){hung=true;H.x=HOOK.x;H.y=HOOK.y;hold=null;draw();say(msg,'吊好了！蚵殼串泡在海水裡。過一陣子……（示意）');
      anim(function(dt){spat=Math.min(1,spat+dt*.8);draw();if(spat>=1){done=true;draw();wait(function(){lvDone(area,i,l,msg,'小小的蚵苗黏到殼上了！')},500);return false}})}
    drag(svg,function(t,p){if(done||hung)return;
      if(t==='down'){
        if(phase===1){var b=null,bd=24;SH.forEach(function(c){if(c.used)return;var d=dist(p,c);if(d<bd){bd=d;b=c}});
          if(!b){say(msg,'按住下面碼頭上的<b>蚵殼</b>，拖到左邊的繩子上。',1);return}hold=b;b.x=p.x;b.y=p.y-20;draw();return}
        if(dist(p,H)<28){hold=H;draw();return}
        say(msg,'按住繩子上面的<b>圈圈</b>（紅色虛線），拖到蚵架的掛鉤。',1);return}
      if(t==='move'&&hold){if(phase===1){hold.x=clamp(p.x,10,310);hold.y=clamp(p.y-20,10,180)}else{H.x=clamp(p.x,20,300);H.y=clamp(p.y-20,10,60)}draw();return}
      if(t==='up'&&hold){var c=hold;hold=null;
        if(phase===1){if(Math.abs(c.x-RX)<30&&c.y>TOP&&c.y<TOP+150){thread(c);draw();return}
          c.x=c.hx;c.y=c.hy;draw();say(msg,'要拖到左邊的<b>繩子</b>上（紅色虛線框）才串得上去。',1);return}
        if(dist(H,HOOK)<30){hang();return}
        H.x=RX;H.y=TOP;draw();say(msg,'要掛到右邊<b>蚵架</b>上的掛鉤（金色虛線圈圈）。',1)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','蚵殼和繩子，按 Enter 串一個蚵殼，串好 6 個再按 Enter 吊到蚵架');
    svg.addEventListener('keydown',function(e){if(done||hung)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();
      if(phase===1){var c=SH.filter(function(q){return !q.used})[0];if(c)thread(c);draw()}else hang()}});
    later(function(){if(!on)say(msg,'按住一個<b>蚵殼</b>，拖到左邊的繩子上放開。')},8000);
  }
};
</script>
