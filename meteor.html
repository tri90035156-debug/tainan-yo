<h1>流星雨任務・天文・南瀛天文館</h1>
<p>跟著天文館的解說員哥哥，晚上到大內的<b>南瀛天文館</b>看<b>雙子座流星雨</b>：關燈看星星變多、把太空碎屑丟進大氣層變成流星、拖著地球穿過<b>法厄同</b>留下的碎屑帶、往回畫出<b>輻射點</b>、躺在草地上等眼睛習慣黑暗，最後整理背包走進天文館。</p>
<p>地點：南瀛天文館（臺南市大內區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>南瀛天文館在大內，是看星星、學天文的地方。每年 12 月中，天上會有一場流星雨，一個晚上可以看到很多流星。跟著天文館的解說員哥哥，晚上到外面找流星。每過一關，就能蓋一個章。</p><h2>關卡</h2><ol>
<li><h3>第 1 關・天文館外面的小路：關燈，星星就出來了</h3><p>晚上，解說員哥哥帶你走到天文館外面。路燈和窗戶都亮著，抬頭只看得到幾顆星星。哥哥說：「燈太亮了，暗暗的星星就被蓋過去。」不該出現的燈光太多，讓星星看不清楚，叫做光害。</p><p>為什麼？為什麼城市裡看不到那麼多星星？ 城市的燈很多、很亮，連天空都被照亮，暗暗的星星就看不見了。報導說，有一位天文學家在美國洛杉磯的市中心，晚上只看到大約 12 顆星星。</p></li>
<li><h3>第 2 關・夜空：流星是星星嗎</h3><p>一道光咻一下劃過天空。哥哥說：「那不是星星掉下來喔。」流星其實是太空裡的小碎屑，衝進大氣層（包在地球外面的一層空氣）燒起來，發出的一道光。很少很少比較大的碎片沒有燒完，掉到地上，叫做隕石。</p><p>為什麼？流星為什麼會發光？ 太空裡的碎屑衝進大氣層，燒了起來，就發出光。它們跑得非常快：NASA 說，雙子座流星雨的流星，大約每秒跑 35 公里。</p></li>
<li><h3>第 3 關・太空：為什麼每年 12 月都有</h3><p>哥哥說：「雙子座流星雨，每年 12 月中都會來。」為什麼這麼準時？太空裡有一顆小行星，叫法厄同。它繞著太陽跑，路上留下一長條小碎屑，這些碎屑叫流星體。地球繞著太陽走，叫做公轉；地球每年都會穿過這一條碎屑帶。</p><p>為什麼？法厄同是彗星嗎？ 大部分的流星雨，碎屑是彗星留下的。雙子座流星雨很特別，是小行星法厄同留下的。NASA 說，科學家還不確定法厄同該算哪一種，有一說它可能是死掉的彗星。</p></li>
<li><h3>第 4 關・夜空：流星從哪裡射出來</h3><p>流星東一顆、西一顆。哥哥說：「把它們往回畫，會碰到同一個地方。」流星看起來，像是從天空的同一個點射出來，那個點叫輻射點。雙子座流星雨的輻射點在雙子座，所以叫這個名字。</p><p>為什麼？為什麼流星好像都從同一個地方來？ 碎屑其實是朝著同一個方向、一條一條平平的跑。從地球看過去，就像從同一個點散開。可是流星會出現在整片天空，看流星不用一直盯著雙子座。</p></li>
<li><h3>第 5 關・草地：讓眼睛習慣黑暗</h3><p>哥哥帶你到草地上，鋪好毯子躺下來。剛關燈的時候，天空黑黑的，星星好少。眼睛要在黑暗裡等二、三十分鐘，才會慢慢看得到比較暗的星星和流星。看流星不用望遠鏡，躺著看一大片天空最好。</p><p>為什麼？為什麼看流星時，不要一直看手機？ 亮亮的光一照，眼睛又要重新習慣黑暗。有一說，手機螢幕、白色手電筒、車燈都要避開，紅色的光比較不會影響眼睛。</p></li>
<li><h3>第 6 關・南瀛天文館：整理背包，走進天文館</h3><p>下次看流星雨前，先整理背包。NASA 說，12 月的晚上很冷，要穿暖，帶毯子或躺椅。南瀛天文館裡有三個館：天文觀測館、天文展示館、星象館。觀測館裡有一台口徑（鏡子有多寬）76 公分的大望遠鏡。</p><p>為什麼？天文館的大望遠鏡，是用來看流星的嗎？ 不是。望遠鏡一次只看得到一小片天空，流星卻會出現在整片天空，所以看流星用眼睛最好。</p></li>
</ol>

<script>

/* ---------- 插畫元件 ---------- */
var K='#2A2020',NS='http://www.w3.org/2000/svg';
var SKY='#1E2846',SKY2='#2C3A62',HILL='#2E4636',HILL2='#3A5A44',GRASS='#34503C',STARC='#FFF4C8',GLOW='#FFC85A',DOMEC='#E4E0D6',WALL='#C8C0B0',ROAD='#4A4A52';
function f1(v){return (Math.round(v*10)/10).toString()}
// 一顆星星（小小的四角星或圓點）
function star(x,y,r,o){return '<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+f1(r)+'" fill="'+STARC+'" opacity="'+f1(o===undefined?1:o)+'"/>'}
// 一片星空：n 顆，每顆有一個 t（0～1，越小越亮、越早看得到）
function starField(n,seed,x0,y0,w,h){var a=[],s=seed||1;function rnd(){s=(s*9301+49297)%233280;return s/233280}
  for(var k=0;k<n;k++){var t=rnd();a.push({x:x0+rnd()*w,y:y0+rnd()*h,r:t<.15?2.2:(t<.4?1.6:1.1),t:t})}return a}
// 流星：從 (x,y) 往 ang 方向劃一道光，長 len
function meteorStreak(x,y,ang,len,w){var dx=Math.cos(ang)*len,dy=Math.sin(ang)*len;
  return '<path d="M'+f1(x)+' '+f1(y)+'L'+f1(x+dx)+' '+f1(y+dy)+'" stroke="'+STARC+'" stroke-width="'+(w||2.4)+'" stroke-linecap="round" opacity=".9"/><circle cx="'+f1(x+dx)+'" cy="'+f1(y+dy)+'" r="'+f1((w||2.4)*.9)+'" fill="#fff"/>'}
// 路燈：x,y 是燈頭，地面在 gy
function streetLamp(x,y,gy,on){return '<path d="M'+x+' '+gy+'V'+(y+2)+'" stroke="#6A6A76" stroke-width="3"/>'+(on?'<circle cx="'+x+'" cy="'+y+'" r="16" fill="'+GLOW+'" opacity=".35"/>':'')+
  '<path d="M'+(x-8)+' '+(y-2)+'H'+(x+8)+'L'+(x+5)+' '+(y+4)+'H'+(x-5)+'Z" fill="'+(on?'#FFE27A':'#5A5A66')+'" stroke="#3A3A44" stroke-width="1"/>'}
// 天文館的圓頂房子：x 是中間，y 是地面，s 大小
function domeHouse(x,y,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s||1)+')"><rect x="-26" y="-30" width="52" height="30" fill="'+WALL+'" stroke="#8A8070" stroke-width="1.4"/><path d="M-24 -30A24 24 0 0 1 24 -30Z" fill="'+DOMEC+'" stroke="#8A8070" stroke-width="1.4"/><path d="M-3 -53V-30" stroke="#6A6458" stroke-width="3"/><rect x="-6" y="-18" width="12" height="18" fill="#5A5048"/></g>'}
// 躺著的人（從旁邊看）：x,y 是頭
function lying(x,y,c){return '<g transform="translate('+f1(x)+' '+f1(y)+')"><rect x="-6" y="2" width="70" height="8" rx="3" fill="#8A6A9A"/><path d="M6 0Q30 -8 46 0Q30 6 6 4Z" fill="'+(c||'#C8584A')+'"/><path d="M44 1H66" stroke="#4A4E68" stroke-width="5" stroke-linecap="round"/><circle cx="0" cy="0" r="7" fill="#E8B890"/><path d="M-7 -1Q-6 -8 1 -7" stroke="#3A2E28" stroke-width="3" fill="none"/></g>'}
// 站著的人
function person(x,y,s,c){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s)+')"><path d="M-4 0V-14M4 0V-14" stroke="#4A4E68" stroke-width="4" stroke-linecap="round"/><path d="M-9 -13Q-10 -30 0 -32Q10 -30 9 -13Z" fill="'+c+'"/><circle cy="-39" r="7.5" fill="#E8B890"/><path d="M-7 -41Q-6 -48 0 -47.5Q6 -48 7 -41" fill="#3A2E28"/></g>'}
var ICON={
  lamp:'<path d="M0 10V-4" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M-7 -6H7L4 -1H-4Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M-10 -9L-7 -6M10 -9L7 -6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M-6 10H6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>',
  meteor:'<path d="M-10 -10L4 4" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M-10 -3L0 7" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".7"/><circle cx="6" cy="6" r="3.4" fill="none" stroke="#fff" stroke-width="2"/>',
  orbit:'<ellipse rx="11" ry="6" fill="none" stroke="#fff" stroke-width="1.8"/><circle r="3" fill="#fff"/><circle cx="10" cy="-3" r="2.4" fill="none" stroke="#fff" stroke-width="1.8"/>',
  radiant:'<path d="M0 0L-10 6M0 0L10 6M0 0L-6 -10M0 0L7 -9" stroke="#fff" stroke-width="1.6" stroke-dasharray="2 2"/><circle r="2.6" fill="#fff"/>',
  eye:'<path d="M-11 0Q0 -10 11 0Q0 10 -11 0Z" fill="none" stroke="#fff" stroke-width="2"/><circle r="3.4" fill="#fff"/><path d="M-6 -10L-5 -7M0 -11V-8M6 -10L5 -7" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>',
  dome:'<path d="M-10 9V0H10V9Z" fill="none" stroke="#fff" stroke-width="2"/><path d="M-9 0A9 9 0 0 1 9 0" fill="none" stroke="#fff" stroke-width="2"/><path d="M-1 -9V-4" stroke="#fff" stroke-width="2" stroke-linecap="round"/>'
};
function icon(k){return '<svg viewBox="-12 -12 24 24" aria-hidden="true">'+ICON[k]+'</svg>'}

// 開場的大卡：夜裡的天文館（深色底，字是亮的）
function nightCard(t1,t2,art,C){
  var s='<svg class="mini" viewBox="0 0 320 190" style="background:'+SKY+'" role="img" aria-label="'+t1+'的樣子"><rect x="-400" y="160" width="1200" height="60" fill="'+HILL+'"/>'+art;
  C.forEach(function(c){s+='<path d="M'+c[3]+' '+c[4]+'L'+c[1]+' '+(c[2]-5)+'" stroke="#C8C0B0" stroke-width="1.2"/><circle cx="'+c[3]+'" cy="'+c[4]+'" r="2.6" fill="#DB2E27"/>'+
    '<text x="'+c[1]+'" y="'+c[2]+'" font-size="15" font-weight="700" fill="#FFF4C8" text-anchor="middle" stroke="'+SKY+'" stroke-width="4" paint-order="stroke">'+c[0]+'</text>'});
  return s+'<text x="160" y="32" font-size="22" font-weight="900" fill="#FFF8EC" text-anchor="middle" font-family="Noto Serif TC,Songti TC,serif" stroke="'+SKY+'" stroke-width="4" paint-order="stroke">'+t1+'</text>'+(t2?'<text x="160" y="182" font-size="14" font-weight="700" fill="#F3E8D6" text-anchor="middle">'+t2+'</text>':'')+'</svg>';
}
// 一關做完：說過關的話，有題目就出題，再蓋章
function lvDone(area,i,l,msg,t){say(msg,t);later(function(){say(msg,l.win);if(l.q)quiz(area,l,function(){finish(i)});else finish(i)},900)}
// 遊戲圖裡的字：亮字、深色描邊（夜空上看得清楚）
function TX(t,x,y,sz,c,w){return '<text x="'+x+'" y="'+y+'" font-size="'+(sz||15)+'" font-weight="'+(w||700)+'" fill="'+(c||'#FFF4C8')+'" text-anchor="middle" stroke="'+SKY+'" stroke-width="4" paint-order="stroke">'+t+'</text>'}

/* ---------- 地圖 ---------- */

function decorate(){
  // 關掉燈（now）：滿天星星；亮著燈（past）：路燈亮，天邊被照亮，星星只剩幾顆
  var q='',p='<ellipse cx="300" cy="420" rx="520" ry="200" fill="'+GLOW+'" opacity=".16"/>';
  MSTARS.forEach(function(s){q+=star(s.x,s.y,s.r*1.3,1-s.t*.5);if(s.t<.12)p+=star(s.x,s.y,s.r*1.3,.8)});

  p+='<rect x="388" y="326" width="10" height="10" fill="#FFE27A"/>';
  map.querySelector('#deco').innerHTML='<g id="past">'+p+'<text x="400" y="40" font-size="15" fill="#FFF4C8" text-anchor="middle" stroke="'+SKY+'" stroke-width="4" paint-order="stroke">亮著燈：天上只看得到幾顆星星（示意）</text></g><g id="now">'+q+'<text x="400" y="40" font-size="15" fill="#FFF4C8" text-anchor="middle" stroke="'+SKY+'" stroke-width="4" paint-order="stroke">關掉燈：星星變多了（示意）</text></g>';
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
// 一直跑的動畫（換關時會自動停）
function anim(fn){var raf=0,last=0,on=true;function step(now){if(!on)return;var dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(fn(dt)===false){on=false;return}raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step);loops.push(function(){on=false;cancelAnimationFrame(raf)});return function(){on=false;cancelAnimationFrame(raf)}}
// 一定要等的時間（later() 在「減少動態效果」時會變成 0）
function wait(fn,ms){var t=setTimeout(fn,ms);loops.push(function(){clearTimeout(t)})}
// 點到線段的距離
function segD(p,a,b){var dx=b.x-a.x,dy=b.y-a.y,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy),0,1);return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}

          else h+='<path d="M'+(d.x-12)+' '+(d.y-12)+'L'+(d.x+12)+' '+(d.y+12)+'M'+(d.x+12)+' '+(d.y-12)+'L'+(d.x-12)+' '+(d.y+12)+'" stroke="#DB2E27" stroke-width="2.4" opacity=".8"/>'})}
      else{h+='<rect x="34" y="96" width="76" height="72" fill="'+WALL+'" stroke="#8A8070" stroke-width="1.4"/><path d="M38 96A34 34 0 0 1 106 96Z" fill="'+DOMEC+'" stroke="#8A8070" stroke-width="1.4"/><path d="M68 62V70" stroke="#5A5048" stroke-width="5"/>'+
          '<rect x="124" y="100" width="72" height="68" fill="#B8B0A0" stroke="#8A8070" stroke-width="1.4"/><path d="M124 100L160 82L196 100Z" fill="#8A8070"/><rect x="138" y="116" width="44" height="12" fill="#6A7A9A"/>'+
          '<rect x="212" y="104" width="72" height="64" fill="'+WALL+'" stroke="#8A8070" stroke-width="1.4"/><ellipse cx="248" cy="104" rx="36" ry="14" fill="#D8D0C0" stroke="#8A8070" stroke-width="1.4"/>'+star(236,124,2.4)+star(252,134,2)+star(264,120,2.4);
        H.forEach(function(b,j){h+=TX(b.n,b.x,186,14,seen[j]?'#FFE27A':'#FFF4C8');
          if(!done&&!seen[j])h+='<circle cx="'+b.x+'" cy="128" r="26" fill="none" stroke="'+(sel===j?'#DB2E27':'#fff')+'" stroke-width="'+(sel===j?2.2:1.2)+'" stroke-dasharray="3 3"/>';
          else if(seen[j])h+='<circle cx="'+b.x+'" cy="128" r="10" fill="#3F6B2E"/><path d="M'+(b.x-5)+' 128L'+(b.x-1)+' 132L'+(b.x+6)+' 124" stroke="#fff" stroke-width="2.4" fill="none"/>'});
        h+=TX('南瀛天文館',160,40,17,'#FFE27A')}
      pg.innerHTML=h;var sn=Object.keys(seen).length;bar.style.width=(done?100:got*15+sn*15)+'%'}
    draw();
    function pickItem(j){var d=IT[j];if(d.in||d.no||got>=3)return;
      if(!d.ok){d.no=true;draw();say(msg,d.m,1);return}
      d.in=true;got++;draw();
      if(got>=3){say(msg,d.m+' 背包整理好了！走進天文館看看。');wait(function(){stage=1;sel=-1;draw();say(msg,'到天文館了。點一點三個館，看看裡面有什麼。')},1400);return}
      say(msg,d.m+' 還要再帶 '+(3-got)+' 樣。')}
    function pickHall(j){if(seen[j])return;seen[j]=1;draw();var n=Object.keys(seen).length;
      if(n>=3){done=true;draw();say(msg,H[j].m);wait(function(){lvDone(area,i,l,msg,H[j].m+'<br>三個館都看過了！')},1600);return}
      say(msg,H[j].m+'<br>還有 '+(3-n)+' 個館。')}
    drag(svg,function(t,p){if(t!=='down'||done)return;
      if(stage===0){var j=-1,bd=26;IT.forEach(function(d,m){if(d.in||d.no)return;var dd=dist(p,d);if(dd<bd){bd=dd;j=m}});
        if(j<0){say(msg,'點上面一樣要帶的<b>東西</b>（白色虛線圈圈）。',1);return}pickItem(j);return}
      var k=-1,bk=40;H.forEach(function(b,m){var dd=dist(p,{x:b.x,y:128});if(dd<bk&&!seen[m]){bk=dd;k=m}});
      if(k<0){say(msg,'點一個<b>館</b>（白色虛線圈圈）。',1);return}pickHall(k)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','要帶的東西和天文館的三個館，按左右鍵選，按 Enter 選定');
    svg.addEventListener('keydown',function(e){if(done)return;var arr=stage?H:IT,n=arr.length;
      if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();for(var k=0;k<n;k++){sel=(sel+(e.key==='ArrowLeft'?n-1:1)+n)%n;if(stage?!seen[sel]:!(IT[sel].in||IT[sel].no))break}draw()}
      else if((e.key==='Enter'||e.key===' ')&&sel>=0){e.preventDefault();if(stage)pickHall(sel);else pickItem(sel)}});
    later(function(){if(!done&&!got)say(msg,'看流星雨要躺在外面很久。想一想：要穿暖、要躺著、要小心燈光。')},9000);
  }
};
