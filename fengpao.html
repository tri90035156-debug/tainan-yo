<h1>蜂炮平安任務・節慶・鹽水蜂炮</h1>
<p>跟著住在<b>鹽水</b>的叔公：在<b>鹽水武廟</b>聽相傳的由來、幫叔公穿好<b>防護裝備</b>、拉捲尺量出安全距離、在紙上畫<b>蜂巢</b>設計圖、找有<b>檢查合格標誌</b>的炮城，再把炮屑掃乾淨。蜂炮很危險，小朋友不能靠近。</p>
<p>地點：鹽水（臺南市鹽水區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>每年元宵節，臺南鹽水會放蜂炮：成千上萬支沖天炮一起飛出去，咻咻咻，像一大群蜜蜂！蜂炮很危險。小朋友不能靠近，只能跟著大人，在很遠、很安全的地方看。跟著住在鹽水的叔公，聽蜂炮的故事，學會怎麼保護自己。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・鹽水武廟：相傳的故事</h3><p>相傳在 1885 年（清朝的時候）夏天，鹽水發生了大瘟疫，很多人生病。大家到鹽水武廟，請關聖帝君（關公）幫忙。傳說神明指示：元宵夜抬著神轎在街上遶境，大家沿路放鞭炮，一直放到天亮。後來，瘟疫就慢慢過去了。</p><p>為什麼？什麼是遶境？ 遶境就是請神明坐上神轎，大家抬著在街上走一圈，保佑經過的地方平安。</p></li>
<li><h3>第 2 關・叔公家：包得緊緊的</h3><p>今年，叔公要到街上看蜂炮。沖天炮會亂飛，打到皮膚、眼睛會受傷，所以大人一定要穿好防護裝備。你不去炮城旁邊，你幫叔公穿裝備就好。</p><p>為什麼？為什麼脖子要圍濕毛巾？ 沖天炮常常鑽到脖子那裡。圍上厚厚、濕濕的棉毛巾，可以保護脖子。</p></li>
<li><h3>第 3 關・街上的炮城：站遠一點</h3><p>街上推出一座一座炮城，裡面插滿了沖天炮。鹽水武廟提醒：就算是穿好裝備的大人，也要和炮城保持 5 到 10 公尺。那小朋友呢？要站得更遠！</p><p>為什麼？10 公尺有多遠？ 大約是教室從前面走到後面那麼遠。蜂炮會飛得很遠，所以小朋友要站得更遠。</p></li>
<li><h3>第 4 關・畫設計圖：像蜂巢一樣</h3><p>為什麼叫蜂炮？有資料說，1974 年鹽水武廟做了一座像城門的炮城，裡面的沖天炮排得整整齊齊，像蜂巢，就叫它「蜂炮城」。做炮城是大人的工作。你在紙上幫叔公畫設計圖就好。</p><p>為什麼？為什麼叫「蜂」炮？ 炮城裡一格一格像蜂巢；點了以後，一大群沖天炮咻咻咻飛出去，大家說就像一大群蜜蜂。</p></li>
<li><h3>第 5 關・鹽水國中操場：有沒有檢查過？</h3><p>元宵節晚上，鹽水國中操場會放好幾座又高又大的主炮城。每一座炮城都要先給消防局檢查，合格的會貼上檢查合格標誌。大人要選有貼標誌的炮城。</p><p>為什麼？為什麼炮城要檢查？ 炮城裡有好多火藥。消防局先檢查，確定放得安全、不會亂炸，才能放。</p></li>
<li><h3>第 6 關・隔天的街上：掃炮屑</h3><p>元宵節過後，街上滿地都是紅紅的炮屑。消防局提醒：炮屑可能還沒完全熄滅，掃進屋子裡可能會起火。看到冒煙的，不要碰，要請大人用水澆熄。</p><p>為什麼？看到沒有爆的炮，可以撿嗎？ 不可以！沒爆的炮可能突然炸開。看到了，要告訴大人，讓大人處理。</p></li>
</ol>

  /* 第 6 關：從外面往中間掃，把炮屑掃成一堆；冒煙的先點一下請叔公澆水 */
  sweep:function(area,i,l){
    var r=rnd(9),D=[],CX=160,CY=108,RR=30,pv=null,done=false,raf=0,water=null,last=performance.now(),T=0;
    for(var k=0;k<14;k++){var a=k/14*Math.PI*2+r()*.3,dd=62+r()*50;D.push({x:CX+Math.cos(a)*dd*1.5,y:CY+Math.sin(a)*dd*.6,rot:r()*180,smoke:k===3||k===10})}
    D.forEach(function(o){o.x=Math.max(24,Math.min(296,o.x));o.y=Math.max(42,Math.min(166,o.y))});
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#D8D0C0"><rect x="-400" y="176" width="1200" height="80" fill="#B8A890"/><path d="M-10 26H330" stroke="#B8A890" stroke-width="3"/><ellipse cx="'+CX+'" cy="'+CY+'" rx="'+(RR+6)+'" ry="'+(RR*.7+4)+'" fill="none" stroke="#BD9558" stroke-width="2" stroke-dasharray="5 4"/><g id="db"></g><g id="wt"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),db=svg.querySelector('#db'),wt=svg.querySelector('#wt');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function inPile(o){return Math.hypot((o.x-CX)/1,(o.y-CY)/.7)<RR+4}
    (function loop(now){var d=Math.min(50,now-last)/1000;last=now;T+=d;
      if(water){water.t+=d/1;if(water.t>=1){water.o.smoke=false;water=null;say(msg,'叔公澆熄了！現在可以掃了。')}}
      db.innerHTML=D.map(function(o){var h='<g transform="translate('+f1(o.x)+' '+f1(o.y)+') rotate('+f1(o.rot)+') scale(1.5)"><rect x="-6" y="-3" width="12" height="6" rx="1" fill="'+(o.smoke?'#9A3A2A':'#DB2E27')+'"/><path d="M-6 -1H6" stroke="#F3C8A0" stroke-width=".8"/></g>';
        if(o.smoke)h+='<path d="M'+f1(o.x)+' '+f1(o.y-6)+'q-4 -6 0 -12t0 -12" stroke="#9A9A9A" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="'+f1(.5+.3*Math.sin(T*5))+'"/>';return h}).join('');
      wt.innerHTML=water?'<g transform="translate('+f1(water.o.x+18)+' '+f1(water.o.y-30)+') rotate(-30)"><path d="M-10 -8H10L8 10H-8Z" fill="#8A9AA6" stroke="#5E676C"/></g><path d="M'+f1(water.o.x+10)+' '+f1(water.o.y-24)+'Q'+f1(water.o.x+2)+' '+f1(water.o.y-14)+' '+f1(water.o.x)+' '+f1(water.o.y-4)+'" stroke="#5E9AD8" stroke-width="3" fill="none"/>':'';
      var n=D.filter(inPile).length;bar.style.width=f1(n/D.length*100)+'%';
      if(!done&&n>=D.length){done=true;say(msg,'掃成一堆了！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},900)}
      raf=requestAnimationFrame(loop)})(last);
    loops.push(function(){cancelAnimationFrame(raf)});
    function douse(o){if(water)return;water={o:o,t:0};say(msg,'冒煙了！不能碰，請<b>叔公</b>用水澆熄⋯⋯')}
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){pv=p;var sm=null;D.forEach(function(o){if(o.smoke&&Math.hypot(p.x-o.x,p.y-o.y)<24)sm=o});if(sm){douse(sm);pv=null}return}
      if(!pv)return;
      if(t==='move'){var dx=p.x-pv.x,dy=p.y-pv.y;D.forEach(function(o){if(Math.hypot(p.x-o.x,p.y-o.y)<22){if(o.smoke){douse(o);return}o.x+=dx;o.y+=dy;o.x=Math.max(16,Math.min(304,o.x));o.y=Math.max(36,Math.min(170,o.y))}});pv=p;return}
      if(t==='up')pv=null;
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','掃炮屑的畫面，按 Enter 掃好');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();D.forEach(function(o,k){o.smoke=false;var a=k/D.length*6.28;o.x=CX+Math.cos(a)*12;o.y=CY+Math.sin(a)*8})}});
    later(function(){if(!done)say(msg,'手指放在一片炮屑<b>外面</b>，往中間的<b>虛線圈</b>拖過去，就像用掃把掃。冒煙的要先點一下。')},7000);
  }
};
