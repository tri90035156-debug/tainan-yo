<h1>沙地小窩任務・候鳥・小燕鷗</h1>
<p>夏天在<b>七股鹽田</b>當小小巡守員：拉彈弓讓<b>小燕鷗</b>從澳洲跳島飛回來、替蛋換上<b>保護色</b>、疊<b>空心磚</b>躲雨，再轉動<b>方舟</b>的 360 度鏡頭。</p>
<p>地點：七股鹽山（臺南市七股區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>每年四月，有一種小小的鳥，從南半球的澳洲飛來臺灣生寶寶。牠叫小燕鷗，是在臺灣看得到最小的鷗科鳥（燕鷗、海鷗這一家）。黑面琵鷺、黑腹燕鷗是冬天才來；小燕鷗剛好相反，是夏天才來的夏候鳥。在臺南，牠們會到七股不再曬鹽的鹽田生蛋。你的任務：跟著保育志工，從 4 月到 8 月陪小燕鷗一家過夏天。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・從澳洲飛來（4 月）：跳島飛回臺灣</h3><p>冬天的時候，小燕鷗在澳洲的海邊過冬。到了四月，牠們要往北飛好幾千公里，回到臺灣。一路上都是大海。小燕鷗會在印尼、菲律賓的島上停下來休息，再繼續飛。</p><p>為什麼？為什麼要停那麼多站？ 從澳洲到臺灣好幾千公里，一路都是海。研究人員替小燕鷗背上很輕的定位器，發現牠們會在菲律賓、印尼停下來休息，再繼續飛。</p></li>
<li><h3>第 2 關・七股魚塭：公鳥的禮物</h3><p>到了七股，公鳥要找一隻母鳥一起生寶寶。牠的方法是：送魚。小燕鷗抓魚很厲害：先在水面上快速拍翅膀，停在空中不動；看準了，再頭朝下衝進水裡。</p><p>為什麼？公鳥為什麼要送魚？ 這是小燕鷗的求偶：公鳥叼著魚送給母鳥，還會伸長脖子在她旁邊繞著走。等寶寶孵出來，公鳥也會一趟一趟抓小魚回來餵。小燕鷗吃的是河口和魚塭裡的魚，所以生蛋的地方附近一定要有水。</p></li>
<li><h3>第 3 關・頂山的鹽田沙地：藏起來的蛋</h3><p>以前這裡是七股鹽場，大家在一格一格的鹽田曬鹽。2002 年不曬鹽以後，留下平平的沙地，旁邊又有魚塭，小燕鷗就來這裡生蛋。小燕鷗不用樹枝做鳥巢。牠們在沙地上挖一個淺窩，蛋就直接生在裡面。</p><p>為什麼？蛋生在地上，不怕被踩破嗎？ 怕！小燕鷗的蛋有保護色，可以躲過別的動物，可是人也看不出來，很容易一腳踩破。所以每年 4 到 8 月，生蛋的地方會圍起來，請大家不要走進去。</p></li>
<li><h3>第 4 關・鹽田的躲雨小屋（梅雨季）：快要下大雨了！</h3><p>蛋孵了大約三個星期，毛茸茸的雛鳥出生了。可是五、六月是梅雨季，天空越來越黑。雛鳥的羽毛還沒長好，淋濕了會失溫（身體變得太冷）。志工想到一個辦法：用空心磚搭小屋，讓雛鳥躲進去。</p><p>為什麼？雛鳥還怕什麼？ 除了大雨，流浪狗和老鼠也會吃掉蛋和雛鳥。空心磚的小屋，也可以讓雛鳥躲狗。雛鳥被嚇到的時候，會躲起來一動也不動。</p></li>
<li><h3>第 5 關・小燕鷗方舟：轉動 360 度鏡頭</h3><p>鹽田的水池上，有臺灣第一座小燕鷗方舟：用竹子做的、浮在水上的平台，長和寬都是 6 公尺。方舟上有假鳥、太陽能板，還有兩支 360 度攝影機，可以看到四面八方。今天你在志工的電腦前面，幫忙看守。</p><p>為什麼？方舟上為什麼放假鳥？ 小燕鷗常常一大群一起生蛋。放假鳥，是為了吸引小燕鷗來方舟上生蛋。研究人員也替小燕鷗戴上腳環和很輕的發報器，想知道牠們去哪裡抓魚、冬天怎麼飛回去。</p></li>
<li><h3>第 6 關・鹽田的小土堆（8 月）：小燕鷗的夏天</h3><p>雛鳥孵出來大約三個星期就會飛了。鹽田裡有一些小土堆，年輕的小燕鷗在上面跳上跳下，練習飛。到了 8 月，年輕的小燕鷗要跟著爸爸媽媽，往南飛回南半球。走之前，你想把這個夏天記下來。</p><p>為什麼？明年牠們還會回來嗎？ 小燕鷗每年 4 月都會飛回臺灣生寶寶。研究人員在七股替小燕鷗戴上腳環和發報器，就是想知道牠們冬天去哪裡、明年怎麼回來。只要沙地還在、水裡有魚、沒有人和狗打擾，牠們就有地方可以回來。</p></li>
</ol>

/* ---------- 插畫元件 ---------- */
var K='#2A2020',OL='#B9AEA3',TG='#C9D0D6',BILL='#F2C230',LEG='#EBA43C',NS='http://www.w3.org/2000/svg';

function lhead(x,y,fish){

    '<path d="M'+P(-3.7,-.3)+'L'+P(-1,-1.7)+'L'+P(-.5,-3.95)+'Q'+P(3.8,-3.4)+' '+P(4,-.2)+'Q'+P(3.4,1.9)+' '+P(1,.9)+'Q'+P(-1,.2)+' '+P(-3.7,.7)+'Z" fill="'+K+'"/>'+
    '<circle cx="'+f1(x-1.6)+'" cy="'+f1(y-.9)+'" r=".45" fill="#fff"/>'+
    '<path d="M'+P(-3.6,-.8)+'L'+P(-10.5,.5)+'L'+P(-3.6,1.4)+'Z" fill="'+BILL+'"/><path d="M'+P(-8.6,.15)+'L'+P(-10.5,.5)+'L'+P(-8.6,.8)+'Z" fill="'+K+'"/>'+
    (fish?'<g transform="translate('+P(-10,1.6)+') rotate(80) scale(.75)">'+fishSvg(0)+'</g>':'');
}
// 小燕鷗（臉朝左）。o：fly 飛（翅膀往上）、down 飛（翅膀往下）、sit 趴著孵蛋；加 fish 就叼著魚。停著的時候 (0,0) 是腳底，飛的時候 (0,0) 是身體中間
function lt(x,y,s,o){
  o=o||'';var h='<g transform="translate('+x+' '+y+') scale('+(s||1)+')">',fi=o.indexOf('fish')>=0;
  if(o.indexOf('fly')>=0||o.indexOf('down')>=0){

      '<path d="M9 -1L21 -5.5L16 0L21 4.5L9 1Z" fill="#fff" stroke="'+OL+'" stroke-width="1" stroke-linejoin="round"/>'+
      '<ellipse cx="1" cy="0" rx="10" ry="3.6" fill="#fff" stroke="'+OL+'" stroke-width="1.2"/>'+lhead(-10,-1.5,fi)+

    return h+'</g>';

  h+='<path d="M-1 -4.5V0M3 -4.5V0" stroke="'+LEG+'" stroke-width="1.6" stroke-linecap="round"/>'+
    '<path d="M10 -9L20 -12L16.5 -8.6L20 -6Z" fill="#fff" stroke="'+OL+'" stroke-width="1"/>'+

    '<path d="M-5 -11Q6 -14.5 21 -9.5Q8 -5.5 -3 -7Z" fill="'+TG+'" stroke="'+OL+'" stroke-width=".8" stroke-linejoin="round"/>'+lhead(-8,-13.5,fi);
  return h+'</g>';
}
// 毛茸茸的雛鳥（沙子色、有小斑點，臉朝左，(0,0) 是腳底）
function chick(x,y,s){

    '<ellipse cx="1" cy="-8" rx="7" ry="5.6" fill="#E9D7AE" stroke="#BFA77C" stroke-width="1"/><circle cx="-4" cy="-14" r="4.2" fill="#E9D7AE" stroke="#BFA77C" stroke-width="1"/>'+

function egg(x,y,s,col,pat){
  var h='<g transform="translate('+x+' '+y+') scale('+s+')"><ellipse rx="4.2" ry="5.4" fill="'+(col||'#D9C79F')+'" stroke="rgba(90,70,40,.28)" stroke-width=".5"/>';

function near(x,y,w,hh){return STOPS.some(function(s){return Math.abs(s.x-x)<w&&Math.abs(s.y-y)<hh})}
function decorate(){
  var r=rnd(31),h='',p='',q='';
  // 東邊一格一格的魚塭（避開關卡、字和河）
  for(var x=594;x<880;x+=60)for(var y=-60;y<470;y+=46){
    var px=x+(r()<.5?0:6),py=y;
    if(near(px+24,py+14,46,42))continue;
    if(Math.abs(px+24-664)<54&&Math.abs(py+14-62)<26)continue;
    if(Math.abs(px+24-712)<40&&Math.abs(py+14-420)<36)continue;
    if(r()<.15)continue;
    h+='<rect x="'+px+'" y="'+py+'" width="50" height="36" rx="4" fill="#A9DCEA" stroke="#F7EEDA" stroke-width="3"/>';
  }
  map.querySelector('#ponds').innerHTML=h;
  // 中間的鹽田：今天是沙地和小水窪，曬鹽時是白白的鹽田
  for(var sx=262;sx<576;sx+=28)for(var sy=110;sy<420;sy+=22){
    var cx=sx+12,cy=sy+9;
    if(near(cx,cy,38,36))continue;
    if(cx>440&&cx<560&&cy>292&&cy<388)continue;
    if(Math.abs(cx-318)<30&&Math.abs(cy-124)<14)continue;
    if(cy>404)continue;
    p+='<rect x="'+sx+'" y="'+sy+'" width="25" height="19" fill="#E2D2AC" stroke="#F3EAD4" stroke-width="2"/>'+(r()<.22?'<ellipse cx="'+(cx+(r()-.5)*8).toFixed(1)+'" cy="'+(cy+(r()-.5)*5).toFixed(1)+'" rx="5" ry="2.6" fill="#BFE0EA"/>':'');
    q+='<rect x="'+sx+'" y="'+sy+'" width="25" height="19" fill="#F5F4EE" stroke="#D8D2C6" stroke-width="2"/>'+(r()<.18?'<path d="M'+(cx-6)+' '+(cy+5)+'L'+cx+' '+(cy-6)+'L'+(cx+6)+' '+(cy+5)+'Z" fill="#fff" stroke="#D2CCC0"/>':'');
  }
  map.querySelector('#pans').innerHTML=p;
  map.querySelector('#pansPast').innerHTML=q;
}

   html:'<p>以前這裡是<b>七股鹽場</b>，大家在一格一格的<b>鹽田</b>曬鹽。<b>2002 年</b>不曬鹽以後，留下平平的<b>沙地</b>，旁邊又有魚塭，小燕鷗就來這裡生蛋。</p><p>小燕鷗不用樹枝做鳥巢。牠們在沙地上挖一個<b>淺窩</b>，蛋就直接生在裡面。</p><p class="note">在鹽田邊看鳥，要待在封鎖線外面，安靜、遠遠看。</p>',

   why:['蛋生在地上，不怕被踩破嗎？','怕！小燕鷗的蛋有<b>保護色</b>，可以躲過別的動物，可是人也看不出來，很容易一腳踩破。所以每年 <b>4 到 8 月</b>，生蛋的地方會圍起來，請大家不要走進去。']},
  {cam:[0,0,300,225],kick:'第 4 關・鹽田的躲雨小屋（梅雨季）',h:'快要下大雨了！',
   html:'<p>蛋孵了大約三個星期，毛茸茸的<b>雛鳥</b>出生了。可是五、六月是<b>梅雨季</b>，天空越來越黑。</p><p>雛鳥的羽毛還沒長好，淋濕了會<b>失溫</b>（身體變得太冷）。志工想到一個辦法：用<b>空心磚</b>搭小屋，讓雛鳥躲進去。</p><p class="note">給大人：台灣黑面琵鷺保育學會在七股用廢棄木片和空心磚，替雛鳥搭過小小的躲避處；遊戲裡小屋的樣子是畫的示意。「大約三個星期孵出」是澳洲 BirdLife 的資料。</p>',

   why:['雛鳥還怕什麼？','除了大雨，<b>流浪狗</b>和<b>老鼠</b>也會吃掉蛋和雛鳥。空心磚的小屋，也可以讓雛鳥躲狗。雛鳥被嚇到的時候，會躲起來一動也不動。']},
  {cam:[0,0,300,225],kick:'第 5 關・小燕鷗方舟',h:'轉動 360 度鏡頭',
   html:'<p>鹽田的水池上，有臺灣第一座<b>小燕鷗方舟</b>：用竹子做的、浮在水上的平台，長和寬都是 <b>6 公尺</b>。</p><p>方舟上有<b>假鳥</b>、<b>太陽能板</b>，還有兩支 <b>360 度攝影機</b>，可以看到四面八方。今天你在志工的電腦前面，幫忙看守。</p><p class="note">給大人：小燕鷗方舟由台灣黑面琵鷺保育學會、中華電信和臺灣大學團隊一起做（公視，2026 年）。學會也用電子圍籬監看，狗一闖進來，志工就去趕。遊戲把這兩件事合在一起玩。</p>',

  {cam:[0,0,300,225],kick:'第 6 關・鹽田的小土堆（8 月）',h:'小燕鷗的夏天',

    function mod(a){return ((a%PW)+PW)%PW}
    function setOff(o){off=mod(o);pw.setAttribute('transform','translate('+f1(-off)+' 0)');mk.innerHTML=''}
    function dist(a,b){var d=Math.abs(a-b);return Math.min(d,PW-d)}
    function hit(px,py){
      var wx=mod(px+off);
      for(var k=0;k<T.length;k++){var t=T[k];if(!t.ok&&dist(wx,t.x)<t.r&&Math.abs(py-(t.y-20))<34){t.ok=true;got(t);return}}
      for(var j=0;j<O.length;j++){var o=O[j];if(dist(wx,o.x)<o.r&&Math.abs(py-(o.y-12))<28){say(msg,o.t,1);return}}
    }
    function got(t){
      found++;bar.style.width=(found/2*100)+'%';
      var sx2=mod(t.x-off);if(sx2>PW-320)sx2-=PW;
      mk.innerHTML='<circle cx="'+f1(sx2)+'" cy="'+(t.y-20)+'" r="30" fill="none" stroke="#DB2E27" stroke-width="3"/>';
      svg.querySelectorAll('.t-'+t.k).forEach(function(g){g.style.transition=reduce?'none':'transform 1.2s ease-in,opacity 1.2s';g.style.transform=t.k==='dog'?'translate(-70px,-8px)':'translate(0,-16px)';if(t.k==='dog')g.style.opacity='0'});
      later(function(){mk.innerHTML=''},1200);
      if(found>=2){done=true;say(msg,t.t);later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},1300)}
      else say(msg,t.t+'還有一個，繼續轉轉看。');
    }
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){sx=p.x;off0=off;moved=0;return}
      if(t==='move'){var dx=p.x-sx;moved=Math.max(moved,Math.abs(dx));if(moved>4)setOff(off0-dx);return}
      if(t==='up'&&moved<6)hit(p.x,p.y);
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','360 度鏡頭的畫面：左右方向鍵轉鏡頭，Enter 選中間的東西');
    svg.addEventListener('keydown',function(e){if(done)return;
      if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setOff(off+(e.key==='ArrowRight'?40:-40))}
      else if(e.key==='Enter'||e.key===' '){e.preventDefault();var c=mod(off+160),t=T.filter(function(t){return !t.ok&&dist(c,t.x)<80})[0];if(t){t.ok=true;got(t)}}});
    later(function(){if(!found&&!done)say(msg,'手指<b>按住</b>畫面往左或往右拖，鏡頭就會轉。看看岸邊有沒有不該出現的東西。')},8000);
    setOff(off);
  },

  /* 第 6 關：拖卡片換位置，把小燕鷗的夏天排好順序 */
  order:function(area,i,l){
    var EV=['4 月飛來','送魚求偶','沙地生蛋','雛鳥孵出','練習飛','8 月南飛'],CW=82,CH=58,SL=[[70,26],[160,26],[250,26],[70,98],[160,98],[250,98]];
    var ord=[0,1,2,3,4,5],cards=[],held=null,ox=0,oy=0,done=false,raf=0,mv=0;
    do{ord.sort(function(){return Math.random()-.5})}while(ord.filter(function(k,j){return k===j}).length>1);
    function pic(k){
      if(k===0)return '<path d="M-24 10q6 -4 12 0t12 0t12 0t12 0" stroke="#7CC3DB" stroke-width="2.2" fill="none" stroke-linecap="round"/><g transform="scale(-1 1)">'+lt(0,-2,.9,'fly')+'</g>';
      if(k===1)return '<g transform="translate(-14 12) scale(-1 1)">'+lt(0,0,.75,'')+'</g>'+lt(12,12,.75,'fish');
      if(k===2)return '<ellipse cy="8" rx="22" ry="7" fill="#D8C59C"/>'+egg(-6,5,1.6,'#D9C79F','dot')+egg(6,6,1.6,'#D9C79F','dot');
      if(k===3)return '<ellipse cy="12" rx="22" ry="5" fill="#D8C59C"/>'+chick(-2,12,1.15)+'<path d="M10 12a5 5 0 0 1 10 0Z" fill="#D9C79F" stroke="#B8A57E" stroke-width=".6"/>';
      if(k===4)return '<path d="M-24 14Q0 0 24 14Z" fill="#CDB48A"/><g transform="translate(0 -2) scale(-1 1)">'+lt(0,0,.8,'down')+'</g>';
      return '<g transform="scale(-1 1)">'+lt(10,-4,.7,'fly')+lt(-8,4,.55,'down')+'</g><path d="M-20 -8V12M-25 7L-20 12L-15 7" stroke="#DB2E27" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
    }
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#FBF3E4"><rect x="-400" y="170" width="1200" height="60" fill="#EFE3C8"/>';
    SL.forEach(function(p,j){s+='<rect x="'+(p[0]-CW/2)+'" y="'+p[1]+'" width="'+CW+'" height="'+CH+'" rx="10" fill="none" stroke="#BD9558" stroke-width="1.4" stroke-dasharray="4 4"/>'});
    s+='<path d="M40 176H280" stroke="#BD9558" stroke-width="2"/><path d="M274 171L281 176L274 181" fill="none" stroke="#BD9558" stroke-width="2"/><text x="40" y="168" font-size="14" fill="#8A7A70">4 月</text><text x="282" y="168" font-size="14" fill="#8A7A70" text-anchor="end">8 月</text>'+
      '<g id="cs"></g><g id="nums"></g><g id="fly"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),cs=svg.querySelector('#cs'),nums=svg.querySelector('#nums'),flyG=svg.querySelector('#fly');
    SL.forEach(function(p,j){nums.insertAdjacentHTML('beforeend','<circle cx="'+(p[0]-CW/2+4)+'" cy="'+(p[1]+4)+'" r="9" fill="#6C2024"/><text x="'+(p[0]-CW/2+4)+'" y="'+(p[1]+8.5)+'" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">'+(j+1)+'</text>')});
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    EV.forEach(function(t,k){var g=document.createElementNS(NS,'g');g.style.cursor='grab';
      g.innerHTML='<rect x="'+(-CW/2)+'" y="0" width="'+CW+'" height="'+CH+'" rx="10" fill="#fff" stroke="#BD9558" stroke-width="2"/><g transform="translate(0 22)">'+pic(k)+'</g><text y="'+(CH-6)+'" font-size="15.5" font-weight="700" fill="#2A2020" text-anchor="middle">'+t+'</text>';
      cs.appendChild(g);cards[k]={el:g,x:0,y:0}});
    function put(k,x,y,anim){var c=cards[k];c.x=x;c.y=y;c.el.style.transition=anim&&!reduce?'transform .22s ease-out':'none';c.el.style.transform='translate('+f1(x)+'px,'+f1(y)+'px)'}
    function lay(skip){ord.forEach(function(k,j){if(k!==skip)put(k,SL[j][0],SL[j][1],true)})}
    function right(){return ord.filter(function(k,j){return k===j}).length}
    function score(){bar.style.width=(right()/6*100)+'%'}
    ord.forEach(function(k,j){put(k,SL[j][0],SL[j][1],false)});score();
    function complete(){
      done=true;bar.style.width='100%';svg.querySelectorAll('#cs rect').forEach(function(r){r.setAttribute('stroke','#6C2024')});say(msg,'排好了！小燕鷗一家要出發了⋯⋯');
      var t0=performance.now();
      (function f(now){var q=Math.min(1,(now-t0)/(reduce?1:2200));cs.style.opacity=String(1-.7*Math.min(1,q*2));
        flyG.innerHTML=[0,1,2].map(function(j){var d=Math.max(0,Math.min(1,q*1.3-j*.15));return '<g transform="translate('+f1(200-120*d+j*14)+' '+f1(-10+200*d+(j-1)*6)+') rotate(-60)">'+lt(0,0,j?1:1.2,Math.floor(now/150+j)%2?'down':'fly')+'</g>'}).join('');
        if(q<1)raf=requestAnimationFrame(f)})(t0);
      loops.push(function(){cancelAnimationFrame(raf)});
      later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},reduce?0:2300);
    }
    function nearest(x,y){var b=0,bd=1e9;SL.forEach(function(p,j){var d=Math.hypot(p[0]-x,p[1]+CH/2-y);if(d<bd){bd=d;b=j}});return b}
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){held=null;mv=0;for(var j=0;j<6;j++){var k=ord[j],c=cards[k];if(Math.abs(p.x-c.x)<CW/2+4&&p.y>c.y-4&&p.y<c.y+CH+4){held=k;break}}
        if(held===null)return;ox=cards[held].x-p.x;oy=cards[held].y-p.y;cs.appendChild(cards[held].el);cards[held].el.style.cursor='grabbing';return}
      if(held===null)return;
      if(t==='move'){mv++;var x=Math.max(40,Math.min(280,p.x+ox)),y=Math.max(0,Math.min(124,p.y+oy));put(held,x,y,false);
        var j2=nearest(x,y+CH/2),cur=ord.indexOf(held);if(j2!==cur){ord.splice(cur,1);ord.splice(j2,0,held);lay(held)}return}
      if(t==='up'){var k2=held;held=null;cards[k2].el.style.cursor='grab';lay(-1);score();
        if(right()===6){complete();return}
        if(mv>0)say(msg,'有 <b>'+right()+'</b> 張放對位置了。想一想：先有蛋，才會有雛鳥喔。',right()<3)}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','排卡片的畫面，按 Enter 把卡片排好');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();ord=[0,1,2,3,4,5];lay(-1);complete()}});
    later(function(){if(!done&&right()<2)say(msg,'用手指<b>按住</b>一張卡片，拖到別的位置，其他卡片會讓開。')},9000);
  }
};
