<h1>藕粉任務・蓮花・白河藕粉</h1>
<p>跟著<b>白河</b>的阿嬤：放乾蓮田的水、在泥巴裡摸出<b>蓮藕</b>、提起過濾布洗出粉水、畫線倒掉上面的水、把粉塊壓成小片，最後吹涼一杯熱熱的<b>藕粉</b>。</p>
<p>地點：白河（臺南市白河區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>白河是全臺灣種最多蓮藕的地方。夏天，蓮田開滿蓮花；到了冬天，大家下田挖蓮藕。白河的蓮藕，大多做成藕粉。大約 10 斤蓮藕，才做得出 1 斤藕粉。跟著白河的阿嬤，從放乾田裡的水、挖蓮藕，一路做到泡一杯熱熱的藕粉。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・蓮田：放乾水，等兩個月</h3><p>夏天，蓮田裡有水，開滿蓮花。蓮子採完，到了秋天，就要把田裡的水放掉。蓮田要放大約兩個月，等水收乾，才能下田挖蓮藕。</p><p>為什麼？為什麼要等田乾了才挖？ 蓮藕長在田底的爛泥裡。白河的蓮農說，蓮田要放大約兩個月，等水收乾，才能下田挖蓮藕。</p></li>
<li><h3>第 2 關・挖藕：在泥巴裡摸蓮藕</h3><p>田乾了，阿嬤彎著腰下田，挖蓮藕。蓮藕藏在泥巴裡，看不見，要慢慢摸、慢慢挖。挖出來的蓮藕，用小鐮刀把頭尾切掉。蓮藕白白嫩嫩，又被叫做西施臂。</p><p>為什麼？什麼樣的蓮藕拿來做藕粉？ 皮和肉淡淡紅色的蓮藕，澱粉比較多，常常做成藕粉。皮黃、肉白的，脆脆的、水分多，拿去做菜。</p></li>
<li><h3>第 3 關・洗粉：把布的四個角提起來</h3><p>蓮藕洗乾淨、切成一節一節，再碾碎。碾碎的藕泥加水洗，白白的澱粉就跑到水裡。藕粉，其實就是蓮藕裡的澱粉。用布過濾，渣留在布上，粉水流下去。</p><p>為什麼？藕粉是蓮藕的哪個部分？ 是蓮藕裡的澱粉。碾碎、加水洗，澱粉跑到水裡；渣太大，過不了布，就留在布上。</p></li>
<li><h3>第 4 關・沉澱：水在上面，粉在下面</h3><p>粉水放著不動，重重的粉會慢慢沉到下面，上面變成清清的水。這叫沉澱。把上面的水倒掉，還要濾掉沙子，留下白白的粉。</p><p>為什麼？為什麼粉會沉到下面？ 粉比水重。粉水放著不動，粉就會慢慢沉到最下面，上面只剩水。</p></li>
<li><h3>第 5 關・刨粉曬粉：壓成小片</h3><p>沉在桶底的粉，乾了變成一大塊。阿嬤把它刨成一片一片，放在太陽下曬乾。純手工的藕粉，是小小的片狀，不是細細的粉末。顏色是米白，或帶一點粉紅。</p><p>為什麼？怎麼分辨純手工的藕粉？ 看三件事：是小小的片狀；顏色米白或帶一點粉紅；用開水沖，很快溶化，變成深紅褐色。</p></li>
<li><h3>第 6 關・泡一杯：吹涼熱熱的藕粉</h3><p>藕粉曬好了，可以送到白河區農會，做成一包一包的藕粉。用熱開水沖一杯：純手工的藕粉很快就溶化，變成深紅褐色。</p><p>為什麼？白河的蓮藕，為什麼大多做成藕粉？ 新鮮的蓮藕放不久。做成藕粉，方便吃，也可以放得比較久。</p></li>
</ol>

  if(s.k==='dig')return t+lotusRoot(-30,10,.65,-6,3)+stalk(-4,0,.8)+stalk(14,4,.8)+'</g>';
  if(s.k==='wash')return t+bucket(0,22,44,26)+'<path d="M-24 -20L0 -6L24 -20L14 2Q0 8 -14 2Z" fill="#FFF8EC" stroke="#B8A888" stroke-width="1.2"/><path d="M0 6V14" stroke="#F4E6E0" stroke-width="2" stroke-dasharray="2 3"/></g>';

function decorate(){
  var r=rnd(43),p='',q='';
  function free(x,y){return STOPS.every(function(s){return Math.abs(s.x-x)>60||Math.abs(s.y-y)>60})}
  PONDS.forEach(function(pl){
    // 開花時：水、荷葉、蓮花
    p+='<rect x="'+(pl[0]+3)+'" y="'+(pl[1]+3)+'" width="'+(pl[2]-6)+'" height="'+(pl[3]-6)+'" rx="3" fill="'+WATER+'" opacity=".85"/>';
    for(var y=pl[1]+34;y<pl[1]+pl[3]+4;y+=30)for(var x=pl[0]+16;x<pl[0]+pl[2]-8;x+=26)if(free(x,y))p+=(r()<.3?flower(x,y,.5):leaf(x,y,.6));
    // 挖藕時：乾掉的泥、裂縫、枯荷梗
    for(var y2=pl[1]+26;y2<pl[1]+pl[3]-4;y2+=26)for(var x2=pl[0]+14;x2<pl[0]+pl[2]-10;x2+=24)if(free(x2,y2))q+=(r()<.5?stalk(x2,y2,.7):'<path d="M'+x2+' '+y2+'l6 4l-3 6" stroke="#9A7A58" stroke-width="1.2" fill="none"/>')});
  map.querySelector('#frPast').innerHTML=p;
  map.querySelector('#frNow').innerHTML=q;
}

    later(function(){if(!done&&n===0)say(msg,'手指按住布角上的<b>紅點</b>，拖到中間的圓圈。')},8000);
  },

  /* 第 4 關：粉水慢慢分成兩層，從左到右畫一條線在水和粉的中間，倒掉上面的水 */
  settle:function(area,i,l){
    var B=126,T=40,st=0,ready=false,done=false,pts=[],hold=false,pour=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F2EAE0"><rect x="-400" y="178" width="1200" height="60" fill="#B8A888"/>'+
      '<defs><clipPath id="bkc"><path d="M66 '+T+'L80 172H240L254 '+T+'Z"/></clipPath></defs><g clip-path="url(#bkc)"><g id="lq"></g></g>'+
      '<path d="M66 '+T+'L80 172H240L254 '+T+'" fill="none" stroke="#5E7A86" stroke-width="3" stroke-linejoin="round"/><path d="M60 '+T+'H260" stroke="#5E7A86" stroke-width="4" stroke-linecap="round"/>'+
      '<g id="lb"></g><g id="ln"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),lq=svg.querySelector('#lq'),ln=svg.querySelector('#ln'),lb=svg.querySelector('#lb');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function mix(a,b,t){var A=parseInt(a.slice(1),16),Bc=parseInt(b.slice(1),16),r=Math.round((A>>16)+(((Bc>>16)-(A>>16))*t)),g=Math.round(((A>>8)&255)+((((Bc>>8)&255)-((A>>8)&255))*t)),bl=Math.round((A&255)+(((Bc&255)-(A&255))*t));return 'rgb('+r+','+g+','+bl+')'}
    function draw(){var top=T+8+pour*(B-T-8),pb=172-(172-B)*st;
      lq.innerHTML='<rect x="60" y="'+f1(top)+'" width="200" height="'+f1(Math.max(0,172-top))+'" fill="'+mix('#E6D8D2','#C8DCE4',st)+'"/>'+
        '<rect x="60" y="'+f1(Math.max(top,pb))+'" width="200" height="'+f1(172-Math.max(top,pb))+'" fill="'+POW+'"/>'+
        '<rect x="60" y="166" width="200" height="8" fill="#B8A898" opacity="'+f1(st*.8)+'"/>';
      lb.innerHTML=ready&&!done?'<text x="282" y="'+f1((T+B)/2+5)+'" font-size="15" font-weight="700" fill="#3E6E88" text-anchor="middle">水</text><text x="282" y="'+f1((B+166)/2+5)+'" font-size="15" font-weight="700" fill="#8A6A5A" text-anchor="middle">粉</text>':
        (!ready?'<text x="160" y="28" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle">等一等，粉慢慢沉下去……</text>':'');
      ln.innerHTML=pts.length>1?'<path d="M'+pts.map(function(p){return f1(p.x)+' '+f1(p.y)}).join('L')+'" stroke="#DB2E27" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-dasharray="6 4"/>':'';
      bar.style.width=(done?100:st*50+(pour*40))+'%'}
    draw();
    anim(function(dt){if(st<1){st=Math.min(1,st+dt/4);if(st>=1){ready=true;say(msg,'分成兩層了！上面是<b>水</b>，下面是白白的<b>粉</b>。從左邊畫一條線到右邊，畫在兩層的中間。')}draw()}});
    function ok(){done=true;var t=0;anim(function(dt){t=Math.min(1,t+dt*1.2);pour=t;draw();if(t>=1){pts=[];draw();lvDone(area,i,l,msg,'倒好了！');return false}})}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){if(!ready){say(msg,'還沒分好，再<b>等一下</b>。',1);return}hold=true;pts=[p];draw();return}
      if(t==='move'&&hold){if(dist(p,pts[pts.length-1])>3){pts.push(p);draw()}return}
      if(t==='up'&&hold){hold=false;var xs=pts.map(function(q){return q.x}),mn=Math.min.apply(null,xs),mx=Math.max.apply(null,xs),avg=pts.reduce(function(a,q){return a+q.y},0)/pts.length;
        if(mn>100||mx<220){say(msg,'要從桶子的<b>左邊</b>一直畫到<b>右邊</b>。',1);pts=[];draw();return}
        if(Math.abs(avg-B)<=14){ok();return}
        say(msg,avg<B?'太高了！這樣上面還會留下很多<b>水</b>。畫低一點，畫在兩層中間。':'太低了！這樣會把<b>粉</b>一起倒掉。畫高一點，畫在兩層中間。',1);
        later(function(){pts=[];draw()},900)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','裝著粉水的桶子，按 Enter 倒掉上面的水');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done&&ready){e.preventDefault();ok()}});
  },

  /* 第 5 關：點粉塊壓成小片，每塊兩下剛好，點太多會碎成粉末（再換一塊） */
  flake:function(area,i,l){
    var P=[[95,88],[160,82],[225,88],[95,134],[160,140],[225,134]].map(function(q){return {x:q[0],y:q[1],n:0}}),done=false,good=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#DCEFF6"><rect x="-400" y="168" width="1200" height="60" fill="#C8B488"/><circle cx="280" cy="26" r="13" fill="#F7C948"/>'+
      '<ellipse cx="160" cy="112" rx="146" ry="62" fill="#E2C890" stroke="#A88A48" stroke-width="3"/><ellipse cx="160" cy="112" rx="134" ry="54" fill="none" stroke="#C8A868" stroke-width="1.2" stroke-dasharray="4 3"/><g id="pc"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),pc=svg.querySelector('#pc');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function piece(q){var x=q.x,y=q.y;
      if(q.n===0)return '<rect x="'+(x-20)+'" y="'+(y-13)+'" width="40" height="26" rx="6" fill="'+POW+'" stroke="#C8A8A0" stroke-width="1.4"/><path d="M'+(x-12)+' '+(y-6)+'h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>';
      if(q.n===1)return '<rect x="'+(x-20)+'" y="'+(y-13)+'" width="40" height="26" rx="6" fill="'+POW+'" stroke="#C8A8A0" stroke-width="1.4"/><path d="M'+(x-14)+' '+(y-10)+'l10 9l-4 12M'+(x-4)+' '+(y-1)+'l14 -4l6 10" stroke="#B89088" stroke-width="1.4" fill="none"/>';
      if(q.n===2)return [[-14,-6,10,-2,4,6,-10,4],[2,-10,16,-6,14,4,4,2],[-6,4,6,6,2,13,-10,11],[8,6,18,8,14,14,6,12]].map(function(a){return '<path d="M'+(x+a[0])+' '+(y+a[1])+'L'+(x+a[2])+' '+(y+a[3])+'L'+(x+a[4])+' '+(y+a[5])+'L'+(x+a[6])+' '+(y+a[7])+'Z" fill="'+POW+'" stroke="#C8A8A0" stroke-width="1"/>'}).join('');
      return '<path d="M'+(x-20)+' '+(y+10)+'Q'+x+' '+(y-12)+' '+(x+20)+' '+(y+10)+'Z" fill="#FBF6F2" stroke="#E0D0C8" stroke-width="1"/><circle cx="'+(x-6)+'" cy="'+(y+4)+'" r="1" fill="#D8C8C0"/><circle cx="'+(x+5)+'" cy="'+(y+2)+'" r="1" fill="#D8C8C0"/>'}
    function draw(){pc.innerHTML=P.map(piece).join('');good=P.filter(function(q){return q.n===2}).length;bar.style.width=(done?100:good/6*90)+'%'}
    draw();
    function press(q){q.n++;draw();
      if(q.n===1)say(msg,'裂開了！這一塊再點<b>一下</b>。');
      else if(q.n===2){if(good>=6){done=true;later(function(){draw();lvDone(area,i,l,msg,'全部做成小片了！')},500)}else say(msg,'變成<b>小片</b>了，剛剛好！換下一塊。')}
      else{say(msg,'哎呀，點太多下，碎成<b>細粉</b>了！手工藕粉要是小片的。阿嬤再給你一塊。',1);later(function(){q.n=0;draw()},1100)}}
    drag(svg,function(t,p){if(done||t!=='down')return;var best=null,bd=28;P.forEach(function(q){var dd=dist(p,q);if(dd<bd){bd=dd;best=q}});
      if(!best){say(msg,'點竹篩上的<b>粉塊</b>。',1);return}
      if(best.n>2)return;press(best)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','竹篩上的粉塊，按 Enter 把一塊做成小片');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();for(var k=0;k<6;k++)if(P[k].n<2){P[k].n=1;press(P[k]);break}}});
    later(function(){if(!done&&good===0)say(msg,'用手指<b>點</b>一塊粉塊，點兩下就會變成小片。')},8000);
  },

  /* 第 6 關：對著麥克風吹氣，把熱藕粉吹涼（不能用麥克風的，按住「呼呼吹」） */
  blow:function(area,i,l){
    var H=1,done=false,mode='',hold=false,an=null,buf=null,stream=null,ctx=null,lvl=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F2EAE0"><rect x="-400" y="160" width="1200" height="70" fill="#C8A878"/>'+
      '<g id="stm"></g><path d="M118 70H202L192 158H128Z" fill="#FFFDF7" stroke="#8A6A4A" stroke-width="2.4" stroke-linejoin="round"/><path d="M202 88Q226 92 222 112Q218 130 196 128" fill="none" stroke="#8A6A4A" stroke-width="5"/>'+
      '<path d="M122 82H198L192.4 155H127.6Z" fill="#9A4A3A"/><ellipse cx="160" cy="82" rx="38" ry="5" fill="#B05A48"/>'+
      '<g id="th"></g><g id="wd"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),stm=svg.querySelector('#stm'),th=svg.querySelector('#th'),wd=svg.querySelector('#wd');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    var b=bigBtn(area,'拿起<br>杯子');
    var alt=el('<p><button type="button" class="link-btn">不能用麥克風？改用按鈕</button></p>').firstChild;area.appendChild(alt);
    alt.querySelector('button').addEventListener('click',function(){useBtn()});
    var ph=0;
    function draw(){var h='';for(var k=0;k<3;k++){var x=138+k*22;h+='<path d="M'+x+' 64Q'+f1(x-8+Math.sin(ph+k)*4)+' 50 '+x+' 38Q'+f1(x+8+Math.sin(ph+k)*4)+' 26 '+x+' 12" stroke="#B8A898" stroke-width="3" fill="none" stroke-linecap="round" opacity="'+f1(Math.max(0,H-.12)*.9)+'"/>'}
      stm.innerHTML=h;
      th.innerHTML='<g transform="translate(272 0)"><rect x="-7" y="30" width="14" height="104" rx="7" fill="#FFF8EC" stroke="#8A7A70" stroke-width="1.4"/><circle cy="140" r="11" fill="'+(H>.5?'#DB2E27':'#E8A040')+'"/><rect x="-3.5" y="'+f1(134-H*96)+'" width="7" height="'+f1(H*96+6)+'" fill="'+(H>.5?'#DB2E27':'#E8A040')+'"/>'+
        '<text y="22" font-size="13" font-weight="700" fill="#6C2024" text-anchor="middle">'+(H>.6?'好燙':H>.25?'溫溫的':'剛好')+'</text></g>';
      wd.innerHTML=lvl>.05?'<path d="M40 50q12 -6 24 0t24 0M34 70q12 -6 24 0t24 0M40 90q12 -6 24 0t24 0" stroke="#8EC5E0" stroke-width="3" fill="none" stroke-linecap="round" opacity="'+f1(Math.min(1,lvl*2))+'"/>':'';
      bar.style.width=(done?100:(1-H)*95)+'%'}
    draw();
    function stopMic(){try{if(stream)stream.getTracks().forEach(function(t){t.stop()});if(ctx)ctx.close()}catch(_){}stream=null;ctx=null;an=null}
    loops.push(stopMic);
    anim(function(dt){if(done)return false;ph+=dt*3;
      var v=0;if(an){an.getFloatTimeDomainData(buf);var sum=0;for(var k=0;k<buf.length;k++)sum+=buf[k]*buf[k];var rms=Math.sqrt(sum/buf.length);v=rms>.06?Math.min(2,rms/.12):0}
      if(hold)v=1;lvl=v;
      if(v>0)H=Math.max(0,H-dt*.3*v);
      if(H<=.12){done=true;stopMic();lvl=0;draw();lvDone(area,i,l,msg,'吹涼了！');return false}
      draw()});
    function start(){if(b.parentNode)b.remove();
      if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){useBtn(1);return}
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(st2){if(done){st2.getTracks().forEach(function(t){t.stop()});return}
        stream=st2;var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();var src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=1024;buf=new Float32Array(an.fftSize);src.connect(an);
        mode='mic';say(msg,'對著手機下面的<b>麥克風</b>，<b>呼——呼——</b>用力吹氣！')}).catch(function(){useBtn(1)})}
    b.addEventListener('click',start);
    function useBtn(auto){if(done||mode==='btn')return;mode='btn';stopMic();if(b.parentNode)b.remove();alt.hidden=true;
      var hb=bigBtn(area,'呼呼<br>吹');hb.style.touchAction='none';hb.style.userSelect='none';hb.style.webkitUserSelect='none';
      hb.addEventListener('pointerdown',function(e){e.preventDefault();hold=true;hb.classList.add('on')});
      ['pointerup','pointercancel','pointerleave'].forEach(function(t){hb.addEventListener(t,function(){hold=false;hb.classList.remove('on')})});
      hb.addEventListener('contextmenu',function(e){e.preventDefault()});
      hb.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();hold=true}});
      hb.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();hold=false}});
      say(msg,(auto?'這台手機（或電腦）沒辦法用麥克風。':'')+'改用按鈕：<b>按住</b>「呼呼吹」，把藕粉吹涼。');into(hb)}
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','一杯熱熱的藕粉，按 Enter 吹一下');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();if(b.parentNode)b.remove();H=Math.max(0,H-.3);draw()}});
  }
};
</script>
