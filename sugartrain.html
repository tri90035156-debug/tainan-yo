<h1>五分車任務・老糖廠・新營鐵道文化園區</h1>
<p>跟著阿公逛新營的<b>鐵道文化園區</b>：在以前的<b>秤量所</b>秤甘蔗車、幫<b>勝利號</b>的司機換到另一頭的駕駛室、在擠擠的車上挪出位子、描出往<b>火燒店站</b>的路線、用反過來的<b>鉛字</b>排出糖廠的年份，再鋪好三條鐵軌，看看<b>五分車</b>的軌距有多窄。</p>
<p>地點：新營糖廠（臺南市新營區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>臺南新營的老糖廠旁邊，有一片新營鐵道文化園區。這裡的小火車叫五分車，跑在糖鐵上。糖鐵以前載甘蔗，也載過人。跟著阿公，從中興站出發，看看五分車和鐵道的故事。每過一關，就能蓋一個章。</p><h2>關卡</h2><ol>
<li><h3>第 1 關・中興站：以前是秤量所</h3><p>阿公指著中興站說：「這間車站，以前是糖廠的秤量所和檢驗室。」秤量，就是秤重量；檢驗，就是檢查。報導說，糖廠不再製糖以後，2003 年底，這裡改成了車站。</p><p>為什麼？這間車站以前是做什麼的？ 以前是台糖新營總廠的秤量所和檢驗室：秤量是秤重量，檢驗是檢查。糖廠不再製糖以後，2003 年底改成車站，就是今天的中興站。</p></li>
<li><h3>第 2 關・勝利號：兩頭都能開的車</h3><p>月台邊停著一台藍綠色的車，叫勝利號，538 號。它是 1949 年從日本來的內燃客車，自己有引擎，不用火車頭拉。勝利號以前載人，1982 年糖鐵不再載客，它就停下來。報導說，2023 年 6 月 10 日起，它又開始載觀光客。</p><p>為什麼？勝利號為什麼不用掉頭？ 報導說，勝利號的車子兩頭各有一個駕駛室。要往回開，司機走到另一頭的駕駛室就可以了。</p></li>
<li><h3>第 3 關・糖鐵新營站：糖鐵也載人</h3><p>糖鐵不只載甘蔗，以前也載人。1953、1954 年，糖鐵有 41 條載客的路線，加起來大約 675 公里。有一說，最多人坐的時候，一天大約有 6 萬人坐糖鐵。勝利號裡面，是長長的木頭椅子。</p><p>為什麼？糖鐵載人載了多久？ 有一說，1909 年從新營到岸內的路線開始長期載客。到了 1982 年，最後一條載客的路線也停了，糖鐵就不再載客。</p></li>
<li><h3>第 4 關・往火燒店：往學甲，還是往火燒店？</h3><p>從新營出發的糖鐵有好幾條。學甲線從新營糖廠往西，通到學甲一帶的甘蔗田。1979 年，學甲線不再載客。2024 年的報導說，觀光的五分車會從中興站往南，跨過急水溪，開到柳營的火燒店站。</p><p>為什麼？火燒店這個名字是怎麼來的？ 報導說，火燒店是柳營的一個聚落。名字怎麼來的，有好幾種說法，其中一種是：以前這裡有一間生意很好的碗粿店，大家叫它好銷店，後來念著念著，變成了火燒店。</p></li>
<li><h3>第 5 關・新營糖廠：糖廠的一生</h3><p>1907 年，鹽水港製糖開始蓋新營糖廠，隔年就開始試著製糖。後來，糖廠在 2001 年前後不再製糖。糖廠留下來的鐵道和房子，變成了今天的鐵道文化園區。</p><p>為什麼？新營糖廠是誰蓋的？ 是日本時代的鹽水港製糖株式會社。株式會社是日文，就是公司的意思。1907 年開始蓋，隔年 11 月 3 日試著開機器製糖。後來由台灣糖業公司接手。</p></li>
<li><h3>第 6 關・鐵軌：五分車的軌距</h3><p>兩條鐵軌中間的寬度，叫軌距。五分車的軌距是 762 公厘，差不多是 76 公分（10 公厘是 1 公分），比臺鐵的 1067 公厘窄。有些地方的糖鐵鋪了三條鐵軌：中間多一條，五分車和臺鐵的車都能走。</p><p>為什麼？為什麼叫五分車？ 名字怎麼來的，到現在大家還說不一樣。有人說，糖鐵的軌距差不多是標準軌（1435 公厘）的一半，一半就是五分；但也有人說，762 公厘其實不是一半。也有人說，是因為以前的糖鐵火車，最快只有臺鐵的一半快。還有人說，那是以前大家看糖鐵的鐵軌和車子都比較小，就隨口這樣叫。</p></li>
</ol>

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
// 一直跑的動畫（換關時會自動停）
function anim(fn){var raf=0,last=0,on=true;function step(now){if(!on)return;var dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(fn(dt)===false){on=false;return}raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step);loops.push(function(){on=false;cancelAnimationFrame(raf)});return function(){on=false;cancelAnimationFrame(raf)}}
// 一定要等的時間（later() 在「減少動態效果」時會變成 0）
function wait(fn,ms){var t=setTimeout(fn,ms);loops.push(function(){clearTimeout(t)})}
// 點到線段的距離，和投影在線段上的位置（0～1）
function segP(p,a,b){var dx=b.x-a.x,dy=b.y-a.y,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy),0,1);return {d:Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy),t:t}}

      where=j;lock=true;moving=q.d;k++;draw();
      var t0=0;anim(function(dt){t0+=dt;cx=160+q.d*Math.min(1,t0)*40;draw();if(t0>=1)return false});
      if(k>=3){wait(function(){cx=160;moving=0;done=true;lock=false;draw();lvDone(area,i,l,msg,'到站了！司機坐前面那一頭，勝利號往牌子指的方向開。')},1200);say(msg,'出發！');return}
      say(msg,'出發！勝利號往'+(q.d>0?'右':'左')+'開，'+q.t.replace('往','開到')+'了。');
      wait(function(){cx=160;moving=0;lock=false;draw();say(msg,'要往回開了，看看牌子。勝利號不用掉頭：把司機拖到<b>另一頭</b>的駕駛室。')},1400)}
    function grab(p){if(where<0)return dist(p,{x:hx,y:hy-18})<30;var c=CAB[where];return dist(p,{x:c.x+(cx-160),y:c.y})<28}
    drag(svg,function(t,p){if(done||lock)return;
      if(t==='down'){if(grab(p)){hold=true;where=-1;hx=p.x;hy=p.y+10;draw()}else say(msg,'按住穿藍衣服、戴帽子的<b>司機</b>，拖進駕駛室。',1);return}
      if(t==='move'&&hold){hx=p.x;hy=p.y+10;draw();return}
      if(t==='up'&&hold){hold=false;var j=-1,bd=40;CAB.forEach(function(c,m){var d=dist({x:hx,y:hy-18},c);if(d<bd){bd=d;j=m}});
        if(j<0){hx=dv.x;hy=dv.y;say(msg,'拖到車子兩頭的<b>駕駛室</b>（金色虛線圈圈）。',1);draw();return}go2(j)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','勝利號和兩頭的駕駛室，按左右鍵選一頭讓司機坐進去');
    svg.addEventListener('keydown',function(e){if(done||lock)return;
      if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();go2(e.key==='ArrowLeft'?0:1)}});
    later(function(){if(!done&&!k&&!hold)say(msg,'牌子上的箭頭指向<b>右邊</b>。把司機拖到右邊那一頭的駕駛室。')},7000);
  },

  /* 第 3 關：長長的木頭椅子坐滿了，左右拖坐著的人挪一挪空出位子，再把站著的人拖到空位坐下（3 個人） */
  bench:function(area,i,l){
    var B0=52,B1=268,SP=30,BY=150,seat=[70,115,160,205,250].map(function(x,j){return {x:x,c:['#3E7EA8','#E0A030','#8A4AA0','#C8603E','#5E8A3E'][j]}}),
      STAND=[{x:96,c:'#D86A8A'},{x:160,c:'#4A8AA0',hair:'gray'},{x:224,c:'#A07A3A'}],ns=0,hold=null,mode='',sx=0,sy=0,done=false;
    STAND.forEach(function(p){p.hx=p.x;p.y=92;p.hy=92});
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E8F4F2"><rect x="-400" y="174" width="1200" height="40" fill="#C8B49A"/>'+
      '<rect x="-400" y="10" width="1200" height="6" fill="'+TIFF2+'"/>'+[30,90,150,210,270].map(function(x){return '<rect x="'+(x-22)+'" y="22" width="44" height="32" rx="5" fill="#fff" stroke="'+TIFF2+'" stroke-width="2"/><path d="M'+(x-22)+' 38H'+(x+22)+'" stroke="#D8ECEC" stroke-width="2"/>'}).join('')+
      '<rect x="'+(B0-18)+'" y="'+(BY-4)+'" width="'+(B1-B0+36)+'" height="10" rx="3" fill="#B8865A" stroke="#8A5E3A" stroke-width="1.4"/><rect x="'+(B0-18)+'" y="'+(BY+6)+'" width="'+(B1-B0+36)+'" height="18" fill="#9A6E4A"/>'+
      '<text x="160" y="186" font-size="13" font-weight="700" fill="#5A4A3A" text-anchor="middle">長長的木頭椅子（示意）</text><g id="pg"></g><g id="gg"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),pg=svg.querySelector('#pg'),gg=svg.querySelector('#gg');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function gaps(){var g=[],L=B0-SP;seat.forEach(function(q){if(q.x-L>=SP*2-.5)g.push({a:L+SP,b:q.x-SP});L=q.x});if(B1+SP-L>=SP*2-.5)g.push({a:L+SP,b:B1});return g}
    function draw(){var h='';
      seat.forEach(function(q){h+=person(q.x,BY-2,.62,q.c,{sit:1,hair:q.hair})+(!done&&!hold&&ns<3?'<path d="M'+(q.x-12)+' '+(BY+14)+'l-5 -4v8zM'+(q.x+12)+' '+(BY+14)+'l5 -4v8z" fill="#FFF8EC"/>':'')});
      STAND.forEach(function(p,j){if(p.sat)return;var me=hold===p;
        if(j===ns||me)h+=person(p.x,p.y,.7,p.c,{hair:p.hair})+(!me&&!done?'<circle cx="'+f1(p.x)+'" cy="'+f1(p.y-18)+'" r="22" fill="none" stroke="#DB2E27" stroke-width="2.2" stroke-dasharray="4 3"/>':'');
        else h+='<g opacity=".55">'+person(p.x,p.y,.6,p.c,{hair:p.hair})+'</g>'});
      pg.innerHTML=h;
      gg.innerHTML=done?'':gaps().map(function(g){var m=(g.a+g.b)/2;return '<rect x="'+f1(m-15)+'" y="'+(BY-34)+'" width="30" height="34" rx="6" fill="none" stroke="#3F6B2E" stroke-width="2" stroke-dasharray="3 3"/>'}).join('');
      bar.style.width=(done?100:ns/3*90)+'%'}
    draw();
    function push(j,x){var n=seat.length;x=clamp(x,B0+j*SP,B1-(n-1-j)*SP);seat[j].x=x;
      for(var a=j+1;a<n;a++)seat[a].x=Math.max(seat[a].x,seat[a-1].x+SP);
      for(var a=j-1;a>=0;a--)seat[a].x=Math.min(seat[a].x,seat[a+1].x-SP)}
    function sit(p){var g=gaps(),best=null,bd=40;g.forEach(function(q){var x=clamp(p.x,q.a,q.b),d=Math.abs(x-p.x);if(d<bd){bd=d;best=x}});
      if(best===null||p.y<BY-60){p.x=p.hx;p.y=p.hy;
        say(msg,g.length?'拖到椅子上<b>綠色虛線</b>的空位。':'擠不下！先左右拖<b>坐著的人</b>，往旁邊挪一挪，空出一個位子。',1);return}
      p.sat=1;seat.push({x:best,c:p.c,hair:p.hair});seat.sort(function(a,b){return a.x-b.x});ns++;
      if(ns>=3){done=true;draw();lvDone(area,i,l,msg,'3 個人都坐下了，椅子坐得滿滿的。');return}
      say(msg,'坐下了！還有 '+(3-ns)+' 個人站著。')}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){var sp=STAND[ns];if(sp&&dist(p,{x:sp.x,y:sp.y-18})<30){hold=sp;mode='stand';sp.x=p.x;sp.y=p.y+18;draw();return}
        var b=-1,bd=22;seat.forEach(function(q,j){var d=Math.hypot(p.x-q.x,(p.y-(BY-18))*.6);if(d<bd){bd=d;b=j}});
        if(b>=0){hold=seat[b];mode='seat';sx=p.x-seat[b].x;return}
        say(msg,'左右拖<b>坐著的人</b>挪一挪，或按住紅色虛線圈圈裡<b>站著的人</b>。',1);return}
      if(t==='move'&&hold){if(mode==='stand'){hold.x=clamp(p.x,20,300);hold.y=clamp(p.y+18,60,BY);}else push(seat.indexOf(hold),p.x-sx);draw();return}
      if(t==='up'&&hold){var h=hold;hold=null;if(mode==='stand')sit(h);else if(gaps().length)say(msg,'空出位子了（綠色虛線）。把站著的人拖過去坐下。');draw()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','擠擠的木頭椅子，按 Enter 讓大家挪一挪，再請站著的人坐下');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();for(var j=0;j<seat.length;j++)seat[j].x=B0+j*SP;var sp=STAND[ns];sp.x=B1;sp.y=BY;sit(sp);draw()}});
    later(function(){if(!done&&!ns&&!hold)say(msg,'每個空隙都太小了。按住坐在最右邊的人，往<b>右</b>拖；再按住旁邊的人往右拖，空出一個位子。')},7000);
  },

  /* 第 4 關：手指按住中興站，沿著鐵軌描到火燒店站（往西的是以前的學甲線，描過去會說它 1979 年就不載客了） */
  trace:function(area,i,l){
    var P0=[{x:160,y:30},{x:162,y:70}],PA=P0.concat([{x:110,y:84},{x:46,y:98}]),PB=P0.concat([{x:178,y:108},{x:174,y:148},{x:184,y:166}]);
    function len(P){var s=0;for(var k=1;k<P.length;k++)s+=dist(P[k-1],P[k]);return s}
    function proj(P,p){var best={d:99,s:0},s=0;for(var k=1;k<P.length;k++){var r=segP(p,P[k-1],P[k]),L=dist(P[k-1],P[k]);if(r.d<best.d)best={d:r.d,s:s+r.t*L};s+=L}return best}
    function at(P,s){for(var k=1;k<P.length;k++){var L=dist(P[k-1],P[k]);if(s<=L||k===P.length-1){var t=clamp(s/L,0,1);return {x:P[k-1].x+(P[k].x-P[k-1].x)*t,y:P[k-1].y+(P[k].y-P[k-1].y)*t}}s-=L}}
    var LA=len(PA),LB=len(PB),sA=0,sB=0,on=false,done=false,tries=0,back=false,sR=0,END=PB[PB.length-1];
    function pl(P){return P.map(function(p){return p.x+' '+p.y}).join('L')}
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E8ECD0"><rect x="-400" y="176" width="1200" height="40" fill="#D6E0B0"/>'+
      '<path d="M-400 128Q80 112 160 124Q240 136 720 118" stroke="'+RIVER+'" stroke-width="18" fill="none"/>'+
      '<text x="262" y="114" font-size="14" font-weight="700" fill="#3E7EA8" text-anchor="middle" stroke="#E8ECD0" stroke-width="3" paint-order="stroke">急水溪</text>'+
      '<path d="M'+pl(PA)+'" stroke="#A89C90" stroke-width="6" fill="none" stroke-dasharray="7 5" stroke-linejoin="round"/>'+
      '<path d="M'+pl(PB)+'" stroke="'+RAIL+'" stroke-width="6" fill="none" stroke-linejoin="round"/>'+
      '<text x="62" y="80" font-size="13" font-weight="700" fill="#8A7A70" text-anchor="middle">往學甲</text>'+
      station(160,30,.42,{})+'<text x="210" y="28" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle">中興站</text>'+
      station(184,174,.36,{})+'<text x="244" y="168" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle">火燒店站</text>'+
      '<g id="lg"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),lg=svg.querySelector('#lg');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){var h='';
      function seg(P,sv,c){if(sv<1)return '';var pts=[P[0]],acc=0;for(var k=1;k<P.length;k++){var L=dist(P[k-1],P[k]);if(acc+L<=sv){pts.push(P[k]);acc+=L}else{pts.push(at(P,sv));break}}return '<path d="M'+pl(pts)+'" stroke="'+c+'" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'}
      h=seg(PB,sB,'#DB2E27')+(sA>sB+2?seg(PA,sA,'#DB2E27'):'');
      var tip=sA>sB+2?at(PA,sA):at(PB,sB);
      if(back){var rp=[at(PB,sR)],acc=0;for(var k=1;k<PB.length;k++){acc+=dist(PB[k-1],PB[k]);if(acc>sR)rp.push(PB[k])}
        if(sR<LB-1)h+='<path d="M'+pl(rp)+'" stroke="'+TIFF2+'" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
        tip=at(PB,sR)}
      h+='<circle cx="'+f1(tip.x)+'" cy="'+f1(tip.y)+'" r="'+(on?9:14)+'" fill="'+(back?TIFF2:'#DB2E27')+'" stroke="#fff" stroke-width="2.4"/>';
      if(!on&&!done&&!back&&sA<2&&sB<2)h+='<circle cx="160" cy="30" r="24" fill="none" stroke="#DB2E27" stroke-width="2.2" stroke-dasharray="4 3"/>';
      if(!on&&!done&&back&&sR>LB-2)h+='<circle cx="'+END.x+'" cy="'+END.y+'" r="24" fill="none" stroke="#DB2E27" stroke-width="2.2" stroke-dasharray="4 3"/>';
      lg.innerHTML=h;bar.style.width=(done?100:back?45+(LB-sR)/LB*45:sB/LB*45)+'%'}
    draw();
    function reset(){sA=0;sB=0;on=false;draw()}
    function fin(){on=false;done=true;sR=0;draw();lvDone(area,i,l,msg,'來回都描好了！去的時候和回來的時候，都跨過了<b>急水溪</b>。')}
    drag(svg,function(t,p){if(done)return;
      if(back){
        if(t==='down'){if(dist(p,END)<28){on=true;sR=LB;draw()}else say(msg,'從下面的<b>火燒店站</b>（紅色虛線圈圈）開始，描回中興站。',1);return}
        if(t==='move'&&on){var c=proj(PB,p);
          if(c.d>24){on=false;sR=LB;draw();say(msg,'離開鐵軌了。回到<b>火燒店站</b>，再沿著鐵軌描回中興站。',1);return}
          if(c.s>=sR-45)sR=Math.min(sR,c.s);draw();

          return}
        if(t==='up'&&on){on=false;if(!done){sR=LB;draw();say(msg,'手指放開了。從<b>火燒店站</b>再描一次，不要放開。',1)}}
        return}
      if(t==='down'){if(dist(p,{x:160,y:30})<28){on=true;sA=0;sB=0;draw()}else say(msg,'從上面的<b>中興站</b>（紅色虛線圈圈）開始描。',1);return}
      if(t==='move'&&on){var a=proj(PA,p),b=proj(PB,p);
        if(Math.min(a.d,b.d)>24){reset();say(msg,'離開鐵軌了。回到<b>中興站</b>，再沿著鐵軌描一次。',1);return}
        if(a.d<24&&a.s<=sA+45)sA=Math.max(sA,a.s);if(b.d<24&&b.s<=sB+45)sB=Math.max(sB,b.s);
        draw();
        if(sA>=LA-10&&sA>sB+20){tries++;reset();say(msg,'這條是往學甲的<b>學甲線</b>。學甲線 1979 年就不載客了，今天坐不到。回到中興站，往<b>南</b>描。',1);return}
        if(sB>=LB-10){on=false;back=true;sB=LB;sR=LB;draw();say(msg,'到<b>火燒店站</b>了！中間跨過了急水溪。現在從火燒店站，沿著鐵軌描回<b>中興站</b>。')}
        return}
      if(t==='up'&&on){on=false;if(!done){reset();say(msg,'手指放開了。從<b>中興站</b>再描一次，不要放開。',1)}}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','糖鐵路線圖，按 Enter 描出中興站到火燒店站');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();sB=LB;back=true;fin()}});
    later(function(){if(!done&&!on&&!back)say(msg,'在中興站按住，往下沿著<b>咖啡色的鐵軌</b>描，跨過藍色的急水溪。')},7000);
  },

  /* 第 5 關：鉛字的字是反過來的，從字盤點出反過來的數字，排出 1907 和 2001 */
  type:function(area,i,l){
    var ROW=['1907','2001'],r=0,c=0,done=false,lock=false;
    var TY=[['1',1],['9',1],['7',0],['3',1],['0',1],['2',0],['7',1],['5',1],['9',0],['2',1],['4',1],['6',1]],CX=[91,137,183,229],CY=[104,140,176];
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EDE6D6"><rect x="-400" y="160" width="1200" height="40" fill="#C8B898"/>'+
      '<rect x="60" y="84" width="200" height="110" rx="6" fill="#B8946A" stroke="#8A6A4A" stroke-width="1.6"/><g id="sg"></g><g id="tg"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),sg=svg.querySelector('#sg'),tg=svg.querySelector('#tg');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function blk(x,y,d,m,w,hi){return '<rect x="'+f1(x-w/2)+'" y="'+f1(y-w/2)+'" width="'+w+'" height="'+w+'" rx="3" fill="'+(hi?'#E8E0D4':'#C8C4C0')+'" stroke="#6A6460" stroke-width="1.6"/>'+
      '<text x="0" y="0" font-size="'+f1(w*.7)+'" font-weight="900" fill="#3A3430" text-anchor="middle" transform="translate('+f1(x)+' '+f1(y+w*.25)+')'+(m?' scale(-1 1)':'')+'">'+d+'</text>'}
    function draw(){var h='';
      ROW.forEach(function(rw,j){var y=24+j*34,n=j<r?4:j===r?c:0;
        h+='<rect x="34" y="'+(y-14)+'" width="124" height="28" rx="3" fill="#8A8480" opacity=".35"/>';
        for(var k=0;k<4;k++){var x=140-k*30;h+=k<n?blk(x,y,rw[k],1,26):'<rect x="'+(x-13)+'" y="'+(y-13)+'" width="26" height="26" rx="3" fill="none" stroke="#8A8480" stroke-width="1.2" stroke-dasharray="3 3"/>'}
        h+='<text x="176" y="'+(y+5)+'" font-size="13" fill="#8A7A70">印出來：</text><text x="232" y="'+(y+6)+'" font-size="18" font-weight="900" fill="#2A2020">'+rw.slice(0,n)+'</text>'});
      sg.innerHTML=h;
      tg.innerHTML=TY.map(function(t,j){return blk(CX[j%4],CY[Math.floor(j/4)],t[0],t[1],30)}).join('');
      bar.style.width=(done?100:(r*4+c)/8*90)+'%'}
    draw();
    function pick(j){if(done||lock)return;var t=TY[j],need=ROW[r][c];
      if(t[0]!==need){say(msg,'這個鉛字是 <b>'+t[0]+'</b>。現在要找 <b>'+need+'</b>。',1);return}
      if(!t[1]){say(msg,'這個 '+need+' 是<b>正的</b>，印出來會變成反的。找<b>反過來</b>的那一個 '+need+'。',1);return}
      c++;
      if(c>=4){c=0;r++;
        if(r>=2){done=true;draw();lvDone(area,i,l,msg,'印出來是 <b>2001</b>：糖廠在 2001 年前後不再製糖。');return}
        draw();say(msg,'印出來是 <b>1907</b>：鹽水港製糖在這一年開始蓋新營糖廠。再排 <b>2001</b>。');return}
      draw();say(msg,(r===0&&c===1?'排上去了！整排鉛字也是反的，所以從<b>右邊</b>往左排。':'排上去了！')+'下一個找 <b>'+ROW[r][c]+'</b>。')}
    drag(svg,function(t,p){if(t!=='down'||done)return;var b=-1,bd=24;TY.forEach(function(q,j){var d=dist(p,{x:CX[j%4],y:CY[Math.floor(j/4)]});if(d<bd){bd=d;b=j}});
      if(b<0){say(msg,'點下面字盤裡的<b>鉛字</b>。',1);return}pick(b)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','鉛字字盤，按 Enter 排上下一個數字');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var need=ROW[r][c];for(var j=0;j<TY.length;j++)if(TY[j][0]===need&&TY[j][1]){pick(j);break}}});
    later(function(){if(!done&&!r&&!c)say(msg,'第一個要找 <b>1</b>。字盤裡反過來的 1，旗子朝右邊。')},7000);
  },

  /* 第 6 關：三軌鐵道：上下拖中間那條鐵軌，拖到五分車的軌距 762 公厘（窄的給五分車，寬的給臺鐵） */
  gauge:function(area,i,l){
    var KK=.12,Y0=40,YT=Y0+762*KK,YO=Y0+1067*KK,my=Y0+460*KK,hold=false,done=false,sy=0,tw=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E4DCC8"><rect x="-400" y="176" width="1200" height="40" fill="#CFC3A8"/><g id="rg"></g><g id="wg"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),rg=svg.querySelector('#rg'),wg=svg.querySelector('#wg');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function mm(){return done?762:Math.round((my-Y0)/KK)}
    function draw(){var h='';
      for(var x=-40;x<=360;x+=16)h+='<rect x="'+x+'" y="'+(Y0-8)+'" width="8" height="'+(YO-Y0+16)+'" fill="'+TIE+'"/>';
      h+='<path d="M-400 '+Y0+'H720M-400 '+f1(YO)+'H720" stroke="'+RAIL+'" stroke-width="4"/>';
      var ok=done||Math.abs(my-YT)<6;
      h+='<path d="M-400 '+f1(my)+'H720" stroke="'+(hold?'#DB2E27':ok?'#3F6B2E':RAIL)+'" stroke-width="'+(hold?5:4)+'"/>';
      if(!done&&!hold)h+='<path d="M60 '+f1(my-14)+'l-6 8h12zM60 '+f1(my+14)+'l-6 -8h12zM260 '+f1(my-14)+'l-6 8h12zM260 '+f1(my+14)+'l-6 -8h12z" fill="#DB2E27"/>';
      // 量尺
      h+='<path d="M104 '+Y0+'V'+f1(my)+'" stroke="#DB2E27" stroke-width="1.6"/><path d="M98 '+Y0+'H110M98 '+f1(my)+'H110" stroke="#DB2E27" stroke-width="1.6"/>'+
        '<text x="112" y="'+f1((Y0+my)/2+5)+'" font-size="15" font-weight="900" fill="#DB2E27" stroke="#E4DCC8" stroke-width="3" paint-order="stroke">'+mm()+' 公厘</text>';
      h+='<text x="246" y="'+f1(YO+16)+'" font-size="13" font-weight="700" fill="#5A4A3A" text-anchor="middle" stroke="#E4DCC8" stroke-width="3" paint-order="stroke">臺鐵 1067 公厘</text>';
      rg.innerHTML=h;
      // 五分車的輪子（從上面看：一根軸、兩個輪子）
      var wx=done?200+tw*40:200,w='<path d="M'+wx+' '+(Y0-2)+'V'+f1(YT+2)+'" stroke="#4A4040" stroke-width="4"/><rect x="'+(wx-10)+'" y="'+(Y0-5)+'" width="20" height="8" rx="2" fill="#2A2020"/><rect x="'+(wx-10)+'" y="'+f1(YT-3)+'" width="20" height="8" rx="2" fill="#2A2020"/>'+
        '<text x="'+wx+'" y="'+f1(Y0-12)+'" font-size="13" font-weight="700" fill="#2A4E4A" text-anchor="middle">五分車的輪子</text>';
      if(done){var tx=150-tw*30;w+='<path d="M'+tx+' '+(Y0-2)+'V'+f1(YO+2)+'" stroke="#5A5A60" stroke-width="4"/><rect x="'+(tx-10)+'" y="'+(Y0-5)+'" width="20" height="8" rx="2" fill="#3A3A40"/><rect x="'+(tx-10)+'" y="'+f1(YO-3)+'" width="20" height="8" rx="2" fill="#3A3A40"/>'}
      wg.innerHTML=w;
      bar.style.width=(done?100:Math.max(0,90-Math.abs(my-YT)*2))+'%'}
    draw();
    function check(){if(done)return;
      if(Math.abs(my-YT)<6){my=YT;done=true;anim(function(dt){tw=Math.min(1,tw+dt*.8);draw();if(tw>=1)return false});draw();lvDone(area,i,l,msg,'剛好 <b>762 公厘</b>！五分車的輪子放上去了，臺鐵的車也能走外面那兩條。');return}
      if(my<YT)say(msg,'現在是 '+mm()+' 公厘，太<b>窄</b>了，五分車的輪子卡住放不上。往下拖寬一點。',1);
      else say(msg,'現在是 '+mm()+' 公厘，太<b>寬</b>了，五分車的輪子會掉下去。往上拖窄一點。',1)}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){if(Math.abs(p.y-my)<22&&p.x>30&&p.x<290){hold=true;sy=p.y-my;draw()}else say(msg,'按住<b>中間那條鐵軌</b>（有紅色小箭頭的），上下拖。',1);return}
      if(t==='move'&&hold){my=clamp(p.y-sy,Y0+300*KK,YO-60*KK);draw();return}
      if(t==='up'&&hold){hold=false;draw();check()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','三條鐵軌，按上下鍵移動中間那條，按 Enter 放五分車的輪子');
    svg.addEventListener('keydown',function(e){if(done)return;
      if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();my=clamp(my+(e.key==='ArrowUp'?-6:6),Y0+300*KK,YO-60*KK);draw()}
      else if(e.key==='Enter'||e.key===' '){e.preventDefault();check()}});
    later(function(){if(!done&&!hold)say(msg,'看紅色的數字。按住中間那條鐵軌往<b>下</b>拖，拖到 762 公厘。')},7000);
  }
};
</script>
