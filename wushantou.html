<h1>大圳任務・水利・官田烏山頭水庫</h1>
<p>跟著水利會的老技師看<b>烏山頭水庫</b>和<b>嘉南大圳</b>：對準高度挖通<b>烏山嶺隧道</b>、用水沖出大壩的<b>黏土心</b>、找出<b>珊瑚潭</b>的分枝、排好<b>三年輪作</b>、連 3 年開對水門，最後照舊照片蓋回<b>八田與一</b>的家。</p>
<p>地點：烏山頭（臺南市官田區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>臺南官田的山裡，有一座將近一百歲的水庫：烏山頭水庫。它和嘉南大圳一起，把水送到嘉南平原，讓這裡變成臺灣的米倉。蓋它的總工程師，是日本人八田與一。跟著水利會的老技師，看看 1920 年開工的大工程。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・烏山嶺：挖穿一座山</h3><p>光靠官田溪的雨水不夠。工程師在曾文溪上游的大埔溪蓋了取水閘門，再挖一條烏山嶺引水隧道，穿過整座烏山嶺，把大埔溪的水引過來，流進水庫。</p><p>為什麼？為什麼要從兩邊一起挖？ 兩邊一起挖，可以快一倍。可是兩邊要量得很準，不然在山裡會錯開、接不起來。</p></li>
<li><h3>第 2 關・大壩：用水沖出土壩</h3><p>八田與一用「半水成式」的方法蓋大壩：壩的兩邊堆石頭、礫石，正中間是很細的黏土，像一道看不見的牆，把水擋住、不讓它滲過去。整座大壩只用了 0.5% 的混凝土，其他都是卵石、礫石、碎石、溪沙和黏土。它原本預計用 50 年，到今天已經用了將近 100 年！</p><p>為什麼？為什麼中間要用細黏土？ 細黏土的顆粒很小，擠得很緊，水鑽不過去。粗石頭很重、很穩，放在兩邊把壩撐住。</p></li>
<li><h3>第 3 關・珊瑚潭：像珊瑚的水庫</h3><p>水庫蓄滿水以後，水流進一條一條的山谷。從天空往下看，水面一枝一枝的，好像珊瑚，所以烏山頭水庫又叫「珊瑚潭」。</p><p>為什麼？水庫的水從哪裡來？ 一部分是官田溪的雨水，一部分是從烏山嶺隧道引進來的大埔溪水。水庫利用官田、六甲、大內、東山之間低低的山谷，把水存起來。</p></li>
<li><h3>第 4 關・嘉南平原：三年輪作</h3><p>水不夠讓每一塊田都種稻。所以嘉南大圳想了一個辦法：「三年輪作」。田分成好幾區，每一區一年種水稻、一年種甘蔗、一年種雜作（像甘薯），輪流種。水稻和甘蔗才給水，雜作不給水。這樣水省下來，土地也能休息。</p><p>為什麼？為什麼要輪流種？ 同一塊地一直種一樣的作物，土會變累。輪流種，土地可以休息；不需要水的雜作那一年，也省下水給別的區用。</p></li>
<li><h3>第 5 關・水門：給水的開，不給的關</h3><p>嘉南大圳的水，從烏山頭水庫流出來，分成一條一條的給水路，送到嘉南平原，灌溉的地方差不多是臺灣的六分之一，有 15 萬公頃。三年輪作的時候，水稻和甘蔗的區要給水，雜作的區不給水。每一年，種的東西換了，要開的水門也跟著換。</p><p>為什麼？嘉南大圳的水送到多遠？ 從烏山頭水庫分成南、北幹線，一路送到臺南、嘉義、雲林。灌溉的地方，差不多是臺灣的六分之一那麼大。</p></li>
<li><h3>第 6 關・八田宅：照舊照片蓋回去</h3><p>水庫邊的八田與一紀念園區，是八田與一和工程師們以前住的日式宿舍，2011 年 5 月 8 日開幕。八田的家修復前只剩地基。修復的人跑到日本，向八田的家人借舊照片和手繪稿，照著蓋回來；院子裡還有一個臺灣形狀的水池。</p><p>為什麼？為什麼每年 5 月 8 日大家會來這裡？ 5 月 8 日是八田與一過世的日子。每年這一天，大家在水庫邊的八田與一銅像前追思他；這座銅像，是當年農民一起出錢做的。</p></li>
</ol>

    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){sl.innerHTML=SL.map(function(s){return s.on?part(s.k,s.x,s.y):'<circle cx="'+s.x+'" cy="'+s.y+'" r="12" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>'}).join('');
      it.innerHTML=IT.map(function(t){return t.on?'':part(t.k,t.x,t.y,hold===t?1:.6)}).join('');
      bar.style.width=(done?100:SL.filter(function(s){return s.on}).length/5*90)+'%'}
    draw();
    function drop(t){var best=26,s=null;SL.forEach(function(q){if(q.on)return;var d=dist(t,q);if(d<best){best=d;s=q}});
      if(!s){t.x=t.hx;t.y=t.hy;draw();say(msg,'拖到地基上的<b>紅色虛線圈圈</b>。看看右上角的舊照片。',1);return}
      if(s.k!==t.k){t.x=t.hx;t.y=t.hy;draw();say(msg,'這裡不是放<b>'+NM[t.k]+'</b>的地方。看看舊照片，'+NM[t.k]+'在哪裡？',1);return}
      s.on=true;t.on=true;draw();var n=SL.filter(function(q){return q.on}).length;
      if(n>=5){done=true;draw();lvDone(area,i,l,msg,'八田宅蓋回來了！');return}
      say(msg,NM[t.k]+'放好了！還有 '+(5-n)+' 個。')}
    drag(svg,function(tt,p){if(done)return;
      if(tt==='down'){hold=null;var best=26;IT.forEach(function(t){if(t.on)return;var d=dist(p,t);if(d<best){best=d;hold=t}});if(hold){off={x:p.x-hold.x,y:p.y-hold.y};draw()}else say(msg,'按住下面的<b>屋頂、門、窗或水池</b>，拖到地基上。',1);return}
      if(tt==='move'&&hold){hold.x=p.x-off.x;hold.y=p.y-off.y;draw();return}
      if(tt==='up'&&hold){var t=hold;hold=null;drop(t)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','八田宅的地基和舊照片，按 Enter 放回一個部分');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var t=IT.filter(function(t){return !t.on})[0],s=SL.filter(function(q){return !q.on&&q.k===t.k})[0];t.x=s.x;t.y=s.y;drop(t)}});
    later(function(){if(!SL.some(function(s){return s.on}))say(msg,'看右上角的<b>舊照片</b>：屋頂在最上面。先把<b>屋頂</b>拖上去。')},6000);
  }
};
