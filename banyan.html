<h1>大榕樹任務・老樹・成大榕園</h1>
<p>跟著在成大念書的大姊姊，走到 1923 年種下的<b>老榕</b>樹蔭下：梳開打結的<b>氣根</b>、在時間尺上找出另外兩棵樹種下的年份、配出<b>禮賢樓</b>門廊左右對稱的柱子、颱風前先撐住最粗的樹枝，最後躺在樹下數雲。</p>
<p>地點：成大榕園（臺南市東區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>臺南東區的成功大學裡，有一片大榕樹，叫榕園。最大的那棵老榕，是 1923 年種下的，已經種下一百年了。以前，這裡是軍隊的營區；後來，才變成大學。跟著在成大念書的大姊姊，到榕園走一走、看一看。每過一關，就能蓋一個章。</p><h2>關卡</h2><ol>
<li><h3>第 1 關・大草地：走到大樹的樹蔭下</h3><p>從校門走進來，前面是一大片草地。遠遠的那棵大樹，就是老榕。大姊姊說：「報紙形容它的樹冠像一朵香菇頭。走近一點看，會更大喔。」</p><p>為什麼？這棵大樹幾歲了？ 老榕是 1923 年種下的，到 2023 年，剛好種下一百年。它種下的時候已經多大，查到的資料太少，所以我們只算它種下幾年。</p></li>
<li><h3>第 2 關・老榕：幫大樹梳鬍子</h3><p>走近一看，樹枝上垂下一條一條細細的東西，好像鬍子。那是氣根：從樹枝長出來、掛在空氣裡的根。氣根一直往下長，碰到土，就會鑽進去，越長越粗，變成支柱根。</p><p>為什麼？為什麼榕樹會長鬍子？ 那些鬍子是氣根。氣根往下長，碰到地面就鑽進土裡，越長越粗，變成像樹幹一樣的支柱根，幫忙撐住大樹。柱子越來越多，一棵樹慢慢長得像一片樹林，這叫獨木成林。</p></li>
<li><h3>第 3 關・老榕西邊：另外兩棵樹在哪裡？</h3><p>1923 年，日本的皇太子（後來的昭和天皇）到這裡的營區，看完閱兵，種下了老榕。後來，又有兩位日本的皇族（天皇家的人），在老榕的西邊各種了一棵榕樹：一棵在西邊大約 20 公尺，一棵在大約 40 公尺。</p><p>為什麼？為什麼西邊那兩棵不見了？ 有人把歷年的照片拿來比一比，推測那兩棵樹已經不在了。它們為什麼不在了？現在還沒有查到。今天老榕旁邊的那些榕樹，應該是後來才長出來的。</p></li>
<li><h3>第 4 關・禮賢樓：左右對稱的門廊</h3><p>榕園旁邊有幾棟老房子，大約一百多年前蓋的，以前是日本軍隊的營舍。後來換成國軍的營區，1966 年轉給成功大學。現在，這些老房子是國定古蹟。其中一棟叫禮賢樓，以前是軍隊的本部。它最漂亮的地方，是用圓柱撐起屋簷的羅馬式門廊。</p><p>為什麼？為什麼軍營變成了大學？ 日本時代，這裡是日本軍隊的營區。後來，換成國軍的營區。1966 年，這塊地轉給成功大學，變成成大的光復校區。老房子留了下來，現在變成大學的系館。</p></li>
<li><h3>第 5 關・另一棵榕樹：颱風來了，撐住樹枝</h3><p>2015 年，颱風來的時候，把榕園的一棵榕樹吹壞了。大家很心疼，校友一起捐錢，存了 500 萬元的護樹基金，用來照顧榕園的大樹。</p><p>為什麼？為什麼老樹要人照顧？ 老樹會生病，也怕颱風。1994 年老榕生病，有公司和校友捐錢照顧它；2015 年颱風吹壞了一棵榕樹，校友又募了護樹基金。後來，學校也把校園裡的老樹登記起來，定期照顧。</p></li>
<li><h3>第 6 關・樹蔭下：躺著數雲</h3><p>最後，大姊姊說：「我們來數雲吧！」抬頭往上看，樹冠密密的葉子中間，有幾個小小的縫。白白的雲，慢慢從縫裡飄過去。</p><p>為什麼？榕園數雲是什麼？ 有一說，躺在榕樹下看雲，叫做榕園數雲，以前是成大挑出來的十個最好看的地方（十景）之一，後來變成臺南很有名的景點。</p></li>
</ol>

  /* 第 3 關：時間尺。照線索（晚 2 年、再晚 1 年）點出年份，點錯會說早一點、晚一點；找到後看今天的樣子 */
  years:function(area,i,l){
    var Y0=1922,X0=40,DX=40,RY=150,T=[{y:1925,x:170,m:'20 公尺'},{y:1926,x:90,m:'40 公尺'}],k=0,done=false,today=false,pick=-1;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:'+SKY+'"><rect x="-400" y="112" width="1200" height="120" fill="'+GRASS+'"/>'+
      '<path d="M44 26H8M14 20L8 26L14 32" stroke="#6C2024" stroke-width="2" fill="none" stroke-linecap="round"/><text x="50" y="31" font-size="13" font-weight="700" fill="#6C2024">西邊</text>'+
      '<g id="tg"></g><g id="rg"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),tg=svg.querySelector('#tg'),rg=svg.querySelector('#rg');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){var h=banyan(250,112,.42,{young:0,props:[]})+'<text x="250" y="128" font-size="13" font-weight="700" fill="#6C2024" text-anchor="middle">老榕 1923</text>';
      T.forEach(function(t,j){var planted=j<k||done;
        if(planted&&!today)h+=banyan(t.x,112,1.3,{young:1,seed:j+2})+'<text x="'+t.x+'" y="128" font-size="13" font-weight="700" fill="#6C2024" text-anchor="middle">'+t.y+'</text>';
        else h+='<ellipse cx="'+t.x+'" cy="106" rx="18" ry="6" fill="none" stroke="#8A7A70" stroke-width="1.6" stroke-dasharray="3 3"/><text x="'+t.x+'" y="100" font-size="15" font-weight="700" fill="#8A7A70" text-anchor="middle">'+(today?'不在了？':'?')+'</text><text x="'+t.x+'" y="128" font-size="13" fill="#5A6A4A" text-anchor="middle">西邊 '+t.m+'</text>'});
      if(today)h+='<text x="160" y="50" font-size="15" font-weight="900" fill="#2A2020" text-anchor="middle" stroke="'+SKY+'" stroke-width="4" paint-order="stroke">今天的老榕西邊</text>';
      tg.innerHTML=h;
      var r='<rect x="18" y="'+(RY-14)+'" width="284" height="46" rx="8" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.4"/><path d="M'+X0+' '+RY+'H'+(X0+DX*6)+'" stroke="#8A6A4A" stroke-width="2"/>';
      for(var j=0;j<7;j++){var yr=Y0+j,x=X0+j*DX,on=yr===1923||T.some(function(t,m){return t.y===yr&&(m<k||done)}),bad=j===pick;
        r+='<path d="M'+x+' '+(RY-6)+'V'+(RY+6)+'" stroke="#8A6A4A" stroke-width="2"/>'+(on?'<circle cx="'+x+'" cy="'+RY+'" r="7" fill="#3F6B2E"/>':bad?'<circle cx="'+x+'" cy="'+RY+'" r="7" fill="none" stroke="#DB2E27" stroke-width="2"/>':'')+
          '<text x="'+x+'" y="'+(RY+24)+'" font-size="13" font-weight="'+(on?900:400)+'" fill="'+(on?'#3F6B2E':'#2A2020')+'" text-anchor="middle">'+yr+'</text>'}
      rg.innerHTML=r;bar.style.width=(done?100:k/2*90)+'%'}
    draw();
    function choose(j){if(done)return;var yr=Y0+j,t=T[k];pick=-1;
      if(yr===1923){say(msg,'<b>1923 年</b>是老榕種下的那一年。要找的是後來的兩棵。',1);draw();return}
      if(T.some(function(q,m){return m<k&&q.y===yr})){say(msg,yr+' 年已經找到了。',1);return}
      if(yr!==t.y){pick=j;draw();say(msg,yr<t.y?'太早了，再<b>晚一點</b>。':'太晚了，再<b>早一點</b>。',1);return}
      k++;draw();
      if(k<2){say(msg,'<b>1925 年</b>，老榕西邊大約 20 公尺，種下了第二棵。第三棵又晚 1 年，是哪一年？');return}
      done=true;draw();say(msg,'<b>1926 年</b>，西邊大約 40 公尺，種下了第三棵。那今天呢……');
      wait(function(){today=true;draw();lvDone(area,i,l,msg,'今天的老榕西邊，看不到那兩棵樹了。')},1600)}
    drag(svg,function(t,p){if(done||t!=='down')return;
      if(p.y<RY-26){say(msg,'點下面<b>時間尺</b>上的年份。',1);return}
      var j=Math.round((p.x-X0)/DX);if(j<0||j>6||Math.abs(p.x-(X0+j*DX))>22){say(msg,'點時間尺上的<b>年份</b>。',1);return}choose(j)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','1922 到 1928 年的時間尺，按 Enter 點出下一個年份');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();choose(T[k].y-Y0)}});
    later(function(){if(!done&&!k)say(msg,'老榕是 1923 年種的。晚 2 年，是 1923 加 2……')},8000);
  },

  /* 第 4 關：門廊左右對稱。點一根柱子，再點另一邊一樣位置的那一根，配成一對（3 對） */
  pairs:function(area,i,l){
    var CX=[85,115,145,175,205,235],sel=-1,pair={},np=0,done=false,COL=['#DB2E27','#3E7EA8','#E0A030'];
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:'+SKY+'"><rect x="-400" y="170" width="1200" height="40" fill="'+GRASS+'"/>'+
      '<rect x="-20" y="66" width="90" height="104" fill="'+BRICK+'" stroke="'+BRICKD+'" stroke-width="1.4"/><rect x="250" y="66" width="90" height="104" fill="'+BRICK+'" stroke="'+BRICKD+'" stroke-width="1.4"/>'+
      '<rect x="12" y="92" width="18" height="30" rx="8" fill="#F4ECDC" stroke="'+BRICKD+'" stroke-width="1"/><rect x="290" y="92" width="18" height="30" rx="8" fill="#F4ECDC" stroke="'+BRICKD+'" stroke-width="1"/>'+
      '<path d="M-26 66H346L336 54H-16Z" fill="#7A6A62"/>'+
      '<rect x="66" y="64" width="188" height="100" fill="#E8DCC4"/><rect x="96" y="96" width="128" height="68" rx="3" fill="#B8A888"/><rect x="136" y="108" width="48" height="56" rx="20" fill="#6A5444"/>'+
      '<g id="pd"></g><rect x="58" y="160" width="204" height="6" fill="#D8CCB0"/><rect x="50" y="165" width="220" height="6" fill="#C8BCA0"/><g id="cg"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),pd=svg.querySelector('#pd'),cg=svg.querySelector('#cg');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){
      pd.innerHTML='<path d="M60 66L160 26L260 66Z" fill="'+(done?'#FFF4C8':STONE)+'" stroke="'+(done?'#BD9558':'#B8A888')+'" stroke-width="'+(done?3:1.8)+'"/><path d="M80 62L160 32L240 62Z" fill="none" stroke="#C8B898" stroke-width="1.2"/><rect x="60" y="64" width="200" height="8" fill="#E8DCC4" stroke="#B8A888" stroke-width="1"/>'+
        (done?'<path d="M160 20V178" stroke="#6C2024" stroke-width="2" stroke-dasharray="5 4"/>':'');
      var h='';CX.forEach(function(x,j){var p=pair[j],on=sel===j;
        h+='<rect x="'+(x-7)+'" y="76" width="14" height="84" fill="'+(on?'#FFE8C8':'#FFFDF6')+'" stroke="'+(p!==undefined?COL[p]:on?'#DB2E27':'#B8A888')+'" stroke-width="'+(p!==undefined||on?2.6:1.2)+'"/><rect x="'+(x-10)+'" y="72" width="20" height="6" fill="#F2EADA" stroke="#B8A888" stroke-width="1"/><rect x="'+(x-10)+'" y="156" width="20" height="5" fill="#F2EADA" stroke="#B8A888" stroke-width="1"/>'+
          (p!==undefined?'<circle cx="'+x+'" cy="118" r="8" fill="'+COL[p]+'"/><text x="'+x+'" y="123" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">'+(p+1)+'</text>':'')});
      cg.innerHTML=h;bar.style.width=(done?100:np/3*90)+'%'}
    draw();
    function side(j){return j<3?0:1}
    function hit(j){if(done)return;
      if(pair[j]!==undefined){say(msg,'這根已經配好了，找還沒有號碼的柱子。',1);return}
      if(sel<0||sel===j){sel=sel===j?-1:j;draw();if(sel>=0)say(msg,'選了'+(side(j)?'右':'左')+'邊從外面數來第 <b>'+(side(j)?6-j:j+1)+'</b> 根。再點<b>另一邊</b>和它一樣位置的柱子。');return}
      if(side(sel)===side(j)){sel=j;draw();say(msg,'換成這一根了。要配的是<b>另一邊</b>的柱子。');return}
      if(sel+j!==5){var a=side(sel)?6-sel:sel+1,b=side(j)?6-j:j+1;sel=-1;draw();say(msg,'不是一對：一根是從外面數來第 '+a+' 根，另一根是第 '+b+' 根。從<b>外面往中間</b>數，位置要一樣。',1);return}
      pair[sel]=pair[j]=np;np++;sel=-1;draw();
      if(np>=3){done=true;draw();lvDone(area,i,l,msg,'3 對都配好了！從中間畫一條線，左右兩邊一模一樣，這就是<b>對稱</b>。');return}
      say(msg,'配成一對了！還有 '+(3-np)+' 對。')}
    drag(svg,function(t,p){if(done||t!=='down')return;
      var b=-1,bd=22;CX.forEach(function(x,j){var d=Math.abs(p.x-x);if(d<bd){bd=d;b=j}});
      if(b<0||p.y<40||p.y>176){say(msg,'點門廊下面白色的<b>圓柱</b>。',1);return}hit(b)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','有六根圓柱的門廊，按 Enter 配出一對對稱的柱子');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();for(var j=0;j<3;j++)if(pair[j]===undefined){sel=j;hit(5-j);break}}});
    later(function(){if(!done&&sel<0&&!np)say(msg,'先點<b>最左邊</b>的柱子，再點<b>最右邊</b>的柱子試試看。')},7000);
  },

  /* 第 5 關：颱風要來，把支撐架拖到樹枝下面撐住，要照粗細，先撐最粗的 */
  brace:function(area,i,l){
    var GY=172,B=[{w:14,x1:160,y1:98,x2:52,y2:104,tx:72},{w:9,x1:160,y1:86,x2:278,y2:90,tx:256},{w:5,x1:160,y1:122,x2:232,y2:130,tx:212}],PL={x:126,y:166},hold=false,hx=0,hy=0,done=false,n=0,tm=0,windy=1;
    B.forEach(function(b){b.ok=false});
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#C8D8E0"><rect x="-400" y="'+GY+'" width="1200" height="40" fill="'+GRASS+'"/><g id="wg"></g>'+
      '<path d="M146 '+GY+'Q150 120 148 60H172Q170 120 174 '+GY+'Z" fill="'+BARK+'" stroke="'+BARKD+'" stroke-width="1.6"/>'+crown(160,62,140,52,6)+'<g id="bg"></g><g id="pg"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),wg=svg.querySelector('#wg'),bg=svg.querySelector('#bg'),pg=svg.querySelector('#pg');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function by(b,x){var t=(x-b.x1)/(b.x2-b.x1);return b.y1+(b.y2-b.y1)*t+sway(b)*t}
    function sway(b){return b.ok?0:Math.sin(tm*3+b.w)*windy*(18-b.w)*.4}
    function draw(){var h='';
      B.forEach(function(b){var ey=b.y2+sway(b);h+='<path d="M'+b.x1+' '+b.y1+'Q'+f1((b.x1+b.x2)/2)+' '+f1((b.y1+ey)/2-6)+' '+b.x2+' '+f1(ey)+'" stroke="'+BARK+'" stroke-width="'+b.w+'" fill="none" stroke-linecap="round"/>'+
        '<circle cx="'+b.x2+'" cy="'+f1(ey-6)+'" r="'+(b.w+6)+'" fill="'+LEAFL+'"/>'+
        (b.ok?prop(b.tx,GY,GY-by(b,b.tx)-2):(!done&&!hold?'':'<path d="M'+b.tx+' '+(GY-4)+'V'+f1(by(b,b.tx)+10)+'" stroke="#fff" stroke-width="2" stroke-dasharray="4 4" opacity=".8"/>'))});
      bg.innerHTML=h;
      var w='';for(var k=0;k<4;k++){var x=((tm*(60+k*20)+k*90)%420)-50;w+='<path d="M'+f1(x)+' '+(30+k*36)+'q20 -8 40 0" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="'+(windy>1?.9:.5)+'"/>'}wg.innerHTML=w;
      pg.innerHTML=(n<3?'<g transform="translate('+PL.x+' '+PL.y+')"><path d="M-22 2L22 -4M-22 8L22 2" stroke="#B8925A" stroke-width="5" stroke-linecap="round"/>'+(!hold&&!done?'<circle r="24" fill="none" stroke="#DB2E27" stroke-width="2.2" stroke-dasharray="4 3"/>':'')+'</g>':'')+
        (hold?prop(hx,hy+30,30):'');
      bar.style.width=(done?100:n/3*90)+'%'}
    draw();
    anim(function(dt){tm+=dt;draw()});
    function next(){var m=null;B.forEach(function(b){if(!b.ok&&(!m||b.w>m.w))m=b});return m}
    function drop(x){var t=null,bd=26;B.forEach(function(b){var d=Math.abs(x-b.tx);if(d<bd){bd=d;t=b}});
      if(!t){say(msg,'把支撐架拖到<b>樹枝</b>的下面，放在樹枝快到尾巴的地方。',1);return}
      if(t.ok){say(msg,'這根已經撐好了。',1);return}
      if(t!==next()){say(msg,'這根比較細。先撐<b>最粗、最重</b>的那根，它最容易被風吹斷。',1);return}
      t.ok=true;n++;draw();
      if(n>=3){done=true;windy=2.4;wait(function(){windy=1;lvDone(area,i,l,msg,'大風吹過來，3 根樹枝都被撐住了，沒有斷！')},1400);return}
      say(msg,n===1?'撐住最粗的那根了！接下來是第二粗的。':'撐好了！還剩最細的那根。')}
    drag(svg,function(t,p){if(done||n>=3)return;
      if(t==='down'){if(dist(p,PL)<30){hold=true;hx=p.x;hy=p.y-20;draw()}else say(msg,'按住下面紅色虛線圈圈裡的<b>支撐架</b>，拖到樹枝下面。',1);return}
      if(t==='move'&&hold){hx=clamp(p.x,10,310);hy=clamp(p.y-20,40,160);draw();return}
      if(t==='up'&&hold){hold=false;drop(hx);draw()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','颱風前的大樹和三根樹枝，按 Enter 撐住最粗的樹枝');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var b=next();if(b)drop(b.tx)}});
    later(function(){if(!done&&!n)say(msg,'看看哪根樹枝最<b>粗</b>？左邊那根最粗。')},8000);
  },

  /* 第 6 關：躺著往上看，雲飄過樹冠的縫，飄到縫裡才點得到，數 5 朵 */
  clouds:function(area,i,l){
    var H=[{x:88,y:66,r:32},{x:220,y:58,r:30},{x:160,y:134,r:32}],C=[],n=0,done=false,id=0;
    function add(x,lane){C.push({x:x,y:lane?134:62,sp:20+(id%3)*4,k:++id,got:0})}
    add(20,0);add(-80,0);add(-180,0);add(70,1);add(-40,1);add(-150,1);
    var hole=H.map(function(h){return 'M'+(h.x-h.r)+' '+h.y+'a'+h.r+' '+h.r+' 0 1 0 '+(h.r*2)+' 0a'+h.r+' '+h.r+' 0 1 0 '+(-h.r*2)+' 0Z'}).join('');
    var leaf='';var r=rnd(12);for(var k=0;k<150;k++){var x=r()*430-55,y=r()*390-100;if(H.some(function(h){return Math.hypot(x-h.x,y-h.y)<h.r+10}))continue;leaf+='<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+f1(8+r()*8)+'" fill="'+(k%2?LEAFL:LEAFD)+'"/>'}
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:'+LEAF+';overflow:visible"><rect x="-400" y="0" width="1200" height="190" fill="#8EC4E8"/><g id="cg"></g>'+
      '<path d="M-400 -300H800V600H-400Z'+hole+'" fill="'+LEAF+'" fill-rule="evenodd"/>'+leaf+
      H.map(function(h){return '<circle cx="'+h.x+'" cy="'+h.y+'" r="'+h.r+'" fill="none" stroke="'+LEAFD+'" stroke-width="4"/>'}).join('')+
      '<path d="M-60 192L-10 180Q80 150 150 172M380 -20L330 10Q270 40 250 100" stroke="'+BARK+'" stroke-width="9" fill="none" stroke-linecap="round"/><g id="ng"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),cg=svg.querySelector('#cg'),ng=svg.querySelector('#ng');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function inHole(c){return H.some(function(h){return Math.hypot(c.x-h.x,c.y-h.y)<h.r-6})}
    function draw(){cg.innerHTML=C.map(function(c){return cloud(c.x,c.y,.62,c.got?'#FFF4C8':'#fff')}).join('');
      ng.innerHTML=C.filter(function(c){return c.got&&inHole(c)}).map(function(c){return '<circle cx="'+f1(c.x)+'" cy="'+f1(c.y-4)+'" r="10" fill="#DB2E27"/><text x="'+f1(c.x)+'" y="'+f1(c.y+1)+'" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">'+c.got+'</text>'}).join('')+
        '<text x="160" y="20" font-size="15" font-weight="900" fill="#fff" text-anchor="middle" stroke="'+LEAFD+'" stroke-width="4" paint-order="stroke">數到 '+n+' 朵</text>';
      bar.style.width=(done?100:n/5*90)+'%'}
    draw();
    anim(function(dt){C.forEach(function(c){c.x+=c.sp*dt;if(c.x>370){c.x=-50;c.got=0;c.sp=20+(++id%3)*4}});draw()});
    function count(c){n++;c.got=n;draw();
      if(n>=5){done=true;lvDone(area,i,l,msg,'數到 5 朵了！樹縫裡的雲，一朵一朵慢慢飄過去。');return}
      say(msg,'第 <b>'+n+'</b> 朵！')}
    drag(svg,function(t,p){if(done||t!=='down')return;
      var b=null,bd=30;C.forEach(function(c){var d=dist(p,c);if(d<bd){bd=d;b=c}});
      if(!b){say(msg,H.some(function(h){return dist(p,h)<h.r})?'這個樹縫現在沒有雲，等雲飄過來。':'點<b>樹縫</b>裡的雲。',1);return}
      if(b.got){say(msg,'這朵已經數過了，等下一朵。',1);return}
      if(!inHole(b)){say(msg,'這朵雲被葉子擋住了，等它飄到<b>樹縫</b>裡再點。',1);return}
      count(b)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','從樹下往上看的樹縫和雲，按 Enter 數樹縫裡的雲');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var c=C.filter(function(x){return !x.got&&inHole(x)})[0];if(c)count(c);else say(msg,'現在樹縫裡沒有雲，等一下再按。',1)}});
    later(function(){if(!done&&!n)say(msg,'看左上角的<b>樹縫</b>，雲飄進去的時候點它。')},7000);
  }
};
</script>
