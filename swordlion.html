<h1>劍獅任務・民俗・安平老街劍獅</h1>
<p>跟著住在安平的阿嬤找<b>劍獅</b>：抬頭找門楣上的劍獅和屋頂的<b>風獅爺</b>、聽獅面盾牌的<b>傳說</b>嚇跑小偷、照心願把劍推進獅子嘴巴、看劍獅把信送到對的家、在<b>海山館</b>擺好刀劍屏，再做一片自己的劍獅門牌。</p>
<p>地點：安平（臺南市安平區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>臺南安平的老街和小巷子裡，很多老房子的門上有一張獅子臉，嘴巴還咬著劍。牠叫劍獅，是安平人家的守護神。安平老街大約七百多公尺長，新的、舊的劍獅加起來有上百個，而且每一隻都長得不一樣。跟著住在安平的阿嬤，走進老街和巷子找劍獅。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・老街：抬頭找一找</h3><p>走在延平街上，大家都在看小吃和店家。阿嬤說：「找劍獅，要抬頭。」以前的劍獅，多半放在大門上面的門楣，或是門前的照壁上。有些老屋的屋頂上，還站著一隻風獅爺。</p><p>為什麼？劍獅和風獅爺有什麼不一樣？ 劍獅是一張獅子臉，嘴巴咬著劍，多半在門上；風獅爺是一整隻站著的獅子，放在屋頂上。兩個都是用來避邪、保護一家人的。</p></li>
<li><h3>第 2 關・劍獅埕：獅面盾牌的傳說</h3><p>老街上有一個地方叫劍獅埕。阿嬤說了一個傳說：很久以前，鄭成功的水師住在安平。士兵練完兵回家，把畫著獅子臉的盾牌和劍放在家門口。晚上小偷看到，嚇得不敢進來。大家就照著做，慢慢變成了門上的劍獅。</p><p>為什麼？這個傳說是真的嗎？ 沒有人能證明，所以叫傳說。可以確定的是：鄭成功的軍隊真的在安平待過，安平人也真的家家戶戶掛劍獅，掛了好幾百年。</p></li>
<li><h3>第 3 關・小巷子：劍要咬哪一邊</h3><p>阿嬤帶你走進窄窄的小巷子。每一隻劍獅咬劍的樣子都不太一樣。安平人常說：劍柄在左邊，是祈福；劍柄在右邊，是避邪；咬兩把劍，是鎮宅。</p><p>為什麼？為什麼劍獅要咬劍？ 獅子看起來已經很兇，再咬一把劍，就更厲害了。安平人相信這樣，不好的東西就不敢靠近家門。</p></li>
<li><h3>第 4 關・沒有門牌：信要送給哪一家</h3><p>以前安平的房子沒有門牌號碼。那要怎麼找到朋友的家？看劍獅！每一家的劍獅都不一樣：額頭有的畫「王」字，有的畫八卦；有的咬一把劍，有的咬兩把；臉的顏色也不同（有一說：紅色是有錢人家，青黑色是一般人家）。</p><p>為什麼？每一隻劍獅都長得不一樣嗎？ 老劍獅有木雕、泥塑、石雕、陶土做的，大小、顏色、表情都不同，所以大家說安平沒有兩隻一模一樣的劍獅。</p></li>
<li><h3>第 5 關・海山館：刀劍屏擋在中間</h3><p>阿嬤帶你到海山館。它是一座三合院，也是安平現在最大的古宅。以前這裡住的是清朝的班兵，從福建一批一批輪流派來，守住安平的海口。海山館的大門一打開，就直直對著裡面的大廳。所以大門和大廳中間，放了一面刀劍屏：把直直衝進來的東西擋住，人從旁邊繞過去就好。</p><p>為什麼？海山館還有什麼避邪的東西？ 它的窗子做成八角形，照著八卦的樣子，也是用來避邪的。館裡還有劍獅的展覽。</p></li>
<li><h3>第 6 關・劍獅門牌：做一片自己的劍獅</h3><p>路開寬了、老房子改建了，老劍獅越來越少。2007 年起，安平人找回二十幾隻兩、三百歲的老劍獅，請專家修好，也開始做新的劍獅。陶藝老師還帶著社區的人，用陶土做劍獅門牌，五年多做了四百多片，每一片都不一樣。</p><p>為什麼？劍獅現在還有什麼用？ 劍獅變成安平的代表，有人叫牠臺灣的「第十三生肖」。店家的招牌、紀念品，還有區公所做的防災方巾上，都看得到可愛的劍獅。</p></li>
</ol>

<script>

/* ---------- 插畫元件 ---------- */
var K='#2A2020',NS='http://www.w3.org/2000/svg';
var LAND='#E6DCC4',SEA='#7EB8D6',SEA2='#5A9AC0',SAND='#EED9A4',SAND2='#D8BE84',WALL='#E8D8BC',WALL2='#B89A70',ROOF='#B8503A',ROOF2='#8A3A28',WOOD='#7A4A2A',LANE='#D8CCB0';
var LRED='#C8402E',LBLK='#3E4A50',LYEL='#C89A50',MANE={'#C8402E':'#8A2A1E','#3E4A50':'#22292E','#C89A50':'#8A6A30'};
function f1(v){return (Math.round(v*10)/10).toString()}
// 劍（從旁邊看）：dir 1 劍柄在左、劍尖朝右
function sword(x,y,dir,len,rot){var L=len/2,h='<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+(rot||0)+') scale('+dir+' 1)">';
  h+='<path d="M'+(-L+15)+' -2.8H'+(L-7)+'L'+L+' 0L'+(L-7)+' 2.8H'+(-L+15)+'Z" fill="#D8DCE0" stroke="#7A8088" stroke-width="1"/><path d="M'+(-L+16)+' 0H'+(L-9)+'" stroke="#9AA0A8" stroke-width=".8"/>';
  h+='<rect x="'+(-L+13)+'" y="-6.5" width="3.4" height="13" rx="1.2" fill="#BD9558"/><rect x="'+(-L)+'" y="-2.6" width="14" height="5.2" rx="2.2" fill="'+WOOD+'"/>';
  return h+'</g>'}
// 劍獅：o.c 臉的顏色、o.f 額頭（'王'、'卦'、''）、o.w 劍（'L' 劍柄在左、'R' 劍柄在右、'2' 兩把、'' 沒有）
function lion(x,y,s,o){o=o||{};var c=o.c||LRED,m=MANE[c]||'#8A2A1E',h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s)+')">';
  for(var k=0;k<12;k++){var a=k*Math.PI/6;h+='<circle cx="'+f1(Math.cos(a)*22)+'" cy="'+f1(Math.sin(a)*22)+'" r="8.5" fill="'+m+'"/>'}
  h+='<circle r="22" fill="'+c+'" stroke="'+m+'" stroke-width="1.6"/>';
  if(o.f==='王')h+='<path d="M-6 -18H6M-5 -13.5H5M-6.5 -9H6.5M0 -18V-9" stroke="#FFE6A0" stroke-width="2" stroke-linecap="round"/>';
  if(o.f==='卦')h+='<path d="M0 -20.5L5 -18.4L7 -13.5L5 -8.6L0 -6.5L-5 -8.6L-7 -13.5L-5 -18.4Z" fill="none" stroke="#FFE6A0" stroke-width="1.6"/><path d="M-3.4 -16H3.4M-3.4 -13.5H-.8M.8 -13.5H3.4M-3.4 -11H3.4" stroke="#FFE6A0" stroke-width="1.3"/>';
  h+='<path d="M-15 -5Q-9 -9 -3 -5M3 -5Q9 -9 15 -5" stroke="'+K+'" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
  h+='<circle cx="-8.5" cy="0" r="5" fill="#fff" stroke="'+K+'" stroke-width="1.2"/><circle cx="8.5" cy="0" r="5" fill="#fff" stroke="'+K+'" stroke-width="1.2"/><circle cx="-8.5" cy=".6" r="2.4" fill="'+K+'"/><circle cx="8.5" cy=".6" r="2.4" fill="'+K+'"/>';
  h+='<ellipse cy="7" rx="4.6" ry="3.2" fill="'+m+'"/><rect x="-12" y="10.5" width="24" height="8.5" rx="3.5" fill="#5A1A14"/>';
  if(o.w==='L'||o.w==='R')h+=sword(0,14.6,o.w==='L'?1:-1,64);
  if(o.w==='2')h+=sword(0,14.6,1,64,-11)+sword(0,14.6,-1,64,-11);
  h+='<path d="M-11 10.5L-8.5 14L-6 10.5M6 10.5L8.5 14L11 10.5" fill="#fff"/>';
  return h+'</g>'}
// 風獅爺：站在屋頂上的整隻獅子（腳在 y）
function windLion(x,y,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s)+')"><rect x="-6.5" y="-19" width="13" height="19" rx="4.5" fill="'+LYEL+'" stroke="#8A6A30" stroke-width="1.2"/><circle cy="-26" r="9.5" fill="#8A6A30"/><circle cy="-26" r="6.8" fill="'+LYEL+'"/><circle cx="-2.6" cy="-27" r="1.3" fill="'+K+'"/><circle cx="2.6" cy="-27" r="1.3" fill="'+K+'"/><path d="M-3 -22.5H3" stroke="'+K+'" stroke-width="1.4"/></g>'}
// 老房子（從前面看）：左邊 x、地面 y、寬 w、牆高 h；o.lion 門楣上的劍獅、o.wind 屋頂上的風獅爺、o.bagua 門上的八卦
function house(x,y,w,h,o){o=o||{};var dw=w*.4,dh=Math.min(h*.72,o.dh||999),cx=x+w/2,s='';
  s+='<rect x="'+x+'" y="'+(y-h)+'" width="'+w+'" height="'+h+'" fill="'+(o.wall||WALL)+'" stroke="'+WALL2+'" stroke-width="1.4"/>';
  s+='<path d="M'+(x-7)+' '+(y-h)+'Q'+cx+' '+(y-h-10)+' '+(x+w+7)+' '+(y-h)+'L'+(x+w-6)+' '+(y-h-24)+'H'+(x+6)+'Z" fill="'+ROOF+'"/><path d="M'+(x+3)+' '+(y-h-24)+'H'+(x+w-3)+'" stroke="'+ROOF2+'" stroke-width="4" stroke-linecap="round"/>';
  s+='<rect x="'+f1(cx-dw/2)+'" y="'+f1(y-dh)+'" width="'+f1(dw)+'" height="'+f1(dh)+'" fill="'+WOOD+'"/><path d="M'+f1(cx)+' '+f1(y-dh)+'V'+y+'" stroke="#4A2A14" stroke-width="1.6"/>';
  if(o.win)s+='<rect x="'+(x+6)+'" y="'+f1(y-dh*.8)+'" width="'+f1(w*.18)+'" height="'+f1(w*.2)+'" fill="'+o.win+'" stroke="'+WOOD+'" stroke-width="2"/><rect x="'+f1(x+w-6-w*.18)+'" y="'+f1(y-dh*.8)+'" width="'+f1(w*.18)+'" height="'+f1(w*.2)+'" fill="'+o.win+'" stroke="'+WOOD+'" stroke-width="2"/>';
  if(o.lion)s+=lion(cx,y-dh-(o.ls||.6)*30,o.ls||.6,o.lion);
  if(o.bagua)s+=bagua(cx,y-dh-14,1.4);
  if(o.wind)s+=windLion(cx,y-h-24,1.2);
  return s}
// 八卦：八角形，三條長線、斷線
function bagua(x,y,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s)+')"><path d="M0 -10L7 -7L10 0L7 7L0 10L-7 7L-10 0L-7 -7Z" fill="#F4E4B0" stroke="#8A6A30" stroke-width="1.6"/><path d="M-5 -3.5H5M-5 0H-1.2M1.2 0H5M-5 3.5H5" stroke="'+K+'" stroke-width="1.4"/></g>'}
// 人（從旁邊看）：opt.hair 頭髮、opt.hat 帽子、opt.mask 小偷的眼罩、opt.bun 阿嬤的髮髻
function person(x,y,s,c,opt){opt=opt||{};var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1((opt.dir||1)*s)+' '+f1(s)+')">';
  h+='<path d="M-4 0V-14M4 0V-14" stroke="#5A4E48" stroke-width="4" stroke-linecap="round"/>';
  h+='<path d="M-9 -13Q-10 -30 0 -32Q10 -30 9 -13Z" fill="'+c+'"/>';
  h+='<circle cy="-39" r="7.5" fill="#E8B890"/><circle cx="3" cy="-40" r="1.1" fill="#2A2020"/>';

            anim(function(dt){th.x-=dt*200;draw();if(th.x<-30){th=null;k++;draw();if(k>=3){done=true;draw();lvDone(area,i,l,msg,'3 次都守住了，小偷再也不敢來！');return false}wait(round,reduce?100:700);return false}});return false}
          th.y=150;draw();say(msg,'小偷走到<b>'+['左邊','中間','右邊'][R[k]]+'</b>那一家去了！看清楚<b>最後兩個腳印</b>往哪裡，再試一次。',1);
          wait(function(){th=null;at=-1;sh={x:HOME.x,y:HOME.y};busy=false;draw()},reduce?100:1200);return false}}
        else{th.x+=dx/d*sp;th.y+=dy/d*sp}draw()})}
    drag(svg,function(t,p){if(done||busy)return;
      if(t==='down'){if(dist(p,sh)<30){hold=true;at=-1}else say(msg,'按住右上角的<b>獅面盾牌</b>，拖到門口。',1);return}
      if(t==='move'&&hold){sh={x:clamp(p.x,20,300),y:clamp(p.y,30,176)};draw();return}
      if(t==='up'&&hold){hold=false;var b=-1,bd=99;DX.forEach(function(x,n){var d=Math.hypot(sh.x-x,sh.y-124);if(d<bd){bd=d;b=n}});
        if(bd<40){at=b;sh={x:DX[b],y:112};draw();walk()}else{sh={x:HOME.x,y:HOME.y};draw();say(msg,'要放在<b>門口</b>（門的上面一點），小偷才看得到。',1)}}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','晚上的三間房子和腳印，按 Enter 直接守好');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();done=true;k=3;th=null;shown=0;sh={x:HOME.x,y:HOME.y};draw();lvDone(area,i,l,msg,'3 次都守住了，小偷再也不敢來！')}});
    round();
  },

  /* 第 3 關：從左邊或右邊把劍橫著推進獅子的嘴巴 */
  bite:function(area,i,l){
    var H=[{t:'祈福',need:'L',c:LRED,f:'王'},{t:'避邪',need:'R',c:LBLK,f:'卦'},{t:'鎮宅',need:'2',c:LYEL,f:''}],k=0,inn=[],sw=null,hold=false,busy=false,done=false;
    var LX=160,LY=84,S=1.55,MY=LY+14.6*S,HOME={x:160,y:170};
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EDE4D2"><rect x="-400" y="-50" width="1200" height="210" fill="'+WALL+'"/><rect x="-400" y="160" width="1200" height="40" fill="'+LANE+'"/><g id="lb"></g><g id="li"></g><g id="sw"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),lb=svg.querySelector('#lb'),li=svg.querySelector('#li'),swg=svg.querySelector('#sw');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function dir(){return sw.x<LX?1:-1}
    function draw(){var h=H[Math.min(k,2)],w=inn.length===2?'2':(inn[0]||'');
      lb.innerHTML='<g transform="translate(160 20)"><rect x="-86" y="-15" width="172" height="26" rx="13" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.4"/><text y="4" font-size="15" font-weight="700" fill="#6C2024" text-anchor="middle">第 '+(Math.min(k,2)+1)+' 家想要：'+h.t+'</text></g>';
      li.innerHTML=lion(LX,LY,S,{c:h.c,f:h.f,w:w})+(sw&&hold?'':'');
      swg.innerHTML=sw&&!busy?sword(sw.x,sw.y,dir(),70)+(hold?'':'<rect x="'+(sw.x-40)+'" y="'+(sw.y-11)+'" width="80" height="22" rx="11" fill="none" stroke="#DB2E27" stroke-width="1.6" stroke-dasharray="4 3"/>'):'';
      bar.style.width=(done?100:(k+(inn.length&&H[k]&&H[k].need==='2'?.5:0))/3*90)+'%'}
    function newSword(){sw={x:HOME.x,y:HOME.y}}
    newSword();draw();
    function put(side){var h=H[k];hold=false;inn.push(side);sw=null;draw();
      if(h.need==='2'){if(inn.length<2){say(msg,'咬住一把了！再推<b>一把</b>進去。');wait(function(){newSword();draw()},reduce?50:500);return}}
      else if(side!==h.need){say(msg,'劍柄在'+(side==='L'?'左':'右')+'邊，是'+(side==='L'?'祈福':'避邪')+'喔！這家想要<b>'+h.t+'</b>，劍柄要在<b>'+(h.need==='L'?'左':'右')+'邊</b>。',1);
        busy=true;wait(function(){busy=false;inn=[];newSword();draw()},reduce?100:1300);return}
      busy=true;say(msg,'咬好了！這一家的劍獅，可以<b>'+h.t+'</b>。');
      wait(function(){k++;inn=[];busy=false;if(k>=3){done=true;draw();lvDone(area,i,l,msg,'三隻劍獅都咬好劍了！');return}newSword();draw();say(msg,'下一家想要<b>'+H[k].t+'</b>。')},reduce?150:1100)}
    drag(svg,function(t,p){if(done||busy||!sw)return;
      if(t==='down'){if(Math.abs(p.x-sw.x)<44&&Math.abs(p.y-sw.y)<22){hold=true;sw.ox=p.x-sw.x;sw.oy=p.y-sw.y}else say(msg,'按住下面的<b>劍</b>，拖到獅子的左邊或右邊。',1);return}
      if(t==='move'&&hold){sw.x=clamp(p.x-sw.ox,20,300);sw.y=clamp(p.y-sw.oy,30,178);        var ox=Math.abs(sw.x-LX);if(Math.abs(sw.y-MY)<16&&ox>=18&&ox<=46){put(dir()>0?'L':'R');return}draw();return}
      if(t==='up'&&hold){hold=false;if(Math.abs(sw.x-LX)<50&&Math.abs(sw.y-MY)>=16)say(msg,'要對準<b>嘴巴</b>的高度，從旁邊<b>橫著推</b>進去。',1);else if(Math.abs(sw.x-LX)>=60)say(msg,'再往嘴巴推過去一點！',1);draw()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','劍獅和一把劍，按 Enter 照心願咬好一隻');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done&&!busy){e.preventDefault();var h=H[k];inn=h.need==='2'?['L']:[];put(h.need==='2'?'R':h.need)}});
    say(msg,'劍放在左半邊，劍柄就在<b>左邊</b>；放在右半邊，劍柄就在<b>右邊</b>。按住劍，對準嘴巴推進去！');
  },

  /* 第 4 關：照線索一條一條點掉不對的劍獅，找到收信的那一家 */
  post:function(area,i,l){
    var G={c:LBLK,f:'卦',w:'2'},L=[{c:LBLK,f:'王',w:'2'},{c:LBLK,f:'卦',w:'L'},{c:LRED,f:'卦',w:'2'},G],X=[52,124,196,268],C=[['額頭畫的是八卦','f'],['咬著兩把劍','w'],['臉是青黑色的','c']],k=0,out=[],done=false;
    for(var n=L.length-1;n>0;n--){var j=Math.floor(Math.random()*(n+1)),t=L[n];L[n]=L[j];L[j]=t}
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EAF0F2"><rect x="-400" y="50" width="1200" height="120" fill="'+WALL+'"/><path d="M-400 50H720" stroke="'+ROOF+'" stroke-width="8"/>'+
      X.map(function(x){return '<rect x="'+(x-21)+'" y="104" width="42" height="66" fill="'+WOOD+'"/><path d="M'+x+' 104V170" stroke="#4A2A14" stroke-width="1.4"/>'}).join('')+
      '<rect x="-400" y="170" width="1200" height="30" fill="'+LANE+'"/><g id="li"></g><g id="cl"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),li=svg.querySelector('#li'),cl=svg.querySelector('#cl');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){li.innerHTML=L.map(function(o,n){var g=out.indexOf(n)>=0;return '<g opacity="'+(g?.28:1)+'">'+lion(X[n],78,1.02,o)+'</g>'+(g?'<path d="M'+(X[n]-14)+' 66L'+(X[n]+14)+' 94M'+(X[n]+14)+' 66L'+(X[n]-14)+' 94" stroke="#8A7A70" stroke-width="3" stroke-linecap="round"/>':'')+(done&&o===G?'<g transform="translate('+X[n]+' 140)"><rect x="-16" y="-11" width="32" height="22" rx="3" fill="#FFF8EC" stroke="#8A7A70" stroke-width="1.6"/><path d="M-16 -10L0 2L16 -10" stroke="#8A7A70" stroke-width="1.6" fill="none"/></g>':'')}).join('');
      cl.innerHTML=done||k>=C.length?'':'<g transform="translate(160 26)"><rect x="-104" y="-16" width="208" height="28" rx="14" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.4"/><text y="4" font-size="15" font-weight="700" fill="#6C2024" text-anchor="middle">線索 '+(k+1)+'：'+C[k][0]+'</text></g>';
      bar.style.width=(done?100:out.length/3*90)+'%'}
    draw();
    drag(svg,function(t,p){if(done||t!=='down')return;
      var b=-1,bd=99;X.forEach(function(x,n){var d=Math.abs(p.x-x);if(d<bd&&p.y>46&&p.y<176){bd=d;b=n}});
      if(b<0||bd>32){say(msg,'點<b>劍獅</b>（或牠下面的門）。',1);return}
      if(out.indexOf(b)>=0){say(msg,'這一家已經點掉了。',1);return}
      var key=C[k][1];if(L[b][key]===G[key]){say(msg,'這一隻'+(key==='f'?'額頭也是八卦':key==='w'?'也咬著兩把劍':'也是青黑色的')+'，符合線索，不要點掉喔。',1);return}
      out.push(b);k++;
      if(k>=3){done=true;draw();lvDone(area,i,l,msg,'只剩一家了！額頭八卦、咬兩把劍、青黑色的臉，信送到了。');return}
      draw();say(msg,'點掉了！下一條線索：<b>'+C[k][0]+'</b>。')});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','四戶人家門上的劍獅，按 Enter 直接送到');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();out=[0,1,2,3].filter(function(n){return L[n]!==G});k=3;done=true;draw();lvDone(area,i,l,msg,'只剩一家了！額頭八卦、咬兩把劍、青黑色的臉，信送到了。')}});
    say(msg,'第一條線索：<b>'+C[0][0]+'</b>。哪一隻不是？點掉牠。');
  },

  /* 第 5 關：把刀劍屏拖到院子中間，擋住大門直通大廳的線，兩邊留路 */
  screen:function(area,i,l){
    var SW=70,HOME={x:270,y:110},sc0={x:HOME.x,y:HOME.y},hold=false,done=false,man=null,off=null;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E6EEE2"><rect x="-400" y="176" width="1200" height="30" fill="'+LANE+'"/>'+
      '<rect x="20" y="18" width="200" height="160" fill="'+LANE+'" stroke="'+WALL2+'" stroke-width="2"/>'+
      '<rect x="20" y="18" width="40" height="160" fill="'+ROOF+'" stroke="'+ROOF2+'" stroke-width="2"/><rect x="180" y="18" width="40" height="160" fill="'+ROOF+'" stroke="'+ROOF2+'" stroke-width="2"/><rect x="60" y="18" width="120" height="42" fill="'+ROOF+'" stroke="'+ROOF2+'" stroke-width="2"/>'+
      bagua(40,98,1.3)+bagua(200,98,1.3)+'<rect x="106" y="54" width="28" height="8" fill="'+WOOD+'"/><text x="120" y="44" font-size="15" font-weight="700" fill="#FFF8EC" text-anchor="middle">大廳</text>'+
      '<path d="M20 176H106M134 176H220" stroke="'+WALL2+'" stroke-width="5"/><text x="120" y="190" font-size="13" font-weight="700" fill="#6C2024" text-anchor="middle">大門</text>'+
      '<path id="ln" d="M120 172V64" stroke="#DB2E27" stroke-width="3" stroke-dasharray="6 5"/><g id="sc"></g><g id="mn"></g></svg>';
    var sce=setScene(s,1100),svg=sce.querySelector('svg'),g=svg.querySelector('#sc'),mn=svg.querySelector('#mn'),ln=svg.querySelector('#ln');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){g.innerHTML=screenTop(sc0.x,sc0.y,SW)+(sc0.x===HOME.x&&sc0.y===HOME.y?'<text x="'+HOME.x+'" y="'+(HOME.y+28)+'" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle">刀劍屏</text>':'')+(hold||done?'':'<rect x="'+(sc0.x-SW/2-6)+'" y="'+(sc0.y-12)+'" width="'+(SW+12)+'" height="24" rx="12" fill="none" stroke="#DB2E27" stroke-width="1.6" stroke-dasharray="4 3"/>');
      ln.setAttribute('d',(sc0.x-SW/2<120&&sc0.x+SW/2>120&&sc0.y>64&&sc0.y<172)?'M120 172V'+(sc0.y+6):'M120 172V64');
      mn.innerHTML=man?person(man.x,man.y,.62,'#3A5A8A',{hat:true}):'';
      bar.style.width=(done?100:0)+'%'}
    draw();
    function check(){var x=sc0.x,y=sc0.y,inYard=x>56&&x<184&&y>58&&y<176;
      if(!inYard){sc0={x:HOME.x,y:HOME.y};draw();say(msg,'要放進<b>院子</b>裡（大門和大廳中間）。',1);return}
      if(y>156){say(msg,'太靠近大門了，門口會被堵住。往裡面放一點。',1);return}
      if(y<78){say(msg,'太靠近大廳了，大廳的門會出不去。往外面放一點。',1);return}
      if(!(x-SW/2<120&&x+SW/2>120)){say(msg,'紅色虛線還是直直穿過去了，要<b>擋在虛線上</b>。',1);return}
      var gl=(x-SW/2)-60,gr=180-(x+SW/2);
      if(gl<10||gr<10){say(msg,'太靠'+(gl<10?'左':'右')+'邊了！屏風和牆中間要<b>留路</b>，人才能繞過去。',1);return}
      done=true;draw();say(msg,'擋好了！看，人從旁邊繞過去。');
      var P=[{x:120,y:186},{x:120,y:y+22},{x:(gl>=gr?x-SW/2-gl/2:x+SW/2+gr/2),y:y+16},{x:(gl>=gr?x-SW/2-gl/2:x+SW/2+gr/2),y:y-16},{x:120,y:y-22},{x:120,y:76}],j=1;man={x:P[0].x,y:P[0].y};
      anim(function(dt){var q=P[j],dx=q.x-man.x,dy=q.y-man.y,d=Math.hypot(dx,dy),sp=70*dt;if(d<=sp){man.x=q.x;man.y=q.y;j++;if(j>=P.length){draw();lvDone(area,i,l,msg,'刀劍屏擋在中間，大廳不會被外面直直看進來了。');return false}}else{man.x+=dx/d*sp;man.y+=dy/d*sp}draw()})}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){if(Math.abs(p.x-sc0.x)<SW/2+8&&Math.abs(p.y-sc0.y)<22){hold=true;off={x:p.x-sc0.x,y:p.y-sc0.y}}else say(msg,'按住<b>刀劍屏</b>（紅色那塊），拖進院子。',1);return}
      if(t==='move'&&hold){sc0={x:clamp(p.x-off.x,40,300),y:clamp(p.y-off.y,20,180)};draw();return}
      if(t==='up'&&hold){hold=false;draw();check()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','從上面看的海山館和刀劍屏，按 Enter 直接放好');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();sc0={x:120,y:118};draw();check()}});
    say(msg,'右邊紅色的那塊是<b>刀劍屏</b>。按住它，拖進院子裡。');
  },

  /* 第 6 關：點額頭、劍、臉頰換樣子，做出和每一片都有兩個地方不一樣的劍獅門牌 */
  plate:function(area,i,l){
    var FS=['王','卦',''],WS=['L','R','2'],CS=[LRED,LBLK,LYEL],N=[{f:'王',w:'L',c:LRED},{f:'卦',w:'R',c:LBLK},{f:'',w:'2',c:LYEL},{f:'王',w:'2',c:LBLK}],me={f:'王',w:'L',c:LRED},done=false,PX=[52,124,196,268];
    var CX=160,CY=128,S=1.14,FY=CY-2.4-13.5*S,SY=CY-2.4+14.6*S;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#EDE4D2"><rect x="-400" y="-50" width="1200" height="110" fill="'+WALL+'"/><path d="M-400 60H720" stroke="'+WALL2+'" stroke-width="2"/><rect x="-400" y="176" width="1200" height="30" fill="'+LANE+'"/><g id="nb"></g><g id="me"></g>'+
      '<text x="62" y="'+(FY+5)+'" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle">額頭 →</text><text x="258" y="'+(CY-8)+'" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle">← 臉頰</text><text x="240" y="'+(SY+6)+'" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle">← 劍</text></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),nb=svg.querySelector('#nb'),mg=svg.querySelector('#me');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    var bk=el('<button class="big" type="button">燒好<br>掛上</button>').firstChild;fastClick(bk);area.insertBefore(bk,msg);
    function diff(a){return (a.f!==me.f)+(a.w!==me.w)+(a.c!==me.c)}
    function draw(){var bad=N.filter(function(a){return diff(a)<2}).length;
      nb.innerHTML=N.map(function(a,n){return plate(PX[n],32,.64,a,!done&&diff(a)<2)}).join('');
      mg.innerHTML=plate(CX,CY,1.2,me,false);
      bar.style.width=(done?100:(4-bad)/4*90)+'%'}
    draw();
    function cyc(A,v){return A[(A.indexOf(v)+1)%A.length]}
    drag(svg,function(t,p){if(done||t!=='down')return;
      var df=Math.hypot(p.x-CX,p.y-FY),inS=Math.abs(p.y-SY)<12&&Math.abs(p.x-CX)>=20&&Math.abs(p.x-CX)<48,inF=Math.hypot(p.x-CX,p.y-CY)<40;
      if(df<14){me.f=cyc(FS,me.f);say(msg,'額頭換成'+(me.f==='王'?'「王」字':me.f==='卦'?'<b>八卦</b>':'什麼都不畫')+'。')}
      else if(inS){me.w=cyc(WS,me.w);say(msg,me.w==='2'?'咬兩把劍：<b>鎮宅</b>。':'劍柄在'+(me.w==='L'?'左邊：<b>祈福</b>':'右邊：<b>避邪</b>')+'。')}
      else if(inF){me.c=cyc(CS,me.c);say(msg,'臉換成'+(me.c===LRED?'紅色':me.c===LBLK?'青黑色':'土黃色')+'。')}
      else{say(msg,'點<b>你的劍獅</b>的額頭、劍、臉頰，換換樣子。',1);return}
      draw()});
    function fire(){if(done)return;var bad=N.filter(function(a){return diff(a)<2}).length;
      if(bad){say(msg,'還有 <b>'+bad+' 片</b>太像了（紅框的）。和它只差一個地方，再改一改。',1);return}
      done=true;bk.remove();draw();lvDone(area,i,l,msg,'和每一片都不一樣的劍獅門牌，燒好了！')}
    bk.addEventListener('click',fire);
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','劍獅門牌，按 Enter 直接做好');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();me={f:'卦',w:'L',c:LYEL};fire()}});
    say(msg,'你的劍獅現在和上面<b>第 1 片</b>一模一樣（紅框）。點額頭、劍、臉頰換換樣子吧！');
  }
};
</script>
