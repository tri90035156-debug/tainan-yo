<h1>武廟任務・古蹟・中西區祀典武廟</h1>
<p>跟著廟裡的志工伯伯逛<b>祀典武廟</b>：穿過沒有門神的大門走進<b>雙拜殿</b>、用公車量出 66 公尺的<b>紅山牆</b>、翻出「祀典」「武廟」<b>瓦當</b>、餵<b>赤兔馬</b>、讓三百多歲的<b>古梅</b>開花，再擺好<b>太牢</b>。</p>
<p>地點：赤崁樓・武廟（臺南市中西區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>赤崁樓的正對面，有一座拜關公的廟：祀典武廟。它是 1665 年就有的老廟，是國定古蹟。「祀典」的意思是：清朝的官府每年都要來這裡祭拜。跟著廟裡的志工伯伯，從山門一路走到後面的古梅。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・山門：沒有門神的大門</h3><p>一般的廟，大門上會畫門神。祀典武廟的山門不畫門神，而是釘滿了 360 顆門釘。走進去，裡面一進一進的：先是三川門，接著初拜殿、拜殿，最後才到拜關公的正殿。正殿前面有兩個拜殿，叫「雙拜殿」，全臺灣只有這裡有。</p><p>為什麼？關公是誰？ 關公叫關羽，是一千八百多年前三國時代的武將，大家敬佩他講義氣、守信用。他也被當成保佑讀書的「文衡帝君」。</p></li>
<li><h3>第 2 關・紅山牆：66 公尺長的紅牆</h3><p>武廟旁邊有一道朱紅色的山牆，高高低低像波浪，很多人說是全臺灣最美的廟宇山牆。它有多長？大約 66 公尺，平均高 5.5 公尺！</p><p>為什麼？山牆上有什麼可以看？ 山牆上有一個像書畫捲軸的裝飾，叫「懸魚」，意思是「關公讀兵書」。關公很愛讀書喔！</p></li>
<li><h3>第 3 關・瓦當：屋簷上的字</h3><p>屋簷最前面的一片片圓圓的瓦，叫瓦當。武廟的瓦當上，燒著「祀典」和「武廟」的字。這些字告訴大家：這是官府祭拜的武廟。</p><p>為什麼？什麼時候變成「祀典」武廟的？ 1727 年，清朝皇帝下令每年都要來這裡祭拜，從此叫「祀典武廟」。</p></li>
<li><h3>第 4 關・馬使爺廳：給赤兔馬吃草喝水</h3><p>關公騎的馬，是有名的赤兔馬。照顧牠的馬夫，大家尊稱「馬使爺」。一般的廟，把馬使爺放在神桌下面；武廟是官方祭拜的廟，所以馬使爺有自己的廳。廳外放著茅草和一桶清水，給赤兔馬吃。</p><p>為什麼？赤兔馬有多厲害？ 傳說赤兔馬跑得又快又遠，跟著關公到處打仗。大家感謝牠的辛苦，所以也拜牠。</p></li>
<li><h3>第 5 關・古梅：三百多歲的梅樹</h3><p>廟後面的六和堂前，有一棵老梅樹。相傳是三百多年前，明朝的寧靖王親手種的。六和堂還有一個第一名：1897 年這裡開過「臺南共立幼稚園」，是臺灣第一所幼稚園！</p><p>為什麼？什麼是幼稚園？ 就是小朋友上小學以前去的學校。臺灣第一所幼稚園，就開在武廟的六和堂，現在立了一塊石碑紀念。</p></li>
<li><h3>第 6 關・春秋祭典：擺好太牢</h3><p>清朝的時候，官府每年在武廟舉行大祭。春天和秋天的祭典，要用「太牢」：牛、羊、豬三種牲禮各一隻，再加上五種水果。</p><p>為什麼？一年有幾次大祭？ 清朝時，官府一年在武廟辦 3 次大祭：每年 5 月一次，春天、秋天各一次。</p></li>
</ol>

    function fruit(x,y,on){return on?'<g transform="translate('+x+' '+y+')"><ellipse rx="14" ry="4" fill="#F4ECD8" stroke="#BD9558" stroke-width="1"/><circle cx="-5" cy="-5" r="5" fill="#E8A040"/><circle cx="4" cy="-6" r="5" fill="#DB2E27"/></g>':'<ellipse cx="'+x+'" cy="'+y+'" rx="14" ry="5" fill="none" stroke="#F5D060" stroke-width="1.6" stroke-dasharray="3 3"/>'}
    function draw(){sl.innerHTML=SL.map(function(s){return s.on?animal(s.k,s.x,s.y,false):animal(s.k,s.x,s.y,true)+'<text x="'+s.x+'" y="'+(s.y-20)+'" font-size="13" font-weight="700" fill="#8A6A3A" text-anchor="middle">'+NM[s.k]+'</text>'}).join('')+PL.map(function(p){return fruit(p.x,p.y,p.on)}).join('');
      it.innerHTML=IT.map(function(o){return o.on?'':animal(o.k,o.x,o.y,false)}).join('')+(PL.some(function(p){return !p.on})?'<g transform="translate('+BS.x+' '+BS.y+')"><path d="M-22 -6H22L16 10H-16Z" fill="#B8864A" stroke="#7A5A30" stroke-width="1.4"/><circle cx="-8" cy="-8" r="6" fill="#E8A040"/><circle cx="4" cy="-9" r="6" fill="#DB2E27"/><circle cx="14" cy="-6" r="5" fill="#F5D060"/></g>':'')+(hold&&hold.k==='fruit'?'<g transform="translate('+f1(hold.x)+' '+f1(hold.y)+')"><circle cx="-4" cy="0" r="6" fill="#E8A040"/><circle cx="5" cy="-1" r="6" fill="#DB2E27"/></g>':'');
      var n=SL.filter(function(s){return s.on}).length+PL.filter(function(p){return p.on}).length;bar.style.width=(done?100:n/8*90)+'%'}
    draw();
    function check(){if(SL.every(function(s){return s.on})&&PL.every(function(p){return p.on})){done=true;draw();lvDone(area,i,l,msg,'太牢擺好了！')}}
    function drop(o){if(o.k==='fruit'){var best=22,q=null;PL.forEach(function(p){if(p.on)return;var d=dist(o,p);if(d<best){best=d;q=p}});if(q){q.on=true;draw();say(msg,'放好一盤水果！還有 '+PL.filter(function(p){return !p.on}).length+' 盤。');check()}else{draw();say(msg,'把水果放到桌子前面的<b>黃色虛線盤子</b>。',1)}return}
      var best2=30,s=null;SL.forEach(function(q){if(q.on)return;var d=dist(o,q);if(d<best2){best2=d;s=q}});
      if(!s){o.x=o.hx;o.y=o.hy;draw();say(msg,'拖到供桌上<b>虛線的形狀</b>。',1);return}
      if(s.k!==o.k){o.x=o.hx;o.y=o.hy;draw();say(msg,'這是<b>'+NM[s.k]+'</b>的位置，'+NM[o.k]+'要放在寫著「'+NM[o.k]+'」的地方。',1);return}
      s.on=true;o.on=true;draw();say(msg,NM[o.k]+'擺好了！');check()}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){hold=null;IT.forEach(function(o){if(!o.on&&dist(p,o)<26)hold=o});if(hold){off={x:p.x-hold.x,y:p.y-hold.y};return}
        if(PL.some(function(q){return !q.on})&&dist(p,BS)<28){hold={k:'fruit',x:p.x,y:p.y};off={x:0,y:0};draw();return}say(msg,'按住下面的<b>牛、羊、豬</b>，或右下角的<b>水果籃</b>。',1);return}
      if(t==='move'&&hold){hold.x=p.x-off.x;hold.y=p.y-off.y;draw();return}
      if(t==='up'&&hold){var o=hold;hold=null;drop(o)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','供桌和三牲、水果，按 Enter 擺一樣');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var o=IT.filter(function(o){return !o.on})[0];if(o){var s=SL.filter(function(q){return q.k===o.k})[0];o.x=s.x;o.y=s.y;drop(o)}else{var q=PL.filter(function(q){return !q.on})[0];drop({k:'fruit',x:q.x,y:q.y})}}});
    later(function(){if(!SL.some(function(s){return s.on}))say(msg,'按住下面的<b>牛</b>，拖到供桌上寫著「牛」的虛線。')},6000);
  }
};
</script>
