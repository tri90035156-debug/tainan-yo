<h1>椪柑任務・水果・東山椪柑</h1>
<p>跟著<b>東山</b>種椪柑的舅舅：颱風前用<b>竹竿</b>撐住樹枝、拖著太陽看<b>青皮椪柑</b>綠綠的也熟了、斜斜的分級板分<b>大小</b>、翻過來挑出壞的、在水果攤秤<b>一台斤</b>，再把椪柑一瓣一瓣分給大家。</p>
<p>地點：東山（臺南市東山區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>秋天，臺南東邊的東山，山坡上的椪柑長大了。可是很奇怪：皮還是綠綠的！這就是東山有名的青皮椪柑，每年秋天最早上市的橘子之一。跟著在東山種椪柑的舅舅，從颱風前顧果樹，到把椪柑分給家人吃。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・山坡上的椪柑園（10 月初）：颱風要來了</h3><p>10 月初，椪柑快要可以採了，颱風卻要來了！果子長大了很重，樹枝一搖，椪柑就會掉滿地。山坡上的果園沒辦法架防風網，舅舅一大早就上山，用竹竿把彎彎的樹枝撐住。</p><p>為什麼？為什麼颱風一來，椪柑會掉？ 快要採的椪柑長得又大又重，掛在細細的樹枝上。風一吹，樹枝一直搖，果子就被甩下來了。</p></li>
<li><h3>第 2 關・青皮也熟了（10 月）：綠綠的，可以吃嗎？</h3><p>颱風走了，太陽出來了。你看看樹上的椪柑：皮還是綠的，是不是還沒熟？舅舅笑著說：「裡面早就甜了！」南部 10 月還很熱，皮的綠色還沒退，可是果肉已經熟了。</p><p>為什麼？那椪柑的皮，什麼時候會變黃？ 天氣變涼以後，皮的綠色慢慢退掉，就會變成黃中帶綠、再變黃。</p></li>
<li><h3>第 3 關・分大小：大的、中的、小的</h3><p>採下來的椪柑，有大有小。舅舅要把大小差不多的放在一起，賣的時候大家比較好挑。舅舅做了一塊斜斜的分級板，上面有大小不一樣的洞：小洞在前面，大洞在後面。椪柑滾過去，小的會先掉下去。</p><p>為什麼？為什麼大小要分開賣？ 一箱裡面的椪柑大小差不多，看起來整齊，買的人也知道自己買到什麼。</p></li>
<li><h3>第 4 關・裝箱：翻過來看一看</h3><p>要裝箱了！椪柑上面看起來都很漂亮，可是底下可能壓傷了、或是發霉了。一顆壞掉的放在箱子裡，旁邊的也容易跟著壞。</p><p>為什麼？為什麼不能疊很高？ 椪柑的皮比較軟，疊太多層，下面的會被壓傷，壓傷的地方就容易發霉。</p></li>
<li><h3>第 5 關・路邊的水果攤：剛好一台斤</h3><p>山下的路邊有水果攤。有一位阿姨說：「我要買一台斤的椪柑！」一台斤就是 600 公克。秤上的指針要停在綠色的地方，才剛好。</p><p>為什麼？為什麼「椪柑」叫椪柑？ 有一說：椪柑的皮蓬蓬鬆鬆的，好像充了氣、鼓起來一樣，臺語就叫「椪」。</p></li>
<li><h3>第 6 關・舅舅家：大家一起吃</h3><p>回到舅舅家，舅舅剝開一顆椪柑，裡面是一瓣一瓣的果肉。家裡有 4 個人：舅舅、舅媽、表弟和你。好吃的東西，要一起分！</p><p>為什麼？剝下來的椪柑皮，可以做什麼？ 椪柑皮曬乾以後，就是陳皮，可以拿來煮東西。</p></li>
</ol>

    var PL=[{x:52,n:'舅舅'},{x:124,n:'舅媽'},{x:196,n:'表弟'},{x:268,n:'你'}],S=[],held=null,off={x:0,y:0},done=false;
    for(var k=0;k<12;k++){var a=k/12*Math.PI*2-Math.PI/2;S.push({hx:160+Math.cos(a)*40,hy:70+Math.sin(a)*40,r:a*180/Math.PI+90,p:-1})}
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F4EEE6"><rect x="-400" y="172" width="1200" height="80" fill="#D6C2A2"/><circle cx="160" cy="70" r="56" fill="#fff" stroke="#D8C8B0" stroke-width="1.6"/>';
    PL.forEach(function(q){s+='<ellipse cx="'+q.x+'" cy="146" rx="32" ry="14" fill="#fff" stroke="#BD9558" stroke-width="1.6"/><text x="'+q.x+'" y="178" font-size="15" font-weight="700" fill="#5A3E2B" text-anchor="middle">'+q.n+'</text>'});
    s+='<g id="sg"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),sg=svg.querySelector('#sg');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function seg(x,y,r,s){return '<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+f1(r)+') scale('+f1(s)+')"><path d="M0 -12C8 -8 8 8 0 12C-4 7 -4 -7 0 -12Z" fill="#F4A23A" stroke="#C8741E" stroke-width="1"/><path d="M1.5 -7Q3 0 1.5 7" stroke="#FFD08A" stroke-width="1.2" fill="none"/></g>'}
    function layout(){PL.forEach(function(q,j){var m=S.filter(function(o){return o.p===j});m.forEach(function(o,k){o.x=q.x-16+(k%3)*16;o.y=144-Math.floor(k/3)*14;o.rr=90})});S.forEach(function(o){if(o.p<0&&o!==held){o.x=o.hx;o.y=o.hy;o.rr=o.r}})}
    function draw(){sg.innerHTML=S.filter(function(o){return o!==held}).concat(held?[held]:[]).map(function(o){return seg(o.x,o.y,o.rr,o===held?1.6:(o.p<0?1.4:1.1))}).join('')}
    layout();draw();
    function check(){var c=PL.map(function(q,j){return S.filter(function(o){return o.p===j}).length}),m=c.reduce(function(a,b){return a+b},0);bar.style.width=(m/12*100)+'%';
      if(m<12){say(msg,'盤子裡現在是 '+c.join('、')+' 瓣。');return}
      if(c.every(function(v){return v===3})){done=true;say(msg,'每盤 3 瓣，一樣多！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},900)}
      else say(msg,'現在是 '+c.join('、')+' 瓣，<b>不一樣多</b>喔！把多的那盤拖一瓣到少的那盤。',1)}
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){held=null;var bd=20;S.forEach(function(o){var d=Math.hypot(p.x-o.x,p.y-o.y);if(d<bd){bd=d;held=o}});if(held)off={x:p.x-held.x,y:p.y-held.y};else say(msg,'要按住一瓣<b>椪柑</b>。',1);return}
      if(!held)return;
      if(t==='move'){held.x=p.x-off.x;held.y=p.y-off.y;held.rr=90;draw();return}
      if(t==='up'){var o=held;held=null;var to=-1;PL.forEach(function(q,j){if(Math.abs(o.x-q.x)<36&&o.y>118)to=j});o.p=to;layout();draw();check()}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','分椪柑的畫面，按 Enter 平均分好');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();S.forEach(function(o,k){o.p=k%4});layout();draw();check()}});
    later(function(){if(!S.some(function(o){return o.p>=0})&&!done)say(msg,'按住上面的一瓣椪柑，拖到下面一個<b>盤子</b>上再放開。')},7000);
  }
};
