<h1>鼓聲任務・老糖廠・仁德區十鼓文創園區</h1>
<p>跟著來打鼓的表姊逛仁德的<b>十鼓文創園區</b>：一段一段往上看高高的老<b>煙囪</b>、幫<b>五分車</b>掛上載甘蔗的車廂、用時光鏡找出以前裝糖蜜的<b>糖蜜槽</b>、比圈圈找出聲音一樣的<b>鼓</b>、在排成<b>十字</b>的鼓上打鼓接力，再在煙囪裡放一盞<b>天燈</b>。</p>
<p>地點：十鼓（臺南市仁德區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>仁德的十鼓文創園區，以前是一座糖廠。它最早叫車路墘製糖所，1910 年開始做糖，後來改名叫仁德糖廠。2003 年，糖廠不做糖了。後來，打鼓的十鼓擊樂團搬了進來，老倉庫、老煙囪都有了新的樣子。跟著來打鼓的表姊，從老煙囪一路逛到打鼓的地方。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・老煙囪：抬頭看老煙囪</h3><p>一走進園區，就看到一根好高好高的煙囪。以前糖廠做糖的時候，煙就從最上面冒出去。有一說，它是 1938 年蓋的，高 67 公尺，大約二十層樓那麼高。我們站在下面，一段一段往上看！</p><p>為什麼？糖廠不做糖了，為什麼還留著煙囪？ 仁德糖廠 2003 年不做糖了。後來十鼓搬進來，把老煙囪、老倉庫留下來，變成大家可以參觀、聽鼓的園區。看到高高的煙囪，就知道這裡以前是糖廠。</p></li>
<li><h3>第 2 關・鐵軌：幫五分車掛車廂</h3><p>糖廠以前有自己的小火車，大家叫它五分車。它的鐵軌比一般的火車窄，兩條鐵軌中間只有 762 公釐，差不多 76 公分，比一般火車的鐵軌窄很多。五分車最重要的工作，是把田裡的甘蔗載進糖廠。我們回到糖廠時，幫火車頭掛上載甘蔗的車廂！</p><p>為什麼？為什麼叫五分車？ 有一說：五分車兩條鐵軌中間的寬度，差不多是一般火車的一半（十分的一半就是五分），所以叫五分車。名字的由來還有別的說法。</p></li>
<li><h3>第 3 關・糖蜜槽：用時光鏡找糖蜜槽</h3><p>園區裡有三座圓圓的大鐵桶，叫糖蜜槽。糖蜜是做糖的時候剩下來、黑黑黏黏的汁，以前糖廠把它裝在大槽裡。糖廠不做糖以後，有的糖蜜槽變成了休息的地方和咖啡店。旁邊還有老倉庫和水塔。拿起表姊的時光鏡，看看每一棟以前裝什麼！</p><p>為什麼？老房子為什麼要改成新的用途？ 糖廠不做糖以後，倉庫、糖蜜槽都空下來了。十鼓搬進來，把它們改成表演的地方、展館和咖啡店。讓空下來的老房子有新的用途，叫做活化。</p></li>
<li><h3>第 4 關・鼓博館：找出一樣的鼓聲</h3><p>園區裡有一間鼓博館，可以認識各種鼓。做鼓的工廠也在 2007 年搬進園區，在這裡做鼓。表姊說：鼓的聲音有高有低。鼓面大又鬆的鼓，聲音比較低；小又緊的鼓，聲音比較高。</p><p>為什麼？為什麼大鼓的聲音比較低？ 有一說（國小自然課的說法）：打鼓的時候，鼓面會震動。鼓面越大、越鬆，震動得越慢，聲音就越低；鼓面越小、越緊，震動得越快，聲音就越高。</p></li>
<li><h3>第 5 關・表演的地方：十字打鼓接力</h3><p>園區裡有十鼓的鼓樂表演，也有讓大家試試看的擊鼓教室。十鼓擊樂團是 2000 年春天成立的。名字裡的「十」，像兩支交疊的鼓棒。我們把五個鼓排成一個十字，來打鼓接力！</p><p>為什麼？為什麼叫十鼓？ 十鼓的官網說：「十」這個字代表鼓棒交疊，也代表匯集十方（四面八方）的力量，大家團結在一起。</p></li>
<li><h3>第 6 關・煙囪口：在煙囪裡放天燈</h3><p>最後，回到老煙囪。2018 年的新聞說，園區想出一個點子：在煙囪裡放天燈。大家寫好心願，從煙囪口把天燈放進去。天燈不會飛到天上。它在煙囪裡升上去，等熱氣散了，再慢慢降下來。我們也來放一次！</p><p>為什麼？為什麼要在煙囪裡放天燈？ 新聞說，園區想讓老煙囪活起來，所以在煙囪裡放天燈。天燈不會飛走，可以再用。園區的人還說，天燈的熱氣能讓煙囪比較乾燥，煙囪可以用得更久。</p></li>
</ol>

      hits++;hitFx={x:P[k].x,y:P[k].y,t:0};thump(150,.4);lit=-1;gap=.3;win=Math.max(.65,win-.08);
      if(hits>=10){done=true;draw();lvDone(area,i,l,msg,'咚！咚！咚！打中 10 下，十字上的鼓都響過了！');return}
      if(hits===1)say(msg,'咚！打中了！下一個會亮在別的地方。');else if(hits===5)say(msg,'打中 5 下了！鼓要越來越快了喔。');draw()}
    drag(svg,function(t,p){if(t!=='down'||done)return;var b=-1,bd=32;P.forEach(function(q,k){var d=dist(p,q);if(d<bd){bd=d;b=k}});
      if(b<0){say(msg,'點十字上<b>亮起來</b>的那一個鼓。',1);return}hit(b)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','排成十字的五個鼓，鼓亮的時候按 Enter 打鼓');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();if(lit<0)next();hit(lit)}});
    later(function(){if(!done&&!hits)say(msg,'看哪一個鼓變成<b>黃色</b>、發亮，就趕快點它。')},7000);
  },

  /* 第 6 關：點一張心願貼到天燈上，把天燈拖到煙囪口對準中間，再點火：天燈在煙囪裡升上去又慢慢降下來 */
  lantern:function(area,i,l){
    var G=168,DX=214,W=[{t:'平安',y:46},{t:'健康',y:92},{t:'快樂',y:138}],step=0,wish='',L={x:110,y:G-4,s:1.3},HOME={x:110,y:G-4},hold=null,done=false,fly=null;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#DCEAF2"><rect x="-400" y="'+G+'" width="1200" height="40" fill="'+PLAZA+'"/>'+
      // 剖開的煙囪：兩邊的牆、裡面、底下的煙囪口
      '<path d="M170 '+G+'L182 -20H246L258 '+G+'Z" fill="'+CON+'" stroke="'+CON2+'" stroke-width="1.6"/><path d="M186 '+(G-44)+'L194 -20H234L242 '+(G-44)+'Z" fill="#6A5A50"/>'+
      '<path d="M186 '+G+'V'+(G-36)+'Q'+DX+' '+(G-56)+' 242 '+(G-36)+'V'+G+'Z" fill="#4A3A30"/>'+
      '<text x="'+DX+'" y="'+(G+16)+'" font-size="13" font-weight="700" fill="#6C2024" text-anchor="middle">煙囪口</text>'+
      '<text x="'+DX+'" y="44" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">煙囪裡面</text>'+
      '<g id="ui"></g><g id="ln"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),ui=svg.querySelector('#ui'),ln=svg.querySelector('#ln');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function draw(){var u='';
      if(step===0)W.forEach(function(w){u+='<rect x="18" y="'+(w.y-17)+'" width="60" height="34" rx="17" fill="#FFF8EC" stroke="#DB2E27" stroke-width="2"/><text x="48" y="'+(w.y+6)+'" font-size="16" font-weight="900" fill="#DB2E27" text-anchor="middle">'+w.t+'</text>'});
      if(step===1&&!hold)u+='<path d="M'+DX+' '+(G-60)+'V'+G+'" stroke="#FFF8EC" stroke-width="2" stroke-dasharray="4 4"/>';
      if(step===2)u+='<circle cx="80" cy="120" r="26" fill="#DB2E27" stroke="#F3E8D6" stroke-width="4"/><text x="80" y="126" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">點火</text>';
      ui.innerHTML=u;
      ln.innerHTML=lantern(L.x,L.y,L.s,{wish:wish,lit:step>=3})+(step===1&&!hold?'<circle cx="'+f1(L.x)+'" cy="'+f1(L.y-30)+'" r="34" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>':'');
      bar.style.width=(done?100:step/4*90)+'%'}
    draw();
    function pickW(w){wish=w.t;step=1;say(msg,'心願「'+w.t+'」貼好了！現在按住天燈，<b>拖到煙囪口</b>，對準中間放開。');draw()}
    function place(){
      var dx=L.x-DX,nearY=L.y>G-60;
      if(Math.abs(dx)<22&&nearY){L.x=DX;L.y=G-4;step=2;say(msg,'放進煙囪口了，正正的！最後，點左邊的<b>點火</b>。');return}
      if(Math.abs(dx)<58&&nearY){L.x=HOME.x;L.y=HOME.y;say(msg,'卡在煙囪口的<b>邊邊</b>了，天燈飛不上去。拿回來，再對準<b>中間</b>的白色虛線放。',1);return}
      L.x=HOME.x;L.y=HOME.y;say(msg,'要拖到右邊的<b>煙囪口</b>（黑黑的門）裡面。',1)}
    function fire(){step=3;fly={t:0};say(msg,'點火了！天燈裡的空氣變熱，慢慢升上去……');
      anim(function(dt){fly.t+=dt;var t=fly.t;
        if(t<2.2)L.y=G-4-(G-4-58)*(t/2.2);
        else if(t<2.8){if(!fly.top){fly.top=1;say(msg,'升到上面了！等熱氣散了，天燈就會慢慢降下來。')}}
        else if(t<5.3)L.y=58+(G-4-58)*((t-2.8)/2.5);
        else{done=true;step=4;draw();lvDone(area,i,l,msg,'天燈慢慢降下來了。它沒有飛走，還可以再用一次！');return false}
        draw()})}
    drag(svg,function(t,p){if(done||step>=3)return;
      if(step===0){if(t!=='down')return;var b=null,bd=30;W.forEach(function(w){var d=dist(p,{x:48,y:w.y});if(d<bd){bd=d;b=w}});
        if(!b){say(msg,'先點左邊的一張<b>心願</b>。',1);return}pickW(b);return}
      if(step===1){
        if(t==='down'){if(dist(p,{x:L.x,y:L.y-30})<40){hold=1;L.x=p.x;L.y=p.y+18;draw()}else say(msg,'按住<b>天燈</b>（紅色虛線圈圈），拖到煙囪口。',1);return}
        if(t==='move'&&hold){L.x=clamp(p.x,50,272);L.y=clamp(p.y+18,60,G-4);draw();return}
        if(t==='up'&&hold){hold=null;place();draw()}return}
      if(step===2&&t==='down'){if(dist(p,{x:80,y:120})<34)fire();else say(msg,'點左邊紅色的<b>點火</b>。',1)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','天燈和剖開的老煙囪，按 Enter 一步一步放天燈');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();if(step===0)pickW(W[0]);else if(step===1){L.x=DX;L.y=G-4;place();draw()}else if(step===2)fire()}});
    later(function(){if(!done&&step===0)say(msg,'左邊有三張<b>心願</b>：平安、健康、快樂。點一張你最想要的。')},6000);
  }
};
</script>
