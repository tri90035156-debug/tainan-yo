<h1>芝麻開門任務・雜糧・西港胡麻</h1>
<p>跟著<b>西港</b>的阿伯和阿嬤：在<b>白露</b>前後播種、一手抓住一手割<b>胡麻</b>、把三把胡麻靠成三角錐的<b>胡麻架</b>、敲出芝麻、搖篩子篩乾淨，最後在<b>麻油間仔</b>把芝麻變成麻油。</p>
<p>地點：西港（臺南市西港區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>胡麻就是芝麻。全臺灣的胡麻，大約有 7 成種在臺南；西港是種最多的地方之一。小小一粒的芝麻，可以榨成香香的麻油。冬天煮的麻油雞，就是用這種油。跟著西港的阿伯和阿嬤，從播種、割胡麻、曬胡麻，一路做到榨出麻油。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・胡麻田：白露前後播種</h3><p>夏天快過完了，阿伯要在白露前後種胡麻。白露是二十四節氣之一，在每年 9 月 7 日前後。胡麻種下去，大約 90 天就能收成。種太晚的話，天氣變得太冷，胡麻會停止開花，就結不出芝麻了。</p><p>為什麼？為什麼一定要在白露前後種？ 胡麻怕冷。白露前後種，大約 90 天後收成，剛好在天氣變冷以前開花、結莢。種太晚，天氣冷了，胡麻會停止開花。</p></li>
<li><h3>第 2 關・割胡麻：一手抓住，一手割</h3><p>到了 11 月，胡麻的莢變黃、熟了。老品種台南 1 號的莢，一熟就容易裂開，芝麻會掉到田裡。所以大家要用手小心地割，割下來綁成一把一把。</p><p>為什麼？為什麼要用手割？ 老品種台南 1 號的莢，一熟就容易裂開，一碰，芝麻就掉光了。所以要人輕輕抓住、小心割。現在有不容易掉粒的新品種台南 2 號，可以用機器收。</p></li>
<li><h3>第 3 關・胡麻架：三把靠在一起站好</h3><p>割好的胡麻，要在田裡曬乾。阿嬤把幾把胡麻斜斜地靠在一起，綁成一個三角錐，立在田裡。採收的時候，田裡站滿一個一個的三角錐。曬大約兩個星期，莢乾了，就會自己裂開。</p><p>為什麼？為什麼要在田裡曬兩個星期？ 剛割下來的莢還有水分、關得緊緊的。曬乾了，莢會自己裂開，芝麻才敲得出來。</p></li>
<li><h3>第 4 關・敲胡麻：敲一敲，芝麻掉下來</h3><p>曬了兩個星期，莢都裂開了。阿伯拿起一把胡麻，用棍子敲一敲，黑黑的芝麻就從莢裡掉出來。芝麻一粒一粒很小，掉在下面鋪好的布上，才不會不見。</p><p>為什麼？芝麻是黑的還是白的？ 黑的、白的都有。臺灣種的胡麻，大多是黑芝麻。</p></li>
<li><h3>第 5 關・篩芝麻：搖一搖篩子</h3><p>敲下來的芝麻裡，混著碎殼和碎葉子。要用篩網一直搖。小小的芝麻從網子的洞掉下去，碎殼留在上面。篩了又篩，才得到乾乾淨淨的芝麻。</p><p>為什麼？為什麼搖一搖，芝麻就會掉下去？ 芝麻比碎殼、碎葉子小。搖的時候，小小的芝麻從篩網的洞漏下去，大的碎殼過不去，就留在上面。</p></li>
<li><h3>第 6 關・麻油間仔：芝麻變麻油</h3><p>篩好的芝麻，送到西港區農會的榨油工廠，大家叫它麻油間仔。芝麻要經過 6 個步驟：焙炒、散熱、碾碎、蒸熱、成型、榨油，才變成香香的麻油。</p><p>為什麼？為什麼要那麼多芝麻？ 芝麻很小，油藏在小小的芝麻裡。大約 45 萬粒芝麻，才榨得出一瓶 500 毫升的麻油。</p></li>
</ol>

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
// 一直跑的動畫（換關時會自動停）
function anim(fn){var raf=0,last=0,on=true;function step(now){if(!on)return;var dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(fn(dt)===false){on=false;return}raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step);loops.push(function(){on=false;cancelAnimationFrame(raf)});return function(){on=false;cancelAnimationFrame(raf)}}
// 一定要等的時間（later() 在「減少動態效果」時會變成 0，等感應器不能這樣）
function wait(fn,ms){var t=setTimeout(fn,ms);loops.push(function(){clearTimeout(t)})}
// 每一根手指分開記（drag() 一次只管一根）：fn(種類, 這根手指, 全部手指)
function touches(svg,fn){var P={};svg.style.touchAction='none';
  svg.addEventListener('pointerdown',function(e){try{svg.setPointerCapture(e.pointerId)}catch(_){}var p=toSvg(svg,e);p.id=e.pointerId;p.mouse=e.pointerType==='mouse';p.x0=p.x;p.y0=p.y;p.mnx=p.mxx=p.x;P[e.pointerId]=p;fn('down',p,P)});
  svg.addEventListener('pointermove',function(e){var o=P[e.pointerId];if(!o)return;var p=toSvg(svg,e);p.id=o.id;p.mouse=o.mouse;p.x0=o.x0;p.y0=o.y0;p.mnx=Math.min(o.mnx,p.x);p.mxx=Math.max(o.mxx,p.x);P[e.pointerId]=p;fn('move',p,P)});
  ['pointerup','pointercancel'].forEach(function(t){svg.addEventListener(t,function(e){var o=P[e.pointerId];if(!o)return;delete P[e.pointerId];fn('up',o,P)})})}

      opts=[ST[k][2],rest[0],rest[1]];do{opts.sort(function(){return Math.random()-.5})}while(opts.indexOf(ST[k][2])===lastPos);lastPos=opts.indexOf(ST[k][2])}
    function draw(){var h='<path d="M14 70H306" stroke="#8A7A70" stroke-width="4" stroke-linecap="round"/>';
      ST.forEach(function(x,j){var cx=35+j*50,on=j===k&&!done;
        h+='<rect x="'+(cx-21)+'" y="44" width="42" height="24" rx="4" fill="'+(j<k||done?'#E8F0DC':'#FFFDF7')+'" stroke="'+(on?'#DB2E27':'#B8A888')+'" stroke-width="'+(on?2.4:1.2)+'"/><text x="'+cx+'" y="61" font-size="13" font-weight="700" fill="'+(on?'#DB2E27':'#5A4E48')+'" text-anchor="middle">'+x[0]+'</text>'});
      h+='<g transform="translate('+f1(tray)+' 34)"><ellipse rx="14" ry="5" fill="#E8D2A0" stroke="#A88A48" stroke-width="1.2"/><circle cx="-5" cy="-2" r="1.6" fill="'+SEED+'"/><circle cx="1" cy="-3" r="1.6" fill="'+SEED+'"/><circle cx="6" cy="-1" r="1.6" fill="'+SEED+'"/></g>';
      cv.innerHTML=h;
      if(fill>=0){mid.innerHTML=bottle(160,148,1.3,fill);sw.innerHTML='';return}
      mid.innerHTML='<text x="160" y="100" font-size="17" font-weight="900" fill="#2A2020" text-anchor="middle" font-family="Noto Serif TC,Songti TC,serif">第 '+(k+1)+' 站：'+ST[k][0]+'</text><text x="160" y="120" font-size="14" fill="#5A4E48" text-anchor="middle">'+ST[k][1]+'</text>';
      var g='';opts.forEach(function(key,j){var q=SL[j];g+='<g transform="translate('+q.x+' '+q.y+')"><circle r="23" fill="#FFF8EC" stroke="#BD9558" stroke-width="2"/>'+gl(key)+'</g>'});sw.innerHTML=g;
      bar.style.width=(k/6*90)+'%'}
    newOpts();draw();
    function right(){busy=true;var x0=tray,x1=35+(k+1)*50,t=0;
      say(msg,'對了！'+ST[k][0]+'好了。');
      anim(function(dt){t=Math.min(1,t+dt*2.2);tray=k<5?x0+(x1-x0)*t:x0;draw();if(t>=1){k++;
        if(k>=6){fill=0;done=true;draw();say(msg,'6 站都走完了！麻油流出來了……');
          anim(function(dt2){fill=Math.min(1,fill+dt2/1.4);draw();if(fill>=1){bar.style.width='100%';lvDone(area,i,l,msg,'榨出麻油了！');return false}})}
        else{busy=false;newOpts();draw();say(msg,'到了<b>第 '+(k+1)+' 站：'+ST[k][0]+'</b>。這一站要<b>'+ST[k][1]+'</b>，點對開關。')}
        return false}})}
    drag(svg,function(t,p){if(done||busy||t!=='down')return;var best=-1,bd=30;SL.forEach(function(q,j){var dd=dist(p,q);if(dd<bd){bd=dd;best=j}});
      if(best<0){say(msg,'點下面三個圓圓的<b>開關</b>其中一個。',1);return}
      if(opts[best]===ST[k][2])right();
      else{wrong++;say(msg,'這個開關是<b>'+nameOf(opts[best])+'</b>用的。這一站要<b>'+ST[k][1]+'</b>，找一找哪個開關做得到。',1)}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','麻油間仔的輸送帶和三個開關，按 Enter 按對的開關');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done&&!busy){e.preventDefault();right()}});
    say(msg,'<b>第 1 站：焙炒</b>。這一站要<b>把芝麻炒香</b>，點對開關。');
  }
};
