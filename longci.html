<h1>月世界任務・山和大地・龍崎牛埔</h1>
<p>跟著來爬山的阿伯走<b>龍崎</b>：讓雨水在<b>月世界</b>的泥岩沖出雨溝、在溪谷最窄的地方蓋<b>土壩</b>、一上一下編<b>竹藤椅面</b>、把竹子悶成<b>竹炭</b>、拼出「龍崎」的名字，晚上再到<b>空山祭</b>點亮整座山。</p>
<p>地點：龍崎（臺南市龍崎區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>臺南市最東南邊的龍崎，是臺南人口最少的區。這裡的牛埔，有一片灰灰白白、光禿禿的山，山上一條一條的溝，像月亮的表面，大家叫它「月世界」。龍崎也是竹子很多的「采竹之鄉」。跟著來爬山的阿伯，從光禿禿的月世界，一路走到晚上會發光的山。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・月世界：下雨沖出一條條溝</h3><p>牛埔的山是泥岩。泥岩很年輕、黏得不牢，一碰到水就散開，跟著雨水流走。光禿禿的坡，一年會被沖掉大約 6 到 8 公分，是臺灣最容易被沖走的土。雨水沖出一條一條的溝，山就變成「月世界」的樣子。</p><p>為什麼？為什麼月世界的山上沒什麼草？ 泥岩裡有很多鹽分，土很容易散開。每次下雨，坡上的土就被沖走一層。土一直被沖走，草很難長起來，山就光禿禿的。</p></li>
<li><h3>第 2 關・埤仔溝溪：在最窄的地方蓋土壩</h3><p>山上的土一直被沖進溪裡，溪就被泥沙塞住。從 1998 年起，水土保持局在牛埔的埤仔溝溪想辦法。他們在溪谷蓋了好幾座土壩（用土堆成的壩），攔住泥沙，也把水存起來，變成小湖。這種順著大自然來做的方法，叫生態工法。土壩的排水管上面，還蓋了一座涼亭，叫「水中樓台」。</p><p>為什麼？土壩蓋好以後，牛埔變得怎麼樣？ 水和泥沙被攔住，不會一直往下游跑。後來又在光禿禿的坡上種樹、種草，牛埔慢慢變成一片綠洲，引來很多野生動物和植物。</p></li>
<li><h3>第 3 關・竹林：一上一下編椅面</h3><p>離開月世界，路邊都是竹林。龍崎的竹子多，有「采竹之鄉」的美名。以前，龍崎是全臺灣竹藤家具主要的產地：用竹子做椅子的骨架，再把細細的藤條一上一下編起來，變成椅面。</p><p>為什麼？為什麼要一上一下交錯？ 一上一下，直的和橫的會互相卡住，坐上去才不會鬆開。每一排再換過來，整片就編得很牢。</p></li>
<li><h3>第 4 關・竹炭窯：把竹子悶成竹炭</h3><p>崎頂的竹炭故事館裡，有少見的竹炭窯。把竹子放進窯裡燒，可是不能讓火一直燒得很旺。要把進氣口關小，空氣少少的，竹子才不會燒成灰，而是慢慢「悶」成黑黑的竹炭。</p><p>為什麼？竹炭可以做什麼？ 竹炭身上有很多看不見的小洞，可以吸住味道。在竹炭故事館，可以用竹炭做竹炭皂和除臭包。</p></li>
<li><h3>第 5 關・龍船：龍崎這個名字</h3><p>龍崎以前有兩個比較大的聚落：龍船和崎頂。有一說，日本時代把這兩個地名各取第一個字，合起來就變成「龍崎」。</p><p>為什麼？龍船那裡有什麼好看的？ 龍船那一帶的龍船窩，是看日出的地方。2022 年 11 月，龍船里和一部分的牛埔里，被劃進西拉雅國家風景區。</p></li>
<li><h3>第 6 關・虎形山公園：晚上會發光的山</h3><p>到了冬天的晚上，崎頂的虎形山公園會變成一座發光的山，這就是龍崎光節—空山祭。從 2019 年冬天開始，藝術家把作品放在山上的步道、河谷和觀景台，天黑以後一件一件亮起來。一年有 10 萬多人來看。</p><p>為什麼？空山祭要怎麼去？ 展場在山上，不能開車進去。要先把車停在山下的文衡殿停車場，再搭免費的接駁車上山。山上很多陡坡和樓梯，要穿好走的鞋。</p></li>
</ol>

      if(rr!==r){say(msg,'先編<b>紅色虛線框</b>的這一排。',1);return}
      hit(cc)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','竹藤椅面，按 Enter 編一格');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var c=X.findIndex(function(x,cc){return need(r,cc)&&!O[r][cc]});hit(c)}});
    later(function(){if(r===1&&!O[1].some(function(v){return v}))say(msg,'看第一排：藤條在第 1 根竹片<b>上面</b>。第二排就從第 2 根開始壓在上面。')},7000);
  },

  /* 第 4 關：竹炭窯，進氣口先拉開讓窯熱起來，到紅線再推到只剩一點縫悶燒 */
  kiln:function(area,i,l){
    var open=0,heat=0,ph=1,g2=0,prog=0,ash=0,hold=false,done=false,warn='',T0=96,TL=64,SX=262;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E8EEF0"><rect x="-400" y="160" width="1200" height="60" fill="#B89A78"/>'+
      '<path d="M40 162Q40 60 130 56Q220 60 220 162Z" fill="#B88A64" stroke="#8A6040" stroke-width="2"/><rect x="186" y="26" width="16" height="40" fill="#8A6040"/>'+
      '<path d="M72 150Q72 92 130 90Q188 92 188 150Z" fill="#5A3A28"/><g id="bm"></g><g id="fr"></g><g id="sm"></g>'+
      '<rect x="'+(SX-14)+'" y="'+(T0-4)+'" width="28" height="'+(TL+12)+'" rx="4" fill="#6A4A34"/><g id="vt"></g><g id="th"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),bm=svg.querySelector('#bm'),fr=svg.querySelector('#fr'),sm=svg.querySelector('#sm'),vt=svg.querySelector('#vt'),th=svg.querySelector('#th');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function mix(a,b,t){var A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16),f=function(sh){return Math.round(((A>>sh)&255)*(1-t)+((B>>sh)&255)*t)};return 'rgb('+f(16)+','+f(8)+','+f(0)+')'}
    function draw(){var hy=T0+open*TL,col=ash>.5?mix('#2A2622','#B8B4AC',Math.min(1,(ash-.5)*2)):mix('#D8B470','#2A2622',prog);
      bm.innerHTML=[86,100,114,128,142,156,170].map(function(x,k){return '<rect x="'+(x-4)+'" y="'+(100+k%2*4)+'" width="8" height="'+(48-k%2*4)+'" rx="3" fill="'+col+'"/>'}).join('');
      var fl=Math.min(1,.15+open*.9+(ph===1?heat*.3:0));
      fr.innerHTML=heat>0||open>0?'<path d="M108 152Q114 '+f1(140-28*fl)+' 122 146Q130 '+f1(132-34*fl)+' 138 146Q146 '+f1(138-26*fl)+' 152 152Z" fill="#F5A040" opacity="'+f1(.4+.6*fl)+'"/>':'';
      sm.innerHTML=[0,1,2].map(function(k){var y=18-k*12-((Date.now()/40)%12);return '<circle cx="'+f1(194+k*4)+'" cy="'+f1(y)+'" r="'+f1(6+k*2)+'" fill="'+(ph===2&&open<.32?'#C8D4DC':'#8A8A8A')+'" opacity="'+f1(.25+.4*Math.min(1,heat))+'"/>'}).join('');
      vt.innerHTML='<rect x="'+(SX-10)+'" y="'+T0+'" width="20" height="'+f1(hy-T0)+'" fill="#1A1210"/>'+(open>.02?'<rect x="'+(SX-8)+'" y="'+T0+'" width="16" height="'+f1(hy-T0)+'" fill="#F5A040" opacity="'+f1(.3+.5*open)+'"/>':'')+
        (ph===2&&!done?'<rect x="'+(SX-16)+'" y="'+f1(T0+.05*TL)+'" width="32" height="'+f1(.25*TL)+'" fill="none" stroke="#3F6B2E" stroke-width="2" stroke-dasharray="3 2"/><text x="'+(SX-20)+'" y="'+f1(T0+.2*TL)+'" font-size="12" font-weight="700" fill="#3F6B2E" text-anchor="end">一點縫</text>':'')+
        '<rect x="'+(SX-12)+'" y="'+f1(hy)+'" width="24" height="'+f1(T0+TL+4-hy)+'" fill="#9A9A92" stroke="#5A5A54" stroke-width="1.4"/><circle cx="'+SX+'" cy="'+f1(hy)+'" r="11" fill="#DB2E27" stroke="#fff" stroke-width="2"/><path d="M'+(SX-4)+' '+f1(hy-2)+'l4 4l4 -4" stroke="#fff" stroke-width="1.8" fill="none"/>'+
        '<text x="'+SX+'" y="'+(T0-12)+'" font-size="12" font-weight="700" fill="#2A2020" text-anchor="middle">進氣口</text>';
      var th1=40,th2=150,hh=(th2-th1)*Math.min(1,heat);
      th.innerHTML='<rect x="296" y="'+th1+'" width="10" height="'+(th2-th1)+'" rx="5" fill="#fff" stroke="#8A7A70" stroke-width="1.2"/><rect x="296" y="'+f1(th2-hh)+'" width="10" height="'+f1(hh)+'" rx="5" fill="#E2574C"/><path d="M290 '+(th1+8)+'H312" stroke="#DB2E27" stroke-width="2.4"/><text x="301" y="'+(th2+14)+'" font-size="12" font-weight="700" fill="#5A4E48" text-anchor="middle">熱度</text>'+
        (ph===2?'<text x="130" y="178" font-size="13" font-weight="700" fill="#FFF8EC" text-anchor="middle">悶成炭：'+Math.round(prog*100)+'%</text>':'');
      bar.style.width=(done?100:ph===1?heat*40:40+prog*50)+'%'}
    draw();
    function tell(k,t,a){if(warn!==k){warn=k;say(msg,t,a)}}
    anim(function(dt){if(done)return false;
      if(ph===1){heat=clamp(heat+dt*(open*.5-.08),0,1);if(heat>=.93){heat=1;ph=2;tell('hot','夠熱了！現在把進氣口<b>往上推</b>，關到只剩<b>一點縫</b>（綠色虛線框）。')}
        else if(open<.3)tell('cold','窯還冷冷的。把紅色把手<b>往下拉</b>，打開進氣口，讓空氣跑進去。');
        else tell('warm','空氣跑進去，火變旺了，窯慢慢熱起來……')}
      else{
        g2+=dt;
        if(open>.3){if(g2<1.8){draw();return}ash=Math.min(1,ash+dt*.35);prog=Math.max(0,prog-dt*.05);tell('ash','空氣太多，火太旺，竹子快<b>燒成灰</b>了！往上推，關小一點。',1)}
        else if(open<.05){heat=Math.max(.6,heat-dt*.1);tell('out','全部關起來，火會<b>熄掉</b>。留<b>一點點縫</b>。',1)}
        else{ash=Math.max(0,ash-dt*.2);prog=Math.min(1,prog+dt*.24);tell('ok','對了！空氣少少的，竹子慢慢變黑了。保持這樣……');
          if(prog>=1){done=true;draw();lvDone(area,i,l,msg,'竹子悶成竹炭了！');return false}}}
      draw()});
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){var hy=T0+open*TL;if(Math.hypot(p.x-SX,p.y-hy)<26||(Math.abs(p.x-SX)<20&&p.y>T0-10&&p.y<T0+TL+10)){hold=true;open=clamp((p.y-T0)/TL,0,1)}else say(msg,'按住右邊<b>進氣口</b>的紅色把手，上下拖。',1);return}
      if(t==='move'&&hold){open=clamp((p.y-T0)/TL,0,1);return}
      if(t==='up')hold=false});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','竹炭窯和進氣口，按 Enter 燒好竹炭');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();heat=1;ph=2;prog=1;open=.15;done=true;draw();lvDone(area,i,l,msg,'竹子悶成竹炭了！')}});
  },

  /* 第 5 關：兩塊老路牌各點一個字（第一個字），拼出「龍崎」 */
  name:function(area,i,l){
    var B=[{t:'龍船',x:88,y:70,pick:-1},{t:'崎頂',x:232,y:70,pick:-1}],done=false;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#DCEAF0"><rect x="-400" y="160" width="1200" height="60" fill="#C8B890"/>'+
      bamboo(20,162,.7)+bamboo(306,164,.7)+'<g id="bd"></g><g id="nw"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),bd=svg.querySelector('#bd'),nw=svg.querySelector('#nw');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function cx(b,k){return b.x-18+k*36}
    function draw(){
      bd.innerHTML=B.map(function(b){return '<path d="M'+(b.x-30)+' 40V14M'+(b.x+30)+' 40V14" stroke="#8A6A4A" stroke-width="2"/><rect x="'+(b.x-42)+'" y="44" width="84" height="52" rx="4" fill="#C8A878" stroke="#8A6A4A" stroke-width="2"/>'+
        [0,1].map(function(k){var on=b.pick===k;return '<rect x="'+(cx(b,k)-16)+'" y="54" width="32" height="32" rx="4" fill="'+(on?'#FFE9A8':'#E8D8B0')+'" stroke="'+(on?'#DB2E27':'#A8885A')+'" stroke-width="'+(on?2.4:1.2)+'"/><text x="'+cx(b,k)+'" y="78" font-size="22" font-weight="900" fill="#4A2E18" text-anchor="middle" font-family="Noto Serif TC,Songti TC,serif">'+b.t.charAt(k)+'</text>'}).join('')}).join('');
      var a=B[0].pick===0?'龍':'',c=B[1].pick===0?'崎':'';
      nw.innerHTML='<path d="M160 160V136" stroke="#8A6A4A" stroke-width="3"/><rect x="112" y="104" width="96" height="40" rx="5" fill="'+(done?'#FFF3C8':'#F8F0DC')+'" stroke="'+(done?'#DB2E27':'#8A6A4A')+'" stroke-width="2"/>'+
        '<rect x="122" y="110" width="34" height="28" rx="3" fill="none" stroke="#BD9558" stroke-width="1.4" stroke-dasharray="3 2"/><rect x="164" y="110" width="34" height="28" rx="3" fill="none" stroke="#BD9558" stroke-width="1.4" stroke-dasharray="3 2"/>'+
        '<text x="139" y="132" font-size="22" font-weight="900" fill="#6C2024" text-anchor="middle" font-family="Noto Serif TC,Songti TC,serif">'+a+'</text><text x="181" y="132" font-size="22" font-weight="900" fill="#6C2024" text-anchor="middle" font-family="Noto Serif TC,Songti TC,serif">'+c+'</text>';
      bar.style.width=(done?100:((B[0].pick===0)+(B[1].pick===0))/2*90)+'%'}
    draw();
    function pick(b,k){if(done)return;
      if(k!==0){say(msg,'「'+b.t.charAt(k)+'」是第二個字。有一說是取每個地名的<b>第一個字</b>喔。',1);return}
      if(b.pick===0)return;b.pick=0;draw();
      if(B[0].pick===0&&B[1].pick===0){done=true;draw();lvDone(area,i,l,msg,'拼出來了：<b>龍崎</b>！');return}
      say(msg,'「'+b.t.charAt(0)+'」放上新路牌了！再從<b>另一塊</b>路牌點一個字。')}
    drag(svg,function(t,p){if(done||t!=='down')return;
      var best=22,bb=null,kk=-1;B.forEach(function(b){[0,1].forEach(function(k){var d=Math.hypot(p.x-cx(b,k),p.y-70);if(d<best){best=d;bb=b;kk=k}})});
      if(!bb){say(msg,'點上面<b>老路牌</b>上的字。',1);return}
      pick(bb,kk)});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','兩塊老路牌：龍船、崎頂，按 Enter 點一個字');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var b=B.filter(function(b){return b.pick!==0})[0];pick(b,0)}});
    later(function(){if(B[0].pick<0&&B[1].pick<0)say(msg,'點左邊路牌「龍船」的第一個字。')},6000);
  },

  /* 第 6 關：黑黑的山裡，手指按住當手電筒，照到作品就亮起來；找到 5 件 */
  light:function(area,i,l){
    var A=[{x:72,y:76,c:'#FFD040',k:0},{x:150,y:118,c:'#8AD0F0',k:1},{x:238,y:66,c:'#F08AC0',k:2},{x:214,y:142,c:'#A8E070',k:3},{x:104,y:150,c:'#FFA860',k:4}].map(function(a){a.on=false;return a}),fx=-999,fy=-999,done=false,n=0,dark=1;
    function art(a,dim){var c=dim?'#5A6478':a.c,g='<g transform="translate('+a.x+' '+a.y+')">';
      if(a.k===0)g+='<circle r="12" fill="none" stroke="'+c+'" stroke-width="4"/><circle r="4" fill="'+c+'"/>';
      else if(a.k===1)g+='<path d="M0 -14L4 -4L14 0L4 4L0 14L-4 4L-14 0L-4 -4Z" fill="'+c+'"/>';
      else if(a.k===2)g+='<path d="M0 12Q-14 2 -10 -6Q-6 -12 0 -6Q6 -12 10 -6Q14 2 0 12Z" fill="'+c+'"/>';
      else if(a.k===3)g+='<path d="M-12 8Q-6 -10 0 8Q6 -10 12 8" stroke="'+c+'" stroke-width="4" fill="none" stroke-linecap="round"/>';
      else g+='<rect x="-9" y="-12" width="18" height="22" rx="8" fill="'+c+'"/><path d="M0 -12V-18" stroke="'+c+'" stroke-width="2"/>';
      return g+'</g>'}
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#141A2C"><rect x="-400" y="-100" width="1200" height="400" fill="#2A3450"/>'+
      '<path d="M-400 120Q40 60 120 90Q200 40 280 80Q330 70 720 110V300H-400Z" fill="#3A4660"/>'+
      bamboo(40,170,.9,'#4A5A48')+bamboo(186,172,.9,'#4A5A48')+bamboo(276,170,.85,'#4A5A48')+bamboo(126,172,.7,'#4A5A48')+
      '<g id="dm">'+A.map(function(a){return art(a,true)}).join('')+'</g>'+
      '<defs><mask id="lmk"><rect x="-400" y="-100" width="1200" height="400" fill="#fff"/><circle id="hole" cx="-999" cy="-999" r="32" fill="#000"/></mask></defs>'+
      '<rect id="ov" x="-400" y="-100" width="1200" height="400" fill="#080C18" opacity=".93" mask="url(#lmk)"/><rect id="gd" x="-400" y="168" width="1200" height="60" fill="#2E3850"/><g id="lt"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),hole=svg.querySelector('#hole'),ov=svg.querySelector('#ov'),gd=svg.querySelector('#gd'),lt=svg.querySelector('#lt'),lastD=-1;
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function mix(a,b,t){var A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16),f=function(sh){return Math.round(((A>>sh)&255)*(1-t)+((B>>sh)&255)*t)};return 'rgb('+f(16)+','+f(8)+','+f(0)+')'}
    // 圓裡、遊戲圖外面的天空和地面，跟著一起變暗變亮
    function shade(){if(lastD===dark)return;lastD=dark;svg.style.background=mix('#2A3450','#080C18',.93*dark);gd.setAttribute('fill',mix('#2E3850','#080C18',.93*dark));fitStage()}
    function draw(){hole.setAttribute('cx',f1(fx));hole.setAttribute('cy',f1(fy));ov.setAttribute('opacity',f1(.93*dark));shade();
      lt.innerHTML=A.map(function(a){return a.on?'<circle cx="'+a.x+'" cy="'+a.y+'" r="24" fill="'+a.c+'" opacity=".28"/>'+art(a,false):''}).join('');
      bar.style.width=(done?100:n/5*90)+'%'}
    draw();
    function lightUp(a){if(a.on)return;a.on=true;n++;draw();
      if(n>=5){done=true;fx=fy=-999;anim(function(dt){dark=Math.max(.25,dark-dt*.8);draw();if(dark<=.25)return false});lvDone(area,i,l,msg,'5 件作品都亮起來了！');return}
      say(msg,'找到一件，亮起來了！還有 '+(5-n)+' 件。')}
    function shine(p){fx=p.x;fy=p.y;var best=24,hit=null;A.forEach(function(a){if(a.on)return;var d=dist(p,a);if(d<best){best=d;hit=a}});draw();if(hit)lightUp(hit)}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'||t==='move'){shine(p);return}
      if(t==='up'){fx=fy=-999;draw()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','晚上的虎形山，按 Enter 找到一件作品');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();lightUp(A.filter(function(a){return !a.on})[0])}});
    later(function(){if(!n)say(msg,'手指<b>按住不要放</b>，在黑黑的山上慢慢移動，看看照到什麼。')},6000);
  }
};
</script>
