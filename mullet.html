<h1>烏金任務・漁港・冬至烏魚</h1>
<p>跟著<b>將軍區青鯤鯓</b>的阿伯和阿嬤：撕節氣日曆等到<b>冬至</b>烏魚游來、在<b>青山漁港</b>用手指頭比出價、兩根手指托著魚卵去洗、顧好曬<b>烏魚子</b>的一整天，再畫出<b>扇形鹽田</b>、把手機倒過來看<b>倒立水母</b>。</p>
<p>地點：青鯤鯓（臺南市將軍區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>每年冬天，烏魚會從北邊的海，一路游到臺灣西南邊的海裡。將軍區的青鯤鯓就在臺南的海邊。母烏魚肚子裡的魚卵，可以做成金黃色的烏魚子。烏魚子很珍貴，大家叫它烏金。跟著青鯤鯓的阿伯和阿嬤，從冬天的海上，走到漁港、曬烏魚子的地方，最後去看扇形鹽田。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・冬天的海上：一頁一頁撕日曆</h3><p>天氣變冷了，北邊的海水也變冷。烏魚跟著冷冷的海水往南游，要到臺灣西南邊的海裡產卵（生下魚卵）。烏魚在冬至前後最多。冬至是二十四節氣之一，在每年 12 月 22 日前後。</p><p>為什麼？為什麼烏魚冬至前後才來？ 冬天北邊的海水變冷，烏魚跟著大約 19 到 21 度的海水往南游，到臺灣西南的海裡產卵。每年差不多冬至前後 10 天最多。</p></li>
<li><h3>第 2 關・青山漁港：用手指頭出價</h3><p>下午，漁船回到青山漁港，把剛捕到的魚搬上岸，馬上在漁市場拍賣。這裡的人叫它喊魚仔。拍賣就是大家搶著出價，出最高價的人，就能買走這箱魚。拍賣的時候很吵，有些魚市場的買家會用手比暗號出價。</p><p>為什麼？為什麼漁港下午就拍賣？ 漁船捕完魚，下午回到漁港，馬上把最新鮮的魚拍賣掉。魚放越久越不新鮮。</p></li>
<li><h3>第 3 關・做烏魚子：兩根手指托著魚卵</h3><p>阿嬤從母烏的肚子裡，取出一對金黃色的魚卵，要做成烏魚子。公烏肚子裡的叫烏魚膘，也可以吃。魚卵很軟、很容易破。第一步是放進水裡洗，把血管裡的血弄乾淨，叫去血。血沒弄乾淨，烏魚子會變黑。</p><p>為什麼？為什麼烏魚子叫烏金？ 一尾母烏，只有一副魚卵可以做烏魚子。做的時候還要很小心，不能弄破。很少又很難做，所以很珍貴，像金子一樣。</p></li>
<li><h3>第 4 關・曬烏魚子：太陽太大，收進來</h3><p>洗好的魚卵，要抹鹽、用木板壓平，再把鹽洗掉，才拿出來曬太陽。曬烏魚子不能一直曬。做法是：早上曬一下，太陽太大就收進屋裡，在陰涼的地方吹風（叫陰乾），傍晚再拿出來曬。曬 3 到 5 天才好。</p><p>為什麼？為什麼烏魚子不整天曬太陽？ 做烏魚子的方法說，要避開太強的太陽直接照。所以早上和傍晚太陽比較小的時候曬，中午收進屋裡陰乾。</p></li>
<li><h3>第 5 關・扇形鹽田：畫出鹽田的形狀</h3><p>青鯤鯓聚落的北邊，有一片扇形鹽田。它在 1977 年做好，是臺灣最後一座新做的鹽田。一格一格的鹽田，從中間往外排開，從天空看，像一把打開的扇子。後來這裡不再曬鹽了，現在是國家級重要濕地的一部分。</p><p>為什麼？扇形鹽田現在還曬鹽嗎？ 不曬了。臺灣後來不再用海水曬鹽，這裡也停了。現在這裡是國家級重要濕地的一部分，有招潮蟹、彈塗魚和很多小生物。</p></li>
<li><h3>第 6 關・生命之樹：把手機倒過來看</h3><p>鹽田的中間，有一棵用木頭做的生命之樹。旁邊有生態步道，可以看招潮蟹。2023 年，有人在這裡的鹽灘，看到了很少見的倒立水母。牠倒過來躺在淺淺的水底，觸手朝上，像一朵粉紅色的花。</p><p>為什麼？倒立水母為什麼要倒過來躺？ 牠的觸手裡，住著很小很小的共生藻。藻要曬太陽才能長大。倒立水母倒過來躺，觸手朝上，藻就曬得到太陽。</p></li>
</ol>

<script>

/* ---------- 插畫元件 ---------- */
var K='#2A2020',NS='http://www.w3.org/2000/svg';
var SEA='#8EC5E0',SEAD='#6FAED0',SAND='#EEE3C6',ROE='#E0922E',ROED='#A05A18',FISH='#56636C';
function f1(v){return (Math.round(v*10)/10).toString()}
function rnd(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280}}
// 烏魚：灰黑色的背、銀白色的肚子、兩個背鰭（dir=1 頭朝右）
function mullet(x,y,s,dir){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1((dir||1)*s)+' '+f1(s)+')">'+
  '<path d="M-25 0L-36 -8L-33 1L-36 9Z" fill="'+FISH+'"/>'+
  '<path d="M-2 -8.5L2 -15L6 -8.2ZM-16 -6L-13 -11.5L-10 -6.8Z" fill="'+FISH+'"/>'+
  '<path d="M-26 1Q-14 -10 8 -9Q22 -8 28 -1Q22 7 8 8Q-14 10 -26 1Z" fill="#D5DCE0" stroke="#4E5A62" stroke-width="1"/>'+
  '<path d="M-25 0Q-12 -9.4 8 -8.8Q21 -7.6 27.6 -1.6Q12 -3 -25 0Z" fill="'+FISH+'"/>'+
  '<path d="M-18 1.5H16M-16 4H12" stroke="#A8B4BA" stroke-width=".8"/>'+
  '<path d="M10 1L3 5.5L12 4Z" fill="#8A969C"/><circle cx="20.5" cy="-2.2" r="2.4" fill="#fff"/><circle cx="21" cy="-2.2" r="1.3" fill="#2A2020"/>'+
  '<path d="M25.5 1.2L28 .6" stroke="#4E5A62" stroke-width="1" stroke-linecap="round"/></g>'}
// 烏魚子：扁扁長長、金黃色的一對（veins=還有血絲）
function roe(x,y,s,rot,veins,c){return '<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+(rot||0)+') scale('+f1(s)+')">'+
  '<path d="M-23 0Q-21 -10 0 -10Q21 -10 25 0Q21 10 0 10Q-21 10 -23 0Z" fill="'+(c||ROE)+'" stroke="'+ROED+'" stroke-width="1.3"/>'+
  '<path d="M-20 0H22" stroke="'+ROED+'" stroke-width="1" opacity=".55"/><ellipse cx="-4" cy="-5" rx="11" ry="2.2" fill="#fff" opacity=".35"/>'+
  (veins?'<path d="M-18 -4Q-8 -7 4 -5Q12 -4 18 -6M-6 -6L-2 -2M10 -5L14 -1M-16 5Q-4 7 8 5Q14 4 20 6M0 6L4 3" stroke="#B8231C" stroke-width="1.3" fill="none" stroke-linecap="round"/>':'')+'</g>'}
// 漁船
function boat(x,y,s,dir){return '<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1((dir||1)*s)+' '+f1(s)+')">'+
  '<path d="M-30 0H32L24 13H-23Z" fill="#F4F0E6" stroke="#5A6A7A" stroke-width="1.3" stroke-linejoin="round"/><path d="M-28 4H30" stroke="#3E6EA8" stroke-width="3"/>'+
  '<rect x="-8" y="-13" width="18" height="13" fill="#FFF8EC" stroke="#5A6A7A" stroke-width="1.2"/><rect x="-4" y="-10" width="5" height="5" fill="#8EC5E0"/>'+
  '<path d="M-20 0V-24" stroke="#6A5A4A" stroke-width="1.6"/><path d="M-20 -24L-9 -21L-20 -18Z" fill="#DB2E27"/>'+
  '<circle cx="24" cy="6" r="2.6" fill="#fff" stroke="#2A2020" stroke-width=".8"/><circle cx="24.6" cy="6" r="1.2" fill="#2A2020"/></g>'}
// 曬架：一層木板，上面排烏魚子（full=有烏魚子）
function rack(x,y,s,full){var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1(s)+')">'+
  '<path d="M-34 0V-22M34 0V-22" stroke="#8A6A4A" stroke-width="3"/><rect x="-40" y="-26" width="80" height="6" rx="1.5" fill="#C8A070" stroke="#8A6A4A" stroke-width="1"/>';
  if(full)for(var k=0;k<4;k++)h+=roe(-27+k*18,-30,.33,90,false);
  return h+'</g>'}
// 從旁邊看的人：c 衣服顏色；hat 斗笠；kid 小朋友比較矮
function person(x,y,s,c,opt){opt=opt||{};var h='<g transform="translate('+f1(x)+' '+f1(y)+') scale('+f1((opt.dir||1)*s)+' '+f1(s)+')">';
  var H=opt.kid?.78:1;
  h+='<path d="M-4 0V'+f1(-14*H)+'M4 0V'+f1(-14*H)+'" stroke="#5A4E48" stroke-width="4" stroke-linecap="round"/>';
  h+='<path d="M-9 '+f1(-13*H)+'Q-10 '+f1(-30*H)+' 0 '+f1(-32*H)+'Q10 '+f1(-30*H)+' 9 '+f1(-13*H)+'Z" fill="'+c+'"/>';
  if(opt.arm)h+='<path d="M6 '+f1(-26*H)+'L16 '+f1(-34*H)+'" stroke="'+c+'" stroke-width="4" stroke-linecap="round"/><circle cx="17" cy="'+f1(-35*H)+'" r="2.6" fill="#E8B890"/>';
  h+='<circle cy="'+f1(-39*H)+'" r="7.5" fill="#E8B890"/><circle cx="3" cy="'+f1(-40*H)+'" r="1.1" fill="#2A2020"/>';
  if(opt.hat)h+='<path d="M-14 '+f1(-42*H)+'L0 '+f1(-54*H)+'L14 '+f1(-42*H)+'Z" fill="#E6CC88" stroke="#A88A48" stroke-width="1"/>';
  else h+='<path d="M-7 '+f1(-41*H)+'Q-6 '+f1(-48*H)+' 0 '+f1(-47.5*H)+'Q6 '+f1(-48*H)+' 7 '+f1(-41*H)+'" fill="'+(opt.hair||'#3A2E28')+'"/>';
  return h+'</g>'}
// 扇形鹽田（從天空看）：H 是扇柄的中心，R 半徑，a0～a1 角度（度，0 是右邊、-90 是上面）
function fan(Hx,Hy,R,a0,a1,op){var h='',n=7,rad=Math.PI/180;
  function P(a,r){return f1(Hx+Math.cos(a*rad)*r)+' '+f1(Hy+Math.sin(a*rad)*r)}
  for(var k=0;k<n;k++){var b0=a0+(a1-a0)*k/n,b1=a0+(a1-a0)*(k+1)/n;
    [[.28,.55],[.55,.78],[.78,1]].forEach(function(rr,j){
      h+='<path d="M'+P(b0,R*rr[0])+'L'+P(b0,R*rr[1])+'A'+f1(R*rr[1])+' '+f1(R*rr[1])+' 0 0 1 '+P(b1,R*rr[1])+'L'+P(b1,R*rr[0])+'A'+f1(R*rr[0])+' '+f1(R*rr[0])+' 0 0 0 '+P(b0,R*rr[0])+'Z" fill="'+['#9CC8C8','#B6D6CE','#CDE2D6'][(j+k)%3]+'" stroke="#8A7A5A" stroke-width="1.4"/>'})}
  h+='<path d="M'+P(a0,R*.28)+'A'+f1(R*.28)+' '+f1(R*.28)+' 0 0 1 '+P(a1,R*.28)+'L'+f1(Hx)+' '+f1(Hy)+'Z" fill="#D8C8A0" stroke="#8A7A5A" stroke-width="1.4"/>';

/* ---------- 這個遊戲自己用的小工具 ---------- */
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
// 一直跑的動畫（換關時會自動停）
function anim(fn){var raf=0,last=0,on=true;function step(now){if(!on)return;var dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(fn(dt)===false){on=false;return}raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step);loops.push(function(){on=false;cancelAnimationFrame(raf)});return function(){on=false;cancelAnimationFrame(raf)}}
// 一定要等的時間（later() 在「減少動態效果」時會變成 0，記形狀、等感應器不能這樣）
function wait(fn,ms){var t=setTimeout(fn,ms);loops.push(function(){clearTimeout(t)})}
// 同時按在畫面上的手指（多指用；drag() 一次只管一根）
function fingers(svg,fn){var P={};svg.style.touchAction='none';
  function list(){return Object.keys(P).map(function(k){return P[k]})}
  svg.addEventListener('pointerdown',function(e){try{svg.setPointerCapture(e.pointerId)}catch(_){}P[e.pointerId]=toSvg(svg,e);P[e.pointerId].mouse=e.pointerType==='mouse';fn('down',list(),e)});
  svg.addEventListener('pointermove',function(e){if(!P[e.pointerId])return;var q=toSvg(svg,e);q.mouse=P[e.pointerId].mouse;P[e.pointerId]=q;fn('move',list(),e)});
  ['pointerup','pointercancel'].forEach(function(t){svg.addEventListener(t,function(e){if(!P[e.pointerId])return;delete P[e.pointerId];fn('up',list(),e)})});
  return function(){P={}}}

      draw()});
    drag(svg,function(t2,p){if(done)return;
      if(t2==='down'){if(Math.abs(p.x-rx)<52&&p.y>100){hold=true;off=rx-p.x}else say(msg,'按住<b>曬架</b>，左右拖。',1);return}
      if(t2==='move'&&hold){rx=clamp(p.x+off,SH-36,OUT+40);draw();return}
      if(t2==='up'&&hold){hold=false;rx=isOut()?OUT:SH-36;draw()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','曬烏魚子的曬架，按 Enter 把曬架推出去或收進來');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();rx=isOut()?SH-36:OUT;draw()}});
  },

  /* 第 5 關：看一眼扇形鹽田，記住形狀，再從中間的點畫出外框 */
  draw:function(area,i,l){
    var H={x:160,y:170},RR=140,A0=-160,A1=-20,pts=[],hold=false,done=false,phase=0,fails=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#E6DCC0"><rect x="-400" y="176" width="1200" height="60" fill="#E6DCC0"/>'+
      '<path d="M-400 -100H20Q4 80 14 260H-400Z" fill="'+SEA+'"/><g id="fanG"></g><g id="ln"></g>'+
      '<circle cx="'+H.x+'" cy="'+H.y+'" r="6" fill="#DB2E27"/><text x="'+(H.x+10)+'" y="'+(H.y+4)+'" font-size="13" font-weight="700" fill="#6C2024" stroke="#E6DCC0" stroke-width="3" paint-order="stroke">中間</text><g id="lb"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),fg=svg.querySelector('#fanG'),ln=svg.querySelector('#ln'),lb=svg.querySelector('#lb');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function show(ms){phase=0;fg.innerHTML=fan(H.x,H.y,RR,A0,A1);lb.innerHTML='<text x="160" y="18" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#E6DCC0" stroke-width="3" paint-order="stroke">從天空看：記住它的形狀</text>';ln.innerHTML='';
      say(msg,'記住扇形鹽田的<b>形狀</b>……');
      wait(function(){fg.innerHTML=fan(H.x,H.y,RR,A0,A1,.06);lb.innerHTML='';phase=1;say(msg,'不見了！從<b>中間的紅點</b>開始，用手指畫出鹽田的<b>外框</b>。')},ms)}
    function drawLn(){ln.innerHTML=pts.length>1?'<path d="M'+pts.map(function(p){return f1(p.x)+' '+f1(p.y)}).join('L')+'" stroke="#DB2E27" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>':''}
    function judge(){var rad=Math.PI/180,bins=[0,0,0,0,0],nearH=false,side=[0,0];
      pts.forEach(function(p){var dx=p.x-H.x,dy=p.y-H.y,r=Math.hypot(dx,dy),a=Math.atan2(dy,dx)/rad;
        if(r<RR*.32)nearH=true;
        if(r>RR*.62&&r<RR*1.3&&a>A0-12&&a<A1+12){var b=clamp(Math.floor((a-A0)/((A1-A0)/5)),0,4);bins[b]=1}
        if(r>RR*.3&&r<RR*.9){if(a<A0+25&&a>A0-25)side[0]=1;if(a>A1-25&&a<A1+25)side[1]=1}});
      var arc=bins.reduce(function(a,b){return a+b},0);
      return {ok:nearH&&arc>=4&&(side[0]||side[1]),arc:arc,nearH:nearH}}
    show(3200);bar.style.width='10%';
    drag(svg,function(t,p){if(done||phase!==1)return;
      if(t==='down'){hold=true;pts=[p];drawLn();return}
      if(t==='move'&&hold){var q=pts[pts.length-1];if(dist(p,q)>3){pts.push(p);drawLn();bar.style.width=Math.min(80,10+pts.length/2)+'%'}return}
      if(t==='up'&&hold){hold=false;if(pts.length<8){say(msg,'按住不要放開，<b>一筆</b>畫出外框。',1);pts=[];drawLn();return}
        var j=judge();
        if(j.ok){done=true;fg.innerHTML=fan(H.x,H.y,RR,A0,A1,.85);bar.style.width='100%';lvDone(area,i,l,msg,'很像！')}
        else{fails++;say(msg,(!j.nearH?'扇子是從<b>中間的紅點</b>往外打開的，要從紅點畫出去，最後回到紅點。':'外面那條<b>彎彎的邊</b>要畫完整，從左邊彎到右邊。')+(fails>=2?' 再看一次形狀。':''),1);
          if(fails>=2){fails=0;later(function(){show(2600)},1600)}else later(function(){pts=[];drawLn()},1200)}}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','從天空看的扇形鹽田，按 Enter 直接畫好');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();done=true;fg.innerHTML=fan(H.x,H.y,RR,A0,A1,.85);lvDone(area,i,l,msg,'畫好了！')}});
  },

  /* 第 6 關：把手機上下倒過來看倒立水母（不能轉的手機，改用手指繞半圈轉畫面） */
  flip:function(area,i,l){
    var done=false,phase=0,upT=0,got=false,ang=0,hold=false,a0=0,base=0,mode='';
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#DCEFF6"><g id="all">'+
      '<rect x="-400" y="70" width="1200" height="200" fill="#A8D4E4"/><path d="M-400 70H800" stroke="#fff" stroke-width="2"/>'+tree(66,70,1.4)+
      '<rect x="-400" y="160" width="1200" height="80" fill="#E6D8B0"/><path d="M-400 162q20 -4 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0" stroke="#C8B488" stroke-width="2" fill="none"/>'+
      jelly(160,146,1.6)+jelly(250,152,.9)+
      '<g transform="translate(70 168)"><ellipse rx="9" ry="6" fill="#C8463A"/><path d="M-7 -3L-13 -10M7 -3L13 -12" stroke="#C8463A" stroke-width="3" stroke-linecap="round"/><ellipse cx="13" cy="-13" rx="6" ry="4" fill="#E8A040"/></g>'+
      '</g><text id="tip" x="200" y="28" font-size="14" font-weight="700" fill="#6C2024" text-anchor="middle" stroke="#DCEFF6" stroke-width="3" paint-order="stroke">倒立水母躺在淺淺的水底</text></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),all=svg.querySelector('#all'),tip=svg.querySelector('#tip');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    var b=bigBtn(area,'拿起<br>手機');
    var alt=el('<p><button type="button" class="link-btn">手機不能轉？改用手指轉</button></p>').firstChild;area.appendChild(alt);
    alt.querySelector('button').addEventListener('click',function(){useFinger()});
    function onOri(e){if(done||e.beta==null)return;if(!mode){mode='tilt';say(msg,'好！現在把手機<b>上下倒過來</b>拿，看螢幕上的水母。')}
      var down=e.beta<-30;
      if(phase===0&&down){upT=upT||performance.now();if(performance.now()-upT>600){phase=1;bar.style.width='60%';tip.textContent='倒過來看，像一般的水母了';say(msg,'看到了嗎？倒過來看，牠就像一般的<b>水母</b>！現在把手機<b>轉回來</b>。')}}
      else if(phase===0)upT=0;
      if(phase===1&&e.beta>30){finishIt()}}
    function finishIt(){if(done)return;done=true;window.removeEventListener('deviceorientation',onOri);bar.style.width='100%';tip.textContent='倒立水母平常就是倒著躺';all.removeAttribute('transform');lvDone(area,i,l,msg,'轉回來了！')}
    loops.push(function(){window.removeEventListener('deviceorientation',onOri)});
    function start(){b.remove();bar.style.width='20%';
      var go2=function(){window.addEventListener('deviceorientation',onOri);wait(function(){if(!mode&&!done)useFinger(1)},1800)};
      if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
        DeviceOrientationEvent.requestPermission().then(function(r){if(r==='granted')go2();else useFinger(1)}).catch(function(){useFinger(1)})}
      else if(window.DeviceOrientationEvent)go2();else useFinger(1)}
    b.addEventListener('click',start);
    // 備案：手指按住畫面，繞著中間轉半圈
    function useFinger(auto){if(done||mode==='finger')return;mode='finger';if(b.parentNode)b.remove();alt.hidden=true;bar.style.width='20%';
      say(msg,(auto?'這台手機（或電腦）沒辦法用轉的。':'')+'改用手指：按住畫面，<b>繞著中間轉半圈</b>，把畫面倒過來。');into(msg)}
    function setA(){all.setAttribute('transform','rotate('+f1(ang)+' 160 95)')}
    drag(svg,function(t,p){if(done||mode!=='finger')return;var a=Math.atan2(p.y-95,p.x-160)*180/Math.PI;
      if(t==='down'){hold=true;a0=a;base=ang;return}
      if(t==='move'&&hold){var d=a-a0;if(d>180)d-=360;if(d<-180)d+=360;ang=clamp(base+d,-200,200);setA();bar.style.width=f1(20+Math.min(1,Math.abs(ang)/180)*60)+'%';
        if(Math.abs(ang)>=165&&!got){got=true;ang=ang>0?180:-180;setA();hold=false;tip.textContent='倒過來看，像一般的水母了';say(msg,'看到了嗎？倒過來看，牠就像一般的<b>水母</b>！');later(finishIt,1800)}
        return}
      if(t==='up')hold=false});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','水底的倒立水母，按 Enter 直接看');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();finishIt()}});
  }
};
</script>
