<h1>沙灘任務・海岸・南區黃金海岸</h1>
<p>跟著住在<b>灣裡</b>的阿嬤看<b>黃金海岸</b>：讓二仁溪的泥沙把<b>七鯤鯓</b>連成陸地、幫紅龜粿墊上<b>黃槿葉</b>、清走廢五金讓<b>二仁溪</b>變清、走兩次沙灘比出沙灘變短，再放好<b>離岸堤</b>、開卡車<b>養灘</b>。</p>
<p>地點：黃金海岸（臺南市南區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>臺南市南區最南邊，有兩個 300 多年的老聚落：喜樹和灣裡。它們的西邊，就是黃金海岸，是看夕陽最好的地方。可是黃金海岸的沙灘，這幾十年一直變窄。跟著住在灣裡的阿嬤，從很久以前的小島，一路看到今天怎麼把沙灘救回來。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・七鯤鯓：小島變成陸地</h3><p>很久很久以前，台江內海外面，有一串沙洲小島，叫做鯤鯓，從北到南有 7 個。喜樹是第五個（五鯤鯓），灣裡是最南邊的第七個（七鯤鯓）。後來，二仁溪帶來好多泥沙，把七鯤鯓和陸地連起來了。</p><p>為什麼？後來誰住在這裡？ 鄭成功來到臺灣以後，葉、林、杜、蘇、黃這幾個姓的祖先，來到灣裡住下來。到今天，已經是 300 多年的老聚落了。</p></li>
<li><h3>第 2 關・喜樹：墊著葉子的紅龜粿</h3><p>喜樹這個名字是怎麼來的？相傳，以前這裡辦慶典、辦喜事，做紅龜粿的時候，會用粿葉樹的葉子墊在下面。粿葉樹也叫黃槿，喜樹這裡長了很多，所以喜樹也被叫做「粿葉樹的故鄉」。</p><p>為什麼？為什麼要墊葉子？ 紅龜粿黏黏的，放在桌上或蒸籠裡會黏住。墊一片葉子，拿起來就不會破掉。黃槿的葉子又大又圓，剛好拿來墊粿。</p></li>
<li><h3>第 3 關・二仁溪：讓溪水變乾淨</h3><p>二仁溪從灣裡的南邊流進海裡。以前，灣裡堆滿了廢五金（舊電線、舊機器這些金屬垃圾），有人用酸洗、用火燒，冒出各種顏色的煙，天空黑到快看不見太陽，溪水也被汙染了。後來政府和環保團體一起守護二仁溪，廢五金不見了，溪水慢慢變清。</p><p>為什麼？溪水變乾淨，誰回來了？ 二仁溪變乾淨以後，出海口又出現了烏魚苗和鰻苗。小魚回來，表示溪水真的變好了。</p></li>
<li><h3>第 4 關・沙灘：沙灘變短了</h3><p>阿嬤說：「我小時候，從堤防走到海邊玩水，要走好幾分鐘。現在沒幾步就到了。」2019 年的報導說，黃金海岸的海岸線，20 年就往後退了大約 30 公尺。沙灘越來越窄。</p><p>為什麼？沙灘的沙跑去哪裡了？ 里長說，以前沙會跟著東北季風，從北邊的曾文溪那裡被帶過來；後來北邊蓋了防波堤，沙被擋住，過不來了。可是海浪還是一直把沙帶走，沙灘就越來越窄。</p></li>
<li><h3>第 5 關・離岸堤：在海裡擋大浪</h3><p>為了救沙灘，2026 年 7 月開始，要在黃金海岸外面的海裡，蓋 5 座離岸堤。離岸堤是蓋在離岸邊一段距離的海裡、長長的堤。大浪打過來，先撞到離岸堤，力氣就變小了，沙灘比較不會被沖走。</p><p>為什麼？離岸堤為什麼不蓋在沙灘上？ 蓋在海裡，浪還沒到岸邊就先被擋一下，力氣變小。浪小了，沙灘上的沙就不容易被帶走，補上去的沙也比較留得住。</p></li>
<li><h3>第 6 關・養灘：把沙補回來</h3><p>光擋浪還不夠，還要把沙補回來，這叫做養灘。北邊的沙灘沙太多，南邊的沙灘被沖得沙太少。所以工人開卡車，把北邊的沙載到南邊。到 2026 年 7 月，已經補了 15 萬立方公尺的沙。</p><p>為什麼？補上去的沙會不會又被沖走？ 會慢慢移動。補上去的沙，會被波浪和海流慢慢帶到水底下，變成比較穩定的沙灘。所以要一邊擋浪、一邊補沙，還要一直觀察、一直維護。</p></li>
</ol>

/* ---------- 這個遊戲自己用的小工具 ---------- */
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
// 一直跑的動畫（換關時會自動停）
function anim(fn){var raf=0,last=0,on=true;function step(now){if(!on)return;var dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(fn(dt)===false){on=false;return}raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step);loops.push(function(){on=false;cancelAnimationFrame(raf)});return function(){on=false;cancelAnimationFrame(raf)}}
// 一定要等的時間（later() 在「減少動態效果」時會變成 0）
function wait(fn,ms){var t=setTimeout(fn,ms);loops.push(function(){clearTimeout(t)})}

    function wall(x,y,on){return '<rect x="'+f1(x-14)+'" y="'+f1(y-5)+'" width="28" height="10" rx="3" fill="#B8B8B0" stroke="'+(on?'#3F6B2E':'#7A7A74')+'" stroke-width="1.6"/>'}
    function draw(){bc.innerHTML='<rect x="'+BE+'" y="-100" width="40" height="114" fill="'+SAND+'"/><rect x="'+BE+'" y="174" width="40" height="130" fill="'+SAND+'"/>'+W.map(function(w){var bw=8+32*w.beach;return '<rect x="'+f1(BE+40-bw)+'" y="'+(w.y-16)+'" width="'+f1(bw)+'" height="32" fill="'+SAND+'"/>'}).join('');
      wv.innerHTML=W.map(function(w){if(w.x<-10)return '';var small=w.wall&&w.x>w.wall.x;return wave(w.x,w.y,small?.6:1.8)}).join('');
      bwE.innerHTML=BW.map(function(b){return wall(b.x,b.y,b.lane>=0)}).join('')+(hold?'':'')+LN.map(function(y,k){return W[k].wall?'':'<path d="M110 '+y+'H214" stroke="#fff" stroke-width="1.2" stroke-dasharray="3 5" opacity=".7"/>'}).join('');
      ct.innerHTML='<rect x="232" y="4" width="0" height="0"/>';
      bar.style.width=(done?100:n/5*90)+'%'}
    draw();
    anim(function(dt){W.forEach(function(w){w.x+=dt*(w.wall?70:85);if(w.x>=BE+40-8-32*w.beach){if(!(w.wall&&true)&&!done){w.beach=Math.max(0,w.beach-.12);if(!warned){warned=1;say(msg,'大浪打到沙灘，<b>沙被沖走</b>了！快放離岸堤。',1)}}w.x=-30-Math.random()*60}});draw();if(done&&false)return false});
    function place(b,p){var k=-1,best=16;LN.forEach(function(y,j){var d=Math.abs(p.y-y);if(d<best){best=d;k=j}});
      if(k<0||p.x<100||p.x>220){b.x=b.hx;b.y=b.hy;if(b.lane>=0){W[b.lane].wall=null;b.lane=-1;n--}say(msg,'放在<b>海裡</b>、一排浪的路上（白色虛線那裡）。',1);return}
      if(W[k].wall&&W[k].wall!==b){b.x=b.hx;b.y=b.hy;say(msg,'這一排已經有離岸堤了，放到<b>別排</b>。',1);return}
      if(b.lane>=0&&b.lane!==k){W[b.lane].wall=null;n--}
      if(b.lane!==k){n++}b.lane=k;W[k].wall=b;b.x=clamp(p.x,110,214);b.y=LN[k];
      if(n>=5){done=true;draw();lvDone(area,i,l,msg,'5 排浪都被擋住了！');return}
      say(msg,'這一排的浪變小了！還有 '+(5-n)+' 排。')}
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){var k=null,best=20;BW.forEach(function(b){var d=dist(p,b);if(d<best){best=d;k=b}});if(k)hold=k;else say(msg,'按住右邊陸地上灰色的<b>離岸堤</b>。',1);return}
      if(t==='move'&&hold){hold.x=p.x;hold.y=p.y;draw();return}
      if(t==='up'&&hold){var b=hold;hold=null;place(b,p);draw()}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','海浪打向沙灘，按 Enter 放一座離岸堤');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var b=BW.filter(function(b){return b.lane<0})[0],k=W.findIndex(function(w){return !w.wall});place(b,{x:170,y:LN[k]});draw()}});
    later(function(){if(!n)say(msg,'按住右邊一座灰色的<b>離岸堤</b>，拖到海裡一排浪的路上。')},6000);
  },

  /* 第 6 關：卡車拖到北邊沙堆、按住裝沙；拖到南邊缺口、按住倒沙；跑 3 趟 */
  nourish:function(area,i,l){
    var PI={x:196,y:44},NO={x:196,y:146},T={x:262,y:96},load=0,fillN=0,mode=null,t0=0,start=null,done=false,trips=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:linear-gradient(90deg,'+SEA+' 47.2%,'+SAND+' 47.2%,'+SAND+' 68.8%,'+LAND+' 68.8%)"><rect x="-400" y="-100" width="600" height="400" fill="'+SEA+'"/>'+
      '<path d="M150 -10H720V230H150Q170 190 154 150Q140 120 160 96Q172 60 150 -10Z" fill="'+SAND+'"/><rect x="226" y="-10" width="500" height="250" fill="'+LAND+'"/><path d="M244 -10V230" stroke="#F8F2E4" stroke-width="14"/>'+
      '<text x="196" y="14" font-size="12" font-weight="700" fill="#5A4A3A" text-anchor="middle">北邊：沙太多</text><text x="196" y="180" font-size="12" font-weight="700" fill="#5A4A3A" text-anchor="middle">南邊：沙太少</text>'+
      '<g id="pl"></g><g id="no"></g><g id="tk"></g><g id="ct"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),pl=svg.querySelector('#pl'),no=svg.querySelector('#no'),tk=svg.querySelector('#tk'),ct=svg.querySelector('#ct');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function at(q){return dist(T,q)<40}
    function draw(){pl.innerHTML='<path d="M'+(PI.x-36)+' '+(PI.y+14)+'Q'+PI.x+' '+(PI.y-22+trips*4)+' '+(PI.x+36)+' '+(PI.y+14)+'Z" fill="'+SAND2+'" stroke="#B89A5E" stroke-width="1.4"/>';
      var f=(fillN+(mode==='dump'?0:0))/3;
      no.innerHTML='<path d="M154 128Q120 146 154 168Q180 160 204 150Q184 136 154 128Z" fill="'+SEA+'"/><path d="M154 128Q120 146 154 168Q180 160 204 150Q184 136 154 128Z" fill="'+SAND+'" opacity="'+f1(Math.min(1,f))+'"/>'+(done?'':'<circle cx="'+NO.x+'" cy="'+NO.y+'" r="26" fill="none" stroke="#DB2E27" stroke-width="2" stroke-dasharray="4 3"/>');
      tk.innerHTML=truck(T.x,T.y+12,load,1.2)+'<rect x="'+(T.x-24)+'" y="'+(T.y+16)+'" width="48" height="5" rx="2" fill="#fff" opacity=".8"/><rect x="'+(T.x-24)+'" y="'+(T.y+16)+'" width="'+f1(48*load)+'" height="5" rx="2" fill="#B89A5E"/>';
      ct.innerHTML='<rect x="252" y="4" width="62" height="22" rx="11" fill="#FFF8EC" stroke="#BD9558" stroke-width="1.2"/><text x="283" y="20" font-size="13" font-weight="700" fill="#2A2020" text-anchor="middle">'+trips+'／3 趟</text>';
      bar.style.width=(done?100:(trips+(load>0?.4:0))/3*90)+'%'}
    draw();
    anim(function(dt){if(done)return false;
      if(mode==='?'){t0+=dt;if(t0>.18)mode='hold'}
      if(mode==='hold'){
        if(at(PI)){if(load<1){load=Math.min(1,load+dt*.8);if(load>=1)say(msg,'裝滿了！把卡車拖到<b>南邊</b>的缺口。')}}
        else if(at(NO)){if(load>0){load=Math.max(0,load-dt*.8);if(load<=0){trips++;fillN=trips;mode='none';if(trips>=3){done=true;draw();lvDone(area,i,l,msg,'跑了 3 趟，南邊的缺口補滿了！');return false}say(msg,'倒好了！第 '+trips+' 趟。再回北邊裝沙。')}}else say(msg,'車上沒有沙了，先回<b>北邊</b>裝沙。',1)}
        else{say(msg,'要停在<b>沙堆</b>或<b>缺口</b>旁邊，才能裝沙、倒沙。',1);mode='none'}}
      draw()});
    drag(svg,function(t,p){if(done)return;
      if(t==='down'){if(dist(p,T)<34){mode='?';t0=0;start={x:p.x,y:p.y,tx:T.x,ty:T.y}}else{say(msg,'按住<b>卡車</b>拖著走；停好以後，按住卡車不要動，就會裝沙或倒沙。',1);mode=null}return}
      if(t==='move'&&mode&&start){if(mode==='?'&&dist(p,start)>8)mode='drag';if(mode==='drag'){T.x=clamp(start.tx+p.x-start.x,170,300);T.y=clamp(start.ty+p.y-start.y,30,160);draw()}return}
      if(t==='up'){var was=mode;mode=null;start=null;if(was==='drag'){if(at(PI)&&load<1)say(msg,'到沙堆了！現在<b>按住卡車不要動</b>，裝沙。');else if(at(NO)&&load>0)say(msg,'到缺口了！<b>按住卡車不要動</b>，把沙倒下去。')}}});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','北邊的沙堆、南邊的缺口和卡車，按 Enter 跑一趟');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();trips++;fillN=trips;load=0;if(trips>=3){done=true;draw();lvDone(area,i,l,msg,'跑了 3 趟，南邊的缺口補滿了！')}else draw()}});
    later(function(){if(!trips&&!load)say(msg,'按住右邊的<b>卡車</b>，拖到上面北邊的<b>沙堆</b>旁邊。')},6000);
  }
};
</script>
