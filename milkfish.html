<h1>虱目魚任務・養殖漁業・學甲虱目魚</h1>
<p>跟著<b>學甲</b>養虱目魚的叔叔：從下面往上撈<b>魚苗</b>、畫圈圈讓魚去吃<b>藻</b>、兩邊一起拉網子收魚、寒流來時把小魚趕進<b>越冬溝</b>，再到魚攤刮魚鱗、早餐挑出虱目魚的<b>刺</b>。</p>
<p>地點：學甲（臺南市學甲區）。給國小學生玩的手機小遊戲，要開啟 JavaScript 才能玩。</p>
<p>臺南人早餐常吃虱目魚粥。全臺灣的虱目魚，大約一半是臺南養的。學甲的四周，到處都是一格一格的魚塭（養魚的池子）。虱目魚很怕冷，所以每年 8 月到 12 月，要趕在寒流來以前把魚收上岸。跟著學甲養虱目魚的叔叔，從小小的魚苗，到你碗裡的一碗粥。每過一關，就能蓋一個章！</p><h2>關卡</h2><ol>
<li><h3>第 1 關・以前撈魚苗：從下面往上撈</h3><p>虱目魚是從魚苗開始養的。以前沒有辦法自己生魚苗，大家要到海邊和河口，用網子撈天然的魚苗，再放進魚塭裡養。魚苗好小好小，要很小心地撈。</p><p>為什麼？以前為什麼要去海邊撈魚苗？ 以前不知道怎麼讓虱目魚在池子裡生寶寶，只能撈海邊自己長的天然魚苗，要看老天爺給多少。後來科學家研究出人工繁殖，魚苗才不用再靠撈。</p></li>
<li><h3>第 2 關・淺淺的魚塭（夏天）：圈起藻，讓魚去吃</h3><p>臺南沿海傳統的魚塭叫淺坪，水只有大人的膝蓋那麼深。漲潮的時候，打開水門讓海水流進來。夏天太陽很大，魚塭底長出好多藻，這就是虱目魚的食物！</p><p>為什麼？為什麼魚塭要做得淺淺的？ 水淺淺的，太陽照得到魚塭底，藻才長得好；虱目魚就吃這些自己長出來的藻。</p></li>
<li><h3>第 3 關・收虱目魚（秋天）：兩邊一起拉網子</h3><p>秋天，虱目魚長大了，該上岸了！收魚常常在天還沒亮的時候。大家拉著一張長長的網子，從魚塭的一頭慢慢拉到另一頭。網子兩邊要一起拉。拉到岸邊，把大魚挑起來，小魚放回池子裡繼續養。</p><p>為什麼？為什麼要在寒流來以前收魚？ 虱目魚很怕冷。水溫太低，牠會凍昏、凍死。所以漁民大多在深秋以前、寒流來之前，把魚收上岸。</p></li>
<li><h3>第 4 關・越冬溝（寒流來了）：把小魚趕進深溝</h3><p>還沒長大的小魚，要在池子裡過冬。叔叔在魚塭旁邊挖了一條深深的溝，叫越冬溝，北邊還搭了防風棚擋冷風。寒流要來了！要把淺淺地方的魚，趕進深溝裡，再關上水門。</p><p>為什麼？越冬溝為什麼要挖得那麼深？ 淺淺的水一下子就被冷風吹冷了；深一點的水，比較不會一下子變冷。北邊再搭防風棚，擋住冬天的北風。</p></li>
<li><h3>第 5 關・菜市場的魚攤：刮魚鱗</h3><p>臺南的菜市場，有專門賣虱目魚的魚攤。老闆的刀很厲害，可以當場把魚切成魚肚、魚皮、魚背肉，還能把刺去掉。第一步，先把魚鱗刮乾淨。</p><p>為什麼？為什麼要從尾巴往頭刮？ 魚鱗一片一片從頭往尾巴疊。逆著魚鱗刮，刀子才卡得進去，魚鱗才刮得起來。</p></li>
<li><h3>第 6 關・早餐吃虱目魚粥：一根一根挑刺</h3><p>早上，叔叔請你吃一碗虱目魚粥。以前府城人上工以前，就吃這一碗。虱目魚全身大約有 222 根刺！碗裡的魚肚還有幾根細細的刺，要小心挑出來。</p><p>為什麼？虱目魚哪裡都能吃嗎？ 臺南人從頭吃到尾：魚骨熬湯、魚皮煮湯、魚肚乾煎或煮粥、魚背肉打成魚丸，魚頭也能燉。</p></li>
</ol>

      '<g stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".75"><path d="M40 4l10 16M110 2l10 16M180 6l10 16"/></g>'+shed(WX+6,26,66)+
      '<text x="'+(WX+40)+'" y="176" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">深溝</text><text x="110" y="182" font-size="14" font-weight="700" fill="#2E6A80" text-anchor="middle">淺淺的地方，好冷</text>'+
      '<path d="M'+WX+' -100V'+G0+'M'+WX+' '+G1+'V300" stroke="#8A6A3A" stroke-width="5"/><g id="gt"></g><g id="rp"></g><g id="fs"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),gt=svg.querySelector('#gt'),rp=svg.querySelector('#rp'),fsG=svg.querySelector('#fs');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function inn(f){return f.x>WX+6}
    (function loop(now){var dt=Math.min(50,now-last)/1000;last=now;var cnt=0;
      Fs.forEach(function(f){f.a+=dt;
        if(!inn(f)){f.vx+=Math.cos(f.a*1.7)*10*dt;f.vy+=Math.sin(f.a*1.3)*10*dt;f.vy+=((G0+G1)/2-f.y)*.25*dt}else{f.vx+=(WX+44-f.x)*dt*.8;f.vx*=.9}
        f.vx*=Math.exp(-1.2*dt);f.vy*=Math.exp(-1.2*dt);var nx=f.x+f.vx*dt,ny=f.y+f.vy*dt;
        var gate=ny>G0+6&&ny<G1-6&&!shut;
        if((f.x<=WX-6&&nx>WX-6||f.x>=WX+6&&nx<WX+6)&&!gate){f.vx=-f.vx*.6;nx=f.x}
        if(inn(f)&&nx<WX+6)nx=WX+6;
        f.x=Math.max(12,Math.min(308,nx));f.y=Math.max(14,Math.min(170,ny));if(f.y<=14||f.y>=170)f.vy=-f.vy;if(f.x<=12)f.vx=Math.abs(f.vx);
        if(inn(f))cnt++});
      fsG.innerHTML=Fs.map(function(f){var sp=Math.hypot(f.vx,f.vy);return mfish(f.x,f.y,.36,{top:1,rot:sp>3?Math.atan2(f.vy,f.vx)*57.3:0})}).join('');
      rip=rip.filter(function(r){r.t+=dt;return r.t<.6});
      rp.innerHTML=rip.map(function(r){return '<circle cx="'+f1(r.x)+'" cy="'+f1(r.y)+'" r="'+f1(6+r.t*60)+'" fill="none" stroke="#fff" stroke-width="2" opacity="'+f1(1-r.t/.6)+'"/>'}).join('');
      gt.innerHTML=shut?'<path d="M'+WX+' '+G0+'V'+G1+'" stroke="#6E4A2A" stroke-width="7"/>':(ready?'<rect x="'+(WX-10)+'" y="'+G0+'" width="20" height="'+(G1-G0)+'" rx="8" fill="#F2C94C" opacity="'+f1(.5+.4*Math.sin(now/200))+'"/><text x="'+(WX-14)+'" y="'+((G0+G1)/2+5)+'" font-size="14" font-weight="700" fill="#6C2024" text-anchor="end" stroke="#9CC9D8" stroke-width="4" paint-order="stroke">水門</text>':'');
      if(!done&&!shut){bar.style.width=f1(cnt/N*90)+'%';if(cnt>=N&&!ready){ready=true;say(msg,'8 尾都進深溝了！快點<b>水門</b>，把它關起來。')}if(cnt<N&&ready){ready=false}}
      raf=requestAnimationFrame(loop)})(last);
    loops.push(function(){cancelAnimationFrame(raf)});
    function closeGate(){shut=true;done=true;bar.style.width='100%';say(msg,'水門關好了！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},1000)}
    function tap(p){
      if(done)return;
      if(Math.abs(p.x-WX)<22&&p.y>G0-6&&p.y<G1+6){if(ready){closeGate();return}say(msg,'還有魚在外面，先把牠們趕進深溝，再關水門。',1);return}
      rip.push({x:p.x,y:p.y,t:0});
      Fs.forEach(function(f){if(inn(f))return;var dx=f.x-p.x,dy=f.y-p.y,d=Math.hypot(dx,dy)||1;if(d<90){var k=150*(1-d/90);f.vx+=dx/d*k;f.vy+=dy/d*k}});
    }
    svg.style.touchAction='manipulation';
    svg.addEventListener('pointerdown',function(e){e.preventDefault();tap(toSvg(svg,e))});
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','越冬溝的畫面，按 Enter 把魚趕進深溝並關上水門');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();Fs.forEach(function(f){f.x=WX+20+Math.random()*50;f.vx=0});ready=true;closeGate()}});
    later(function(){if(!ready&&!done)say(msg,'在魚的<b>左邊</b>點一下水，魚會往右游開。一直從左邊點，把牠們從<b>水門</b>（右邊牆壁中間的開口）趕進深溝。')},8000);
  },

  /* 第 5 關：從尾巴往頭刮魚鱗 */
  scrape:function(area,i,l){
    var S=[],done=false,last=null,warned=0,parts=[],raf=0,lt=performance.now(),pt=null,held=false,N=0,n=0;
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F3EEE4"><rect x="-400" y="150" width="1200" height="120" fill="#C9A774"/><rect x="24" y="44" width="272" height="112" rx="12" fill="#E8D2A8" stroke="#B88A55" stroke-width="1.4"/>'+mfish(160,98,3.4,{})+'<g id="sc"></g><g id="pt"></g><g id="kn"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),scG=svg.querySelector('#sc'),ptG=svg.querySelector('#pt'),kn=svg.querySelector('#kn');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    for(var x=72;x<=226;x+=9)for(var y=72;y<=124;y+=8){var ex=(x-150)/84,ey=(y-98)/(30-Math.max(0,x-200)*.35);if(ex*ex+ey*ey<1){var e=document.createElementNS(NS,'path');e.setAttribute('d','M'+(x-3)+' '+(y-4)+'A4.4 4.4 0 0 1 '+(x-3)+' '+(y+4));e.setAttribute('stroke','#7F98A8');e.setAttribute('stroke-width','1.1');e.setAttribute('fill','#DDE7EC');scG.appendChild(e);S.push({x:x,y:y,e:e,on:1})}}
    N=S.length;
    (function loop(now){var dt=Math.min(50,now-lt)/1000;lt=now;
      parts=parts.filter(function(p){p.vy+=300*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;return p.y<170});
      ptG.innerHTML=parts.map(function(p){return '<ellipse cx="'+f1(p.x)+'" cy="'+f1(p.y)+'" rx="2.4" ry="1.6" fill="#E6EEF2" stroke="#9AB0BC" stroke-width=".5"/>'}).join('');
      kn.innerHTML=held&&pt?'<g transform="translate('+f1(pt.x)+' '+f1(pt.y)+') rotate(-70)"><rect x="-4" y="-34" width="8" height="26" rx="2" fill="#8A6A3A"/><path d="M-5 -8H5L4 18Q0 24 -4 18Z" fill="#C9D2D8" stroke="#6E777D" stroke-width="1"/></g>':'';
      raf=requestAnimationFrame(loop)})(lt);
    loops.push(function(){cancelAnimationFrame(raf)});
    function check(){bar.style.width=f1(Math.min(1,n/(N*.88))*100)+'%';
      if(!done&&n>=N*.88){done=true;held=false;S.forEach(function(o){if(o.on){o.on=0;o.e.remove()}});bar.style.width='100%';say(msg,'刮乾淨了！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},1000)}}
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){held=true;last=p;pt=p;return}
      if(t==='up'){held=false;last=null;return}
      if(t!=='move'||!last)return;
      var dx=p.x-last.x;pt=p;
      if(dx>1){S.forEach(function(o){if(o.on&&Math.abs(o.x-p.x)<9&&Math.abs(o.y-p.y)<9){o.on=0;o.e.remove();n++;if(Math.random()<.5)parts.push({x:o.x,y:o.y,vx:20+Math.random()*60,vy:-60-Math.random()*40})}});check()}
      else if(dx<-1&&S.some(function(o){return o.on&&Math.abs(o.x-p.x)<9&&Math.abs(o.y-p.y)<9})&&warned<3){warned++;say(msg,'這樣刮不起來！要從<b>尾巴往頭</b>刮，也就是<b>往右</b>刮。',1)}
      last=p;
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','刮魚鱗的畫面，按 Enter 刮掉一排魚鱗');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var c=0;S.forEach(function(o){if(o.on&&c<12){o.on=0;o.e.remove();n++;c++}});check()}});
    later(function(){if(!n&&!done)say(msg,'手指按在魚的<b>尾巴</b>那邊（左邊），一直<b>往右</b>刮到頭，魚鱗就會飛起來。')},8000);
  },

  /* 第 6 關：順著刺的方向，把魚刺拉出來 */
  bone:function(area,i,l){
    var B=[{x:96,y:72,a:200},{x:134,y:58,a:250},{x:188,y:58,a:290},{x:226,y:74,a:330},{x:112,y:120,a:150},{x:210,y:122,a:30}],n=0,N=6,done=false,cur=null,st=null,pt=null,warnT=0,raf=0,fly=[],last=performance.now();
    B.forEach(function(b){b.r=b.a/57.3;b.dx=Math.cos(b.r);b.dy=Math.sin(b.r);b.off=0;b.on=1});
    var s='<svg class="mini" viewBox="0 0 320 190" style="background:#F6EEDF"><rect x="-400" y="150" width="1200" height="120" fill="#C9A774"/>'+
      '<ellipse cx="160" cy="98" rx="124" ry="62" fill="#fff" stroke="#D8CFC0" stroke-width="2"/><ellipse cx="160" cy="98" rx="108" ry="50" fill="#F2E6C8"/>'+
      '<path d="M76 92Q100 50 160 46Q220 50 244 92Q232 132 160 138Q88 132 76 92Z" fill="#F7EFE6" stroke="#B9C8D0" stroke-width="3"/><path d="M90 84Q160 70 230 84" stroke="#E8DDCC" stroke-width="2" fill="none"/>'+
      '<g id="bn"></g><g id="tw"></g></svg>';
    var sc=setScene(s,1100),svg=sc.querySelector('svg'),bn=svg.querySelector('#bn'),tw=svg.querySelector('#tw');
    area.insertAdjacentHTML('beforeend','<div class="bar"><b></b></div>');var bar=area.querySelector('.bar b');
    var msg=document.createElement('p');msg.hidden=true;area.appendChild(msg);
    function boneSvg(b){var tx=b.x+b.dx*b.off,ty=b.y+b.dy*b.off,bx=tx-b.dx*26,by=ty-b.dy*26,ex=tx+b.dx*12,ey=ty+b.dy*12,sx=b.off>0?bx:b.x-b.dx*3,sy=b.off>0?by:b.y-b.dy*3;
      return '<path d="M'+f1(bx)+' '+f1(by)+'L'+f1(b.x)+' '+f1(b.y)+'" stroke="#E2D4BC" stroke-width="2.4" stroke-linecap="round"/><path d="M'+f1(sx)+' '+f1(sy)+'L'+f1(ex)+' '+f1(ey)+'" stroke="#8A7A62" stroke-width="5.4" stroke-linecap="round"/><path d="M'+f1(sx)+' '+f1(sy)+'L'+f1(ex)+' '+f1(ey)+'" stroke="#FFFDF6" stroke-width="3.2" stroke-linecap="round"/>'}
    (function loop(now){var dt=Math.min(50,now-last)/1000;last=now;
      fly=fly.filter(function(o){o.t+=dt/.7;return o.t<1});
      bn.innerHTML=B.filter(function(b){return b.on}).map(boneSvg).join('')+fly.map(function(o){var x=o.x+o.dx*(40+o.t*60),y=o.y+o.dy*(40+o.t*60)-o.t*20;return '<path d="M'+f1(x)+' '+f1(y)+'l'+f1(o.dx*26)+' '+f1(o.dy*26)+'" stroke="#FFFDF6" stroke-width="2.4" opacity="'+f1(1-o.t)+'"/>'}).join('');
      tw.innerHTML=pt?'<g transform="translate('+f1(pt.x)+' '+f1(pt.y)+')"><path d="M0 0L14 -40M0 0L22 -36" stroke="#8A949A" stroke-width="3" stroke-linecap="round"/></g>':'';
      raf=requestAnimationFrame(loop)})(last);
    loops.push(function(){cancelAnimationFrame(raf)});
    function pull(b){b.on=0;fly.push({x:b.x,y:b.y,dx:b.dx,dy:b.dy,t:0});n++;bar.style.width=(n/N*100)+'%';
      if(n>=N){done=true;pt=null;say(msg,'挑好了！');later(function(){say(msg,l.win);quiz(area,l,function(){finish(i)})},1000)}
      else say(msg,'拉出一根刺了！還有 '+(N-n)+' 根。')}
    drag(svg,function(t,p){
      if(done)return;
      if(t==='down'){cur=null;var bd=24;B.forEach(function(b){if(!b.on)return;var d=Math.hypot(p.x-(b.x+b.dx*7),p.y-(b.y+b.dy*7));if(d<bd){bd=d;cur=b}});
        if(cur){st=p;pt=p}else say(msg,'要按在白白的<b>刺</b>露出來的那一頭。',1);return}
      if(!cur)return;
      if(t==='move'){pt=p;var vx=p.x-st.x,vy=p.y-st.y,along=vx*cur.dx+vy*cur.dy,side=Math.abs(-vx*cur.dy+vy*cur.dx);
        if(side>22||along<-14){cur.off=0;cur=null;pt=null;var now=performance.now();if(now-warnT>1500){warnT=now;say(msg,'刺會斷掉！要<b>順著刺的方向</b>，往外直直地拉。',1)}return}
        cur.off=Math.max(0,along);if(along>34){var b=cur;cur=null;pt=null;pull(b)}return}
      if(t==='up'){if(cur){cur.off=0;say(msg,'再拉<b>長一點</b>，刺才會整根出來。',1)}cur=null;pt=null}
    });
    svg.setAttribute('tabindex','0');svg.setAttribute('aria-label','挑魚刺的畫面，按 Enter 拉出一根刺');
    svg.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();var b=B.filter(function(o){return o.on})[0];if(b)pull(b)}});
    later(function(){if(!n&&!done)say(msg,'看到魚肚邊邊白白細細的<b>刺</b>了嗎？按住它，<b>往外</b>順著刺的方向拉。')},8000);
  }
};
</script>
